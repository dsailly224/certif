ontainer images, and Lambda functions for vulnerabilities."}},{"n":15,"d":3,"a":["A"],"fr":{"q":"Un groupe pharmaceutique possède des centaines de milliers de rapports de recherche internes, non étiquetés et riches en terminologie spécialisée. Il veut qu\u0027un modèle de base assimile durablement ce vocabulaire de domaine, avant toute adaptation à une tâche précise. Quelle technique de personnalisation d\u0027Amazon Bedrock convient ?","o":["Le continued pre-training sur le corpus non étiqueté","L\u0027ajout d\u0027exemples few-shot dans chaque prompt","Une Guardrail avec des filtres de mots spécialisés","Le fine-tuning sur des paires prompt-réponse étiquetées"],"e":"Le **continued pre-training** poursuit l\u0027entraînement auto-supervisé du modèle sur de grandes quantités de **texte non étiqueté** du domaine, ce qui l\u0027aide à assimiler vocabulaire et connaissances spécialisés. Le fine-tuning exige des données étiquetées et vise une tâche ou un format ; le few-shot n\u0027influence qu\u0027une requête à la fois ; une Guardrail filtre les contenus, elle n\u0027enseigne rien au modèle."},"en":{"q":"A pharmaceutical group has hundreds of thousands of internal research reports that are unlabeled and rich in specialized terminology. It wants a base model to durably absorb this domain vocabulary before any adaptation to a specific task. Which Amazon Bedrock customization technique is appropriate?","o":["Continued pre-training on the unlabeled corpus","Adding few-shot examples to every prompt","A guardrail with specialized word filters","Fine-tuning on labeled prompt-response pairs"],"e":"**Continued pre-training** extends the model\u0027s self-supervised training on large amounts of **unlabeled** domain **text**, helping it absorb specialized vocabulary and knowledge. Fine-tuning requires labeled data and targets a task or format; few-shot only influences one request at a time; a guardrail filters content and teaches the model nothing."}},{"n":16,"d":2,"a":["D"],"fr":{"q":"Une agence marketing veut générer, à partir d\u0027une description textuelle, de courtes vidéos promotionnelles avec un modèle Amazon Nova sur Amazon Bedrock. Quel modèle choisir ?","o":["Amazon Nova Micro","Amazon Nova Canvas","Amazon Nova Pro","Amazon Nova Reel"],"e":"**Amazon Nova Reel** est le modèle Nova de **génération de vidéos**. Nova Canvas génère et modifie des **images** ; Nova Micro est un modèle **texte seul**, le plus rapide et le moins coûteux ; Nova Pro est un modèle multimodal qui comprend texte, images et vidéos en entrée mais produit du texte, pas de vidéo."},"en":{"q":"A marketing agency wants to generate short promotional videos from a text description using an Amazon Nova model on Amazon Bedrock. Which model should it choose?","o":["Amazon Nova Micro","Amazon Nova Canvas","Amazon Nova Pro","Amazon Nova Reel"],"e":"**Amazon Nova Reel** is the Nova **video generation** model. Nova Canvas generates and edits **images**; Nova Micro is a **text-only** model, the fastest and lowest cost; Nova Pro is a multimodal model that understands text, images, and video as input but outputs text, not video."}},{"n":17,"d":4,"a":["A"],"fr":{"q":"Un assistant RH déployé sur Amazon Bedrock doit continuer à répondre aux demandes, mais masquer automatiquement les adresses e-mail et les numéros de téléphone dans ses réponses plutôt que bloquer toute la réponse. Quelle politique de Guardrails utiliser ?","o":["Un filtre d\u0027informations sensibles (PII) configuré en mode masquage","Une vérification d\u0027ancrage contextuel (contextual grounding)","Un sujet refusé portant sur les coordonnées personnelles","Un filtre de contenu de niveau élevé sur la catégorie insultes"],"e":"Les **filtres d\u0027informations sensibles** détectent des types de **PII** prédéfinis (e-mail, téléphone, etc.) ou des expressions régulières personnalisées, et peuvent les **masquer** ou bloquer la réponse. Un sujet refusé bloquerait toute la conversation sur ce thème ; un filtre de contenu cible les propos nuisibles ; l\u0027ancrage contextuel vérifie que la réponse est fondée sur la source."},"en":{"q":"An HR assistant deployed on Amazon Bedrock must keep answering requests but automatically mask email addresses and phone numbers in its responses rather than block the entire response. Which Guardrails policy should be used?","o":["A sensitive information (PII) filter configured to mask","A contextual grounding check","A denied topic covering personal contact details","A high-strength content filter on the insults category"],"e":"**Sensitive information filters** detect predefined **PII** types (email, phone, and so on) or custom regular expressions, and can **mask** them or block the response. A denied topic would block the entire conversation on that subject; a content filter targets harmful language; contextual grounding checks whether the answer is based on the source."}},{"n":18,"d":5,"a":["A"],"fr":{"q":"Selon la Generative AI Security Scoping Matrix d\u0027AWS, dans quel périmètre (scope) se situe une entreprise qui affine (fine-tuning) un modèle de base d\u0027Amazon Bedrock avec ses propres données pour créer un modèle personnalisé ?","o":["Scope 4 : modèles affinés (fine-tuned)","Scope 3 : modèles pré-entraînés utilisés via une API","Scope 5 : modèles entraînés par l\u0027entreprise elle-même","Scope 1 : application grand public"],"e":"La **Generative AI Security Scoping Matrix** distingue cinq périmètres selon le niveau de contrôle : 1 application grand public, 2 application d\u0027entreprise (SaaS), 3 modèles pré-entraînés utilisés via API, **4 modèles affinés** avec ses données, 5 modèles entraînés from scratch. Affiner un modèle de base relève du **scope 4** : l\u0027entreprise devient responsable de la sécurité de ses données d\u0027entraînement et du modèle personnalisé."},"en":{"q":"According to the AWS Generative AI Security Scoping Matrix, which scope applies to a company that fine-tunes an Amazon Bedrock base model with its own data to create a custom model?","o":["Scope 4: fine-tuned models","Scope 3: pre-trained models used through an API","Scope 5: models trained by the company itself","Scope 1: consumer app"],"e":"The **Generative AI Security Scoping Matrix** defines five scopes based on the level of control: 1 consumer app, 2 enterprise app (SaaS), 3 pre-trained models used through an API, **4 fine-tuned models** with your data, 5 self-trained models. Fine-tuning a base model falls under **scope 4**: the company becomes responsible for securing its training data and the custom model."}},{"n":19,"d":5,"a":["C","D"],"fr":{"q":"Une entreprise utilise Amazon Bedrock depuis un VPC. Elle exige (1) que le trafic vers Bedrock ne transite pas par l\u0027internet public et (2) que les données de ses modèles personnalisés soient chiffrées avec des clés qu\u0027elle contrôle. Quelles solutions répondent à ces exigences ? (Sélectionnez DEUX réponses.)","o":["Un journal AWS CloudTrail activé dans toutes les régions","Un secret AWS Secrets Manager contenant la clé d\u0027API du modèle","Un endpoint VPC d\u0027interface (AWS PrivateLink) pour Amazon Bedrock","Une clé gérée par le client dans AWS Key Management Service (AWS KMS)","Une analyse Amazon Inspector des fonctions qui appellent Bedrock"],"e":"Un **endpoint VPC d\u0027interface (PrivateLink)** permet d\u0027appeler Bedrock depuis le VPC **sans passer par Internet**. Une **clé KMS gérée par le client** permet de chiffrer les modèles personnalisés et les données de personnalisation avec des clés dont l\u0027entreprise contrôle l\u0027usage et la rotation. Secrets Manager stocke des secrets (identifiants, clés d\u0027API) mais ne chiffre pas les modèles ; CloudTrail assure la traçabilité ; Inspector recherche des vulnérabilités."},"en":{"q":"A company uses Amazon Bedrock from a VPC. It requires (1) that traffic to Bedrock does not traverse the public internet and (2) that the data of its custom models is encrypted with keys it controls. Which solutions meet these requirements? (Select TWO.)","o":["An AWS CloudTrail trail enabled in all Regions","An AWS Secrets Manager secret holding the model\u0027s API key","An interface VPC endpoint (AWS PrivateLink) for Amazon Bedrock","A customer managed key in AWS Key Management Service (AWS KMS)","An Amazon Inspector scan of the functions that call Bedrock"],"e":"An **interface VPC endpoint (PrivateLink)** lets you call Bedrock from the VPC **without going over the internet**. A **customer managed KMS key** encrypts custom models and customization data with keys whose use and rotation the company controls. Secrets Manager stores secrets (credentials, API keys) but does not encrypt models; CloudTrail provides traceability; Inspector looks for vulnerabilities."}},{"n":20,"d":1,"a":["D"],"fr":{"q":"Une mutuelle, Assurys, veut un assistant vocal sur sa ligne téléphonique, capable de comprendre la demande de l\u0027appelant (par exemple « changer mon adresse »), de recueillir les informations nécessaires, puis d\u0027appeler une fonction AWS Lambda. Quel service constitue le cœur de cette solution ?","o":["Amazon Comprehend, qui extrait les entités nommées du texte saisi","Amazon Polly, qui génère une voix naturelle à partir de texte ou de SSML","Amazon Translate, qui traduit la demande dans la langue du conseiller","Amazon Lex, qui gère les intentions (intents) et les slots du dialogue"],"e":"**Amazon Lex** construit des interfaces conversationnelles vocales et textuelles : il reconnaît l\u0027**intention** de l\u0027utilisateur, collecte les **slots** nécessaires et peut déclencher une fonction Lambda. Amazon Polly ne fait que la synthèse vocale (texte → parole) : il peut donner une voix à l\u0027assistant mais ne comprend pas la demande. Translate et Comprehend ne gèrent pas de dialogue."},"en":{"q":"A health insurer, Assurys, wants a voice assistant on its phone line that can understand the caller\u0027s request (for example, \u0027change my address\u0027), collect the required information, and then invoke an AWS Lambda function. Which service is the core of this solution?","o":["Amazon Comprehend, which extracts named entities from the input text","Amazon Polly, which generates a natural voice from text or SSML","Amazon Translate, which translates the request into the agent\u0027s language","Amazon Lex, which manages the intents and slots of the dialog"],"e":"**Amazon Lex** builds voice and text conversational interfaces: it recognizes the user\u0027s **intent**, collects the required **slots**, and can trigger a Lambda function. Amazon Polly only performs speech synthesis (text to speech): it can give the assistant a voice but does not understand the request. Translate and Comprehend do not manage a dialog."}},{"n":21,"d":5,"a":["B"],"fr":{"q":"Un auditeur veut savoir quel utilisateur IAM a supprimé une Guardrail Amazon Bedrock la semaine dernière, et depuis quelle adresse IP. Quel service consulter ?","o":["AWS Config","AWS CloudTrail","Amazon Inspector","Les métriques Amazon CloudWatch"],"e":"**AWS CloudTrail** enregistre les **appels d\u0027API** effectués dans le compte : identité de l\u0027appelant, action, date et adresse IP source. Les métriques CloudWatch mesurent des performances (latence, invocations) sans identifier l\u0027appelant ; AWS Config suit l\u0027état et l\u0027historique de configuration des ressources ; Amazon Inspector recherche des vulnérabilités logicielles."},"en":{"q":"An auditor wants to know which IAM user deleted an Amazon Bedrock guardrail last week, and from which IP address. Which service should the auditor consult?","o":["AWS Config","AWS CloudTrail","Amazon Inspector","Amazon CloudWatch metrics"],"e":"**AWS CloudTrail** records the **API calls** made in the account: caller identity, action, time, and source IP address. CloudWatch metrics measure performance (latency, invocations) without identifying the caller; AWS Config tracks resource configuration state and history; Amazon Inspector looks for software vulnerabilities."}},{"n":22,"d":2,"a":["B"],"fr":{"q":"Un juriste veut soumettre en une seule requête un contrat de 400 pages à un modèle pour en obtenir un résumé, mais la requête est rejetée car l\u0027entrée est trop longue. Quelle caractéristique du modèle limite la quantité de texte qu\u0027il peut traiter en une fois ?","o":["La dimension de ses vecteurs d\u0027embedding","La taille de sa fenêtre de contexte","Le nombre maximal de tokens en sortie","La valeur de la température"],"e":"La **fenêtre de contexte** est le nombre maximal de tokens que le modèle peut prendre en compte (prompt et réponse) ; au-delà, il faut un modèle à fenêtre plus large, découper le document ou utiliser du RAG. Le nombre maximal de tokens en sortie limite seulement la réponse ; la dimension des embeddings concerne les représentations vectorielles ; la température règle l\u0027aléa."},"en":{"q":"A lawyer wants to send a 400-page contract to a model in a single request to get a summary, but the request is rejected because the input is too long. Which model characteristic limits how much text it can process at once?","o":["The dimension of its embedding vectors","The size of its context window","The maximum number of output tokens","The temperature value"],"e":"The **context window** is the maximum number of tokens the model can take into account (prompt and response); beyond it, you need a model with a larger window, to split the document, or to use RAG. Max output tokens only limits the response; embedding dimension relates to vector representations; temperature controls randomness."}},{"n":23,"d":2,"a":["D"],"fr":{"q":"Une PME, Lumio, veut intégrer rapidement dans son application la génération de texte avec plusieurs modèles de fondation (Anthropic Claude, Amazon Nova, Meta Llama) via une API unique, sans provisionner ni gérer de serveurs. Quel service répond à ce besoin avec le MOINS d\u0027effort opérationnel ?","o":["Amazon SageMaker Canvas","Amazon EC2 avec des instances GPU et un serveur d\u0027inférence open source","Amazon SageMaker AI avec des endpoints d\u0027inférence gérés par l\u0027équipe","Amazon Bedrock"],"e":"**Amazon Bedrock** est un service **serverless** qui donne accès à de nombreux modèles de fondation via une **API unifiée**, sans infrastructure à gérer. SageMaker AI peut héberger ces modèles mais impose de choisir, dimensionner et surveiller des instances d\u0027endpoint ; EC2 demande encore plus d\u0027effort ; SageMaker Canvas est un outil de ML no-code pour analystes, pas une API d\u0027application."},"en":{"q":"A small company, Lumio, wants to quickly add text generation to its application using several foundation models (Anthropic Claude, Amazon Nova, Meta Llama) through a single API, without provisioning or managing servers. Which service meets these requirements with the LEAST operational overhead?","o":["Amazon SageMaker Canvas","Amazon EC2 with GPU instances and an open source inference server","Amazon SageMaker AI with inference endpoints managed by the team","Amazon Bedrock"],"e":"**Amazon Bedrock** is a **serverless** service that provides access to many foundation models through a **unified API**, with no infrastructure to manage. SageMaker AI can host these models but requires choosing, sizing, and monitoring endpoint instances; EC2 requires even more effort; SageMaker Canvas is a no-code ML tool for analysts, not an application API."}},{"n":24,"d":4,"a":["A","E"],"fr":{"q":"Un forum de jeux vidéo intègre un assistant Amazon Bedrock. L\u0027équipe veut (1) bloquer les messages haineux ou insultants et (2) détecter les utilisateurs qui tentent de contourner les instructions système par des techniques de jailbreak. Quelles politiques de Guardrails répondent à ces deux besoins ? (Sélectionnez DEUX réponses.)","o":["Les filtres de contenu sur les catégories haine et insultes","Les vérifications d\u0027ancrage contextuel","Les filtres d\u0027informations sensibles","Un sujet refusé décrivant les jeux vidéo","Le filtre d\u0027attaque de prompt (prompt attack)"],"e":"Les **filtres de contenu** bloquent les catégories nuisibles (**haine**, **insultes**, sexuel, violence, inconduite) avec un niveau réglable ; le filtre d\u0027**attaque de prompt** détecte les tentatives de **jailbreak** et d\u0027injection de prompt. L\u0027ancrage contextuel vise les hallucinations ; les filtres d\u0027informations sensibles traitent les PII ; un sujet refusé sur les jeux vidéo bloquerait l\u0027usage même du forum."},"en":{"q":"A video game forum integrates an Amazon Bedrock assistant. The team wants to (1) block hateful or insulting messages and (2) detect users who try to bypass the system instructions with jailbreak techniques. Which Guardrails policies meet these two needs? (Select TWO.)","o":["Content filters on the hate and insults categories","Contextual grounding checks","Sensitive information filters","A denied topic describing video games","The prompt attack filter"],"e":"**Content filters** block harmful categories (**hate**, **insults**, sexual, violence, misconduct) with adjustable strength; the **prompt attack** filter detects **jailbreak** and prompt injection attempts. Contextual grounding targets hallucinations; sensitive information filters handle PII; a denied topic on video games would block the forum\u0027s very purpose."}},{"n":25,"d":5,"a":["D","E"],"fr":{"q":"Une équipe MLOps veut clarifier les rôles respectifs d\u0027Amazon SageMaker Model Cards et d\u0027Amazon SageMaker Model Registry. Quelles affirmations sont correctes ? (Sélectionnez DEUX réponses.)","o":["Model Cards déploie automatiquement la dernière version approuvée d\u0027un modèle sur un endpoint de production","Model Cards et Model Registry sont des politiques configurables dans Amazon Bedrock Guardrails","Model Registry calcule les valeurs SHAP des prédictions servies par les endpoints en production","Model Cards documente l\u0027usage prévu, le niveau de risque et les résultats d\u0027évaluation d\u0027un modèle à des fins de gouvernance","Model Registry catalogue les versions de modèles et gère leur statut d\u0027approbation avant le déploiement"],"e":"**SageMaker Model Cards** est un outil de **documentation et de gouvernance** (usage prévu, niveau de risque, détails d\u0027entraînement, évaluations), utile pour les audits. **SageMaker Model Registry** est un **catalogue versionné** qui gère le **statut d\u0027approbation** des modèles et s\u0027intègre aux pipelines CI/CD. Aucun des deux ne déploie seul un modèle ni ne calcule d\u0027explications SHAP, et ils ne font pas partie de Bedrock Guardrails."},"en":{"q":"An MLOps team wants to clarify the respective roles of Amazon SageMaker Model Cards and Amazon SageMaker Model Registry. Which statements are correct? (Select TWO.)","o":["Model Cards automatically deploys the latest approved model version to a production endpoint","Model Cards and Model Registry are configurable policies in Amazon Bedrock Guardrails","Model Registry computes SHAP values for predictions served by production endpoints","Model Cards documents a model\u0027s intended use, risk rating, and evaluation results for governance purposes","Model Registry catalogs model versions and manages their approval status before deployment"],"e":"**SageMaker Model Cards** is a **documentation and governance** tool (intended use, risk rating, training details, evaluations), useful for audits. **SageMaker Model Registry** is a **versioned catalog** that manages model **approval status** and integrates with CI/CD pipelines. Neither deploys a model on its own or computes SHAP explanations, and neither is part of Bedrock Guardrails."}},{"n":26,"d":1,"a":["D"],"fr":{"q":"Un hôpital, CliniVue, soumet à un modèle SageMaker AI des images médicales haute résolution d\u0027environ 600 Mo ; chaque inférence dure jusqu\u0027à 25 minutes. Les requêtes arrivent au fil de l\u0027eau tout au long de la journée et les résultats peuvent être récupérés plus tard. Quelle option d\u0027inférence convient le mieux ?","o":["SageMaker Batch Transform","Un endpoint d\u0027inférence en temps réel","SageMaker Serverless Inference","SageMaker Asynchronous Inference"],"e":"**Asynchronous Inference** place les requêtes dans une file et accepte des **payloads jusqu\u0027à 1 Go** avec des **traitements jusqu\u0027à environ une heure**, les résultats étant déposés dans Amazon S3 ; l\u0027endpoint peut même descendre à zéro instance. Serverless et temps réel imposent de petits payloads et des délais de réponse courts ; Batch Transform traite des jeux de données complets hors ligne, pas des requêtes individuelles arrivant au fil de l\u0027eau."},"en":{"q":"A hospital, CliniVue, sends high-resolution medical images of about 600 MB to a SageMaker AI model; each inference takes up to 25 minutes. Requests arrive continuously throughout the day and results can be retrieved later. Which inference option is the MOST suitable?","o":["SageMaker Batch Transform","A real-time inference endpoint","SageMaker Serverless Inference","SageMaker Asynchronous Inference"],"e":"**Asynchronous Inference** queues requests and accepts **payloads up to 1 GB** with **processing times up to about one hour**, writing results to Amazon S3; the endpoint can even scale down to zero instances. Serverless and real-time endpoints require small payloads and short response times; Batch Transform processes complete datasets offline, not individual requests arriving continuously."}},{"n":27,"d":1,"a":["C"],"fr":{"q":"Une entreprise de BTP, Batimex, installe des caméras sur ses chantiers. Elle veut vérifier automatiquement, à partir des images, si les ouvriers portent un casque et des gants de protection. Quel service est le plus adapté ?","o":["Amazon Textract","Amazon Comprehend","Amazon Rekognition","Amazon Bedrock Knowledge Bases"],"e":"**Amazon Rekognition** propose une fonction de **détection d\u0027équipements de protection individuelle (EPI)** qui identifie casques, gants et masques sur les personnes présentes dans une image. Amazon Textract est spécialisé dans les documents (texte, formulaires, tableaux), pas dans l\u0027analyse de scènes ; Amazon Comprehend traite du texte ; Bedrock Knowledge Bases sert à mettre en œuvre du RAG."},"en":{"q":"A construction company, Batimex, installs cameras on its building sites. It wants to automatically check from the images whether workers are wearing a hard hat and protective gloves. Which service is the MOST suitable?","o":["Amazon Textract","Amazon Comprehend","Amazon Rekognition","Amazon Bedrock Knowledge Bases"],"e":"**Amazon Rekognition** offers **personal protective equipment (PPE) detection**, which identifies hard hats, gloves, and face covers on people in an image. Amazon Textract specializes in documents (text, forms, tables), not scene analysis; Amazon Comprehend processes text; Bedrock Knowledge Bases is used to implement RAG."}},{"n":28,"d":3,"a":["B"],"fr":{"q":"Une équipe de développement veut un environnement agentique qui transforme une demande en langage naturel en spécifications structurées (exigences, conception, liste de tâches), puis génère le code et les tests correspondants. Quel outil AWS répond à ce besoin ?","o":["Strands Agents","Kiro","AWS Transform","Amazon Bedrock AgentCore"],"e":"**Kiro** est l\u0027IDE (et la CLI) agentique d\u0027AWS axé sur le **développement piloté par les spécifications** : prompt → exigences, conception et tâches → code et tests. Strands Agents est un SDK pour construire ses propres agents ; AgentCore héberge et opère des agents en production ; AWS Transform utilise l\u0027IA agentique pour la migration et la modernisation (mainframe, VMware, .NET, Java)."},"en":{"q":"A development team wants an agentic environment that turns a natural language request into structured specifications (requirements, design, task list) and then generates the corresponding code and tests. Which AWS tool meets this need?","o":["Strands Agents","Kiro","AWS Transform","Amazon Bedrock AgentCore"],"e":"**Kiro** is the AWS agentic IDE (and CLI) focused on **spec-driven development**: prompt → requirements, design, and tasks → code and tests. Strands Agents is an SDK for building your own agents; AgentCore hosts and operates agents in production; AWS Transform uses agentic AI for migration and modernization (mainframe, VMware, .NET, Java)."}},{"n":29,"d":1,"a":["B","E"],"fr":{"q":"Un data scientist constate que son modèle atteint 99 % d\u0027exactitude sur les données d\u0027entraînement, mais seulement 71 % sur les données de validation. Quelles actions sont appropriées pour corriger ce problème ? (Sélectionnez DEUX réponses.)","o":["Évaluer le modèle uniquement sur le jeu d\u0027entraînement","Ajouter davantage de données d\u0027entraînement plus variées","Ajouter des couches pour rendre le modèle plus complexe","Augmenter fortement le nombre d\u0027époques d\u0027entraînement","Appliquer une régularisation ou un arrêt anticipé (early stopping)"],"e":"Un tel écart entre entraînement et validation signale un **surapprentissage (overfitting)** : le modèle mémorise les données au lieu de généraliser (variance élevée). Les remèdes incluent **plus de données**, la **régularisation**, l\u0027early stopping ou un modèle plus simple. Ajouter des époques ou des couches aggrave le surapprentissage (ces actions conviendraient plutôt à un sous-apprentissage, où le modèle est mauvais même en entraînement) ; ignorer la validation masque le problème."},"en":{"q":"A data scientist notices that a model reaches 99% accuracy on the training data but only 71% on the validation data. Which actions are appropriate to fix this problem? (Select TWO.)","o":["Evaluate the model on the training set only","Add more, and more varied, training data","Add layers to make the model more complex","Significantly increase the number of training epochs","Apply regularization or early stopping"],"e":"Such a gap between training and validation indicates **overfitting**: the model memorizes the data instead of generalizing (high variance). Remedies include **more data**, **regularization**, early stopping, or a simpler model. Adding epochs or layers makes overfitting worse (those actions would rather address underfitting, where the model performs poorly even on training data); ignoring validation hides the problem."}},{"n":30,"d":4,"a":["A"],"fr":{"q":"Lors de tests, un modèle de classification de réclamations produit des résultats très différents lorsque de simples fautes de frappe sont introduites dans des textes dont le sens est identique. Quelle dimension de l\u0027IA responsable est principalement en défaut ?","o":["La robustesse","L\u0027équité","La transparence","La confidentialité"],"e":"La **robustesse** désigne la capacité d\u0027un modèle à rester fiable face à des **entrées perturbées**, bruitées ou inattendues. L\u0027équité concerne le traitement des différents groupes de personnes ; la transparence porte sur la communication du fonctionnement et des limites du système ; la confidentialité concerne la protection des données personnelles."},"en":{"q":"During testing, a complaint classification model produces very different results when simple typos are introduced into texts with identical meaning. Which responsible AI dimension is primarily lacking?","o":["Robustness","Fairness","Transparency","Privacy"],"e":"**Robustness** is a model\u0027s ability to remain reliable when facing **perturbed**, noisy, or unexpected inputs. Fairness concerns how different groups of people are treated; transparency relates to communicating how the system works and its limitations; privacy concerns the protection of personal data."}},{"n":31,"d":4,"a":["B"],"fr":{"q":"Une autorité de régulation exige qu\u0027une mutuelle puisse expliquer de façon transparente chaque règle utilisée par son modèle d\u0027éligibilité. Un réseau de neurones profond obtient 2 points d\u0027exactitude de plus qu\u0027un arbre de décision. Quelle approche est la plus adaptée ?","o":["Choisir le réseau profond, car la meilleure exactitude doit toujours primer sur l\u0027interprétabilité","Choisir l\u0027arbre de décision, intrinsèquement interprétable, en acceptant une légère perte de performance","Combiner les deux modèles sans documenter lequel produit la décision finale pour chaque dossier","Choisir le réseau profond et réduire sa température pour rendre ses décisions plus transparentes"],"e":"Il existe un **compromis performance / interprétabilité** : un **arbre de décision** est **intrinsèquement interprétable** (ses règles sont lisibles), alors qu\u0027un réseau profond est une boîte noire. Face à une exigence réglementaire de transparence, une légère perte d\u0027exactitude est acceptable. La température est un paramètre des modèles génératifs sans effet sur l\u0027explicabilité ; une combinaison non documentée nuit à la transparence et à la gouvernance."},"en":{"q":"A regulator requires a health insurer to transparently explain every rule used by its eligibility model. A deep neural network scores 2 accuracy points higher than a decision tree. Which approach is MOST appropriate?","o":["Choose the deep network, because the best accuracy must always prevail over interpretability","Choose the decision tree, which is inherently interpretable, and accept a slight loss of performance","Combine both models without documenting which one produces the final decision for each case","Choose the deep network and lower its temperature to make its decisions more transparent"],"e":"There is a **performance / interpretability trade-off**: a **decision tree** is **inherently interpretable** (its rules are readable), whereas a deep network is a black box. Given a regulatory transparency requirement, a slight loss of accuracy is acceptable. Temperature is a generative model parameter with no effect on explainability; an undocumented combination harms transparency and governance."}},{"n":32,"d":5,"a":["D"],"fr":{"q":"Selon le modèle de responsabilité partagée d\u0027AWS, lorsqu\u0027une entreprise utilise Amazon Bedrock, laquelle de ces tâches lui incombe ?","o":["Mettre à jour l\u0027infrastructure réseau sous-jacente du service Bedrock","Assurer la sécurité physique des centres de données AWS","Maintenir et corriger les serveurs physiques qui hébergent les modèles","Gérer les autorisations IAM qui contrôlent l\u0027accès aux modèles et aux données"],"e":"Dans le **modèle de responsabilité partagée**, AWS sécurise **l\u0027infrastructure** du service (matériel, centres de données, réseau, logiciel du service géré). Le client reste responsable de la **sécurité dans le cloud** : **gestion des identités et des accès IAM**, classification et protection de ses données, configuration du chiffrement, des Guardrails et de la journalisation."},"en":{"q":"Under the AWS shared responsibility model, when a company uses Amazon Bedrock, which of these tasks is the company\u0027s responsibility?","o":["Updating the underlying network infrastructure of the Bedrock service","Ensuring the physical security of AWS data centers","Maintaining and patching the physical servers that host the models","Managing the IAM permissions that control access to models and data"],"e":"Under the **shared responsibility model**, AWS secures the service\u0027s **infrastructure** (hardware, data centers, network, managed service software). The customer remains responsible for **security in the cloud**: **IAM identity and access management**, classification and protection of its data, and configuration of encryption, guardrails, and logging."}},{"n":33,"d":1,"a":["D"],"fr":{"q":"Une enseigne de jardinage, Verdalis, dispose de l\u0027historique d\u0027achats de 2 millions de clients, sans aucune étiquette de segment. Elle veut regrouper ses clients selon des comportements d\u0027achat similaires pour adapter ses campagnes. Quelle approche convient ?","o":["Apprentissage par renforcement avec une fonction de récompense","Apprentissage supervisé, par exemple une régression linéaire","Apprentissage supervisé, par exemple une classification binaire","Apprentissage non supervisé, par exemple un clustering K-means"],"e":"Sans étiquettes, il faut un **apprentissage non supervisé** : le **clustering** (K-means) regroupe les observations similaires. La régression et la classification sont supervisées et exigent une variable cible étiquetée ; l\u0027apprentissage par renforcement apprend une politique d\u0027actions grâce à des récompenses, ce qui ne correspond pas à une segmentation."},"en":{"q":"A garden retailer, Verdalis, has the purchase history of 2 million customers, with no segment labels. It wants to group customers by similar purchasing behavior to tailor its campaigns. Which approach is appropriate?","o":["Reinforcement learning with a reward function","Supervised learning, for example linear regression","Supervised learning, for example binary classification","Unsupervised learning, for example K-means clustering"],"e":"Without labels, **unsupervised learning** is required: **clustering** (K-means) groups similar observations together. Regression and classification are supervised and require a labeled target variable; reinforcement learning learns an action policy through rewards, which does not match a segmentation task."}},{"n":34,"d":5,"a":["A","D"],"fr":{"q":"Une fintech prépare un audit réglementaire de sa plateforme d\u0027IA sur AWS. Elle doit (1) remettre à l\u0027auditeur les rapports de conformité d\u0027AWS (SOC 2, ISO 27001) et (2) collecter en continu et automatiquement des preuves sur la conformité de ses propres comptes AWS. Quels services utiliser ? (Sélectionnez DEUX réponses.)","o":["AWS Artifact","AWS Well-Architected Tool","AWS Trusted Advisor","AWS Audit Manager","Amazon Macie"],"e":"**AWS Artifact** donne accès à la demande aux **rapports de conformité d\u0027AWS** (SOC, ISO, PCI) et à certains accords. **AWS Audit Manager** **collecte automatiquement des preuves** sur l\u0027utilisation de vos propres ressources et les associe à des frameworks de contrôle pour préparer vos audits. Trusted Advisor émet des recommandations ; Macie découvre des données sensibles dans S3 ; le Well-Architected Tool évalue une architecture selon des bonnes pratiques."},"en":{"q":"A fintech company is preparing a regulatory audit of its AI platform on AWS. It must (1) give the auditor AWS\u0027s compliance reports (SOC 2, ISO 27001) and (2) continuously and automatically collect evidence about the compliance of its own AWS accounts. Which services should it use? (Select TWO.)","o":["AWS Artifact","AWS Well-Architected Tool","AWS Trusted Advisor","AWS Audit Manager","Amazon Macie"],"e":"**AWS Artifact** provides on-demand access to **AWS compliance reports** (SOC, ISO, PCI) and certain agreements. **AWS Audit Manager** **automatically collects evidence** about the use of your own resources and maps it to control frameworks to prepare your audits. Trusted Advisor issues recommendations; Macie discovers sensitive data in S3; the Well-Architected Tool reviews an architecture against best practices."}},{"n":35,"d":3,"a":["D"],"fr":{"q":"Une marque de cosmétiques veut comparer deux modèles d\u0027Amazon Bedrock sur des critères subjectifs, comme le respect de son ton de marque. Elle souhaite que ses propres rédacteurs notent les réponses. Quelle solution est recommandée pour un nouveau projet ?","o":["Un flux de revue humaine Amazon Augmented AI (A2I) sur les prédictions","Une évaluation automatique Bedrock fondée uniquement sur le score BLEU","Un projet d\u0027étiquetage Amazon SageMaker Ground Truth avec des annotateurs","Un job d\u0027évaluation humaine Amazon Bedrock avec sa propre équipe d\u0027évaluateurs"],"e":"Les **jobs d\u0027évaluation de modèle Bedrock avec évaluateurs humains** permettent à **sa propre équipe** de noter et comparer les réponses selon des critères personnalisés. SageMaker Ground Truth et Amazon A2I sont fermés aux nouveaux clients et remplacés par ces jobs d\u0027évaluation humaine ; une métrique automatique comme BLEU ne capture pas le respect d\u0027un ton de marque."},"en":{"q":"A cosmetics brand wants to compare two Amazon Bedrock models on subjective criteria such as adherence to its brand voice. It wants its own copywriters to rate the responses. Which solution is recommended for a new project?","o":["An Amazon Augmented AI (A2I) human review workflow on predictions","An automatic Bedrock evaluation based only on the BLEU score","An Amazon SageMaker Ground Truth labeling project with annotators","An Amazon Bedrock human evaluation job with its own team of evaluators"],"e":"**Bedrock model evaluation jobs with human workers** let **your own team** rate and compare responses against custom criteria. SageMaker Ground Truth and Amazon A2I are closed to new customers and replaced by these human evaluation jobs; an automatic metric such as BLEU does not capture adherence to a brand voice."}},{"n":36,"d":2,"a":["A"],"fr":{"q":"Qu\u0027est-ce qui distingue principalement un agent d\u0027IA d\u0027un simple chatbot fondé sur un LLM ?","o":["L\u0027agent décompose la tâche, planifie des étapes et appelle des outils ou des API pour agir","L\u0027agent répond uniquement à partir de ses données d\u0027entraînement, sans contexte externe","L\u0027agent repose obligatoirement sur un modèle plus volumineux que celui du chatbot","L\u0027agent est un modèle réentraîné spécifiquement pour chacun de ses utilisateurs"],"e":"Un **agent** utilise le modèle pour **raisonner et planifier**, puis **appelle des outils** (API, fonctions, bases de données), par exemple via le protocole **MCP**, afin d\u0027accomplir une tâche en plusieurs étapes. La taille du modèle n\u0027est pas le critère distinctif ; un agent exploite justement du contexte externe ; il n\u0027est pas réentraîné par utilisateur."},"en":{"q":"What primarily distinguishes an AI agent from a simple LLM-based chatbot?","o":["The agent breaks down the task, plans steps, and calls tools or APIs to take action","The agent answers only from its training data, without external context","The agent must rely on a larger model than the chatbot","The agent is a model retrained specifically for each of its users"],"e":"An **agent** uses the model to **reason and plan**, then **calls tools** (APIs, functions, databases), for example through the **MCP** protocol, to complete a multi-step task. Model size is not the distinguishing factor; an agent precisely leverages external context; it is not retrained per user."}},{"n":37,"d":2,"a":["C"],"fr":{"q":"Une entreprise exploite déjà Amazon Aurora PostgreSQL pour ses données transactionnelles et ses équipes maîtrisent SQL. Elle veut stocker des embeddings et effectuer des recherches de similarité au même endroit, sans ajouter de nouveau moteur de base de données. Quelle option choisir ?","o":["Un index secondaire global Amazon DynamoDB","Un index vectoriel Amazon OpenSearch Serverless","L\u0027extension pgvector d\u0027Amazon Aurora PostgreSQL","Un graphe Amazon Neptune Analytics"],"e":"L\u0027extension **pgvector** ajoute à **Aurora PostgreSQL** le stockage de vecteurs et la recherche par similarité en SQL, dans la base déjà exploitée. OpenSearch Serverless et Neptune Analytics sont aussi des magasins vectoriels valables, mais ils ajoutent un nouveau service à gérer ; un index secondaire global DynamoDB ne fournit pas de recherche de similarité vectorielle."},"en":{"q":"A company already runs Amazon Aurora PostgreSQL for its transactional data, and its teams are proficient in SQL. It wants to store embeddings and run similarity searches in the same place, without adding a new database engine. Which option should it choose?","o":["An Amazon DynamoDB global secondary index","An Amazon OpenSearch Serverless vector index","The pgvector extension for Amazon Aurora PostgreSQL","An Amazon Neptune Analytics graph"],"e":"The **pgvector** extension adds vector storage and similarity search in SQL to **Aurora PostgreSQL**, in the database already in use. OpenSearch Serverless and Neptune Analytics are also valid vector stores, but they add a new service to manage; a DynamoDB global secondary index does not provide vector similarity search."}},{"n":38,"d":3,"a":["B","D"],"fr":{"q":"Une équipe hésite entre le RAG et le fine-tuning pour un assistant interne. Quels sont deux avantages du RAG par rapport au fine-tuning ? (Sélectionnez DEUX réponses.)","o":["Le RAG ne nécessite ni modèle d\u0027embeddings ni stockage vectoriel des documents","Les connaissances se mettent à jour en réindexant les documents, sans réentraîner le modèle","Le RAG réduit systématiquement le nombre de tokens envoyés au modèle à chaque requête","Les réponses peuvent citer les passages sources utilisés, ce qui facilite la vérification","Le RAG modifie les poids du modèle pour lui apprendre un nouveau style de rédaction"],"e":"Avec le **RAG**, les connaissances résident dans une source externe : il suffit de **réindexer les documents** pour les mettre à jour, et les réponses peuvent inclure des **citations des sources**, ce qui améliore la traçabilité et limite les hallucinations. Le RAG ne modifie pas les poids (c\u0027est le fine-tuning qui le fait) ; il s\u0027appuie justement sur des embeddings et un magasin vectoriel ; il ajoute des passages au prompt, ce qui augmente plutôt le nombre de tokens d\u0027entrée."},"en":{"q":"A team is hesitating between RAG and fine-tuning for an internal assistant. What are two advantages of RAG over fine-tuning? (Select TWO.)","o":["RAG requires neither an embeddings model nor vector storage of the documents","Knowledge is updated by re-indexing documents, without retraining the model","RAG always reduces the number of tokens sent to the model with each request","Answers can cite the source passages used, which makes verification easier","RAG changes the model weights to teach it a new writing style"],"e":"With **RAG**, knowledge lives in an external source: you simply **re-index the documents** to update it, and answers can include **source citations**, which improves traceability and limits hallucinations. RAG does not change the weights (fine-tuning does); it relies precisely on embeddings and a vector store; it adds passages to the prompt, which tends to increase the number of input tokens."}},{"n":39,"d":3,"a":["A"],"fr":{"q":"Une application doit classer en temps réel des millions de courts messages texte par jour dans trois catégories. La tâche est simple ; les priorités sont la latence la plus faible et le coût le plus bas. Quel modèle Amazon Nova est le plus approprié ?","o":["Amazon Nova Micro","Amazon Nova Pro","Amazon Nova Premier","Amazon Nova Canvas"],"e":"**Amazon Nova Micro** est un modèle **texte seul**, le plus **rapide** et le **moins coûteux** de la gamme Nova : adapté à une tâche simple à fort volume. Nova Premier et Nova Pro sont plus capables (multimodaux, raisonnement complexe) mais plus lents et plus chers, ce qui est inutile ici ; Nova Canvas génère des images. Choisir le plus petit modèle suffisant réduit aussi l\u0027impact environnemental."},"en":{"q":"An application must classify millions of short text messages per day into three categories in real time. The task is simple; the priorities are the lowest latency and the lowest cost. Which Amazon Nova model is MOST appropriate?","o":["Amazon Nova Micro","Amazon Nova Pro","Amazon Nova Premier","Amazon Nova Canvas"],"e":"**Amazon Nova Micro** is a **text-only** model, the **fastest** and **lowest cost** in the Nova family: well suited to a simple, high-volume task. Nova Premier and Nova Pro are more capable (multimodal, complex reasoning) but slower and more expensive, which is unnecessary here; Nova Canvas generates images. Choosing the smallest sufficient model also reduces environmental impact."}},{"n":40,"d":4,"a":["B"],"fr":{"q":"Une équipe conformité veut consulter la documentation publiée par AWS qui décrit les cas d\u0027usage prévus, les limites et les bonnes pratiques d\u0027IA responsable d\u0027Amazon Rekognition, afin d\u0027évaluer ce service. Quelle ressource consulter ?","o":["Amazon SageMaker Model Dashboard","Les AWS AI Service Cards","Amazon SageMaker Model Cards","AWS Artifact"],"e":"Les **AWS AI Service Cards** sont des documents de **transparence** publiés par AWS pour ses services d\u0027IA : cas d\u0027usage prévus, limites, choix de conception et bonnes pratiques d\u0027IA responsable. Les SageMaker Model Cards sont rédigées par le client pour documenter **ses propres** modèles ; AWS Artifact fournit des rapports de conformité (SOC, ISO) ; Model Dashboard offre une vue de supervision des modèles SageMaker AI."},"en":{"q":"A compliance team wants to read the documentation published by AWS that describes the intended use cases, limitations, and responsible AI best practices of Amazon Rekognition, in order to assess the service. Which resource should it consult?","o":["Amazon SageMaker Model Dashboard","AWS AI Service Cards","Amazon SageMaker Model Cards","AWS Artifact"],"e":"**AWS AI Service Cards** are **transparency** documents published by AWS for its AI services: intended use cases, limitations, design choices, and responsible AI best practices. SageMaker Model Cards are written by customers to document **their own** models; AWS Artifact provides compliance reports (SOC, ISO); Model Dashboard provides a monitoring view of SageMaker AI models."}},{"n":41,"d":3,"a":["C"],"fr":{"q":"Un développeur veut qu\u0027un modèle classe des tickets de support dans l\u0027une de cinq catégories et réponde toujours au même format. Sans entraîner le modèle, il inclut dans le prompt trois exemples de tickets accompagnés de la catégorie attendue. Quelle technique utilise-t-il ?","o":["Le chain-of-thought prompting","Le fine-tuning","Le few-shot prompting","Le zero-shot prompting"],"e":"Le **few-shot prompting** fournit quelques **exemples entrée → sortie** dans le prompt pour guider le format et la tâche, sans modifier le modèle. Le zero-shot ne donne aucun exemple ; le chain-of-thought demande au modèle d\u0027expliciter son raisonnement ; le fine-tuning modifie les poids du modèle par un entraînement."},"en":{"q":"A developer wants a model to classify support tickets into one of five categories and always answer in the same format. Without training the model, they include three example tickets with the expected category in the prompt. Which technique are they using?","o":["Chain-of-thought prompting","Fine-tuning","Few-shot prompting","Zero-shot prompting"],"e":"**Few-shot prompting** provides a few **input → output examples** in the prompt to guide the format and task, without changing the model. Zero-shot provides no examples; chain-of-thought asks the model to spell out its reasoning; fine-tuning changes the model\u0027s weights through training."}},{"n":42,"d":3,"a":["C"],"fr":{"q":"Dans Amazon Bedrock AgentCore, quelle fonctionnalité permet d\u0027exposer des API existantes et des fonctions AWS Lambda sous forme d\u0027outils compatibles MCP utilisables par un agent ?","o":["AgentCore Memory","AgentCore Identity","AgentCore Gateway","AgentCore Observability"],"e":"**AgentCore Gateway** transforme des API, des fonctions Lambda et des services existants en **outils MCP** que les agents peuvent découvrir et appeler. Memory conserve le contexte des conversations ; Identity gère l\u0027authentification et les autorisations des agents ; Observability fournit traces et métriques d\u0027exécution."},"en":{"q":"In Amazon Bedrock AgentCore, which capability exposes existing APIs and AWS Lambda functions as MCP-compatible tools that an agent can use?","o":["AgentCore Memory","AgentCore Identity","AgentCore Gateway","AgentCore Observability"],"e":"**AgentCore Gateway** turns existing APIs, Lambda functions, and services into **MCP tools** that agents can discover and call. Memory retains conversation context; Identity manages agent authentication and authorization; Observability provides execution traces and metrics."}},{"n":43,"d":4,"a":["B"],"fr":{"q":"Un client conteste le refus de son prêt : la banque doit expliquer quelles variables ont le plus contribué à CETTE décision précise. Par ailleurs, l\u0027équipe risques veut visualiser l\u0027effet moyen du revenu sur les prédictions pour l\u0027ensemble des clients. Quelles techniques correspondent respectivement à ces deux besoins ?","o":["Un graphique de dépendance partielle (PDP) pour la décision individuelle, la matrice de confusion pour l\u0027effet global","Les valeurs SHAP pour la décision individuelle, un graphique de dépendance partielle (PDP) pour l\u0027effet global","Le score F1 pour la décision individuelle, la RMSE pour l\u0027effet global du revenu sur les prédictions","La matrice de confusion pour la décision individuelle, la courbe ROC pour l\u0027effet global du revenu"],"e":"Les **valeurs SHAP** attribuent à chaque variable sa contribution à **une prédiction individuelle** (explication locale). Le **graphique de dépendance partielle (PDP)** montre l\u0027**effet moyen** d\u0027une variable sur les prédictions de l\u0027ensemble du jeu de données (explication globale). La matrice de confusion, la courbe ROC, le F1 et la RMSE mesurent la performance du modèle, pas l\u0027influence des variables."},"en":{"q":"A customer disputes a loan refusal: the bank must explain which features contributed most to THIS specific decision. Separately, the risk team wants to visualize the average effect of income on predictions across all customers. Which techniques match these two needs, respectively?","o":["A partial dependence plot (PDP) for the individual decision, the confusion matrix for the global effect","SHAP values for the individual decision, a partial dependence plot (PDP) for the global effect","The F1 score for the individual decision, RMSE for the global effect of income on predictions","The confusion matrix for the individual decision, the ROC curve for the global effect of income"],"e":"**SHAP values** attribute to each feature its contribution to **an individual prediction** (local explanation). A **partial dependence plot (PDP)** shows the **average effect** of a feature on predictions across the whole dataset (global explanation). The confusion matrix, ROC curve, F1, and RMSE measure model performance, not feature influence."}},{"n":44,"d":1,"a":["A"],"fr":{"q":"Une start-up, Meteoria, expose un modèle SageMaker AI appelé seulement quelques dizaines de fois par jour, de façon imprévisible, avec de petites charges utiles et une réponse attendue de manière synchrone. Elle veut ne rien payer pour le calcul en l\u0027absence de trafic et accepte une latence de démarrage occasionnelle. Quelle option de déploiement choisir ?","o":["SageMaker Serverless Inference","SageMaker Batch Transform planifié chaque nuit","SageMaker Asynchronous Inference avec une file de requêtes","Un endpoint d\u0027inférence en temps réel sur une instance dédiée"],"e":"**Serverless Inference** provisionne automatiquement la capacité, **descend à zéro** sans trafic et facture à l\u0027usage : idéal pour un trafic intermittent qui tolère des démarrages à froid. Un endpoint temps réel est facturé en continu ; Asynchronous Inference vise les gros payloads et traitements longs avec réponse différée ; Batch Transform traite des jeux de données hors ligne, sans réponse synchrone."},"en":{"q":"A startup, Meteoria, exposes a SageMaker AI model that is called only a few dozen times a day, unpredictably, with small payloads and an expected synchronous response. It wants to pay nothing for compute when there is no traffic and accepts occasional startup latency. Which deployment option should it choose?","o":["SageMaker Serverless Inference","SageMaker Batch Transform scheduled every night","SageMaker Asynchronous Inference with a request queue","A real-time inference endpoint on a dedicated instance"],"e":"**Serverless Inference** provisions capacity automatically, **scales to zero** when there is no traffic, and charges per use: ideal for intermittent traffic that tolerates cold starts. A real-time endpoint is billed continuously; Asynchronous Inference targets large payloads and long processing with a deferred response; Batch Transform processes datasets offline, with no synchronous response."}},{"n":45,"d":3,"a":["A"],"fr":{"q":"Une équipe évalue un modèle chargé de résumer des comptes rendus de réunion. Elle dispose de résumés de référence rédigés par des humains et veut mesurer le recouvrement de n-grammes, en mettant l\u0027accent sur la part du contenu de référence retrouvée dans le résumé généré. Quelle métrique est la plus adaptée ?","o":["ROUGE","BLEU","BERTScore","La perplexité"],"e":"**ROUGE** (Recall-Oriented Understudy for Gisting Evaluation) mesure le recouvrement de n-grammes en privilégiant le **rappel** : c\u0027est la métrique de référence pour le **résumé**. BLEU est orienté **précision** et surtout utilisé pour la traduction ; BERTScore compare le sens via des embeddings plutôt que des n-grammes ; la perplexité mesure la capacité d\u0027un modèle à prédire un texte, sans référence."},"en":{"q":"A team is evaluating a model that summarizes meeting minutes. It has reference summaries written by humans and wants to measure n-gram overlap, emphasizing how much of the reference content is found in the generated summary. Which metric is MOST suitable?","o":["ROUGE","BLEU","BERTScore","Perplexity"],"e":"**ROUGE** (Recall-Oriented Understudy for Gisting Evaluation) measures n-gram overlap with an emphasis on **recall**: it is the standard metric for **summarization**. BLEU is **precision**-oriented and mainly used for translation; BERTScore compares meaning through embeddings rather than n-grams; perplexity measures how well a model predicts text, without a reference."}},{"n":46,"d":4,"a":["D"],"fr":{"q":"Une application RAG sur Amazon Bedrock produit parfois des réponses contenant des informations absentes des documents récupérés. L\u0027équipe veut bloquer automatiquement les réponses insuffisamment étayées par la source ou sans rapport avec la question. Quelle fonctionnalité de Guardrails utiliser ?","o":["Les filtres de contenu","Les filtres de mots","Les sujets refusés","Les vérifications d\u0027ancrage contextuel (contextual grounding checks)"],"e":"Les **vérifications d\u0027ancrage contextuel** évaluent, selon des seuils configurables, si la réponse est **fondée sur la source** fournie (grounding) et **pertinente** par rapport à la requête (relevance), ce qui permet de filtrer les hallucinations. Les filtres de contenu ciblent les propos nuisibles ; les sujets refusés bloquent des thèmes ; les filtres de mots bloquent des termes précis."},"en":{"q":"A RAG application on Amazon Bedrock sometimes produces answers that contain information not found in the retrieved documents. The team wants to automatically block answers that are insufficiently supported by the source or unrelated to the question. Which Guardrails feature should it use?","o":["Content filters","Word filters","Denied topics","Contextual grounding checks"],"e":"**Contextual grounding checks** evaluate, against configurable thresholds, whether the answer is **grounded in the provided source** and **relevant** to the query, which helps filter out hallucinations. Content filters target harmful language; denied topics block subjects; word filters block specific terms."}},{"n":47,"d":1,"a":["B"],"fr":{"q":"Des analystes métier d\u0027une coopérative agricole veulent construire eux-mêmes un modèle de prévision des ventes à partir de fichiers CSV, sans écrire de code ni gérer d\u0027infrastructure. Quel service choisir ?","o":["Amazon SageMaker Feature Store","Amazon SageMaker Canvas","Amazon SageMaker Studio avec des notebooks Jupyter","Amazon SageMaker JumpStart"],"e":"**SageMaker Canvas** offre une interface visuelle **no-code** permettant aux analystes d\u0027importer des données, de construire des modèles (dont des prévisions) et de générer des prédictions. JumpStart est un catalogue de modèles pré-entraînés et de FMs destiné surtout aux data scientists ; Studio est un IDE de ML qui suppose d\u0027écrire du code ; Feature Store stocke des variables mais ne construit pas de modèle."},"en":{"q":"Business analysts at an agricultural cooperative want to build a sales forecasting model themselves from CSV files, without writing code or managing infrastructure. Which service should they choose?","o":["Amazon SageMaker Feature Store","Amazon SageMaker Canvas","Amazon SageMaker Studio with Jupyter notebooks","Amazon SageMaker JumpStart"],"e":"**SageMaker Canvas** provides a visual **no-code** interface that lets analysts import data, build models (including forecasts), and generate predictions. JumpStart is a catalog of pre-trained models and FMs aimed mainly at data scientists; Studio is an ML IDE that assumes writing code; Feature Store stores features but does not build models."}},{"n":48,"d":3,"a":["A"],"fr":{"q":"Un éditeur juridique dispose de 5 000 paires « question → réponse » rédigées par ses experts, dans un style et une structure très spécifiques. Il veut qu\u0027un modèle Amazon Bedrock reproduise systématiquement ce format, sans devoir ajouter de longues instructions à chaque prompt. Quelle technique choisir ?","o":["Le fine-tuning sur ces paires étiquetées","Le continued pre-training sur ces paires","Le RAG avec une base de connaissances","Le prompting zero-shot"],"e":"Le **fine-tuning** est un entraînement supervisé sur des paires **prompt → réponse étiquetées** : il adapte le modèle à un **style, un format ou une tâche** précis. Le continued pre-training utilise du texte brut non étiqueté pour enrichir les connaissances de domaine ; le RAG apporte des faits au moment de la requête mais ne fixe pas un style ; le zero-shot ne fournit aucun exemple."},"en":{"q":"A legal publisher has 5,000 \u0027question → answer\u0027 pairs written by its experts in a very specific style and structure. It wants an Amazon Bedrock model to consistently reproduce this format without adding long instructions to every prompt. Which technique should it choose?","o":["Fine-tuning on these labeled pairs","Continued pre-training on these pairs","RAG with a knowledge base","Zero-shot prompting"],"e":"**Fine-tuning** is supervised training on **labeled prompt → response** pairs: it adapts the model to a specific **style, format, or task**. Continued pre-training uses unlabeled raw text to enrich domain knowledge; RAG supplies facts at query time but does not enforce a style; zero-shot provides no examples."}},{"n":49,"d":1,"a":["C"],"fr":{"q":"Une plateforme de livraison de repas, Gustivo, veut prédire la durée de livraison en minutes de chaque commande à partir de la distance, de l\u0027heure et de la météo. Elle dispose de l\u0027historique des livraisons passées. De quel type de problème s\u0027agit-il ?","o":["Une classification multiclasse supervisée","Une réduction de dimension (PCA)","Une régression supervisée","Un clustering non supervisé"],"e":"La cible est une **valeur numérique continue** (des minutes) et des exemples historiques étiquetés existent : c\u0027est une **régression**. Une classification prédit une catégorie discrète ; le clustering et la réduction de dimension (PCA) sont des techniques non supervisées qui ne prédisent pas de variable cible."},"en":{"q":"A meal delivery platform, Gustivo, wants to predict the delivery time in minutes of each order based on distance, time of day, and weather. It has the history of past deliveries. What type of problem is this?","o":["Supervised multiclass classification","Dimensionality reduction (PCA)","Supervised regression","Unsupervised clustering"],"e":"The target is a **continuous numeric value** (minutes) and labeled historical examples exist: this is **regression**. Classification predicts a discrete category; clustering and dimensionality reduction (PCA) are unsupervised techniques that do not predict a target variable."}},{"n":50,"d":3,"a":["B","E"],"fr":{"q":"Un architecte configure Amazon Bedrock Knowledge Bases sur des documents PDF stockés dans Amazon S3. Quels éléments doit-il choisir ou fournir pour que la base de connaissances fonctionne ? (Sélectionnez DEUX réponses.)","o":["Un endpoint SageMaker AI hébergeant le modèle de génération","Un modèle d\u0027embeddings, par exemple Amazon Titan Text Embeddings","Une Guardrail associée obligatoirement à la base de connaissances","Un modèle personnalisé obtenu par fine-tuning sur les documents","Un magasin vectoriel, par exemple Amazon OpenSearch Serverless"],"e":"Knowledge Bases découpe les documents (chunking), les convertit en vecteurs avec un **modèle d\u0027embeddings** (Titan, Cohere) et les stocke dans un **magasin vectoriel** (OpenSearch Serverless, Aurora, Neptune Analytics, Pinecone, Redis…). Aucun fine-tuning n\u0027est requis puisque le RAG laisse le modèle inchangé ; une Guardrail est recommandée mais facultative ; la génération utilise un modèle Bedrock, sans endpoint SageMaker AI."},"en":{"q":"An architect is setting up Amazon Bedrock Knowledge Bases on PDF documents stored in Amazon S3. Which elements must the architect choose or provide for the knowledge base to work? (Select TWO.)","o":["A SageMaker AI endpoint hosting the generation model","An embeddings model, for example Amazon Titan Text Embeddings","A guardrail that must be attached to the knowledge base","A custom model obtained by fine-tuning on the documents","A vector store, for example Amazon OpenSearch Serverless"],"e":"Knowledge Bases splits documents into chunks, converts them into vectors with an **embeddings model** (Titan, Cohere), and stores them in a **vector store** (OpenSearch Serverless, Aurora, Neptune Analytics, Pinecone, Redis, and so on). No fine-tuning is required because RAG leaves the model unchanged; a guardrail is recommended but optional; generation uses a Bedrock model, with no SageMaker AI endpoint."}},{"n":51,"d":2,"a":["B"],"fr":{"q":"Un studio graphique compare des familles de modèles génératifs d\u0027images. Quel type de modèle génère une image en partant d\u0027un bruit aléatoire qu\u0027il retire progressivement, étape par étape ?","o":["Un réseau de neurones récurrent (RNN)","Un modèle de diffusion","Un réseau antagoniste génératif (GAN)","Un modèle d\u0027embeddings"],"e":"Un **modèle de diffusion** apprend à inverser un processus d\u0027ajout de bruit : à l\u0027inférence, il **débruite itérativement** un bruit aléatoire jusqu\u0027à obtenir une image (par exemple Stable Diffusion). Un GAN génère en une passe via un générateur entraîné contre un discriminateur ; un RNN traite des séquences ; un modèle d\u0027embeddings produit des vecteurs, pas des images."},"en":{"q":"A design studio is comparing families of generative image models. Which type of model generates an image by starting from random noise that it progressively removes, step by step?","o":["A recurrent neural network (RNN)","A diffusion model","A generative adversarial network (GAN)","An embeddings model"],"e":"A **diffusion model** learns to reverse a noise-adding process: at inference time, it **iteratively denoises** random noise until it produces an image (for example, Stable Diffusion). A GAN generates in a single pass through a generator trained against a discriminator; an RNN processes sequences; an embeddings model produces vectors, not images."}},{"n":52,"d":5,"a":["C"],"fr":{"q":"Avant d\u0027utiliser des milliers de documents stockés dans Amazon S3 pour le fine-tuning d\u0027un modèle, une entreprise veut identifier automatiquement ceux qui contiennent des données personnelles (noms, numéros de carte bancaire, adresses). Quel service utiliser ?","o":["AWS Trusted Advisor","Amazon Inspector","Amazon Macie","AWS Config"],"e":"**Amazon Macie** utilise le ML et la correspondance de motifs pour **découvrir les données sensibles (PII)** stockées dans **Amazon S3**. Amazon Inspector détecte des **vulnérabilités logicielles** et des expositions réseau sur EC2, les images de conteneurs et Lambda, pas des données personnelles ; AWS Config évalue la configuration des ressources ; Trusted Advisor donne des recommandations de bonnes pratiques (coût, sécurité, performance)."},"en":{"q":"Before using thousands of documents stored in Amazon S3 to fine-tune a model, a company wants to automatically identify those that contain personal data (names, credit card numbers, addresses). Which service should it use?","o":["AWS Trusted Advisor","Amazon Inspector","Amazon Macie","AWS Config"],"e":"**Amazon Macie** uses ML and pattern matching to **discover sensitive data (PII)** stored in **Amazon S3**. Amazon Inspector detects **software vulnerabilities** and network exposure on EC2, container images, and Lambda, not personal data; AWS Config evaluates resource configuration; Trusted Advisor provides best practice recommendations (cost, security, performance)."}},{"n":53,"d":3,"a":["B"],"fr":{"q":"Un développeur Python veut créer rapidement un agent en déclarant simplement un modèle, un prompt système et une liste d\u0027outils, en laissant le modèle planifier lui-même les appels d\u0027outils. Il souhaite un SDK open source qu\u0027il pourra ensuite déployer sur AgentCore, AWS Lambda ou des conteneurs. Quel choix correspond ?","o":["Kiro","Strands Agents","Amazon Bedrock Flows","Amazon Bedrock AgentCore Runtime"],"e":"**Strands Agents** est un **SDK open source** d\u0027AWS fondé sur une approche pilotée par le modèle : un modèle, un prompt et des outils suffisent, le modèle planifie les étapes. AgentCore Runtime héberge des agents mais ne sert pas à les écrire ; Kiro est un IDE et une CLI agentiques de développement ; Bedrock Flows enchaîne visuellement des étapes prédéfinies plutôt que de laisser le modèle planifier."},"en":{"q":"A Python developer wants to quickly build an agent by simply declaring a model, a system prompt, and a list of tools, letting the model plan the tool calls itself. They want an open source SDK that can later be deployed to AgentCore, AWS Lambda, or containers. Which option fits?","o":["Kiro","Strands Agents","Amazon Bedrock Flows","Amazon Bedrock AgentCore Runtime"],"e":"**Strands Agents** is an AWS **open source SDK** built on a model-driven approach: a model, a prompt, and tools are enough, and the model plans the steps. AgentCore Runtime hosts agents but is not used to write them; Kiro is an agentic development IDE and CLI; Bedrock Flows visually chains predefined steps rather than letting the model plan."}},{"n":54,"d":3,"a":["A","C"],"fr":{"q":"Une société de traduction évalue un modèle anglais → français. Elle veut (1) une métrique standard de traduction automatique fondée sur la précision des n-grammes par rapport à des traductions de référence, et (2) une métrique qui reconnaît qu\u0027une traduction est correcte même lorsqu\u0027elle emploie des synonymes. Quelles métriques choisir ? (Sélectionnez DEUX réponses.)","o":["BLEU","AUC-ROC","BERTScore","ROUGE","RMSE"],"e":"**BLEU** mesure la **précision des n-grammes** par rapport à des traductions de référence : c\u0027est la métrique historique de la traduction. **BERTScore** compare des **embeddings contextuels** et capture donc la **similarité sémantique**, même avec des synonymes. ROUGE est orienté rappel et surtout utilisé pour le résumé ; AUC-ROC évalue des classifieurs ; RMSE évalue des régressions."},"en":{"q":"A translation company is evaluating an English → French model. It wants (1) a standard machine translation metric based on n-gram precision against reference translations, and (2) a metric that recognizes a translation as correct even when it uses synonyms. Which metrics should it choose? (Select TWO.)","o":["BLEU","AUC-ROC","BERTScore","ROUGE","RMSE"],"e":"**BLEU** measures **n-gram precision** against reference translations: it is the classic translation metric. **BERTScore** compares **contextual embeddings** and therefore captures **semantic similarity**, even with synonyms. ROUGE is recall-oriented and mainly used for summarization; AUC-ROC evaluates classifiers; RMSE evaluates regressions."}},{"n":55,"d":5,"a":["C"],"fr":{"q":"Une équipe d\u0027exploitation veut suivre en continu la latence et le nombre d\u0027invocations de ses modèles Amazon Bedrock, et recevoir une alerte lorsque le taux d\u0027erreurs dépasse un seuil. Quel service utiliser ?","o":["AWS Artifact, avec ses rapports de conformité","AWS CloudTrail, avec ses journaux d\u0027événements","Amazon CloudWatch, avec ses métriques et ses alarmes","AWS Config, avec ses règles de conformité"],"e":"**Amazon CloudWatch** collecte les **métriques** opérationnelles de Bedrock (invocations, latence, erreurs, tokens) et déclenche des **alarmes** sur seuil. CloudTrail trace qui a appelé quelle API, pas des indicateurs de performance ; AWS Config évalue la conformité des configurations de ressources ; AWS Artifact fournit des documents de conformité d\u0027AWS."},"en":{"q":"An operations team wants to continuously monitor the latency and invocation count of its Amazon Bedrock models and receive an alert when the error rate exceeds a threshold. Which service should it use?","o":["AWS Artifact, with its compliance reports","AWS CloudTrail, with its event logs","Amazon CloudWatch, with its metrics and alarms","AWS Config, with its compliance rules"],"e":"**Amazon CloudWatch** collects Bedrock operational **metrics** (invocations, latency, errors, tokens) and triggers threshold-based **alarms**. CloudTrail tracks who called which API, not performance indicators; AWS Config evaluates the compliance of resource configurations; AWS Artifact provides AWS compliance documents."}},{"n":56,"d":2,"a":["D"],"fr":{"q":"Un premier chatbot formule différemment sa réponse lorsqu\u0027on lui pose deux fois exactement la même question, mais ses réponses restent toujours factuellement exactes. Un second chatbot cite avec assurance une décision de justice qui n\u0027existe pas. Comment qualifier respectivement ces deux comportements ?","o":["Surapprentissage pour le premier, biais d\u0027échantillonnage pour le second","Injection de prompt pour le premier, hallucination pour le second","Hallucination pour le premier, non-déterminisme pour le second","Non-déterminisme pour le premier, hallucination pour le second"],"e":"Le **non-déterminisme** vient de l\u0027échantillonnage probabiliste : une même entrée peut produire des formulations différentes, sans que le contenu soit faux. Une **hallucination** est une réponse plausible et affirmée mais **factuellement inventée**. Le surapprentissage et le biais d\u0027échantillonnage concernent l\u0027entraînement ; aucune instruction malveillante n\u0027est injectée dans le premier cas."},"en":{"q":"A first chatbot words its answer differently when asked exactly the same question twice, but its answers are always factually correct. A second chatbot confidently cites a court ruling that does not exist. How should these two behaviors be described, respectively?","o":["Overfitting for the first, sampling bias for the second","Prompt injection for the first, hallucination for the second","Hallucination for the first, non-determinism for the second","Non-determinism for the first, hallucination for the second"],"e":"**Non-determinism** comes from probabilistic sampling: the same input can produce different wording without the content being wrong. A **hallucination** is a plausible, confident answer that is **factually fabricated**. Overfitting and sampling bias relate to training; no malicious instruction is injected in the first case."}},{"n":57,"d":3,"a":["C"],"fr":{"q":"Une entreprise a développé un agent avec le framework open source LangGraph. Elle veut l\u0027héberger dans un environnement serverless sécurisé avec isolation des sessions, lui fournir une mémoire à court et long terme et gérer l\u0027identité des utilisateurs, sans réécrire l\u0027agent. Quelle solution choisir ?","o":["Strands Agents","Kiro","Amazon Bedrock AgentCore","Amazon Bedrock Agents (version classique)"],"e":"**Amazon Bedrock AgentCore** fournit des services modulaires compatibles avec **tout framework** : **Runtime** serverless avec isolation des sessions, **Memory**, **Identity**, Gateway et Observability. Kiro est un IDE agentique pour développeurs ; Strands Agents est un SDK pour écrire un agent, pas un environnement d\u0027hébergement ; Bedrock Agents classique est fermé aux nouveaux clients au profit d\u0027AgentCore et ne réutilise pas un agent LangGraph existant."},"en":{"q":"A company has built an agent with the open source LangGraph framework. It wants to host it in a secure serverless environment with session isolation, give it short- and long-term memory, and manage user identity, without rewriting the agent. Which solution should it choose?","o":["Strands Agents","Kiro","Amazon Bedrock AgentCore","Amazon Bedrock Agents (classic)"],"e":"**Amazon Bedrock AgentCore** provides modular services that work with **any framework**: a serverless **Runtime** with session isolation, **Memory**, **Identity**, Gateway, and Observability. Kiro is an agentic IDE for developers; Strands Agents is an SDK for writing an agent, not a hosting environment; classic Bedrock Agents is closed to new customers in favor of AgentCore and does not reuse an existing LangGraph agent."}},{"n":58,"d":2,"a":["C","E"],"fr":{"q":"Une banque évalue la pertinence de l\u0027IA générative pour plusieurs projets. Dans quels cas un modèle de ML traditionnel (par exemple des arbres de décision boostés entraînés sur des données tabulaires) est-il généralement plus approprié qu\u0027un grand modèle de langage ? (Sélectionnez DEUX réponses.)","o":["Résumer de longs rapports de conformité en quelques paragraphes","Créer des descriptions marketing pour de nouveaux produits d\u0027épargne","Prévoir le volume de retraits aux guichets de la semaine suivante à partir de l\u0027historique","Rédiger des brouillons de réponses personnalisées aux e-mails des clients","Attribuer un score de risque de crédit reproductible et explicable à partir de données tabulaires"],"e":"Les **modèles de ML traditionnels** excellent dans les prédictions numériques ou catégorielles sur des **données structurées** (prévision, scoring) : ils sont moins coûteux, reproductibles et plus faciles à expliquer. Rédiger, résumer et créer du contenu sont au contraire des cas d\u0027usage typiques de l\u0027**IA générative**."},"en":{"q":"A bank is assessing whether generative AI is relevant for several projects. In which cases is a traditional ML model (for example, boosted decision trees trained on tabular data) generally more appropriate than a large language model? (Select TWO.)","o":["Summarizing long compliance reports in a few paragraphs","Creating marketing descriptions for new savings products","Forecasting next week\u0027s branch withdrawal volume from historical data","Drafting personalized replies to customer emails","Assigning a reproducible and explainable credit risk score from tabular data"],"e":"**Traditional ML models** excel at numeric or categorical predictions on **structured data** (forecasting, scoring): they are cheaper, reproducible, and easier to explain. Drafting, summarizing, and creating content are, on the contrary, typical **generative AI** use cases."}},{"n":59,"d":3,"a":["B"],"fr":{"q":"Un data scientist veut déployer en quelques clics un modèle de fondation open source (par exemple Llama) sur un endpoint SageMaker AI dans son propre compte, puis l\u0027affiner sur ses données. Quel composant utiliser comme point de départ ?","o":["Amazon SageMaker Data Wrangler","Amazon SageMaker JumpStart","Amazon SageMaker Canvas","Amazon SageMaker Feature Store"],"e":"**SageMaker JumpStart** est un **catalogue de modèles pré-entraînés et de modèles de fondation** proposant un déploiement en un clic sur des endpoints SageMaker AI et des recettes de fine-tuning. Canvas cible les analystes en no-code ; Data Wrangler prépare visuellement les données ; Feature Store stocke et partage des variables, sans fournir de modèles."},"en":{"q":"A data scientist wants to deploy an open source foundation model (for example, Llama) to a SageMaker AI endpoint in their own account in a few clicks, and then fine-tune it on their data. Which component should they use as a starting point?","o":["Amazon SageMaker Data Wrangler","Amazon SageMaker JumpStart","Amazon SageMaker Canvas","Amazon SageMaker Feature Store"],"e":"**SageMaker JumpStart** is a **catalog of pre-trained models and foundation models** offering one-click deployment to SageMaker AI endpoints and fine-tuning recipes. Canvas targets analysts with no code; Data Wrangler prepares data visually; Feature Store stores and shares features and does not provide models."}},{"n":60,"d":4,"a":["C"],"fr":{"q":"Une banque en ligne, Novabanque, déploie un assistant sur Amazon Bedrock. Celui-ci ne doit jamais fournir de conseils d\u0027investissement personnalisés, quelle que soit la formulation de la demande. Quelle politique d\u0027Amazon Bedrock Guardrails est la plus adaptée ?","o":["Un filtre de contenu réglé au maximum sur la catégorie inconduite","Un filtre de mots listant « action », « obligation » et « bourse »","Un sujet refusé (denied topic) décrivant les conseils d\u0027investissement","Un filtre d\u0027informations sensibles ciblant les numéros de compte"],"e":"Un **sujet refusé** se définit en langage naturel (avec éventuellement des exemples) et bloque toute requête ou réponse relevant de ce **thème**, quelle que soit la formulation. Les filtres de contenu ciblent des catégories nuisibles prédéfinies (haine, insultes, sexuel, violence, inconduite) ; les filtres d\u0027informations sensibles traitent les PII ; un filtre de mots est contournable par des reformulations et bloquerait aussi des questions légitimes."},"en":{"q":"An online bank, Novabanque, deploys an assistant on Amazon Bedrock. It must never provide personalized investment advice, however the request is phrased. Which Amazon Bedrock Guardrails policy is MOST suitable?","o":["A content filter set to maximum for the misconduct category","A word filter listing \u0027stock\u0027, \u0027bond\u0027, and \u0027stock market\u0027","A denied topic describing investment advice","A sensitive information filter targeting account numbers"],"e":"A **denied topic** is defined in natural language (optionally with examples) and blocks any request or response related to that **subject**, however it is phrased. Content filters target predefined harmful categories (hate, insults, sexual, violence, misconduct); sensitive information filters handle PII; a word filter can be bypassed by rephrasing and would also block legitimate questions."}},{"n":61,"d":1,"a":["C"],"fr":{"q":"Un laboratoire développe un modèle de dépistage d\u0027une maladie rare. Ne pas détecter un patient malade (faux négatif) est jugé beaucoup plus grave que d\u0027envoyer un patient sain passer un examen complémentaire (faux positif). Quelle métrique faut-il prioriser ?","o":["L\u0027erreur absolue moyenne (MAE)","L\u0027exactitude (accuracy)","Le rappel (recall)","La précision (precision)"],"e":"Le **rappel** = VP / (VP + FN) mesure la part des cas positifs réellement détectés ; le maximiser réduit les **faux négatifs**. La précision est à privilégier quand les **faux positifs** sont coûteux ; l\u0027exactitude est trompeuse avec des classes très déséquilibrées (maladie rare) ; la MAE est une métrique de régression."},"en":{"q":"A laboratory is developing a screening model for a rare disease. Missing a sick patient (false negative) is considered much more serious than sending a healthy patient for an additional test (false positive). Which metric should be prioritized?","o":["Mean absolute error (MAE)","Accuracy","Recall","Precision"],"e":"**Recall** = TP / (TP + FN) measures the share of actual posit
