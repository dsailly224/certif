ons ; la robustesse, la fiabilité face à des entrées inattendues ou perturbées."},"en":{"q":"A company deploys an AI agent that processes refund requests. It puts in place mechanisms that let its teams monitor the agent\u0027s behavior, steer it, change its rules, and stop it at any time if necessary. Which responsible AI dimension is MAINLY addressed?","o":["Fairness","Explainability","Controllability","Robustness"],"e":"**Controllability** means having **mechanisms to monitor and steer** an AI system\u0027s behavior (adjusting its rules, stopping it, taking back control). Fairness concerns how different groups are treated; explainability, understanding decisions; robustness, reliability when facing unexpected or perturbed inputs."}},{"n":41,"d":3,"a":["B"],"fr":{"q":"Pour analyser des contrats fournisseurs, une équipe enchaîne trois appels au modèle : le premier extrait les clauses, le deuxième évalue le niveau de risque de chaque clause extraite, le troisième rédige une synthèse à partir de ces évaluations. Chaque sortie sert d\u0027entrée à l\u0027étape suivante. Quelle technique utilise-t-elle ?","o":["Le few-shot prompting","Le prompt chaining","Le RAG (Retrieval-Augmented Generation)","Le continued pre-training"],"e":"Le **prompt chaining** décompose une tâche complexe en **plusieurs prompts successifs**, la sortie de chacun alimentant le suivant : chaque étape est plus simple, plus fiable et peut être vérifiée séparément. Le few-shot ajoute des exemples dans un prompt ; le RAG récupère des documents externes ; le continued pre-training réentraîne le modèle sur des données non étiquetées."},"en":{"q":"To analyze supplier contracts, a team chains three model calls: the first extracts the clauses, the second assesses the risk level of each extracted clause, and the third writes a summary from these assessments. Each output is the input to the next step. Which technique is it using?","o":["Few-shot prompting","Prompt chaining","RAG (Retrieval-Augmented Generation)","Continued pre-training"],"e":"**Prompt chaining** breaks a complex task into **several successive prompts**, with each output feeding the next: each step is simpler, more reliable, and can be checked separately. Few-shot adds examples to a prompt; RAG retrieves external documents; continued pre-training retrains the model on unlabeled data."}},{"n":42,"d":1,"a":["D"],"fr":{"q":"Un gestionnaire de parkings évalue un modèle de régression qui prévoit le taux d\u0027occupation de ses sites. Il veut un indicateur exprimant la part de la variabilité de l\u0027occupation réelle expliquée par le modèle, sur une échelle où 1 correspond à une prédiction parfaite. Quelle métrique choisir ?","o":["Le score F1","L\u0027aire sous la courbe ROC (AUC-ROC)","La précision (precision)","Le coefficient de détermination (R²)"],"e":"Le **coefficient de détermination (R²)** mesure la **proportion de la variance** de la variable cible expliquée par un modèle de **régression** : 1 signifie une prédiction parfaite, 0 un modèle qui ne fait pas mieux que la moyenne. Le F1, l\u0027AUC-ROC et la précision sont des métriques de classification."},"en":{"q":"A parking operator is evaluating a regression model that forecasts the occupancy rate of its sites. It wants an indicator expressing the share of the variability in actual occupancy explained by the model, on a scale where 1 means a perfect prediction. Which metric should it choose?","o":["F1 score","Area under the ROC curve (AUC-ROC)","Precision","Coefficient of determination (R²)"],"e":"The **coefficient of determination (R²)** measures the **proportion of variance** in the target variable explained by a **regression** model: 1 means a perfect prediction, 0 a model that does no better than the mean. F1, AUC-ROC, and precision are classification metrics."}},{"n":43,"d":5,"a":["C","D"],"fr":{"q":"Un agent construit avec Strands Agents dispose d\u0027un outil permettant de rembourser des commandes clients. L\u0027équipe sécurité craint qu\u0027une injection de prompt déclenche des remboursements frauduleux. Quelles mesures réduisent ce risque ? (Sélectionnez DEUX réponses.)","o":["Augmenter la température pour rendre le comportement de l\u0027agent moins prévisible","Placer les clés d\u0027API de remboursement dans le prompt système pour simplifier l\u0027authentification","Limiter les permissions de l\u0027outil au strict nécessaire (moindre privilège, plafond de montant)","Exiger une validation humaine avant tout remboursement au-delà d\u0027un seuil défini","Désactiver la journalisation de l\u0027agent pour réduire la surface d\u0027attaque"],"e":"Le **moindre privilège** appliqué aux outils limite l\u0027impact d\u0027une injection réussie, et une **validation humaine (human-in-the-loop)** des actions sensibles empêche qu\u0027une instruction malveillante suffise à déclencher un remboursement. Une température élevée n\u0027apporte aucune sécurité, des secrets dans le prompt système peuvent fuiter, et désactiver les journaux supprime la traçabilité nécessaire aux enquêtes."},"en":{"q":"An agent built with Strands Agents has a tool that can refund customer orders. The security team fears that a prompt injection could trigger fraudulent refunds. Which measures reduce this risk? (Select TWO.)","o":["Raise the temperature to make the agent\u0027s behavior less predictable","Put the refund API keys in the system prompt to simplify authentication","Limit the tool\u0027s permissions to the strict minimum (least privilege, amount cap)","Require human approval before any refund above a defined threshold","Disable agent logging to reduce the attack surface"],"e":"**Least privilege** applied to tools limits the impact of a successful injection, and **human-in-the-loop** approval of sensitive actions ensures that a malicious instruction alone cannot trigger a refund. A higher temperature provides no security, secrets in the system prompt can leak, and disabling logs removes the traceability needed for investigations."}},{"n":44,"d":2,"a":["B"],"fr":{"q":"Lequel des cas d\u0027usage suivants est le MIEUX adapté à l\u0027IA générative ?","o":["Le calcul exact des cotisations sociales de la paie mensuelle","La rédaction de premières versions de descriptions produits personnalisées","Le pilotage du freinage d\u0027un véhicule avec une latence garantie à la milliseconde","Le stockage transactionnel des opérations bancaires avec garanties ACID"],"e":"L\u0027IA générative excelle dans la **création de contenu** (texte, images, code) où la variété est un atout et où un humain peut relire : des **brouillons de descriptions produits** en sont un exemple typique. Les calculs exacts réglementés, les systèmes temps réel critiques et le stockage transactionnel exigent un comportement déterministe que l\u0027IA générative ne garantit pas."},"en":{"q":"Which of the following use cases is BEST suited to generative AI?","o":["Exact calculation of social security contributions for monthly payroll","Drafting first versions of personalized product descriptions","Controlling a vehicle\u0027s braking with guaranteed millisecond latency","Transactional storage of banking operations with ACID guarantees"],"e":"Generative AI excels at **content creation** (text, images, code) where variety is an asset and a human can review: **drafts of product descriptions** are a typical example. Exact regulated calculations, critical real-time systems and transactional storage require deterministic behavior that generative AI does not guarantee."}},{"n":45,"d":3,"a":["A"],"fr":{"q":"Une Knowledge Base Amazon Bedrock indexe des transcriptions d\u0027entretiens sans titres ni sections. Les changements de sujet ne tombent jamais à intervalles réguliers, si bien que le découpage à taille fixe coupe souvent une idée en deux. Quelle stratégie de découpage est la plus adaptée ?","o":["Le découpage sémantique (semantic chunking), qui regroupe les phrases selon leur proximité de sens","Aucun découpage, chaque transcription devenant un seul fragment","Le découpage à taille fixe avec des fragments de 20 tokens","Le découpage à taille fixe sans aucun chevauchement"],"e":"Le **découpage sémantique** utilise des embeddings pour placer les frontières des fragments là où le **sens change**, ce qui produit des fragments cohérents même dans un texte non structuré. Sans découpage, un seul vecteur représente mal une longue transcription ; des fragments minuscules ou sans chevauchement aggravent la perte de contexte."},"en":{"q":"An Amazon Bedrock Knowledge Base indexes interview transcripts with no headings or sections. Topic changes never fall at regular intervals, so fixed-size chunking often splits an idea in two. Which chunking strategy is MOST suitable?","o":["Semantic chunking, which groups sentences by similarity of meaning","No chunking, with each transcript becoming a single chunk","Fixed-size chunking with 20-token chunks","Fixed-size chunking with no overlap"],"e":"**Semantic chunking** uses embeddings to place chunk boundaries where the **meaning changes**, producing coherent chunks even in unstructured text. Without chunking, a single vector poorly represents a long transcript; tiny chunks or chunks without overlap make the loss of context worse."}},{"n":46,"d":1,"a":["D"],"fr":{"q":"Un musée utilise Amazon Polly pour ses audioguides. Les conservateurs veulent insérer des pauses, accentuer certains mots, ralentir le débit sur certaines phrases et préciser la prononciation de noms d\u0027artistes étrangers. Quelle solution utiliser ?","o":["Amazon Transcribe avec un vocabulaire personnalisé","Amazon Translate avec une terminologie personnalisée","Amazon Lex avec des slots personnalisés","Le langage de balisage SSML avec Amazon Polly"],"e":"**SSML (Speech Synthesis Markup Language)** permet de contrôler la synthèse d\u0027**Amazon Polly** : pauses, emphase, débit, prononciation (phonèmes) ; les lexiques de prononciation de Polly complètent ce dispositif. Le vocabulaire personnalisé de Transcribe améliore la reconnaissance vocale (parole → texte), la terminologie de Translate contrôle des traductions et les slots de Lex collectent des informations dans un dialogue."},"en":{"q":"A museum uses Amazon Polly for its audio guides. The curators want to insert pauses, emphasize certain words, slow down the speaking rate on some sentences, and specify the pronunciation of foreign artists\u0027 names. Which solution should they use?","o":["Amazon Transcribe with a custom vocabulary","Amazon Translate with custom terminology","Amazon Lex with custom slots","SSML markup with Amazon Polly"],"e":"**SSML (Speech Synthesis Markup Language)** controls **Amazon Polly** synthesis: pauses, emphasis, rate, and pronunciation (phonemes); Polly pronunciation lexicons complement it. Transcribe custom vocabulary improves speech recognition (speech to text), Translate terminology controls translations, and Lex slots collect information in a dialog."}},{"n":47,"d":4,"a":["C"],"fr":{"q":"Un réseau social de randonneurs permet de publier des photos. Pour protéger sa communauté, il veut détecter automatiquement les images contenant de la nudité, de la violence ou des symboles haineux avant leur publication, et envoyer les cas douteux à des modérateurs. Quel service utiliser pour l\u0027analyse des images ?","o":["Amazon Textract","Amazon Comprehend","Amazon Rekognition, avec la modération de contenu","Amazon Polly"],"e":"La **modération de contenu d\u0027Amazon Rekognition** détecte dans les images et les vidéos des contenus **inappropriés ou offensants** (nudité, violence, symboles haineux…) avec des étiquettes hiérarchisées et un score de confiance, ce qui permet d\u0027orienter les cas incertains vers une **revue humaine**. Textract extrait du texte de documents, Comprehend analyse du texte et Polly synthétise la voix."},"en":{"q":"A hikers\u0027 social network lets users post photos. To protect its community, it wants to automatically detect images containing nudity, violence, or hate symbols before they are published, and send doubtful cases to moderators. Which service should it use for image analysis?","o":["Amazon Textract","Amazon Comprehend","Amazon Rekognition, with content moderation","Amazon Polly"],"e":"**Amazon Rekognition content moderation** detects **inappropriate or offensive** content (nudity, violence, hate symbols, and so on) in images and videos, with hierarchical labels and a confidence score, so that uncertain cases can be routed to **human review**. Textract extracts text from documents, Comprehend analyzes text, and Polly synthesizes speech."}},{"n":48,"d":2,"a":["C"],"fr":{"q":"Dans une architecture RAG, la question de l\u0027utilisateur a été convertie en embedding. Quelle opération la base vectorielle (par exemple Amazon OpenSearch Service) effectue-t-elle ensuite pour trouver les passages pertinents ?","o":["Une recherche plein texte par mots-clés uniquement, sans utiliser les vecteurs","Un clustering K-means recalculé sur toute la base à chaque requête","Une recherche des k plus proches voisins (k-NN), souvent approximative, selon une mesure de similarité comme le cosinus","Une classification supervisée des documents en catégories prédéfinies"],"e":"La base vectorielle exécute une **recherche des k plus proches voisins (k-NN)** : elle renvoie les k vecteurs les plus proches de celui de la question selon une mesure de **similarité** (cosinus, produit scalaire, distance euclidienne), généralement avec un algorithme **approximatif (ANN)** comme HNSW pour rester rapide sur des millions de vecteurs. Une recherche par mots-clés ignore le sens ; recalculer un clustering à chaque requête serait inutilement coûteux ; une classification ne retrouve pas de passages."},"en":{"q":"In a RAG architecture, the user\u0027s question has been converted into an embedding. What operation does the vector database (for example Amazon OpenSearch Service) then perform to find the relevant passages?","o":["A keyword-only full-text search, without using the vectors","A K-means clustering recomputed over the whole database on every request","A k-nearest neighbor (k-NN) search, often approximate, based on a similarity measure such as cosine","A supervised classification of the documents into predefined categories"],"e":"The vector database runs a **k-nearest neighbor (k-NN) search**: it returns the k vectors closest to the question\u0027s vector according to a **similarity** measure (cosine, dot product, Euclidean distance), usually with an **approximate (ANN)** algorithm such as HNSW to stay fast across millions of vectors. Keyword search ignores meaning; recomputing clustering on every request would be needlessly expensive; classification does not retrieve passages."}},{"n":49,"d":3,"a":["B"],"fr":{"q":"Une agence de communication génère des visuels publicitaires avec Amazon Nova Canvas. Les images obtenues contiennent souvent du texte illisible et des filigranes indésirables. Quelle est la façon la plus simple de les éviter ?","o":["Augmenter la température du modèle pour diversifier les images générées","Utiliser le prompt négatif (paramètre negativeText) pour lister les éléments à exclure","Affiner Nova Canvas sur un millier d\u0027images sans texte ni filigrane","Vectoriser les images avec Amazon Titan Multimodal Embeddings avant la génération"],"e":"Le **prompt négatif** (paramètre **negativeText** de Nova Canvas) décrit ce que l\u0027image ne doit **pas** contenir, par exemple « texte, filigrane, logo » : c\u0027est la technique la plus directe. La température n\u0027empêche pas l\u0027apparition d\u0027éléments précis, un fine-tuning est bien plus lourd, et des embeddings servent à la recherche de similarité, pas au contrôle de la génération."},"en":{"q":"A communications agency generates advertising visuals with Amazon Nova Canvas. The resulting images often contain unreadable text and unwanted watermarks. What is the SIMPLEST way to avoid them?","o":["Raise the model temperature to diversify the generated images","Use the negative prompt (negativeText parameter) to list the elements to exclude","Fine-tune Nova Canvas on a thousand images without text or watermarks","Embed the images with Amazon Titan Multimodal Embeddings before generation"],"e":"The **negative prompt** (Nova Canvas **negativeText** parameter) describes what the image must **not** contain, for example \u0027text, watermark, logo\u0027: it is the most direct technique. Temperature does not prevent specific elements from appearing, fine-tuning is much heavier, and embeddings are used for similarity search, not for controlling generation."}},{"n":50,"d":4,"a":["B","C"],"fr":{"q":"Une compagnie d\u0027assurance doit expliquer à chaque client pourquoi son modèle de tarification (un modèle d\u0027ensemble de type boîte noire) a proposé CETTE prime précise. Quelles techniques fournissent ce type d\u0027explication locale et s\u0027appliquent à n\u0027importe quel modèle ? (Sélectionnez DEUX réponses.)","o":["Un graphique de dépendance partielle (PDP), qui montre l\u0027effet moyen d\u0027une variable sur l\u0027ensemble des clients","Les valeurs SHAP, qui attribuent à chaque variable sa contribution à la prédiction","LIME, qui approxime localement le modèle autour de la prédiction par un modèle simple et interprétable","La matrice de confusion du modèle sur le jeu de test","Le score ROUGE calculé sur les explications générées"],"e":"**SHAP** et **LIME** sont des méthodes d\u0027explicabilité **locales** et **agnostiques au modèle** : SHAP répartit la prédiction entre les variables, LIME ajuste un modèle simple (linéaire) autour du point à expliquer. Le PDP fournit une explication **globale** (effet moyen) ; la matrice de confusion mesure la performance ; ROUGE évalue des résumés."},"en":{"q":"An insurance company must explain to each customer why its pricing model (a black-box ensemble model) proposed THIS specific premium. Which techniques provide this kind of local explanation and can be applied to any model? (Select TWO.)","o":["A partial dependence plot (PDP), which shows the average effect of a feature across all customers","SHAP values, which attribute to each feature its contribution to the prediction","LIME, which locally approximates the model around the prediction with a simple, interpretable model","The model\u0027s confusion matrix on the test set","The ROUGE score computed on the generated explanations"],"e":"**SHAP** and **LIME** are **local**, **model-agnostic** explainability methods: SHAP distributes the prediction among the features, and LIME fits a simple (linear) model around the point being explained. A PDP provides a **global** explanation (average effect); the confusion matrix measures performance; ROUGE evaluates summaries."}},{"n":51,"d":5,"a":["A"],"fr":{"q":"Le RSSI d\u0027un groupe industriel demande si les prompts et les réponses échangés avec les modèles d\u0027Amazon Bedrock peuvent servir à entraîner les modèles des fournisseurs. Quelle réponse est correcte ?","o":["Non : Amazon Bedrock n\u0027utilise pas les prompts ni les réponses pour entraîner les modèles de base et ne les partage pas avec les fournisseurs","Oui : ils sont partagés de façon anonymisée avec le fournisseur pour améliorer le modèle","Seulement si aucune Guardrail n\u0027est associée à l\u0027application","Seulement en mode à la demande ; le Provisioned Throughput en est exempté"],"e":"Amazon Bedrock **n\u0027utilise pas les prompts et les complétions des clients pour entraîner les modèles** de base et ne les communique pas aux fournisseurs de modèles ; les données sont chiffrées en transit et au repos. Cette garantie ne dépend ni de l\u0027usage de Guardrails ni du mode d\u0027inférence (on-demand, Provisioned Throughput ou batch)."},"en":{"q":"The CISO of an industrial group asks whether the prompts and responses exchanged with Amazon Bedrock models can be used to train the providers\u0027 models. Which answer is correct?","o":["No: Amazon Bedrock does not use prompts or responses to train base models and does not share them with providers","Yes: they are shared in anonymized form with the provider to improve the model","Only if no guardrail is attached to the application","Only in on-demand mode; Provisioned Throughput is exempt"],"e":"Amazon Bedrock **does not use customer prompts and completions to train base models** and does not share them with model providers; data is encrypted in transit and at rest. This guarantee does not depend on the use of Guardrails or on the inference mode (on-demand, Provisioned Throughput or batch)."}},{"n":52,"d":1,"a":["D"],"fr":{"q":"Une usine veut détecter automatiquement des rayures et des fissures sur des photos de pièces métalliques prises en sortie de chaîne. Quel type de réseau de neurones est traditionnellement le plus adapté à ce type d\u0027analyse d\u0027images ?","o":["Un réseau de neurones récurrent (RNN)","Une régression linéaire multiple","Un algorithme de clustering K-means","Un réseau de neurones convolutif (CNN)"],"e":"Les **réseaux de neurones convolutifs (CNN)** extraient des motifs visuels locaux (bords, textures, formes) grâce aux couches de convolution : ils sont la référence pour la **vision par ordinateur** (classification, détection de défauts). Les RNN sont conçus pour les séquences, la régression linéaire pour prédire une valeur numérique à partir de variables tabulaires, et K-means pour regrouper des données non étiquetées."},"en":{"q":"A factory wants to automatically detect scratches and cracks on photos of metal parts taken at the end of the production line. Which type of neural network is traditionally BEST suited to this kind of image analysis?","o":["A recurrent neural network (RNN)","A multiple linear regression","A K-means clustering algorithm","A convolutional neural network (CNN)"],"e":"**Convolutional neural networks (CNNs)** extract local visual patterns (edges, textures, shapes) through convolution layers: they are the reference for **computer vision** (classification, defect detection). RNNs are designed for sequences, linear regression predicts a numeric value from tabular variables, and K-means groups unlabeled data."}},{"n":53,"d":3,"a":["A"],"fr":{"q":"Un éditeur de logiciels traduit automatiquement sa documentation en 12 langues. Les noms de ses produits et certains termes techniques doivent toujours être rendus de la même façon (ou ne pas être traduits), quelle que soit la langue cible. Quelle solution répond à ce besoin avec le MOINS d\u0027effort ?","o":["Amazon Translate avec une terminologie personnalisée (custom terminology)","Amazon Polly avec un lexique de prononciation","Amazon Comprehend avec la détection d\u0027entités personnalisées","Amazon Transcribe avec un vocabulaire personnalisé"],"e":"La **terminologie personnalisée d\u0027Amazon Translate** impose la traduction (ou la conservation) de **termes précis** comme les noms de marques et le jargon technique, de façon cohérente dans toutes les langues cibles. Les lexiques de Polly agissent sur la prononciation, les entités personnalisées de Comprehend sur la détection d\u0027entités et le vocabulaire de Transcribe sur la reconnaissance vocale."},"en":{"q":"A software vendor automatically translates its documentation into 12 languages. Its product names and certain technical terms must always be rendered the same way (or left untranslated), whatever the target language. Which solution meets this requirement with the LEAST effort?","o":["Amazon Translate with custom terminology","Amazon Polly with a pronunciation lexicon","Amazon Comprehend with custom entity recognition","Amazon Transcribe with a custom vocabulary"],"e":"**Amazon Translate custom terminology** enforces how **specific terms** such as brand names and technical jargon are translated (or kept as is), consistently across all target languages. Polly lexicons affect pronunciation, Comprehend custom entities affect entity detection, and Transcribe vocabularies affect speech recognition."}},{"n":54,"d":2,"a":["D"],"fr":{"q":"Pourquoi le modèle de fondation le plus grand (avec le plus de paramètres) n\u0027est-il pas toujours le meilleur choix pour une application ?","o":["Les grands modèles ne savent pas traiter les langues autres que l\u0027anglais","Les grands modèles ont systématiquement une fenêtre de contexte plus petite","Les grands modèles ne sont pas accessibles par API dans Amazon Bedrock","Ils sont généralement plus coûteux et plus lents, alors qu\u0027un modèle plus petit peut suffire"],"e":"Un modèle plus grand est souvent plus capable, mais aussi **plus coûteux par jeton** et avec une **latence plus élevée** ; si un modèle plus petit atteint la qualité requise, il est préférable (coût, rapidité, impact environnemental). La taille ne détermine ni la prise en charge multilingue ni la fenêtre de contexte de manière systématique, et les grands modèles sont bien disponibles par API dans Bedrock."},"en":{"q":"Why is the largest foundation model (with the most parameters) not always the best choice for an application?","o":["Large models cannot handle languages other than English","Large models always have a smaller context window","Large models are not available through an API in Amazon Bedrock","They are generally more expensive and slower, while a smaller model may be sufficient"],"e":"A larger model is often more capable, but also **more expensive per token** and with **higher latency**; if a smaller model reaches the required quality, it is preferable (cost, speed, environmental impact). Size does not systematically determine multilingual support or context window, and large models are indeed available through the API in Bedrock."}},{"n":55,"d":2,"a":["C"],"fr":{"q":"Une plateforme d\u0027e-learning veut une recherche sémantique dans laquelle une question posée en espagnol retrouve des cours rédigés en français ou en allemand, sans traduire le catalogue. Quel choix technique le permet ?","o":["Une recherche par mots-clés de type BM25 sur l\u0027index du catalogue","Un modèle de génération de texte configuré avec une température de 0","Un modèle d\u0027embeddings multilingue, comme Cohere Embed Multilingual, qui place les langues dans un même espace vectoriel","Une terminologie personnalisée Amazon Translate appliquée aux titres des cours"],"e":"Un **modèle d\u0027embeddings multilingue** projette des textes de langues différentes mais de même sens à des positions proches de l\u0027**espace vectoriel** : une question en espagnol retrouve ainsi des documents français ou allemands. Une recherche par mots-clés ne fait pas correspondre des mots de langues différentes, un modèle de génération ne fait pas de recherche, et une terminologie Translate ne concerne que la traduction."},"en":{"q":"An e-learning platform wants semantic search in which a question asked in Spanish retrieves courses written in French or German, without translating the catalog. Which technical choice enables this?","o":["BM25-style keyword search on the catalog index","A text generation model configured with a temperature of 0","A multilingual embedding model, such as Cohere Embed Multilingual, that places languages in the same vector space","An Amazon Translate custom terminology applied to course titles"],"e":"A **multilingual embedding model** maps texts in different languages with the same meaning to nearby positions in the **vector space**: a Spanish question thus retrieves French or German documents. Keyword search cannot match words across languages, a generation model does not perform retrieval, and a Translate terminology only applies to translation."}},{"n":56,"d":2,"a":["D","E"],"fr":{"q":"Que se passe-t-il lorsqu\u0027un utilisateur pose une question à une application RAG dont les documents sont déjà indexés ? (Sélectionnez DEUX réponses.)","o":["Le modèle de génération est réaffiné sur les documents avant chaque réponse","Tous les documents sources sont redécoupés et revectorisés à chaque question","La réponse est générée d\u0027abord, puis les documents sont recherchés pour la justifier","La question est convertie en embedding puis comparée aux vecteurs indexés pour trouver les passages les plus proches","Les passages récupérés sont ajoutés au prompt envoyé au modèle de génération, qui s\u0027en sert pour répondre"],"e":"À la requête, le RAG **vectorise la question**, **recherche** les passages les plus similaires dans la base vectorielle, puis **augmente le prompt** avec ces passages avant la **génération**. Le découpage et la vectorisation des documents se font à l\u0027indexation (et lors des mises à jour), pas à chaque question ; aucun réentraînement n\u0027a lieu ; la recherche précède la génération."},"en":{"q":"What happens when a user asks a question to a RAG application whose documents are already indexed? (Select TWO.)","o":["The generation model is fine-tuned on the documents before each answer","All source documents are re-chunked and re-embedded for every question","The answer is generated first, then documents are searched to justify it","The question is converted into an embedding and compared with the indexed vectors to find the closest passages","The retrieved passages are added to the prompt sent to the generation model, which uses them to answer"],"e":"At query time, RAG **embeds the question**, **retrieves** the most similar passages from the vector store, then **augments the prompt** with these passages before **generation**. Chunking and embedding documents happen at indexing time (and on updates), not for every question; no retraining takes place; retrieval comes before generation."}},{"n":57,"d":5,"a":["B"],"fr":{"q":"Avant d\u0027utiliser un jeu de données client pour entraîner un modèle, l\u0027équipe de gouvernance veut en mesurer la qualité (valeurs manquantes, doublons, valeurs aberrantes) et appliquer des règles de qualité, via une interface visuelle et sans écrire de code. Quel service AWS utiliser ?","o":["Amazon Inspector","AWS Glue DataBrew","AWS CloudTrail","AWS Trusted Advisor"],"e":"**AWS Glue DataBrew** est un outil visuel de **préparation de données sans code** qui produit des **profils de données** (valeurs manquantes, doublons, distributions) et applique des **règles de qualité** ainsi que des centaines de transformations. Inspector recherche des vulnérabilités logicielles ; CloudTrail journalise les appels d\u0027API ; Trusted Advisor émet des recommandations sur le compte AWS."},"en":{"q":"Before using a customer dataset to train a model, the governance team wants to measure its quality (missing values, duplicates, outliers) and apply data quality rules, through a visual interface and without writing code. Which AWS service should it use?","o":["Amazon Inspector","AWS Glue DataBrew","AWS CloudTrail","AWS Trusted Advisor"],"e":"**AWS Glue DataBrew** is a visual, **no-code data preparation** tool that produces **data profiles** (missing values, duplicates, distributions) and applies **data quality rules** as well as hundreds of transformations. Inspector looks for software vulnerabilities; CloudTrail logs API calls; Trusted Advisor makes recommendations about the AWS account."}},{"n":58,"d":1,"a":["B"],"fr":{"q":"Un data scientist divise ses données en trois jeux : entraînement, validation et test. À quoi sert principalement le jeu de validation ?","o":["À apprendre les poids du modèle","À ajuster les hyperparamètres et à comparer des modèles candidats pendant le développement","À mesurer une seule fois, à la fin, la performance du modèle retenu sur des données jamais utilisées","À servir les prédictions en production"],"e":"Le **jeu de validation** sert à **régler les hyperparamètres**, à comparer des modèles et à détecter le sur-apprentissage pendant le développement. Les poids sont appris sur le **jeu d\u0027entraînement**, et le **jeu de test**, mis de côté, fournit une estimation finale et impartiale de la performance. Les données de production ne font pas partie de ce découpage."},"en":{"q":"A data scientist splits their data into three sets: training, validation, and test. What is the validation set MAINLY used for?","o":["Learning the model\u0027s weights","Tuning hyperparameters and comparing candidate models during development","Measuring, once at the end, the performance of the selected model on never-used data","Serving predictions in production"],"e":"The **validation set** is used to **tune hyperparameters**, compare models, and detect overfitting during development. Weights are learned on the **training set**, and the **test set**, kept aside, provides a final, unbiased estimate of performance. Production data is not part of this split."}},{"n":59,"d":4,"a":["A"],"fr":{"q":"Un assureur utilise un agent d\u0027IA qui prépare des propositions d\u0027indemnisation, validées ensuite par un gestionnaire. Le régulateur exige de pouvoir comprendre a posteriori comment chaque proposition a été construite (documents consultés, outils appelés, étapes intermédiaires). Quelle approche répond le mieux à cette exigence de transparence ?","o":["Activer les traces d\u0027AgentCore Observability et conserver pour chaque décision les sources consultées et les appels d\u0027outils","Augmenter la température de l\u0027agent pour obtenir des justifications plus détaillées","Remplacer l\u0027agent par un modèle plus grand réputé plus fiable","Affiner un modèle pour encoder directement les règles d\u0027indemnisation dans ses poids"],"e":"**AgentCore Observability** fournit des **traces** détaillées de l\u0027exécution de l\u0027agent (étapes, appels d\u0027outils, sources, latences) : conservées avec chaque décision et combinées à la validation humaine, elles assurent la **traçabilité et la transparence** demandées. Une température plus élevée ou un modèle plus grand n\u0027expliquent rien, et encoder les règles dans les poids rend au contraire la décision plus opaque."},"en":{"q":"An insurer uses an AI agent that prepares claim settlement proposals, which are then approved by a claims handler. The regulator requires the ability to understand after the fact how each proposal was built (documents consulted, tools called, intermediate steps). Which approach BEST meets this transparency requirement?","o":["Enable AgentCore Observability traces and retain, for each decision, the sources consulted and the tool calls","Raise the agent\u0027s temperature to get more detailed justifications","Replace the agent with a larger model considered more reliable","Fine-tune a model to encode the settlement rules directly in its weights"],"e":"**AgentCore Observability** provides detailed **traces** of agent execution (steps, tool calls, sources, latencies): retained with each decision and combined with human approval, they deliver the required **traceability and transparency**. A higher temperature or a larger model explains nothing, and encoding rules in the weights makes the decision more opaque."}},{"n":60,"d":3,"a":["D"],"fr":{"q":"Une entreprise veut un assistant RAG sur Amazon Bedrock fondé sur ses documents internes, stockés dans Microsoft SharePoint et Atlassian Confluence. Elle veut éviter de développer et de maintenir un pipeline de copie vers Amazon S3. Quelle solution recommander pour un nouveau projet ?","o":["Exporter manuellement les documents vers S3 chaque semaine","Affiner un modèle sur l\u0027ensemble des pages SharePoint et Confluence","Créer un index Amazon Kendra avec ses connecteurs","Créer une Knowledge Base Amazon Bedrock avec les connecteurs de sources de données SharePoint et Confluence"],"e":"**Amazon Bedrock Knowledge Bases** propose des **connecteurs de sources de données** natifs (Amazon S3, web crawler, Confluence, SharePoint, Salesforce) qui ingèrent et synchronisent directement les contenus. Amazon Kendra est fermé aux nouveaux clients, avec Knowledge Bases comme remplaçant recommandé ; un export manuel est fastidieux ; un fine-tuning ne maintient pas les connaissances à jour et ne cite pas de sources."},"en":{"q":"A company wants a RAG assistant on Amazon Bedrock based on its internal documents, stored in Microsoft SharePoint and Atlassian Confluence. It wants to avoid building and maintaining a pipeline that copies them to Amazon S3. Which solution should be recommended for a new project?","o":["Manually export the documents to S3 every week","Fine-tune a model on all SharePoint and Confluence pages","Create an Amazon Kendra index with its connectors","Create an Amazon Bedrock Knowledge Base with the SharePoint and Confluence data source connectors"],"e":"**Amazon Bedrock Knowledge Bases** offers native **data source connectors** (Amazon S3, web crawler, Confluence, SharePoint, Salesforce) that ingest and sync content directly. Amazon Kendra is closed to new customers, with Knowledge Bases as the recommended replacement; a manual export is tedious; fine-tuning does not keep knowledge up to date and does not cite sources."}},{"n":61,"d":2,"a":["C"],"fr":{"q":"Une plateforme stocke 200 millions d\u0027embeddings produits avec Amazon Titan Text Embeddings V2 (1 024 dimensions par défaut). Elle veut réduire nettement le coût de stockage et accélérer la recherche, en acceptant une légère baisse de précision. Quelle option choisir ?","o":["Augmenter la température du modèle d\u0027embeddings","Passer à un modèle de génération de texte plus grand","Générer des embeddings de dimension réduite (512 ou 256), option proposée par Titan Text Embeddings V2","Supprimer le découpage des documents pour n\u0027avoir qu\u0027un vecteur par fichier"],"e":"**Titan Text Embeddings V2** permet de choisir la **dimension des vecteurs** (1 024, 512 ou 256) : des vecteurs plus courts occupent moins d\u0027espace et accélèrent la recherche, au prix d\u0027une légère perte de précision. La température ne s\u0027applique pas aux embeddings ; un modèle de génération ne change pas la taille des vecteurs ; un vecteur par fichier dégraderait fortement la qualité de la recherche."},"en":{"q":"A platform stores 200 million embeddings produced with Amazon Titan Text Embeddings V2 (1,024 dimensions by default). It wants to significantly reduce storage cost and speed up search, accepting a slight drop in accuracy. Which option should it choose?","o":["Raise the temperature of the embeddings model","Switch to a larger text generation model","Generate lower-dimension embeddings (512 or 256), an option offered by Titan Text Embeddings V2","Remove document chunking to have one vector per file"],"e":"**Titan Text Embeddings V2** lets you choose the **vector dimension** (1,024, 512, or 256): shorter vectors take less space and speed up search, at the cost of a slight loss of accuracy. Temperature does not apply to embeddings; a generation model does not change vector size; one vector per file would severely degrade search quality."}},{"n":62,"d":5,"a":["A","B"],"fr":{"q":"Un assureur active la journalisation des invocations Amazon Bedrock ; les journaux contiennent des prompts avec des données personnelles de clients. Quelles mesures de gouvernance sont appropriées pour ces journaux ? (Sélectionnez DEUX réponses.)","o":["Définir une durée de rétention conforme aux obligations légales et supprimer automatiquement les journaux au-delà (par exemple avec des règles de cycle de vie S3)","Classer ces journaux comme sensibles, les chiffrer avec AWS KMS et en restreindre l\u0027accès par IAM aux seules personnes habilitées","Conserver indéfiniment tous les journaux, sans exception, pour maximiser la traçabilité","Donner à tous les développeurs un accès en lecture aux journaux pour faciliter le débogage","Copier les journaux dans un bucket public pour que l\u0027auditeur externe puisse les consulter"],"e":"Une bonne gouvernance des données impose une **politique de rétention** (conserver le temps nécessaire, puis supprimer, par exemple via le **cycle de vie S3**) et une **protection adaptée à la sensibilité** : classification, chiffrement **KMS** et accès **IAM** au moindre privilège. Une conservation illimitée contredit la minimisation des données ; un accès large ou un bucket public expose des données personnelles."},"en":{"q":"An insurer enables Amazon Bedrock model invocation logging; the logs contain prompts with customers\u0027 personal data. Which governance measures are appropriate for these logs? (Select TWO.)","o":["Define a retention period that meets legal obligations and automatically delete logs beyond it (for example with S3 lifecycle rules)","Classify these logs as sensitive, encrypt them with AWS KMS, and restrict access through IAM to authorized people only","Keep all logs forever, without exception, to maximize traceability","Give every developer read access to the logs to make debugging easier","Copy the logs to a public bucket so that the external auditor can view them"],"e":"Good data governance requires a **retention policy** (keep data as long as necessary, then delete it, for example through **S3 lifecycle** rules) and **protection suited to its sensitivity**: classification, **KMS** encryption, and least-privilege **IAM** access. Unlimited retention contradicts data minimization; broad access or a public bucket exposes personal data."}},{"n":63,"d":1,"a":["A"],"fr":{"q":"Un hôpital veut extraire automatiquement, à partir de comptes rendus cliniques rédigés en texte libre, les médicaments, posologies, diagnostics et examens mentionnés, sans entraîner de modèle. Quel service AWS utiliser ?","o":["Amazon Comprehend Medical","Amazon Textract","Amazon Transcribe Medical","Amazon Rekognition"],"e":"**Amazon Comprehend Medical** utilise le NLP pour extraire des **entités médicales** (médicaments, posologies, pathologies, examens, informations de santé protégées) d\u0027un texte clinique non structuré. Textract extrait le texte de documents numérisés sans comprendre la terminologie médicale ; Transcribe Medical convertit la parole médicale en texte ; Rekognition analyse des images."},"en":{"q":"A hospital wants to automatically extract the medications, dosages, diagnoses, and tests mentioned in free-text clinical notes, without training a model. Which AWS service should it use?","o":["Amazon Comprehend Medical","Amazon Textract","Amazon Transcribe Medical","Amazon Rekognition"],"e":"**Amazon Comprehend Medical** uses NLP to extract **medical entities** (medications, dosages, conditions, tests, protected health information) from unstructured clinical text. Textract extracts text from scanned documents without understanding medical terminology; Transcribe Medical converts medical speech to text; Rekognition analyzes images."}},{"n":64,"d":3,"a":["C"],"fr":{"q":"Un service après-vente veut produire automatiquement, pour chaque appel enregistré, un résumé écrit de quelques lignes mentionnant le motif de l\u0027appel et les actions promises au client. Quelle combinaison de services convient ?","o":["Amazon Polly pour transcrire l\u0027appel, puis Amazon Comprehend pour le résumer","Amazon Translate pour transcrire l\u0027appel, puis Amazon Rekognition pour le résumer","Amazon Transcribe pour convertir l\u0027appel en texte, puis un modèle Amazon Bedrock pour rédiger le résumé","Amazon Lex pour transcrire l\u0027appel, puis Amazon Textract pour le résumer"],"e":"**Amazon Transcribe** convertit l\u0027audio en texte, puis un **modèle de fondation sur Amazon Bedrock** génère un **résumé** structuré à partir du prompt (motif, actions promises). Polly fait de la synthèse vocale, Translate traduit du texte, Rekognition analyse des images, Lex gère des dialogues et Textract extrait le texte de documents : aucun ne transcrit un appel enregistré ni ne rédige de résumé."},"en":{"q":"An after-sales department wants to automatically produce, for each recorded call, a written summary of a few lines stating the reason for the call and the actions promised to the customer. Which combination of services is appropriate?","o":["Amazon Polly to transcribe the call, then Amazon Comprehend to summarize it","Amazon Translate to transcribe the call, then Amazon Rekognition to summarize it","Amazon Transcribe to convert the call to text, then an Amazon Bedrock model to write the summary","Amazon Lex to transcribe the call, then Amazon Textract to summarize it"],"e":"**Amazon Transcribe** converts the audio to text, then a **foundation model on Amazon Bedrock** generates a structured **summary** from the prompt (reason, promised actions). Polly performs speech synthesis, Translate translates text, Rekognition analyzes images, Lex manages dialogs, and Textract extracts text from documents: none of them transcribes a recorded call or writes a summary."}},{"n":65,"d":4,"a":["B"],"fr":{"q":"Avant de lancer un assistant grand public fondé sur un LLM, une entreprise veut découvrir comment des utilisateurs malveillants pourraient lui faire produire des contenus dangereux, biaisés ou contraires à ses règles. Quelle pratique d\u0027IA responsable adopter ?","o":["Ne tester l\u0027assistant qu\u0027avec des questions bénignes représentatives de l\u0027usage normal","Mener des tests adverses (red teaming) avec des prompts conçus pour contourner les protections, puis corriger les failles","Augmenter la fenêtre de contexte du modèle pour qu\u0027il comprenne mieux les intentions","Désactiver les Guardrails pendant la phase de test pour mesurer les performances brutes du modèle"],"e":"Le **red teaming** consiste à **attaquer volontairement** le système (jailbreaks, injections, sujets sensibles, biais) avant sa mise en production pour identifier les failles et renforcer les protections (Guardrails, prompts, filtres). Ne tester que des cas bénins laisse passer les risques ; la fenêtre de contexte n\u0027apporte aucune protection ; désactiver les Guardrails ne permet pas de valider le comportement réel en production."},"en":{"q":"Before launching a consumer assistant based on an LLM, a company wants to discover how malicious users could make it produce dangerous, biased, or policy-violating content. Which responsible AI practice should it adopt?","o":["Test the assistant only with benign questions that represent normal usage","Conduct adversarial testing (red teaming) with prompts designed to bypass safeguards, then fix the weaknesses","Increase the model\u0027s context window so it better understands intentions","Disable guardrails during testing to measure the model\u0027s raw performance"],"e":"**Red teaming** means **deliberately attacking** the system (jailbreaks, injections, sensitive topics, bias) before going to production in order to identify weaknesses and strengthen safeguards (guardrails, prompts, filters). Testing only benign cases lets risks through; the context window provides no protection; disabling guardrails does not validate the actual production behavior."}}]},{"id":5,"title":{"fr":"Cycle de vie ML, métriques et SageMaker AI","en":"ML lifecycle, metrics and SageMaker AI"},"questions":[{"n":1,"d":1,"a":["B"],"fr":{"q":"La fintech fictive NovaPay évalue un modèle de détection de fraude sur 1 000 transactions de test. La matrice de confusion donne : 80 vrais positifs, 20 faux positifs, 40 faux négatifs et 860 vrais négatifs. Quel est le rappel (recall) du modèle ?","o":["0,80","Environ 0,67","0,94","Environ 0,73"],"e":"Le **rappel** = VP / (VP + FN) = 80 / (80 + 40) = 80 / 120 ≈ **0,67** : le modèle détecte deux fraudes sur trois.\n- 0,80 est la **précision** = VP / (VP + FP) = 80 / 100.\n- 0,94 est l\u0027**accuracy** = (80 + 860) / 1 000.\n- 0,73 est le **score F1** = 2 × 0,80 × 0,67 / (0,80 + 0,67)."},"en":{"q":"A fictional fintech, NovaPay, evaluates a fraud detection model on 1,000 test transactions. The confusion matrix shows: 80 true positives, 20 false positives, 40 false negatives, and 860 true negatives. What is the model\u0027s recall?","o":["0.80","Approximately 0.67","0.94","Approximately 0.73"],"e":"**Recall** = TP / (TP + FN) = 80 / (80 + 40) = 80 / 120 ≈ **0.67**: the model catches two out of three fraud cases.\n- 0.80 is the **precision** = TP / (TP + FP) = 80 / 100.\n- 0.94 is the **accuracy** = (80 + 860) / 1,000.\n- 0.73 is the **F1 score** = 2 × 0.80 × 0.67 / (0.80 + 0.67)."}},{"n":2,"d":3,"a":["C"],"fr":{"q":"Un cabinet juridique fictif évalue un modèle qui résume des contrats. Pour un document, le résumé de référence rédigé par un avocat contient 10 unigrammes ; le résumé généré en contient 8, dont 6 figurent aussi dans la référence. Quel est le rappel ROUGE-1 de ce résumé ?","o":["0,75","0,80","0,60","Environ 0,67"],"e":"Le **rappel ROUGE-1** = unigrammes communs / unigrammes de la référence = 6 / 10 = **0,60**. ROUGE est orienté rappel : il mesure la part du contenu de référence retrouvée dans le résumé.\n- 0,75 est la précision ROUGE-1 (6 / 8).\n- 0,67 est la F-mesure combinant les deux (2 × 0,60 × 0,75 / 1,35).\n- 0,80 n\u0027est que le rapport des longueurs (8 / 10)."},"en":{"q":"A fictional law firm evaluates a model that summarizes contracts. For one document, the reference summary written by a lawyer contains 10 unigrams; the generated summary contains 8, of which 6 also appear in the reference. What is the ROUGE-1 recall of this summary?","o":["0.75","0.80","0.60","Approximately 0.67"],"e":"**ROUGE-1 recall** = overlapping unigrams / unigrams in the reference = 6 / 10 = **0.60**. ROUGE is recall-oriented: it measures how much of the reference content is found in the summary.\n- 0.75 is the ROUGE-1 precision (6 / 8).\n- 0.67 is the F-measure combining both (2 × 0.60 × 0.75 / 1.35).\n- 0.80 is merely the length ratio (8 / 10)."}},{"n":3,"d":2,"a":["A"],"fr":{"q":"Une application de support utilise un modèle facturé 0,003 $ pour 1 000 tokens d\u0027entrée et 0,015 $ pour 1 000 tokens de sortie. Chaque requête envoie en moyenne 2 000 tokens d\u0027entrée et reçoit 500 tokens de sortie. L\u0027application traite 10 000 requêtes par jour. Quel est le coût quotidien estimé de l\u0027inférence ?","o":["135 $","60 $","75 $","375 $"],"e":"Le coût d\u0027un modèle facturé au token combine **entrée + sortie** : par requête, 2 × 0,003 $ = 0,006 $ (entrée) + 0,5 × 0,015 $ = 0,0075 $ (sortie) = 0,0135 $, soit **135 $** pour 10 000 requêtes.\n- 60 $ ne compte que les tokens d\u0027entrée et 75 $ que les tokens de sortie.\n- 375 $ applique à tort le tarif de sortie aux 2 500 tokens."},"en":{"q":"A support application uses a model priced at $0.003 per 1,000 input tokens and $0.015 per 1,000 output tokens. Each request sends 2,000 input tokens and receives 500 output tokens on average. The application handles 10,000 requests per day. What is the estimated daily inference cost?","o":["$135","$60","$75","$375"],"e":"Token-based pricing combines **input + output**: per request, 2 × $0.003 = $0.006 (input) + 0.5 × $0.015 = $0.0075 (output) = $0.0135, so **$135** for 10,000 requests.\n- $60 counts only input tokens and $75 only output tokens.\n- $375 wrongly applies the output rate to all 2,500 tokens."}},{"n":4,"d":1,"a":["D"],"fr":{"q":"La chaîne fictive Fournil\u0026Co prévoit ses ventes quotidiennes de baguettes. Sur quatre jours de test, les erreurs (prédiction − réel) sont : +2, −4, 0 et +6 unités. Quelle est l\u0027erreur absolue moyenne (MAE) du modèle ?","o":["1","14","Environ 3,74","3"],"e":"La **MAE** est la moyenne des valeurs absolues des erreurs : (2 + 4 + 0 + 6) / 4 = **3** unités, exprimée dans l\u0027unité de la cible.\n- 1 est la moyenne des erreurs signées : les erreurs se compensent, ce n\u0027est pas une mesure de performance fiable.\n- 14 est la **MSE** = (4 + 16 + 0 + 36) / 4.\n- 3,74 est la **RMSE** = √14, qui pénalise davantage les grosses erreurs."},"en":{"q":"A fictional bakery chain, Fournil\u0026Co, forecasts its daily baguette sales. Over four test days, the errors (prediction − actual) are +2, −4, 0, and +6 units. What is the model\u0027s mean absolute error (MAE)?","o":["1","14","Approximately 3.74","3"],"e":"**MAE** is the average of the absolute errors: (2 + 4 + 0 + 6) / 4 = **3** units, expressed in the target\u0027s unit.\n- 1 is the mean of the signed errors: errors cancel each other out, so it is not a reliable performance measure.\n- 14 is the **MSE** = (4 + 16 + 0 + 36) / 4.\n- 3.74 is the **RMSE** = √14, which penalizes large errors more heavily."}},{"n":5,"d":3,"a":["C"],"fr":{"q":"Une compagnie d\u0027assurance veut comparer trois modèles de fondation disponibles dans Amazon Bedrock sur une tâche de résumé, en utilisant ses propres prompts métier, et obtenir des scores automatiques de précision, de robustesse et de toxicité. Quelle solution répond à ces exigences avec le MOINS d\u0027effort opérationnel ?","o":["Lancer des évaluations de modèles de fondation avec SageMaker Clarify","Créer un job d\u0027évaluation humaine Bedrock et recruter des annotateurs","Créer un job d\u0027évaluation automatique Amazon Bedrock avec un jeu de prompts personnalisé en JSONL dans S3","Développer des fonctions Lambda qui appellent chaque modèle et calculent les scores"],"e":"Les **évaluations automatiques de modèles Amazon Bedrock** acceptent un jeu de prompts personnalisé (JSONL dans S3) et calculent sans code des métriques intégrées de **précision, robustesse et toxicité** pour chaque modèle.\n- SageMaker Clarify est fermé aux nouveaux clients.\n- Une évaluation humaine est plus lente et plus coûteuse, et inutile pour des métriques automatiques.\n- Des fonctions Lambda maison demandent beaucoup plus de développement et de maintenance."},"en":{"q":"An insurance company wants to compare three foundation models available in Amazon Bedrock on a summarization task, using its own business prompts, and obtain automatic accuracy, robustness, and toxicity scores. Which solution meets these requirements with the LEAST operational overhead?","o":["Run foundation model evaluations with SageMaker Clarify","Create a Bedrock human evaluation job and recruit annotators","Create an Amazon Bedrock automatic evaluation job with a custom JSONL prompt dataset in S3","Develop Lambda functions that call each model and compute the scores"],"e":"**Amazon Bedrock automatic model evaluations** accept a custom prompt dataset (JSONL in S3) and compute built-in **accuracy, robustness, and toxicity** metrics for each model without code.\n- SageMaker Clarify is closed to new customers.\n- Human evaluation is slower and more expensive, and unnecessary for automatic metrics.\n- Custom Lambda functions require much more development and maintenance."}},{"n":6,"d":5,"a":["A"],"fr":{"q":"Une banque exige qu\u0027aucun nouveau modèle de scoring ne soit déployé en production sans l\u0027approbation explicite d\u0027un responsable des risques, et veut conserver l\u0027historique de toutes les versions avec leurs métriques d\u0027évaluation. Quelle fonctionnalité de SageMaker AI répond à ce besoin ?","o":["SageMaker Model Registry, avec un statut d\u0027approbation par version de modèle","SageMaker Experiments, avec un tableau de comparaison des runs","SageMaker Feature Store, avec un groupe de features par version","SageMaker Data Wrangler, avec un rapport de qualité des données"],"e":"**SageMaker Model Registry** catalogue les modèles en groupes de packages versionnés, associe métriques et métadonnées à chaque version et gère un **statut d\u0027approbation** (en attente, approuvé, rejeté) qui peut conditionner le déploiement en CI/CD.\n- Experiments suit les runs d\u0027entraînement mais ne gère pas d\u0027approbation.\n- Feature Store stocke des features, pas des modèles.\n- Data Wrangler sert à la préparation des données."},"en":{"q":"A bank requires that no new scoring model be deployed to production without explicit approval from a risk officer, and wants to keep the history of every version along with its evaluation metrics. Which SageMaker AI feature meets this need?","o":["SageMaker Model Registry, with an approval status for each model version","SageMaker Experiments, with a run comparison table","SageMaker Feature Store, with one feature group per version","SageMaker Data Wrangler, with a data quality report"],"e":"**SageMaker Model Registry** catalogs models in versioned model package groups, attaches metrics and metadata to each version, and manages an **approval status** (pending, approved, rejected) that can gate deployment in CI/CD.\n- Experiments tracks training runs but does not manage approvals.\n- Feature Store stores features, not models.\n- Data Wrangler is for data preparation."}},{"n":7,"d":2,"a":["B"],"fr":{"q":"Pendant le pré-entraînement d\u0027un grand modèle de langage, une équipe suit la perplexité sur un jeu de validation. Que signifie une baisse régulière de la perplexité ?","o":["Le modèle produit des réponses plus variées et plus créatives","Le modèle attribue une probabilité plus élevée aux textes réels et prédit mieux le token suivant","Le modèle hallucine davantage car il devient trop sûr de lui","La fenêtre de contexte du modèle s\u0027agrandit au fil de l\u0027entraînement"],"e":"La **perplexité** mesure à quel point un modèle de langage est « surpris » par un texte : plus elle est basse, plus le modèle attribue une probabilité élevée aux séquences réelles, donc mieux il **prédit le token suivant**.\n- La variété des réponses dépend surtout des paramètres d\u0027inférence (température, top-p).\n- Une perplexité plus basse n\u0027indique pas davantage d\u0027hallucinations.\n- La fenêtre de contexte est fixée par l\u0027architecture, pas par la perte d\u0027entraînement."},"en":{"q":"During the pre-training of a large language model, a team tracks perplexity on a validation set. What does a steady decrease in perplexity indicate?","o":["The model produces more varied and creative responses","The model assigns higher probability to real text and better predicts the next token","The model hallucinates more because it becomes overconfident","The model\u0027s context window grows as training progresses"],"e":"**Perplexity** measures how ‘surprised’ a language model is by text: the lower it is, the higher the probability the model assigns to real sequences, so the better it **predicts the next token**.\n- Response variety depends mainly on inference parameters (temperature, top-p).\n- Lower perplexity does not mean more hallucinations.\n- The context window is fixed by the architecture, not by the training loss."}},{"n":8,"d":1,"a":["A","C"],"fr":{"q":"Un data scientist prépare l\u0027entraînement d\u0027un réseau de neurones. Quels éléments sont des hyperparamètres qu\u0027il doit définir AVANT l\u0027entraînement ? (Sélectionnez DEUX réponses.)","o":["Le taux d\u0027apprentissage (learning rate)","Les poids des connexions entre les neurones","Le nombre d\u0027époques d\u0027entraînement","Les biais (bias terms) appris par chaque neurone","Les probabilités prédites sur le jeu de test"],"e":"Les **hyperparamètres** sont des réglages choisis avant l\u0027entraînement qui pilotent l\u0027apprentissage : **taux d\u0027apprentissage**, **nombre d\u0027époques**, taille de lot, nombre de couches… On les optimise par réglage des hyperparamètres (par ex. le réglage automatique de modèles de SageMaker AI).\n- Les poids et les biais sont des **paramètres** appris pendant l\u0027entraînement.\n- Les probabilités prédites sont des sorties du modèle, pas des réglages."},"en":{"q":"A data scientist is preparing to train a neural network. Which items are hyperparameters that must be set BEFORE training? (Select TWO.)","o":["The learning rate","The weights of the connections between neurons","The number of training epochs","The bias terms learned by each neuron","The predicted probabilities on the test set"],"e":"**Hyperparameters** are settings chosen before training that control the learning process: **learning rate**, **number of epochs**, batch size, number of layers, and so on. They are optimized through hyperparameter tuning (for example, SageMaker AI automatic model tuning).\n- Weights and biases are **parameters** learned during training.\n- Predicted probabilities are model outputs, not settings."}},{"n":9,"d":3,"a":["D"],"fr":{"q":"Un éditeur de logiciels veut qu\u0027un modèle d\u0027Amazon Bedrock rédige les réponses aux tickets de support dans son format et son ton maison. Il dispose de 6 000 tickets historiques accompagnés de la réponse validée par un expert. Comment doit-il préparer ces données pour un fine-tuning ?","o":["Déposer les tickets bruts, sans les réponses, dans S3 pour un continued pre-training","Convertir les tickets en embeddings et les charger dans une base vectorielle","Indexer les tickets dans une Knowledge Base et lancer une synchronisation","Créer un fichier JSONL dans S3 dont chaque ligne contient une paire prompt / réponse attendue"],"e":"Le **fine-tuning** est un apprentissage supervisé : il nécessite des **données étiquetées** au format **JSONL** dans S3, chaque enregistrement associant une entrée (prompt) à la sortie attendue (completion). Il convient pour imposer un style, un ton ou un format.\n- Le continued pre-training utilise des données non étiquetées pour l\u0027adaptation au vocabulaire d\u0027un domaine.\n- Embeddings et Knowledge Bases relèvent du RAG, qui apporte des connaissances mais n\u0027apprend pas un format de réponse au modèle."},"en":{"q":"A software vendor wants an Amazon Bedrock model to write support ticket replies in its in-house format and tone. It has 6,000 historical tickets, each with an expert-validated reply. How should it prepare this data for fine-tuning?","o":["Upload the raw tickets, without replies, to S3 for continued pre-training","Convert the tickets into embeddings and load them into a vector database","Index the tickets in a knowledge base and run a sync","Create a JSONL file in S3 where each line contains a prompt / expected response pair"],"e":"**Fine-tuning** is supervised learning: it requires **labeled data** in **JSONL** format in S3, with each record pairing an input (prompt) with the expected output (completion). It is suited to enforcing a style, tone, or format.\n- Continued pre-training uses unlabeled data to adapt to a domain’s vocabulary.\n- Embeddings and knowledge bases are part of RAG, which supplies knowledge but does not teach the model a response format."}},{"n":10,"d":4,"a":["A"],"fr":{"q":"Un modèle d\u0027octroi de crédit affiche une accuracy globale de 91 %. L\u0027équipe conformité soupçonne qu\u0027il commet beaucoup plus d\u0027erreurs pour les demandeurs de moins de 25 ans. SageMaker Clarify n\u0027étant plus proposé aux nouveaux clients, quelle approche permet de vérifier ce soupçon ?","o":["Calculer rappel et taux de faux positifs et négatifs pour chaque tranche d\u0027âge, puis analyser les valeurs SHAP","Supprimer la colonne âge du jeu de données, ce qui suffit à garantir un modèle équitable","Augmenter le nombre d\u0027époques jusqu\u0027à ce que l\u0027accuracy globale dépasse 95 %","Se fier à l\u0027accuracy globale, car une valeur supérieure à 90 % exclut tout biais"],"e":"Une **analyse par sous-groupe** (métriques calculées pour chaque tranche d\u0027âge) révèle les écarts de performance masqués par une métrique globale ; la bibliothèque open source **SHAP** aide ensuite à comprendre quelles variables expliquent ces écarts.\n- Retirer l\u0027attribut sensible ne suffit pas : d\u0027autres variables (ancienneté, revenus) peuvent servir de proxy.\n- Une accuracy globale élevée peut coexister avec de fortes disparités entre groupes, et plus d\u0027époques n\u0027y change rien."},"en":{"q":"A credit approval model shows an overall accuracy of 91%. The compliance team suspects it makes far more errors for applicants under 25. Because SageMaker Clarify is no longer available to new customers, which approach can verify this suspicion?","o":["Compute recall and false positive/negative rates for each age band, then analyze SHAP values","Remove the age column from the dataset, which alone guarantees a fair model","Increase the number of epochs until overall accuracy exceeds 95%","Rely on overall accuracy, because a value above 90% rules out any bias"],"e":"A **subgroup analysis** (metrics computed for each age band) reveals performance gaps hidden by an aggregate metric; the open-source **SHAP** library then helps explain which features drive those gaps.\n- Removing the sensitive attribute is not enough: other features (tenure, income) can act as proxies.\n- High overall accuracy can coexist with large disparities between groups, and more epochs do not change that."}},{"n":11,"d":3,"a":["C"],"fr":{"q":"Un site d\u0027e-commerce doit générer chaque nuit des descriptions pour 2 millions de fiches produits avec un modèle d\u0027Amazon Bedrock. Aucun résultat n\u0027est attendu en temps réel. Quelle option minimise le coût ?","o":["Acheter du Provisioned Throughput avec un engagement d\u0027un mois","Appeler l\u0027API InvokeModel à la demande dans une boucle depuis AWS Lambda","Soumettre un job d\u0027inférence par lots Bedrock avec les prompts en JSONL dans S3","Déployer le modèle sur un endpoint temps réel SageMaker AI avec auto scaling"],"e":"L\u0027**inférence par lots (batch inference) d\u0027Amazon Bedrock** traite de gros volumes de prompts de manière asynchrone (entrées et sorties dans S3) à un **tarif réduit** par rapport à l\u0027inférence à la demande, idéal pour un traitement nocturne sans contrainte de latence.\n- Provisioned Throughput vise un débit garanti et constant : c\u0027est un engagement coûteux pour un traitement ponctuel.\n- Des appels à la demande en boucle coûtent plus cher et se heurtent aux quotas de débit.\n- Un endpoint temps réel ajoute un coût d\u0027infrastructure permanent inutile."},"en":{"q":"An e-commerce site must generate descriptions for 2 million product pages every night with an Amazon Bedrock model. No real-time results are needed. Which option minimizes cost?","o":["Purchase Provisioned Throughput with a one-month commitment","Call the InvokeModel API on demand in a loop from AWS Lambda","Submit a Bedrock batch inference job with the prompts in JSONL in S3","Deploy the model to a SageMaker AI real-time endpoint with auto scaling"],"e":"**Amazon Bedrock batch inference** processes large volumes of prompts asynchronously (inputs and outputs in S3) at a **discounted price** compared with on-demand inference, ideal for nightly processing with no latency constraint.\n- Provisioned Throughput targets guaranteed, constant throughput: an expensive commitment for a periodic job.\n- On-demand calls in a loop cost more and run into throughput quotas.\n- A real-time endpoint adds unnecessary always-on infrastructure cost."}},{"n":12,"d":2,"a":["D"],"fr":{"q":"Pour illustrer la recherche sémantique, un formateur utilise deux embeddings simplifiés à deux dimensions : A = (3, 4) et B = (4, 3). Quelle est la similarité cosinus entre A et B ?","o":["24","1,00","0,04","0,96"],"e":"La **similarité cosinus** = (A · B) / (‖A‖ × ‖B‖) = (3×4 + 4×3) / (5 × 5) = 24 / 25 = **0,96** : les vecteurs pointent presque dans la même direction, les contenus sont donc sémantiquement très proches.\n- 24 est le produit scalaire non normalisé.\n- 1,00 correspondrait à des vecteurs de même direction.\n- 0,04 est la distance cosinus (1 − similarité)."},"en":{"q":"To illustrate semantic search, an instructor uses two simplified two-dimensional embeddings: A = (3, 4) and B = (4, 3). What is the cosine similarity between A and B?","o":["24","1.00","0.04","0.96"],"e":"**Cosine similarity** = (A · B) / (‖A‖ × ‖B‖) = (3×4 + 4×3) / (5 × 5) = 24 / 25 = **0.96**: the vectors point in almost the same direction, so the contents are semantically very close.\n- 24 is the unnormalized dot product.\n- 1.00 would mean vectors pointing in exactly the same direction.\n- 0.04 is the cosine distance (1 − similarity)."}},{"n":13,"d":1,"a":["B"],"fr":{"q":"Un opérateur télécom a entraîné en 2025 un modèle de prédiction de l\u0027attrition. Six mois après le lancement d\u0027une nouvelle offre 100 % mobile, le rappel du modèle passe de 0,82 à 0,61 et la répartition des clients par canal de souscription a fortement changé. Quel phénomène est en cause et quelle est la réponse appropriée ?","o":["Un sur-apprentissage ; il faut augmenter la régularisation du modèle existant","Une dérive des données ; il faut réentraîner sur des données récentes et surveiller les entrées","Un sous-apprentissage ; il faut remplacer le modèle par un réseau plus profond","Une fuite de données ; il faut retirer la variable canal du jeu d\u0027entraînement"],"e":"La distribution des données de production s\u0027est éloignée de celle des données d\u0027entraînement : c\u0027est une **dérive des données (data drift)**. Il faut **réentraîner** sur des données récentes et mettre en place une **surveillance continue** (par ex. métriques suivies avec MLflow et alarmes Amazon CloudWatch) pour déclencher les prochains réentraînements.\n- Sur- et sous-apprentissage se constatent dès l\u0027évaluation initiale, pas après un changement du marché.\n- Une fuite de données gonfle les scores de test ; elle n\u0027explique pas une dégradation progressive."},"en":{"q":"A telecom operator trained a churn prediction model in 2025. Six months after launching a new mobile-only offer, the model’s recall drops from 0.82 to 0.61, and the breakdown of customers by subscription channel has changed sharply. What is the cause, and what is the appropriate response?","o":["Overfitting; increase regularization of the existing model","Data drift; retrain on recent data and monitor the input distribution","Underfitting; replace the model with a deeper network","Data leakage; remove the channel feature from the training set"],"e":"The distribution of production data has moved away from the training data: this is **data drift**. The model should be **retrained** on recent data, and **continuous monitoring** (for example, metrics tracked with MLflow and Amazon CloudWatch alarms) should trigger future retraining.\n- Overfitting and underfitting show up in the initial evaluation, not after a market change.\n- Data leakage inflates test scores; it does not explain gradual degradation."}},{"n":14,"d":5,"a":["A"],"fr":{"q":"Un hôpital entraîne un modèle sur SageMaker AI avec des données de patients stockées dans S3. Le RSSI exige que le conteneur d\u0027entraînement n\u0027ait aucun accès à Internet et que les données ne transitent pas par l\u0027Internet public. Quelle configuration répond à ces exigences ?","o":["Exécuter le job dans des sous-réseaux privés d\u0027un VPC avec isolation réseau et accéder à S3 via un VPC endpoint","Activer Amazon Macie sur le bucket pour qu\u0027il bloque tout trafic sortant vers Internet","Chiffrer les données avec SSE-S3 et lancer le job sans aucune configuration VPC","Exécuter l\u0027entraînement sur un endpoint SageMaker Serverless Inference hors VPC"],"e":"Un job d\u0027entraînement en **mode VPC** (sous-réseaux privés) avec l\u0027**isolation réseau** activée ne peut effectuer aucun appel sortant, et un **VPC endpoint S3** maintient le trafic sur le réseau AWS ; un chiffrement **AWS KMS** complète le dispositif.\n- Macie découvre les données sensibles, il ne filtre pas le trafic réseau.\n- Le chiffrement au repos seul ne contrôle pas l\u0027accès réseau du conteneur.\n- Serverless Inference sert à l\u0027inférence, pas à l\u0027entraînement."},"en":{"q":"A hospital trains a model on SageMaker AI using patient data stored in S3. The CISO requires that the training container have no internet access and that the data never traverse the public internet. Which configuration meets these requirements?","o":["Run the job in private VPC subnets with network isolation and access S3 through a VPC endpoint","Enable Amazon Macie on the bucket so that it blocks all outbound internet traffic","Encrypt the data with SSE-S3 and run the job without any VPC configuration","Run the training on a SageMaker Serverless Inference endpoint outside a VPC"],"e":"A training job in **VPC mode** (private subnets) with **network isolation** enabled cannot make outbound calls, and an **S3 VPC endpoint** keeps traffic on the AWS network; **AWS KMS** encryption completes the setup.\n- Macie discovers sensitive data; it does not filter network traffic.\n- Encryption at rest alone does not control the container’s network access.\n- Serverless Inference is for inference, not training."}},{"n":15,"d":3,"a":["B","E"],"fr":{"q":"Une application mobile doit classer en temps réel de courts messages texte de clients dans cinq catégories. Les priorités sont une latence faible et un coût par requête minimal. Quelles actions aident l\u0027équipe à choisir le modèle de fondation adapté ? (Sélectionnez DEUX réponses.)","o":["Choisir d\u0027office le modèle comptant le plus de paramètres disponible dans Bedrock","Présélectionner Amazon Nova Micro, modèle texte seul optimisé pour la vitesse et le coût","Présélectionner Amazon Nova Reel pour ses capacités de génération multimodale","Choisir le modèle ayant la plus grande fenêtre de contexte, quel que soit son prix","Comparer les candidats sur un jeu de messages représentatif avec une évaluation de modèles Bedrock"],"e":"Le choix d\u0027un modèle part des exigences (modalité, latence, coût, qualité) puis se **valide par l\u0027évaluation** : **Amazon Nova Micro**, texte seul, est le modèle Nova le plus rapide et le moins cher, et une **évaluation de modèles Amazon Bedrock** sur des données représentatives confirme que sa qualité suffit.\n- Le plus grand modèle ou la plus grande fenêtre de contexte augmentent coût et latence sans bénéfice pour de courts messages.\n- Nova Reel génère des vidéos, ce qui est hors sujet."},"en":{"q":"A mobile app must classify short customer text messages into five categories in real time. The priorities are low latency and minimal cost per request. Which actions help the team select the right foundation model? (Select TWO.)","o":["Automatically choose the model with the most parameters available in Bedrock","Shortlist Amazon Nova Micro, a text-only model optimized for speed and cost","Shortlist Amazon Nova Reel for its multimodal generation capabilities","Choose the model with the largest context window, regardless of price","Compare the candidates on a representative message set with a Bedrock model evaluation"],"e":"Model selection starts from the requirements (modality, latency, cost, quality) and is then **validated through evaluation**: **Amazon Nova Micro**, text-only, is the fastest and lowest-cost Nova model, and an **Amazon Bedrock model evaluation** on representative data confirms its quality is sufficient.\n- The largest model or the largest context window increases cost and latency with no benefit for short messages.\n- Nova Reel generates video, which is irrelevant here."}},{"n":16,"d":2,"a":["C"],"fr":{"q":"Le cycle de vie d\u0027un modèle de fondation comprend plusieurs étapes. Une fois le pré-entraînement auto-supervisé sur un vaste corpus terminé, quelle étape intervient ensuite, avant le déploiement ?","o":["La sélection et la collecte des données de pré-entraînement","La collecte des retours des utilisateurs en production","L\u0027optimisation (fine-tuning, alignement) puis l\u0027évaluation du modèle","La définition initiale du cas d\u0027usage métier et du budget"],"e":"Le cycle de vie d\u0027un modèle de fondation enchaîne : sélection des données → pré-entraînement → **optimisation** (fine-tuning, alignement par exemple RLHF) → **évaluation** → déploiement → collecte de feedback qui alimente les itérations suivantes.\n- La sélection des données et la définition du cas d\u0027usage précèdent le pré-entraînement.\n- Le feedback des utilisateurs n\u0027existe qu\u0027après le déploiement."},"en":{"q":"A foundation model’s lifecycle includes several stages. Once self-supervised pre-training on a massive corpus is complete, which stage comes next, before deployment?","o":["Selecting and collecting the pre-training data","Collecting user feedback in production","Optimization (fine-tuning, alignment) followed by model evaluation","Initially defining the business use case and budget"],"e":"A foundation model’s lifecycle runs: data selection → pre-training → **optimization** (fine-tuning, alignment such as RLHF) → **evaluation** → deployment → feedback that feeds the next iterations.\n- Data selection and use case definition come before pre-training.\n- User feedback only exists after deployment."}},{"n":17,"d":4,"a":["B"],"fr":{"q":"Un client conteste le refus de sa demande de prêt et le régulateur demande à la banque d\u0027expliquer quels facteurs ont pesé dans CETTE décision précise. Quelle technique d\u0027explicabilité est la plus appropriée ?","o":["Un graphique de dépendance partielle (PDP) montrant l\u0027effet moyen de chaque variable","Les valeurs SHAP calculées pour cette prédiction individuelle","La matrice de confusion du modèle sur le jeu de test","La courbe ROC et l\u0027AUC du modèle sur les données de validation"],"e":"Les **valeurs SHAP** fournissent une **explication locale** : elles quantifient la contribution de chaque variable (revenus, endettement…) à une prédiction particulière, ce qui permet de justifier une décision individuelle.\n- Le **PDP** donne une vision **globale** de l\u0027effet moyen d\u0027une variable sur l\u0027ensemble des prédictions.\n- Matrice de confusion et AUC mesurent la performance globale, pas les raisons d\u0027une décision."},"en":{"q":"A customer disputes the rejection of their loan application, and the regulator asks the bank to explain which factors drove THAT specific decision. Which explainability technique is most appropriate?","o":["A partial dependence plot (PDP) showing the average effect of each feature","SHAP values computed for this individual prediction","The model’s confusion matrix on the test set","The model’s ROC curve and AUC on the validation data"],"e":"**SHAP values** provide a **local explanation**: they quantify each feature’s contribution (income, debt, and so on) to a particular prediction, which makes it possible to justify an individual decision.\n- A **PDP** gives a **global** view of a feature’s average effect across all predictions.\n- The confusion matrix and AUC measure overall performance, not the reasons for a decision."}},{"n":18,"d":1,"a":["D"],"fr":{"q":"Un laboratoire d\u0027imagerie envoie au fil de l\u0027eau des images de microscopie d\u0027environ 600 Mo à un modèle SageMaker AI. Chaque analyse dure 15 à 25 minutes, les résultats peuvent être récupérés plus tard et l\u0027infrastructure doit pouvoir descendre à zéro instance en l\u0027absence de requêtes. Quelle option de déploiement convient ?","o":["Un endpoint d\u0027inférence temps réel avec auto scaling","Un endpoint SageMaker Serverless Inference","Un job SageMaker Batch Transform planifié chaque nuit","Un endpoint SageMaker Asynchronous Inference"],"e":"L\u0027**inférence asynchrone** de SageMaker AI met les requêtes en file d\u0027attente, accepte des **payloads jusqu\u0027à 1 Go** et des **traitements jusqu\u0027à environ 1 heure**, dépose les résultats dans S3 et peut **réduire le nombre d\u0027instances à zéro**.\n- L\u0027endpoint temps réel vise des réponses en quelques secondes sur de petits payloads.\n- Serverless Inference est limité à de petits payloads et à des traitements courts.\n- Batch Transform traite un jeu complet hors ligne, pas des requêtes arrivant au fil de l\u0027eau."},"en":{"q":"An imaging lab continuously sends microscopy images of about 600 MB to a SageMaker AI model. Each analysis takes 15 to 25 minutes, results can be retrieved later, and the infrastructure must be able to scale down to zero instances when there are no requests. Which deployment option fits?","o":["A real-time inference endpoint with auto scaling","A SageMaker Serverless Inference endpoint","A SageMaker Batch Transform job scheduled every night","A SageMaker Asynchronous Inference endpoint"],"e":"SageMaker AI **Asynchronous Inference
