sarily."}},{"n":62,"d":2,"a":["B","C"],"fr":{"q":"Quels avantages offre l\u0027utilisation d\u0027un modèle de fondation pré-entraîné via Amazon Bedrock par rapport à l\u0027entraînement d\u0027un modèle de langage à partir de zéro ? (Sélectionnez DEUX réponses.)","o":["La garantie qu\u0027aucune réponse ne contiendra d\u0027hallucination","Une mise en production plus rapide, sans infrastructure d\u0027entraînement à gérer","Un paiement à l\u0027usage, sans investissement initial en calcul d\u0027entraînement","Une explicabilité complète de chaque réponse générée","Un contrôle total sur la composition des données de pré-entraînement"],"e":"Un modèle pré-entraîné consommé via **Amazon Bedrock** (serverless) accélère le **time-to-market** et se paie **à l\u0027usage** (tokens), sans les coûts considérables de collecte de données et de calcul d\u0027un entraînement de zéro.\n- Aucun modèle de fondation ne garantit l\u0027absence d\u0027hallucinations ni une explicabilité complète.\n- Le contrôle total des données de pré-entraînement n\u0027existe qu\u0027en entraînant son propre modèle."},"en":{"q":"What advantages does using a pre-trained foundation model through Amazon Bedrock offer compared with training a language model from scratch? (Select TWO.)","o":["A guarantee that no response will contain a hallucination","Faster time to production, with no training infrastructure to manage","Pay-as-you-go pricing, with no upfront investment in training compute","Complete explainability of every generated response","Full control over the composition of the pre-training data"],"e":"A pre-trained model consumed through **Amazon Bedrock** (serverless) speeds up **time to market** and is paid **per use** (tokens), without the considerable data collection and compute costs of training from scratch.\n- No foundation model guarantees zero hallucinations or complete explainability.\n- Full control over pre-training data only comes from training your own model."}},{"n":63,"d":5,"a":["B"],"fr":{"q":"Une entreprise prépare un audit de ses usages de l\u0027IA générative sur Amazon Bedrock et SageMaker AI. Elle veut collecter automatiquement et en continu des preuves de conformité, organisées selon un référentiel de bonnes pratiques. Quel service utiliser ?","o":["AWS Artifact","AWS Audit Manager","Amazon Inspector","Amazon CloudWatch"],"e":"**AWS Audit Manager** collecte en continu des **preuves** (configurations, journaux d\u0027activité) et les organise selon des **frameworks**, dont un framework de bonnes pratiques pour l\u0027IA générative, afin de préparer les audits.\n- AWS Artifact permet de télécharger les rapports de conformité d\u0027AWS, pas de collecter des preuves sur vos propres usages.\n- Inspector analyse les vulnérabilités.\n- CloudWatch surveille métriques et journaux sans les organiser en référentiel d\u0027audit."},"en":{"q":"A company is preparing an audit of its generative AI usage on Amazon Bedrock and SageMaker AI. It wants to automatically and continuously collect compliance evidence, organized according to a best-practice framework. Which service should it use?","o":["AWS Artifact","AWS Audit Manager","Amazon Inspector","Amazon CloudWatch"],"e":"**AWS Audit Manager** continuously collects **evidence** (configurations, activity logs) and organizes it according to **frameworks**, including a generative AI best-practices framework, to prepare for audits.\n- AWS Artifact lets you download AWS compliance reports, not collect evidence about your own usage.\n- Inspector scans for vulnerabilities.\n- CloudWatch monitors metrics and logs without organizing them into an audit framework."}},{"n":64,"d":2,"a":["D"],"fr":{"q":"Comment les grands modèles de langage sont-ils pré-entraînés sur d\u0027immenses corpus de textes sans que des humains aient à étiqueter les données ?","o":["Par apprentissage supervisé sur des paires question / réponse annotées","Par apprentissage par renforcement uniquement, à partir de récompenses humaines","Par clustering des documents avec l\u0027algorithme K-means","Par apprentissage auto-supervisé, en prédisant le token suivant à partir du texte lui-même"],"e":"Le pré-entraînement des LLM est **auto-supervisé** : les étiquettes sont tirées du texte lui-même (prédire le **token suivant** ou un token masqué), ce qui permet d\u0027exploiter des volumes massifs de données non annotées.\n- L\u0027apprentissage supervisé (fine-tuning) et le RLHF interviennent ensuite, sur des volumes plus faibles.\n- K-means regroupe des données mais n\u0027apprend pas à générer du texte."},"en":{"q":"How are large language models pre-trained on massive text corpora without humans having to label the data?","o":["Through supervised learning on annotated question / answer pairs","Through reinforcement learning only, based on human rewards","Through K-means clustering of the documents","Through self-supervised learning, predicting the next token from the text itself"],"e":"LLM pre-training is **self-supervised**: labels are derived from the text itself (predicting the **next token** or a masked token), which makes it possible to use massive volumes of unannotated data.\n- Supervised learning (fine-tuning) and RLHF come afterward, on smaller volumes.\n- K-means groups data but does not learn to generate text."}},{"n":65,"d":4,"a":["C"],"fr":{"q":"Après six mois de production, un modèle d\u0027approbation de crédit accepte 60 % des demandes du groupe A et 42 % de celles du groupe B. L\u0027équipe calcule le ratio d\u0027impact disparate (taux du groupe défavorisé / taux du groupe favorisé). Quel est ce ratio et que conclure ?","o":["Environ 1,43 : le groupe B est avantagé, aucune action n\u0027est nécessaire","0,18 : l\u0027écart est négligeable et ne mérite pas d\u0027analyse","0,70 : inférieur au seuil indicatif de 0,8 (règle des quatre cinquièmes), une investigation s\u0027impose","0,42 : le taux d\u0027approbation du groupe B suffit à conclure à l\u0027équité"],"e":"Ratio d\u0027impact disparate = 0,42 / 0,60 = **0,70**. Il est inférieur au seuil indicatif de **0,8** couramment utilisé (règle des quatre cinquièmes), ce qui signale un possible **biais** à analyser (données, variables proxy) et justifie une **surveillance continue de l\u0027équité** après déploiement.\n- 1,43 est le ratio inversé (0,60 / 0,42).\n- 0,18 est la différence des taux, pas un ratio.\n- 0,42 n\u0027est qu\u0027un des deux taux."},"en":{"q":"After six months in production, a credit approval model accepts 60% of applications from group A and 42% from group B. The team computes the disparate impact ratio (rate of the disadvantaged group / rate of the advantaged group). What is the ratio, and what should be concluded?","o":["About 1.43: group B is favored, so no action is needed","0.18: the gap is negligible and does not warrant analysis","0.70: below the indicative 0.8 threshold (four-fifths rule), so an investigation is required","0.42: group B’s approval rate is enough to conclude the model is fair"],"e":"Disparate impact ratio = 0.42 / 0.60 = **0.70**. It is below the commonly used indicative threshold of **0.8** (four-fifths rule), signaling possible **bias** to analyze (data, proxy features) and justifying **continuous fairness monitoring** after deployment.\n- 1.43 is the inverted ratio (0.60 / 0.42).\n- 0.18 is the difference between the rates, not a ratio.\n- 0.42 is only one of the two rates."}}]},{"id":6,"title":{"fr":"IA responsable, sécurité et synthèse (niveau examen)","en":"Responsible AI, security and mixed review (exam level)"},"questions":[{"n":1,"d":3,"a":["C"],"fr":{"q":"Une caisse de retraite a formalisé dans un document de 40 pages ses règles d\u0027éligibilité (âge, trimestres validés, cumul emploi-retraite). Son assistant sur Amazon Bedrock doit vérifier que chaque réponse est logiquement cohérente avec ces règles et fournir une justification vérifiable des incohérences détectées, plutôt qu\u0027une simple estimation de similarité avec un passage. Quelle fonctionnalité d\u0027Amazon Bedrock Guardrails répond le MIEUX à ce besoin ?","o":["Un sujet refusé (denied topic) décrivant les questions de retraite qui ne doivent pas être traitées","Un filtre de mots contenant la liste des termes réglementaires que le modèle doit éviter","Les vérifications Automated Reasoning, fondées sur une politique logique extraite du document de règles","Un filtre d\u0027informations sensibles configuré pour masquer les âges et les numéros de sécurité sociale"],"e":"Les **vérifications Automated Reasoning (Automated Reasoning checks)** de **Bedrock Guardrails** traduisent un document de règles en **politique logique formelle**, puis vérifient mathématiquement si une réponse est valide au regard de ces règles, en expliquant les écarts : c\u0027est adapté aux domaines régis par des règles précises. Un sujet refusé bloque un thème entier, un filtre de mots bloque des termes, et un filtre d\u0027informations sensibles masque des données personnelles ; aucun ne vérifie la cohérence logique d\u0027une réponse."},"en":{"q":"A pension fund has formalized its eligibility rules (age, validated quarters, combining work and pension) in a 40-page document. Its assistant on Amazon Bedrock must check that every answer is logically consistent with these rules and provide a verifiable justification for any inconsistency detected, rather than a mere similarity estimate against a passage. Which Amazon Bedrock Guardrails feature BEST meets this need?","o":["A denied topic describing the pension questions that must not be handled","A word filter containing the list of regulatory terms the model must avoid","Automated Reasoning checks, based on a logical policy extracted from the rules document","A sensitive information filter configured to mask ages and social security numbers"],"e":"**Automated Reasoning checks** in **Bedrock Guardrails** translate a rules document into a **formal logical policy**, then mathematically verify whether a response is valid against those rules, explaining any discrepancies: this suits domains governed by precise rules. A denied topic blocks an entire subject, a word filter blocks terms, and a sensitive information filter masks personal data; none of them checks the logical consistency of a response."}},{"n":2,"d":4,"a":["A"],"fr":{"q":"Un réseau hospitalier entraîne un modèle qui prédit la dégradation de l\u0027état des patients à partir de mesures de saturation en oxygène. Une étude interne révèle que les oxymètres de pouls utilisés surestiment systématiquement la saturation chez les patients à la peau foncée, si bien que le modèle sous-estime leur risque, alors que ces patients sont bien représentés dans les données. Quel type de biais est principalement en cause ?","o":["Biais de mesure, car l\u0027instrument de collecte produit des valeurs systématiquement faussées pour un sous-groupe","Biais d\u0027échantillonnage, car le sous-groupe concerné est forcément sous-représenté dans le jeu d\u0027entraînement","Biais de confirmation, car les équipes cliniques ont choisi les variables qui confirmaient leurs hypothèses","Biais algorithmique, car l\u0027algorithme d\u0027apprentissage pondère différemment les patients selon leur peau"],"e":"Il s\u0027agit d\u0027un **biais de mesure** : la donnée elle-même est faussée de manière systématique pour un sous-groupe par l\u0027outil de collecte, même si ce sous-groupe est bien représenté. Le biais d\u0027échantillonnage concerne la représentativité de l\u0027échantillon, pas la justesse des valeurs. Rien n\u0027indique un choix de variables guidé par des préjugés (confirmation) ni une pondération introduite par l\u0027algorithme lui-même."},"en":{"q":"A hospital network trains a model that predicts patient deterioration from oxygen saturation readings. An internal study reveals that the pulse oximeters used systematically overestimate saturation for patients with darker skin, so the model underestimates their risk, even though these patients are well represented in the data. Which type of bias is primarily involved?","o":["Measurement bias, because the collection instrument produces systematically skewed values for a subgroup","Sampling bias, because the affected subgroup is necessarily underrepresented in the training dataset","Confirmation bias, because the clinical teams chose the variables that confirmed their hypotheses","Algorithmic bias, because the learning algorithm weights patients differently according to their skin"],"e":"This is **measurement bias**: the data itself is systematically skewed for a subgroup by the collection tool, even though the subgroup is well represented. Sampling bias concerns how representative the sample is, not the accuracy of the values. Nothing indicates feature selection driven by preconceptions (confirmation) or weighting introduced by the algorithm itself."}},{"n":3,"d":1,"a":["D"],"fr":{"q":"Une plateforme communautaire, Forumio, utilise un classifieur binaire pour supprimer AUTOMATIQUEMENT, sans revue humaine, les commentaires qu\u0027il juge haineux. La direction juridique estime que supprimer à tort un commentaire légitime est le risque le plus grave, car il porte atteinte à la liberté d\u0027expression des membres. Quelle métrique l\u0027équipe doit-elle optimiser en priorité pour fixer le seuil de décision ?","o":["Le rappel (recall), pour détecter la plus grande proportion possible des commentaires réellement haineux","L\u0027exactitude (accuracy), car elle résume en un seul chiffre la qualité globale des décisions du modèle","L\u0027aire sous la courbe ROC (AUC), car elle mesure la performance indépendamment de tout seuil de décision","La précision (precision), pour que les commentaires supprimés soient presque toujours réellement haineux"],"e":"La **précision** = VP / (VP + FP) mesure la part des commentaires supprimés qui étaient vraiment haineux : la maximiser limite les **faux positifs**, ici l\u0027erreur la plus coûteuse. Le rappel limiterait les faux négatifs (contenus haineux non supprimés), ce qui n\u0027est pas la priorité exprimée. L\u0027exactitude est trompeuse sur des classes déséquilibrées, et l\u0027AUC ne permet pas à elle seule de choisir un seuil adapté au coût des erreurs."},"en":{"q":"A community platform, Forumio, uses a binary classifier to AUTOMATICALLY delete, without human review, comments that it considers hateful. The legal department considers that wrongly deleting a legitimate comment is the most serious risk because it infringes members\u0027 freedom of expression. Which metric should the team optimize first when setting the decision threshold?","o":["Recall, to detect the largest possible proportion of comments that are actually hateful","Accuracy, because it summarizes the overall quality of the model\u0027s decisions in a single number","Area under the ROC curve (AUC), because it measures performance independently of any threshold","Precision, so that deleted comments are almost always comments that are actually hateful"],"e":"**Precision** = TP / (TP + FP) measures the share of deleted comments that were truly hateful: maximizing it limits **false positives**, the costliest error here. Recall would limit false negatives (hateful content left online), which is not the stated priority. Accuracy is misleading on imbalanced classes, and AUC alone does not let you choose a threshold suited to the cost of errors."}},{"n":4,"d":2,"a":["B"],"fr":{"q":"Un développeur règle les paramètres d\u0027inférence d\u0027un modèle sur Amazon Bedrock et fixe top-k à 40. Quel est l\u0027effet de ce paramètre lors de la génération de chaque token ?","o":["Le modèle génère au maximum 40 tokens avant de s\u0027arrêter, quelle que soit la longueur demandée","Le modèle choisit le token suivant uniquement parmi les 40 tokens candidats les plus probables","Le modèle ne retient que les tokens dont la probabilité cumulée atteint 40 % de la distribution","Le modèle exclut de sa réponse les 40 tokens les plus fréquents afin d\u0027éviter les répétitions"],"e":"**Top-k** limite l\u0027échantillonnage aux **k tokens les plus probables** à chaque étape : une valeur faible rend la sortie plus prévisible, une valeur élevée plus variée. La longueur maximale relève de max tokens, le seuil de probabilité cumulée correspond à **top-p**, et la limitation des répétitions relève des pénalités de présence ou de fréquence."},"en":{"q":"A developer tunes the inference parameters of a model on Amazon Bedrock and sets top-k to 40. What is the effect of this parameter when each token is generated?","o":["The model generates at most 40 tokens before stopping, regardless of the requested length","The model chooses the next token only among the 40 most likely candidate tokens","The model keeps only the tokens whose cumulative probability reaches 40% of the distribution","The model excludes the 40 most frequent tokens from its response to avoid repetition"],"e":"**Top-k** restricts sampling to the **k most likely tokens** at each step: a low value makes output more predictable, a high value more varied. Maximum length is controlled by max tokens, the cumulative probability threshold corresponds to **top-p**, and limiting repetition is the role of presence or frequency penalties."}},{"n":5,"d":5,"a":["C"],"fr":{"q":"Un auditeur constate que le trail AWS CloudTrail d\u0027une banque contient bien les appels InvokeModel à Amazon Bedrock, mais aucun appel Retrieve ou RetrieveAndGenerate vers ses bases de connaissances, ni aucun appel InvokeFlow. Il exige de tracer qui interroge chaque base de connaissances. Quelle action répond à cette exigence ?","o":["Activer la journalisation des invocations de modèles Bedrock vers Amazon S3","Créer une règle AWS Config qui recense les bases de connaissances du compte","Configurer le trail pour enregistrer les événements de données (data events) Bedrock de type KnowledgeBase et FlowAlias","Activer AWS Trusted Advisor afin qu\u0027il conserve l\u0027historique des requêtes envoyées aux bases"],"e":"CloudTrail enregistre par défaut les **événements de gestion**, dont InvokeModel et Converse, mais les appels **Retrieve**, **RetrieveAndGenerate**, InvokeAgent ou **InvokeFlow** sont des **événements de données (data events)**, non journalisés par défaut : il faut les activer avec des sélecteurs d\u0027événements avancés (types de ressource AWS::Bedrock::KnowledgeBase, AWS::Bedrock::FlowAlias…). La journalisation des invocations de modèles capture le contenu des appels de modèles, pas l\u0027identité des appels aux bases de connaissances ; AWS Config suit la configuration des ressources, et Trusted Advisor émet des recommandations."},"en":{"q":"An auditor notices that a bank\u0027s AWS CloudTrail trail does contain the InvokeModel calls to Amazon Bedrock, but no Retrieve or RetrieveAndGenerate calls to its knowledge bases, and no InvokeFlow calls. The auditor requires tracking who queries each knowledge base. Which action meets this requirement?","o":["Enable Bedrock model invocation logging to Amazon S3","Create an AWS Config rule that inventories the account\u0027s knowledge bases","Configure the trail to record Bedrock data events for the KnowledgeBase and FlowAlias resource types","Enable AWS Trusted Advisor so that it keeps a history of the queries sent to the knowledge bases"],"e":"By default, CloudTrail records **management events**, including InvokeModel and Converse, but **Retrieve**, **RetrieveAndGenerate**, InvokeAgent, and **InvokeFlow** calls are **data events**, which are not logged by default: they must be enabled with advanced event selectors (resource types AWS::Bedrock::KnowledgeBase, AWS::Bedrock::FlowAlias, and so on). Model invocation logging captures the content of model calls, not the identity of knowledge base callers; AWS Config tracks resource configuration, and Trusted Advisor issues recommendations."}},{"n":6,"d":3,"a":["A"],"fr":{"q":"La base de connaissances Amazon Bedrock d\u0027un éditeur juridique renvoie les 20 fragments les plus proches de chaque question, mais les plus pertinents arrivent souvent en 12e ou 15e position, et seuls les 5 premiers sont transmis au modèle. L\u0027équipe veut améliorer l\u0027ordre des résultats sans réindexer le corpus. Quelle option est la PLUS adaptée ?","o":["Ajouter un modèle de reclassement (reranking) qui réordonne les fragments récupérés selon leur pertinence pour la question","Augmenter la température du modèle de génération pour qu\u0027il exploite davantage de fragments","Passer d\u0027un découpage à taille fixe à l\u0027absence de découpage pour indexer chaque document entier","Réduire la dimension des embeddings de 1 024 à 256 pour accélérer la recherche vectorielle"],"e":"Un **modèle de reclassement (reranker)**, que Bedrock Knowledge Bases peut appliquer aux résultats récupérés (par exemple Amazon Rerank ou Cohere Rerank), évalue finement la pertinence de chaque fragment par rapport à la question et **réordonne** la liste : les meilleurs passages remontent en tête avant d\u0027être transmis au modèle. La température n\u0027agit pas sur la récupération, indexer des documents entiers dégrade la précision, et réduire la dimension des embeddings accélère la recherche sans améliorer le classement."},"en":{"q":"A legal publisher\u0027s Amazon Bedrock knowledge base returns the 20 closest chunks for each question, but the most relevant ones often appear in 12th or 15th position, and only the top 5 are passed to the model. The team wants to improve the order of the results without re-indexing the corpus. Which option is MOST appropriate?","o":["Add a reranking model that reorders the retrieved chunks by their relevance to the question","Raise the generation model\u0027s temperature so that it uses more chunks","Switch from fixed-size chunking to no chunking to index each document whole","Reduce the embedding dimension from 1,024 to 256 to speed up vector search"],"e":"A **reranking model**, which Bedrock Knowledge Bases can apply to retrieved results (for example Amazon Rerank or Cohere Rerank), finely scores each chunk\u0027s relevance to the question and **reorders** the list: the best passages move to the top before being passed to the model. Temperature does not affect retrieval, indexing whole documents hurts precision, and reducing the embedding dimension speeds up search without improving ranking."}},{"n":7,"d":1,"a":["B","D"],"fr":{"q":"Un modèle de régression qui estime le prix de revente de véhicules d\u0027occasion obtient une erreur élevée et quasi identique sur les données d\u0027entraînement et de validation (R² de 0,41 sur les deux jeux). Quelles actions sont les PLUS susceptibles d\u0027améliorer le modèle ? (Sélectionnez DEUX réponses.)","o":["Renforcer la régularisation L2 pour limiter davantage l\u0027amplitude des coefficients","Utiliser un modèle plus expressif, par exemple des arbres de gradient boosting plus profonds","Réduire la taille du jeu d\u0027entraînement pour accélérer les itérations de l\u0027équipe","Ajouter des variables plus informatives, comme le kilométrage et l\u0027historique d\u0027entretien","Activer un arrêt anticipé dès la deuxième itération pour éviter le sur-apprentissage"],"e":"Des performances médiocres et similaires sur l\u0027entraînement et la validation signalent un **sous-apprentissage (biais élevé)** : le modèle est trop simple ou manque d\u0027information. On y remédie en **augmentant la capacité du modèle** et en **ajoutant des variables pertinentes (feature engineering)**. Renforcer la régularisation ou arrêter l\u0027entraînement plus tôt réduit encore la capacité du modèle, et moins de données n\u0027aide pas à apprendre des relations plus riches."},"en":{"q":"A regression model that estimates the resale price of used vehicles has a high and nearly identical error on the training and validation data (R² of 0.41 on both sets). Which actions are MOST likely to improve the model? (Select TWO.)","o":["Strengthen L2 regularization to further limit the magnitude of the coefficients","Use a more expressive model, for example deeper gradient boosting trees","Reduce the size of the training set to speed up the team\u0027s iterations","Add more informative features, such as mileage and maintenance history","Enable early stopping at the second iteration to avoid overfitting"],"e":"Poor and similar performance on training and validation signals **underfitting (high bias)**: the model is too simple or lacks information. The remedies are to **increase model capacity** and to **add relevant features (feature engineering)**. Stronger regularization or earlier stopping reduces capacity even further, and less data does not help learn richer relationships."}},{"n":8,"d":2,"a":["D"],"fr":{"q":"Un assistant juridique envoie à chaque requête le même prompt système de 3 000 tokens et le même contrat de référence de 40 000 tokens, suivis d\u0027une courte question de l\u0027utilisateur. La facture des tokens d\u0027entrée et la latence sont élevées. Quelle fonctionnalité d\u0027Amazon Bedrock réduit le PLUS ces deux problèmes sans changer de modèle ?","o":["L\u0027inférence par lots, qui traite les questions des utilisateurs de manière asynchrone","Le Provisioned Throughput, qui supprime la facturation des tokens d\u0027entrée","Une augmentation de max tokens, qui permet de répondre en un seul appel","La mise en cache des prompts (prompt caching), qui réutilise le préfixe commun déjà traité"],"e":"La **mise en cache des prompts (prompt caching)** d\u0027Amazon Bedrock conserve temporairement le traitement d\u0027un **préfixe de prompt répété** (instructions, documents de référence) : les requêtes suivantes qui réutilisent ce préfixe sont plus rapides et les tokens lus depuis le cache sont facturés à un tarif réduit, pour les modèles compatibles. L\u0027inférence par lots ne convient pas à un assistant interactif, le Provisioned Throughput facture une capacité réservée sans réduire le traitement du long contexte, et max tokens limite la sortie, pas l\u0027entrée."},"en":{"q":"A legal assistant sends with every request the same 3,000-token system prompt and the same 40,000-token reference contract, followed by a short user question. The input token bill and latency are high. Which Amazon Bedrock feature MOST reduces both problems without changing models?","o":["Batch inference, which processes user questions asynchronously","Provisioned Throughput, which eliminates input token billing","Increasing max tokens, which allows answering in a single call","Prompt caching, which reuses the common prefix that has already been processed"],"e":"Amazon Bedrock **prompt caching** temporarily keeps the processing of a **repeated prompt prefix** (instructions, reference documents): subsequent requests that reuse this prefix are faster, and tokens read from the cache are billed at a reduced rate, for supported models. Batch inference does not suit an interactive assistant, Provisioned Throughput bills reserved capacity without reducing long-context processing, and max tokens limits output, not input."}},{"n":9,"d":3,"a":["B"],"fr":{"q":"Une équipe appelle trois modèles d\u0027Amazon Bedrock de fournisseurs différents avec l\u0027API InvokeModel. Chaque changement de modèle l\u0027oblige à réécrire le format JSON de la requête et l\u0027analyse de la réponse, propres à chaque fournisseur. Elle veut comparer et changer de modèle avec le MOINS de modifications de code. Quelle solution choisir ?","o":["Créer un Provisioned Throughput par modèle afin d\u0027obtenir une interface d\u0027appel identique","Utiliser l\u0027API Converse, qui offre un format de messages unifié pour les modèles compatibles","Fine-tuner les trois modèles pour qu\u0027ils acceptent le format de requête du premier fournisseur","Placer les trois modèles derrière une base de connaissances qui traduit les requêtes"],"e":"L\u0027**API Converse** d\u0027Amazon Bedrock fournit une **interface unique et cohérente** (messages, paramètres d\u0027inférence, utilisation d\u0027outils) pour tous les modèles qui la prennent en charge : changer de modèle revient souvent à changer son identifiant. Le Provisioned Throughput réserve de la capacité sans modifier le format des requêtes. Le fine-tuning adapte le comportement d\u0027un modèle, pas son contrat d\u0027API, et une base de connaissances sert au RAG."},"en":{"q":"A team calls three Amazon Bedrock models from different providers with the InvokeModel API. Every model change forces it to rewrite the provider-specific JSON request format and response parsing. It wants to compare and switch models with the FEWEST code changes. Which solution should it choose?","o":["Create Provisioned Throughput for each model to obtain an identical calling interface","Use the Converse API, which offers a unified message format for supported models","Fine-tune the three models so that they accept the first provider\u0027s request format","Put the three models behind a knowledge base that translates the requests"],"e":"The Amazon Bedrock **Converse API** provides a **single, consistent interface** (messages, inference parameters, tool use) for all models that support it: switching models often comes down to changing the model ID. Provisioned Throughput reserves capacity without changing the request format. Fine-tuning adapts a model\u0027s behavior, not its API contract, and a knowledge base is for RAG."}},{"n":10,"d":4,"a":["C"],"fr":{"q":"Pour respecter la réglementation, un assureur retire les variables d\u0027origine ethnique et de nationalité de son modèle de tarification. Un audit montre pourtant que les tarifs restent nettement plus élevés dans certains quartiers majoritairement peuplés d\u0027une même communauté. Quelle explication est la PLUS probable ?","o":["Le modèle est en sous-apprentissage, car il manque désormais de variables pour bien prédire le risque","Le biais vient d\u0027une erreur de mesure, car les adresses ont été mal saisies lors de la collecte","Des variables comme le code postal servent de proxy et réintroduisent l\u0027information retirée","Le biais est causé par une température trop élevée lors de l\u0027inférence du modèle de tarification"],"e":"Supprimer un attribut sensible ne suffit pas : d\u0027autres variables corrélées, comme le **code postal**, peuvent servir de **variable proxy** et permettre au modèle de reconstituer indirectement l\u0027information retirée. Il faut mesurer les résultats **par sous-groupe** et analyser ces corrélations (par exemple avec les valeurs SHAP). Le sous-apprentissage n\u0027explique pas une disparité ciblée, rien n\u0027indique une erreur de saisie, et un modèle de tarification classique n\u0027a pas de paramètre de température."},"en":{"q":"To comply with regulations, an insurer removes the ethnic origin and nationality features from its pricing model. An audit nevertheless shows that premiums remain markedly higher in certain neighborhoods mostly populated by the same community. What is the MOST likely explanation?","o":["The model is underfitting because it now lacks features to predict risk properly","The bias comes from a measurement error because addresses were mistyped during collection","Features such as the postal code act as proxies and reintroduce the removed information","The bias is caused by an excessively high temperature during the pricing model\u0027s inference"],"e":"Removing a sensitive attribute is not enough: other correlated features, such as the **postal code**, can act as **proxy variables** and let the model indirectly reconstruct the removed information. Outcomes must be measured **per subgroup** and these correlations analyzed (for example with SHAP values). Underfitting does not explain a targeted disparity, nothing indicates a data entry error, and a classic pricing model has no temperature parameter."}},{"n":11,"d":2,"a":["A"],"fr":{"q":"Une plateforme de support obtient d\u0027excellentes réponses avec un grand modèle d\u0027Amazon Bedrock, mais le coût et la latence sont trop élevés pour son volume. Elle dispose de milliers de prompts représentatifs, mais pas de réponses de référence rédigées par des humains. Elle veut un modèle plus petit qui approche la qualité du grand modèle sur ce cas d\u0027usage précis. Quelle fonctionnalité utiliser ?","o":["Amazon Bedrock Model Distillation, où le grand modèle enseignant génère les réponses qui entraînent un modèle élève plus petit","Un continued pre-training du petit modèle sur les prompts, sans aucune réponse associée","Un Provisioned Throughput sur le grand modèle pour en réduire le prix unitaire par token","Une base de connaissances indexant les prompts pour que le petit modèle les retrouve"],"e":"**Amazon Bedrock Model Distillation** utilise un **modèle enseignant** performant pour générer des réponses à partir des prompts fournis, puis affine un **modèle élève** plus petit, plus rapide et moins coûteux, de la même famille, afin qu\u0027il approche la qualité de l\u0027enseignant sur ce cas d\u0027usage, sans réponses rédigées par des humains. Le continued pre-training adapte le vocabulaire d\u0027un domaine, le Provisioned Throughput réserve de la capacité sans réduire la taille du modèle, et une base de connaissances fournit du contexte, pas les compétences du grand modèle."},"en":{"q":"A support platform gets excellent answers from a large Amazon Bedrock model, but cost and latency are too high for its volume. It has thousands of representative prompts but no human-written reference answers. It wants a smaller model that approaches the large model\u0027s quality on this specific use case. Which feature should it use?","o":["Amazon Bedrock Model Distillation, in which the large teacher model generates the responses that train a smaller student model","Continued pre-training of the small model on the prompts, without any associated responses","Provisioned Throughput on the large model to lower its per-token price","A knowledge base indexing the prompts so that the small model can retrieve them"],"e":"**Amazon Bedrock Model Distillation** uses a high-performing **teacher model** to generate responses from the supplied prompts, then fine-tunes a smaller, faster, cheaper **student model** from the same family so that it approaches the teacher\u0027s quality on this use case, with no human-written responses. Continued pre-training adapts domain vocabulary, Provisioned Throughput reserves capacity without shrinking the model, and a knowledge base provides context, not the large model\u0027s skills."}},{"n":12,"d":5,"a":["B"],"fr":{"q":"Une compagnie d\u0027assurance centralise dans un lac de données Amazon S3, catalogué avec AWS Glue, les données qui serviront à entraîner ses modèles. Les data scientists du projet tarification doivent voir les tables de sinistres sans les colonnes nom, adresse et IBAN, et uniquement les lignes de leur pays. Quelle solution répond à ce besoin avec le MOINS d\u0027effort ?","o":["Créer une copie des tables pour chaque équipe, sans les colonnes sensibles, et la mettre à jour chaque nuit","Utiliser AWS Lake Formation pour accorder des permissions fines au niveau des colonnes et des lignes","Activer Amazon Macie sur le lac de données pour masquer les colonnes sensibles lors des requêtes","Appliquer une SCP AWS Organizations qui interdit la lecture des colonnes sensibles dans S3"],"e":"**AWS Lake Formation** centralise la gouvernance d\u0027un lac de données catalogué et permet d\u0027accorder des **permissions fines** au niveau des tables, des **colonnes**, des **lignes** et des cellules (filtres de données, contrôle par étiquettes), appliquées aux services d\u0027analyse intégrés. Des copies par équipe multiplient le stockage et les risques, Macie découvre des données sensibles sans filtrer les requêtes, et une SCP agit sur des actions d\u0027API, pas sur des colonnes de tables."},"en":{"q":"An insurance company centralizes the data that will be used to train its models in an Amazon S3 data lake cataloged with AWS Glue. The pricing project\u0027s data scientists must see the claims tables without the name, address, and IBAN columns, and only the rows for their country. Which solution meets this need with the LEAST effort?","o":["Create a copy of the tables for each team, without the sensitive columns, and refresh it every night","Use AWS Lake Formation to grant fine-grained column-level and row-level permissions","Enable Amazon Macie on the data lake to mask sensitive columns at query time","Apply an AWS Organizations SCP that denies reading the sensitive columns in S3"],"e":"**AWS Lake Formation** centralizes governance of a cataloged data lake and grants **fine-grained permissions** at the table, **column**, **row**, and cell level (data filters, tag-based access control), enforced by integrated analytics services. Per-team copies multiply storage and risk, Macie discovers sensitive data without filtering queries, and an SCP acts on API actions, not on table columns."}},{"n":13,"d":3,"a":["D"],"fr":{"q":"Une équipe a fine-tuné un modèle open source Llama sur SageMaker AI et stocké les poids obtenus dans Amazon S3. Elle veut désormais l\u0027invoquer avec les mêmes API serverless que les autres modèles d\u0027Amazon Bedrock, sans gérer d\u0027endpoint ni d\u0027instances. Quelle fonctionnalité répond à ce besoin ?","o":["SageMaker JumpStart, qui déploie le modèle sur un endpoint temps réel à instances dédiées","Amazon Bedrock Knowledge Bases, qui indexe les poids du modèle comme une source de données","Amazon Bedrock Prompt Management, qui enregistre le modèle comme une version de prompt","Amazon Bedrock Custom Model Import, qui importe les poids d\u0027un modèle aux architectures prises en charge"],"e":"**Amazon Bedrock Custom Model Import** importe dans Bedrock les poids d\u0027un modèle personnalisé dont l\u0027architecture est prise en charge (par exemple Llama ou Mistral), depuis S3 ou SageMaker AI ; le modèle s\u0027invoque ensuite comme les autres modèles Bedrock, sans infrastructure à gérer. JumpStart déploie sur des endpoints à instances dédiées, Knowledge Bases sert au RAG, et Prompt Management gère des modèles de prompts, pas des modèles d\u0027IA."},"en":{"q":"A team fine-tuned an open source Llama model on SageMaker AI and stored the resulting weights in Amazon S3. It now wants to invoke it with the same serverless APIs as other Amazon Bedrock models, without managing endpoints or instances. Which feature meets this need?","o":["SageMaker JumpStart, which deploys the model to a real-time endpoint with dedicated instances","Amazon Bedrock Knowledge Bases, which indexes the model weights as a data source","Amazon Bedrock Prompt Management, which registers the model as a prompt version","Amazon Bedrock Custom Model Import, which imports the weights of models with supported architectures"],"e":"**Amazon Bedrock Custom Model Import** brings into Bedrock the weights of a customized model with a supported architecture (for example Llama or Mistral), from S3 or SageMaker AI; the model is then invoked like other Bedrock models, with no infrastructure to manage. JumpStart deploys to dedicated-instance endpoints, Knowledge Bases is for RAG, and Prompt Management manages prompt templates, not AI models."}},{"n":14,"d":1,"a":["A"],"fr":{"q":"Une banque entraîne un modèle qui prédit, au moment de la demande, si un prêt sera remboursé. Le modèle atteint une AUC de 0,99 en test mais s\u0027effondre en production. L\u0027analyse révèle qu\u0027une des variables, « nombre de relances de recouvrement », n\u0027est connue que plusieurs mois après l\u0027octroi du prêt. Quel problème est en cause ?","o":["Une fuite de données : une variable contient une information indisponible au moment de prédire","Une dérive des données : la distribution des demandes de prêt a changé depuis l\u0027entraînement","Un sous-apprentissage : le modèle est trop simple pour capter la relation avec la cible","Un biais d\u0027échantillonnage : les clients défaillants sont sous-représentés dans le jeu de test"],"e":"Il s\u0027agit d\u0027une **fuite de données (data leakage)** : une variable porte une information **postérieure au moment de la prédiction** et fortement liée à la cible, ce qui gonfle artificiellement les scores de test ; en production, cette information n\u0027existe pas encore. Il faut ne conserver que les variables disponibles au moment de la décision. Une dérive se manifesterait par une dégradation progressive et non par un écart immédiat, le sous-apprentissage donnerait de mauvais scores dès le test, et un biais d\u0027échantillonnage n\u0027explique pas une AUC de 0,99."},"en":{"q":"A bank trains a model that predicts, at application time, whether a loan will be repaid. The model reaches an AUC of 0.99 in testing but collapses in production. Analysis reveals that one of the features, \u0027number of collection reminders\u0027, is known only several months after the loan is granted. What is the problem?","o":["Data leakage: a feature contains information that is unavailable at prediction time","Data drift: the distribution of loan applications has changed since training","Underfitting: the model is too simple to capture the relationship with the target","Sampling bias: defaulting customers are underrepresented in the test set"],"e":"This is **data leakage**: a feature carries information from **after the prediction time** that is strongly linked to the target, which artificially inflates test scores; in production, that information does not exist yet. Only features available at decision time should be kept. Drift would show up as gradual degradation rather than an immediate gap, underfitting would give poor scores already in testing, and sampling bias does not explain an AUC of 0.99."}},{"n":15,"d":2,"a":["A","E"],"fr":{"q":"Aux heures de pointe, une application qui invoque un modèle d\u0027Amazon Bedrock à la demande reçoit des erreurs de limitation de débit (throttling). Elle n\u0027a aucune contrainte de résidence des données. L\u0027équipe envisage un profil d\u0027inférence inter-Régions (cross-Region inference). Quelles affirmations sur cette option sont exactes ? (Sélectionnez DEUX réponses.)","o":["Il répartit dynamiquement les requêtes entre plusieurs Régions pour absorber les pics de trafic","Il exige l\u0027achat préalable d\u0027un Provisioned Throughput dans chacune des Régions du profil","Il n\u0027est utilisable que pour les tâches d\u0027inférence par lots stockées dans Amazon S3","Il garantit que les données des requêtes sont toujours traitées dans la Région d\u0027appel","Il n\u0027ajoute pas de coût de routage : le prix appliqué est celui de la Région d\u0027origine de l\u0027appel"],"e":"Un **profil d\u0027inférence inter-Régions** achemine automatiquement les requêtes vers une Région disposant de capacité parmi celles du profil, ce qui **augmente le débit disponible** et réduit les erreurs de limitation lors des pics, **sans coût de routage supplémentaire** : le prix est calculé selon la Région d\u0027où provient l\u0027appel. Il s\u0027utilise avec l\u0027inférence à la demande, sans Provisioned Throughput. En revanche, les requêtes peuvent être traitées dans une autre Région du profil, ce qui doit être évalué lorsque des contraintes de résidence s\u0027appliquent."},"en":{"q":"At peak hours, an application that invokes an Amazon Bedrock model on demand receives throttling errors. It has no data residency constraints. The team is considering a cross-Region inference profile. Which statements about this option are correct? (Select TWO.)","o":["It dynamically distributes requests across several Regions to absorb traffic peaks","It requires purchasing Provisioned Throughput in each of the profile\u0027s Regions beforehand","It can only be used for batch inference jobs stored in Amazon S3","It guarantees that request data is always processed in the calling Region","It adds no routing cost: the price applied is that of the Region where the call originates"],"e":"A **cross-Region inference profile** automatically routes requests to a Region with available capacity among those in the profile, which **increases available throughput** and reduces throttling during peaks, with **no additional routing cost**: the price is calculated based on the Region the call comes from. It is used with on-demand inference, without Provisioned Throughput. However, requests may be processed in another Region of the profile, which must be assessed when residency constraints apply."}},{"n":16,"d":3,"a":["C","E"],"fr":{"q":"Une start-up héberge sur Amazon Bedrock AgentCore Runtime un agent multi-utilisateurs qui analyse des dépôts de code pendant plusieurs heures. Le RSSI s\u0027inquiète du cloisonnement entre les sessions des différents clients. Quelles affirmations sur AgentCore Runtime sont exactes ? (Sélectionnez DEUX réponses.)","o":["Il impose de développer l\u0027agent exclusivement avec le SDK Strands Agents","Il oblige l\u0027équipe à provisionner, dimensionner et corriger des instances EC2","Chaque session utilisateur s\u0027exécute dans une microVM dédiée, isolée des autres sessions","Il limite chaque invocation à 15 minutes, comme une fonction AWS Lambda","Une session peut rester active jusqu\u0027à 8 heures pour des traitements de longue durée"],"e":"**AgentCore Runtime** exécute chaque **session dans une microVM dédiée** (calcul, mémoire et système de fichiers isolés, nettoyés en fin de session), ce qui empêche une session d\u0027accéder aux données d\u0027une autre, et prend en charge des **sessions longues, jusqu\u0027à 8 heures**. Il est serverless et compatible avec tout framework (Strands Agents, LangGraph, CrewAI…), sans instances à gérer, et n\u0027est pas soumis à la limite de 15 minutes de Lambda."},"en":{"q":"A startup hosts on Amazon Bedrock AgentCore Runtime a multi-user agent that analyzes code repositories for several hours. The CISO is concerned about isolation between different customers\u0027 sessions. Which statements about AgentCore Runtime are correct? (Select TWO.)","o":["It requires building the agent exclusively with the Strands Agents SDK","It forces the team to provision, size, and patch EC2 instances","Each user session runs in a dedicated microVM, isolated from other sessions","It limits each invocation to 15 minutes, like an AWS Lambda function","A session can remain active for up to 8 hours for long-running processing"],"e":"**AgentCore Runtime** runs each **session in a dedicated microVM** (isolated compute, memory, and file system, sanitized at the end of the session), which prevents one session from accessing another\u0027s data, and supports **long-running sessions of up to 8 hours**. It is serverless and works with any framework (Strands Agents, LangGraph, CrewAI, and so on), with no instances to manage, and is not subject to Lambda\u0027s 15-minute limit."}},{"n":17,"d":4,"a":["C"],"fr":{"q":"Un éditeur de manuels scolaires utilise un modèle génératif pour rédiger des fiches de révision. Son comité d\u0027IA responsable fixe comme objectif principal que les contenus produits soient factuellement exacts et le restent face à des formulations inhabituelles ou trompeuses des élèves. À quelle dimension de l\u0027IA responsable, telle que décrite par AWS, cet objectif correspond-il ?","o":["La gouvernance","L\u0027équité","La véracité et la robustesse","La contrôlabilité"],"e":"AWS décrit la dimension **véracité et robustesse (veracity and robustness)** comme le fait d\u0027obtenir des **sorties correctes**, y compris face à des entrées inattendues ou adverses : c\u0027est exactement l\u0027objectif d\u0027exactitude factuelle visé ici. La gouvernance porte sur les processus et responsabilités, l\u0027équité sur le traitement des différents groupes, et la contrôlabilité sur les mécanismes de surveillance et d\u0027orientation du système."},"en":{"q":"A textbook publisher uses a generative model to write revision sheets. Its responsible AI committee sets as its main objective that the content produced be factually correct and stay correct even when students phrase questions in unusual or misleading ways. Which dimension of responsible AI, as described by AWS, does this objective correspond to?","o":["Governance","Fairness","Veracity and robustness","Controllability"],"e":"AWS describes the **veracity and robustness** dimension as achieving **correct system outputs**, even with unexpected or adversarial inputs: this is exactly the factual accuracy goal here. Governance concerns processes and accountability, fairness concerns how different groups are treated, and controllability concerns the mechanisms for monitoring and steering the system."}},{"n":18,"d":1,"a":["B"],"fr":{"q":"Un filtre anti-hameçonnage est testé sur 1 000 e-mails : 40 vrais positifs, 10 faux négatifs, 95 faux positifs et 855 vrais négatifs. L\u0027équipe de sécurité veut connaître la proportion d\u0027e-mails légitimes signalés à tort, c\u0027est-à-dire le taux de faux positifs. Quelle est sa valeur ?","o":["0,90","0,10","Environ 0,30","0,20"],"e":"Le **taux de faux positifs (FPR)** = FP / (FP + VN) = 95 / (95 + 855) = 95 / 950 = **0,10** : 10 % des e-mails légitimes sont signalés à tort ; c\u0027est l\u0027axe horizontal de la courbe ROC. 0,90 est la **spécificité** (855 / 950), environ 0,30 est la **précision** (40 / 135 ≈ 0,296) et 0,20 est le **taux de faux négatifs** (10 / 50)."},"en":{"q":"An anti-phishing filter is tested on 1,000 emails: 40 true positives, 10 false negatives, 95 false positives, and 855 true negatives. The security team wants to know the proportion of legitimate emails wrongly flagged, that is, the false positive rate. What is its value?","o":["0.90","0.10","Approximately 0.30","0.20"],"e":"The **false positive rate (FPR)** = FP / (FP + TN) = 95 / (95 + 855) = 95 / 950 = **0.10**: 10% of legitimate emails are wrongly flagged; it is the horizontal axis of the ROC curve. 0.90 is the **specificity** (855 / 950), approximately 0.30 is the **precision** (40 / 135 ≈ 0.296), and 0.20 is the **false negative rate** (10 / 50)."}},{"n":19,"d":2,"a":["D"],"fr":{"q":"Une entreprise traduit le même article de 1 000 mots en anglais, en finnois et en japonais, puis envoie chaque version au même modèle sur Amazon Bedrock. Elle constate que la facture en tokens d\u0027entrée varie fortement d\u0027une langue à l\u0027autre. Quelle est l\u0027explication la PLUS probable ?","o":["Le prix par token d\u0027Amazon Bedrock dépend de la langue détectée dans le prompt envoyé","Le modèle traduit d\u0027abord le texte en anglais et facture les tokens de cette traduction","Les langues autres que l\u0027anglais sont facturées au caractère plutôt qu\u0027au token par Bedrock","Le tokeniseur découpe ces langues en davantage de tokens pour un même contenu"],"e":"La facturation dépend du **nombre de tokens**, et ce nombre dépend du **tokeniseur** : souvent optimisé pour l\u0027anglais, il découpe fréquemment les mots d\u0027autres langues (langues agglutinantes, écritures non latines) en **davantage de sous-mots**. La règle « un token ≈ 0,75 mot » ne vaut donc que pour l\u0027anglais. Le prix unitaire par token d\u0027un modèle ne dépend pas de la langue, le modèle ne traduit pas implicitement le prompt, et Bedrock ne facture pas les modèles de texte au caractère."},"en":{"q":"A company translates the same 1,000-word article into English, Finnish, and Japanese, then sends each version to the same model on Amazon Bedrock. It notices that the input token bill varies widely from one language to another. What is the MOST likely explanation?","o":["Amazon Bedrock\u0027s per-token price depends on the language detected in the prompt","The model first translates the text into English and bills the tokens of that translation","Bedrock bills languages other than English per character rather than per token","The tokenizer splits these languages into more tokens for the same content"],"e":"Billing depends on the **number of tokens**, and that number depends on the **tokenizer**: often optimized for English, it frequently splits words from other languages (agglutinative languages, non-Latin scripts) into **more subwords**. The \u0027one token ≈ 0.75 words\u0027 rule therefore only holds for English. A model\u0027s per-token price does not depend on the language, the model does not implicitly translate the prompt, and Bedrock does not bill text models per character."}},{"n":20,"d":5,"a":["A","D"],"fr":{"q":"Le RSSI d\u0027un opérateur de transport veut détecter rapidement une campagne d\u0027injections de prompt visant l\u0027assistant public de l\u0027entreprise, protégé par une guardrail Amazon Bedrock avec le filtre d\u0027attaques de prompt activé, puis analyser les requêtes bloquées. Quelles mesures répondent à ce besoin ? (Sélectionnez DEUX réponses.)","o":["Créer des alarmes Amazon CloudWatch sur les métriques d\u0027intervention publiées par Bedrock Guardrails","Activer Amazon Macie sur le compte pour détecter les tentatives d\u0027injection de prompt en temps réel","Consulter chaque semaine les recommandations de sécurité d\u0027AWS Trusted Advisor","Activer la journalisation des invocations pour analyser les prompts bloqués et le détail de l\u0027évaluation","Télécharger depuis AWS Artifact un rapport listant les attaques détectées sur le compte"],"e":"Bedrock Guardrails publie dans **Amazon CloudWatch** des métriques (par exemple InvocationsIntervened dans l\u0027espace de noms AWS/Bedrock/Guardrails) sur lesquelles on crée des **alarmes** pour repérer une hausse anormale des blocages. La **journalisation des invocations** conserve les prompts et le détail des évaluations de la guardrail, ce qui permet d\u0027**analyser** les attaques et d\u0027ajuster les politiques. Macie découvre des données sensibles dans S3, Trusted Advisor formule des recommandations générales, et Artifact fournit les rapports de conformité d\u0027AWS."},"en":{"q":"A transport operator\u0027s CISO wants to quickly detect a prompt injection campaign targeting the company\u0027s public assistant, which is protected by an Amazon Bedrock guardrail with the prompt attack filter enabled, and then analyze the blocked requests. Which measures meet this need? (Select TWO.)","o":["Create Amazon CloudWatch alarms on the intervention metrics published by Bedrock Guardrails","Enable Amazon Macie on the account to detect prompt injection attempts in real time","Review AWS Trusted Advisor security recommendations every week","Enable invocation logging to analyze the blocked prompts and the evaluation details","Download from AWS Artifact a report listing the attacks detected on the account"],"e":"Bedrock Guardrails publishes metrics to **Amazon CloudWatch** (for example InvocationsIntervened in the AWS/Bedrock/Guardrails namespace) on which you can create **alarms** to spot an abnormal rise in blocks. **Invocation logging** keeps the prompts and the guardrail evaluation details, making it possible to **analyze** the attacks and adjust the policies. Macie discovers sensitive data in S3, Trusted Advisor gives general recommendations, and Artifact provides AWS compliance reports."}},{"n":21,"d":3,"a":["C"],"fr":{"q":"Une plateforme de jeux en ligne lance un assistant multimodal sur Amazon Bedrock auquel les joueurs peuvent envoyer des captures d\u0027écran. Elle veut bloquer les images à caractère violent ou sexuel envoyées en entrée en réutilisant la guardrail qui filtre déjà les textes, sans intégrer de service supplémentaire. Quelle configuration choisir ?","o":["Un filtre de mots listant les noms de fichiers d\u0027images interdits","Un sujet refusé (denied topic) décrivant les images violentes ou sexuelles","Les filtres de contenu de la guardrail, activés pour la modalité image en plus du texte","Un contrôle d\u0027ancrage contextuel avec un seuil de pertinence élevé"],"e":"Les **filtres de contenu** d\u0027Amazon Bedrock Guardrails s\u0027appliquent aussi aux **images** pour les catégories comme la violence, le contenu sexuel, la haine ou les insultes : il suffit d\u0027activer la modalité image dans la guardrail existante pour filtrer les entrées et sorties multimodales. Un filtre de mots porte sur du texte, un sujet refusé décrit des thèmes de conversation textuels, et l\u0027ancrage contextuel vérifie la fidélité d\u0027une réponse aux sources."},"en":{"q":"An online gaming platform is launching a multimodal assistant on Amazon Bedrock to which players can send screenshots. It wants to block violent or sexual images sent as input by reusing the guardrail that already filters text, without integrating any additional service. Which configuration should it choose?","o":["A word filter listing forbidden image file names","A denied topic describing violent or sexual images","The guardrail\u0027s content filters, enabled for the image modality in addition to text","A contextual grounding check with a high relevance threshold"],"e":"Amazon Bedrock Guardrails **content filters** also apply to **images** for categories such as violence, sexual content, hate, or insults: enabling the image modality in the existing guardrail is enough to filter multimodal inputs and outputs. A word filter works on text, a denied topic describes textual conversation subjects, and contextual grounding checks a response\u0027s faithfulness to sources."}},{"n":22,"d":3,"a":["A"],"fr":{"q":"Un assureur reçoit chaque jour des formulaires PDF, des photos de dommages, des messages vocaux et de courtes vidéos. Il veut en extraire automatiquement des informations structurées selon ses propres schémas (numéro de contrat, type de dommage, résumé) avec un service managé unique, sans orchestrer lui-même plusieurs modèles et services. Quelle solution répond à ce besoin ?","o":["Amazon Bedrock Data Automation, avec des blueprints décrivant les champs à extraire","Amazon Bedrock Guardrails, avec un filtre d\u0027informations sensibles pour chaque champ","Amazon Bedrock Prompt Management, avec un prompt par type de fichier reçu","Amazon Bedrock Knowledge Bases, avec un découpage hiérarchique des fichiers"],"e":"**Amazon Bedrock Data Automation** extrait des informations de **contenus multimodaux** (documents, images, audio, vidéo) via une API unique ; des **blueprints** définissent les champs et le format de sortie attendus, sans orchestration de modèles par le client. Guardrails filtre des contenus, Prompt Management stocke des prompts sans traiter de fichiers, et Knowledge Bases sert à la recherche documentaire pour le RAG."},"en":{"q":"An insurer receives PDF forms, damage photos, voice messages, and short videos every day. It wants to automatically extract structured information according to its own schemas (policy number, type of damage, summary) with a single managed service, without orchestrating several models and services itself. Which solution meets this need?","o":["Amazon Bedrock Data Automation, with blueprints describing the fields to extract","Amazon Bedrock Guardrails, with a sensitive information filter for each field","Amazon Bedrock Prompt Management, with one prompt per type of file received","Amazon Bedrock Knowledge Bases, with hierarchical chunking of the files"],"e":"**Amazon Bedrock Data Automation** extracts information from **multimodal content** (documents, images, audio, video) through a single API; **blueprints** define the expected fields and output format, with no model orchestration by the customer. Guardrails filters content, Prompt Management stores prompts without processing files, and Knowledge Bases is for document retrieval in RAG."}},{"n":23,"d":1,"a":["B"],"fr":{"q":"Une banque segmente ses clients avec K-means à partir de deux variables : le revenu annuel (de 10 000 à 300 000 €) et le nombre de produits détenus (de 1 à 8). Les segments obtenus ne dépendent presque que du revenu. Quelle étape de préparation des données corrige ce problème ?","o":["Augmenter le nombre de clusters k jusqu\u0027à ce que le nombre de produits influence les segments","Normaliser ou standardiser les variables pour les ramener sur des échelles comparables","Remplacer K-means par une régression linéaire qui prédit le revenu à partir des produits","Supprimer la variable revenu, puisqu\u0027elle domine le calcul des distances entre clients"],"e":"K-means repose sur des **distances** : une variable dont l\u0027échelle est beaucoup plus grande (le revenu) domine le calcul. La **mise à l\u0027échelle des variables (normalisation min-max ou standardisation)** donne à chacune un poids comparable. Augmenter k ne corrige pas le déséquilibre d\u0027échelle, une régression est une tâche supervisée différente, et supprimer le revenu ferait perdre une information utile."},"en":{"q":"A bank segments its customers with K-means using two features: annual income (from €10,000 to €300,000) and number of products held (from 1 to 8). The resulting segments depend almost entirely on income. Which data preparation step fixes this problem?","o":["Increase the number of clusters k until the number of products influences the segments","Normalize or standardize the features to bring them onto comparable scales","Replace K-means with a linear regression that predicts income from the products held","Remove the income feature, since it dominates the distance calculation between customers"],"e":"K-means relies on **distances**: a feature with a much larger scale (income) dominates the calculation. **Feature scaling (min-max normalization or standardization)** gives each feature comparable weight. Increasing k does not fix the scale imbalance, regression is a different supervised task, and removing income would discard useful information."}},{"n":24,"d":2,"a":["D"],"fr":{"q":"Contrairement à un réseau récurrent, un Transformer traite tous les tokens d\u0027une phrase en parallèle. Il distingue pourtant « le chien mord l\u0027homme » de « l\u0027homme mord le chien ». Quel élément de l\u0027architecture lui fournit l\u0027information sur l\u0027ordre des tokens ?","o":["La couche softmax de sortie, qui trie les tokens par ordre de probabilité décroissante","Le discriminateur, qui vérifie que l\u0027ordre des mots de la phrase générée est réaliste","La température, qui pondère chaque token en fonction de sa place dans la phrase","L\u0027encodage positionnel, qui ajoute à l\u0027embedding de chaque token une information de position"],"e":"L\u0027auto-attention seule est insensible à l\u0027ordre des tokens ; le Transformer y ajoute donc un **encodage positionnel (positional encoding)**, combiné à l\u0027embedding de chaque token, pour indiquer sa **position** dans la séquence. La couche softmax produit la distribution de probabilité du token suivant, le discriminateur appartient aux GAN, et la température est un paramètre d\u0027inférence qui règle le caractère aléatoire de l\u0027échantillonnage."},"en":{"q":"Unlike a recurrent network, a Transformer processes all the tokens of a sentence in parallel. Yet it distinguishes \u0027the dog bites the man\u0027 from \u0027the man bites the dog\u0027. Which element of the architecture provides it with information about token order?","o":["The output softmax layer, which sorts tokens in decreasing order of probability","The discriminator, which checks that the word order of the generated sentence is realistic","Temperature, which weights each token according to its place in the sentence","Positional encoding, which adds position information to each token\u0027s embedding"],"e":"Self-attention alone is insensitive to token order; the Transformer therefore adds a **positional encoding**, combined with each token\u0027s embedding, to indicate its **position** in the sequence. The softmax layer produces the probability distribution of the next token, the discriminator belongs to GANs, and temperature is an inference parameter that controls the randomness of sampling."}},{"n":25,"d":4,"a":["A"],"fr":{"q":"Dans le cadre de son rapport extra-financier, une entreprise veut suivre l\u0027évolution des émissions de carbone estimées liées à son usage d\u0027AWS, dont ses entraînements et ses inférences d\u0027IA, afin de mesurer l\u0027effet de ses choix (modèles plus petits, Régions, instances plus efficaces). Quel outil AWS utiliser ?","o":["AWS Customer Carbon Footprint Tool","Amazon CloudWatch Logs Insights","AWS Trusted Advisor","AWS Artifact"],"e":"L\u0027**AWS Customer Carbon Footprint Tool**, accessible depuis la console de facturation, fournit une **estimation des émissions de carbone** associées à l\u0027usage des services AWS et leur évolution dans le temps, ce qui aide à mesurer l\u0027**impact environnemental** des charges de travail d\u0027IA. CloudWatch Logs Insights interroge des journaux, Trusted Advisor émet des recommandations (coûts, sécurité, performance) et Artifact fournit les rapports de conformité d\u0027AWS."},"en":{"q":"As part of its sustainability report, a company wants to track the estimated carbon emissions associated with its AWS usage, including its AI training and inference, to measure the effect of its choices (smaller models, Regions, more efficient instances). Which AWS tool should it use?","o":["AWS Customer Carbon Footprint Tool","Amazon CloudWatch Logs Insights","AWS Trusted Advisor","AWS Artifact"],"e":"The **AWS Customer Carbon Footprint Tool**, available from the billing console, provides an **estimate of the carbon emissions** associated with AWS service usage and how they change over time, which helps measure the **environmental impact** of AI workloads. CloudWatch Logs Insights queries logs, Trusted Advisor issues recommendations (cost, security, performance), and Artifact provides AWS compliance reports."}},{"n":26,"d":3,"a":["B","C"],"fr":{"q":"Une équipe prépare 3 000 exemples pour fine-tuner un modèle sur Amazon Bedrock afin qu\u0027il rédige des comptes rendus d\u0027intervention dans un format normalisé. Quelles pratiques améliorent le PLUS la qualité du modèle obtenu ? (Sélectionnez DEUX réponses.)","o":["Conserver les exemples contenant des données personnelles réelles pour des sorties plus réalistes","Retirer les doublons et corriger les réponses incohérentes ou mal formatées avant l\u0027entraînement","Réserver un jeu de validation distinct pour suivre la perte de validation pendant l\u0027entraînement","Remplacer les paires prompt/réponse par du texte brut non étiqueté pour gagner du temps","Mélanger volontairement plusieurs formats de sortie pour que le modèle reste plus flexible"],"e":"La qualité d\u0027un fine-tuning dépend d\u0027abord de celle des **données étiquetées** : des exemples **propres, cohérents et dédoublonnés**, au format attendu, valent mieux qu\u0027un grand volume bruité. Un **jeu de validation** distinct permet de détecter le sur-apprentissage et de régler les hyperparamètres. Conserver des données personnelles crée un risque de fuite, le texte non étiqueté relève du continued pre-training, et mélanger les formats va à l\u0027encontre de l\u0027objectif de normalisation."},"en":{"q":"A team is preparing 3,000 examples to fine-tune a model on Amazon Bedrock so that it writes service reports in a standardized format. Which practices MOST improve the quality of the resulting model? (Select TWO.)","o":["Keep examples containing real personal data to make outputs more realistic","Remove duplicates and fix inconsistent or badly formatted responses before training","Set aside a separate validation dataset to track validation loss during training","Replace the prompt/response pairs with raw unlabeled text to save time","Deliberately mix several output formats so that the model stays more flexible"],"e":"Fine-tuning quality depends first on the quality of the **labeled data**: **clean, consistent, deduplicated** examples in the expected format are worth more than a large noisy volume. A separate **validation dataset** makes it possible to detect overfitting and tune hyperparameters. Keeping personal data creates a leakage risk, unlabeled text is for continued pre-training, and mixing formats runs counter to the standardization goal."}},{"n":27,"d":5,"a":["C"],"fr":{"q":"Une banque a créé une guardrail Amazon Bedrock obligatoire pour toutes ses applications. Elle veut empêcher techniquement qu\u0027une équipe invoque un modèle sans cette guardrail, même si un développeur oublie de la spécifier dans son code. Quelle solution répond à cette exigence ?","o":["Ajouter dans chaque prompt système une consigne rappelant d\u0027appliquer la guardrail de la banque","Activer la journalisation des invocations et vérifier chaque mois les appels effectués sans guardrail","Une politique IAM qui refuse l\u0027invocation si la condition bedrock:GuardrailIdentifier ne correspond pas","Activer Amazon Macie sur les buckets des applications pour détecter les appels non conformes"],"e":"La clé de condition IAM **bedrock:GuardrailIdentifier** permet d\u0027**imposer** l\u0027utilisation d\u0027une guardrail précise : une politique qui refuse les appels InvokeModel ou Converse ne référençant pas cette guardrail bloque toute invocation non conforme. Une consigne dans le prompt n\u0027a aucune valeur de contrôle, une revue des journaux détecte les écarts a posteriori sans les empêcher, et Macie découvre des données sensibles dans S3."},"en":{"q":"A bank has created an Amazon Bedrock guardrail that is mandatory for all its applications. It wants to technically prevent any team from invoking a model without this guardrail, even if a developer forgets to specify it in code. Which solution meets this requirement?","o":["Add an instruction to every system prompt reminding the model to apply the bank\u0027s guardrail","Enable invocation logging and review calls made without a guardrail every month","An IAM policy that denies invocation if the bedrock:GuardrailIdentifier condition does not match","Enable Amazon Macie on the applications\u0027 buckets to detect noncompliant calls"],"e":"The **bedrock:GuardrailIdentifier** IAM condition key makes it possible to **enforce** the use of a specific guardrail: a policy that denies InvokeModel or Converse calls that do not reference this guardrail blocks any noncompliant invocation. An instruction in the prompt has no control value, a log review detects deviations after the fact without preventing them, and Macie discovers sensitive data in S3."}},{"n":28,"d":1,"a":["B"],"fr":{"q":"Un opérateur de télécommunications dispose de 2 millions de journaux réseau non étiquetés et de seulement 3 000 journaux qu\u0027un analyste a étiquetés « intrusion » ou « normal ». Il veut entraîner un détecteur d\u0027intrusions en tirant parti des deux ensembles. Quelle approche d\u0027apprentissage correspond à ce cas ?","o":["L\u0027apprentissage par renforcement, qui récompense le modèle lorsqu\u0027il bloque une intrusion réelle","L\u0027apprentissage semi-supervisé, qui combine un petit jeu étiqueté et un grand volume non étiqueté","L\u0027apprentissage supervisé seul, en ignorant les journaux non étiquetés jugés sans information utile","Le clustering K-means seul, qui attribue automatiquement les étiquettes « intrusion » et « normal »"],"e":"L\u0027**apprentissage semi-supervisé** exploite un **petit ensemble étiqueté** et un **grand ensemble non étiqueté**, par exemple en propageant des pseudo-étiquettes, ce qui correspond exactement à ce cas. Le supervisé seul gaspille les 2 millions de journaux. Le K-means forme des groupes mais ne leur donne pas de sens métier, et le renforcement suppose un agent qui interagit avec un environnement et reçoit des récompenses."},"en":{"q":"A telecom operator has 2 million unlabeled network logs and only 3,000 logs that an analyst has labeled \u0027intrusion\u0027 or \u0027normal\u0027. It wants to train an intrusion detector that takes advantage of both sets. Which learning approach fits this case?","o":["Reinforcement learning, which rewards the model when it blocks a real intrusion","Semi-supervised learning, which combines a small labeled set with a large unlabeled volume","Supervised learning only, ignoring the unlabeled logs considered to carry no useful information","K-means clustering only, which automatically assigns the \u0027intrusion\u0027 and \u0027normal\u0027 labels"],"e":"**Semi-supervised learning** uses a **small labeled set** and a **large unlabeled set**, for example by propagating pseudo-labels, which matches this case exactly. Supervised learning alone wastes the 2 million logs. K-means forms groups but gives them no business meaning, and reinforcement learning assumes an agent interacting with an environment and receiving rewards."}},{"n":29,"d":2,"a":["D"],"fr":{"q":"Une équipe déploie depuis SageMaker JumpStart la version de base (uniquement pré-entraînée) d\u0027un LLM open source. À la question « Quelle est la capitale du Portugal ? », le modèle répond par une liste d\u0027autres questions de quiz au lieu de répondre. Quelle est l\u0027explication la PLUS probable ?","o":["La fenêtre de contexte du modèle est trop petite pour contenir une question aussi courte","Le modèle a été pré-entraîné par apprentissage supervisé sur des paires de questions de quiz","La température est fixée à 0, ce qui empêche le modèle de produire une réponse directe","Le modèle de base prolonge le texte : il n\u0027a pas été affiné pour suivre des instructions"],"e":"Un **modèle de base** est seulement pré-entraîné à **prédire la suite d\u0027un texte** : face à une question, il peut produire une continuation plausible (d\u0027autres questions) plutôt qu\u0027une réponse. Les variantes « instruct » ou « chat » ont été **affinées pour suivre des instructions** (instruction tuning, puis alignement comme le RLHF). Une question courte ne sature pas la fenêtre de contexte, le pré-entraînement est auto-supervisé et non fondé sur des paires annotées, et une température à 0 rend la sortie déterministe sans l\u0027empêcher de répondre."},"en":{"q":"A team deploys from SageMaker JumpStart the base version (pre-trained only) of an open source LLM. Asked \u0027What is the capital of Portugal?\u0027, the model responds with a list of other quiz questions instead of answering. What is the MOST likely explanation?","o":["The model\u0027s context window is too small to hold such a short question","The model was pre-trained with supervised learning on pairs of quiz questions","The temperature is set to 0, which prevents the model from producing a direct answer","The base model continues the text: it has not been tuned to follow instructions"],"e":"A **base model** is only pre-trained to **predict the continuation of a text**: faced with a question, it may produce a plausible continuation (more questions) rather than an answer. \u0027Instruct\u0027 or \u0027chat\u0027 variants have been **tuned to follow instructions** (instruction tuning, then alignment such as RLHF). A short question does not saturate the context window, pre-training is self-supervised rather than based on annotated pairs, and a temperature of 0 makes output deterministic without preventing an answer."}},{"n":30,"d":3,"a":["A"],"fr":{"q":"Les utilisateurs d\u0027un assistant RAG fondé sur une base de connaissances Amazon Bedrock posent des questions composées, comme « Compare les délais de résiliation des contrats habitation et auto, et indique lequel a changé en 2026 ». Une seule recherche vectorielle sur la question entière récupère des passages incomplets. Quelle option de la base de connaissances améliore le PLUS ce cas ?","o":["La décomposition de requête, qui scinde la question en sous-requêtes recherchées séparément","Une augmentation de la température, pour que le modèle complète les informations manquantes","Un filtre de mots Guardrails qui bloque les questions comportant plusieurs sujets","Un passage du découpage hiérarchique au découpage à taille fixe sans chevauchement"],"e":"La **décomposition de requête (query decomposition)**, proposée par Bedrock Knowledge Bases lors de la récupération et génération, divise une question complexe en **sous-requêtes** plus simples, recherchées séparément, puis réunit les passages obtenus : chaque partie de la question trouve ainsi son contexte. Une température élevée inciterait le modèle à inventer, bloquer ces questions dégrade le service, et changer de découpage ne règle pas le problème d\u0027une requête qui mêle plusieurs sujets."},"en":{"q":"Users of a RAG assistant built on an Amazon Bedrock knowledge base ask compound questions such as \u0027Compare the cancellation periods for home and car policies, and tell me which one changed in 2026\u0027. A single vector search on the whole question retrieves incomplete passages. Which knowledge base option MOST improves this case?","o":["Query decomposition, which splits the question into sub-queries that are searched separately","Raising the temperature so that the model fills in the missing information","A Guardrails word filter that blocks questions covering several subjects","Switching from hierarchical chunking to fixed-size chunking with no overlap"],"e":"**Query decomposition**, offered by Bedrock Knowledge Bases during retrieval and generation, breaks a complex question into simpler **sub-queries**, searched separately, and then combines the retrieved passages: each part of the question thus finds its context. A high temperature would encourage the model to invent, blocking these questions degrades the service, and changing the chunking does not fix a query that mixes several subjects."}},{"n":31,"d":4,"a":["C"],"fr":{"q":"Une agence d\u0027emploi utilise un modèle génératif pour illustrer et décrire des fiches métiers. Des tests montrent que les métiers d\u0027infirmier sont presque toujours associés à des femmes et ceux d\u0027ingénieur à des hommes. Avant la mise en production, quelle démarche répond le MIEUX à ce risque ?","o":["Augmenter la température pour que les représentations varient de façon aléatoire","Publier les fiches telles quelles, puisque le modèle reflète les données réelles d\u0027entraînement","Évaluer systématiquement les sorties sur un jeu de prompts dédié avec une métrique de stéréotypes, puis corriger et réévaluer","Retirer toute mention de métier des prompts afin d\u0027éviter les associations stéréotypées"],"e":"Les **stéréotypes** reproduits par un modèle génératif se traitent par une **évaluation systématique** : un jeu de prompts couvrant les métiers et les groupes, une métrique dédiée (les évaluations LLM-as-a-judge d\u0027Amazon Bedrock proposent par exemple une métrique de **stéréotypes**), une revue humaine, puis des corrections (consignes, choix du modèle, garde-fous) suivies d\u0027une nouvelle évaluation. Une variation aléatoire ne garantit rien, reproduire les biais des données n\u0027est pas responsable, et supprimer le métier vide le service de son objet."},"en":{"q":"An employment agency uses a generative model to illustrate and describe job profiles. Tests show that nursing jobs are almost always associated with women and engineering jobs with men. Before going to production, which approach BEST addresses this risk?","o":["Raise the temperature so that representations vary randomly","Publish the profiles as they are, since the model reflects the actual training data","Systematically evaluate outputs on a dedicated prompt set with a stereotyping metric, then fix and re-evaluate","Remove any mention of the job from the prompts to avoid stereotyped associations"],"e":"**Stereotypes** reproduced by a generative model are addressed through **systematic evaluation**: a prompt set covering jobs and groups, a dedicated metric (Amazon Bedrock LLM-as-a-judge evaluations, for example, offer a **stereotyping** metric), human review, and then fixes (instructions, model choice, guardrails) followed by re-evaluation. Random variation guarantees nothing, reproducing data biases is not responsible, and removing the job defeats
