/* ---------- Quiz ---------- */
function randomExam(){
  const all = DATA.flatMap(e=>e.questions.map(q=>({id:e.id+"-"+q.n, d:q.d})));
  let ids = [];
  for(const d of Object.keys(WEIGHTS)) ids = ids.concat(shuffle(all.filter(x=>x.d===+d)).slice(0, WEIGHTS[d]).map(x=>x.id));
  if(ids.length < EXAM_Q) ids = ids.concat(shuffle(all.map(x=>x.id).filter(id=>!ids.includes(id))).slice(0, EXAM_Q-ids.length));
  return shuffle(ids);
}
function start(o){
  const ids = o.shQ ? shuffle(o.ids) : o.ids.slice();
  const order = {};
  ids.forEach(id => { const q = qById(id); const ks = q.fr.o.map((_,i)=>i); order[id] = o.shO ? shuffle(ks) : ks; });
  S = { v:META.version, key:o.key, from:o.from || null, mode:o.mode, ids, order, ans:{}, checked:{}, flags:{}, cur:0,
        limit: o.mode==="exam" ? minutesFor(ids.length)*60 : 0, elapsed:0, finished:false };
  store.session = S; save();
  runQuiz();
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function runQuiz(){
  stopTimer();
  let last = Date.now();
  timerId = setInterval(() => {
    const now = Date.now(); S.elapsed += (now-last)/1000; last = now;
    const t = $("#timer"); if(t) updTimer(t);
    if(S.mode==="exam" && S.elapsed >= S.limit){ alert(T().timeUp); finish(); return; }
    if(Math.round(S.elapsed)%5===0){ store.session = S; save(); }
  }, 1000);
  renderQ();
}
function updTimer(t){
  if(S.mode==="exam"){ const r = S.limit - S.elapsed; t.textContent = "⏱️ " + fmtTime(r); t.classList.toggle("low", r < 300); }
  else t.textContent = "⏱️ " + fmtTime(S.elapsed);
}
function renderQ(){

  const L10 = T();
  const id = S.ids[S.cur], q = qById(id), t = tx(q), ord = S.order[id], good = ansOf(id);
  const sel = S.ans[id] || [], multi = good.length > 1, checked = !!S.checked[id];
  const nAns = Object.keys(S.ans).filter(k=>S.ans[k].length).length;
  let h = `<div class="card"><div class="qhead"><div><b>${esc(sTitle(S))}</b> <span class="mut">· ${S.mode==="exam"?L10.modeExam:L10.modeTrain}</span></div>

  <div class="progress"><div style="width:${(S.cur+1)/S.ids.length*100}%"></div></div>
  <div class="row" style="justify-content:space-between"><span class="mut">${L10.qpos(S.cur+1, S.ids.length, nAns)}</span>
  <span class="mut">${S.mode==="train"?`<span class="dom" title="${esc(L10.domains[q.d]||"")}">${L10.dom(q.d)} · ${esc(L10.domains[q.d]||"")}</span> `:""}${S.key==="random"||S.key==="wrong"?L10.origin(id.split("-")[0], id.split("-")[1]):""}</span></div>
  <div class="qtext">${inline(t.q)}</div>
  <div class="hint">${multi ? L10.pickN(nWord(good.length)) : L10.pick1}</div><div id="choices">`;
  ord.forEach((oi, pos) => {
    const isSel = sel.includes(oi), isGood = good.includes(keyOf(oi));
    let cls = "choice";
    if(checked){ cls += " locked"; if(isGood) cls += " good"; else if(isSel) cls += " bad"; }
    else if(isSel) cls += " sel";

      <span class="k">${keyOf(pos)}.</span><span>${inline(t.o[oi])}</span></label>`;
  });

  $("#end").onclick = () => {
    const rest = S.ids.length - Object.keys(S.ans).filter(k=>S.ans[k].length).length;
    if(confirm(rest ? L10.endRest(rest) : L10.endQ)) finish();
  };
  $("#quit").onclick = () => { persist(); home(); };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
}
function persist(){ store.session = S; save(); }
function pick(oi){
  const id = S.ids[S.cur], need = ansOf(id).length;
  if(S.checked[id]) return;
  let sel = (S.ans[id] || []).slice();
  if(need > 1){
    if(sel.includes(oi)) sel = sel.filter(x=>x!==oi);

}
function check(){
  const id = S.ids[S.cur];

  S.checked[id] = true;
  trackWrong(id); persist(); renderQ();
}
function go(i){ if(i<0 || i>=S.ids.length) return; S.cur = i; persist(); renderQ(); window.scrollTo(0,0); }
function isCorrect(id){ return same((S.ans[id]||[]).map(keyOf), ansOf(id)); }
function trackWrong(id){ if(isCorrect(id)) delete store.wrong[id]; else store.wrong[id] = 1; }

/* ---------- Résultats ---------- */
function finish(){
  stopTimer();
  S.ids.forEach(id => { if(S.mode==="exam" || S.checked[id] || (S.ans[id]||[]).length) trackWrong(id); });
  const good = S.ids.filter(isCorrect).length, pct = Math.round(good/S.ids.length*100);
  if(/^\d+$/.test(S.key)){

  results("all");
}

  let dt = `<table class="doms"><tr><th>${L10.domCol}</th><th class="n">${L10.domW}</th><th></th><th class="n">%</th></tr>`;

    ${S.ids.some(id=>!isCorrect(id))?`<button id="retryWrong">${L10.retryWrong}</button>`:""}<button id="back">${L10.back}</button></div></div>
  <div class="card"><h3 style="margin:0">${L10.byDom}</h3>${dt}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${L10.review}</h3>
  <div class="seg" id="flt"><button data-f="all">${L10.fAll(n)}</button><button data-f="ko">${L10.fKo(n-good)}</button><button data-f="flag">${L10.fFlag(S.ids.filter(id=>S.flags[id]).length)}</button></div></div>`;
  S.ids.forEach((id,i) => {
    const ok = isCorrect(id);
    if(filter==="ko" && ok) return;
    if(filter==="flag" && !S.flags[id]) return;
    const q = qById(id), t = tx(q), ord = S.order[id], sel = S.ans[id] || [];
    const fmt = arr => arr.length ? arr.map(oi=>`<b>${keyOf(ord.indexOf(oi))}.</b> ${inline(t.o[oi])}`).join("<br>") : `<i>${L10.none}</i>`;
    const goodOi = ansOf(id).map(idxOf).sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));
    h += `<div class="rv"><div><span class="${ok?"tag-ok":"tag-ko"}">${ok?"✔":"✘"} Q${i+1}</span> ${S.flags[id]?"🚩":""} ${inline(t.q)}</div>
      ${ok?"":`<div class="ans">${L10.yours} <span style="color:var(--ko)">${fmt(sel.slice().sort((a,b)=>ord.indexOf(a)-ord.indexOf(b)))}</span></div>`}
      <div class="ans">${L10.goodA} <span style="color:var(--ok)">${fmt(goodOi)}</span></div>
      ${t.e?`<details class="expl"><summary>${L10.expl}</summary>${md(t.e)}</details>`:""}</div>`;
  });
  h += `</div>`;
  app.innerHTML = h; window.scrollTo(0,0);
  document.querySelectorAll("#flt button").forEach(b => { b.classList.toggle("on", b.dataset.f===filter); b.onclick = () => results(b.dataset.f); });
  $("#back").onclick = home;
  $("#again").onclick = () => start({ key:S.key, from:S.from, ids:S.ids, mode:S.mode, shQ:store.shQ, shO:store.shO });
  if($("#retryWrong")) $("#retryWrong").onclick = () => start({ key:"wrong", from:S.from || S.key, ids:S.ids.filter(id=>!isCorrect(id)), mode:S.mode, shQ:false, shO:store.shO });
}

/* ---------- Global ---------- */
document.addEventListener("keydown", e => {
  if(!S || S.finished || e.ctrlKey || e.metaKey || e.altKey || !$("#choices")) return;
  const k = e.key.toUpperCase(), id = S.ids[S.cur], q = qById(id);
  let pos = -1;
  if(/^[A-F]$/.test(k)) pos = k.charCodeAt(0)-65; else if(/^[1-6]$/.test(k)) pos = +k-1;
  if(pos >= 0 && pos < S.order[id].length){ pick(S.order[id][pos]); return; }
  if(k==="M"){ $("#flag").click(); return; }
  if(e.key==="ArrowLeft") go(S.cur-1);
  else if(e.key==="ArrowRight") go(S.cur+1);
  else if(e.key==="Enter"){
    e.preventDefault();
    if(S.mode==="train" && !S.checked[id] && (S.ans[id]||[]).length) check();
    else if(S.cur < S.ids.length-1) go(S.cur+1);
  }
});
function applyTheme(){ const t = store.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); document.documentElement.dataset.theme = t; }
function applyLang(){
  const t = T();
  document.documentElement.lang = L();
  document.title = t.docTitle;
  $("#hdr").textContent = t.hdr; $("#home").title = t.home; $("#theme").title = t.theme; $("#lang").title = t.lang;
  $("#foot").textContent = t.footer;
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l===L()));
}
document.querySelectorAll("#lang button").forEach(b => b.onclick = () => { store.lang = b.dataset.l; save(); applyLang(); redraw(); });
$("#theme").onclick = () => { store.theme = document.documentElement.dataset.theme==="dark" ? "light" : "dark"; save(); applyTheme(); };
$("#home").onclick = () => { if(S && !S.finished) persist(); home(); };
// Après une recompilation (nouveau contenu), toute session en cours est invalidée.
if(store.session && store.session.v!==META.version) store.session = null;
for(const id of Object.keys(store.wrong)) if(!qById(id)) delete store.wrong[id];
save();
applyTheme(); applyLang(); home();
</script>
