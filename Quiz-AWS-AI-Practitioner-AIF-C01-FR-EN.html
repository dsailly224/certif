ce","Amazon Aurora PostgreSQL with pgvector"],"e":"**Amazon OpenSearch Service** (k-NN search, including in Serverless mode) and **Aurora PostgreSQL with the pgvector extension** store vectors and compute their similarity; Neptune Analytics, DocumentDB, and MemoryDB can do so as well. Athena queries data in S3 with SQL, the Glue Data Catalog stores metadata, and Kinesis Data Streams ingests real-time streams."}},{"n":52,"d":3,"a":["B"],"fr":{"q":"Quel service AWS fournit un environnement d\u0027exécution serverless et sécurisé pour déployer et faire fonctionner des agents d\u0027IA, quel que soit le framework utilisé pour les construire ?","o":["Amazon Bedrock Knowledge Bases","Amazon Bedrock AgentCore","Amazon SageMaker Canvas","Amazon Lex"],"e":"**Amazon Bedrock AgentCore** fournit des briques managées pour les agents : **Runtime** serverless, Gateway (qui transforme des API ou des fonctions Lambda en outils MCP), Memory, Identity et Observability, compatibles avec tout framework (Strands Agents, LangGraph…). Knowledge Bases gère le RAG, Canvas le ML no-code et Lex des chatbots à base d\u0027intentions."},"en":{"q":"Which AWS service provides a secure, serverless runtime environment to deploy and operate AI agents, regardless of the framework used to build them?","o":["Amazon Bedrock Knowledge Bases","Amazon Bedrock AgentCore","Amazon SageMaker Canvas","Amazon Lex"],"e":"**Amazon Bedrock AgentCore** provides managed building blocks for agents: a serverless **Runtime**, Gateway (which turns APIs or Lambda functions into MCP tools), Memory, Identity, and Observability, compatible with any framework (Strands Agents, LangGraph, and others). Knowledge Bases handles RAG, Canvas handles no-code ML, and Lex builds intent-based chatbots."}},{"n":53,"d":4,"a":["C"],"fr":{"q":"Une plateforme éducative pour adolescents utilise Amazon Bedrock et veut bloquer les contenus haineux, violents ou à caractère sexuel, dans les questions comme dans les réponses. Quelle fonctionnalité utiliser ?","o":["Le paramètre de température du modèle","Amazon Bedrock Knowledge Bases","Les filtres de contenu d\u0027Amazon Bedrock Guardrails","La journalisation des invocations de modèles"],"e":"**Amazon Bedrock Guardrails** applique des **filtres de contenu** (haine, insultes, sexuel, violence, inconduite, attaques de prompt) avec un niveau de sévérité réglable, sur les entrées comme sur les sorties, en plus des sujets refusés et du masquage des PII. La température règle la créativité, Knowledge Bases ajoute des connaissances et la journalisation trace les échanges sans rien bloquer."},"en":{"q":"An educational platform for teenagers uses Amazon Bedrock and wants to block hateful, violent, or sexual content in both questions and answers. Which feature should it use?","o":["The model\u0027s temperature parameter","Amazon Bedrock Knowledge Bases","Amazon Bedrock Guardrails content filters","Model invocation logging"],"e":"**Amazon Bedrock Guardrails** applies **content filters** (hate, insults, sexual, violence, misconduct, prompt attacks) with adjustable strength, on both inputs and outputs, in addition to denied topics and PII masking. Temperature adjusts creativity, Knowledge Bases adds knowledge, and logging records exchanges without blocking anything."}},{"n":54,"d":1,"a":["A"],"fr":{"q":"Un modèle de prévision des ventes, très performant lors de son déploiement, voit ses performances baisser régulièrement depuis que les habitudes d\u0027achat des clients ont changé. Quelle est la cause la plus probable et la réponse adaptée ?","o":["Une dérive des données ; surveiller le modèle et le réentraîner","Un sur-apprentissage ; supprimer le jeu de validation","Une hallucination ; baisser la température du modèle","Une fuite de données ; chiffrer le jeu d\u0027entraînement"],"e":"Quand la distribution des données de production s\u0027éloigne de celle des données d\u0027entraînement, on parle de **dérive des données** (data drift) : les performances se dégradent progressivement. La réponse est une **surveillance** continue (par exemple avec MLflow et CloudWatch) suivie d\u0027un **réentraînement** sur des données récentes, étape clé du cycle MLOps. Les hallucinations concernent l\u0027IA générative, et supprimer la validation ou chiffrer les données ne corrige pas la baisse de performance."},"en":{"q":"A sales forecasting model that performed very well at deployment has seen its performance steadily decline since customers\u0027 buying habits changed. What is the MOST likely cause and the appropriate response?","o":["Data drift; monitor the model and retrain it","Overfitting; remove the validation dataset","Hallucination; lower the model\u0027s temperature","Data leakage; encrypt the training dataset"],"e":"When the distribution of production data moves away from that of the training data, this is called **data drift**: performance degrades progressively. The response is continuous **monitoring** (for example, with MLflow and CloudWatch) followed by **retraining** on recent data, a key step in the MLOps lifecycle. Hallucinations concern generative AI, and removing validation or encrypting data does not fix the performance decline."}},{"n":55,"d":2,"a":["B"],"fr":{"q":"Lors de la préparation d\u0027un système RAG, pourquoi découpe-t-on les documents en fragments (chunking) avant de calculer leurs embeddings ?","o":["Pour compresser les documents et réduire le stockage S3","Pour retrouver des passages précis qui tiennent dans la fenêtre de contexte","Pour chiffrer chaque fragment avec une clé différente","Pour pouvoir effectuer un fine-tuning du modèle sur chaque fragment"],"e":"Le **chunking** divise les documents en morceaux de taille maîtrisée : chaque fragment reçoit son propre embedding, ce qui permet de récupérer uniquement les passages pertinents et de les insérer dans la **fenêtre de contexte** du modèle. La taille et le chevauchement des fragments influencent la qualité des réponses. Le découpage ne vise ni la compression, ni le chiffrement, ni le fine-tuning."},"en":{"q":"When preparing a RAG system, why are documents split into fragments (chunking) before their embeddings are computed?","o":["To compress the documents and reduce S3 storage","To retrieve precise passages that fit in the context window","To encrypt each fragment with a different key","To be able to fine-tune the model on each fragment"],"e":"**Chunking** splits documents into pieces of controlled size: each fragment gets its own embedding, so that only the relevant passages are retrieved and inserted into the model\u0027s **context window**. Chunk size and overlap affect the quality of the answers. Chunking is not meant for compression, encryption, or fine-tuning."}},{"n":56,"d":3,"a":["D"],"fr":{"q":"Les réponses d\u0027un assistant basé sur Amazon Bedrock sont souvent beaucoup trop longues, ce qui augmente les coûts. Quel paramètre d\u0027inférence permet de limiter directement la longueur des réponses générées ?","o":["La température","Le top-k","La pénalité de présence","Le nombre maximal de tokens (max tokens)"],"e":"Le paramètre **max tokens** fixe un plafond au nombre de tokens générés, ce qui limite la longueur et le coût des réponses (on peut aussi le demander dans le prompt ou utiliser des séquences d\u0027arrêt). La température et le top-k agissent sur le caractère aléatoire du choix des tokens, et la pénalité de présence décourage la répétition de tokens déjà utilisés."},"en":{"q":"The responses of an assistant built on Amazon Bedrock are often far too long, which increases costs. Which inference parameter directly limits the length of the generated responses?","o":["Temperature","Top-k","Presence penalty","Maximum tokens (max tokens)"],"e":"The **max tokens** parameter sets a ceiling on the number of generated tokens, which limits the length and cost of responses (you can also ask for brevity in the prompt or use stop sequences). Temperature and top-k affect the randomness of token selection, and the presence penalty discourages repeating tokens already used."}},{"n":57,"d":5,"a":["A","B"],"fr":{"q":"Une entreprise s\u0027inquiète de la confidentialité des données envoyées à Amazon Bedrock. Quelles affirmations sont exactes ? (Sélectionnez DEUX réponses.)","o":["Les prompts et les réponses ne servent pas à entraîner les modèles de base","Les données sont chiffrées en transit et au repos","Les prompts sont partagés avec le fournisseur du modèle pour l\u0027améliorer","Les données de fine-tuning deviennent accessibles aux autres clients","Il faut héberger soi-même le modèle pour garder ses données privées"],"e":"Amazon Bedrock **n\u0027utilise pas les prompts ni les réponses** des clients pour entraîner les modèles de base et ne les partage pas avec les fournisseurs de modèles ; les données sont **chiffrées en transit et au repos** (avec possibilité d\u0027utiliser des clés KMS gérées par le client). Les modèles personnalisés restent privés au compte du client, et il n\u0027est pas nécessaire d\u0027héberger soi-même un modèle pour préserver la confidentialité."},"en":{"q":"A company is concerned about the privacy of the data it sends to Amazon Bedrock. Which statements are correct? (Select TWO.)","o":["Prompts and responses are not used to train the base models","Data is encrypted in transit and at rest","Prompts are shared with the model provider to improve the model","Fine-tuning data becomes accessible to other customers","You must self-host the model to keep your data private"],"e":"Amazon Bedrock **does not use customer prompts or responses** to train the base models and does not share them with model providers; data is **encrypted in transit and at rest** (with the option of customer managed KMS keys). Custom models remain private to the customer\u0027s account, and self-hosting a model is not necessary to preserve privacy."}},{"n":58,"d":3,"a":["C"],"fr":{"q":"Qu\u0027est-ce que Strands Agents ?","o":["Un service managé de RAG qui indexe des documents stockés dans S3","Un IDE agentique qui transforme des spécifications en code","Un SDK open source d\u0027AWS pour créer des agents à partir d\u0027un modèle, d\u0027un prompt et d\u0027outils","Une bibliothèque de filtres de contenu pour sécuriser les chatbots"],"e":"**Strands Agents** est un **SDK open source** d\u0027AWS : on définit un modèle, un prompt et une liste d\u0027outils, et le modèle planifie lui-même les étapes et les appels d\u0027outils. Les agents ainsi créés peuvent être déployés sur AgentCore, Lambda ou des conteneurs. Le RAG managé correspond à Bedrock Knowledge Bases, l\u0027IDE agentique à Kiro et les filtres de contenu à Guardrails."},"en":{"q":"What is Strands Agents?","o":["A managed RAG service that indexes documents stored in S3","An agentic IDE that turns specifications into code","An open source AWS SDK for building agents from a model, a prompt, and tools","A library of content filters for securing chatbots"],"e":"**Strands Agents** is an **open source SDK** from AWS: you define a model, a prompt, and a list of tools, and the model plans the steps and tool calls itself. The resulting agents can be deployed on AgentCore, Lambda, or containers. Managed RAG corresponds to Bedrock Knowledge Bases, the agentic IDE to Kiro, and content filters to Guardrails."}},{"n":59,"d":2,"a":["A"],"fr":{"q":"Dans l\u0027IA générative, qu\u0027est-ce qui distingue un agent d\u0027un simple chatbot ?","o":["Il planifie des étapes et appelle des outils ou des API pour accomplir une tâche","Il fonctionne sans aucun modèle de fondation sous-jacent","Il répond uniquement à partir de règles et de scripts prédéfinis","Il garantit des réponses parfaitement déterministes"],"e":"Un **agent** utilise un modèle de fondation comme moteur de raisonnement : il décompose un objectif en étapes, **appelle des outils** (API, bases de données, fonctions) et s\u0027appuie sur les résultats pour agir, par exemple selon le schéma ReAct. Il repose bien sur un modèle, n\u0027est pas limité à des scripts fixes et reste non déterministe."},"en":{"q":"In generative AI, what distinguishes an agent from a simple chatbot?","o":["It plans steps and calls tools or APIs to accomplish a task","It works without any underlying foundation model","It responds only based on predefined rules and scripts","It guarantees perfectly deterministic responses"],"e":"An **agent** uses a foundation model as its reasoning engine: it breaks a goal into steps, **calls tools** (APIs, databases, functions), and uses the results to act, for example following the ReAct pattern. It does rely on a model, is not limited to fixed scripts, and remains non-deterministic."}},{"n":60,"d":4,"a":["C","E"],"fr":{"q":"Une entreprise veut réduire l\u0027impact environnemental de ses projets d\u0027IA générative. Quelles pratiques sont recommandées ? (Sélectionnez DEUX réponses.)","o":["Toujours choisir le plus grand modèle disponible","Réentraîner entièrement le modèle chaque semaine","Choisir le plus petit modèle qui répond au besoin","Augmenter systématiquement le nombre maximal de tokens","Réutiliser un modèle pré-entraîné plutôt qu\u0027en entraîner un de zéro"],"e":"Un **modèle plus petit** mais suffisant et la **réutilisation de modèles pré-entraînés** (prompt engineering, RAG, fine-tuning léger) réduisent fortement la puissance de calcul, donc l\u0027énergie consommée. Choisir systématiquement le plus grand modèle, réentraîner sans nécessité ou générer des réponses inutilement longues augmente au contraire la consommation."},"en":{"q":"A company wants to reduce the environmental impact of its generative AI projects. Which practices are recommended? (Select TWO.)","o":["Always choose the largest available model","Fully retrain the model every week","Choose the smallest model that meets the need","Systematically increase the maximum number of tokens","Reuse a pre-trained model instead of training one from scratch"],"e":"A **smaller model** that is still sufficient and the **reuse of pre-trained models** (prompt engineering, RAG, light fine-tuning) greatly reduce compute, and therefore energy consumption. Systematically choosing the largest model, retraining unnecessarily, or generating needlessly long responses increases consumption instead."}},{"n":61,"d":1,"a":["B"],"fr":{"q":"Un modèle de dépistage détecte une maladie grave à partir d\u0027analyses médicales. Manquer un patient malade (faux négatif) est bien plus grave qu\u0027une fausse alerte. Quelle métrique faut-il privilégier ?","o":["La précision (precision)","Le rappel (recall)","L\u0027erreur absolue moyenne (MAE)","Le score BLEU"],"e":"Le **rappel** = VP / (VP + FN) mesure la part des cas positifs réellement détectés : le maximiser réduit les **faux négatifs**. La précision est à privilégier quand les faux positifs sont coûteux, la MAE évalue une régression et BLEU une traduction automatique."},"en":{"q":"A screening model detects a serious disease from medical test results. Missing a sick patient (false negative) is much worse than a false alarm. Which metric should be prioritized?","o":["Precision","Recall","Mean absolute error (MAE)","BLEU score"],"e":"**Recall** = TP / (TP + FN) measures the share of actual positive cases that are detected: maximizing it reduces **false negatives**. Precision should be prioritized when false positives are costly, MAE evaluates a regression, and BLEU evaluates machine translation."}},{"n":62,"d":3,"a":["D"],"fr":{"q":"Une équipe de développement veut un IDE agentique d\u0027AWS qui transforme une demande en langage naturel en spécifications (exigences, conception, tâches), puis génère le code et les tests correspondants. Quel outil utiliser ?","o":["AWS Transform","Amazon Quick","Amazon SageMaker Canvas","Kiro"],"e":"**Kiro** est l\u0027IDE (et la CLI) agentique d\u0027AWS fondé sur le **développement piloté par les spécifications** : prompt, puis exigences, conception et tâches, puis code et tests ; il succède notamment à la CLI d\u0027Amazon Q Developer. AWS Transform modernise des applications existantes (mainframe, VMware, .NET, Java), Amazon Quick est un espace de travail agentique sur les données de l\u0027entreprise, et Canvas sert au ML no-code."},"en":{"q":"A development team wants an AWS agentic IDE that turns a natural language request into specifications (requirements, design, tasks) and then generates the corresponding code and tests. Which tool should the team use?","o":["AWS Transform","Amazon Quick","Amazon SageMaker Canvas","Kiro"],"e":"**Kiro** is the AWS agentic IDE (and CLI) built around **spec-driven development**: prompt, then requirements, design, and tasks, then code and tests; it notably succeeds the Amazon Q Developer CLI. AWS Transform modernizes existing applications (mainframe, VMware, .NET, Java), Amazon Quick is an agentic workspace over company data, and Canvas is for no-code ML."}},{"n":63,"d":5,"a":["C"],"fr":{"q":"Selon la Generative AI Security Scoping Matrix d\u0027AWS, quel scénario correspond à la portée (scope) dans laquelle l\u0027entreprise porte le plus de responsabilités de sécurité ?","o":["Utiliser une application d\u0027IA générative grand public","Utiliser une application SaaS d\u0027entreprise intégrant l\u0027IA générative","Entraîner son propre modèle à partir de zéro sur ses données","Construire une application sur un modèle de fondation via une API"],"e":"La **Generative AI Security Scoping Matrix** classe les usages de la portée 1 (application grand public) à la portée 5 (**modèle entraîné soi-même**), en passant par les applications d\u0027entreprise (2), les modèles pré-entraînés utilisés via API (3) et les modèles affinés (4). Plus la portée est élevée, plus le client contrôle — et doit sécuriser — de couches : données d\u0027entraînement, modèle, infrastructure et application."},"en":{"q":"According to the AWS Generative AI Security Scoping Matrix, which scenario corresponds to the scope in which the company carries the MOST security responsibilities?","o":["Using a consumer generative AI application","Using an enterprise SaaS application with built-in generative AI","Training its own model from scratch on its data","Building an application on a foundation model through an API"],"e":"The **Generative AI Security Scoping Matrix** classifies uses from scope 1 (consumer application) to scope 5 (**self-trained model**), through enterprise applications (2), pre-trained models used through an API (3), and fine-tuned models (4). The higher the scope, the more layers the customer controls—and must secure: training data, model, infrastructure, and application."}},{"n":64,"d":2,"a":["A"],"fr":{"q":"Que désigne le Model Context Protocol (MCP) ?","o":["Un protocole ouvert qui standardise la connexion des modèles et agents à des outils et sources de données","Un algorithme de compression qui réduit la taille de la fenêtre de contexte","Une norme de chiffrement des prompts échangés entre le client et le modèle","Une méthode de fine-tuning qui ajoute du contexte métier au modèle"],"e":"Le **Model Context Protocol (MCP)** est un **standard ouvert** décrivant comment une application d\u0027IA (client MCP) découvre et appelle des outils, des ressources et des prompts exposés par des serveurs MCP. AgentCore Gateway peut par exemple transformer des API ou des fonctions Lambda en outils MCP. Ce n\u0027est ni un algorithme de compression, ni une norme de chiffrement, ni une technique d\u0027entraînement."},"en":{"q":"What is the Model Context Protocol (MCP)?","o":["An open protocol that standardizes how models and agents connect to tools and data sources","A compression algorithm that reduces the size of the context window","An encryption standard for prompts exchanged between the client and the model","A fine-tuning method that adds business context to the model"],"e":"The **Model Context Protocol (MCP)** is an **open standard** that describes how an AI application (MCP client) discovers and calls tools, resources, and prompts exposed by MCP servers. For example, AgentCore Gateway can turn APIs or Lambda functions into MCP tools. It is not a compression algorithm, an encryption standard, or a training technique."}},{"n":65,"d":4,"a":["D"],"fr":{"q":"Une maison d\u0027édition constate qu\u0027un modèle génératif reproduit presque mot pour mot des passages d\u0027un roman protégé. Quel risque de l\u0027IA générative est principalement illustré ?","o":["Un sous-apprentissage du modèle","Une dérive des données en production","Une fuite du prompt système","Une atteinte à la propriété intellectuelle"],"e":"Reproduire des œuvres protégées expose à des **risques de propriété intellectuelle** (droit d\u0027auteur), un enjeu juridique majeur de l\u0027IA générative. On les limite par le choix de modèles aux données d\u0027entraînement documentées, des filtres et une revue humaine ; AWS propose aussi une indemnisation IP sous conditions pour certains services. Le sous-apprentissage, la dérive des données et la fuite du prompt système sont des problèmes différents."},"en":{"q":"A publishing house notices that a generative model reproduces almost word for word passages from a copyrighted novel. Which generative AI risk is MAINLY illustrated?","o":["Model underfitting","Data drift in production","System prompt leakage","Intellectual property infringement"],"e":"Reproducing protected works creates **intellectual property risks** (copyright), a major legal concern with generative AI. They can be mitigated by choosing models with documented training data, filters, and human review; AWS also offers IP indemnification under certain conditions for some services. Underfitting, data drift, and system prompt leakage are different problems."}}]},{"id":2,"title":{"fr":"Mises en situation métier","en":"Business scenarios"},"questions":[{"n":1,"d":4,"a":["A"],"fr":{"q":"Une plateforme de soutien scolaire pour collégiens déploie un assistant conversationnel sur Amazon Bedrock. Elle doit empêcher toute réponse à caractère violent, sexuel ou haineux et refuser les discussions sur les jeux d\u0027argent, avec le MOINS de développement. Quelle solution utiliser ?","o":["Amazon Bedrock Guardrails avec des filtres de contenu et un sujet refusé (denied topic)","Un paramètre temperature fixé à 0 pour obtenir des réponses prévisibles","Amazon Rekognition pour modérer les messages texte envoyés par les élèves","Un fine-tuning du modèle sur des dialogues entre enseignants et élèves"],"e":"**Amazon Bedrock Guardrails** applique des **filtres de contenu** configurables (haine, insultes, sexuel, violence, inconduite) aux entrées et aux sorties, ainsi que des **sujets refusés** comme les jeux d\u0027argent, sans modifier le modèle. Le fine-tuning ne garantit aucun blocage, une temperature à 0 ne filtre rien, et Rekognition modère des images et des vidéos, pas des conversations textuelles."},"en":{"q":"A tutoring platform for middle school students is deploying a conversational assistant on Amazon Bedrock. It must prevent any violent, sexual, or hateful responses and refuse discussions about gambling, with the LEAST development effort. Which solution should it use?","o":["Amazon Bedrock Guardrails with content filters and a denied topic","A temperature parameter set to 0 to get predictable answers","Amazon Rekognition to moderate the text messages sent by students","Fine-tuning the model on dialogues between teachers and students"],"e":"**Amazon Bedrock Guardrails** applies configurable **content filters** (hate, insults, sexual, violence, misconduct) to inputs and outputs, plus **denied topics** such as gambling, without modifying the model. Fine-tuning does not guarantee any blocking, a temperature of 0 filters nothing, and Rekognition moderates images and videos, not text conversations."}},{"n":2,"d":1,"a":["B"],"fr":{"q":"La banque fictive Banque Horizon dispose de dix ans d\u0027historique de prêts, chaque dossier étant marqué « remboursé » ou « en défaut ». Elle veut prédire, pour chaque nouvelle demande, si l\u0027emprunteur risque de faire défaut. Quel type de problème de ML correspond à ce besoin ?","o":["Clustering non supervisé des emprunteurs","Classification supervisée binaire","Apprentissage par renforcement avec récompenses","Régression supervisée sur une valeur continue"],"e":"Les données sont étiquetées (remboursé / en défaut) et la sortie est une catégorie parmi deux : il s\u0027agit d\u0027une **classification supervisée binaire**. La régression prédit une valeur numérique continue (par exemple un montant), le clustering regroupe des données sans étiquettes, et l\u0027apprentissage par renforcement apprend une politique d\u0027actions par essais et récompenses."},"en":{"q":"The fictional Horizon Bank has ten years of loan history, with each record labeled \u0027repaid\u0027 or \u0027defaulted\u0027. It wants to predict, for each new application, whether the borrower is likely to default. Which type of ML problem matches this need?","o":["Unsupervised clustering of borrowers","Supervised binary classification","Reinforcement learning with rewards","Supervised regression on a continuous value"],"e":"The data is labeled (repaid / defaulted) and the output is one of two categories, so this is **supervised binary classification**. Regression predicts a continuous numeric value (such as an amount), clustering groups unlabeled data, and reinforcement learning learns an action policy through trial and reward."}},{"n":3,"d":1,"a":["D"],"fr":{"q":"Un centre d\u0027imagerie médicale analyse des examens de 600 Mo chacun avec un modèle hébergé sur SageMaker AI ; chaque inférence dure environ 15 minutes. Les radiologues veulent soumettre les examens au fil de l\u0027eau et être notifiés à la fin du traitement. Quelle option d\u0027inférence est la plus adaptée ?","o":["Inférence en temps réel SageMaker AI","Inférence par lots hebdomadaire avec Batch Transform","Inférence serverless SageMaker AI","Inférence asynchrone SageMaker AI"],"e":"L\u0027**inférence asynchrone** accepte des charges utiles volumineuses (jusqu\u0027à 1 Go) et des traitements longs (jusqu\u0027à environ une heure), met les requêtes en file d\u0027attente et peut notifier la fin du traitement via Amazon SNS. Les endpoints temps réel et serverless imposent des charges utiles bien plus petites et des délais beaucoup plus courts, et un traitement hebdomadaire par lots ne répond pas au besoin de traitement au fil de l\u0027eau."},"en":{"q":"A medical imaging center analyzes 600 MB scans with a model hosted on SageMaker AI, and each inference takes about 15 minutes. Radiologists want to submit scans as they arrive and be notified when processing completes. Which inference option is MOST suitable?","o":["SageMaker AI real-time inference","Weekly batch inference with Batch Transform","SageMaker AI serverless inference","SageMaker AI asynchronous inference"],"e":"**Asynchronous inference** accepts large payloads (up to 1 GB) and long processing times (up to about one hour), queues requests, and can send completion notifications through Amazon SNS. Real-time and serverless endpoints impose much smaller payloads and much shorter timeouts, and a weekly batch job does not meet the need to process scans as they arrive."}},{"n":4,"d":3,"a":["C"],"fr":{"q":"Un assureur utilise un LLM dans Amazon Bedrock pour répondre aux questions des courtiers sur les conditions générales. Les testeurs constatent que la même question reçoit des formulations, et parfois des contenus, différents à chaque appel. Quel réglage permet d\u0027obtenir des réponses plus constantes ?","o":["Supprimer les séquences d\u0027arrêt (stop sequences)","Augmenter le nombre maximal de tokens de la réponse","Abaisser la valeur du paramètre temperature, par exemple vers 0","Augmenter la valeur du paramètre top-p, par exemple vers 1"],"e":"La **temperature** contrôle l\u0027aléa de l\u0027échantillonnage : une valeur basse, proche de 0, favorise les tokens les plus probables et rend les réponses plus **déterministes**. Augmenter top-p élargit au contraire l\u0027ensemble des tokens candidats, max tokens ne limite que la longueur, et les séquences d\u0027arrêt indiquent seulement où interrompre la génération."},"en":{"q":"An insurer uses an LLM in Amazon Bedrock to answer brokers\u0027 questions about policy terms. Testers notice that the same question receives different wording, and sometimes different content, on each call. Which setting produces more consistent answers?","o":["Remove the stop sequences","Increase the maximum number of response tokens","Lower the temperature parameter, for example toward 0","Increase the top-p parameter, for example toward 1"],"e":"**Temperature** controls sampling randomness: a low value close to 0 favors the most probable tokens and makes responses more **deterministic**. Increasing top-p instead widens the set of candidate tokens, max tokens only limits length, and stop sequences only indicate where to end generation."}},{"n":5,"d":1,"a":["A"],"fr":{"q":"Dans une banque en ligne, les data scientists calculent les variables d\u0027un modèle anti-blanchiment dans des notebooks, tandis que l\u0027équipe applicative les recalcule différemment pour l\u0027inférence en temps réel. Les performances en production s\u0027en ressentent. Quel service AWS résout ce problème ?","o":["Amazon SageMaker Feature Store","Amazon SageMaker Experiments","Amazon SageMaker Model Registry","Amazon SageMaker JumpStart"],"e":"**SageMaker Feature Store** centralise les variables (features) dans un magasin **offline** pour l\u0027entraînement et **online** à faible latence pour l\u0027inférence, ce qui garantit des définitions identiques et évite l\u0027écart entraînement/production (training-serving skew). Model Registry gère les versions de modèles, Experiments suit les essais d\u0027entraînement et JumpStart fournit des modèles pré-entraînés."},"en":{"q":"At an online bank, data scientists compute the features of an anti-money-laundering model in notebooks, while the application team recomputes them differently for real-time inference. Production performance suffers as a result. Which AWS service solves this problem?","o":["Amazon SageMaker Feature Store","Amazon SageMaker Experiments","Amazon SageMaker Model Registry","Amazon SageMaker JumpStart"],"e":"**SageMaker Feature Store** centralizes features in an **offline** store for training and a low-latency **online** store for inference, which guarantees identical definitions and prevents training-serving skew. Model Registry manages model versions, Experiments tracks training runs, and JumpStart provides pre-trained models."}},{"n":6,"d":5,"a":["A"],"fr":{"q":"Le comité des risques d\u0027une banque exige, pour chaque modèle de scoring en production, un document standardisé décrivant l\u0027usage prévu, le niveau de risque, les détails d\u0027entraînement et les résultats d\u0027évaluation, afin de faciliter les audits. Quelle fonctionnalité AWS utiliser ?","o":["Amazon SageMaker Model Cards","Amazon SageMaker Experiments","Amazon SageMaker Data Wrangler","Amazon SageMaker Feature Store"],"e":"**SageMaker Model Cards** documente de façon standardisée l\u0027**usage prévu**, le **niveau de risque**, les détails d\u0027entraînement et les **résultats d\u0027évaluation** d\u0027un modèle, au service de la **gouvernance** et des audits. Feature Store gère les variables, Experiments suit les essais d\u0027entraînement et Data Wrangler prépare les données."},"en":{"q":"A bank\u0027s risk committee requires, for each scoring model in production, a standardized document describing the intended use, risk rating, training details, and evaluation results to facilitate audits. Which AWS feature should be used?","o":["Amazon SageMaker Model Cards","Amazon SageMaker Experiments","Amazon SageMaker Data Wrangler","Amazon SageMaker Feature Store"],"e":"**SageMaker Model Cards** provide standardized documentation of a model\u0027s **intended use**, **risk rating**, training details, and **evaluation results**, supporting **governance** and audits. Feature Store manages features, Experiments tracks training runs, and Data Wrangler prepares data."}},{"n":7,"d":3,"a":["B"],"fr":{"q":"Un groupe de logistique veut qu\u0027un agent d\u0027IA puisse suivre des colis et planifier des enlèvements. Ces fonctions existent déjà sous forme d\u0027API REST internes et de fonctions AWS Lambda. Quel composant permet de les exposer comme outils MCP utilisables par l\u0027agent, avec le MOINS de développement ?","o":["Amazon Bedrock AgentCore Memory","Amazon Bedrock AgentCore Gateway","Amazon Bedrock Knowledge Bases","Amazon API Gateway avec une clé d\u0027API"],"e":"**AgentCore Gateway** transforme des API existantes et des fonctions **Lambda** en **outils compatibles MCP** que les agents peuvent découvrir et appeler, sans réécrire ces services. AgentCore Memory conserve le contexte des conversations, Knowledge Bases fournit du RAG sur des documents, et Amazon API Gateway publie des API sans les convertir en outils MCP."},"en":{"q":"A logistics group wants an AI agent to track parcels and schedule pickups. These functions already exist as internal REST APIs and AWS Lambda functions. Which component exposes them as MCP tools the agent can use, with the LEAST development effort?","o":["Amazon Bedrock AgentCore Memory","Amazon Bedrock AgentCore Gateway","Amazon Bedrock Knowledge Bases","Amazon API Gateway with an API key"],"e":"**AgentCore Gateway** turns existing APIs and **Lambda** functions into **MCP-compatible tools** that agents can discover and call, without rewriting those services. AgentCore Memory keeps conversation context, Knowledge Bases provides RAG over documents, and Amazon API Gateway publishes APIs without converting them into MCP tools."}},{"n":8,"d":1,"a":["D"],"fr":{"q":"Un assureur entraîne un modèle qui signale les déclarations de sinistre potentiellement frauduleuses pour examen par des enquêteurs. Laisser passer une fraude coûte très cher, alors qu\u0027un faux signalement n\u0027entraîne qu\u0027une vérification supplémentaire. Quelle métrique l\u0027assureur doit-il privilégier ?","o":["La précision (precision)","L\u0027erreur quadratique moyenne (RMSE)","L\u0027exactitude globale (accuracy)","Le rappel (recall)"],"e":"Les faux négatifs (fraudes non détectées) sont ici les erreurs les plus coûteuses : le **rappel** mesure la part des fraudes réelles effectivement détectées. La précision serait prioritaire si les faux positifs étaient coûteux, l\u0027accuracy est trompeuse avec des classes très déséquilibrées, et la RMSE est une métrique de régression."},"en":{"q":"An insurer trains a model that flags potentially fraudulent claims for review by investigators. Missing a fraud is very expensive, whereas a false alert only triggers an extra check. Which metric should the insurer prioritize?","o":["Precision","Root mean squared error (RMSE)","Overall accuracy","Recall"],"e":"False negatives (undetected fraud) are the costliest errors here, and **recall** measures the share of actual fraud cases that are detected. Precision would be the priority if false positives were costly, accuracy is misleading with highly imbalanced classes, and RMSE is a regression metric."}},{"n":9,"d":2,"a":["D","E"],"fr":{"q":"Une compagnie d\u0027assurance dresse la liste des cas d\u0027usage candidats à l\u0027IA générative. Quels DEUX cas d\u0027usage sont les MOINS adaptés à un LLM utilisé seul ? (Sélectionnez DEUX réponses.)","o":["Proposer des réponses aux questions fréquentes sur les garanties des contrats","Résumer de longs rapports d\u0027expertise pour les gestionnaires de sinistres","Rédiger des brouillons de courriers aux assurés à partir des notes des gestionnaires","Calculer au centime près les provisions réglementaires, avec un résultat reproductible et auditable","Prendre automatiquement la décision finale de refus d\u0027un sinistre, qui doit être justifiée à l\u0027assuré"],"e":"Les LLM sont **non déterministes**, peuvent **halluciner** et sont peu **interprétables** : ils conviennent mal aux **calculs exacts et reproductibles** comme le provisionnement réglementaire, et aux **décisions à fort impact qui doivent être expliquées** sans supervision humaine. La rédaction de brouillons, le résumé et les réponses aux questions fréquentes sont en revanche des cas d\u0027usage typiques de l\u0027IA générative, idéalement avec une relecture humaine."},"en":{"q":"An insurance company is listing candidate use cases for generative AI. Which TWO use cases are the LEAST suitable for an LLM used on its own? (Select TWO.)","o":["Suggesting answers to frequently asked questions about policy coverage","Summarizing long assessment reports for claims handlers","Drafting letters to policyholders from claims handlers\u0027 notes","Calculating regulatory reserves to the cent, with a reproducible and auditable result","Automatically making the final decision to deny a claim, which must be justified to the policyholder"],"e":"LLMs are **non-deterministic**, can **hallucinate**, and have limited **interpretability**, so they are poorly suited to **exact, reproducible calculations** such as regulatory reserving and to **high-impact decisions that must be explained** without human oversight. Drafting, summarization, and FAQ answers, on the other hand, are typical generative AI use cases, ideally with human review."}},{"n":10,"d":2,"a":["A","D"],"fr":{"q":"Une chaîne d\u0027information prévoit de résumer 50 000 dépêches par mois avec un modèle de fondation utilisé à la demande (on-demand) dans Amazon Bedrock. Quels DEUX facteurs déterminent directement le coût de l\u0027inférence ? (Sélectionnez DEUX réponses.)","o":["Le nombre de tokens envoyés en entrée (instructions et dépêche)","Le nombre de vCPU alloués au modèle par l\u0027entreprise","Le nombre d\u0027utilisateurs IAM du compte AWS","Le nombre de tokens générés en sortie (résumés)","Le nombre de journalistes qui consultent les résumés"],"e":"En mode **à la demande**, Bedrock facture l\u0027inférence des modèles de texte au **nombre de tokens d\u0027entrée** et au **nombre de tokens de sortie**, avec des tarifs propres à chaque modèle. Le client ne choisit pas de vCPU dans ce mode serverless, et ni le nombre d\u0027utilisateurs IAM ni le nombre de lecteurs n\u0027entrent dans le calcul. Raccourcir les prompts et limiter la longueur des résumés réduit donc la facture."},"en":{"q":"A news channel plans to summarize 50,000 news wires per month with a foundation model used on demand in Amazon Bedrock. Which TWO factors directly determine the inference cost? (Select TWO.)","o":["The number of input tokens sent (instructions and news wire)","The number of vCPUs the company allocates to the model","The number of IAM users in the AWS account","The number of output tokens generated (summaries)","The number of journalists who read the summaries"],"e":"In **on-demand** mode, Bedrock bills text model inference by the **number of input tokens** and the **number of output tokens**, at model-specific rates. Customers do not choose vCPUs in this serverless mode, and neither the number of IAM users nor the number of readers is part of the calculation. Shortening prompts and limiting summary length therefore reduces the bill."}},{"n":11,"d":3,"a":["D"],"fr":{"q":"Une agence de presse dispose de 2 000 dépêches accompagnées de résumés rédigés par ses journalistes. Elle veut comparer automatiquement plusieurs modèles sur la qualité de leurs résumés par rapport à ces références. Quelle métrique est la plus couramment utilisée pour cette tâche ?","o":["RMSE","BLEU","AUC-ROC","ROUGE"],"e":"**ROUGE** mesure le recouvrement de n-grammes, orienté rappel, entre un **résumé** généré et des résumés de référence : c\u0027est la métrique classique de la synthèse de texte. BLEU est surtout utilisé pour la **traduction** automatique (orienté précision), RMSE pour la régression et l\u0027AUC-ROC pour la classification."},"en":{"q":"A news agency has 2,000 news wires with summaries written by its journalists. It wants to automatically compare several models on the quality of their summaries against these references. Which metric is MOST commonly used for this task?","o":["RMSE","BLEU","AUC-ROC","ROUGE"],"e":"**ROUGE** measures recall-oriented n-gram overlap between a generated **summary** and reference summaries, and it is the standard metric for text summarization. BLEU is mainly used for machine **translation** (precision-oriented), RMSE for regression, and AUC-ROC for classification."}},{"n":12,"d":1,"a":["A"],"fr":{"q":"Les analystes d\u0027une mutuelle santé veulent prédire eux-mêmes quels adhérents risquent de résilier leur contrat, à partir d\u0027un fichier CSV d\u0027historique. Ils n\u0027ont aucune compétence en programmation ni en ML. Quel service AWS répond à ce besoin avec le MOINS d\u0027effort ?","o":["Amazon SageMaker Canvas","Amazon EC2 avec une AMI Deep Learning","Amazon SageMaker Pipelines","Amazon SageMaker Studio avec des notebooks Jupyter"],"e":"**SageMaker Canvas** offre une interface visuelle **no-code** qui permet à des analystes d\u0027importer des données, d\u0027entraîner et d\u0027utiliser des modèles de prédiction sans écrire de code. Les notebooks de Studio et les instances EC2 exigent des compétences en programmation, et Pipelines sert à automatiser des workflows MLOps."},"en":{"q":"Analysts at a health mutual insurer want to predict on their own which members are likely to cancel their policy, starting from a historical CSV file. They have no programming or ML skills. Which AWS service meets this need with the LEAST effort?","o":["Amazon SageMaker Canvas","Amazon EC2 with a Deep Learning AMI","Amazon SageMaker Pipelines","Amazon SageMaker Studio with Jupyter notebooks"],"e":"**SageMaker Canvas** provides a visual **no-code** interface that lets analysts import data, train, and use prediction models without writing code. Studio notebooks and EC2 instances require programming skills, and Pipelines is used to automate MLOps workflows."}},{"n":13,"d":2,"a":["A"],"fr":{"q":"Lors d\u0027un comité d\u0027innovation, le responsable data d\u0027une banque explique pourquoi un LLM comprend qu\u0027un pronom en fin de paragraphe renvoie à un client cité trois phrases plus tôt. Quel mécanisme de l\u0027architecture Transformer le permet ?","o":["L\u0027auto-attention (self-attention), qui pondère les relations entre tous les tokens","La récurrence, qui traite les mots strictement un par un dans l\u0027ordre","La convolution, qui applique des filtres locaux à des pixels voisins","Le clustering, qui regroupe les mots selon leur fréquence d\u0027apparition"],"e":"L\u0027**auto-attention** permet à chaque token de prendre en compte tous les autres tokens de la séquence et de pondérer leur importance, ce qui capture les dépendances à longue distance. La convolution est typique des CNN pour l\u0027image, la récurrence des RNN/LSTM peine sur les longues séquences et n\u0027est pas au cœur du **Transformer**, et le clustering n\u0027intervient pas dans ce mécanisme."},"en":{"q":"During an innovation committee meeting, a bank\u0027s head of data explains why an LLM understands that a pronoun at the end of a paragraph refers to a customer mentioned three sentences earlier. Which mechanism of the Transformer architecture makes this possible?","o":["Self-attention, which weighs the relationships between all tokens","Recurrence, which processes words strictly one at a time in order","Convolution, which applies local filters to neighboring pixels","Clustering, which groups words by how often they appear"],"e":"**Self-attention** lets each token take every other token in the sequence into account and weigh its importance, which captures long-range dependencies. Convolution is typical of CNNs for images, recurrence in RNNs/LSTMs struggles with long sequences and is not at the core of the **Transformer**, and clustering plays no role in this mechanism."}},{"n":14,"d":3,"a":["C"],"fr":{"q":"Le service RH d\u0027une entreprise de logistique de 8 000 salariés veut un assistant qui répond aux questions sur les accords internes, la mutuelle et les congés. Les documents, stockés dans Amazon S3, sont mis à jour chaque mois. Quelle solution répond au besoin avec le MOINS d\u0027effort opérationnel ?","o":["Un modèle entraîné de zéro sur SageMaker AI avec les documents RH","Un fine-tuning mensuel d\u0027un modèle Bedrock sur les documents RH","Amazon Bedrock Knowledge Bases connecté au bucket S3 (RAG managé)","Un continued pre-training du modèle à chaque mise à jour des documents"],"e":"**Bedrock Knowledge Bases** implémente un **RAG** entièrement géré : ingestion depuis S3, découpage, embeddings, base vectorielle et récupération des passages pertinents au moment de la question. Une simple synchronisation suffit pour prendre en compte les nouvelles versions. Le fine-tuning, le continued pre-training ou un entraînement de zéro seraient coûteux, lents et à refaire à chaque mise à jour."},"en":{"q":"The HR department of a logistics company with 8,000 employees wants an assistant that answers questions about internal agreements, health insurance, and leave. The documents, stored in Amazon S3, are updated every month. Which solution meets the need with the LEAST operational effort?","o":["A model trained from scratch on SageMaker AI with the HR documents","Monthly fine-tuning of a Bedrock model on the HR documents","Amazon Bedrock Knowledge Bases connected to the S3 bucket (managed RAG)","Continued pre-training of the model at every document update"],"e":"**Bedrock Knowledge Bases** implements fully managed **RAG**: ingestion from S3, chunking, embeddings, vector store, and retrieval of relevant passages at question time. A simple sync is enough to pick up new versions. Fine-tuning, continued pre-training, or training from scratch would be expensive, slow, and need to be repeated at every update."}},{"n":15,"d":2,"a":["B"],"fr":{"q":"L\u0027agence de communication d\u0027une chaîne de supermarchés veut générer des visuels publicitaires originaux à partir de descriptions textuelles. Sur quel type d\u0027architecture reposent la plupart des modèles modernes de génération d\u0027images ?","o":["Le clustering K-means","Les modèles de diffusion","La régression logistique","Les réseaux de neurones récurrents (RNN)"],"e":"Les **modèles de diffusion** apprennent à retirer progressivement du bruit pour construire une image cohérente guidée par un texte ; c\u0027est le principe de modèles comme Stable Diffusion de Stability AI, disponible dans Amazon Bedrock. Les RNN traitent des séquences, K-means regroupe des données et la régression logistique est un classificateur."},"en":{"q":"A supermarket chain\u0027s advertising agency wants to generate original ad visuals from text descriptions. Which type of architecture do most modern image generation models rely on?","o":["K-means clustering","Diffusion models","Logistic regression","Recurrent neural networks (RNNs)"],"e":"**Diffusion models** learn to progressively remove noise to build a coherent image guided by text, which is how models such as Stability AI\u0027s Stable Diffusion, available in Amazon Bedrock, work. RNNs process sequences, K-means groups data, and logistic regression is a classifier."}},{"n":16,"d":2,"a":["A"],"fr":{"q":"Le support informatique d\u0027une université veut classer automatiquement de courts tickets texte dans dix catégories. La priorité est la latence la plus faible et le coût le plus bas ; aucune image n\u0027est traitée. Quel modèle Amazon Nova est le plus adapté ?","o":["Amazon Nova Micro","Amazon Nova Premier","Amazon Nova Reel","Amazon Nova Canvas"],"e":"**Amazon Nova Micro** est un modèle **texte uniquement**, le plus rapide et le moins coûteux de la famille Nova, idéal pour des tâches simples comme la classification de textes courts. Nova Premier est le modèle le plus performant, mais aussi plus coûteux, pour les tâches complexes ; Nova Canvas génère des images et Nova Reel génère des vidéos."},"en":{"q":"A university\u0027s IT help desk wants to automatically classify short text tickets into ten categories. The priority is the lowest latency and the lowest cost, and no images are processed. Which Amazon Nova model is MOST suitable?","o":["Amazon Nova Micro","Amazon Nova Premier","Amazon Nova Reel","Amazon Nova Canvas"],"e":"**Amazon Nova Micro** is a **text-only** model and the fastest, lowest-cost model in the Nova family, ideal for simple tasks such as classifying short texts. Nova Premier is the most capable but more expensive model for complex tasks, Nova Canvas generates images, and Nova Reel generates videos."}},{"n":17,"d":3,"a":["A","C"],"fr":{"q":"Un ministère veut choisir un modèle de fondation dans Amazon Bedrock pour analyser des textes législatifs français pouvant atteindre 300 pages. Quels DEUX critères de sélection sont les plus pertinents pour ce besoin ? (Sélectionnez DEUX réponses.)","o":["La prise en charge de la langue française par le modèle","La capacité du modèle à générer des vidéos","La taille de la fenêtre de contexte du modèle","Le plus grand nombre de paramètres, quel que soit le coût","La date de mise sur le marché la plus récente possible"],"e":"Pour analyser de longs textes en français, il faut un modèle qui **maîtrise le français** et dont la **fenêtre de contexte** est suffisante pour traiter de longs documents, ou bien les découper. La génération vidéo est hors sujet, la date de sortie ne garantit pas l\u0027adéquation au besoin, et le plus gros modèle n\u0027est pas forcément nécessaire : il faut équilibrer qualité, latence et coût."},"en":{"q":"A government ministry wants to choose a foundation model in Amazon Bedrock to analyze French legislative texts of up to 300 pages. Which TWO selection criteria are MOST relevant for this need? (Select TWO.)","o":["The model\u0027s support for the French language","The model\u0027s ability to generate videos","The size of the model\u0027s context window","The largest number of parameters, regardless of cost","The most recent possible release date"],"e":"To analyze long texts in French, the model must **handle French well** and have a **context window** large enough to process long documents, or the documents must be split. Video generation is irrelevant, release date does not guarantee fitness for the need, and the largest model is not necessarily required: quality, latency, and cost must be balanced."}},{"n":18,"d":5,"a":["B"],"fr":{"q":"Avant de valider un projet d\u0027IA générative, le délégué à la protection des données d\u0027un conseil régional demande les rapports de conformité d\u0027AWS (ISO 27001, SOC 2) et souhaite examiner les accords disponibles. Où les obtenir en libre-service ?","o":["AWS Security Hub","AWS Artifact","AWS Well-Architected Tool","AWS Audit Manager"],"e":"**AWS Artifact** est le portail en libre-service qui donne accès aux **rapports de conformité** d\u0027AWS (SOC, ISO, PCI…) et permet d\u0027examiner et d\u0027accepter certains **accords**. Audit Manager collecte des preuves sur l\u0027utilisation que le client fait d\u0027AWS, Security Hub agrège des constats de sécurité, et le Well-Architected Tool évalue une architecture selon les bonnes pratiques."},"en":{"q":"Before approving a generative AI project, a regional council\u0027s data protection officer requests AWS compliance reports (ISO 27001, SOC 2) and wants to review the available agreements. Where can these be obtained on a self-service basis?","o":["AWS Security Hub","AWS Artifact","AWS Well-Architected Tool","AWS Audit Manager"],"e":"**AWS Artifact** is the self-service portal that provides access to AWS **compliance reports** (SOC, ISO, PCI, and more) and lets customers review and accept certain **agreements**. Audit Manager collects evidence about the customer\u0027s own use of AWS, Security Hub aggregates security findings, and the Well-Architected Tool reviews an architecture against best practices."}},{"n":19,"d":2,"a":["D"],"fr":{"q":"L\u0027équipe de développement d\u0027une mutuelle veut un environnement agentique qui transforme une demande en langage naturel en spécifications structurées (exigences, design, liste de tâches), puis génère le code et les tests correspondants. Quel outil AWS répond à ce besoin ?","o":["AWS Transform","Amazon SageMaker Canvas","Amazon Quick","Kiro"],"e":"**Kiro** est l\u0027IDE (et la CLI) agentique d\u0027AWS qui suit un développement piloté par les **spécifications** : prompt, puis exigences, design et tâches, puis code et tests. AWS Transform cible la migration et la modernisation d\u0027applications existantes, SageMaker Canvas sert au ML no-code et Amazon Quick est un espace de travail agentique pour exploiter les données de l\u0027entreprise."},"en":{"q":"A mutual insurer\u0027s development team wants an agentic environment that turns a natural language request into structured specifications (requirements, design, task list) and then generates the corresponding code and tests. Which AWS tool meets this need?","o":["AWS Transform","Amazon SageMaker Canvas","Amazon Quick","Kiro"],"e":"**Kiro** is AWS\u0027s agentic IDE (and CLI) that follows **spec-driven** development: prompt, then requirements, design, and tasks, then code and tests. AWS Transform targets the migration and modernization of existing applications, SageMaker Canvas is for no-code ML, and Amazon Quick is an agentic workspace for working with company data."}},{"n":20,"d":2,"a":["A"],"fr":{"q":"La DRH d\u0027un groupe de distribution veut que les managers posent en langage naturel des questions sur les politiques RH, les documents internes et les tableaux de bord d\u0027effectifs, dans un espace de travail agentique prêt à l\u0027emploi. Quel service AWS recommander à ce nouveau client ?","o":["Amazon Quick","Amazon Kendra","Amazon Q Business","Amazon Lex"],"e":"**Amazon Quick** est l\u0027espace de travail agentique d\u0027AWS qui se connecte aux données de l\u0027entreprise et inclut **Quick Sight** pour la BI en langage naturel ; il succède à Amazon Q Business. Q Business et Amazon Kendra ne sont plus proposés aux nouveaux clients, et Amazon Lex sert à construire des chatbots à base d\u0027intents, sans espace de travail ni tableaux de bord."},"en":{"q":"The HR department of a retail group wants managers to ask natural language questions about HR policies, internal documents, and headcount dashboards in a ready-to-use agentic workspace. Which AWS service should be recommended to this new customer?","o":["Amazon Quick","Amazon Kendra","Amazon Q Business","Amazon Lex"],"e":"**Amazon Quick** is AWS\u0027s agentic workspace that connects to company data and includes **Quick Sight** for natural language BI; it succeeds Amazon Q Business. Q Business and Amazon Kendra are no longer offered to new customers, and Amazon Lex is used to build intent-based chatbots, with no workspace or dashboards."}},{"n":21,"d":4,"a":["C"],"fr":{"q":"Un éditeur de magazines veut utiliser des images générées par IA pour ses couvertures. Le service juridique craint des litiges de propriété intellectuelle. Quelle démarche est la plus appropriée ?","o":["Considérer que toute image générée par IA est libre de droits et publiable sans contrôle","Réduire la résolution des images générées pour limiter le risque de contrefaçon","Vérifier la licence et l\u0027indemnisation IP du modèle, et faire relire chaque visuel avant publication","Ajouter un filtre de mots pour bloquer le mot « copyright » dans tous les prompts"],"e":"Les risques de **propriété intellectuelle** se gèrent en examinant les **conditions de licence** du modèle et les engagements du fournisseur (AWS propose par exemple, sous conditions, une **indemnisation IP** pour les sorties de certains de ses modèles comme Amazon Nova), complétés par une **revue humaine** des contenus publiés. Une image générée n\u0027est pas automatiquement libre de droits, et bloquer un mot ou réduire la résolution ne supprime pas le risque."},"en":{"q":"A magazine publisher wants to use AI-generated images for its covers. The legal department is worried about intellectual property disputes. Which approach is MOST appropriate?","o":["Assume that any AI-generated image is royalty-free and can be published without checks","Reduce the resolution of generated images to limit infringement risk","Check the model\u0027s license and IP indemnity, and have every visual reviewed before publication","Add a word filter to block the word \u0027copyright\u0027 in all prompts"],"e":"**Intellectual property** risks are managed by reviewing the model\u0027s **license terms** and the provider\u0027s commitments (for example, AWS offers, under conditions, **IP indemnity** for outputs of some of its models such as Amazon Nova), complemented by **human review** of published content. A generated image is not automatically royalty-free, and blocking a word or lowering resolution does not remove the risk."}},{"n":22,"d":3,"a":["B"],"fr":{"q":"Un planificateur logistique soumet à un LLM des problèmes de répartition de palettes entre entrepôts qui demandent plusieurs étapes de calcul. Les réponses finales sont souvent fausses. Quelle technique de prompt engineering améliore le plus la fiabilité de ce raisonnement ?","o":["Le persona : demander au modèle d\u0027adopter le ton d\u0027un directeur logistique","Le chain-of-thought : demander au modèle de détailler son raisonnement étape par étape","Le zero-shot : poser la question sans exemple ni instruction supplémentaire","Le prompt négatif : lister ce que le modèle ne doit surtout pas répondre"],"e":"Le **chain-of-thought** incite le modèle à décomposer le problème en étapes intermédiaires explicites, ce qui améliore nettement les tâches de raisonnement et de calcul en plusieurs étapes. Le zero-shot n\u0027apporte aucune aide, le prompt négatif sert à exclure des contenus, et le persona change le ton sans améliorer le raisonnement."},"en":{"q":"A logistics planner gives an LLM pallet allocation problems across warehouses that require several calculation steps. The final answers are often wrong. Which prompt engineering technique MOST improves the reliability of this reasoning?","o":["Persona: ask the model to adopt the tone of a logistics director","Chain-of-thought: ask the model to lay out its reasoning step by step","Zero-shot: ask the question with no examples or additional instructions","Negative prompting: list what the model must not answer"],"e":"**Chain-of-thought** prompts the model to break the problem into explicit intermediate steps, which significantly improves multi-step reasoning and calculation tasks. Zero-shot provides no help, negative prompting is used to exclude content, and a persona changes the tone without improving reasoning."}},{"n":23,"d":3,"a":["C"],"fr":{"q":"Un cabinet juridique veut qu\u0027un modèle rédige des clauses contractuelles en respectant précisément sa structure, son ton et ses formulations maison. Il dispose de 6 000 paires « demande → clause validée » rédigées par ses associés, et les connaissances juridiques générales du modèle sont suffisantes. Quelle approche est la plus adaptée ?","o":["Un RAG sur une base vectorielle contenant les codes juridiques","Une augmentation du paramètre temperature pour varier le style","Un fine-tuning du modèle sur les paires étiquetées au format JSONL","Un continued pre-training sur l\u0027ensemble des codes juridiques publics"],"e":"Pour apprendre un **style, un format ou une tâche spécifique** à partir d\u0027exemples **étiquetés** (prompt → réponse attendue), le **fine-tuning** est l\u0027approche adaptée. Le continued pre-training sur des données non étiquetées apporte des connaissances de domaine, déjà suffisantes ici ; le RAG apporte des faits mais n\u0027enseigne pas un style maison ; la temperature ne fait qu\u0027ajuster l\u0027aléa."},"en":{"q":"A law firm wants a model to draft contract clauses that precisely follow its in-house structure, tone, and wording. It has 6,000 \u0027request → approved clause\u0027 pairs written by its partners, and the model\u0027s general legal knowledge is sufficient. Which approach is MOST suitable?","o":["RAG over a vector store containing the legal codes","Increasing the temperature parameter to vary the style","Fine-tuning the model on the labeled pairs in JSONL format","Continued pre-training on all public legal codes"],"e":"To teach a **specific style, format, or task** from **labeled** examples (prompt → expected response), **fine-tuning** is the right approach. Continued pre-training on unlabeled data adds domain knowledge, which is already sufficient here; RAG supplies facts but does not teach an in-house style; temperature only adjusts randomness."}},{"n":24,"d":5,"a":["D"],"fr":{"q":"Avant d\u0027utiliser 40 To de dossiers de sinistres stockés dans Amazon S3 pour personnaliser un modèle, un assureur veut identifier automatiquement les fichiers qui contiennent des données personnelles (numéros de sécurité sociale, IBAN, adresses). Quel service AWS utiliser ?","o":["Amazon GuardDuty","AWS Config","Amazon Inspector","Amazon Macie"],"e":"**Amazon Macie** utilise le ML et la correspondance de motifs pour **découvrir les données sensibles (PII)** dans les buckets **Amazon S3** et produire des résultats exploitables. Inspector analyse les vulnérabilités des charges de travail, AWS Config évalue la conformité des configurations de ressources, et GuardDuty détecte les menaces à partir des journaux d\u0027activité."},"en":{"q":"Before using 40 TB of claim files stored in Amazon S3 to customize a model, an insurer wants to automatically identify files that contain personal data (social security numbers, IBANs, addresses). Which AWS service should it use?","o":["Amazon GuardDuty","AWS Config","Amazon Inspector","Amazon Macie"],"e":"**Amazon Macie** uses ML and pattern matching to **discover sensitive data (PII)** in **Amazon S3** buckets and produce actionable findings. Inspector scans workloads for vulnerabilities, AWS Config evaluates the compliance of resource configurations, and GuardDuty detects threats from activity logs."}},{"n":25,"d":3,"a":["A"],"fr":{"q":"Un assureur a mis en place un RAG sur ses conditions générales avec Amazon Bedrock Knowledge Bases. Les réponses omettent souvent des exclusions de garantie, car les passages récupérés coupent les clauses en plein milieu. Quel réglage revoir en priorité ?","o":["La stratégie de découpage (chunking), par exemple sémantique ou hiérarchique","Le type de clé KMS utilisée pour chiffrer le bucket S3 source","La temperature du modèle de génération, en la fixant à 1","Le nombre maximal de tokens de sortie, en le réduisant fortement"],"e":"Si les segments récupérés coupent les clauses, c\u0027est la **stratégie de découpage (chunking)** qui est en cause : des segments plus grands avec chevauchement, ou un découpage **sémantique** ou **hiérarchique**, préservent le contexte des clauses. La temperature agit sur l\u0027aléa de la génération, réduire max tokens tronquerait encore plus les réponses, et le chiffrement n\u0027a aucun effet sur la pertinence de la récupération."},"en":{"q":"An insurer has implemented RAG over its policy terms with Amazon Bedrock Knowledge Bases. Answers often omit coverage exclusions because the retrieved passages cut clauses in the middle. Which setting should be reviewed FIRST?","o":["The chunking strategy, for example semantic or hierarchical chunking","The type of KMS key used to encrypt the source S3 bucket","The generation model\u0027s temperature, by setting it to 1","The maximum number of output tokens, by sharply reducing it"],"e":"If retrieved segments cut clauses apart, the **chunking strategy** is the cause: larger chunks with overlap, or **semantic** or **hierarchical** chunking, preserve the context of clauses. Temperature affects generation randomness, reducing max tokens would truncate answers even more, and encryption has no effect on retrieval relevance."}},{"n":26,"d":5,"a":["A"],"fr":{"q":"Un centre hospitalier universitaire appelle Amazon Bedrock depuis des applications hébergées dans les sous-réseaux privés de son VPC. Sa politique de sécurité interdit que ce trafic transite par Internet. Quelle solution adopter ?","o":["Un point de terminaison VPC d\u0027interface pour Amazon Bedrock (AWS PrivateLink)","Une passerelle Internet associée aux sous-réseaux privés","Une passerelle NAT dotée d\u0027une adresse IP publique fixe","Une distribution Amazon CloudFront placée devant l\u0027API Bedrock"],"e":"Un **point de terminaison VPC d\u0027interface** (**AWS PrivateLink**) permet d\u0027appeler l\u0027API Bedrock via des adresses IP privées du VPC, sans passer par Internet. Une passerelle NAT ou une passerelle Internet font sortir le trafic vers les points de terminaison publics, et CloudFront est un réseau de diffusion de contenu, pas une connexion privée aux services AWS."},"en":{"q":"A university hospital calls Amazon Bedrock from applications hosted in the private subnets of its VPC. Its security policy forbids this traffic from traversing the internet. Which solution should it adopt?","o":["An interface VPC endpoint for Amazon Bedrock (AWS PrivateLink)","An internet gateway attached to the private subnets","A NAT gateway with a fixed public IP address","An Amazon CloudFront distribution in front of the Bedrock API"],"e":"An **interface VPC endpoint** (**AWS PrivateLink**) lets applications call the Bedrock API through private IP addresses in the VPC without going over the internet. A NAT gateway or internet gateway sends traffic out to public endpoints, and CloudFront is a content delivery network, not a private connection to AWS services."}},{"n":27,"d":3,"a":["B","C"],"fr":{"q":"Un éditeur de logiciels médicaux construit avec Amazon Bedrock un assistant qui répond aux questions des pharmaciens à partir des notices officielles des médicaments. Il veut réduire au maximum les réponses inventées. Quelles DEUX mesures sont les plus efficaces ? (Sélectionnez DEUX réponses.)","o":["Supprimer le prompt système afin de laisser le modèle plus libre","Fonder les réponses sur les notices via un RAG avec Amazon Bedrock Knowledge Bases","Activer les contrôles d\u0027ancrage contextuel (contextual grounding) d\u0027Amazon Bedrock Guardrails","Porter la valeur du paramètre top-p à son maximum","Augmenter la temperature afin de diversifier les réponses du modèle"],"e":"Le **RAG** fournit au modèle les passages pertinents des notices au moment de la question, et les **contrôles d\u0027ancrage contextuel** de Guardrails bloquent les réponses insuffisamment fondées sur ces sources ou non pertinentes. Augmenter la temperature ou top-p accroît l\u0027aléa et donc le risque d\u0027invention, et supprimer le prompt système retire des consignes utiles."},"en":{"q":"A medical software vendor is building an assistant with Amazon Bedrock that answers pharmacists\u0027 questions from official drug leaflets. It wants to minimize fabricated answers. Which TWO measures are MOST effective? (Select TWO.)","o":["Remove the system prompt to give the model more freedom","Ground answers in the leaflets through RAG with Amazon Bedrock Knowledge Bases","Enable the contextual grounding checks of Amazon Bedrock Guardrails","Set the top-p parameter to its maximum value","Increase the temperature to diversify the model\u0027s answers"],"e":"**RAG** supplies the model with the relevant leaflet passages at question time, and Guardrails **contextual grounding checks** block responses that are insufficiently grounded in those sources or irrelevant. Increasing temperature or top-p adds randomness and therefore the risk of fabrication, and removing the system prompt takes away useful instructions."}},{"n":28,"d":5,"a":["C","D"],"fr":{"q":"Les auditeurs internes d\u0027une banque exigent deux éléments pour l\u0027assistant basé sur Amazon Bedrock : l\u0027historique indiquant quelle identité IAM a appelé quelle API et quand, ainsi que le texte complet des prompts et des réponses du modèle. Quelles DEUX fonctionnalités activer ? (Sélectionnez DEUX réponses.)","o":["AWS Trusted Advisor","Amazon Inspector","AWS CloudTrail","La journalisation des invocations de modèles d\u0027Amazon Bedrock","AWS Artifact"],"e":"**AWS CloudTrail** enregistre les appels d\u0027API (identité, action, horodatage, adresse source) pour l\u0027audit. La **journalisation des invocations de modèles** (model invocation logging) de Bedrock capture les **prompts et les réponses** complets et les envoie vers CloudWatch Logs ou Amazon S3. Trusted Advisor émet des recommandations, Inspector recherche des vulnérabilités logicielles, et Artifact fournit les rapports de conformité d\u0027AWS."},"en":{"q":"A bank\u0027s internal auditors require two things for its Amazon Bedrock-based assistant: a history showing which IAM identity called which API and when, and the full text of the model\u0027s prompts and responses. Which TWO features should be enabled? (Select TWO.)","o":["AWS Trusted Advisor","Amazon Inspector","AWS CloudTrail","Amazon Bedrock model invocation logging","AWS Artifact"],"e":"**AWS CloudTrail** records API calls (identity, action, timestamp, source address) for auditing. Bedrock **model invocation logging** captures the full **prompts and responses** and delivers them to CloudWatch Logs or Amazon S3. Trusted Advisor provides recommendations, Inspector scans for software vulnerabilities, and Artifact provides AWS compliance reports."}},{"n":29,"d":3,"a":["B"],"fr":{"q":"Le service client d\u0027une enseigne de distribution veut qu\u0027un LLM convertisse chaque avis client en un objet JSON contenant le produit, la note et le problème signalé. Les premiers essais produisent des formats incohérents. Quelle technique de prompt engineering est la plus simple pour corriger cela ?","o":["Lancer un continued pre-training sur l\u0027historique complet des avis","Inclure dans le prompt quelques avis accompagnés du JSON attendu (few-shot)","Poser la question sans exemple en augmentant la temperature (zero-shot)","Demander au modèle d\u0027adopter le persona d\u0027un responsable qualité"],"e":"Le **few-shot prompting** fournit dans le prompt quelques exemples entrée → sortie qui montrent précisément le format attendu, sans aucun réentraînement. Augmenter la temperature rendrait les sorties encore moins régulières, le continued pre-training est disproportionné pour un problème de format, et un persona modifie le ton sans imposer de structure."},"en":{"q":"A retailer\u0027s customer service team wants an LLM to convert each customer review into a JSON object containing the product, the rating, and the reported issue. Early tests produce inconsistent formats. Which prompt engineering technique is the SIMPLEST way to fix this?","o":["Run continued pre-training on the full history of reviews","Include a few reviews with the expected JSON in the prompt (few-shot)","Ask without examples while increasing the temperature (zero-shot)","Ask the model to adopt the persona of a quality manager"],"e":"**Few-shot prompting** provides a few input → output examples in the prompt that show exactly the expected format, without any retraining. Increasing temperature would make outputs even less consistent, continued pre-training is disproportionate for a formatting issue, and a persona changes the tone without enforcing a structure."}},{"n":30,"d":4,"a":["C"],"fr":{"q":"Le régulateur d\u0027un assureur exige que chaque règle de tarification de l\u0027assurance habitation puisse être lue et vérifiée directement par un actuaire, quitte à perdre un peu de précision. Quel type de modèle l\u0027assureur doit-il privilégier ?","o":["Un grand modèle de langage interrogé avec un prompt de tarification détaillé","Un ensemble de plusieurs centaines de modèles combinés par un vote majoritaire","Un modèle interprétable, comme un arbre de décision peu profond ou une régression linéaire","Un réseau de neurones profond comportant plusieurs millions de paramètres"],"e":"Il existe un **compromis entre performance et interprétabilité** : les **arbres de décision** et la **régression linéaire** sont transparents par conception, car leurs règles ou coefficients se lisent directement. Les réseaux profonds, les LLM et les grands ensembles de modèles sont des boîtes noires qui nécessitent des outils d\u0027explication a posteriori et ne satisfont pas une exigence de lecture directe."},"en":{"q":"An insurer\u0027s regulator requires that every home insurance pricing rule can be read and verified directly by an actuary, even at the cost of some accuracy. Which type of model should the insurer favor?","o":["A large language model queried with a detailed pricing prompt","An ensemble of several hundred models combined by majority vote","An interpretable model, such as a shallow decision tree or a linear regression","A deep neural network with several million parameters"],"e":"There is a **trade-off between performance and interpretability**: **decision trees** and **linear regression** are transparent by design because their rules or coefficients can be read directly. Deep networks, LLMs, and large ensembles are black boxes that require post hoc explanation tools and do not satisfy a direct-readability requirement."}},{"n":31,"d":2,"a":["D"],"fr":{"q":"Un site de vente d\u0027articles de sport constate que sa recherche par mots-clés ne trouve rien pour « chaussures pour courir sous la pluie », alors que des modèles « trail imperméables » sont au catalogue. Quelle approche permet de rechercher les produits par le sens plutôt que par les mots exacts ?","o":["Extraire le texte des photos de produits avec un moteur de reconnaissance optique (OCR)","Encoder les catégories de produits en one-hot et filtrer sur la catégorie exacte","Ajouter manuellement des synonymes dans une expression régulière pour chaque produit","Convertir requêtes et fiches produits en embeddings vectoriels et comparer leur similarité"],"e":"Les **embeddings** représentent le texte sous forme de vecteurs numériques qui capturent le sens : des expressions sémantiquement proches ont des vecteurs proches, mesurés par exemple par la **similarité cosinus**. Les listes de synonymes ne passent pas à l\u0027échelle, l\u0027encodage one-hot ne capture aucune proximité de sens et l\u0027OCR ne fait qu\u0027extraire du texte d\u0027images."},"en":{"q":"A sporting goods website finds that its keyword search returns nothing for \u0027shoes for running in the rain\u0027, even though \u0027waterproof trail\u0027 models are in the catalog. Which approach makes it possible to search products by meaning rather than by exact words?","o":["Extract text from product photos with an optical character recognition (OCR) engine","One-hot encode product categories and filter on the exact category","Manually add synonyms to a regular expression for each product","Convert queries and product listings into vector embeddings and compare their similarity"],"e":"**Embeddings** represent text as numeric vectors that capture meaning: semantically similar phrases have nearby vectors, measured for example with **cosine similarity**. Synonym lists do not scale, one-hot encoding captures no similarity of meaning, and OCR only extracts text from images."}},{"n":32,"d":1,"a":["D"],"fr":{"q":"Une chaîne de magasins de bricolage veut regrouper ses 2 millions de clients en segments homogènes selon leurs habitudes d\u0027achat, afin d\u0027adapter ses campagnes. Aucun segment n\u0027est défini à l\u0027avance. Quelle approche convient le mieux ?","o":["Régression linéaire sur le panier moyen","Réseau de neurones convolutif (CNN)","Classification supervisée par arbre de décision","Clustering K-means (apprentissage non supervisé)"],"e":"Sans étiquettes préexistantes, il faut découvrir des groupes naturels dans les données : c\u0027est le rôle du **clustering**, par exemple **K-means**, une technique d\u0027**apprentissage non supervisé**. La classification supervisée exige des segments déjà étiquetés, la régression prédit une valeur numérique et un CNN est surtout adapté aux images."},"en":{"q":"A home-improvement retail chain wants to group its 2 million customers into homogeneous segments based on purchasing habits to tailor its campaigns. No segments are defined in advance. Which approach is MOST suitable?","o":["Linear regression on average basket size","Convolutional neural network (CNN)","Supervised classification with a decision tree","K-means clustering (unsupervised learning)"],"e":"With no pre-existing labels, the goal is to discover natural groups in the data, which is what **clustering** such as **K-means** does as an **unsupervised learning** technique. Supervised classification requires already-labeled segments, regression predicts a numeric value, and a CNN is mainly suited to images."}},{"n":33,"d":1,"a":["B"],"fr":{"q":"Un groupe de presse doit attribuer chaque nuit un score de pertinence à 20 millions d\u0027articles de son archive, à l\u0027aide d\u0027un modèle déjà entraîné sur SageMaker AI. Les résultats ne sont consultés que le lendemain matin et l\u0027entreprise veut éviter de payer un endpoint permanent. Quelle option d\u0027inférence choisir ?","o":["Un endpoint d\u0027inférence en temps réel","SageMaker Batch Transform","Un endpoint d\u0027inférence serverless","Un endpoint d\u0027inférence asynchrone"],"e":"**Batch Transform** traite de gros jeux de données hors ligne, puis libère les ressources à la fin du job : aucun endpoint persistant n\u0027est facturé. Un endpoint temps réel reste actif en permanence, un endpoint serverless vise des requêtes interactives à trafic intermittent, et l\u0027inférence asynchrone cible des requêtes individuelles volumineuses ou longues en quasi temps réel."},"en":{"q":"A newspaper group must score 20 million archived articles for relevance every night using a model already trained on SageMaker AI. Results are only viewed the next morning, and the company wants to avoid paying for a permanent endpoint. Which inference option should it choose?","o":["A real-time inference endpoint","SageMaker Batch Transform","A serverless inference endpoint","An asynchronous inference endpoint"],"e":"**Batch Transform** processes large datasets offline and releases resources when the job ends, so no persistent endpoint is billed. A real-time endpoint stays up permanently, a serverless endpoint targets interactive requests with intermittent traffic, and asynchronous inference targets individual large or long-running requests in near real time."}},{"n":34,"d":5,"a":["D"],"fr":{"q":"Une enseigne d\u0027électroménager fine-tune un modèle de fondation dans Amazon Bedrock avec ses propres données de service après-vente, puis l\u0027intègre à son application. Selon la Generative AI Security Scoping Matrix d\u0027AWS, dans quelle portée (scope) se situe ce projet ?","o":["Portée 3 : modèles pré-entraînés","Portée 1 : applications grand public","Portée 5 : modèles auto-entraînés","Portée 4 : modèles fine-tunés"],"e":"La matrice distingue cinq portées : 1 application grand public, 2 application d\u0027entreprise (SaaS), 3 application bâtie sur un modèle **pré-entraîné**, 4 modèle **fine-tuné** avec ses propres données, 5 modèle **entraîné de zéro**. Fine-tuner un modèle de fondation avec ses données relève de la **portée 4**, ce qui accroît la responsabilité du client sur les données d\u0027entraînement et sur le modèle obtenu."},"en":{"q":"A home appliance retailer fine-tunes a foundation model in Amazon Bedrock with its own after-sales service data and then integrates it into its application. According to the AWS Generative AI Security Scoping Matrix, which scope does this project fall into?","o":["Scope 3: pre-trained models","Scope 1: consumer apps","Scope 5: self-trained models","Scope 4: fine-tuned models"],"e":"The matrix defines
