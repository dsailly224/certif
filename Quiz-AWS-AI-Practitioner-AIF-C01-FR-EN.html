** queues requests, supports **payloads up to 1 GB** and **processing times up to about 1 hour**, writes results to S3, and can **scale the instance count down to zero**.\n- A real-time endpoint targets responses within seconds on small payloads.\n- Serverless Inference is limited to small payloads and short processing times.\n- Batch Transform processes a full dataset offline, not requests arriving continuously."}},{"n":19,"d":3,"a":["D"],"fr":{"q":"Une équipe a construit un assistant RAG avec Amazon Bedrock Knowledge Bases. Avant la mise en production, elle veut mesurer si les réponses générées s\u0027appuient réellement sur les passages récupérés, sans information inventée. Quelle approche convient ?","o":["Calculer le score BLEU des réponses par rapport aux documents sources","Mesurer la perplexité du modèle sur les passages récupérés","Suivre le taux de conversion des utilisateurs de l\u0027assistant","Lancer une évaluation RAG Bedrock avec un LLM juge mesurant la fidélité (faithfulness)"],"e":"Les **évaluations de Knowledge Bases d\u0027Amazon Bedrock** utilisent un **LLM juge** pour noter des métriques propres au RAG, dont la **fidélité** (la réponse est-elle étayée par le contexte récupéré ?), la pertinence du contexte ou l\u0027exactitude.\n- BLEU mesure un recouvrement de n-grammes avec une traduction de référence, pas l\u0027ancrage factuel.\n- La perplexité évalue la modélisation du langage.\n- Le taux de conversion est une métrique business, utile mais qui ne détecte pas les hallucinations."},"en":{"q":"A team built a RAG assistant with Amazon Bedrock Knowledge Bases. Before going to production, it wants to measure whether generated answers are actually supported by the retrieved passages, with no invented information. Which approach fits?","o":["Compute the BLEU score of the answers against the source documents","Measure the model’s perplexity on the retrieved passages","Track the conversion rate of the assistant’s users","Run a Bedrock RAG evaluation with an LLM judge measuring faithfulness"],"e":"**Amazon Bedrock Knowledge Base evaluations** use an **LLM judge** to score RAG-specific metrics, including **faithfulness** (is the answer supported by the retrieved context?), context relevance, and correctness.\n- BLEU measures n-gram overlap with a reference translation, not factual grounding.\n- Perplexity evaluates language modeling.\n- Conversion rate is a business metric; useful, but it does not detect hallucinations."}},{"n":20,"d":2,"a":["C","D"],"fr":{"q":"Une équipe exécute deux fois le même jeu d\u0027évaluation de 200 prompts sur un LLM et obtient des scores différents. Quelles mesures rendent l\u0027évaluation plus fiable et reproductible ? (Sélectionnez DEUX réponses.)","o":["Augmenter la température à 1,0 pour explorer davantage de réponses","Fixer top-p à 1,0 afin d\u0027élargir l\u0027échantillonnage des tokens","Fixer la température à 0 (ou très proche) pendant l\u0027évaluation","Répéter l\u0027évaluation plusieurs fois et comparer la moyenne et la dispersion des scores","Réduire le jeu d\u0027évaluation à cinq prompts pour limiter la variabilité"],"e":"Les LLM sont **non déterministes** : l\u0027échantillonnage des tokens produit des sorties différentes pour une même entrée. Une **température à 0** rend la génération (quasi) déterministe, et **répéter les mesures** permet de raisonner sur une moyenne et une dispersion plutôt que sur un seul tirage.\n- Augmenter la température ou top-p accroît la variabilité.\n- Un jeu de cinq prompts n\u0027est pas représentatif et rend les scores encore plus instables."},"en":{"q":"A team runs the same 200-prompt evaluation set twice against an LLM and gets different scores. Which measures make the evaluation more reliable and reproducible? (Select TWO.)","o":["Raise the temperature to 1.0 to explore more responses","Set top-p to 1.0 to widen token sampling","Set the temperature to 0 (or very close) during evaluation","Repeat the evaluation several times and compare the mean and spread of the scores","Shrink the evaluation set to five prompts to limit variability"],"e":"LLMs are **non-deterministic**: token sampling produces different outputs for the same input. A **temperature of 0** makes generation (nearly) deterministic, and **repeating the measurements** lets the team reason about a mean and a spread rather than a single draw.\n- Raising the temperature or top-p increases variability.\n- A five-prompt set is not representative and makes scores even less stable."}},{"n":21,"d":3,"a":["A"],"fr":{"q":"Une entreprise utilise un modèle de fondation pour classer les tickets entrants dans six catégories. Sur un jeu de test de 500 tickets étiquetés, l\u0027accuracy n\u0027est que de 74 % et les libellés renvoyés sont parfois mal formatés. Quelle est la PREMIÈRE action à essayer, avec le moins d\u0027effort ?","o":["Ajouter au prompt quelques exemples étiquetés par catégorie (few-shot), puis remesurer l\u0027accuracy","Lancer un continued pre-training sur l\u0027ensemble des tickets historiques non étiquetés","Entraîner un nouveau modèle de langage à partir de zéro sur SageMaker AI","Augmenter la température pour que le modèle explore d\u0027autres catégories"],"e":"Le **few-shot prompting** (quelques exemples entrée → étiquette dans le prompt) est l\u0027approche de personnalisation la plus légère : il guide le modèle vers le bon format et les bonnes catégories, et son effet se **mesure** à nouveau sur le même jeu de test.\n- Continued pre-training et entraînement de zéro sont bien plus coûteux et ne s\u0027envisagent qu\u0027après échec des approches légères.\n- Une température plus élevée rend les sorties moins régulières."},"en":{"q":"A company uses a foundation model to classify incoming tickets into six categories. On a test set of 500 labeled tickets, accuracy is only 74%, and the returned labels are sometimes badly formatted. What is the FIRST action to try, with the least effort?","o":["Add a few labeled examples per category to the prompt (few-shot), then measure accuracy again","Run continued pre-training on all unlabeled historical tickets","Train a new language model from scratch on SageMaker AI","Increase the temperature so the model explores other categories"],"e":"**Few-shot prompting** (a few input → label examples in the prompt) is the lightest customization approach: it steers the model toward the right format and categories, and its effect is **measured** again on the same test set.\n- Continued pre-training and training from scratch are far more expensive and only considered after lighter approaches fail.\n- A higher temperature makes outputs less consistent."}},{"n":22,"d":5,"a":["C"],"fr":{"q":"Un auditeur interne demande à une équipe de prouver quel jeu de données, quel job d\u0027entraînement et quels hyperparamètres ont produit la version 7 du modèle actuellement servie par un endpoint SageMaker AI. Quelle fonctionnalité facilite cette traçabilité ?","o":["AWS Trusted Advisor, qui analyse la configuration du compte","Amazon Macie, qui inventorie les données sensibles des buckets S3","SageMaker ML Lineage Tracking, qui relie données, jobs, modèles et endpoints","AWS Artifact, qui fournit les rapports de conformité d\u0027AWS"],"e":"**SageMaker ML Lineage Tracking** enregistre des entités de **lignage** (artefacts de données, jobs d\u0027entraînement, modèles, endpoints) et leurs relations, ce qui permet de reconstituer la provenance d\u0027un modèle déployé pour un audit ; Model Registry complète ce suivi au niveau des versions.\n- Trusted Advisor émet des recommandations de bonnes pratiques.\n- Macie détecte les données sensibles, sans tracer l\u0027entraînement.\n- Artifact concerne la conformité de l\u0027infrastructure AWS, pas vos modèles."},"en":{"q":"An internal auditor asks a team to prove which dataset, which training job, and which hyperparameters produced version 7 of the model currently served by a SageMaker AI endpoint. Which feature makes this traceability easier?","o":["AWS Trusted Advisor, which analyzes the account configuration","Amazon Macie, which inventories sensitive data in S3 buckets","SageMaker ML Lineage Tracking, which links data, jobs, models, and endpoints","AWS Artifact, which provides AWS compliance reports"],"e":"**SageMaker ML Lineage Tracking** records **lineage** entities (data artifacts, training jobs, models, endpoints) and their relationships, making it possible to reconstruct the provenance of a deployed model for an audit; Model Registry complements this at the version level.\n- Trusted Advisor issues best-practice recommendations.\n- Macie detects sensitive data but does not trace training.\n- Artifact covers the compliance of AWS infrastructure, not your models."}},{"n":23,"d":1,"a":["B"],"fr":{"q":"Les data scientists d\u0027un distributeur calculent dans un notebook la feature « montant moyen des achats sur 30 jours » pour l\u0027entraînement, tandis que l\u0027équipe applicative la recalcule autrement en production, ce qui crée des écarts de prédiction. Quelle fonctionnalité de SageMaker AI résout ce problème ?","o":["SageMaker Data Wrangler, pour préparer visuellement les données","SageMaker Feature Store, avec un store offline et un store online partagés","SageMaker Model Registry, pour versionner les modèles","SageMaker Experiments, pour comparer les runs d\u0027entraînement"],"e":"**SageMaker Feature Store** centralise des définitions de features réutilisables : le **store offline** sert à l\u0027entraînement et le **store online** fournit les mêmes valeurs à faible latence pour l\u0027inférence, ce qui évite l\u0027**écart entraînement/production (training-serving skew)**.\n- Data Wrangler prépare les données mais ne sert pas les features en production.\n- Model Registry et Experiments gèrent respectivement les versions de modèles et le suivi des runs."},"en":{"q":"A retailer’s data scientists compute the feature ‘average purchase amount over 30 days’ in a notebook for training, while the application team recomputes it differently in production, causing prediction discrepancies. Which SageMaker AI feature solves this problem?","o":["SageMaker Data Wrangler, to prepare data visually","SageMaker Feature Store, with shared offline and online stores","SageMaker Model Registry, to version models","SageMaker Experiments, to compare training runs"],"e":"**SageMaker Feature Store** centralizes reusable feature definitions: the **offline store** serves training and the **online store** serves the same values at low latency for inference, avoiding **training-serving skew**.\n- Data Wrangler prepares data but does not serve features in production.\n- Model Registry and Experiments manage model versions and run tracking, respectively."}},{"n":24,"d":2,"a":["A"],"fr":{"q":"Un analyste veut faire résumer un rapport de 9 000 mots par un modèle dont la fenêtre de contexte est de 8 000 tokens. En retenant la règle approximative d\u0027un token pour 0,75 mot, que doit-il conclure ?","o":["Environ 12 000 tokens : le rapport dépasse la fenêtre, il faut le découper ou changer de modèle","Environ 6 750 tokens : le rapport tient dans la fenêtre avec de la marge","Environ 9 000 tokens : le rapport dépasse à peine, il suffit de baisser la température","Environ 2 250 tokens : le rapport n\u0027occupe qu\u0027un quart de la fenêtre"],"e":"Avec environ 0,75 mot par token, 9 000 mots ≈ 9 000 / 0,75 = **12 000 tokens**, au-delà de la **fenêtre de contexte** de 8 000 tokens (qui doit en plus contenir les instructions et la réponse). Il faut **découper (chunking)** le document, par exemple pour des résumés successifs, ou choisir un modèle à fenêtre plus large.\n- 6 750 résulte d\u0027une multiplication au lieu d\u0027une division.\n- La température n\u0027a aucun effet sur la taille de la fenêtre de contexte."},"en":{"q":"An analyst wants a model with an 8,000-token context window to summarize a 9,000-word report. Using the rough rule of one token per 0.75 words, what should the analyst conclude?","o":["About 12,000 tokens: the report exceeds the window, so it must be split or another model used","About 6,750 tokens: the report fits in the window with room to spare","About 9,000 tokens: the report barely exceeds it, so lowering the temperature is enough","About 2,250 tokens: the report fills only a quarter of the window"],"e":"At about 0.75 words per token, 9,000 words ≈ 9,000 / 0.75 = **12,000 tokens**, beyond the 8,000-token **context window** (which must also hold the instructions and the response). The document must be **chunked**, for example for successive summaries, or a model with a larger window chosen.\n- 6,750 comes from multiplying instead of dividing.\n- Temperature has no effect on the size of the context window."}},{"n":25,"d":4,"a":["D"],"fr":{"q":"Une compagnie d\u0027assurance doit documenter, pour chacun de ses modèles, l\u0027usage prévu, les limites connues, le niveau de risque et les résultats d\u0027évaluation par sous-groupe, afin de les présenter à son comité d\u0027éthique. Quelle solution AWS est conçue pour cela ?","o":["AWS AI Service Cards","Des tableaux de bord Amazon CloudWatch","SageMaker Experiments","SageMaker Model Cards"],"e":"Les **SageMaker Model Cards** documentent dans un format standard l\u0027**usage prévu**, le **niveau de risque**, les détails d\u0027entraînement et les **résultats d\u0027évaluation** d\u0027un modèle, au service de la **transparence** et de la gouvernance.\n- Les AWS AI Service Cards documentent les services d\u0027IA d\u0027AWS eux-mêmes, pas les modèles du client.\n- CloudWatch suit des métriques opérationnelles.\n- Experiments trace les runs mais ne constitue pas une fiche de gouvernance."},"en":{"q":"An insurance company must document, for each of its models, the intended use, known limitations, risk rating, and per-subgroup evaluation results so they can be presented to its ethics committee. Which AWS solution is designed for this?","o":["AWS AI Service Cards","Amazon CloudWatch dashboards","SageMaker Experiments","SageMaker Model Cards"],"e":"**SageMaker Model Cards** document a model’s **intended use**, **risk rating**, training details, and **evaluation results** in a standard format, supporting **transparency** and governance.\n- AWS AI Service Cards document AWS’s own AI services, not customer models.\n- CloudWatch tracks operational metrics.\n- Experiments tracks runs but is not a governance record."}},{"n":26,"d":3,"a":["C"],"fr":{"q":"Un laboratoire pharmaceutique dispose de 2 Go de publications internes non étiquetées et veut qu\u0027un modèle d\u0027Amazon Bedrock maîtrise le vocabulaire très spécialisé de son domaine. Quelle approche de personnalisation convient, et comment le modèle obtenu sera-t-il servi ?","o":["Un fine-tuning sur ces publications non étiquetées, puis une inférence à la demande","Une base de connaissances RAG, puis l\u0027achat d\u0027un Provisioned Throughput obligatoire","Un continued pre-training sur ces données non étiquetées, puis une inférence via Provisioned Throughput","Un prompt few-shot contenant les 2 Go de publications, puis une inférence par lots"],"e":"Le **continued pre-training** adapte un modèle de fondation à un domaine à partir de **données non étiquetées** ; dans Amazon Bedrock, le modèle personnalisé obtenu est servi via du **Provisioned Throughput**.\n- Le fine-tuning requiert des paires prompt / réponse étiquetées.\n- Le RAG n\u0027exige pas de Provisioned Throughput et n\u0027adapte pas le modèle lui-même.\n- 2 Go de texte dépassent de très loin toute fenêtre de contexte."},"en":{"q":"A pharmaceutical lab has 2 GB of unlabeled internal publications and wants an Amazon Bedrock model to master its highly specialized domain vocabulary. Which customization approach fits, and how will the resulting model be served?","o":["Fine-tuning on these unlabeled publications, then on-demand inference","A RAG knowledge base, then a mandatory Provisioned Throughput purchase","Continued pre-training on this unlabeled data, then inference through Provisioned Throughput","A few-shot prompt containing the 2 GB of publications, then batch inference"],"e":"**Continued pre-training** adapts a foundation model to a domain using **unlabeled data**; in Amazon Bedrock, the resulting custom model is served through **Provisioned Throughput**.\n- Fine-tuning requires labeled prompt / response pairs.\n- RAG does not require Provisioned Throughput and does not adapt the model itself.\n- 2 GB of text far exceeds any context window."}},{"n":27,"d":1,"a":["A","E"],"fr":{"q":"Un modèle de classification d\u0027images atteint 99 % d\u0027accuracy sur les données d\u0027entraînement mais seulement 71 % sur les données de validation. Quelles actions sont appropriées ? (Sélectionnez DEUX réponses.)","o":["Augmenter et diversifier les données d\u0027entraînement, par exemple avec de l\u0027augmentation de données","Augmenter le nombre d\u0027époques pour que le modèle converge davantage","Ajouter des couches au réseau pour accroître sa capacité","Évaluer désormais le modèle uniquement sur les données d\u0027entraînement","Appliquer une régularisation (dropout, L2) et un arrêt précoce (early stopping)"],"e":"Un grand écart entre entraînement et validation signale un **sur-apprentissage** (variance élevée). Les remèdes classiques sont **plus de données variées** (dont l\u0027augmentation de données) et la **régularisation** avec **arrêt précoce**.\n- Plus d\u0027époques ou un réseau plus profond accentuent la mémorisation.\n- Évaluer sur les données d\u0027entraînement masque le problème au lieu de le résoudre."},"en":{"q":"An image classification model reaches 99% accuracy on training data but only 71% on validation data. Which actions are appropriate? (Select TWO.)","o":["Increase and diversify the training data, for example with data augmentation","Increase the number of epochs so the model converges further","Add layers to the network to increase its capacity","From now on, evaluate the model only on the training data","Apply regularization (dropout, L2) and early stopping"],"e":"A large gap between training and validation signals **overfitting** (high variance). Standard remedies are **more varied data** (including data augmentation) and **regularization** with **early stopping**.\n- More epochs or a deeper network increase memorization.\n- Evaluating on training data hides the problem instead of solving it."}},{"n":28,"d":2,"a":["A"],"fr":{"q":"Lors de tests, l\u0027assistant juridique d\u0027une entreprise cite avec assurance un article de loi qui n\u0027existe pas. Comment qualifier ce comportement et quelle contre-mesure est appropriée ?","o":["Une hallucination ; ancrer les réponses sur des sources (RAG) et activer un contrôle d\u0027ancrage contextuel","Une dérive des données ; réentraîner le modèle de fondation chaque mois","Une injection de prompt ; ajouter un filtre de mots interdits dans Guardrails","Un sur-apprentissage ; appliquer du dropout au modèle de fondation"],"e":"Une réponse plausible mais factuellement fausse est une **hallucination**. On la réduit en **ancrant** les réponses sur des documents de référence (RAG) et en activant le **contrôle d\u0027ancrage contextuel (grounding)** d\u0027Amazon Bedrock Guardrails, qui filtre les réponses non étayées par les sources.\n- La dérive des données concerne l\u0027évolution des entrées en production.\n- Une injection de prompt est une attaque délibérée d\u0027un utilisateur.\n- Le dropout est une technique d\u0027entraînement, inapplicable à un modèle consommé via API."},"en":{"q":"During testing, a company’s legal assistant confidently cites a statute article that does not exist. How should this behavior be described, and which countermeasure is appropriate?","o":["A hallucination; ground answers in sources (RAG) and enable a contextual grounding check","Data drift; retrain the foundation model every month","Prompt injection; add a banned-word filter in Guardrails","Overfitting; apply dropout to the foundation model"],"e":"A plausible but factually wrong answer is a **hallucination**. It is reduced by **grounding** answers in reference documents (RAG) and enabling the **contextual grounding check** in Amazon Bedrock Guardrails, which filters responses not supported by the sources.\n- Data drift concerns changes in production inputs.\n- Prompt injection is a deliberate attack by a user.\n- Dropout is a training technique and cannot be applied to a model consumed through an API."}},{"n":29,"d":3,"a":["B"],"fr":{"q":"Les réponses du chatbot d\u0027une agence de voyages sont souvent très longues, ce qui fait exploser la facture en tokens de sortie, alors que les utilisateurs veulent des réponses brèves. Quelle action réduit directement ce coût ?","o":["Augmenter la température pour diversifier les réponses","Réduire le paramètre max tokens et demander explicitement une réponse concise dans le prompt","Augmenter top-k pour élargir le choix des tokens candidats","Passer du mode à la demande à un Provisioned Throughput"],"e":"Le paramètre **max tokens** plafonne la longueur de la sortie, donc le nombre de **tokens de sortie facturés** ; une consigne de concision dans le prompt évite que les réponses soient coupées brutalement.\n- Température et top-k influencent le choix des tokens, pas la longueur.\n- Provisioned Throughput garantit un débit ; il ne réduit pas la verbosité et n\u0027est rentable qu\u0027avec un trafic soutenu."},"en":{"q":"A travel agency chatbot’s answers are often very long, driving up the output token bill, while users want short answers. Which action directly reduces this cost?","o":["Increase the temperature to diversify the answers","Lower the max tokens parameter and explicitly ask for a concise answer in the prompt","Increase top-k to widen the choice of candidate tokens","Switch from on-demand to Provisioned Throughput"],"e":"The **max tokens** parameter caps output length and therefore the number of **billed output tokens**; a conciseness instruction in the prompt prevents answers from being cut off abruptly.\n- Temperature and top-k influence token choice, not length.\n- Provisioned Throughput guarantees throughput; it does not reduce verbosity and only pays off with sustained traffic."}},{"n":30,"d":5,"a":["C"],"fr":{"q":"Le service conformité d\u0027une mutuelle exige de conserver, pour audit, le texte complet des prompts envoyés aux modèles d\u0027Amazon Bedrock et des réponses obtenues. Quelle solution répond à cette exigence ?","o":["Activer AWS CloudTrail, qui enregistre le contenu intégral des prompts","Créer une règle AWS Config qui archive chaque réponse générée","Activer la journalisation des invocations de modèles Bedrock vers S3 ou CloudWatch Logs","Consulter les recommandations d\u0027AWS Trusted Advisor chaque semaine"],"e":"La **journalisation des invocations de modèles (model invocation logging)** d\u0027Amazon Bedrock enregistre les données d\u0027entrée et de sortie de chaque appel dans **Amazon S3** et/ou **CloudWatch Logs**.\n- CloudTrail trace les appels d\u0027API (qui, quand, quelle action), pas le contenu complet des prompts et réponses.\n- AWS Config évalue la configuration des ressources.\n- Trusted Advisor fournit des recommandations, pas des journaux."},"en":{"q":"A health insurer’s compliance department requires keeping, for audit purposes, the full text of the prompts sent to Amazon Bedrock models and of the responses received. Which solution meets this requirement?","o":["Enable AWS CloudTrail, which records the full content of prompts","Create an AWS Config rule that archives every generated response","Enable Bedrock model invocation logging to S3 or CloudWatch Logs","Review AWS Trusted Advisor recommendations every week"],"e":"Amazon Bedrock **model invocation logging** records the input and output data of each call in **Amazon S3** and/or **CloudWatch Logs**.\n- CloudTrail records API calls (who, when, which action), not the full content of prompts and responses.\n- AWS Config evaluates resource configuration.\n- Trusted Advisor provides recommendations, not logs."}},{"n":31,"d":2,"a":["D"],"fr":{"q":"Une PME sans équipe ML envisage de fine-tuner un LLM pour détecter la langue et le sentiment (positif, négatif, neutre, mitigé) de 10 000 avis clients par jour. Quelle alternative répond au besoin avec le MOINS d\u0027effort ?","o":["Effectuer un continued pre-training d\u0027un modèle Bedrock sur les avis historiques","Entraîner un modèle de classification personnalisé sur SageMaker AI","Déployer un grand modèle open source via SageMaker JumpStart puis l\u0027affiner","Appeler les API pré-entraînées d\u0027Amazon Comprehend pour la langue et le sentiment"],"e":"**Amazon Comprehend** est un service d\u0027IA **pré-entraîné** qui détecte directement la **langue** et le **sentiment** d\u0027un texte par simple appel d\u0027API : aucun entraînement, aucune infrastructure, coût prévisible. L\u0027IA générative ou un modèle personnalisé ne se justifient que si un service spécialisé ne couvre pas le besoin.\n- Continued pre-training, modèle personnalisé et fine-tuning via JumpStart demandent données, compétences ML et maintenance."},"en":{"q":"A small business with no ML team is considering fine-tuning an LLM to detect the language and sentiment (positive, negative, neutral, mixed) of 10,000 customer reviews per day. Which alternative meets the need with the LEAST effort?","o":["Run continued pre-training of a Bedrock model on historical reviews","Train a custom classification model on SageMaker AI","Deploy a large open-source model through SageMaker JumpStart and fine-tune it","Call the pre-trained Amazon Comprehend APIs for language and sentiment"],"e":"**Amazon Comprehend** is a **pre-trained** AI service that directly detects the **language** and **sentiment** of text with a simple API call: no training, no infrastructure, predictable cost. Generative AI or a custom model is only justified when a specialized service does not cover the need.\n- Continued pre-training, a custom model, and fine-tuning through JumpStart all require data, ML skills, and maintenance."}},{"n":32,"d":1,"a":["B"],"fr":{"q":"Une start-up entraîne chaque semaine un modèle XGBoost sur SageMaker AI pendant environ 6 heures. Le délai de livraison est flexible et l\u0027objectif est de réduire au maximum le coût d\u0027entraînement. Que doit-elle faire ?","o":["Souscrire un SageMaker AI Savings Plan sur trois ans","Utiliser Managed Spot Training avec des checkpoints enregistrés dans S3","Passer à des instances on-demand plus puissantes pour finir plus vite","Entraîner le modèle sur un endpoint temps réel déjà provisionné"],"e":"**Managed Spot Training** utilise de la capacité EC2 inutilisée et peut réduire le coût d\u0027entraînement **jusqu\u0027à 90 %** par rapport à l\u0027on-demand ; les **checkpoints** dans S3 permettent de reprendre après une interruption, ce qu\u0027autorise un délai flexible.\n- Un Savings Plan suppose un usage régulier et soutenu ; pour 6 heures par semaine, l\u0027engagement est peu rentable et l\u0027économie inférieure au Spot.\n- Des instances plus puissantes à la demande ne garantissent pas une baisse du coût.\n- Un endpoint sert à l\u0027inférence, pas à l\u0027entraînement."},"en":{"q":"A startup trains an XGBoost model on SageMaker AI every week for about 6 hours. Delivery timing is flexible, and the goal is to cut training cost as much as possible. What should it do?","o":["Purchase a three-year SageMaker AI Savings Plan","Use Managed Spot Training with checkpoints saved to S3","Switch to more powerful on-demand instances to finish faster","Train the model on an already provisioned real-time endpoint"],"e":"**Managed Spot Training** uses spare EC2 capacity and can reduce training cost by **up to 90%** compared with on-demand; **checkpoints** in S3 allow resuming after an interruption, which flexible timing permits.\n- A Savings Plan assumes steady, sustained usage; for 6 hours a week, the commitment pays off poorly and saves less than Spot.\n- More powerful on-demand instances do not guarantee lower cost.\n- An endpoint is for inference, not training."}},{"n":33,"d":3,"a":["A"],"fr":{"q":"Un e-commerçant a déployé un assistant d\u0027achat basé sur un modèle de fondation. La direction veut savoir si l\u0027assistant crée réellement de la valeur pour l\u0027entreprise. Quelles mesures sont les plus pertinentes ?","o":["Le taux de conversion des sessions avec et sans assistant, et le coût moyen par conversation","Le score BLEU des réponses comparées à des réponses de référence","La perplexité du modèle sur le catalogue de produits","Le nombre de paramètres et la taille de la fenêtre de contexte du modèle"],"e":"La valeur d\u0027une application d\u0027IA générative se mesure avec des **métriques business** : **taux de conversion** (idéalement par test A/B avec et sans assistant), panier moyen, satisfaction client, **coût par conversation** ou par utilisateur, et ROI.\n- BLEU et perplexité sont des métriques techniques qui ne prouvent pas un gain commercial.\n- Le nombre de paramètres décrit le modèle, pas son impact."},"en":{"q":"An online retailer has deployed a shopping assistant built on a foundation model. Leadership wants to know whether the assistant actually creates value for the business. Which measures are most relevant?","o":["The conversion rate of sessions with and without the assistant, and the average cost per conversation","The BLEU score of the answers compared with reference answers","The model’s perplexity on the product catalog","The model’s parameter count and context window size"],"e":"The value of a generative AI application is measured with **business metrics**: **conversion rate** (ideally through an A/B test with and without the assistant), average order value, customer satisfaction, **cost per conversation** or per user, and ROI.\n- BLEU and perplexity are technical metrics that do not prove a business gain.\n- Parameter count describes the model, not its impact."}},{"n":34,"d":4,"a":["B","D"],"fr":{"q":"Un modèle de transcription vocale d\u0027un centre d\u0027appels fonctionne mal pour les clients ayant un accent régional. Les données d\u0027entraînement proviennent à 92 % de locuteurs d\u0027une seule région. Quelles actions corrigent ce biais de manière responsable ? (Sélectionnez DEUX réponses.)","o":["Augmenter le taux d\u0027apprentissage pour accélérer la convergence","Collecter davantage d\u0027enregistrements des accents sous-représentés pour rééquilibrer le jeu","Retirer les accents régionaux du jeu de test afin d\u0027améliorer les scores","Mesurer le taux d\u0027erreur séparément pour chaque groupe d\u0027accents avant et après le déploiement","Se fier uniquement au taux d\u0027erreur global, plus simple à communiquer"],"e":"Il s\u0027agit d\u0027un **biais d\u0027échantillonnage** : certains groupes sont sous-représentés. Les réponses responsables sont de **rééquilibrer les données** avec des enregistrements représentatifs et de **mesurer la performance par sous-groupe**, avant et après déploiement, pour vérifier l\u0027équité.\n- Le taux d\u0027apprentissage n\u0027agit pas sur la représentativité des données.\n- Exclure des groupes du test ou se limiter à une métrique globale masque le problème."},"en":{"q":"A contact center’s speech transcription model performs poorly for customers with a regional accent. 92% of the training data comes from speakers from a single region. Which actions address this bias responsibly? (Select TWO.)","o":["Increase the learning rate to speed up convergence","Collect more recordings of underrepresented accents to rebalance the dataset","Remove regional accents from the test set to improve the scores","Measure the error rate separately for each accent group before and after deployment","Rely only on the overall error rate, which is easier to communicate"],"e":"This is **sampling bias**: some groups are underrepresented. The responsible responses are to **rebalance the data** with representative recordings and to **measure performance per subgroup**, before and after deployment, to verify fairness.\n- The learning rate has no effect on data representativeness.\n- Excluding groups from testing or relying on an aggregate metric hides the problem."}},{"n":35,"d":2,"a":["D"],"fr":{"q":"Quelle architecture de réseau de neurones, à la base des grands modèles de langage actuels, utilise un mécanisme d\u0027auto-attention (self-attention) pour pondérer l\u0027importance de chaque token par rapport aux autres et traite les séquences en parallèle ?","o":["Le réseau de neurones convolutif (CNN)","Le réseau antagoniste génératif (GAN)","Le réseau de neurones récurrent (RNN/LSTM)","Le Transformer"],"e":"Le **Transformer** repose sur l\u0027**auto-attention**, qui calcule les relations entre tous les tokens d\u0027une séquence et permet un traitement **parallèle**, d\u0027où son efficacité à grande échelle pour les LLM.\n- Les CNN sont surtout adaptés aux images.\n- Les GAN opposent un générateur et un discriminateur.\n- Les RNN/LSTM traitent les tokens séquentiellement, ce qui limite le parallélisme et la prise en compte des longues dépendances."},"en":{"q":"Which neural network architecture, the foundation of today’s large language models, uses a self-attention mechanism to weigh the importance of each token relative to the others and processes sequences in parallel?","o":["Convolutional neural network (CNN)","Generative adversarial network (GAN)","Recurrent neural network (RNN/LSTM)","Transformer"],"e":"The **Transformer** relies on **self-attention**, which computes relationships between all tokens in a sequence and enables **parallel** processing, hence its efficiency at scale for LLMs.\n- CNNs are mainly suited to images.\n- GANs pit a generator against a discriminator.\n- RNNs/LSTMs process tokens sequentially, which limits parallelism and long-range dependencies."}},{"n":36,"d":3,"a":["B"],"fr":{"q":"Une équipe data veut partir d\u0027un modèle open source Llama, l\u0027affiner sur ses propres données puis l\u0027héberger sur un endpoint dans son compte AWS en choisissant elle-même le type d\u0027instance. Quel service lui offre le point de départ le plus rapide ?","o":["Amazon Comprehend, avec un classificateur personnalisé","SageMaker JumpStart","Amazon Quick","Kiro"],"e":"**SageMaker JumpStart** propose un catalogue de modèles pré-entraînés et de modèles de fondation (dont Llama) déployables en quelques clics sur des **endpoints SageMaker AI** dans le compte du client, avec le choix des instances, et sert de point de départ au **fine-tuning**.\n- Comprehend propose des classificateurs personnalisés, pas l\u0027hébergement de LLM open source.\n- Amazon Quick est un espace de travail agentique pour les utilisateurs métier.\n- Kiro est un IDE agentique de développement."},"en":{"q":"A data team wants to start from an open-source Llama model, fine-tune it on its own data, and host it on an endpoint in its AWS account while choosing the instance type itself. Which service offers the fastest starting point?","o":["Amazon Comprehend, with a custom classifier","SageMaker JumpStart","Amazon Quick","Kiro"],"e":"**SageMaker JumpStart** offers a catalog of pre-trained models and foundation models (including Llama) that can be deployed in a few clicks to **SageMaker AI endpoints** in the customer’s account, with a choice of instances, and serves as a starting point for **fine-tuning**.\n- Comprehend offers custom classifiers, not hosting of open-source LLMs.\n- Amazon Quick is an agentic workspace for business users.\n- Kiro is an agentic development IDE."}},{"n":37,"d":1,"a":["C"],"fr":{"q":"Un modèle de tri de candidatures obtient une précision de 0,60 et un rappel de 0,90 sur le jeu de test. Les classes étant déséquilibrées, l\u0027équipe veut un indicateur unique combinant les deux. Quel est le score F1 ?","o":["0,75","0,54","0,72","0,90"],"e":"Le **score F1** est la moyenne harmonique de la précision et du rappel : 2 × 0,60 × 0,90 / (0,60 + 0,90) = 1,08 / 1,50 = **0,72**. Il pénalise un déséquilibre entre les deux métriques.\n- 0,75 est la moyenne arithmétique, qui surestime la performance.\n- 0,54 est le simple produit 0,60 × 0,90.\n- 0,90 ne reprend que le rappel."},"en":{"q":"A résumé screening model achieves a precision of 0.60 and a recall of 0.90 on the test set. Because the classes are imbalanced, the team wants a single metric that combines both. What is the F1 score?","o":["0.75","0.54","0.72","0.90"],"e":"The **F1 score** is the harmonic mean of precision and recall: 2 × 0.60 × 0.90 / (0.60 + 0.90) = 1.08 / 1.50 = **0.72**. It penalizes an imbalance between the two metrics.\n- 0.75 is the arithmetic mean, which overstates performance.\n- 0.54 is the plain product 0.60 × 0.90.\n- 0.90 is just the recall."}},{"n":38,"d":5,"a":["D","E"],"fr":{"q":"SageMaker Role Manager n\u0027étant plus proposé aux nouveaux clients, une entreprise veut appliquer le principe du moindre privilège aux rôles utilisés par ses jobs d\u0027entraînement et ses endpoints SageMaker AI. Quelles pratiques adopter ? (Sélectionnez DEUX réponses.)","o":["Attacher la policy AdministratorAccess aux rôles d\u0027exécution pour éviter les erreurs d\u0027accès","Continuer à générer les rôles avec SageMaker Role Manager","Partager un même utilisateur IAM et ses clés d\u0027accès entre tous les data scientists","Créer des rôles d\u0027exécution IAM distincts par cas d\u0027usage, limités aux buckets et clés KMS nécessaires","Générer des policies à partir de l\u0027activité CloudTrail avec IAM Access Analyzer et retirer les droits inutilisés"],"e":"Le **moindre privilège** s\u0027applique avec des **rôles d\u0027exécution IAM dédiés** dont les policies se limitent aux ressources nécessaires (préfixes S3, clés KMS), puis en affinant les droits à partir de l\u0027activité réelle avec **IAM Access Analyzer**.\n- AdministratorAccess viole le moindre privilège.\n- Role Manager est fermé aux nouveaux clients.\n- Des identifiants partagés empêchent toute traçabilité individuelle."},"en":{"q":"Because SageMaker Role Manager is no longer available to new customers, a company wants to apply least privilege to the roles used by its SageMaker AI training jobs and endpoints. Which practices should it adopt? (Select TWO.)","o":["Attach the AdministratorAccess policy to execution roles to avoid access errors","Keep generating the roles with SageMaker Role Manager","Share a single IAM user and its access keys among all data scientists","Create separate IAM execution roles per use case, limited to the required buckets and KMS keys","Generate policies from CloudTrail activity with IAM Access Analyzer and remove unused permissions"],"e":"**Least privilege** is applied with **dedicated IAM execution roles** whose policies are limited to the required resources (S3 prefixes, KMS keys), then refined based on actual activity with **IAM Access Analyzer**.\n- AdministratorAccess violates least privilege.\n- Role Manager is closed to new customers.\n- Shared credentials prevent any individual traceability."}},{"n":39,"d":3,"a":["A"],"fr":{"q":"Pendant le fine-tuning d\u0027un modèle dans Amazon Bedrock avec un jeu de validation, l\u0027équipe constate que la perte d\u0027entraînement continue de baisser alors que la perte de validation remonte à partir de la troisième époque. Que doit-elle faire ?","o":["Réduire le nombre d\u0027époques (ou le taux d\u0027apprentissage) et relancer en suivant la perte de validation","Augmenter le nombre d\u0027époques, car le modèle est en sous-apprentissage","Augmenter la température lors de l\u0027inférence pour compenser l\u0027écart","Activer une surveillance de la dérive des données sur l\u0027endpoint de production"],"e":"Une perte de validation qui remonte pendant que la perte d\u0027entraînement baisse est le signe d\u0027un **sur-apprentissage** : le modèle mémorise les exemples. Il faut ajuster les **hyperparamètres** de personnalisation (moins d\u0027**époques**, taux d\u0027apprentissage plus faible) ou enrichir les données.\n- Le sous-apprentissage se traduirait par des pertes élevées sur les deux jeux.\n- La température agit à l\u0027inférence et ne corrige pas l\u0027entraînement.\n- La dérive des données concerne la production, pas le fine-tuning."},"en":{"q":"While fine-tuning a model in Amazon Bedrock with a validation dataset, the team sees the training loss keep decreasing while the validation loss rises from the third epoch onward. What should it do?","o":["Reduce the number of epochs (or the learning rate) and rerun while tracking validation loss","Increase the number of epochs, because the model is underfitting","Raise the temperature at inference time to compensate for the gap","Enable data drift monitoring on the production endpoint"],"e":"A validation loss that rises while the training loss falls is a sign of **overfitting**: the model is memorizing the examples. The customization **hyperparameters** should be adjusted (fewer **epochs**, lower learning rate) or the data enriched.\n- Underfitting would show high loss on both sets.\n- Temperature acts at inference and does not fix training.\n- Data drift concerns production, not fine-tuning."}},{"n":40,"d":2,"a":["C"],"fr":{"q":"Quel type de modèle génératif crée une image en partant d\u0027un bruit aléatoire qu\u0027il élimine progressivement, étape par étape, en suivant la description textuelle fournie ?","o":["Un réseau antagoniste génératif (GAN)","Un Transformer de type encodeur uniquement","Un modèle de diffusion","Un algorithme de clustering K-means"],"e":"Les **modèles de diffusion** apprennent à inverser un processus d\u0027ajout de bruit : à l\u0027inférence, ils **débruitent progressivement** un bruit aléatoire, guidés par le prompt, jusqu\u0027à obtenir une image (par ex. modèles Stability AI ou Amazon Nova Canvas).\n- Un GAN génère en une passe grâce à la compétition générateur/discriminateur.\n- Un encodeur seul produit des représentations, pas des images.\n- K-means est un algorithme de clustering non supervisé."},"en":{"q":"Which type of generative model creates an image by starting from random noise and progressively removing it, step by step, guided by the provided text description?","o":["A generative adversarial network (GAN)","An encoder-only Transformer","A diffusion model","A K-means clustering algorithm"],"e":"**Diffusion models** learn to reverse a noise-adding process: at inference time, they **progressively denoise** random noise, guided by the prompt, until an image emerges (for example, Stability AI models or Amazon Nova Canvas).\n- A GAN generates in a single pass through generator/discriminator competition.\n- An encoder alone produces representations, not images.\n- K-means is an unsupervised clustering algorithm."}},{"n":41,"d":4,"a":["D"],"fr":{"q":"Une banque veut faire évaluer par ses propres conseillers le ton, l\u0027empathie et la conformité des réponses de deux modèles candidats pour son assistant client, des critères subjectifs que les métriques automatiques captent mal. Quelle solution recommandée utiliser ?","o":["Amazon Augmented AI (A2I) avec un flux de revue humaine","SageMaker Ground Truth avec une main-d\u0027œuvre privée","Un calcul automatique du score BLEU sur les deux modèles","Un job d\u0027évaluation humaine Amazon Bedrock avec sa propre équipe d\u0027évaluateurs"],"e":"Les **jobs d\u0027évaluation humaine d\u0027Amazon Bedrock** permettent à une équipe interne de noter ou de comparer les réponses de modèles selon des critères personnalisés (ton, empathie, conformité) : une forme d\u0027**humain dans la boucle** adaptée aux critères subjectifs.\n- Amazon A2I et SageMaker Ground Truth sont fermés aux nouveaux clients, leur remplaçant recommandé étant justement ces jobs.\n- BLEU ne mesure ni le ton ni l\u0027empathie."},"en":{"q":"A bank wants its own advisors to evaluate the tone, empathy, and compliance of responses from two candidate models for its customer assistant, subjective criteria that automatic metrics capture poorly. Which recommended solution should it use?","o":["Amazon Augmented AI (A2I) with a human review workflow","SageMaker Ground Truth with a private workforce","An automatic BLEU score computation on both models","An Amazon Bedrock human evaluation job with its own team of evaluators"],"e":"**Amazon Bedrock human evaluation jobs** let an internal team rate or compare model responses against custom criteria (tone, empathy, compliance): a form of **human-in-the-loop** suited to subjective criteria.\n- Amazon A2I and SageMaker Ground Truth are closed to new customers; these jobs are their recommended replacement.\n- BLEU measures neither tone nor empathy."}},{"n":42,"d":1,"a":["A"],"fr":{"q":"Un modèle de dépistage d\u0027une maladie rare est testé sur 5 000 patients, dont 100 sont réellement malades. Le modèle prédit « non malade » pour tous les patients. Quelles sont son accuracy et son rappel ?","o":["Accuracy de 98 % et rappel de 0 % : l\u0027accuracy est trompeuse sur des classes déséquilibrées","Accuracy de 2 % et rappel de 100 % : le modèle ne manque aucun malade","Accuracy de 98 % et rappel de 98 % : le modèle est fiable","Accuracy de 50 % et rappel de 50 % : le modèle équivaut au hasard"],"e":"Accuracy = 4 900 prédictions correctes / 5 000 = **98 %**, mais **rappel** = VP / (VP + FN) = 0 / 100 = **0 %** : aucun malade n\u0027est détecté. C\u0027est le **paradoxe de l\u0027accuracy** sur des classes déséquilibrées, où il faut privilégier rappel, F1 ou AUC.\n- Les autres combinaisons ne correspondent pas à la matrice de confusion : 0 vrai positif, 0 faux positif, 100 faux négatifs, 4 900 vrais négatifs."},"en":{"q":"A screening model for a rare disease is tested on 5,000 patients, 100 of whom are actually sick. The model predicts ‘not sick’ for every patient. What are its accuracy and recall?","o":["98% accuracy and 0% recall: accuracy is misleading on imbalanced classes","2% accuracy and 100% recall: the model misses no sick patient","98% accuracy and 98% recall: the model is reliable","50% accuracy and 50% recall: the model is no better than chance"],"e":"Accuracy = 4,900 correct predictions / 5,000 = **98%**, but **recall** = TP / (TP + FN) = 0 / 100 = **0%**: no sick patient is detected. This is the **accuracy paradox** on imbalanced classes, where recall, F1, or AUC should be preferred.\n- The other combinations do not match the confusion matrix: 0 true positives, 0 false positives, 100 false negatives, 4,900 true negatives."}},{"n":43,"d":3,"a":["B"],"fr":{"q":"Une équipe a déployé un agent construit avec Strands Agents sur Amazon Bedrock AgentCore Runtime. Pour évaluer et déboguer l\u0027agent, elle veut visualiser la trace de chaque étape : appels d\u0027outils, latence et consommation de tokens. Quelle fonctionnalité utiliser ?","o":["Amazon Inspector","Amazon Bedrock AgentCore Observability","AWS Artifact","Les traces de Bedrock Agents (classic)"],"e":"**AgentCore Observability** fournit des traces, des métriques et des tableaux de bord (via Amazon CloudWatch, compatibles OpenTelemetry) sur chaque étape d\u0027un agent : raisonnement, appels d\u0027outils, latence, tokens. C\u0027est la base de l\u0027évaluation et du débogage d\u0027un agent en production.\n- Inspector analyse les vulnérabilités logicielles.\n- Artifact fournit des rapports de conformité.\n- Bedrock Agents classic est fermé aux nouveaux clients."},"en":{"q":"A team has deployed an agent built with Strands Agents on Amazon Bedrock AgentCore Runtime. To evaluate and debug the agent, it wants to view a trace of every step: tool calls, latency, and token usage. Which capability should it use?","o":["Amazon Inspector","Amazon Bedrock AgentCore Observability","AWS Artifact","Bedrock Agents (classic) traces"],"e":"**AgentCore Observability** provides traces, metrics, and dashboards (through Amazon CloudWatch, OpenTelemetry-compatible) for every step of an agent: reasoning, tool calls, latency, tokens. It is the basis for evaluating and debugging an agent in production.\n- Inspector scans for software vulnerabilities.\n- Artifact provides compliance reports.\n- Bedrock Agents classic is closed to new customers."}},{"n":44,"d":2,"a":["A","B"],"fr":{"q":"Quelles caractéristiques des grands modèles de langage imposent une évaluation et une supervision spécifiques avant et après la mise en production ? (Sélectionnez DEUX réponses.)","o":["Le non-déterminisme : une même entrée peut produire des sorties différentes","Les hallucinations : des réponses plausibles mais factuellement fausses","L\u0027incapacité totale à traiter des textes dans d\u0027autres langues que l\u0027anglais","L\u0027obligation d\u0027étiqueter à la main toutes les données de pré-entraînement","L\u0027impossibilité de les appeler par une API depuis une application"],"e":"Le **non-déterminisme** et les **hallucinations** sont deux limites majeures de l\u0027IA générative : elles exigent des jeux d\u0027évaluation répétés, des contrôles d\u0027ancrage et une surveillance continue de la qualité.\n- De nombreux LLM sont multilingues.\n- Le pré-entraînement est auto-supervisé, sans étiquetage manuel.\n- Les modèles de fondation sont justement consommés par API (par ex. Amazon Bedrock)."},"en":{"q":"Which characteristics of large language models require specific evaluation and oversight before and after going to production? (Select TWO.)","o":["Non-determinism: the same input can produce different outputs","Hallucinations: plausible but factually incorrect answers","A complete inability to process text in languages other than English","The need to hand-label all pre-training data","The impossibility of calling them through an API from an application"],"e":"**Non-determinism** and **hallucinations** are two major limitations of generative AI: they call for repeated evaluation runs, grounding checks, and continuous quality monitoring.\n- Many LLMs are multilingual.\n- Pre-training is self-supervised, with no manual labeling.\n- Foundation models are precisely consumed through APIs (for example, Amazon Bedrock)."}},{"n":45,"d":5,"a":["D"],"fr":{"q":"Une entreprise doit démontrer en continu que toutes les configurations d\u0027endpoints SageMaker AI de ses comptes utilisent une clé AWS KMS pour chiffrer les données, et être alertée en cas d\u0027écart. Quel service utiliser ?","o":["AWS CloudTrail","AWS Trusted Advisor","Amazon Inspector","AWS Config"],"e":"**AWS Config** évalue en continu la configuration des ressources par rapport à des **règles**, dont une règle gérée vérifiant qu\u0027une **clé KMS** est configurée pour les configurations d\u0027endpoints SageMaker AI ; les ressources non conformes sont signalées.\n- CloudTrail enregistre les appels d\u0027API, sans évaluer la conformité d\u0027une configuration.\n- Trusted Advisor donne des recommandations générales.\n- Inspector recherche des vulnérabilités logicielles."},"en":{"q":"A company must continuously demonstrate that all SageMaker AI endpoint configurations in its accounts use an AWS KMS key to encrypt data, and be alerted to any deviation. Which service should it use?","o":["AWS CloudTrail","AWS Trusted Advisor","Amazon Inspector","AWS Config"],"e":"**AWS Config** continuously evaluates resource configurations against **rules**, including a managed rule that checks a **KMS key** is configured for SageMaker AI endpoint configurations; noncompliant resources are flagged.\n- CloudTrail records API calls without evaluating configuration compliance.\n- Trusted Advisor gives general recommendations.\n- Inspector looks for software vulnerabilities."}},{"n":46,"d":3,"a":["C"],"fr":{"q":"Un fabricant compare deux modèles pour traduire ses fiches techniques du français vers l\u0027anglais. Il dispose de traductions de référence rédigées par des traducteurs professionnels et veut une métrique automatique fondée sur la précision des n-grammes. Laquelle choisir ?","o":["ROUGE","La perplexité","BLEU","La RMSE"],"e":"**BLEU** compare les n-grammes de la traduction générée à ceux d\u0027une ou plusieurs traductions de référence, en se concentrant sur la **précision** (avec une pénalité de brièveté) : c\u0027est la métrique historique de la **traduction automatique**.\n- ROUGE, orienté rappel, est surtout utilisé pour le résumé.\n- La perplexité ne compare pas à une référence.\n- La RMSE est une métrique de régression."},"en":{"q":"A manufacturer compares two models for translating its technical data sheets from French to English. It has reference translations written by professional translators and wants an automatic metric based on n-gram precision. Which one should it choose?","o":["ROUGE","Perplexity","BLEU","RMSE"],"e":"**BLEU** compares the n-grams of the generated translation with those of one or more reference translations, focusing on **precision** (with a brevity penalty): it is the classic metric for **machine translation**.\n- ROUGE, recall-oriented, is mainly used for summarization.\n- Perplexity does not compare against a reference.\n- RMSE is a regression metric."}},{"n":47,"d":1,"a":["B"],"fr":{"q":"Une équipe lance 40 entraînements avec différentes combinaisons d\u0027hyperparamètres et veut enregistrer automatiquement les paramètres, les métriques et les artefacts de chaque run afin de les comparer et de retrouver le meilleur modèle. Quelle solution utiliser ?","o":["SageMaker Model Cards","SageMaker AI avec MLflow managé","SageMaker Feature Store","SageMaker Batch Transform"],"e":"**MLflow managé dans SageMaker AI** offre un serveur de **suivi d\u0027expériences** : chaque run enregistre paramètres, métriques et artefacts, ce qui permet de comparer les essais et d\u0027enregistrer le meilleur modèle (SageMaker Experiments répond au même besoin).\n- Model Cards documentent un modèle pour la gouvernance.\n- Feature Store stocke des features.\n- Batch Transform exécute de l\u0027inférence hors ligne."},"en":{"q":"A team launches 40 training runs with different hyperparameter combinations and wants to automatically record each run’s parameters, metrics, and artifacts so it can compare them and find the best model. Which solution should it use?","o":["SageMaker Model Cards","SageMaker AI with managed MLflow","SageMaker Feature Store","SageMaker Batch Transform"],"e":"**Managed MLflow in SageMaker AI** provides an **experiment tracking** server: each run records parameters, metrics, and artifacts, making it possible to compare attempts and register the best model (SageMaker Experiments addresses the same need).\n- Model Cards document a model for governance.\n- Feature Store stores features.\n- Batch Transform runs offline inference."}},{"n":48,"d":4,"a":["A"],"fr":{"q":"Un organisme public d\u0027attribution d\u0027aides doit pouvoir expliquer chaque décision en termes simples. Un réseau de neurones profond obtient une accuracy de 89 % et un arbre de décision de 87 %. Quel choix est le plus approprié ?","o":["Retenir l\u0027arbre de décision, interprétable, en acceptant une légère perte de performance","Retenir le réseau profond, car toute hausse d\u0027accuracy prime sur l\u0027explicabilité","Combiner plusieurs réseaux profonds pour gagner encore quelques points","Retenir le réseau profond et publier ses poids pour assurer la transparence"],"e":"Il existe un **compromis entre performance et interprétabilité** : un **arbre de décision** expose des règles lisibles, alors qu\u0027un réseau profond est une boîte noire. Quand l\u0027explicabilité est une exigence, un écart de 2 points justifie le modèle interprétable.\n- Un ensemble de réseaux est encore moins interprétable.\n- Publier des millions de poids n\u0027explique aucune décision."},"en":{"q":"A public agency that awards grants must be able to explain every decision in plain terms. A deep neural network reaches 89% accuracy and a decision tree 87%. Which choice is most appropriate?","o":["Keep the interpretable decision tree, accepting a slight loss in performance","Keep the deep network, because any accuracy gain outweighs explainability","Combine several deep networks to gain a few more points","Keep the deep network and publish its weights to ensure transparency"],"e":"There is a **trade-off between performance and interpretability**: a **decision tree** exposes readable rules, whereas a deep network is a black box. When explainability is a requirement, a 2-point gap justifies the interpretable model.\n- An ensemble of networks is even less interpretable.\n- Publishing millions of weights explains no decision."}},{"n":49,"d":2,"a":["C"],"fr":{"q":"Dans une architecture RAG, pourquoi convertit-on les fragments (chunks) de documents en embeddings avant de les stocker dans une base vectorielle ?","o":["Pour compresser les documents et réduire le coût de stockage dans S3","Pour chiffrer les documents avant leur indexation","Pour représenter leur sens sous forme de vecteurs et retrouver les passages proches de la question","Pour réentraîner le modèle de fondation sur ces documents"],"e":"Un **embedding** est un vecteur numérique qui capture le **sens** d\u0027un texte ; en comparant le vecteur de la question à ceux des chunks (par ex. avec la **similarité cosinus**), la base vectorielle retrouve les passages sémantiquement pertinents, même sans mots communs.\n- Les embeddings ne sont ni un mécanisme de compression de stockage ni un chiffrement (le chiffrement relève de KMS).\n- Le RAG ne réentraîne pas le modèle."},"en":{"q":"In a RAG architecture, why are document chunks converted into embeddings before being stored in a vector database?","o":["To compress the documents and reduce S3 storage costs","To encrypt the documents before indexing them","To represent their meaning as vectors and retrieve passages close to the question","To retrain the foundation model on these documents"],"e":"An **embedding** is a numeric vector that captures the **meaning** of text; by comparing the question’s vector with those of the chunks (for example, with **cosine similarity**), the vector database retrieves semantically relevant passages, even without shared words.\n- Embeddings are neither a storage compression mechanism nor encryption (encryption is handled by KMS).\n- RAG does not retrain the model."}},{"n":50,"d":3,"a":["C","E"],"fr":{"q":"Un assureur veut que son assistant réponde avec les barèmes de garanties mis à jour chaque jour, cite ses sources et évite les réponses non étayées, sans réentraîner de modèle et avec le MOINS d\u0027effort opérationnel. Quelles actions combiner ? (Sélectionnez DEUX réponses.)","o":["Fine-tuner le modèle chaque jour avec les nouveaux barèmes","Effectuer un continued pre-training hebdomadaire sur les documents","Utiliser Amazon Bedrock Knowledge Bases avec une synchronisation quotidienne de la source S3","Augmenter la température pour obtenir des réponses plus complètes","Activer dans Guardrails un contrôle d\u0027ancrage contextuel pour filtrer les réponses non étayées"],"e":"**Bedrock Knowledge Bases** fournit un RAG managé : une **synchronisation** régulière de la source S3 met à jour l\u0027index, et l\u0027API RetrieveAndGenerate renvoie des **citations**. Le **contrôle d\u0027ancrage contextuel** de Guardrails bloque les réponses non fondées sur les sources.\n- Fine-tuning quotidien et continued pre-training sont coûteux et inadaptés à des données qui changent chaque jour.\n- Une température élevée augmente le risque d\u0027hallucination."},"en":{"q":"An insurer wants its assistant to answer using coverage rate tables updated daily, cite its sources, and avoid unsupported answers, without retraining any model and with the LEAST operational overhead. Which actions should it combine? (Select TWO.)","o":["Fine-tune the model every day with the new rate tables","Run weekly continued pre-training on the documents","Use Amazon Bedrock Knowledge Bases with a daily sync of the S3 data source","Raise the temperature to get more complete answers","Enable a contextual grounding check in Guardrails to filter unsupported answers"],"e":"**Bedrock Knowledge Bases** provides managed RAG: a regular **sync** of the S3 source updates the index, and the RetrieveAndGenerate API returns **citations**. The Guardrails **contextual grounding check** blocks answers not grounded in the sources.\n- Daily fine-tuning and continued pre-training are expensive and ill-suited to data that changes every day.\n- A high temperature increases the risk of hallucination."}},{"n":51,"d":5,"a":["D"],"fr":{"q":"La responsable de la gouvernance IA d\u0027une entreprise veut une vue unique de tous les modèles SageMaker AI du compte : endpoints associés, jobs, Model Cards et indicateurs de suivi, afin de repérer rapidement les modèles non documentés. Quelle fonctionnalité répond à ce besoin ?","o":["AWS Artifact","SageMaker Experiments","AWS Trusted Advisor","SageMaker Model Dashboard"],"e":"**SageMaker Model Dashboard** offre une **vue centralisée** des modèles du compte, avec leurs endpoints, jobs, Model Cards et informations de suivi, ce qui aide à la gouvernance et à l\u0027audit.\n- Artifact fournit les rapports de conformité d\u0027AWS.\n- Experiments compare des runs d\u0027entraînement.\n- Trusted Advisor donne des recommandations sur le compte, sans inventaire des modèles."},"en":{"q":"A company’s AI governance lead wants a single view of all SageMaker AI models in the account: associated endpoints, jobs, Model Cards, and monitoring indicators, to quickly spot undocumented models. Which feature meets this need?","o":["AWS Artifact","SageMaker Experiments","AWS Trusted Advisor","SageMaker Model Dashboard"],"e":"**SageMaker Model Dashboard** offers a **centralized view** of the account’s models, with their endpoints, jobs, Model Cards, and monitoring information, supporting governance and audit.\n- Artifact provides AWS compliance reports.\n- Experiments compares training runs.\n- Trusted Advisor gives account recommendations, without a model inventory."}},{"n":52,"d":1,"a":["A"],"fr":{"q":"Une équipe découvre les outils de SageMaker AI le long du cycle de vie ML. Quelle association entre étape et outil est correcte ?","o":["Préparation et EDA visuelles → Data Wrangler ; partage des features → Feature Store ; versions et approbation → Model Registry","Préparation et EDA visuelles → Model Registry ; partage des features → Experiments ; versions et approbation → Data Wrangler","Préparation et EDA visuelles → Feature Store ; partage des features → Model Cards ; versions et approbation → Data Wrangler","Préparation et EDA visuelles → JumpStart ; partage des features → Model Registry ; versions et approbation → Feature Store"],"e":"- **Data Wrangler** : import, exploration (EDA), rapports de qualité et transformations visuelles des données.\n- **Feature Store** : stockage et partage des features pour l\u0027entraînement (offline) et l\u0027inférence (online).\n- **Model Registry** : catalogue des versions de modèles et statut d\u0027approbation avant déploiement.\nLes autres associations mélangent les rôles : JumpStart est un catalogue de modèles, Experiments suit les runs, Model Cards documentent les modèles."},"en":{"q":"A team is learning the SageMaker AI tools along the ML lifecycle. Which mapping between lifecycle step and tool is correct?","o":["Visual data prep and EDA → Data Wrangler; feature sharing → Feature Store; versions and approval → Model Registry","Visual data prep and EDA → Model Registry; feature sharing → Experiments; versions and approval → Data Wrangler","Visual data prep and EDA → Feature Store; feature sharing → Model Cards; versions and approval → Data Wrangler","Visual data prep and EDA → JumpStart; feature sharing → Model Registry; versions and approval → Feature Store"],"e":"- **Data Wrangler**: data import, exploration (EDA), quality reports, and visual transformations.\n- **Feature Store**: storing and sharing features for training (offline) and inference (online).\n- **Model Registry**: catalog of model versions and approval status before deployment.\nThe other mappings mix up roles: JumpStart is a model catalog, Experiments tracks runs, and Model Cards document models."}},{"n":53,"d":2,"a":["B"],"fr":{"q":"Une plateforme de traduction en ligne envoie un volume élevé et constant de requêtes à un modèle d\u0027Amazon Bedrock, 24 h/24, et a besoin d\u0027une latence prévisible garantie par contrat de capacité. Quelle option de tarification convient ?","o":["L\u0027inférence à la demande, facturée au token","Le Provisioned Throughput, avec achat de model units","L\u0027inférence par lots (batch inference)","Un endpoint SageMaker Serverless Inference"],"e":"Le **Provisioned Throughput** réserve une capacité dédiée (**model units**) avec un engagement : il garantit un débit et une **latence prévisible** pour un trafic soutenu, et peut devenir plus économique que la facturation au token à fort volume constant.\n- L\u0027inférence à la demande est soumise aux quotas partagés.\n- L\u0027inférence par lots est asynchrone, inadaptée au temps réel.\n- Serverless Inference est un mode d\u0027hébergement SageMaker AI, pas une option de tarification Bedrock."},"en":{"q":"An online translation platform sends a high, steady volume of requests to an Amazon Bedrock model 24/7 and needs predictable latency backed by a capacity commitment. Which pricing option fits?","o":["On-demand inference, billed per token","Provisioned Throughput, purchasing model units","Batch inference","A SageMaker Serverless Inference endpoint"],"e":"**Provisioned Throughput** reserves dedicated capacity (**model units**) with a commitment: it guarantees throughput and **predictable latency** for sustained traffic, and can become cheaper than per-token billing at a high, steady volume.\n- On-demand inference is subject to shared quotas.\n- Batch inference is asynchronous and unsuited to real time.\n- Serverless Inference is a SageMaker AI hosting mode, not a Bedrock pricing option."}},{"n":54,"d":3,"a":["D"],"fr":{"q":"Un modèle de fondation affiné avec SageMaker JumpStart est hébergé sur un endpoint temps réel SageMaker AI qui doit fonctionner 24 h/24 avec un trafic stable pendant au moins trois ans. Quelle option réduit le plus le coût d\u0027hébergement ?","o":["Exécuter l\u0027endpoint sur des instances Spot gérées","Conserver la tarification on-demand standard","Passer à SageMaker Serverless Inference avec mise à l\u0027échelle à zéro","Souscrire un SageMaker AI Savings Plan sur trois ans"],"e":"Les **SageMaker AI Savings Plans** offrent jusqu\u0027à **64 %** de réduction en échange d\u0027un engagement d\u0027usage (en $/heure) sur 1 ou 3 ans : idéal pour une charge **stable et continue**.\n- Le Spot géré concerne l\u0027entraînement, pas les endpoints temps réel.\n- L\u0027on-demand est le tarif le plus élevé pour un usage permanent.\n- La mise à l\u0027échelle à zéro n\u0027apporte rien à un trafic constant, et Serverless Inference ne propose pas de GPU pour un grand modèle."},"en":{"q":"A foundation model fine-tuned with SageMaker JumpStart is hosted on a SageMaker AI real-time endpoint that must run 24/7 with steady traffic for at least three years. Which option reduces hosting cost the most?","o":["Run the endpoint on managed Spot instances","Keep standard on-demand pricing","Switch to SageMaker Serverless Inference with scale to zero","Purchase a three-year SageMaker AI Savings Plan"],"e":"**SageMaker AI Savings Plans** offer up to **64%** savings in exchange for a usage commitment (in $/hour) over 1 or 3 years: ideal for a **steady, continuous** workload.\n- Managed Spot applies to training, not real-time endpoints.\n- On-demand is the highest rate for permanent usage.\n- Scaling to zero brings nothing for constant traffic, and Serverless Inference offers no GPUs for a large model."}},{"n":55,"d":4,"a":["A","D"],"fr":{"q":"Avant d\u0027ouvrir au grand public un chatbot basé sur un modèle d\u0027Amazon Bedrock, quelles évaluations relèvent d\u0027une démarche d\u0027IA responsable ? (Sélectionnez DEUX réponses.)","o":["Mesurer la toxicité et la robustesse des réponses avec un job d\u0027évaluation automatique Bedrock","Mesurer uniquement la latence moyenne, seul critère visible par les utilisateurs","Maximiser le score BLEU, qui garantit l\u0027absence de contenu nuisible","Tester les Guardrails (filtres de contenu, attaques de prompt) avec un jeu de prompts adverses","Désactiver les Guardrails pendant les premières semaines pour mesurer le comportement brut"],"e":"Une démarche responsable évalue la **sûreté** du modèle : **toxicité** et **robustesse** mesurées par les évaluations automatiques Bedrock, et **red teaming** avec des prompts adverses pour vérifier que les **Guardrails** bloquent contenus nuisibles et attaques de prompt.\n- La latence est une métrique opérationnelle.\n- BLEU mesure un recouvrement avec une référence, pas la nocivité.\n- Désactiver les protections en production expose les utilisateurs."},"en":{"q":"Before opening a chatbot built on an Amazon Bedrock model to the general public, which evaluations are part of a responsible AI approach? (Select TWO.)","o":["Measure the toxicity and robustness of responses with a Bedrock automatic evaluation job","Measure only average latency, the only criterion visible to users","Maximize the BLEU score, which guarantees no harmful content","Test Guardrails (content filters, prompt attacks) with a set of adversarial prompts","Disable Guardrails for the first few weeks to measure raw behavior"],"e":"A responsible approach evaluates the model’s **safety**: **toxicity** and **robustness** measured by Bedrock automatic evaluations, and **red teaming** with adversarial prompts to verify that **Guardrails** block harmful content and prompt attacks.\n- Latency is an operational metric.\n- BLEU measures overlap with a reference, not harmfulness.\n- Disabling protections in production exposes users."}},{"n":56,"d":3,"a":["B"],"fr":{"q":"Une équipe évalue les réponses d\u0027un assistant de support à partir de réponses de référence. Les reformulations sont acceptables, mais les scores fondés sur les n-grammes pénalisent les synonymes et paraphrases corrects. Quelle métrique est plus adaptée ?","o":["La correspondance exacte (exact match)","BERTScore","BLEU","La perplexité"],"e":"**BERTScore** compare les **embeddings contextuels** des tokens générés et de référence : il mesure la **similarité sémantique** et valorise les paraphrases correctes.\n- Exact match et BLEU exigent un recouvrement lexical et pénalisent les synonymes.\n- La perplexité ne compare pas la réponse à une référence."},"en":{"q":"A team evaluates a support assistant’s answers against reference answers. Rephrasing is acceptable, but n-gram-based scores penalize correct synonyms and paraphrases. Which metric is better suited?","o":["Exact match","BERTScore","BLEU","Perplexity"],"e":"**BERTScore** compares the **contextual embeddings** of generated and reference tokens: it measures **semantic similarity** and rewards correct paraphrases.\n- Exact match and BLEU require lexical overlap and penalize synonyms.\n- Perplexity does not compare the answer with a reference."}},{"n":57,"d":2,"a":["C"],"fr":{"q":"Un assureur veut qu\u0027un modèle reçoive la photo d\u0027un véhicule accidenté accompagnée d\u0027une question textuelle (« Quelles pièces semblent endommagées ? ») et réponde en texte. Quel type de modèle faut-il ?","o":["Un modèle d\u0027embeddings texte comme Titan Text Embeddings","Un modèle de diffusion comme Amazon Nova Canvas","Un modèle multimodal acceptant image et texte, comme Amazon Nova Lite","Un modèle texte seul optimisé pour la vitesse comme Amazon Nova Micro"],"e":"Un **modèle multimodal** comme **Amazon Nova Lite** (ou Nova Pro) accepte en entrée du texte, des images et des vidéos et génère du texte : il peut analyser la photo en réponse à la question.\n- Un modèle d\u0027embeddings produit des vecteurs, pas des réponses.\n- Nova Canvas génère des images.\n- Nova Micro n\u0027accepte que du texte."},"en":{"q":"An insurer wants a model to receive a photo of a damaged vehicle along with a text question (‘Which parts appear damaged?’) and answer in text. What type of model is needed?","o":["A text embeddings model such as Titan Text Embeddings","A diffusion model such as Amazon Nova Canvas","A multimodal model accepting image and text, such as Amazon Nova Lite","A text-only model optimized for speed, such as Amazon Nova Micro"],"e":"A **multimodal model** such as **Amazon Nova Lite** (or Nova Pro) accepts text, image, and video input and generates text: it can analyze the photo to answer the question.\n- An embeddings model produces vectors, not answers.\n- Nova Canvas generates images.\n- Nova Micro accepts text only."}},{"n":58,"d":5,"a":["A"],"fr":{"q":"Avant de lancer un fine-tuning, une banque doit vérifier qu\u0027aucun des jeux de données stockés dans ses 300 buckets S3 ne contient de numéros de carte bancaire ou d\u0027autres données personnelles. Quel service automatise cette découverte ?","o":["Amazon Macie","Amazon Inspector","AWS Artifact","AWS Trusted Advisor"],"e":"**Amazon Macie** utilise le ML et la recherche de motifs pour **découvrir les données sensibles** (PII, numéros de carte bancaire…) dans Amazon S3, à grande échelle, avant qu\u0027elles n\u0027alimentent un entraînement.\n- Inspector analyse les vulnérabilités logicielles.\n- Artifact fournit des rapports de conformité.\n- Trusted Advisor fournit des recommandations de bonnes pratiques sur le compte."},"en":{"q":"Before starting a fine-tuning job, a bank must verify that none of the datasets stored in its 300 S3 buckets contain credit card numbers or other personal data. Which service automates this discovery?","o":["Amazon Macie","Amazon Inspector","AWS Artifact","AWS Trusted Advisor"],"e":"**Amazon Macie** uses ML and pattern matching to **discover sensitive data** (PII, credit card numbers, and so on) in Amazon S3 at scale, before it feeds a training job.\n- Inspector scans for software vulnerabilities.\n- Artifact provides compliance reports.\n- Trusted Advisor provides account best-practice recommendations."}},{"n":59,"d":1,"a":["D"],"fr":{"q":"Une équipe MLOps veut automatiser chaque mois la chaîne suivante : traitement des nouvelles données, réentraînement, évaluation, puis enregistrement du modèle dans le registre uniquement si son score F1 dépasse 0,85. Quelle solution utiliser ?","o":["Un notebook Jupyter exécuté manuellement par un data scientist chaque mois","SageMaker Data Wrangler avec un flux de transformation planifié","SageMaker Model Cards avec un champ de seuil de performance","SageMaker Pipelines avec une étape conditionnelle et un enregistrement dans Model Registry"],"e":"**SageMaker Pipelines** orchestre des workflows ML reproductibles (CI/CD pour le ML) : étapes de traitement, entraînement et évaluation, puis **étape conditionnelle** qui n\u0027enregistre le modèle dans **Model Registry** que si la métrique dépasse le seuil ; le pipeline peut être planifié.\n- Un notebook manuel n\u0027est ni automatisé ni fiable.\n- Data Wrangler prépare les données sans orchestrer tout le cycle.\n- Model Cards documentent, elles n\u0027exécutent rien."},"en":{"q":"An MLOps team wants to automate the following chain every month: processing new data, retraining, evaluation, and then registering the model in the registry only if its F1 score exceeds 0.85. Which solution should it use?","o":["A Jupyter notebook run manually by a data scientist every month","SageMaker Data Wrangler with a scheduled transformation flow","SageMaker Model Cards with a performance threshold field","SageMaker Pipelines with a condition step and registration in Model Registry"],"e":"**SageMaker Pipelines** orchestrates reproducible ML workflows (CI/CD for ML): processing, training, and evaluation steps, then a **condition step** that registers the model in **Model Registry** only if the metric exceeds the threshold; the pipeline can be scheduled.\n- A manual notebook is neither automated nor reliable.\n- Data Wrangler prepares data without orchestrating the whole lifecycle.\n- Model Cards document; they execute nothing."}},{"n":60,"d":3,"a":["C"],"fr":{"q":"Une plateforme d\u0027e-learning doit évaluer 20 000 réponses générées par deux modèles selon des critères d\u0027exactitude, de cohérence et d\u0027utilité, sans réponses de référence ni équipe humaine disponible. Quelle approche convient ?","o":["Un job d\u0027évaluation humaine Bedrock confié à 50 évaluateurs internes","Un calcul du score ROUGE de chaque réponse","Un job d\u0027évaluation Amazon Bedrock utilisant un LLM comme juge (LLM-as-a-judge)","Un flux de revue Amazon Augmented AI (A2I)"],"e":"L\u0027approche **LLM-as-a-judge** des évaluations de modèles Amazon Bedrock utilise un modèle évaluateur pour noter à grande échelle des critères qualitatifs (**exactitude, cohérence, utilité**…), avec des explications, sans réponses de référence ni équipe humaine.\n- Une évaluation humaine est exclue par l\u0027énoncé et serait lente sur 20 000 réponses.\n- ROUGE requiert des résumés de référence.\n- A2I est fermé aux nouveaux clients."},"en":{"q":"An e-learning platform must evaluate 20,000 responses generated by two models for correctness, coherence, and helpfulness, with no reference answers and no human team available. Which approach fits?","o":["A Bedrock human evaluation job assigned to 50 internal evaluators","A ROUGE score computed for each response","An Amazon Bedrock evaluation job using an LLM as a judge (LLM-as-a-judge)","An Amazon Augmented AI (A2I) review workflow"],"e":"The **LLM-as-a-judge** approach in Amazon Bedrock model evaluations uses an evaluator model to score qualitative criteria (**correctness, coherence, helpfulness**, and more) at scale, with explanations, without reference answers or a human team.\n- Human evaluation is ruled out by the scenario and would be slow for 20,000 responses.\n- ROUGE requires reference summaries.\n- A2I is closed to new customers."}},{"n":61,"d":4,"a":["A"],"fr":{"q":"Pour la classification de documents, un grand modèle obtient un F1 de 0,91 et un modèle huit fois plus petit un F1 de 0,90. L\u0027exigence métier est un F1 d\u0027au moins 0,88. Quel choix est le plus responsable ?","o":["Retenir le petit modèle, qui atteint le seuil avec moins de coût, de latence et d\u0027énergie","Retenir le grand modèle, car le meilleur score doit toujours l\u0027emporter","Entraîner de zéro un modèle encore plus grand pour viser 0,95","Faire tourner les deux modèles en permanence et comparer leurs sorties"],"e":"Choisir le **plus petit modèle suffisant** est une bonne pratique d\u0027IA responsable : il satisfait l\u0027exigence (0,90 ≥ 0,88) tout en réduisant le **coût**, la **latence** et l\u0027**impact environnemental** lié à la consommation d\u0027énergie.\n- Un gain de 0,01 de F1 ne justifie pas un modèle huit fois plus gros.\n- Un entraînement de zéro ou une double exécution multiplient coûts et énergie sans nécessité."},"en":{"q":"For document classification, a large model achieves an F1 of 0.91 and a model eight times smaller an F1 of 0.90. The business requirement is an F1 of at least 0.88. Which choice is most responsible?","o":["Keep the small model, which meets the threshold with less cost, latency, and energy","Keep the large model, because the best score should always win","Train an even larger model from scratch to aim for 0.95","Run both models permanently and compare their outputs"],"e":"Choosing the **smallest sufficient model** is a responsible AI best practice: it meets the requirement (0.90 ≥ 0.88) while reducing **cost**, **latency**, and the **environmental impact** of energy consumption.\n- A 0.01 F1 gain does not justify a model eight times larger.\n- Training from scratch or running both models multiplies cost and energy unneces
