the purpose of the service."}},{"n":32,"d":3,"a":["B"],"fr":{"q":"Trois départements d\u0027un groupe (marketing, juridique, support) appellent le même modèle à la demande dans Amazon Bedrock depuis un compte partagé. La direction financière veut répartir précisément le coût d\u0027inférence entre eux dans AWS Cost Explorer. Quelle solution répond à ce besoin avec le MOINS d\u0027effort ?","o":["Acheter un Provisioned Throughput distinct pour chaque département, même pour un faible volume","Créer un profil d\u0027inférence d\u0027application par département, avec des balises de répartition des coûts","Créer une base de connaissances par département pour que les coûts soient séparés automatiquement","Exporter chaque nuit les journaux CloudTrail et estimer manuellement les tokens de chaque département"],"e":"Les **profils d\u0027inférence d\u0027application (application inference profiles)** d\u0027Amazon Bedrock encapsulent un modèle et peuvent porter des **balises (tags) de répartition des coûts** : chaque département invoque le modèle via son profil et les coûts apparaissent séparément dans Cost Explorer. Un Provisioned Throughput par département serait coûteux et inutile, une base de connaissances ne sert pas à la refacturation, et CloudTrail n\u0027enregistre pas le nombre de tokens consommés."},"en":{"q":"Three departments of a group (marketing, legal, support) call the same on-demand model in Amazon Bedrock from a shared account. Finance wants to allocate inference costs precisely among them in AWS Cost Explorer. Which solution meets this need with the LEAST effort?","o":["Purchase separate Provisioned Throughput for each department, even for low volume","Create an application inference profile per department, with cost allocation tags","Create one knowledge base per department so that costs are separated automatically","Export CloudTrail logs every night and manually estimate each department\u0027s tokens"],"e":"Amazon Bedrock **application inference profiles** wrap a model and can carry **cost allocation tags**: each department invokes the model through its own profile, and costs appear separately in Cost Explorer. Provisioned Throughput per department would be expensive and unnecessary, a knowledge base is not a chargeback mechanism, and CloudTrail does not record the number of tokens consumed."}},{"n":33,"d":1,"a":["A"],"fr":{"q":"Un opérateur d\u0027assurance veut classer automatiquement les e-mails entrants dans 15 catégories propres à son activité (« résiliation loi Hamon », « bris de glace »…). Il dispose de 12 000 e-mails déjà étiquetés par ses gestionnaires mais d\u0027aucune équipe ML. Quelle solution répond à ce besoin avec le MOINS d\u0027effort ?","o":["Amazon Comprehend avec un classificateur personnalisé entraîné sur les e-mails étiquetés","Amazon Comprehend avec la détection de sentiment préentraînée","Amazon Translate avec une terminologie personnalisée par catégorie","Amazon Lex avec un intent par catégorie d\u0027e-mail"],"e":"La **classification personnalisée (custom classification)** d\u0027**Amazon Comprehend** entraîne, sans expertise ML, un classificateur sur des documents étiquetés avec ses **propres catégories**, puis l\u0027expose en temps réel ou par lots. La détection de sentiment ne connaît que positif, négatif, neutre et mitigé, Translate traduit sans classer, et Lex gère des intentions dans un dialogue conversationnel, pas la classification de documents."},"en":{"q":"An insurer wants to automatically sort incoming emails into 15 business-specific categories (\u0027cancellation under consumer law\u0027, \u0027windshield damage\u0027, and so on). It has 12,000 emails already labeled by its claims handlers but no ML team. Which solution meets this need with the LEAST effort?","o":["Amazon Comprehend with a custom classifier trained on the labeled emails","Amazon Comprehend with pre-trained sentiment detection","Amazon Translate with a custom terminology per category","Amazon Lex with one intent per email category"],"e":"Amazon Comprehend **custom classification** trains, with no ML expertise, a classifier on labeled documents using **your own categories**, then exposes it in real time or in batch. Sentiment detection only knows positive, negative, neutral, and mixed, Translate translates without classifying, and Lex handles intents in a conversational dialog, not document classification."}},{"n":34,"d":2,"a":["D"],"fr":{"q":"Une société doit résumer 1 million de documents avec un modèle d\u0027Amazon Bedrock. Chaque requête comporte 1 000 tokens d\u0027entrée et 200 tokens de sortie. Le tarif à la demande est de 0,0008 $ pour 1 000 tokens d\u0027entrée et de 0,0032 $ pour 1 000 tokens de sortie, et la grille tarifaire indique une remise de 50 % en inférence par lots pour ce modèle. Quel est le coût total en inférence par lots ?","o":["1 440 $","2 880 $","400 $","720 $"],"e":"Par requête : 1 × 0,0008 $ (entrée) + 0,2 × 0,0032 $ (sortie) = 0,0008 $ + 0,00064 $ = 0,00144 $, soit 1 440 $ pour 1 million de requêtes à la demande. Avec la remise de 50 % de l\u0027**inférence par lots**, le coût est de **720 $**. 1 440 $ correspond au tarif à la demande, 400 $ ne compte que les tokens d\u0027entrée remisés, et 2 880 $ double le coût au lieu de le réduire."},"en":{"q":"A company must summarize 1 million documents with an Amazon Bedrock model. Each request has 1,000 input tokens and 200 output tokens. The on-demand price is $0.0008 per 1,000 input tokens and $0.0032 per 1,000 output tokens, and the price list shows a 50% discount for batch inference on this model. What is the total batch inference cost?","o":["$1,440","$2,880","$400","$720"],"e":"Per request: 1 × $0.0008 (input) + 0.2 × $0.0032 (output) = $0.0008 + $0.00064 = $0.00144, or $1,440 for 1 million on-demand requests. With the 50% **batch inference** discount, the cost is **$720**. $1,440 is the on-demand price, $400 counts only the discounted input tokens, and $2,880 doubles the cost instead of reducing it."}},{"n":35,"d":5,"a":["D","E"],"fr":{"q":"Une banque veut utiliser dans Amazon Bedrock un modèle à poids ouverts d\u0027un fournisseur tiers, distribué sous sa propre licence, pour un assistant interne manipulant des données clients. Le comité de gouvernance veut maîtriser les risques liés à la chaîne d\u0027approvisionnement de ce modèle. Quelles pratiques sont les PLUS appropriées ? (Sélectionnez DEUX réponses.)","o":["Considérer qu\u0027un modèle disponible dans un catalogue public est exempt de risques juridiques","Désactiver la journalisation des invocations pour ne pas exposer les données au fournisseur","Donner au modèle un accès Internet afin qu\u0027il se mette à jour automatiquement","Vérifier la licence (EULA), la provenance et la fiche du modèle avant tout usage en production","Évaluer le modèle (exactitude, biais, robustesse, sécurité) sur ses propres jeux de test avant déploiement"],"e":"La gouvernance d\u0027un modèle tiers commence par sa **provenance** et ses **conditions d\u0027utilisation** : licence ou EULA (restrictions d\u0027usage commercial, attribution), documentation du fournisseur, données d\u0027entraînement déclarées. Il faut ensuite l\u0027**évaluer** sur ses propres cas d\u0027usage (qualité, biais, robustesse, comportement face aux attaques) avant la production. Un catalogue public n\u0027exonère d\u0027aucun risque juridique, la journalisation est un outil d\u0027audit du client, et un modèle Bedrock ne se met pas à jour via Internet."},"en":{"q":"A bank wants to use in Amazon Bedrock an open-weight model from a third-party provider, distributed under its own license, for an internal assistant that handles customer data. The governance committee wants to manage the risks related to this model\u0027s supply chain. Which practices are MOST appropriate? (Select TWO.)","o":["Consider that a model available in a public catalog carries no legal risk","Disable invocation logging so as not to expose data to the provider","Give the model internet access so that it updates itself automatically","Check the license (EULA), provenance, and model card before any production use","Evaluate the model (accuracy, bias, robustness, security) on your own test sets before deployment"],"e":"Governing a third-party model starts with its **provenance** and **terms of use**: license or EULA (commercial use restrictions, attribution), provider documentation, declared training data. It must then be **evaluated** on your own use cases (quality, bias, robustness, behavior under attack) before production. A public catalog does not remove legal risk, logging is the customer\u0027s audit tool, and a Bedrock model does not update itself over the internet."}},{"n":36,"d":3,"a":["C"],"fr":{"q":"Pour éviter les hallucinations, une équipe a activé le contrôle d\u0027ancrage contextuel de sa guardrail Amazon Bedrock avec un seuil d\u0027ancrage de 0,99. Les tests montrent désormais que de nombreuses réponses correctes, mais reformulées, sont bloquées. Que doit-elle faire ?","o":["Désactiver le contrôle d\u0027ancrage, car il est incompatible avec la reformulation des réponses","Augmenter la température pour que les réponses ressemblent davantage aux passages sources","Abaisser le seuil à une valeur calibrée sur un jeu de test, en arbitrant entre blocages à tort et réponses non fondées","Remplacer le contrôle d\u0027ancrage par un filtre de mots listant les termes des documents sources"],"e":"Le **contrôle d\u0027ancrage contextuel** attribue à chaque réponse un **score d\u0027ancrage** (et de pertinence) entre 0 et 0,99 ; les réponses sous le **seuil** sont bloquées. Un seuil très élevé bloque aussi des réponses correctes : il faut le **calibrer** sur un jeu de test représentatif pour trouver le bon compromis entre faux blocages et réponses non fondées. Désactiver le contrôle supprime la protection, une température plus élevée accroît le risque d\u0027hallucination, et un filtre de mots ne mesure pas l\u0027ancrage."},"en":{"q":"To avoid hallucinations, a team enabled the contextual grounding check of its Amazon Bedrock guardrail with a grounding threshold of 0.99. Tests now show that many correct but rephrased answers are blocked. What should the team do?","o":["Disable the grounding check, because it is incompatible with rephrased answers","Raise the temperature so that answers look more like the source passages","Lower the threshold to a value calibrated on a test set, balancing wrongful blocks against unsupported answers","Replace the grounding check with a word filter listing the terms in the source documents"],"e":"The **contextual grounding check** assigns each response a **grounding score** (and a relevance score) between 0 and 0.99; responses below the **threshold** are blocked. A very high threshold also blocks correct answers: it must be **calibrated** on a representative test set to find the right trade-off between wrongful blocks and unsupported answers. Disabling the check removes the protection, a higher temperature increases the risk of hallucination, and a word filter does not measure grounding."}},{"n":37,"d":2,"a":["B"],"fr":{"q":"L\u0027assistant d\u0027une banque reçoit un mélange de questions très simples (horaires, plafonds de carte) et de demandes complexes (analyse de situations patrimoniales). Utiliser le plus grand modèle pour tout coûte trop cher, et le plus petit échoue sur les cas complexes. L\u0027équipe veut que chaque requête soit dirigée automatiquement vers le modèle le plus économique capable d\u0027y répondre correctement, au sein d\u0027une même famille de modèles. Quelle fonctionnalité d\u0027Amazon Bedrock répond à ce besoin ?","o":["Le Provisioned Throughput, avec des model units réparties entre les deux modèles","Le routage intelligent des prompts (Intelligent Prompt Routing)","Un profil d\u0027inférence inter-Régions qui choisit la Région la moins chargée","Une base de connaissances qui stocke les réponses aux questions fréquentes"],"e":"L\u0027**Intelligent Prompt Routing** d\u0027Amazon Bedrock expose un point d\u0027invocation unique qui **prédit, pour chaque requête, la qualité de réponse** des modèles d\u0027une même famille et **achemine** la requête vers le modèle le moins coûteux jugé suffisant, ce qui réduit le coût sans sacrifier la qualité sur les cas complexes. Le Provisioned Throughput réserve de la capacité, un profil inter-Régions répartit la charge géographiquement sans choisir de modèle, et une base de connaissances fournit du contexte."},"en":{"q":"A bank\u0027s assistant receives a mix of very simple questions (opening hours, card limits) and complex requests (analysis of wealth situations). Using the largest model for everything is too expensive, and the smallest fails on complex cases. The team wants each request to be automatically sent to the cheapest model able to answer it correctly, within a single model family. Which Amazon Bedrock feature meets this need?","o":["Provisioned Throughput, with model units split between the two models","Intelligent Prompt Routing","A cross-Region inference profile that picks the least loaded Region","A knowledge base that stores answers to frequently asked questions"],"e":"Amazon Bedrock **Intelligent Prompt Routing** exposes a single invocation endpoint that **predicts, for each request, the response quality** of the models in a family and **routes** the request to the least expensive model deemed sufficient, which cuts cost without sacrificing quality on complex cases. Provisioned Throughput reserves capacity, a cross-Region profile spreads load geographically without choosing a model, and a knowledge base provides context."}},{"n":38,"d":4,"a":["D"],"fr":{"q":"Un site d\u0027actualités réentraîne chaque semaine son modèle de recommandation uniquement sur les clics des articles qu\u0027il a lui-même recommandés. Au fil des mois, certaines rubriques ne sont presque plus jamais proposées, donc jamais cliquées, alors que des enquêtes montrent qu\u0027elles intéressent les lecteurs. Quel phénomène est en cause ?","o":["Un biais de mesure, car le compteur de clics du site enregistre mal les visites","Un sur-apprentissage, car le modèle mémorise les articles du jeu de validation","Une hallucination, car le modèle invente des préférences qui n\u0027existent pas","Une boucle de rétroaction qui renforce les biais des recommandations passées"],"e":"Le modèle apprend uniquement à partir des conséquences de ses propres décisions : les rubriques peu recommandées ne génèrent pas de clics, sont jugées peu intéressantes et encore moins recommandées. C\u0027est une **boucle de rétroaction (feedback loop)** qui **amplifie un biais** initial ; on la limite en réservant une part d\u0027exploration, en diversifiant les données d\u0027entraînement et en surveillant la couverture des rubriques. Rien n\u0027indique une erreur de mesure, et ni le sur-apprentissage ni les hallucinations n\u0027expliquent cet effet cumulatif."},"en":{"q":"A news site retrains its recommendation model every week solely on clicks on the articles it has itself recommended. Over the months, some sections are almost never suggested, and therefore never clicked, even though surveys show that readers are interested in them. What phenomenon is at play?","o":["Measurement bias, because the site\u0027s click counter records visits incorrectly","Overfitting, because the model memorizes the articles in the validation set","Hallucination, because the model invents preferences that do not exist","A feedback loop that reinforces the biases of past recommendations"],"e":"The model learns only from the consequences of its own decisions: rarely recommended sections generate no clicks, are deemed uninteresting, and get recommended even less. This is a **feedback loop** that **amplifies an initial bias**; it is mitigated by reserving some exploration, diversifying training data, and monitoring section coverage. Nothing indicates a measurement error, and neither overfitting nor hallucination explains this cumulative effect."}},{"n":39,"d":1,"a":["A"],"fr":{"q":"Une société de livraison prédit la durée de chaque tournée. Les écarts de quelques minutes sont tolérés, mais une erreur de plus d\u0027une heure entraîne des pénalités contractuelles très coûteuses. Quelle métrique d\u0027évaluation reflète le MIEUX cette sensibilité aux grandes erreurs ?","o":["La RMSE (racine de l\u0027erreur quadratique moyenne), qui pénalise davantage les grandes erreurs","La MAE (erreur absolue moyenne), qui pondère toutes les erreurs de façon proportionnelle","Le score F1, qui équilibre la précision et le rappel des prédictions de durée de tournée","L\u0027AUC-ROC, qui mesure la capacité du modèle à séparer les tournées longues et courtes"],"e":"La **RMSE** élève les erreurs au carré avant d\u0027en faire la moyenne : une grosse erreur pèse beaucoup plus que plusieurs petites, ce qui reflète le coût des retards importants. La MAE traite toutes les erreurs proportionnellement et sous-pondère donc les écarts extrêmes. F1 et AUC-ROC sont des métriques de classification, inadaptées à une régression."},"en":{"q":"A delivery company predicts the duration of each route. Errors of a few minutes are tolerated, but an error of more than one hour triggers very costly contractual penalties. Which evaluation metric BEST reflects this sensitivity to large errors?","o":["RMSE (root mean squared error), which penalizes large errors more heavily","MAE (mean absolute error), which weights all errors proportionally","F1 score, which balances the precision and recall of route duration predictions","AUC-ROC, which measures the model\u0027s ability to separate long and short routes"],"e":"**RMSE** squares errors before averaging them: one large error weighs much more than several small ones, which reflects the cost of major delays. MAE treats all errors proportionally and therefore underweights extreme deviations. F1 and AUC-ROC are classification metrics, unsuitable for regression."}},{"n":40,"d":3,"a":["C"],"fr":{"q":"Un agent d\u0027analyse financière, hébergé sur Amazon Bedrock AgentCore Runtime, doit écrire puis exécuter du code Python pour calculer des statistiques sur des fichiers CSV fournis par les utilisateurs. L\u0027équipe sécurité exige que ce code s\u0027exécute dans un environnement isolé, sans accès au reste du système. Quel composant utiliser ?","o":["AgentCore Memory, qui conserve les résultats intermédiaires des calculs entre les sessions","AgentCore Gateway, qui transforme le code Python généré en outils MCP réutilisables","AgentCore Code Interpreter, qui exécute le code de l\u0027agent dans un bac à sable isolé","AgentCore Identity, qui attribue à l\u0027agent les droits nécessaires pour exécuter du code"],"e":"**AgentCore Code Interpreter** fournit un **environnement d\u0027exécution isolé (sandbox)** dans lequel un agent peut exécuter le code qu\u0027il génère (Python, par exemple) pour analyser des données ou faire des calculs, sans risque pour le reste de l\u0027infrastructure. Memory gère le contexte conversationnel, Gateway expose des API existantes comme outils MCP, et Identity gère l\u0027authentification et les accès ; aucun n\u0027exécute de code en bac à sable."},"en":{"q":"A financial analysis agent hosted on Amazon Bedrock AgentCore Runtime must write and then run Python code to compute statistics on CSV files supplied by users. The security team requires this code to run in an isolated environment with no access to the rest of the system. Which component should be used?","o":["AgentCore Memory, which keeps intermediate calculation results across sessions","AgentCore Gateway, which turns generated Python code into reusable MCP tools","AgentCore Code Interpreter, which runs the agent\u0027s code in an isolated sandbox","AgentCore Identity, which grants the agent the rights needed to run code"],"e":"**AgentCore Code Interpreter** provides an **isolated execution environment (sandbox)** in which an agent can run the code it generates (Python, for example) to analyze data or perform calculations, without risk to the rest of the infrastructure. Memory manages conversational context, Gateway exposes existing APIs as MCP tools, and Identity handles authentication and access; none of them runs code in a sandbox."}},{"n":41,"d":2,"a":["B"],"fr":{"q":"Un organisme de formation veut générer automatiquement un résumé écrit de chacune de ses vidéos de démonstration de 10 minutes, en décrivant les gestes montrés à l\u0027écran et pas seulement les paroles prononcées. Quel type de modèle d\u0027Amazon Bedrock convient ?","o":["Amazon Nova Reel, conçu pour générer des vidéos à partir de texte ou d\u0027images","Un modèle multimodal acceptant la vidéo en entrée, comme Amazon Nova Pro","Amazon Nova Micro, le modèle texte seul le plus rapide de la famille","Amazon Titan Text Embeddings V2, appliqué à la transcription de la vidéo"],"e":"Des modèles multimodaux comme **Amazon Nova Lite** et **Nova Pro** acceptent la **vidéo en entrée** et produisent du texte : ils peuvent décrire les actions visibles et rédiger un résumé. **Nova Reel** fait l\u0027inverse, en **générant** des vidéos. Nova Micro ne traite que du texte, et un modèle d\u0027embeddings produit des vecteurs, pas des résumés ; une simple transcription perdrait en outre les gestes montrés à l\u0027écran."},"en":{"q":"A training organization wants to automatically generate a written summary of each of its 10-minute demonstration videos, describing the actions shown on screen and not just the spoken words. Which type of Amazon Bedrock model is suitable?","o":["Amazon Nova Reel, designed to generate videos from text or images","A multimodal model that accepts video input, such as Amazon Nova Pro","Amazon Nova Micro, the fastest text-only model in the family","Amazon Titan Text Embeddings V2, applied to the video transcript"],"e":"Multimodal models such as **Amazon Nova Lite** and **Nova Pro** accept **video input** and produce text: they can describe the visible actions and write a summary. **Nova Reel** does the opposite, **generating** videos. Nova Micro handles text only, and an embeddings model produces vectors, not summaries; a plain transcript would also lose the actions shown on screen."}},{"n":42,"d":5,"a":["A","C"],"fr":{"q":"Une start-up découvre une facture Amazon Bedrock anormalement élevée : des milliers d\u0027appels InvokeModel ont été effectués dans des Régions qu\u0027elle n\u0027utilise jamais. Une clé d\u0027accès IAM à longue durée de vie a été publiée par erreur dans un dépôt de code public. Quelles actions sont les PLUS appropriées ? (Sélectionnez DEUX réponses.)","o":["Désactiver puis supprimer immédiatement la clé compromise et remplacer ces clés par des rôles IAM à identifiants temporaires","Augmenter la température des modèles pour rendre les réponses inutilisables par l\u0027attaquant","Analyser les événements AWS CloudTrail pour identifier les appels non autorisés, leurs Régions et les ressources créées","Télécharger depuis AWS Artifact le rapport SOC 2 pour démontrer que l\u0027incident n\u0027est pas lié au client","Supprimer les journaux CloudTrail afin d\u0027éviter que l\u0027incident soit divulgué lors d\u0027un audit"],"e":"L\u0027utilisation frauduleuse de modèles avec des identifiants volés (parfois appelée LLMjacking) se traite d\u0027abord en **révoquant les identifiants compromis** et en privilégiant des **rôles IAM** aux identifiants temporaires, puis en **enquêtant dans AWS CloudTrail** (appels InvokeModel, Régions, identité utilisée, ressources créées) ; une SCP limitant les Régions autorisées réduit ensuite le risque. La température n\u0027a aucun effet de sécurité, le rapport SOC 2 d\u0027AWS ne couvre pas la gestion des identifiants du client, et supprimer des journaux entrave l\u0027enquête."},"en":{"q":"A startup discovers an abnormally high Amazon Bedrock bill: thousands of InvokeModel calls were made in Regions it never uses. A long-term IAM access key was accidentally published in a public code repository. Which actions are MOST appropriate? (Select TWO.)","o":["Immediately deactivate and then delete the compromised key, and replace such keys with IAM roles using temporary credentials","Raise the models\u0027 temperature to make the responses useless to the attacker","Analyze AWS CloudTrail events to identify the unauthorized calls, their Regions, and the resources created","Download the SOC 2 report from AWS Artifact to show that the incident is not the customer\u0027s responsibility","Delete the CloudTrail logs so that the incident is not disclosed during an audit"],"e":"Fraudulent use of models with stolen credentials (sometimes called LLMjacking) is handled first by **revoking the compromised credentials** and favoring **IAM roles** with temporary credentials, then by **investigating in AWS CloudTrail** (InvokeModel calls, Regions, identity used, resources created); an SCP restricting allowed Regions then reduces the risk. Temperature has no security effect, AWS\u0027s SOC 2 report does not cover the customer\u0027s credential management, and deleting logs hinders the investigation."}},{"n":43,"d":3,"a":["D"],"fr":{"q":"Un agent d\u0027achats doit relever chaque jour les prix de fournisseurs qui ne proposent aucune API : il doit naviguer sur leurs sites web, se connecter, remplir des formulaires de recherche et lire les pages de résultats. L\u0027équipe veut un service managé, sécurisé et isolé plutôt que d\u0027exploiter ses propres navigateurs sans interface. Quelle solution répond à ces exigences ?","o":["Amazon Bedrock Knowledge Bases avec le web crawler, qui remplit les formulaires de connexion","AgentCore Gateway, qui convertit automatiquement n\u0027importe quel site web en API REST","Amazon Bedrock Guardrails, avec un filtre de mots listant les sites web des fournisseurs","AgentCore Browser, qui fournit à l\u0027agent un navigateur cloud managé et isolé"],"e":"**AgentCore Browser** fournit aux agents un **navigateur web managé**, exécuté dans un environnement isolé, pour naviguer, se connecter, remplir des formulaires et lire des pages lorsqu\u0027aucune API n\u0027existe. Le web crawler des Knowledge Bases indexe des pages pour le RAG mais n\u0027interagit pas avec des formulaires, Gateway expose des API et fonctions existantes, et Guardrails filtre des contenus."},"en":{"q":"A purchasing agent must collect prices every day from suppliers that offer no API: it has to browse their websites, sign in, fill in search forms, and read result pages. The team wants a managed, secure, isolated service rather than operating its own headless browsers. Which solution meets these requirements?","o":["Amazon Bedrock Knowledge Bases with the web crawler, which fills in sign-in forms","AgentCore Gateway, which automatically converts any website into a REST API","Amazon Bedrock Guardrails, with a word filter listing the suppliers\u0027 websites","AgentCore Browser, which gives the agent a managed, isolated cloud browser"],"e":"**AgentCore Browser** gives agents a **managed web browser**, running in an isolated environment, to browse, sign in, fill in forms, and read pages when no API exists. The Knowledge Bases web crawler indexes pages for RAG but does not interact with forms, Gateway exposes existing APIs and functions, and Guardrails filters content."}},{"n":44,"d":1,"a":["A"],"fr":{"q":"Une data scientist doit trouver la meilleure combinaison de taux d\u0027apprentissage, de profondeur d\u0027arbre et de nombre d\u0027estimateurs pour un modèle XGBoost entraîné sur SageMaker AI, sans tester manuellement des centaines de combinaisons. Quelle fonctionnalité utiliser ?","o":["SageMaker Automatic Model Tuning, qui optimise les hyperparamètres selon une métrique objectif","SageMaker Feature Store, qui conserve les meilleures valeurs de variables pour chaque entraînement","SageMaker Data Wrangler, qui choisit les hyperparamètres lors de la préparation des données","SageMaker Model Registry, qui sélectionne automatiquement la version de modèle la plus performante"],"e":"**SageMaker Automatic Model Tuning (AMT)** lance plusieurs tâches d\u0027entraînement en explorant l\u0027espace des **hyperparamètres** (recherche bayésienne, aléatoire, Hyperband…) et retient la combinaison qui optimise une **métrique objectif**. Les hyperparamètres sont fixés avant l\u0027entraînement, contrairement aux paramètres (poids) appris. Feature Store gère des variables, Data Wrangler prépare les données et Model Registry versionne les modèles ; aucun ne règle les hyperparamètres."},"en":{"q":"A data scientist must find the best combination of learning rate, tree depth, and number of estimators for an XGBoost model trained on SageMaker AI, without manually testing hundreds of combinations. Which feature should she use?","o":["SageMaker Automatic Model Tuning, which optimizes hyperparameters against an objective metric","SageMaker Feature Store, which keeps the best feature values for each training run","SageMaker Data Wrangler, which chooses hyperparameters while preparing the data","SageMaker Model Registry, which automatically selects the best-performing model version"],"e":"**SageMaker Automatic Model Tuning (AMT)** launches multiple training jobs exploring the **hyperparameter** space (Bayesian, random, Hyperband…) and keeps the combination that optimizes an **objective metric**. Hyperparameters are set before training, unlike the learned parameters (weights). Feature Store manages features, Data Wrangler prepares data, and Model Registry versions models; none of them tunes hyperparameters."}},{"n":45,"d":4,"a":["C"],"fr":{"q":"Une compagnie d\u0027assurance fait valider par des gestionnaires les propositions d\u0027indemnisation préparées par un modèle. Un audit révèle que 99,7 % des propositions sont approuvées en moins de 10 secondes, y compris des propositions manifestement erronées. Quelle mesure traite le MIEUX ce risque ?","o":["Supprimer l\u0027étape de validation humaine, puisqu\u0027elle n\u0027apporte manifestement aucune valeur","Augmenter la taille du modèle pour que les erreurs deviennent suffisamment rares","Afficher les sources et le niveau de confiance, et auditer les validations avec des cas d\u0027erreur connus","Masquer aux gestionnaires le fait que les propositions sont préparées par un modèle"],"e":"Les gestionnaires font preuve d\u0027un **biais d\u0027automatisation** (confiance excessive dans la machine) : la supervision humaine n\u0027est efficace que si elle est réelle. On la renforce en fournissant les **sources et le niveau de confiance** pour faciliter l\u0027examen critique, et en **auditant** les validations, par exemple en insérant des cas tests dont l\u0027erreur est connue. Supprimer la validation ou cacher l\u0027usage de l\u0027IA réduit la responsabilité et la transparence, et aucun modèle n\u0027élimine totalement les erreurs."},"en":{"q":"An insurance company has claims handlers approve compensation proposals prepared by a model. An audit reveals that 99.7% of proposals are approved in under 10 seconds, including clearly wrong ones. Which measure BEST addresses this risk?","o":["Remove the human approval step, since it clearly adds no value","Increase the size of the model so that errors become rare enough","Show sources and confidence levels, and audit approvals with known-error test cases","Hide from the handlers the fact that proposals are prepared by a model"],"e":"The handlers show **automation bias** (overreliance on the machine): human oversight is only effective if it is real. It is strengthened by providing **sources and confidence levels** to support critical review, and by **auditing** approvals, for example by inserting test cases with known errors. Removing approval or hiding the use of AI reduces accountability and transparency, and no model completely eliminates errors."}},{"n":46,"d":2,"a":["B"],"fr":{"q":"Un studio génère avec Amazon Nova Canvas une image de campagne validée par le client. Il veut produire plusieurs variantes en modifiant légèrement le prompt (« ciel orangé » au lieu de « ciel bleu ») tout en conservant au maximum la composition de l\u0027image validée. Quel réglage l\u0027aide le PLUS ?","o":["Augmenter le nombre d\u0027images générées par requête pour multiplier les compositions possibles","Réutiliser la même valeur de graine (seed) que celle de l\u0027image validée","Ajouter « composition différente » dans le prompt négatif de chaque nouvelle requête","Passer au modèle Amazon Nova Reel, qui conserve la composition d\u0027une génération à l\u0027autre"],"e":"Le paramètre **seed (graine)** initialise le bruit aléatoire de départ : avec la **même graine** et des paramètres identiques, le modèle reproduit la même image, et une légère modification du prompt donne une variante proche de la composition initiale. Générer plus d\u0027images augmente la diversité au lieu de la réduire, le prompt négatif sert à exclure des éléments, et Nova Reel génère des vidéos."},"en":{"q":"A studio uses Amazon Nova Canvas to generate a campaign image that the client has approved. It wants to produce several variants by slightly changing the prompt (\u0027orange sky\u0027 instead of \u0027blue sky\u0027) while preserving the approved image\u0027s composition as much as possible. Which setting helps the MOST?","o":["Increase the number of images generated per request to multiply possible compositions","Reuse the same seed value as the approved image","Add \u0027different composition\u0027 to the negative prompt of each new request","Switch to Amazon Nova Reel, which keeps the composition from one generation to the next"],"e":"The **seed** parameter initializes the starting random noise: with the **same seed** and identical parameters, the model reproduces the same image, and a slight prompt change yields a variant close to the original composition. Generating more images increases diversity instead of reducing it, the negative prompt is for excluding elements, and Nova Reel generates videos."}},{"n":47,"d":3,"a":["D"],"fr":{"q":"Un agent d\u0027assistance commerciale doit consulter le CRM SaaS d\u0027une entreprise au nom de chaque commercial, avec les seules permissions de cet utilisateur, via OAuth. L\u0027équipe sécurité interdit de stocker des jetons ou des identifiants dans le code de l\u0027agent. Quel composant répond à ce besoin ?","o":["Amazon Bedrock AgentCore Memory, qui conserve l\u0027historique des conversations de chaque commercial","Un compte de service unique doté d\u0027un accès administrateur au CRM, partagé par tous les agents","Des identifiants OAuth codés en dur dans des variables d\u0027environnement de la fonction de l\u0027agent","Amazon Bedrock AgentCore Identity, qui gère l\u0027identité de l\u0027agent et l\u0027accès OAuth délégué"],"e":"**Amazon Bedrock AgentCore Identity** gère l\u0027identité des agents et l\u0027**accès délégué** à des services tiers (OAuth) au nom de l\u0027utilisateur, en conservant les jetons dans un coffre sécurisé : l\u0027agent n\u0027obtient que les permissions de ce commercial. AgentCore Memory gère le contexte conversationnel, pas l\u0027authentification. Un compte administrateur partagé viole le moindre privilège, et des identifiants en dur exposent des secrets."},"en":{"q":"A sales assistant agent must query a company\u0027s SaaS CRM on behalf of each sales rep, with only that user\u0027s permissions, via OAuth. The security team forbids storing tokens or credentials in the agent\u0027s code. Which component meets this need?","o":["Amazon Bedrock AgentCore Memory, which keeps each sales rep\u0027s conversation history","A single service account with administrator access to the CRM, shared by all agents","OAuth credentials hard-coded in environment variables of the agent\u0027s function","Amazon Bedrock AgentCore Identity, which manages agent identity and delegated OAuth access"],"e":"**Amazon Bedrock AgentCore Identity** manages agent identities and **delegated access** to third-party services (OAuth) on behalf of the user, keeping tokens in a secure vault: the agent receives only that sales rep\u0027s permissions. AgentCore Memory manages conversational context, not authentication. A shared administrator account violates least privilege, and hard-coded credentials expose secrets."}},{"n":48,"d":5,"a":["B","E"],"fr":{"q":"L\u0027assistant RAG d\u0027une banque s\u0027appuie sur une base de connaissances Amazon Bedrock alimentée par des courriers clients stockés dans S3. Un client exerce son droit à l\u0027effacement (RGPD). Quelles affirmations sont exactes pour honorer cette demande et faciliter les suivantes ? (Sélectionnez DEUX réponses.)","o":["Activer un filtre Guardrails sur le nom du client suffit à effacer ses données de l\u0027index vectoriel","Il faut supprimer ses documents de la source S3, puis synchroniser la base pour retirer leurs vecteurs","Amazon Bedrock efface automatiquement ces données des poids des modèles de fondation utilisés","Abaisser la température empêche le modèle de restituer les données personnelles de ce client","Privilégier le RAG au fine-tuning pour les données personnelles facilite leur suppression ultérieure"],"e":"Dans un RAG, les données restent dans des **sources** et un **index** que l\u0027on maîtrise : supprimer les documents dans S3 puis **synchroniser** la base de connaissances retire les fragments correspondants de l\u0027index vectoriel. C\u0027est pourquoi il vaut mieux **éviter d\u0027intégrer des données personnelles dans les poids** par fine-tuning : une donnée apprise ne se retire pas simplement, sauf à réentraîner. Un filtre Guardrails masque des sorties mais n\u0027efface rien, Bedrock n\u0027utilise pas les données clients pour entraîner les modèles de base, et la température n\u0027a aucun rôle de confidentialité."},"en":{"q":"A bank\u0027s RAG assistant relies on an Amazon Bedrock knowledge base fed with customer letters stored in S3. A customer exercises their right to erasure (GDPR). Which statements are correct for honoring this request and making future ones easier? (Select TWO.)","o":["Enabling a Guardrails filter on the customer\u0027s name is enough to erase their data from the vector index","Their documents must be deleted from the S3 source, then the knowledge base synced to remove their vectors","Amazon Bedrock automatically erases this data from the weights of the foundation models used","Lowering the temperature prevents the model from returning this customer\u0027s personal data","Favoring RAG over fine-tuning for personal data makes later deletion easier"],"e":"In RAG, data stays in **sources** and an **index** that you control: deleting the documents in S3 and then **syncing** the knowledge base removes the corresponding chunks from the vector index. This is why it is better to **avoid embedding personal data in model weights** through fine-tuning: learned data cannot simply be removed without retraining. A Guardrails filter masks outputs but erases nothing, Bedrock does not use customer data to train base models, and temperature plays no privacy role."}},{"n":49,"d":1,"a":["A"],"fr":{"q":"Une plateforme de télémédecine veut partager avec son équipe d\u0027analyse des milliers de transcriptions textuelles de consultations stockées dans Amazon S3, après en avoir retiré les noms, numéros de téléphone et adresses, tout en conservant le reste du texte. Quelle solution répond à ce besoin avec le MOINS d\u0027effort ?","o":["Amazon Comprehend, avec une tâche de détection et de caviardage (redaction) des PII","Amazon Macie, qui supprime automatiquement les PII à l\u0027intérieur des fichiers analysés","Amazon Rekognition, avec la détection de texte dans les documents numérisés","Amazon Translate, avec une terminologie personnalisée qui remplace les noms propres"],"e":"**Amazon Comprehend** détecte les **entités PII** (noms, adresses, numéros de téléphone…) dans un texte et peut produire, via une tâche asynchrone sur S3, une **version caviardée** où ces entités sont masquées, le reste du texte étant conservé. **Macie** découvre et signale les données sensibles dans S3 mais ne modifie pas le contenu des fichiers. Rekognition analyse des images et Translate traduit."},"en":{"q":"A telemedicine platform wants to share with its analytics team thousands of text transcripts of consultations stored in Amazon S3, after removing names, phone numbers, and addresses while keeping the rest of the text. Which solution meets this need with the LEAST effort?","o":["Amazon Comprehend, with a PII detection and redaction job","Amazon Macie, which automatically removes PII inside the scanned files","Amazon Rekognition, with text detection in scanned documents","Amazon Translate, with a custom terminology that replaces proper names"],"e":"**Amazon Comprehend** detects **PII entities** (names, addresses, phone numbers, and so on) in text and can produce, through an asynchronous job on S3, a **redacted version** in which these entities are masked while the rest of the text is kept. **Macie** discovers and reports sensitive data in S3 but does not modify file contents. Rekognition analyzes images, and Translate translates."}},{"n":50,"d":2,"a":["C"],"fr":{"q":"Un laboratoire veut un assistant RAG capable de répondre à des questions qui exigent de relier des informations dispersées dans plusieurs documents, comme « Quels essais cliniques portent sur des molécules développées par les partenaires de l\u0027équipe X ? ». Une recherche vectorielle seule retrouve mal ces relations. Quelle option de Bedrock Knowledge Bases est la PLUS adaptée ?","o":["Un magasin vectoriel Amazon OpenSearch Serverless avec des fragments de taille fixe plus grands","Un magasin vectoriel Amazon Aurora PostgreSQL avec un chevauchement de fragments de 50 %","Amazon Neptune Analytics comme magasin, pour un GraphRAG exploitant les relations entre entités","Un stockage Amazon S3 sans index vectoriel, interrogé par recherche de mots-clés exacts"],"e":"Avec **Amazon Neptune Analytics**, Bedrock Knowledge Bases met en œuvre un **GraphRAG** : un graphe des **entités et de leurs relations** extraites des documents est combiné à la recherche vectorielle, ce qui améliore les réponses nécessitant de relier plusieurs sources. Agrandir les fragments ou augmenter le chevauchement ne crée pas de liens entre documents, et une recherche par mots-clés exacts perd la proximité sémantique."},"en":{"q":"A laboratory wants a RAG assistant that can answer questions requiring links between information scattered across several documents, such as \u0027Which clinical trials involve molecules developed by team X\u0027s partners?\u0027. Vector search alone retrieves these relationships poorly. Which Bedrock Knowledge Bases option is MOST appropriate?","o":["An Amazon OpenSearch Serverless vector store with larger fixed-size chunks","An Amazon Aurora PostgreSQL vector store with 50% chunk overlap","Amazon Neptune Analytics as the store, for GraphRAG that exploits relationships between entities","Amazon S3 storage with no vector index, queried by exact keyword search"],"e":"With **Amazon Neptune Analytics**, Bedrock Knowledge Bases implements **GraphRAG**: a graph of the **entities and their relationships** extracted from the documents is combined with vector search, which improves answers that require connecting several sources. Larger chunks or more overlap do not create links between documents, and exact keyword search loses semantic proximity."}},{"n":51,"d":3,"a":["B"],"fr":{"q":"Un e-commerçant veut placer ses photos de produits existantes dans de nouveaux décors (cuisine, terrasse, salon) générés par IA, sans que le produit lui-même soit modifié. Quelle approche avec Amazon Nova Canvas est la PLUS adaptée ?","o":["Générer une image entièrement nouvelle à partir d\u0027une description textuelle détaillée du produit","Utiliser l\u0027édition d\u0027image (outpainting) avec un masque qui protège le produit et régénère le décor","Utiliser Amazon Nova Reel pour produire une vidéo du produit, puis en extraire une image fixe","Calculer l\u0027embedding de la photo avec Titan Multimodal Embeddings pour en déduire un décor"],"e":"**Amazon Nova Canvas** propose des tâches d\u0027**édition d\u0027image** : avec l\u0027**outpainting**, un masque (dessiné ou décrit par un prompt de masque) délimite le produit à conserver, et le modèle régénère uniquement la zone extérieure selon le nouveau prompt ; l\u0027inpainting fait l\u0027inverse. Une génération entièrement nouvelle ne reproduirait pas fidèlement le produit réel, Nova Reel génère des vidéos, et un modèle d\u0027embeddings produit des vecteurs, pas des images."},"en":{"q":"An online retailer wants to place its existing product photos in new AI-generated settings (kitchen, terrace, living room) without the product itself being altered. Which approach with Amazon Nova Canvas is MOST appropriate?","o":["Generate an entirely new image from a detailed text description of the product","Use image editing (outpainting) with a mask that protects the product and regenerates the setting","Use Amazon Nova Reel to produce a video of the product, then extract a still image","Compute the photo\u0027s embedding with Titan Multimodal Embeddings to derive a setting"],"e":"**Amazon Nova Canvas** offers **image editing** tasks: with **outpainting**, a mask (drawn or described by a mask prompt) delimits the product to keep, and the model regenerates only the outer area according to the new prompt; inpainting does the opposite. An entirely new generation would not faithfully reproduce the real product, Nova Reel generates videos, and an embeddings model produces vectors, not images."}},{"n":52,"d":4,"a":["C","D"],"fr":{"q":"Un modèle fine-tuné sur des tickets de support historiques restitue parfois mot pour mot des numéros de téléphone et des adresses de clients réels présents dans ses données d\u0027entraînement. Quelles mesures traitent le PLUS ce risque pour la vie privée ? (Sélectionnez DEUX réponses.)","o":["Augmenter la température afin que les données restituées soient moins exactes","Augmenter le nombre d\u0027époques pour que le modèle généralise mieux les tickets","Supprimer ou pseudonymiser les données personnelles avant un nouveau fine-tuning","Appliquer en sortie un filtre d\u0027informations sensibles Guardrails en mode masquage","Publier le jeu d\u0027entraînement pour que les clients vérifient eux-mêmes leurs données"],"e":"Un modèle peut **mémoriser** des données d\u0027entraînement et les **restituer**. La protection la plus efficace consiste à **retirer ou pseudonymiser les PII en amont** (après les avoir détectées, par exemple avec Amazon Comprehend ou Macie), puis à réentraîner ; un **filtre d\u0027informations sensibles** Guardrails en sortie ajoute une défense en profondeur. Une température plus élevée ne supprime pas la fuite, plus d\u0027époques accentuent la mémorisation, et publier les données aggraverait l\u0027atteinte à la vie privée."},"en":{"q":"A model fine-tuned on historical support tickets sometimes reproduces word for word the phone numbers and addresses of real customers present in its training data. Which measures MOST address this privacy risk? (Select TWO.)","o":["Raise the temperature so that the reproduced data is less accurate","Increase the number of epochs so that the model generalizes the tickets better","Remove or pseudonymize personal data before a new fine-tuning run","Apply a Guardrails sensitive information filter in mask mode on outputs","Publish the training dataset so that customers can check their own data"],"e":"A model can **memorize** training data and **reproduce** it. The most effective protection is to **remove or pseudonymize PII upstream** (after detecting it, for example with Amazon Comprehend or Macie) and then retrain; a Guardrails **sensitive information filter** on outputs adds defense in depth. A higher temperature does not stop the leakage, more epochs increase memorization, and publishing the data would worsen the privacy breach."}},{"n":53,"d":2,"a":["D"],"fr":{"q":"Dans l\u0027assistant RAG d\u0027un distributeur de pièces détachées, les questions en langage courant donnent de bons résultats, mais une requête contenant une référence exacte comme « XR-4471-B » renvoie des pièces sémantiquement proches au lieu de la bonne. Quelle option de recherche de Bedrock Knowledge Bases améliore le PLUS ce cas ?","o":["Augmenter la température du modèle de génération pour élargir le choix des réponses","Remplacer le modèle d\u0027embeddings par un modèle de génération d\u0027images plus récent","Réduire le nombre de résultats récupérés à un seul fragment pour gagner en précision","La recherche hybride, qui combine la recherche sémantique et la recherche par mots-clés"],"e":"La **recherche hybride** combine la **similarité vectorielle** (sens) et la **recherche lexicale par mots-clés**, efficace pour des identifiants exacts comme des références, des codes ou des noms propres ; Bedrock Knowledge Bases la propose avec les magasins compatibles, comme OpenSearch Serverless. La température agit sur la génération, pas sur la récupération, un modèle d\u0027images n\u0027a aucun rôle ici, et réduire le nombre de résultats ne corrige pas un mauvais classement."},"en":{"q":"In an auto parts distributor\u0027s RAG assistant, everyday-language questions give good results, but a query containing an exact part number such as \u0027XR-4471-B\u0027 returns semantically similar parts instead of the right one. Which Bedrock Knowledge Bases search option MOST improves this case?","o":["Raise the generation model\u0027s temperature to widen the range of answers","Replace the embeddings model with a newer image generation model","Reduce the number of retrieved results to a single chunk to gain precision","Hybrid search, which combines semantic search and keyword search"],"e":"**Hybrid search** combines **vector similarity** (meaning) with **lexical keyword search**, which is effective for exact identifiers such as part numbers, codes, or proper names; Bedrock Knowledge Bases offers it with compatible stores such as OpenSearch Serverless. Temperature acts on generation, not retrieval, an image model plays no role here, and reducing the number of results does not fix poor ranking."}},{"n":54,"d":1,"a":["A"],"fr":{"q":"Un modèle de détection de défauts est entraîné sur 100 000 pièces, dont seulement 300 défectueuses. Il prédit presque toujours « conforme » et ne détecte qu\u0027un défaut sur dix. Quelle action sur l\u0027entraînement améliore le PLUS la détection des défauts ?","o":["Rééquilibrer l\u0027entraînement (sur-échantillonner les défauts ou pondérer davantage la classe minoritaire), puis suivre rappel et F1","Supprimer une partie des pièces défectueuses, considérées comme des valeurs aberrantes du jeu de données","Évaluer le modèle uniquement avec l\u0027exactitude (accuracy), déjà supérieure à 99 %","Augmenter le nombre d\u0027époques sans modifier la répartition des classes"],"e":"Avec des **classes très déséquilibrées**, le modèle minimise son erreur en prédisant la classe majoritaire. On compense en **rééquilibrant** l\u0027entraînement : sur-échantillonnage de la classe minoritaire (éventuellement par génération d\u0027exemples synthétiques), sous-échantillonnage de la majoritaire ou **pondération des classes**, puis on suit des métriques adaptées comme le **rappel** et le **F1**. Supprimer des défauts aggrave le déséquilibre, l\u0027exactitude est trompeuse ici, et plus d\u0027époques sur les mêmes données renforcent le biais vers la classe majoritaire."},"en":{"q":"A defect detection model is trained on 100,000 parts, only 300 of which are defective. It almost always predicts \u0027compliant\u0027 and detects only one defect in ten. Which training action MOST improves defect detection?","o":["Rebalance training (oversample defects or give more weight to the minority class), then track recall and F1","Remove some of the defective parts, treating them as outliers in the dataset","Evaluate the model only with accuracy, which is already above 99%","Increase the number of epochs without changing the class distribution"],"e":"With **highly imbalanced classes**, the model minimizes its error by predicting the majority class. This is offset by **rebalancing** training: oversampling the minority class (possibly by generating synthetic examples), undersampling the majority class, or **class weighting**, then tracking suitable metrics such as **recall** and **F1**. Removing defects worsens the imbalance, accuracy is misleading here, and more epochs on the same data reinforce the bias toward the majority class."}},{"n":55,"d":3,"a":["C"],"fr":{"q":"Une équipe doit résumer des rapports d\u0027audit de 600 pages avec un modèle d\u0027Amazon Bedrock dont la fenêtre de contexte ne peut contenir qu\u0027environ 150 pages. Elle veut un résumé global fidèle de chaque rapport sans changer de modèle. Quelle approche convient le MIEUX ?","o":["Ne transmettre que les 150 premières pages, qui contiennent généralement l\u0027essentiel du rapport","Augmenter le paramètre max tokens pour que le modèle accepte l\u0027intégralité du rapport en entrée","Découper le rapport en sections, résumer chacune, puis résumer l\u0027ensemble des résumés obtenus","Fixer la température à 0 pour que le modèle compresse automatiquement le texte reçu en entrée"],"e":"Le **résumé hiérarchique (map-reduce)** découpe le document en sections qui tiennent dans la fenêtre de contexte, produit un résumé par section, puis combine ces résumés en un **résumé global** : c\u0027est une forme de prompt chaining adaptée aux documents longs. Tronquer le rapport perd des informations, max tokens limite la longueur de la sortie et non la taille acceptée en entrée, et la température n\u0027a aucun effet sur la taille du contexte."},"en":{"q":"A team must summarize 600-page audit reports with an Amazon Bedrock model whose context window can hold only about 150 pages. It wants a faithful overall summary of each report without changing models. Which approach is BEST?","o":["Send only the first 150 pages, which usually contain the essence of the report","Increase the max tokens parameter so that the model accepts the entire report as input","Split the report into sections, summarize each one, then summarize all the resulting summaries","Set the temperature to 0 so that the model automatically compresses the input text"],"e":"**Hierarchical (map-reduce) summarization** splits the document into sections that fit in the context window, produces a summary per section, and then combines these summaries into an **overall summary**: a form of prompt chaining suited to long documents. Truncating the report loses information, max tokens limits output length rather than the accepted input size, and temperature has no effect on context size."}},{"n":56,"d":5,"a":["B"],"fr":{"q":"Un organisme public français impose que les prompts et les réponses de son assistant soient traités exclusivement dans la Région eu-west-3 (Paris). L\u0027équipe constate que certains modèles ne sont proposés qu\u0027au travers de profils d\u0027inférence inter-Régions. Quelle approche offre la garantie de résidence la PLUS forte ?","o":["Utiliser un profil d\u0027inférence inter-Régions global pour bénéficier de la meilleure disponibilité","N\u0027invoquer que des modèles proposés en local dans eu-west-3 et bloquer les autres Régions par SCP","Activer la réplication S3 vers us-east-1 pour conserver une copie de secours des journaux d\u0027invocation","S\u0027appuyer sur le fait qu\u0027Amazon Bedrock n\u0027utilise pas les prompts pour entraîner ses modèles de base"],"e":"Pour une exigence stricte de **résidence des données**, l\u0027inférence doit s\u0027exécuter dans la Région autorisée : utiliser des modèles disponibles **en local dans eu-west-3** et appliquer une **SCP** (condition aws:RequestedRegion) qui interdit les autres Régions. Les profils d\u0027inférence inter-Régions peuvent router les requêtes vers d\u0027autres Régions, et la réplication vers us-east-1 sort les données du périmètre. Le fait que Bedrock ne réutilise pas les prompts pour l\u0027entraînement est une garantie de confidentialité, pas de localisation."},"en":{"q":"A French public agency requires that its assistant\u0027s prompts and responses be processed exclusively in the eu-west-3 (Paris) Region. The team notices that some models are offered only through cross-Region inference profiles. Which approach provides the STRONGEST data residency guarantee?","o":["Use a global cross-Region inference profile to get the best availability","Invoke only models offered locally in eu-west-3 and block other Regions with an SCP","Enable S3 replication to us-east-1 to keep a backup copy of the invocation logs","Rely on the fact that Amazon Bedrock does not use prompts to train its base models"],"e":"For a strict **data residency** requirement, inference must run in the authorized Region: use models available **locally in eu-west-3** and apply an **SCP** (aws:RequestedRegion condition) that denies other Regions. Cross-Region inference profiles can route requests to other Regions, and replication to us-east-1 takes data outside the boundary. The fact that Bedrock does not reuse prompts for training is a privacy guarantee, not a location guarantee."}},{"n":57,"d":2,"a":["D"],"fr":{"q":"Une jeune entreprise prototype un assistant sur Amazon Bedrock avec un modèle de base. Le trafic est faible et imprévisible (quelques centaines de requêtes certains jours, aucune d\u0027autres), et aucune latence garantie n\u0027est exigée. Quelle option de tarification est la PLUS rentable ?","o":["Acheter un Provisioned Throughput avec un engagement de six mois pour obtenir un tarif réduit","Héberger le modèle sur un endpoint SageMaker AI temps réel avec une instance GPU permanente","Acheter plusieurs model units de Provisioned Throughput sans engagement pour absorber les pics","Utiliser le mode à la demande (on-demand), facturé uniquement selon les tokens traités"],"e":"Le mode **à la demande** de Bedrock est facturé **au token** d\u0027entrée et de sortie, sans engagement ni coût fixe : idéal pour un trafic faible et irrégulier. Le **Provisioned Throughput** (model units, avec ou sans engagement) est facturé à l\u0027heure, qu\u0027il soit utilisé ou non ; il se justifie pour des volumes élevés et réguliers, une latence prévisible ou un modèle personnalisé. Une instance GPU permanente coûterait également en continu."},"en":{"q":"A startup is prototyping an assistant on Amazon Bedrock with a base model. Traffic is low and unpredictable (a few hundred requests on some days, none on others), and no guaranteed latency is required. Which pricing option is the MOST cost-effective?","o":["Purchase Provisioned Throughput with a six-month commitment to get a discounted rate","Host the model on a real-time SageMaker AI endpoint with a permanent GPU instance","Purchase several no-commitment Provisioned Throughput model units to absorb peaks","Use on-demand mode, billed only on the tokens processed"],"e":"Bedrock **on-demand** mode is billed **per input and output token**, with no commitment or fixed cost: ideal for low, irregular traffic. **Provisioned Throughput** (model units, with or without commitment) is billed hourly whether used or not; it is justified for high, steady volumes, predictable latency, or a custom model. A permanent GPU instance would also cost money continuously."}},{"n":58,"d":3,"a":["A"],"fr":{"q":"Une banque indexe dans une base de connaissances Amazon Bedrock des rapports annuels en PDF riches en tableaux financiers et en graphiques. Avec l\u0027analyse par défaut, les réponses portant sur les chiffres des tableaux sont souvent fausses, car leur structure est perdue lors de l\u0027extraction du texte. Quelle option de configuration de la base améliore le PLUS ce cas ?","o":["Une analyse avancée (advanced parsing) par un modèle de fondation qui extrait tableaux et figures","Un modèle d\u0027embeddings aux vecteurs plus courts pour accélérer l\u0027indexation des tableaux","Un contrôle d\u0027ancrage contextuel Guardrails avec un seuil d\u0027ancrage fixé au maximum","Une synchronisation plus fréquente de la source S3, par exemple toutes les heures"],"e":"Bedrock Knowledge Bases propose une **analyse avancée (advanced parsing)** des documents, par un **modèle de fondation** ou par Amazon Bedrock Data Automation, qui interprète la mise en page, les **tableaux** et les **figures** et les convertit en texte structuré avant le découpage. Des vecteurs plus courts ne restituent pas la structure perdue, un contrôle d\u0027ancrage bloque des réponses sans corriger les données indexées, et une synchronisation plus fréquente réindexe le même contenu mal extrait."},"en":{"q":"A bank indexes annual reports in PDF format, full of financial tables and charts, in an Amazon Bedrock knowledge base. With default parsing, answers about figures in the tables are often wrong because their structure is lost during text extraction. Which knowledge base configuration option MOST improves this case?","o":["Advanced parsing with a foundation model that extracts tables and figures","An embeddings model with shorter vectors to speed up table indexing","A Guardrails contextual grounding check with the grounding threshold set to the maximum","More frequent syncing of the S3 source, for example every hour"],"e":"Bedrock Knowledge Bases offers **advanced parsing** of documents, by a **foundation model** or by Amazon Bedrock Data Automation, which interprets layout, **tables**, and **figures** and converts them into structured text before chunking. Shorter vectors do not restore the lost structure, a grounding check blocks responses without fixing the indexed data, and more frequent syncing re-indexes the same poorly extracted content."}},{"n":59,"d":1,"a":["C"],"fr":{"q":"Une usine collecte, pour chaque machine, 900 mesures de capteurs fortement corrélées entre elles. Les data scientists veulent réduire ce nombre de variables avant l\u0027entraînement, afin d\u0027accélérer les calculs et de visualiser les données, tout en conservant l\u0027essentiel de l\u0027information. Quelle technique utiliser ?","o":["Le clustering K-means, pour regrouper les machines en segments de comportement similaire","La régression logistique, pour prédire la probabilité de panne à partir des 900 mesures","L\u0027analyse en composantes principales (PCA), pour projeter les données sur peu de composantes","Un réseau LSTM, pour modéliser l\u0027ordre temporel des 900 mesures de chaque machine"],"e":"L\u0027**analyse en composantes principales (PCA)** est une technique **non supervisée de réduction de dimension** : elle combine des variables corrélées en quelques composantes qui conservent l\u0027essentiel de la variance. Le K-means regroupe des observations, pas des variables. La régression logistique et le LSTM sont des modèles de prédiction qui ne réduisent pas le nombre de variables d\u0027entrée."},"en":{"q":"A factory collects, for each machine, 900 sensor measurements that are highly correlated with one another. The data scientists want to reduce this number of features before training, to speed up computation and visualize the data, while retaining most of the information. Which technique should they use?","o":["K-means clustering, to group machines into segments with similar behavior","Logistic regression, to predict the probability of failure from the 900 measurements","Principal component analysis (PCA), to project the data onto a few components","An LSTM network, to model the temporal order of each machine\u0027s 900 measurements"],"e":"**Principal component analysis (PCA)** is an **unsupervised dimensionality reduction** technique: it combines correlated features into a few components that retain most of the variance. K-means groups observations, not features. Logistic regression and LSTM are prediction models that do not reduce the number of input features."}},{"n":60,"d":4,"a":["A","B"],"fr":{"q":"Une enseigne veut fine-tuner un modèle de rédaction de descriptions de produits avec des textes collectés en ligne et des avis de ses clients. Le comité d\u0027IA responsable veut limiter les risques juridiques et éthiques liés à ces données. Quelles pratiques sont les PLUS appropriées ? (Sélectionnez DEUX réponses.)","o":["Documenter la provenance et les licences de chaque source de données utilisée","Vérifier la base légale ou le consentement pour réutiliser les avis de ses clients","Considérer que tout texte accessible publiquement en ligne est libre de droits","Supprimer toute documentation sur les données une fois l\u0027entraînement terminé","Se dispenser d\u0027analyse, les données internes ne posant aucun risque de confidentialité"],"e":"Une IA responsable repose sur des données dont la **provenance**, les **licences** et les conditions de réutilisation sont **documentées**, ce qui limite les risques de propriété intellectuelle et facilite l\u0027audit (data lineage). La réutilisation de données personnelles, comme des avis clients, exige une **base légale** ou un **consentement** conforme à la réglementation (RGPD). Un contenu public n\u0027est pas pour autant libre de droits, supprimer la documentation empêche toute traçabilité, et les données internes peuvent contenir des informations personnelles."},"en":{"q":"A retailer wants to fine-tune a product description model with texts collected online and its customers\u0027 reviews. The responsible AI committee wants to limit the legal and ethical risks associated with this data. Which practices are MOST appropriate? (Select TWO.)","o":["Document the provenance and licenses of every data source used","Verify the legal basis or consent for reusing its customers\u0027 reviews","Consider that any text publicly accessible online is free of rights","Delete all documentation about the data once training is complete","Skip any review, since internal data poses no confidentiality risk"],"e":"Responsible AI relies on data whose **provenance**, **licenses**, and reuse conditions are **documented**, which limits intellectual property risks and supports audits (data lineage). Reusing personal data, such as customer reviews, requires a **legal basis** or **consent** that complies with regulations (GDPR). Public content is not free of rights for all that, deleting documentation prevents any traceability, and internal data may contain personal information."}},{"n":61,"d":2,"a":["B"],"fr":{"q":"Un développeur appelle Amazon Nova Reel pour générer une vidéo promotionnelle de 6 secondes. Contrairement à ses appels aux modèles de texte, il ne reçoit aucune vidéo dans la réponse immédiate de l\u0027API. Quelle explication est correcte ?","o":["Nova Reel ne génère que des images fixes : il faut assembler les images obtenues en vidéo","La génération vidéo est asynchrone : StartAsyncInvoke lance la tâche, dont le résultat est écrit dans Amazon S3","Nova Reel exige un Provisioned Throughput : sans lui, la vidéo n\u0027est jamais produite","La vidéo est renvoyée sous forme d\u0027embeddings qu\u0027il faut convertir avec Titan Multimodal Embeddings"],"e":"La génération de vidéos avec **Amazon Nova Reel** est une **invocation asynchrone** : l\u0027API StartAsyncInvoke démarre la tâche, l\u0027application suit son état (GetAsyncInvoke) et récupère la vidéo produite dans le **bucket Amazon S3** indiqué. Nova Reel génère bien des vidéos (Nova Canvas produit des images), il s\u0027utilise sans Provisioned Throughput, et la sortie est un fichier vidéo, pas des embeddings."},"en":{"q":"A developer calls Amazon Nova Reel to generate a 6-second promotional video. Unlike his calls to text models, he receives no video in the API\u0027s immediate response. Which explanation is correct?","o":["Nova Reel generates only still images: the resulting images must be assembled into a video","Video generation is asynchronous: StartAsyncInvoke starts the job, whose output is written to Amazon S3","Nova Reel requires Provisioned Throughput: without it, the video is never produced","The video is returned as embeddings that must be converted with Titan Multimodal Embeddings"],"e":"Video generation with **Amazon Nova Reel** is an **asynchronous invocation**: the StartAsyncInvoke API starts the job, the application tracks its status (GetAsyncInvoke) and retrieves the generated video from the specified **Amazon S3 bucket**. Nova Reel does generate videos (Nova Canvas produces images), it is used without Provisioned Throughput, and the output is a video file, not embeddings."}},{"n":62,"d":3,"a":["D"],"fr":{"q":"Une équipe évalue son assistant RAG avec une évaluation de Knowledge Bases d\u0027Amazon Bedrock. Les réponses obtiennent un score de fidélité (faithfulness) élevé, mais les métriques de pertinence et de couverture du contexte récupéré sont faibles, et de nombreuses réponses sont incomplètes. Où l\u0027équipe doit-elle agir en priorité ?","o":["Sur la génération, en remplaçant le modèle par un modèle plus grand et plus créatif","Sur les Guardrails, en abaissant le seuil d\u0027ancrage pour laisser passer plus de réponses","Sur les paramètres d\u0027inférence, en augmentant la température et la valeur de top-p","Sur la récupération : découpage, modèle d\u0027embeddings, nombre de résultats renvoyés"],"e":"Une **fidélité élevée** signifie que le modèle s\u0027en tient au contexte fourni ; une **pertinence et une couverture du contexte faibles** montrent que le problème se situe dans la **récupération** : les bons passages ne sont pas retrouvés. On ajuste alors le **découpage**, le **modèle d\u0027embeddings**, le **nombre de résultats**, la recherche hybride ou les filtres de métadonnées. Changer de modèle de génération, assouplir l\u0027ancrage ou augmenter la température n\u0027apporte pas les informations manquantes et accroît le risque d\u0027hallucination."},"en":{"q":"A team evaluates its RAG assistant with an Amazon Bedrock Knowledge Base evaluation. Responses score high on faithfulness, but the relevance and coverage metrics of the retrieved context are low, and many answers are incomplete. Where should the team act first?","o":["On generation, replacing the model with a larger and more creative one","On Guardrails, lowering the grounding threshold to let more responses through","On inference parameters, increasing the temperature and the top-p value","On retrieval: chunking, embeddings model, number of results returned"],"e":"**High faithfulness** means the model sticks to the context provided; **low context relevance and coverage** show that the problem lies in **retrieval**: the right passages are not found. The fixes are then **chunking**, the **embeddings model**, the **number of results**, hybrid search, or metadata filters. Changing the generation model, relaxing grounding, or raising the temperature does not supply the missing information and increases the risk of hallucination."}},{"n":63,"d":5,"a":["A"],"fr":{"q":"Un régulateur demande à une banque de reproduire exactement le jeu de données qui a servi, il y a dix mois, au fine-tuning de la version 3 de son modèle. Depuis, les fichiers du bucket S3 ont été modifiés et écrasés à plusieurs reprises. Quelle pratique aurait permis de répondre à cette demande ?","o":["Activer le versionnage S3 et enregistrer à chaque entraînement les identifiants de version des objets","Activer le chiffrement SSE-KMS du bucket avec une clé gérée par le client et sa rotation automatique","Activer Amazon Macie pour classer automatiquement les données sensibles présentes dans le bucket","Activer AWS Trusted Advisor pour recevoir des recommandations d\u0027optimisation des coûts S3"],"e":"La **reproductibilité** et la **traçabilité (data lineage)** exigent de conserver l\u0027état exact des données d\u0027entraînement : le **versionnage S3** garde chaque version des objets, et l\u0027enregistrement des **identifiants de version** (ou d\u0027un instantané immuable du jeu) dans les métadonnées de l\u0027entraînement permet de le reconstituer. Le chiffrement protège la confidentialité sans conserver l\u0027historique, Macie découvre des données sensibles, et Trusted Advisor formule des recommandations."},"en":{"q":"A regulator asks a bank to reproduce exactly the dataset that was used, ten months ago, to fine-tune version 3 of its model. Since then, the files in the S3 bucket have been modified and overwritten several times. Which practice would have made it possible to meet this request?","o":["Enable S3 Versioning and record the object version IDs used for each training run","Enable SSE-KMS encryption on the bucket with a customer managed key and automatic rotation","Enable Amazon Macie to automatically classify sensitive data in the bucket","Enable AWS Trusted Advisor to receive S3 cost optimization recommendations"],"e":"**Reproducibility** and **data lineage** require keeping the exact state of the training data: **S3 Versioning** retains every version of the objects, and recording the **version IDs** (or an immutable snapshot of the dataset) in the training metadata makes it possible to rebuild it. Encryption protects confidentiality without keeping history, Macie discovers sensitive data, and Trusted Advisor makes recommendations."}},{"n":64,"d":1,"a":["C"],"fr":{"q":"Un laboratoire pharmaceutique transcrit avec Amazon Transcribe les réunions de ses délégués commerciaux. Les noms de ses produits, des marques inventées comme « Zentrolix » ou « Palvéra », sont systématiquement mal transcrits. Quelle solution corrige ce problème avec le MOINS d\u0027effort ?","o":["Amazon Polly avec un lexique de prononciation contenant les noms des produits","Amazon Comprehend avec la détection d\u0027entités pour corriger les noms transcrits","Amazon Transcribe avec un vocabulaire personnalisé contenant les noms des produits","Un modèle de reconnaissance vocale entraîné de zéro sur SageMaker AI"],"e":"Le **vocabulaire personnalisé (custom vocabulary)** d\u0027**Amazon Transcribe** indique au service des mots spécifiques (noms de marques, acronymes, jargon), éventuellement avec leur prononciation, ce qui améliore leur reconnaissance. Un lexique Polly agit sur la synthèse vocale, pas sur la transcription, Comprehend analyse un texte déjà transcrit sans corriger la reconnaissance, et entraîner un modèle de zéro est disproportionné."},"en":{"q":"A pharmaceutical company uses Amazon Transcribe to transcribe its sales representatives\u0027 meetings. Its product names, invented brands such as \u0027Zentrolix\u0027 or \u0027Palvera\u0027, are consistently mistranscribed. Which solution fixes this problem with the LEAST effort?","o":["Amazon Polly with a pronunciation lexicon containing the product names","Amazon Comprehend with entity detection to correct the transcribed names","Amazon Transcribe with a custom vocabulary containing the product names","A speech recognition model trained from scratch on SageMaker AI"],"e":"**Custom vocabulary** in **Amazon Transcribe** tells the service about specific words (brand names, acronyms, jargon), optionally with their pronunciation, which improves their recognition. A Polly lexicon affects speech synthesis, not transcription, Comprehend analyzes already transcribed text without fixing recognition, and training a model from scratch is disproportionate."}},{"n":65,"d":2,"a":["B"],"fr":{"q":"Un développeur construit un chatbot en appelant l\u0027API Converse d\u0027Amazon Bedrock. Au deuxième message, l\u0027utilisateur écrit « Et pour le modèle rouge ? », mais le modèle répond qu\u0027il ne sait pas de quel produit il s\u0027agit. Quelle est la cause la PLUS probable ?","o":["Le modèle a atteint la limite de sa fenêtre de contexte dès le deuxième message de la conversation","L\u0027API est sans état : l\u0027application doit renvoyer l\u0027historique de la conversation à chaque appel","La température est trop basse, ce qui empêche le modèle de relier deux messages successifs","Le modèle oublie volontairement les échanges précédents pour protéger la vie privée de l\u0027utilisateur"],"e":"Les API d\u0027inférence comme **Converse** sont **sans état (stateless)** : le modèle ne conserve rien entre deux appels, c\u0027est donc à l\u0027application de **renvoyer l\u0027historique** des messages (ou un résumé) dans chaque requête, ou d\u0027utiliser un service de mémoire comme AgentCore Memory. Deux messages ne saturent pas la fenêtre de contexte, la température n\u0027affecte pas l\u0027accès à l\u0027historique, et le modèle n\u0027a pas de mécanisme d\u0027oubli volontaire."},"en":{"q":"A developer builds a chatbot by calling the Amazon Bedrock Converse API. In the second message, the user writes \u0027And for the red model?\u0027, but the model replies that it does not know which product is meant. What is the MOST likely cause?","o":["The model reached its context window limit as early as the second message of the conversation","The API is stateless: the application must send the conversation history with every call","The temperature is too low, which prevents the model from linking two successive messages","The model deliberately forgets previous exchanges to protect the user\u0027s privacy"],"e":"Inference APIs such as **Converse** are **stateless**: the model keeps nothing between two calls, so it is up to the application to **send the message history** (or a summary) with each request, or to use a memory service such as AgentCore Memory. Two messages do not saturate the context window, temperature does not affect access to the history, and the model has no deliberate forgetting mechanism."}}]}];

const sTitle = s => s.from ? T().retryOf(keyTitle(s.from)) : keyTitle(s.key);

function load(){ const d = {results:{},wrong:{},lang:/^en/i.test(navigator.language||"")?"en":"fr",theme:null,session:null}; try{ return Object.assign(d, JSON.parse(localStorage.getItem(LS)||"{}")); }catch(e){ return d; } }

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){
  return esc(s)
    .replace(/&lt;br\s*\/?&gt;/gi, "<br>")
    .replace(/&lt;(https?:\/\/[^\s&]+(?:&amp;[^\s&]+)*)&gt;/g, (m,u)=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(s){
  if(!s) return "";
  let out = "", inList = false;
  for(const raw of s.split("\n")){
    const l = raw.trim();
    const m = l.match(/^[-*]\s+(.*)/);
    if(m){ if(!inList){ out += "<ul>"; inList = true; } out += "<li>"+inline(m[1])+"</li>"; continue; }
    if(inList){ out += "</ul>"; inList = false; }
    if(l) out += "<p style='margin:.3rem 0'>"+inline(l)+"</p>";
  }
  return out + (inList ? "</ul>" : "");
}
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

const tx = q => q[L()] || q.fr;

const same = (a,b) => a.length===b.length && a.every(x=>b.includes(x));
