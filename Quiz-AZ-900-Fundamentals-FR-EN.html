<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Microsoft Azure Fundamentals (AZ-900) – Examens blancs / Practice exams</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--txt:#1d2433;--mut:#6b7385;--bd:#dde2ea;--pri:#0078d4;--pri2:#0b1f33;--ok:#1e9e5a;--ko:#d6383a;--okbg:#e6f6ed;--kobg:#fdeaea;--sel:#e8f3fc;--flag:#7b5cff}
[data-theme=dark]{--bg:#12161d;--card:#1c222c;--txt:#e6e9ef;--mut:#98a1b3;--bd:#2e3644;--pri2:#081422;--okbg:#173527;--kobg:#3d1d1e;--sel:#102a40}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--pri2);color:#fff;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:1.1rem;margin:0;flex:1;cursor:pointer}
header h1 b{color:var(--pri)}
header .tools{display:flex;gap:.5rem;align-items:center}
main{max-width:1000px;margin:0 auto;padding:1.2rem}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--txt);padding:.5rem 1rem;border-radius:8px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--pri)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--pri);border-color:var(--pri);color:#111;font-weight:600}
button.sm{padding:.25rem .6rem;font-size:.85rem}
header button{background:transparent;color:#fff;border-color:#4a5568}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.exam{cursor:pointer;transition:transform .1s}
.exam:hover{transform:translateY(-2px);border-color:var(--pri)}
.exam h3{margin:0 0 .3rem;font-size:1rem}
.mut{color:var(--mut);font-size:.88rem}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.78rem;font-weight:600}
.b-ok{background:var(--okbg);color:var(--ok)}.b-ko{background:var(--kobg);color:var(--ko)}.b-n{background:var(--bg);color:var(--mut)}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.opts label{display:flex;gap:.5rem;align-items:center;margin:.3rem 0;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button.on{background:var(--pri);color:#111;font-weight:600}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.6rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--ko)}
.progress{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:1rem}
.progress div{height:100%;background:var(--pri);transition:width .2s}
.qtext{font-size:1.08rem;font-weight:500;margin:.2rem 0 1rem}
.hint{font-size:.85rem;color:var(--mut);margin-bottom:.6rem}
.choice{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:.7rem .9rem;margin:.5rem 0;cursor:pointer;background:var(--card)}
.choice:hover{border-color:var(--pri)}
.choice input{margin-top:.3rem;accent-color:var(--pri)}
.choice .k{font-weight:700;min-width:1.2rem}
.choice.sel{background:var(--sel);border-color:var(--pri)}
.choice.good{background:var(--okbg);border-color:var(--ok)}
.choice.bad{background:var(--kobg);border-color:var(--ko)}
.choice.locked{cursor:default}
.fb{border-radius:10px;padding:.8rem 1rem;margin-top:1rem}
.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)}
.fb.ko{background:var(--kobg);border-left:4px solid var(--ko)}
.expl{margin-top:.5rem;font-size:.95rem}
.expl ul{margin:.3rem 0;padding-left:1.3rem}
.nav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.pal{display:flex;flex-wrap:wrap;gap:.35rem}
.pal button{width:2.4rem;padding:.3rem 0;font-size:.85rem;position:relative}
.pal .ans{background:var(--sel);border-color:var(--pri)}
.pal .g{background:var(--okbg);border-color:var(--ok)}
.pal .r{background:var(--kobg);border-color:var(--ko)}
.pal .cur{outline:2px solid var(--pri2);outline-offset:1px}
[data-theme=dark] .pal .cur{outline-color:#fff}
.pal .fl::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.score{font-size:3rem;font-weight:800;margin:.2rem 0}
.score.ok{color:var(--ok)}.score.ko{color:var(--ko)}
.rv{border-top:1px solid var(--bd);padding:.9rem 0}
.rv:first-child{border-top:0}
.rv .ans{font-size:.92rem;margin:.15rem 0}
.tag-ok{color:var(--ok);font-weight:700}.tag-ko{color:var(--ko);font-weight:700}
a{color:#0a73d9}
[data-theme=dark] a{color:#6cb4ff}
.flagbtn.on{background:var(--flag);color:#fff;border-color:var(--flag)}
select,input[type=number]{font:inherit;padding:.35rem;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--txt)}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:1.5rem}
.kbd{font-size:.78rem;color:var(--mut)}
@media(max-width:600px){main{padding:.6rem}.card{padding:.9rem}.score{font-size:2.3rem}}
</style>
</head>

<script>
const DATA = [{"id":1,"title":{"fr":"Examen blanc 1 — Définitions et fondamentaux","en":"Practice exam 1 — Definitions and fundamentals"},"questions":[{"n":1,"a":["A"],"fr":{"q":"Comment définit-on le mieux le **cloud computing** ?","o":["La mise à disposition à la demande de ressources informatiques via Internet, facturées selon l\u0027usage","Un logiciel installé uniquement sur un serveur local de l\u0027entreprise","Un réseau privé reliant exclusivement les datacenters Microsoft entre eux","Une méthode de sauvegarde de données sur un disque dur externe"],"e":"Le **cloud computing** consiste à fournir à la demande des ressources comme des serveurs, du stockage ou des réseaux via Internet, avec une facturation basée sur la consommation."},"en":{"q":"What is the best definition of **cloud computing**?","o":["The on-demand delivery of computing resources over the internet, billed based on usage","Software installed only on a company\u0027s local server","A private network that exclusively connects Microsoft datacenters to each other","A method of backing up data to an external hard drive"],"e":"**Cloud computing** is the on-demand delivery of resources such as servers, storage, or networking over the internet, with billing based on consumption."}},{"n":2,"a":["C"],"fr":{"q":"Que décrit le **modèle de responsabilité partagée** dans Azure ?","o":["La répartition égale des coûts entre tous les clients d\u0027une même région","Le partage des données clients entre plusieurs organisations utilisant Azure","La répartition des tâches de sécurité entre Microsoft et le client, variable selon le type de service (IaaS, PaaS, SaaS)","L\u0027obligation pour chaque client de gérer physiquement un serveur dans un datacenter Microsoft"],"e":"Le **modèle de responsabilité partagée** définit qui, de Microsoft ou du client, est responsable de chaque couche de sécurité et de gestion, cette répartition évoluant selon qu\u0027il s\u0027agit d\u0027IaaS, de PaaS ou de SaaS."},"en":{"q":"What does the **shared responsibility model** describe in Azure?","o":["The equal distribution of costs among all customers in the same region","The sharing of customer data between multiple organizations using Azure","The division of security tasks between Microsoft and the customer, which varies depending on the service type (IaaS, PaaS, SaaS)","The requirement for each customer to physically manage a server in a Microsoft datacenter"],"e":"The **shared responsibility model** defines whether Microsoft or the customer is responsible for each layer of security and management, with this division changing depending on whether the service is IaaS, PaaS, or SaaS."}},{"n":3,"a":["B"],"fr":{"q":"Quelle proposition correspond à la définition du modèle **IaaS** (Infrastructure as a Service) ?","o":["Le fournisseur héberge et gère entièrement l\u0027application, le client y accède via un navigateur","Le fournisseur gère l\u0027infrastructure physique tandis que le client gère les systèmes d\u0027exploitation, le middleware et les applications","Le client gère uniquement le code applicatif, sans jamais toucher aux serveurs ni au réseau","Le fournisseur impose un système d\u0027exploitation et des logiciels figés, non modifiables par le client"],"e":"En **IaaS**, le fournisseur cloud prend en charge serveurs, stockage et réseau, laissant au client la gestion des systèmes d\u0027exploitation et des applications."},"en":{"q":"Which statement matches the definition of the **IaaS** (Infrastructure as a Service) model?","o":["The provider fully hosts and manages the application, and the customer accesses it through a browser","The provider manages the physical infrastructure, while the customer manages the operating systems, middleware, and applications","The customer manages only the application code, never touching the servers or the network","The provider imposes a fixed operating system and software that the customer cannot modify"],"e":"With **IaaS**, the cloud provider takes care of servers, storage, and networking, leaving the customer to manage operating systems and applications."}},{"n":4,"a":["D"],"fr":{"q":"Quelle proposition correspond à la définition du modèle **PaaS** (Platform as a Service) ?","o":["Le client doit installer et administrer lui-même le système d\u0027exploitation des serveurs","Le fournisseur ne propose aucun outil de développement, uniquement du stockage brut","Le client loue uniquement de l\u0027espace disque sans aucune capacité de calcul","Le fournisseur gère l\u0027infrastructure et le système d\u0027exploitation, permettant au client de se concentrer sur le développement et le déploiement de ses applications"],"e":"Le **PaaS** fournit une plateforme prête à l\u0027emploi (exécution, mise à l\u0027échelle, systèmes gérés) pour que le client se concentre sur le code et les applications."},"en":{"q":"Which statement matches the definition of the **PaaS** (Platform as a Service) model?","o":["The customer must install and administer the servers\u0027 operating system themselves","The provider offers no development tools, only raw storage","The customer rents only disk space, without any compute capacity","The provider manages the infrastructure and the operating system, allowing the customer to focus on developing and deploying their applications"],"e":"**PaaS** provides a ready-to-use platform (runtime, scaling, managed systems) so that the customer can focus on code and applications."}},{"n":5,"a":["A"],"fr":{"q":"Quelle proposition correspond à la définition du modèle **SaaS** (Software as a Service) ?","o":["Le fournisseur héberge et gère entièrement l\u0027application, le client y accédant simplement via un navigateur ou un client léger","Le client doit configurer lui-même les serveurs virtuels hébergeant l\u0027application","Le fournisseur ne fournit que l\u0027infrastructure réseau, sans aucune application","Le client est responsable de l\u0027installation des mises à jour de sécurité du système d\u0027exploitation"],"e":"En **SaaS**, l\u0027application complète est fournie et maintenue par l\u0027éditeur ; l\u0027utilisateur se contente de s\u0027y connecter, sans gérer l\u0027infrastructure sous-jacente."},"en":{"q":"Which statement matches the definition of the **SaaS** (Software as a Service) model?","o":["The provider fully hosts and manages the application, and the customer simply accesses it through a browser or a thin client","The customer must configure the virtual servers hosting the application themselves","The provider supplies only the network infrastructure, without any application","The customer is responsible for installing operating system security updates"],"e":"With **SaaS**, the complete application is provided and maintained by the vendor; the user simply connects to it, without managing the underlying infrastructure."}},{"n":6,"a":["B"],"fr":{"q":"Quelle affirmation définit le mieux le modèle de déploiement **cloud public** ?","o":["Les ressources sont hébergées exclusivement dans le datacenter de l\u0027entreprise cliente","Les ressources sont hébergées et partagées entre plusieurs clients au sein de l\u0027infrastructure du fournisseur, accessibles via Internet","Les ressources ne sont jamais accessibles depuis l\u0027extérieur du réseau de l\u0027entreprise","Les ressources sont réparties à parts égales entre deux fournisseurs cloud concurrents"],"e":"Un **cloud public** est exploité par un fournisseur tiers qui met son infrastructure mutualisée à disposition de plusieurs clients via Internet."},"en":{"q":"Which statement best defines the **public cloud** deployment model?","o":["Resources are hosted exclusively in the customer company\u0027s datacenter","Resources are hosted and shared among multiple customers within the provider\u0027s infrastructure, accessible over the internet","Resources are never accessible from outside the company\u0027s network","Resources are split equally between two competing cloud providers"],"e":"A **public cloud** is operated by a third-party provider that makes its shared infrastructure available to multiple customers over the internet."}},{"n":7,"a":["C"],"fr":{"q":"Quelle affirmation définit le mieux un modèle de déploiement **hybride** ?","o":["Une infrastructure reposant uniquement sur du matériel appartenant à l\u0027entreprise","Un environnement utilisant exclusivement des services de plusieurs fournisseurs cloud publics différents","Une combinaison d\u0027une infrastructure sur site (ou privée) et de services cloud public, orchestrés ensemble","Un abonnement cloud réservé aux organisations gouvernementales uniquement"],"e":"Le modèle **hybride** relie une infrastructure sur site ou privée à des services cloud public, permettant de faire transiter des charges de travail entre les deux."},"en":{"q":"Which statement best defines a **hybrid** deployment model?","o":["An infrastructure based solely on hardware owned by the company","An environment that exclusively uses services from several different public cloud providers","A combination of on-premises (or private) infrastructure and public cloud services, orchestrated together","A cloud subscription reserved for government organizations only"],"e":"The **hybrid** model connects on-premises or private infrastructure with public cloud services, allowing workloads to move between the two."}},{"n":8,"a":["A"],"fr":{"q":"Quelle affirmation décrit le mieux l\u0027**élasticité** dans le cloud ?","o":["La capacité à ajuster automatiquement et rapidement les ressources allouées à la hausse ou à la baisse selon la demande réelle","La capacité à ajouter manuellement des serveurs physiques supplémentaires dans un datacenter","La garantie contractuelle qu\u0027un service ne subira jamais de panne","Le fait de dupliquer systématiquement les données dans toutes les régions du monde"],"e":"L\u0027**élasticité** désigne l\u0027ajustement automatique et dynamique des ressources en fonction de la charge réelle, à la différence de la scalabilité manuelle."},"en":{"q":"Which statement best describes **elasticity** in the cloud?","o":["The ability to automatically and quickly scale allocated resources up or down based on actual demand","The ability to manually add additional physical servers to a datacenter","The contractual guarantee that a service will never experience an outage","Systematically duplicating data across every region in the world"],"e":"**Elasticity** refers to the automatic and dynamic adjustment of resources based on the actual load, as opposed to manual scalability."}},{"n":9,"a":["A","C"],"fr":{"q":"Lesquelles de ces caractéristiques correspondent au modèle de dépenses **OpEx** (dépenses opérationnelles) associé au cloud ?","o":["Paiement à l\u0027usage, sans investissement initial important","Nécessite l\u0027achat de matériel physique amorti sur plusieurs années","Permet d\u0027ajuster les coûts en fonction de la consommation réelle des services","Implique un engagement contractuel fixe et irrévocable de cinq ans"],"e":"Le modèle **OpEx** repose sur un paiement à l\u0027usage flexible, sans achat de matériel ni engagement long terme, contrairement au **CapEx** qui implique un investissement initial amorti."},"en":{"q":"Which of these characteristics correspond to the **OpEx** (operational expenditure) spending model associated with the cloud?","o":["Pay-as-you-go, with no significant upfront investment","Requires purchasing physical hardware depreciated over several years","Allows costs to be adjusted based on actual consumption of services","Involves a fixed, irrevocable five-year contractual commitment"],"e":"The **OpEx** model is based on flexible pay-as-you-go spending, with no hardware purchases or long-term commitment, unlike **CapEx**, which involves a depreciated upfront investment."}},{"n":10,"a":["B"],"fr":{"q":"Comment définit-on le **serverless computing** ?","o":["Un modèle où le client doit provisionner manuellement chaque serveur avant chaque exécution","Un modèle d\u0027exécution où le fournisseur gère automatiquement l\u0027allocation et la mise à l\u0027échelle des ressources, le client ne payant que le temps d\u0027exécution du code","Un modèle où aucune facturation n\u0027est appliquée, quel que soit l\u0027usage","Un modèle réservé uniquement à l\u0027hébergement de sites web statiques"],"e":"Le **serverless** masque entièrement la gestion des serveurs : le fournisseur alloue et met à l\u0027échelle automatiquement les ressources, et la facturation suit le temps d\u0027exécution réel."},"en":{"q":"How is **serverless computing** defined?","o":["A model in which the customer must manually provision each server before every execution","An execution model in which the provider automatically handles resource allocation and scaling, and the customer pays only for the code\u0027s execution time","A model in which no billing is applied, regardless of usage","A model reserved solely for hosting static websites"],"e":"**Serverless** completely abstracts server management: the provider automatically allocates and scales resources, and billing follows actual execution time."}},{"n":11,"a":["D"],"fr":{"q":"Qu\u0027est-ce qu\u0027un **SLA** (Service Level Agreement) chez Microsoft Azure ?","o":["Un outil de calcul du coût total de possession d\u0027une infrastructure","Un document décrivant uniquement les fonctionnalités techniques d\u0027un service","Une certification de sécurité délivrée par un organisme tiers indépendant","Un engagement contractuel de Microsoft définissant les niveaux de disponibilité et de performance garantis pour un service"],"e":"Le **SLA** est un engagement contractuel précisant, par exemple, le pourcentage de disponibilité garanti d\u0027un service et les compensations prévues en cas de non-respect."},"en":{"q":"What is an **SLA** (Service Level Agreement) in Microsoft Azure?","o":["A tool for calculating the total cost of ownership of an infrastructure","A document that describes only the technical features of a service","A security certification issued by an independent third-party organization","A contractual commitment from Microsoft that defines the guaranteed levels of availability and performance for a service"],"e":"The **SLA** is a contractual commitment that specifies, for example, the guaranteed availability percentage of a service and the compensation provided if it is not met."}},{"n":12,"a":["A"],"fr":{"q":"Comment définit-on une **région Azure** ?","o":["Un ensemble d\u0027un ou plusieurs datacenters situés dans une zone géographique définie, reliés par un réseau à faible latence","Un unique bâtiment regroupant tous les serveurs Microsoft dans le monde","Un groupe logique de ressources créé librement par un administrateur","Un abonnement Azure réservé exclusivement aux organisations gouvernementales"],"e":"Une **région** Azure regroupe un ou plusieurs datacenters proches géographiquement et interconnectés par un réseau dédié à faible latence."},"en":{"q":"How is an **Azure region** defined?","o":["A set of one or more datacenters located within a defined geographic area, connected by a low-latency network","A single building housing all Microsoft servers worldwide","A logical group of resources freely created by an administrator","An Azure subscription reserved exclusively for government organizations"],"e":"An Azure **region** groups one or more geographically close datacenters interconnected by a dedicated low-latency network."}},{"n":13,"a":["C"],"fr":{"q":"À quoi servent les **paires de régions** (region pairs) dans Azure ?","o":["À réduire artificiellement le prix des services dans deux régions associées","À fusionner deux abonnements Azure distincts en un seul","À associer deux régions d\u0027une même zone géographique pour assurer la reprise d\u0027activité en cas de sinistre majeur","À imposer l\u0027utilisation simultanée de deux comptes de stockage identiques"],"e":"Les **paires de régions** associent deux régions d\u0027une même géographie afin de garantir la continuité de service et la reprise après sinistre, avec des mises à jour de plateforme décalées entre elles."},"en":{"q":"What is the purpose of **region pairs** in Azure?","o":["To artificially lower the price of services in two associated regions","To merge two separate Azure subscriptions into one","To pair two regions within the same geography to provide disaster recovery in the event of a major disaster","To require the simultaneous use of two identical storage accounts"],"e":"**Region pairs** associate two regions within the same geography to ensure service continuity and disaster recovery, with platform updates staggered between them."}},{"n":14,"a":["B"],"fr":{"q":"Comment définit-on une **zone de disponibilité** (availability zone) ?","o":["Un datacenter unique partagé par toutes les régions du monde","Un emplacement physiquement distinct au sein d\u0027une région Azure, disposant de son alimentation, refroidissement et réseau propres","Une zone géographique couvrant plusieurs continents simultanément","Un espace de stockage virtuel sans existence physique réelle"],"e":"Les **zones de disponibilité** sont des emplacements physiquement séparés au sein d\u0027une même région, chacun étant indépendant en matière d\u0027alimentation, de refroidissement et de réseau, afin de limiter l\u0027impact d\u0027une panne locale."},"en":{"q":"How is an **availability zone** defined?","o":["A single datacenter shared by all regions in the world","A physically separate location within an Azure region, with its own power, cooling, and networking","A geographic area spanning several continents at once","A virtual storage space with no actual physical existence"],"e":"**Availability zones** are physically separate locations within the same region, each independent in terms of power, cooling, and networking, to limit the impact of a local failure."}},{"n":15,"a":["A"],"fr":{"q":"Quel est l\u0027ordre correct de la hiérarchie d\u0027organisation des ressources Azure, du niveau le plus large au plus précis ?","o":["Groupes d\u0027administration, abonnements, groupes de ressources, ressources","Ressources, groupes de ressources, abonnements, groupes d\u0027administration","Abonnements, groupes d\u0027administration, ressources, groupes de ressources","Groupes de ressources, groupes d\u0027administration, abonnements, ressources"],"e":"La hiérarchie Azure va du plus large au plus précis : **groupes d\u0027administration** \u003e **abonnements** \u003e **groupes de ressources** \u003e **ressources**, chaque niveau héritant des stratégies du niveau supérieur."},"en":{"q":"What is the correct order of the Azure resource organization hierarchy, from the broadest level to the most specific?","o":["Management groups, subscriptions, resource groups, resources","Resources, resource groups, subscriptions, management groups","Subscriptions, management groups, resources, resource groups","Resource groups, management groups, subscriptions, resources"],"e":"The Azure hierarchy goes from broadest to most specific: **management groups** \u003e **subscriptions** \u003e **resource groups** \u003e **resources**, with each level inheriting policies from the level above."}},{"n":16,"a":["C"],"fr":{"q":"Comment définit-on les **groupes identiques de machines virtuelles** (VM Scale Sets) ?","o":["Un service de stockage permettant d\u0027archiver des sauvegardes de machines virtuelles","Un outil de migration qui transfère des serveurs physiques vers Azure","Un service permettant de créer et gérer automatiquement un groupe de machines virtuelles identiques dont le nombre s\u0027ajuste selon la charge ou une planification","Un service de surveillance des performances réseau des machines virtuelles"],"e":"Les **VM Scale Sets** permettent de déployer et de gérer un ensemble de VM identiques avec une mise à l\u0027échelle automatique, horizontale, selon la demande."},"en":{"q":"How are **virtual machine scale sets** (VM Scale Sets) defined?","o":["A storage service for archiving virtual machine backups","A migration tool that moves physical servers to Azure","A service for automatically creating and managing a group of identical virtual machines whose number adjusts based on load or a schedule","A service for monitoring the network performance of virtual machines"],"e":"**VM Scale Sets** let you deploy and manage a set of identical VMs with automatic horizontal scaling based on demand."}},{"n":17,"a":["A"],"fr":{"q":"Quel service Azure permet d\u0027exécuter des conteneurs isolés rapidement, sans avoir à gérer de machines virtuelles ni de cluster d\u0027orchestration ?","o":["Azure Container Instances","Azure Kubernetes Service","Azure Virtual Machines","Azure Virtual Desktop"],"e":"**Azure Container Instances (ACI)** permet d\u0027exécuter des conteneurs isolés rapidement sans provisionner de VM ni gérer de cluster, contrairement à AKS qui orchestre des clusters complets de conteneurs."},"en":{"q":"Which Azure service lets you quickly run isolated containers without having to manage virtual machines or an orchestration cluster?","o":["Azure Container Instances","Azure Kubernetes Service","Azure Virtual Machines","Azure Virtual Desktop"],"e":"**Azure Container Instances (ACI)** lets you quickly run isolated containers without provisioning VMs or managing a cluster, unlike AKS, which orchestrates full container clusters."}},{"n":18,"a":["D"],"fr":{"q":"Comment définit-on **Azure Functions** ?","o":["Un service de stockage de fichiers volumineux accessible via un protocole FTP","Un service permettant uniquement d\u0027héberger des sites web statiques","Un outil de gestion des identités des utilisateurs externes","Un service de calcul serverless exécutant du code déclenché par un événement, sans gestion de serveur ni de scalabilité manuelle"],"e":"**Azure Functions** est un service de calcul **serverless** événementiel : le code s\u0027exécute en réponse à un déclencheur, et la plateforme gère automatiquement l\u0027infrastructure et la mise à l\u0027échelle."},"en":{"q":"How is **Azure Functions** defined?","o":["A storage service for large files accessible via the FTP protocol","A service used only to host static websites","A tool for managing the identities of external users","A serverless compute service that runs event-triggered code, with no server management or manual scaling"],"e":"**Azure Functions** is an event-driven **serverless** compute service: code runs in response to a trigger, and the platform automatically manages the infrastructure and scaling."}},{"n":19,"a":["A","C"],"fr":{"q":"Lesquelles de ces affirmations décrivent correctement **Azure App Service** ?","o":["C\u0027est un service PaaS entièrement managé pour héberger des applications web, des API et des applications mobiles backend","Il nécessite que le client installe et administre lui-même le système d\u0027exploitation sous-jacent","Il prend en charge la mise à l\u0027échelle automatique et le déploiement continu depuis un dépôt de code source","Il ne fonctionne qu\u0027avec des applications développées en .NET"],"e":"**App Service** est une plateforme **PaaS** managée qui héberge des applications web ou API dans plusieurs langages, avec mise à l\u0027échelle automatique et intégration au déploiement continu, sans que le client gère l\u0027OS."},"en":{"q":"Which of these statements correctly describe **Azure App Service**?","o":["It is a fully managed PaaS service for hosting web apps, APIs, and mobile back ends","It requires the customer to install and administer the underlying operating system themselves","It supports autoscaling and continuous deployment from a source code repository","It works only with applications developed in .NET"],"e":"**App Service** is a managed **PaaS** platform that hosts web apps or APIs in multiple languages, with autoscaling and continuous deployment integration, without the customer managing the OS."}},{"n":20,"a":["B"],"fr":{"q":"Comment définit-on le **peering de réseaux virtuels** (VNet peering) dans Azure ?","o":["Le transfert de données chiffrées via une liaison Internet publique entre deux organisations","La mise en relation de deux réseaux virtuels Azure afin que leurs ressources communiquent via le réseau privé Microsoft, comme si elles appartenaient au même réseau","La fusion de deux abonnements Azure en un seul groupe de gestion","La duplication automatique d\u0027un réseau virtuel dans une autre région du monde"],"e":"Le **peering de VNet** relie deux réseaux virtuels via l\u0027infrastructure privée de Microsoft, offrant une communication à faible latence sans transiter par Internet public."},"en":{"q":"How is **virtual network peering** (VNet peering) defined in Azure?","o":["The transfer of encrypted data over a public internet link between two organizations","Connecting two Azure virtual networks so that their resources communicate over the Microsoft private network, as if they belonged to the same network","Merging two Azure subscriptions into a single management group","Automatically duplicating a virtual network in another region of the world"],"e":"**VNet peering** connects two virtual networks through Microsoft\u0027s private infrastructure, providing low-latency communication without traversing the public internet."}},{"n":21,"a":["C"],"fr":{"q":"Quelle est la principale différence entre **Azure VPN Gateway** et **Azure ExpressRoute** ?","o":["VPN Gateway est gratuit alors qu\u0027ExpressRoute est toujours payant","Les deux services sont strictement identiques et interchangeables","VPN Gateway établit une connexion chiffrée via Internet public, tandis qu\u0027ExpressRoute utilise une connexion privée dédiée ne transitant pas par Internet","ExpressRoute ne peut connecter que des machines virtuelles, jamais des réseaux locaux"],"e":"**VPN Gateway** chiffre le trafic transitant par Internet public, alors qu\u0027**ExpressRoute** fournit une connexion privée dédiée entre le site du client et Azure, sans passer par Internet."},"en":{"q":"What is the main difference between **Azure VPN Gateway** and **Azure ExpressRoute**?","o":["VPN Gateway is free, while ExpressRoute is always paid","The two services are strictly identical and interchangeable","VPN Gateway establishes an encrypted connection over the public internet, while ExpressRoute uses a dedicated private connection that does not go over the internet","ExpressRoute can connect only virtual machines, never on-premises networks"],"e":"**VPN Gateway** encrypts traffic traveling over the public internet, whereas **ExpressRoute** provides a dedicated private connection between the customer\u0027s site and Azure, without going over the internet."}},{"n":22,"a":["B","D"],"fr":{"q":"Parmi les options de redondance de stockage Azure suivantes, lesquelles répliquent les données sur plusieurs **zones de disponibilité** au sein d\u0027une région ?","o":["Stockage localement redondant (LRS)","Stockage à redondance de zone (ZRS)","Stockage géo-redondant (GRS)","Stockage géo-zone-redondant (GZRS)"],"e":"**ZRS** réplique les données sur plusieurs zones de disponibilité d\u0027une même région, et **GZRS** combine cette redondance de zone avec une réplication vers une région secondaire ; LRS et GRS ne répliquent pas entre zones."},"en":{"q":"Which of the following Azure storage redundancy options replicate data across multiple **availability zones** within a region?","o":["Locally redundant storage (LRS)","Zone-redundant storage (ZRS)","Geo-redundant storage (GRS)","Geo-zone-redundant storage (GZRS)"],"e":"**ZRS** replicates data across multiple availability zones within the same region, and **GZRS** combines this zone redundancy with replication to a secondary region; LRS and GRS do not replicate across zones."}},{"n":23,"a":["D"],"fr":{"q":"Quel niveau d\u0027accès **Blob Storage** est destiné aux données rarement consultées, acceptant un délai de récupération de plusieurs heures, pour le coût de stockage le plus bas ?","o":["Niveau Hot (fréquent)","Niveau Cool (occasionnel)","Niveau Premium","Niveau Archive"],"e":"Le niveau **Archive** offre le coût de stockage le plus bas mais nécessite une réhydratation pouvant prendre plusieurs heures avant de pouvoir accéder aux données."},"en":{"q":"Which **Blob Storage** access tier is intended for rarely accessed data, tolerating a retrieval delay of several hours, for the lowest storage cost?","o":["Hot tier (frequent)","Cool tier (infrequent)","Premium tier","Archive tier"],"e":"The **Archive** tier offers the lowest storage cost but requires rehydration, which can take several hours before the data can be accessed."}},{"n":24,"a":["A"],"fr":{"q":"Comment définit-on **Microsoft Entra ID** ?","o":["Un service cloud de gestion des identités et des accès permettant l\u0027authentification des utilisateurs et la gestion des applications","Un service de stockage de fichiers destiné aux grandes entreprises","Un outil de surveillance des performances réseau des machines virtuelles","Un service de sauvegarde automatique des bases de données SQL"],"e":"**Microsoft Entra ID** (anciennement Azure AD) est le service cloud de gestion des identités et des accès d\u0027Azure, utilisé pour authentifier utilisateurs et applications."},"en":{"q":"How is **Microsoft Entra ID** defined?","o":["A cloud-based identity and access management service that enables user authentication and application management","A file storage service intended for large enterprises","A tool for monitoring the network performance of virtual machines","An automatic backup service for SQL databases"],"e":"**Microsoft Entra ID** (formerly Azure AD) is Azure\u0027s cloud-based identity and access management service, used to authenticate users and applications."}},{"n":25,"a":["C"],"fr":{"q":"Comment définit-on l\u0027**authentification multifacteur** (MFA) ?","o":["L\u0027utilisation d\u0027un seul mot de passe complexe pour sécuriser un compte","La connexion automatique sans aucune vérification d\u0027identité","L\u0027exigence d\u0027au moins deux preuves d\u0027identité distinctes, par exemple un mot de passe et un code envoyé sur un appareil mobile, pour accéder à une ressource","Le partage d\u0027un même mot de passe entre plusieurs utilisateurs d\u0027une équipe"],"e":"La **MFA** renforce la sécurité en exigeant au moins deux facteurs de vérification distincts avant d\u0027accorder l\u0027accès, réduisant le risque lié au seul vol d\u0027un mot de passe."},"en":{"q":"How is **multifactor authentication** (MFA) defined?","o":["Using a single complex password to secure an account","Signing in automatically without any identity verification","Requiring at least two distinct forms of identity proof, such as a password and a code sent to a mobile device, to access a resource","Sharing the same password among several users on a team"],"e":"**MFA** strengthens security by requiring at least two distinct verification factors before granting access, reducing the risk associated with the theft of a password alone."}},{"n":26,"a":["B"],"fr":{"q":"Comment définit-on le **contrôle d\u0027accès en fonction du rôle** (Azure RBAC) ?","o":["Un mécanisme qui chiffre automatiquement toutes les données stockées dans un compte de stockage","Un système permettant d\u0027attribuer des autorisations précises aux utilisateurs selon leur rôle, sur un périmètre défini comme un abonnement ou un groupe de ressources","Un outil qui supprime automatiquement les ressources inactives depuis plus de 30 jours","Un service de sauvegarde incrémentielle des machines virtuelles"],"e":"Le **RBAC** permet d\u0027attribuer des rôles (lecteur, contributeur, propriétaire, etc.) à des utilisateurs ou groupes, avec un périmètre défini au niveau du groupe d\u0027administration, de l\u0027abonnement, du groupe de ressources ou de la ressource."},"en":{"q":"How is **Azure role-based access control** (Azure RBAC) defined?","o":["A mechanism that automatically encrypts all data stored in a storage account","A system for assigning fine-grained permissions to users based on their role, at a defined scope such as a subscription or a resource group","A tool that automatically deletes resources that have been inactive for more than 30 days","An incremental backup service for virtual machines"],"e":"**RBAC** lets you assign roles (Reader, Contributor, Owner, etc.) to users or groups, with a scope defined at the management group, subscription, resource group, or resource level."}},{"n":27,"a":["A"],"fr":{"q":"Comment définit-on le modèle de sécurité **Confiance zéro** (Zero Trust) ?","o":["Un modèle qui vérifie explicitement chaque demande d\u0027accès, sans faire confiance par défaut à un utilisateur ou un appareil, même à l\u0027intérieur du réseau de l\u0027entreprise","Un modèle qui accorde une confiance totale à tout utilisateur situé à l\u0027intérieur du réseau d\u0027entreprise","Un modèle qui supprime toute authentification pour simplifier l\u0027accès aux ressources","Un modèle réservé uniquement aux environnements sur site, non applicable au cloud"],"e":"Le principe de la **Confiance zéro** est de ne jamais faire confiance implicitement et de toujours vérifier explicitement chaque demande d\u0027accès, quel que soit son origine réseau."},"en":{"q":"How is the **Zero Trust** security model defined?","o":["A model that explicitly verifies every access request, without trusting any user or device by default, even inside the corporate network","A model that grants full trust to any user located inside the corporate network","A model that removes all authentication to simplify access to resources","A model reserved solely for on-premises environments, not applicable to the cloud"],"e":"The principle of **Zero Trust** is to never trust implicitly and to always explicitly verify every access request, regardless of its network origin."}},{"n":28,"a":["C"],"fr":{"q":"Quels éléments influencent principalement le coût des services Azure consommés ?","o":["Uniquement la taille de l\u0027équipe informatique de l\u0027entreprise cliente","Le nombre d\u0027employés de Microsoft affectés au support technique","Le type et la quantité de ressources utilisées, la région de déploiement et la durée d\u0027utilisation des services","La couleur du thème choisi dans le portail Azure"],"e":"Le coût d\u0027un service Azure dépend notamment du type et du volume de ressources consommées, de la région choisie et de la durée pendant laquelle les ressources sont utilisées."},"en":{"q":"Which factors mainly affect the cost of consumed Azure services?","o":["Only the size of the customer company\u0027s IT team","The number of Microsoft employees assigned to technical support","The type and quantity of resources used, the deployment region, and the duration of service usage","The color of the theme chosen in the Azure portal"],"e":"The cost of an Azure service depends in particular on the type and volume of resources consumed, the chosen region, and how long the resources are used."}},{"n":29,"a":["B"],"fr":{"q":"À quoi sert la **calculatrice de prix Azure** (Pricing Calculator) ?","o":["À comparer le coût total d\u0027une infrastructure sur site avec celui d\u0027Azure sur plusieurs années","À estimer le coût mensuel des services Azure avant leur déploiement, selon la configuration choisie","À appliquer automatiquement des remises sur les abonnements existants","À générer des factures détaillées pour les abonnements déjà actifs"],"e":"La **calculatrice de prix** permet d\u0027estimer à l\u0027avance le coût mensuel d\u0027une configuration de services Azure, avant même de les déployer."},"en":{"q":"What is the **Azure Pricing calculator** used for?","o":["To compare the total cost of an on-premises infrastructure with that of Azure over several years","To estimate the monthly cost of Azure services before deploying them, based on the chosen configuration","To automatically apply discounts to existing subscriptions","To generate detailed invoices for subscriptions that are already active"],"e":"The **Pricing calculator** lets you estimate in advance the monthly cost of a configuration of Azure services, even before deploying them."}},{"n":30,"a":["A"],"fr":{"q":"À quoi sert la **calculatrice TCO** (coût total de possession) ?","o":["À comparer le coût total d\u0027une infrastructure sur site existante avec le coût équivalent d\u0027une migration vers Azure","À estimer uniquement le prix d\u0027une seule machine virtuelle","À définir des budgets mensuels et des alertes de dépenses","À auditer la conformité des ressources Azure aux stratégies internes"],"e":"La **calculatrice TCO** compare les coûts actuels d\u0027une infrastructure sur site (matériel, électricité, personnel, etc.) au coût projeté d\u0027une migration vers Azure."},"en":{"q":"What is the **TCO calculator** (Total Cost of Ownership) used for?","o":["To compare the total cost of an existing on-premises infrastructure with the equivalent cost of migrating to Azure","To estimate only the price of a single virtual machine","To set monthly budgets and spending alerts","To audit the compliance of Azure resources with internal policies"],"e":"The **TCO calculator** compares the current costs of an on-premises infrastructure (hardware, electricity, staff, etc.) with the projected cost of migrating to Azure."}},{"n":31,"a":["D"],"fr":{"q":"Que permet de faire **Microsoft Cost Management** ?","o":["Attribuer des rôles de sécurité aux utilisateurs d\u0027un abonnement","Déployer automatiquement des ressources via des modèles ARM","Classifier les données sensibles selon leur niveau de confidentialité","Surveiller, analyser les dépenses et définir des budgets avec des alertes pour les ressources Azure"],"e":"**Microsoft Cost Management** permet de suivre les dépenses en temps réel, d\u0027analyser les tendances de coûts et de configurer des budgets avec des alertes."},"en":{"q":"What can you do with **Microsoft Cost Management**?","o":["Assign security roles to the users of a subscription","Automatically deploy resources using ARM templates","Classify sensitive data according to its confidentiality level","Monitor and analyze spending, and set budgets with alerts for Azure resources"],"e":"**Microsoft Cost Management** lets you track spending in real time, analyze cost trends, and configure budgets with alerts."}},{"n":32,"a":["A"],"fr":{"q":"Comment définit-on les **balises** (tags) appliquées aux ressources Azure ?","o":["Des paires nom/valeur associées aux ressources, utilisées notamment pour organiser les coûts par département, projet ou environnement","Des certificats numériques garantissant l\u0027authenticité d\u0027une ressource","Des règles empêchant la suppression accidentelle d\u0027une ressource critique","Des scripts automatisant le déploiement d\u0027une infrastructure complète"],"e":"Les **balises** sont des métadonnées sous forme de paires nom/valeur permettant de classer et de regrouper les ressources, notamment pour le suivi des coûts par projet ou service."},"en":{"q":"How are **tags** applied to Azure resources defined?","o":["Name/value pairs associated with resources, used in particular to organize costs by department, project, or environment","Digital certificates that guarantee the authenticity of a resource","Rules that prevent the accidental deletion of a critical resource","Scripts that automate the deployment of a complete infrastructure"],"e":"**Tags** are metadata in the form of name/value pairs used to categorize and group resources, notably for tracking costs by project or department."}},{"n":33,"a":["C"],"fr":{"q":"Que permet de faire **Azure Policy** ?","o":["Chiffrer automatiquement toutes les communications réseau entre les régions","Fusionner plusieurs abonnements Azure en un seul groupe d\u0027administration","Appliquer et auditer des règles de conformité sur les ressources, par exemple interdire leur création dans certaines régions","Calculer le coût total de possession d\u0027une infrastructure sur site"],"e":"**Azure Policy** évalue et applique des règles de conformité organisationnelles, pouvant par exemple refuser ou signaler la création de ressources non conformes, comme celles situées dans une région interdite."},"en":{"q":"What can you do with **Azure Policy**?","o":["Automatically encrypt all network communications between regions","Merge several Azure subscriptions into a single management group","Enforce and audit compliance rules on resources, for example preventing their creation in certain regions","Calculate the total cost of ownership of an on-premises infrastructure"],"e":"**Azure Policy** evaluates and enforces organizational compliance rules, and can, for example, deny or flag the creation of non-compliant resources, such as those located in a disallowed region."}},{"n":34,"a":["B"],"fr":{"q":"À quoi servent les **verrous de ressources** (resource locks) dans Azure ?","o":["À chiffrer le contenu d\u0027une ressource de stockage","À empêcher la suppression ou la modification accidentelle d\u0027une ressource critique, indépendamment des autorisations RBAC accordées","À limiter la bande passante réseau disponible pour une ressource","À définir automatiquement un budget maximal pour un abonnement"],"e":"Un **verrou de ressource** (type CanNotDelete ou ReadOnly) protège une ressource contre une suppression ou modification accidentelle, même si l\u0027utilisateur dispose des permissions RBAC nécessaires."},"en":{"q":"What are **resource locks** used for in Azure?","o":["To encrypt the contents of a storage resource","To prevent the accidental deletion or modification of a critical resource, regardless of the RBAC permissions granted","To limit the network bandwidth available to a resource","To automatically set a maximum budget for a subscription"],"e":"A **resource lock** (CanNotDelete or ReadOnly type) protects a resource against accidental deletion or modification, even if the user has the necessary RBAC permissions."}},{"n":35,"a":["D"],"fr":{"q":"Que permet de faire **Microsoft Purview** ?","o":["Déployer automatiquement des machines virtuelles identiques à grande échelle","Gérer les connexions VPN entre un site local et Azure","Surveiller les performances applicatives en temps réel","Découvrir, cataloguer et classifier les données de l\u0027organisation, y compris le suivi de leur conformité réglementaire"],"e":"**Microsoft Purview** est une solution de gouvernance des données permettant de les découvrir, les cataloguer, les classifier et de suivre leur conformité à travers l\u0027organisation."},"en":{"q":"What can you do with **Microsoft Purview**?","o":["Automatically deploy identical virtual machines at scale","Manage VPN connections between an on-premises site and Azure","Monitor application performance in real time","Discover, catalog, and classify the organization\u0027s data, including tracking its regulatory compliance"],"e":"**Microsoft Purview** is a data governance solution for discovering, cataloging, and classifying data, and for tracking its compliance across the organization."}},{"n":36,"a":["A","C"],"fr":{"q":"Lesquelles de ces affirmations décrivent correctement l\u0027**infrastructure en tant que code** (IaC) via les modèles ARM ou Bicep dans Azure ?","o":["Elle permet de déployer des ressources de façon déclarative et reproductible","Elle nécessite de recréer manuellement chaque ressource via le portail à chaque déploiement","Elle facilite le versionnement de l\u0027infrastructure dans un système de contrôle de code source","Elle fonctionne uniquement avec des machines virtuelles sous Windows"],"e":"Les modèles **ARM** et **Bicep** décrivent l\u0027infrastructure de façon déclarative, permettant des déploiements reproductibles et un suivi des versions via un dépôt de code source."},"en":{"q":"Which of these statements correctly describe **infrastructure as code** (IaC) using ARM templates or Bicep in Azure?","o":["It lets you deploy resources in a declarative and repeatable way","It requires manually recreating each resource through the portal for every deployment","It makes it easier to version infrastructure in a source control system","It works only with Windows virtual machines"],"e":"**ARM** templates and **Bicep** describe infrastructure declaratively, enabling repeatable deployments and version tracking through a source code repository."}},{"n":37,"a":["B"],"fr":{"q":"Comment définit-on **Azure Cloud Shell** ?","o":["Un service de stockage de scripts partagé entre plusieurs abonnements","Un environnement de ligne de commande accessible depuis un navigateur, préconfiguré avec Azure CLI et Azure PowerShell","Un outil graphique exclusivement destiné à la création de machines virtuelles","Un service permettant de migrer des bases de données SQL vers Azure"],"e":"**Azure Cloud Shell** est un shell interactif accessible directement depuis le navigateur ou le portail Azure, avec Azure CLI et Azure PowerShell déjà installés."},"en":{"q":"How is **Azure Cloud Shell** defined?","o":["A script storage service shared across multiple subscriptions","A browser-accessible command-line environment, preconfigured with Azure CLI and Azure PowerShell","A graphical tool intended exclusively for creating virtual machines","A service for migrating SQL databases to Azure"],"e":"**Azure Cloud Shell** is an interactive shell accessible directly from the browser or the Azure portal, with Azure CLI and Azure PowerShell already installed."}},{"n":38,"a":["C"],"fr":{"q":"À quoi sert **Azure Arc** ?","o":["À créer des réseaux virtuels isolés entre plusieurs abonnements Azure","À remplacer entièrement les machines virtuelles par des conteneurs","À étendre la gestion et la gouvernance Azure à des ressources situées en dehors d\u0027Azure, comme des serveurs sur site ou dans d\u0027autres clouds","À calculer automatiquement le coût total de possession d\u0027une infrastructure"],"e":"**Azure Arc** permet de gérer de façon unifiée, depuis Azure, des ressources hébergées en dehors d\u0027Azure : serveurs sur site, autres clouds ou environnements en périphérie."},"en":{"q":"What is **Azure Arc** used for?","o":["To create isolated virtual networks across multiple Azure subscriptions","To completely replace virtual machines with containers","To extend Azure management and governance to resources located outside Azure, such as on-premises servers or servers in other clouds","To automatically calculate the total cost of ownership of an infrastructure"],"e":"**Azure Arc** provides unified management, from Azure, of resources hosted outside Azure: on-premises servers, other clouds, or edge environments."}},{"n":39,"a":["A"],"fr":{"q":"Que fournit **Azure Advisor** ?","o":["Des recommandations personnalisées pour optimiser les coûts, la sécurité, la fiabilité et les performances des ressources","Un rapport sur la disponibilité globale de la plateforme Azure dans le monde","Un catalogue des données sensibles de l\u0027organisation","Un outil de migration automatique des serveurs physiques vers des machines virtuelles"],"e":"**Azure Advisor** analyse la configuration des ressources déployées et propose des recommandations personnalisées pour en améliorer les coûts, la sécurité, la fiabilité et les performances."},"en":{"q":"What does **Azure Advisor** provide?","o":["Personalized recommendations to optimize the cost, security, reliability, and performance of resources","A report on the overall availability of the Azure platform worldwide","A catalog of the organization\u0027s sensitive data","A tool for automatically migrating physical servers to virtual machines"],"e":"**Azure Advisor** analyzes the configuration of deployed resources and offers personalized recommendations to improve their cost, security, reliability, and performance."}},{"n":40,"a":["B"],"fr":{"q":"Quelle est la différence principale entre **Azure Service Health** et **Azure Monitor** ?","o":["Azure Service Health analyse les journaux applicatifs du client tandis qu\u0027Azure Monitor gère les incidents de la plateforme Azure","Azure Service Health informe sur l\u0027état de la plateforme Azure et les incidents affectant les services du client, tandis qu\u0027Azure Monitor collecte et analyse les données de performance et les journaux des ressources du client","Les deux services sont identiques et interchangeables","Azure Service Health gère uniquement la facturation, tandis qu\u0027Azure Monitor gère uniquement la sécurité"],"e":"**Azure Service Health** signale les incidents et la santé de la plateforme Azure elle-même, alors qu\u0027**Azure Monitor** collecte des métriques et journaux propres aux ressources déployées par le client."},"en":{"q":"What is the main difference between **Azure Service Health** and **Azure Monitor**?","o":["Azure Service Health analyzes the customer\u0027s application logs, while Azure Monitor handles Azure platform incidents","Azure Service Health reports on the status of the Azure platform and incidents affecting the customer\u0027s services, while Azure Monitor collects and analyzes performance data and logs from the customer\u0027s resources","The two services are identical and interchangeable","Azure Service Health handles only billing, while Azure Monitor handles only security"],"e":"**Azure Service Health** reports incidents and the health of the Azure platform itself, whereas **Azure Monitor** collects metrics and logs specific to the resources deployed by the customer."}}]},{"id":2,"title":{"fr":"Examen blanc 2 — Mises en situation","en":"Practice exam 2 — Scenarios"},"questions":[{"n":1,"a":["A"],"fr":{"q":"Une jeune startup veut lancer son service web sans acheter aucun serveur physique et ne payer que selon son usage réel. Quel concept du cloud computing correspond le mieux à cette approche ?","o":["Le modèle de consommation à la demande (pay-as-you-go)","L\u0027achat de licences logicielles perpétuelles","L\u0027investissement en capital (CapEx) dans un datacenter privé","La signature d\u0027un bail immobilier longue durée"],"e":"Le **cloud computing** permet de consommer des ressources à la demande et de payer uniquement ce qui est utilisé, sans investissement initial."},"en":{"q":"A young startup wants to launch its web service without buying any physical servers and pay only for what it actually uses. Which cloud computing concept best matches this approach?","o":["The on-demand consumption model (pay-as-you-go)","Purchasing perpetual software licenses","Capital expenditure (CapEx) in a private datacenter","Signing a long-term real estate lease"],"e":"**Cloud computing** lets you consume resources on demand and pay only for what you use, with no upfront investment."}},{"n":2,"a":["B"],"fr":{"q":"Une entreprise migre ses serveurs applicatifs vers des machines virtuelles Azure et souhaite garder un contrôle total sur le système d\u0027exploitation, les correctifs et les logiciels installés. Quel modèle de service cloud correspond à ce besoin ?","o":["SaaS","IaaS","PaaS","Hébergement on-premises classique"],"e":"**IaaS** fournit l\u0027infrastructure virtualisée (VM, réseau, stockage) tout en laissant le client gérer l\u0027OS et les applications."},"en":{"q":"A company is migrating its application servers to Azure virtual machines and wants to keep full control over the operating system, patches, and installed software. Which cloud service model meets this need?","o":["SaaS","IaaS","PaaS","Traditional on-premises hosting"],"e":"**IaaS** provides virtualized infrastructure (VMs, networking, storage) while leaving the customer to manage the OS and applications."}},{"n":3,"a":["C"],"fr":{"q":"Une équipe de développement veut déployer rapidement une application web sans gérer ni serveurs, ni système d\u0027exploitation, ni environnement d\u0027exécution, tout en gardant la main sur le code. Quel modèle de service convient ?","o":["IaaS","SaaS","PaaS","On-premises"],"e":"**PaaS** fournit une plateforme managée sur laquelle le client déploie uniquement son code applicatif."},"en":{"q":"A development team wants to quickly deploy a web application without managing servers, an operating system, or a runtime environment, while keeping control over the code. Which service model is appropriate?","o":["IaaS","SaaS","PaaS","On-premises"],"e":"**PaaS** provides a managed platform on which the customer deploys only their application code."}},{"n":4,"a":["B"],"fr":{"q":"Les employés d\u0027une PME utilisent une messagerie et une suite bureautique accessibles via un navigateur, sans aucune installation ni maintenance de serveur de leur côté. De quel modèle s\u0027agit-il ?","o":["PaaS","SaaS","IaaS","Cloud privé"],"e":"**SaaS** délivre une application complète prête à l\u0027emploi, l\u0027éditeur gérant entièrement l\u0027infrastructure."},"en":{"q":"The employees of a small business use email and an office suite accessed through a web browser, with no server installation or maintenance on their side. Which model is this?","o":["PaaS","SaaS","IaaS","Private cloud"],"e":"**SaaS** delivers a complete, ready-to-use application, with the vendor fully managing the infrastructure."}},{"n":5,"a":["B"],"fr":{"q":"Dans un scénario IaaS sur Azure, qui est responsable de l\u0027application des correctifs de sécurité du système d\u0027exploitation de la machine virtuelle ?","o":["Microsoft, car Azure gère toute l\u0027infrastructure","Le client, car il contrôle l\u0027OS invité dans ce modèle","Un tiers désigné obligatoirement par Microsoft","Personne, les correctifs sont automatiques dans tous les modèles"],"e":"Dans le **modèle de responsabilité partagée**, le client reste responsable de l\u0027OS invité en IaaS, Microsoft gérant l\u0027infrastructure physique."},"en":{"q":"In an IaaS scenario on Azure, who is responsible for applying security patches to the virtual machine\u0027s operating system?","o":["Microsoft, because Azure manages all the infrastructure","The customer, because they control the guest OS in this model","A third party mandatorily designated by Microsoft","No one, patches are automatic in all models"],"e":"Under the **shared responsibility model**, the customer remains responsible for the guest OS in IaaS, while Microsoft manages the physical infrastructure."}},{"n":6,"a":["C"],"fr":{"q":"Une banque doit conserver ses données clients les plus sensibles dans son propre datacenter pour des raisons réglementaires, tout en hébergeant son site public dans le cloud pour profiter de son élasticité. Quel modèle de déploiement correspond ?","o":["Cloud public uniquement","Cloud privé uniquement","Cloud hybride","Edge computing"],"e":"Le **cloud hybride** combine ressources on-premises et cloud public, permettant de garder les données sensibles en interne."},"en":{"q":"A bank must keep its most sensitive customer data in its own datacenter for regulatory reasons, while hosting its public website in the cloud to take advantage of its elasticity. Which deployment model fits?","o":["Public cloud only","Private cloud only","Hybrid cloud","Edge computing"],"e":"The **hybrid cloud** combines on-premises resources and the public cloud, allowing sensitive data to be kept in-house."}},{"n":7,"a":["A"],"fr":{"q":"Un groupe industriel utilise à la fois Azure et un autre fournisseur cloud concurrent afin de ne pas dépendre d\u0027un seul éditeur. Comment appelle-t-on cette stratégie ?","o":["Une approche multicloud","Une approche hybride","Une architecture serverless","Une approche on-premises"],"e":"Le **multicloud** consiste à utiliser plusieurs fournisseurs cloud différents, notamment pour éviter la dépendance à un seul prestataire."},"en":{"q":"An industrial group uses both Azure and another competing cloud provider so as not to depend on a single vendor. What is this strategy called?","o":["A multicloud approach","A hybrid approach","A serverless architecture","An on-premises approach"],"e":"**Multicloud** means using several different cloud providers, notably to avoid dependency on a single provider."}},{"n":8,"a":["B"],"fr":{"q":"Une entreprise qui louait auparavant des serveurs physiques (dépense amortie sur plusieurs années) bascule vers Azure et paie désormais mensuellement selon sa consommation réelle. Comment qualifie-t-on ce changement financier ?","o":["Passage d\u0027une dépense opérationnelle à une dépense d\u0027investissement","Passage d\u0027une dépense d\u0027investissement (CapEx) à une dépense opérationnelle (OpEx)","La suppression totale des coûts informatiques","Le passage à une licence perpétuelle"],"e":"Le cloud transforme les dépenses d\u0027investissement (**CapEx**) en dépenses opérationnelles (**OpEx**), payées au fil de l\u0027utilisation."},"en":{"q":"A company that previously leased physical servers (an expense depreciated over several years) moves to Azure and now pays monthly based on its actual consumption. How is this financial change described?","o":["A shift from operational expenditure to capital expenditure","A shift from capital expenditure (CapEx) to operational expenditure (OpEx)","The complete elimination of IT costs","A move to a perpetual license"],"e":"The cloud turns capital expenditure (**CapEx**) into operational expenditure (**OpEx**), paid as you go."}},{"n":9,"a":["A","B"],"fr":{"q":"Un site e-commerce connaît un pic de trafic important chaque année lors d\u0027une opération commerciale. Quelles sont deux approches possibles pour adapter la capacité sur Azure ?","o":["Augmenter la taille (vCPU/RAM) des VM existantes","Ajouter automatiquement des instances supplémentaires identiques","Réduire le nombre de zones de disponibilité utilisées","Désactiver la redondance du stockage pendant le pic"],"e":"On peut adapter la capacité verticalement (plus grosse VM) ou horizontalement (plus d\u0027instances) : ces deux approches constituent la **mise à l\u0027échelle**."},"en":{"q":"An e-commerce website experiences a major traffic spike every year during a sales event. Which two approaches can be used to adjust capacity on Azure?","o":["Increase the size (vCPU/RAM) of the existing VMs","Automatically add additional identical instances","Reduce the number of availability zones used","Disable storage redundancy during the spike"],"e":"Capacity can be adjusted vertically (a bigger VM) or horizontally (more instances): these two approaches constitute **scaling**."}},{"n":10,"a":["A"],"fr":{"q":"Un éditeur de logiciels promet contractuellement à ses clients que son service Azure sera disponible au moins 99,9 % du temps chaque mois, sous peine de compensation. Comment appelle-t-on cet engagement ?","o":["Un contrat de niveau de service (SLA)","Une politique Azure Policy","Un verrou de ressource","Une zone de disponibilité"],"e":"Le **SLA** (Service Level Agreement) définit formellement l\u0027engagement de disponibilité garanti par le fournisseur."},"en":{"q":"A software vendor contractually promises its customers that its Azure service will be available at least 99.9% of the time each month, or they will be compensated. What is this commitment called?","o":["A service-level agreement (SLA)","An Azure Policy policy","A resource lock","An availability zone"],"e":"The **SLA** (Service Level Agreement) formally defines the availability commitment guaranteed by the provider."}},{"n":11,"a":["A"],"fr":{"q":"Une petite entreprise veut exécuter un bout de code déclenché uniquement lors de la réception d\u0027un fichier, sans jamais provisionner de serveur, et ne payer que le temps d\u0027exécution réel. Quel concept décrit le mieux ce besoin ?","o":["L\u0027informatique serverless (sans serveur)","Le cloud privé","L\u0027investissement CapEx","La haute disponibilité"],"e":"Le modèle **serverless** exécute du code à la demande et ne facture que le temps d\u0027exécution réel, sans gestion d\u0027infrastructure."},"en":{"q":"A small business wants to run a piece of code triggered only when a file is received, without ever provisioning a server, and pay only for the actual execution time. Which concept best describes this need?","o":["Serverless computing","Private cloud","CapEx investment","High availability"],"e":"The **serverless** model runs code on demand and bills only for the actual execution time, with no infrastructure to manage."}},{"n":12,"a":["B"],"fr":{"q":"Une entreprise veut que ses données soient automatiquement répliquées vers une seconde région Azure suffisamment distante, afin de pouvoir reprendre son activité en cas de sinistre régional majeur. Quel concept Azure répond à ce besoin ?","o":["Les zones de disponibilité","Les régions jumelées (paired regions)","Les groupes à haute disponibilité","Un groupe d\u0027administration (management group)"],"e":"Les **régions jumelées** associent deux régions Azure distantes conçues pour la reprise après sinistre, avec réplication et priorité de restauration."},"en":{"q":"A company wants its data to be automatically replicated to a second, sufficiently distant Azure region so it can resume operations in the event of a major regional disaster. Which Azure concept meets this need?","o":["Availability zones","Region pairs (paired regions)","Availability sets","A management group"],"e":"**Region pairs** associate two distant Azure regions designed for disaster recovery, with replication and recovery prioritization."}},{"n":13,"a":["A"],"fr":{"q":"Une application critique doit rester disponible même si un datacenter entier d\u0027une région Azure subit une panne. Quelle fonctionnalité permet de répartir les ressources sur des emplacements physiquement distincts au sein d\u0027une même région ?","o":["Les zones de disponibilité","Les régions souveraines","Le peering de réseaux virtuels","Azure Front Door uniquement"],"e":"Les **zones de disponibilité** sont des emplacements physiquement séparés, avec alimentation et réseau indépendants, au sein d\u0027une même région."},"en":{"q":"A critical application must remain available even if an entire datacenter in an Azure region suffers an outage. Which feature lets you distribute resources across physically separate locations within the same region?","o":["Availability zones","Sovereign regions","Virtual network peering","Azure Front Door only"],"e":"**Availability zones** are physically separate locations, with independent power and networking, within the same region."}},{"n":14,"a":["B"],"fr":{"q":"Le service IT d\u0027un grand groupe veut appliquer une même politique de conformité à plusieurs souscriptions Azure de différentes filiales, en une seule opération. Quel niveau de la hiérarchie Azure doit-il utiliser ?","o":["Un groupe de ressources","Un groupe d\u0027administration (management group)","Une zone de disponibilité","Un tag de ressource"],"e":"Les **management groups** se situent au-dessus des souscriptions et permettent d\u0027appliquer des stratégies communes à plusieurs souscriptions."},"en":{"q":"The IT department of a large group wants to apply the same compliance policy to several Azure subscriptions belonging to different subsidiaries in a single operation. Which level of the Azure hierarchy should it use?","o":["A resource group","A management group","An availability zone","A resource tag"],"e":"**Management groups** sit above subscriptions and let you apply common policies to multiple subscriptions."}},{"n":15,"a":["C"],"fr":{"q":"Un site web connaît des variations de trafic imprévisibles et l\u0027équipe veut qu\u0027Azure ajoute ou retire automatiquement des machines virtuelles identiques selon la charge. Quel service est conçu pour cela ?","o":["Azure Virtual Desktop","Les groupes à haute disponibilité (availability sets)","Les groupes identiques de machines virtuelles (VM Scale Sets)","Azure Container Instances"],"e":"Les **VM Scale Sets** permettent de créer et gérer un groupe de VM identiques qui s\u0027adaptent automatiquement à la demande."},"en":{"q":"A website experiences unpredictable traffic variations, and the team wants Azure to automatically add or remove identical virtual machines based on load. Which service is designed for this?","o":["Azure Virtual Desktop","Availability sets","Virtual machine scale sets (VM Scale Sets)","Azure Container Instances"],"e":"**VM Scale Sets** let you create and manage a group of identical VMs that automatically adapt to demand."}},{"n":16,"a":["A"],"fr":{"q":"Une entreprise veut permettre à ses employés en télétravail d\u0027accéder, depuis n\u0027importe quel appareil, à un bureau Windows complet hébergé de façon centralisée dans Azure. Quel service répond à ce besoin ?","o":["Azure Virtual Desktop","Azure App Service","Azure Container Apps","Azure Bastion"],"e":"**Azure Virtual Desktop** permet d\u0027accéder à distance à un environnement de bureau et d\u0027applications Windows centralisé et managé."},"en":{"q":"A company wants to allow its remote employees to access, from any device, a full Windows desktop hosted centrally in Azure. Which service meets this need?","o":["Azure Virtual Desktop","Azure App Service","Azure Container Apps","Azure Bastion"],"e":"**Azure Virtual Desktop** provides remote access to a centralized, managed Windows desktop and application environment."}},{"n":17,"a":["B"],"fr":{"q":"Un développeur veut exécuter rapidement un seul conteneur isolé pour une tâche ponctuelle, sans provisionner de cluster ni gérer d\u0027orchestrateur. Quel service Azure est le plus adapté ?","o":["Azure Kubernetes Service (AKS)","Azure Container Instances (ACI)","Azure Virtual Desktop","Azure Functions Premium uniquement"],"e":"**Azure Container Instances** permet d\u0027exécuter des conteneurs isolés rapidement, sans machines virtuelles ni orchestrateur à gérer."},"en":{"q":"A developer wants to quickly run a single isolated container for a one-off task, without provisioning a cluster or managing an orchestrator. Which Azure service is the most suitable?","o":["Azure Kubernetes Service (AKS)","Azure Container Instances (ACI)","Azure Virtual Desktop","Azure Functions Premium only"],"e":"**Azure Container Instances** lets you run isolated containers quickly, with no virtual machines or orchestrator to manage."}},{"n":18,"a":["B"],"fr":{"q":"Une entreprise exploite des dizaines de microservices conteneurisés et a besoin d\u0027un orchestrateur complet pour gérer leur déploiement et leur résilience à grande échelle. Quel service Azure correspond ?","o":["Azure Container Instances","Azure Kubernetes Service (AKS)","Azure Files","Azure Logic Apps"],"e":"**AKS** est un service managé de Kubernetes qui orchestre le déploiement et la mise à l\u0027échelle de nombreux conteneurs."},"en":{"q":"A company runs dozens of containerized microservices and needs a full-featured orchestrator to manage their deployment and resilience at scale. Which Azure service fits?","o":["Azure Container Instances","Azure Kubernetes Service (AKS)","Azure Files","Azure Logic Apps"],"e":"**AKS** is a managed Kubernetes service that orchestrates the deployment and scaling of many containers."}},{"n":19,"a":["A"],"fr":{"q":"Une entreprise veut exécuter un petit bout de code uniquement lorsqu\u0027un fichier est déposé dans un espace de stockage, et ne payer que les quelques secondes d\u0027exécution réelle, sans gérer de serveur. Quel service Azure correspond le mieux ?","o":["Azure Functions","Azure Virtual Machines","Azure Kubernetes Service","Azure App Service en plan dédié"],"e":"**Azure Functions** est une solution serverless événementielle qui exécute du code à la demande et facture uniquement l\u0027exécution réelle."},"en":{"q":"A company wants to run a small piece of code only when a file is dropped into a storage location, and pay only for the few seconds of actual execution, without managing a server. Which Azure service fits best?","o":["Azure Functions","Azure Virtual Machines","Azure Kubernetes Service","Azure App Service on a dedicated plan"],"e":"**Azure Functions** is an event-driven serverless solution that runs code on demand and bills only for actual execution."}},{"n":20,"a":["A"],"fr":{"q":"Une équipe veut héberger une application web ASP.NET sans gérer de machine virtuelle ni de système d\u0027exploitation, tout en bénéficiant de la mise à l\u0027échelle automatique. Quel service choisir ?","o":["Azure App Service","Azure Container Instances","Azure Bastion","Azure ExpressRoute"],"e":"**Azure App Service** est une plateforme PaaS entièrement managée dédiée à l\u0027hébergement d\u0027applications web et d\u0027API."},"en":{"q":"A team wants to host an ASP.NET web application without managing a virtual machine or an operating system, while benefiting from automatic scaling. Which service should they choose?","o":["Azure App Service","Azure Container Instances","Azure Bastion","Azure ExpressRoute"],"e":"**Azure App Service** is a fully managed PaaS platform dedicated to hosting web applications and APIs."}},{"n":21,"a":["B"],"fr":{"q":"Deux réseaux virtuels Azure situés dans des régions différentes doivent communiquer entre eux via le réseau principal de Microsoft, sans transiter par Internet public. Quelle fonctionnalité permet cela ?","o":["Azure VPN Gateway","Le peering de réseaux virtuels (VNet peering)","Azure DNS","Un point de terminaison public"],"e":"Le **peering de VNet** connecte deux réseaux virtuels via le réseau principal Microsoft, offrant une communication privée à faible latence."},"en":{"q":"Two Azure virtual networks located in different regions must communicate with each other over the Microsoft backbone network, without traversing the public internet. Which feature enables this?","o":["Azure VPN Gateway","Virtual network peering (VNet peering)","Azure DNS","A public endpoint"],"e":"**VNet peering** connects two virtual networks over the Microsoft backbone network, providing private, low-latency communication."}},{"n":22,"a":["B"],"fr":{"q":"Une entreprise financière veut établir une connexion privée et dédiée entre son datacenter et Azure, avec une latence prévisible, sans transiter par Internet public. Quel service Azure recommander ?","o":["Azure VPN Gateway standard","Azure ExpressRoute","Azure Front Door","Azure DNS"],"e":"**ExpressRoute** établit une connexion privée dédiée vers Azure en contournant Internet public, contrairement au VPN Gateway qui utilise un tunnel chiffré sur Internet."},"en":{"q":"A financial company wants to establish a private, dedicated connection between its datacenter and Azure, with predictable latency, without traversing the public internet. Which Azure service should be recommended?","o":["Standard Azure VPN Gateway","Azure ExpressRoute","Azure Front Door","Azure DNS"],"e":"**ExpressRoute** establishes a dedicated private connection to Azure that bypasses the public internet, unlike VPN Gateway, which uses an encrypted tunnel over the internet."}},{"n":23,"a":["B","D"],"fr":{"q":"Une entreprise veut que ses données de stockage Azure restent accessibles même en cas de panne complète de la région principale. Parmi les options de redondance suivantes, lesquelles répliquent les données vers une région secondaire distante ?","o":["Stockage localement redondant (LRS)","Stockage géo-redondant (GRS)","Stockage à zone redondante (ZRS)","Stockage géo-zone-redondant (GZRS)"],"e":"**GRS** et **GZRS** répliquent les données vers une région secondaire distante, alors que LRS et ZRS ne protègent qu\u0027au sein de la région principale."},"en":{"q":"A company wants its Azure Storage data to remain accessible even if the primary region suffers a complete outage. Which of the following redundancy options replicate data to a distant secondary region?","o":["Locally redundant storage (LRS)","Geo-redundant storage (GRS)","Zone-redundant storage (ZRS)","Geo-zone-redundant storage (GZRS)"],"e":"**GRS** and **GZRS** replicate data to a distant secondary region, whereas LRS and ZRS only provide protection within the primary region."}},{"n":24,"a":["C"],"fr":{"q":"Une société d\u0027archivage légal doit conserver des documents qu\u0027elle ne consultera presque jamais pendant plusieurs années et veut minimiser le coût de stockage, en acceptant un délai de récupération plus long. Quel niveau d\u0027accès Blob Storage choisir ?","o":["Niveau Chaud (Hot)","Niveau Froid (Cool)","Niveau Archive","Niveau Premium"],"e":"Le niveau **Archive** offre le coût de stockage le plus bas, adapté aux données rarement consultées, au prix d\u0027un temps de récupération plus long."},"en":{"q":"A legal archiving company must retain documents that it will almost never access for several years and wants to minimize storage costs, accepting a longer retrieval time. Which Blob Storage access tier should it choose?","o":["Hot tier","Cool tier","Archive tier","Premium tier"],"e":"The **Archive** tier offers the lowest storage cost, suited to rarely accessed data, at the cost of a longer retrieval time."}},{"n":25,"a":["A","C"],"fr":{"q":"Une entreprise veut renforcer la sécurité des connexions à Microsoft Entra ID en exigeant une vérification supplémentaire en plus du mot de passe. Parmi les éléments suivants, lesquels sont des facteurs d\u0027authentification multifacteur valides ?","o":["Une notification approuvée depuis Microsoft Authenticator","Une question secrète définie par l\u0027utilisateur","Un code à usage unique envoyé par SMS ou généré par une application","Le simple fait de ressaisir le même mot de passe"],"e":"L\u0027**authentification multifacteur** s\u0027appuie sur des facteurs vérifiables comme une notification d\u0027application ou un code à usage unique ; les questions secrètes ne sont pas un facteur MFA valide."},"en":{"q":"A company wants to strengthen the security of sign-ins to Microsoft Entra ID by requiring additional verification on top of the password. Which of the following are valid multifactor authentication factors?","o":["A notification approved in Microsoft Authenticator","A secret question defined by the user","A one-time code sent by SMS or generated by an app","Simply re-entering the same password"],"e":"**M
