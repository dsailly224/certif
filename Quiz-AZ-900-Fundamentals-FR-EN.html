 while keeping very low latency, a company spreads its VMs across several physically separate but nearby locations within the same region. What is it configuring?","o":["Availability zones","Sovereign regions","Virtual network peering","A VPN gateway"],"e":"**Availability zones** are physically separate locations within the same region, protecting against datacenter failures with low latency between them."}},{"n":14,"a":["A"],"fr":{"q":"Une entreprise veut appliquer un budget distinct par équipe (marketing, finance, IT) et regrouper les ressources correspondantes séparément pour analyser leurs coûts respectifs. À quel niveau de la hiérarchie Azure doit-elle organiser ces ressources ?","o":["En créant un groupe de ressources par équipe à l\u0027intérieur de la souscription","En créant un seul groupe de ressources commun pour toute l\u0027entreprise","En modifiant uniquement les tags au niveau de l\u0027abonnement racine","En créant un seul locataire (tenant) Microsoft Entra par ressource"],"e":"Organiser les ressources en **groupes de ressources** distincts par équipe facilite le suivi des coûts, l\u0027application de budgets et la gestion des accès propres à chaque groupe."},"en":{"q":"A company wants to apply a separate budget for each team (marketing, finance, IT) and group the corresponding resources separately to analyze their respective costs. At which level of the Azure hierarchy should it organize these resources?","o":["By creating one resource group per team within the subscription","By creating a single shared resource group for the entire company","By only modifying tags at the root subscription level","By creating a single Microsoft Entra tenant per resource"],"e":"Organizing resources into separate **resource groups** per team makes it easier to track costs, apply budgets, and manage access specific to each group."}},{"n":15,"a":["B"],"fr":{"q":"Une agence gouvernementale américaine doit héberger ses données dans un environnement cloud physiquement et logiquement isolé des autres clients Azure, pour répondre à des exigences de conformité strictes. Quel type de région utilise-t-elle ?","o":["Une région périphérique (Edge)","Une région souveraine (sovereign region)","Une zone de disponibilité partagée","Une région bêta"],"e":"Les **régions souveraines** comme Azure Government sont des instances physiquement isolées répondant à des exigences réglementaires ou de conformité spécifiques."},"en":{"q":"A US government agency must host its data in a cloud environment that is physically and logically isolated from other Azure customers to meet strict compliance requirements. Which type of region does it use?","o":["An Edge region","A sovereign region","A shared availability zone","A beta region"],"e":"**Sovereign regions** such as Azure Government are physically isolated instances that meet specific regulatory or compliance requirements."}},{"n":16,"a":["B"],"fr":{"q":"Une entreprise souhaite exécuter un conteneur ponctuel pour un traitement de courte durée, sans provisionner ni gérer de machines virtuelles ni de cluster, en payant uniquement le temps d\u0027exécution. Quel service Azure est le plus adapté ?","o":["Azure Kubernetes Service (AKS)","Azure Container Instances (ACI)","Virtual Machine Scale Sets","Azure Virtual Desktop"],"e":"**Azure Container Instances** permet d\u0027exécuter des conteneurs isolés rapidement, sans gérer de serveurs ni de cluster, en payant à la seconde d\u0027utilisation."},"en":{"q":"A company wants to run a one-off container for a short processing task, without provisioning or managing virtual machines or a cluster, paying only for execution time. Which Azure service is the most suitable?","o":["Azure Kubernetes Service (AKS)","Azure Container Instances (ACI)","Virtual Machine Scale Sets","Azure Virtual Desktop"],"e":"**Azure Container Instances** lets you quickly run isolated containers without managing servers or a cluster, paying per second of usage."}},{"n":17,"a":["B"],"fr":{"q":"Une entreprise a une fonction serverless qui doit répondre instantanément sans délai de démarrage à froid, tout en gardant une certaine élasticité des coûts. Quel plan Azure Functions doit-elle choisir plutôt que le plan de consommation standard ?","o":["Le plan de consommation (Consumption)","Le plan Premium","Un plan App Service Free","Le niveau de stockage Blob Archive"],"e":"Le **plan Premium** d\u0027Azure Functions maintient des instances préchauffées pour éviter les démarrages à froid, tout en conservant une facturation liée à l\u0027usage."},"en":{"q":"A company has a serverless function that must respond instantly with no cold start delay, while still keeping some cost elasticity. Which Azure Functions plan should it choose instead of the standard Consumption plan?","o":["The Consumption plan","The Premium plan","An App Service Free plan","The Blob Archive storage tier"],"e":"The Azure Functions **Premium plan** keeps prewarmed instances to avoid cold starts, while still keeping usage-based billing."}},{"n":18,"a":["A"],"fr":{"q":"Une petite application de démonstration interne, sans trafic de production, doit être hébergée au moindre coût possible sur Azure App Service. Quel niveau tarifaire choisir ?","o":["Le niveau Gratuit (F1) ou Partagé","Le niveau Premium v3","Le niveau Isolé","Le niveau dédié aux environnements de haute disponibilité multi-régions"],"e":"Le niveau **Gratuit/Partagé** d\u0027App Service convient aux applications de test ou de démonstration à très faible trafic, sans frais ni garanties de performance élevées."},"en":{"q":"A small internal demo application with no production traffic must be hosted at the lowest possible cost on Azure App Service. Which pricing tier should be chosen?","o":["The Free (F1) or Shared tier","The Premium v3 tier","The Isolated tier","The tier dedicated to multi-region high-availability environments"],"e":"The App Service **Free/Shared** tier is suitable for test or demo applications with very low traffic, at no cost and without high performance guarantees."}},{"n":19,"a":["A"],"fr":{"q":"Deux réseaux virtuels Azure situés dans des régions différentes doivent communiquer directement entre eux via le réseau principal de Microsoft, sans passer par Internet public. Quelle fonctionnalité permet cela ?","o":["Le peering de réseaux virtuels (VNet peering)","Un sous-réseau partagé","Azure DNS public","Un point de terminaison public"],"e":"Le **peering de réseaux virtuels** connecte deux VNet via le réseau principal de Microsoft, même entre régions différentes, sans transiter par Internet."},"en":{"q":"Two Azure virtual networks located in different regions must communicate directly with each other over the Microsoft backbone network, without going through the public internet. Which feature enables this?","o":["Virtual network peering (VNet peering)","A shared subnet","Public Azure DNS","A public endpoint"],"e":"**Virtual network peering** connects two VNets over the Microsoft backbone network, even across different regions, without traversing the internet."}},{"n":20,"a":["A"],"fr":{"q":"Une entreprise a besoin d\u0027une connexion privée et dédiée entre son datacenter et Azure, avec une bande passante garantie et sans transiter par Internet public, pour des transferts de données volumineux et critiques. Quelle solution choisir plutôt qu\u0027un VPN classique ?","o":["Azure ExpressRoute","Azure VPN Gateway de site à site","Un point de terminaison privé uniquement","Le peering de réseaux virtuels"],"e":"**Azure ExpressRoute** fournit une connexion privée dédiée avec une bande passante garantie, contrairement au VPN de site à site qui transite via Internet."},"en":{"q":"A company needs a private, dedicated connection between its datacenter and Azure, with guaranteed bandwidth and without traversing the public internet, for large and critical data transfers. Which solution should it choose instead of a traditional VPN?","o":["Azure ExpressRoute","Site-to-site Azure VPN Gateway","A private endpoint only","Virtual network peering"],"e":"**Azure ExpressRoute** provides a dedicated private connection with guaranteed bandwidth, unlike a site-to-site VPN, which travels over the internet."}},{"n":21,"a":["C"],"fr":{"q":"Une entreprise conserve des journaux d\u0027audit qu\u0027elle doit garder sept ans mais qu\u0027elle consultera très rarement, en acceptant un délai de récupération de plusieurs heures en échange du coût de stockage le plus bas. Quel niveau d\u0027accès Blob Storage est le plus économique ?","o":["Le niveau Chaud (Hot)","Le niveau Froid (Cool)","Le niveau Archive","Le niveau Premium SSD"],"e":"Le niveau **Archive** offre le coût de stockage le plus bas, adapté aux données rarement consultées, au prix d\u0027un délai de réhydratation avant accès."},"en":{"q":"A company stores audit logs that it must keep for seven years but will access very rarely, accepting a retrieval delay of several hours in exchange for the lowest storage cost. Which Blob Storage access tier is the most cost-effective?","o":["The Hot tier","The Cool tier","The Archive tier","The Premium SSD tier"],"e":"The **Archive** tier offers the lowest storage cost, suited to rarely accessed data, at the price of a rehydration delay before access."}},{"n":22,"a":["B","D"],"fr":{"q":"Parmi les options de redondance de stockage Azure suivantes, lesquelles DEUX répliquent automatiquement les données vers une région secondaire géographiquement distante ?","o":["LRS (Locally Redundant Storage)","GRS (Geo-Redundant Storage)","ZRS (Zone-Redundant Storage)","GZRS (Geo-Zone-Redundant Storage)"],"e":"**GRS** et **GZRS** répliquent les données vers une région secondaire distante, contrairement à LRS et ZRS qui restent dans la région principale."},"en":{"q":"Which TWO of the following Azure Storage redundancy options automatically replicate data to a geographically distant secondary region?","o":["LRS (Locally Redundant Storage)","GRS (Geo-Redundant Storage)","ZRS (Zone-Redundant Storage)","GZRS (Geo-Zone-Redundant Storage)"],"e":"**GRS** and **GZRS** replicate data to a distant secondary region, unlike LRS and ZRS, which stay within the primary region."}},{"n":23,"a":["B"],"fr":{"q":"Une entreprise remarque que sa facture Azure augmente fortement à cause du volume de données que ses applications renvoient vers Internet chaque mois. Quel type de trafic est principalement facturé dans ce cas ?","o":["Le trafic entrant (ingress) vers Azure","Le trafic sortant (egress/outbound) depuis Azure","Le trafic interne entre deux VM du même sous-réseau","Le trafic de réplication entre zones de disponibilité d\u0027une même région"],"e":"Chez Azure, le **trafic sortant (egress)** vers Internet est généralement facturé, tandis que le trafic entrant est le plus souvent gratuit."},"en":{"q":"A company notices that its Azure bill is rising sharply because of the volume of data its applications send out to the internet each month. Which type of traffic is primarily billed in this case?","o":["Inbound (ingress) traffic into Azure","Outbound (egress) traffic from Azure","Internal traffic between two VMs in the same subnet","Replication traffic between availability zones in the same region"],"e":"In Azure, **outbound (egress) traffic** to the internet is generally billed, while inbound traffic is usually free."}},{"n":24,"a":["B"],"fr":{"q":"Une entreprise doit transférer plusieurs centaines de téraoctets de données vers Azure, mais sa connexion Internet est trop lente et coûteuse pour un transfert en ligne dans un délai raisonnable. Quelle solution Azure est conçue pour ce besoin ?","o":["AzCopy en ligne de commande","Azure Data Box (transfert physique hors ligne)","Azure Storage Explorer","Azure File Sync"],"e":"**Azure Data Box** permet de transférer de très gros volumes de données hors ligne via un boîtier physique expédié, évitant les coûts et délais d\u0027un transfert réseau massif."},"en":{"q":"A company must transfer several hundred terabytes of data to Azure, but its internet connection is too slow and expensive for an online transfer within a reasonable timeframe. Which Azure solution is designed for this need?","o":["AzCopy from the command line","Azure Data Box (offline physical transfer)","Azure Storage Explorer","Azure File Sync"],"e":"**Azure Data Box** lets you transfer very large volumes of data offline using a shipped physical device, avoiding the costs and delays of a massive network transfer."}},{"n":25,"a":["B"],"fr":{"q":"Les employés d\u0027une entreprise doivent se connecter une seule fois pour accéder à plusieurs applications cloud (Microsoft 365, applications SaaS tierces) sans ressaisir leurs identifiants à chaque fois. Quelle fonctionnalité Microsoft Entra ID répond à ce besoin ?","o":["L\u0027authentification multifacteur (MFA)","L\u0027authentification unique (Single Sign-On)","Les identités externes B2B","Les verrous de ressources"],"e":"L\u0027**authentification unique (SSO)** permet aux utilisateurs de s\u0027authentifier une seule fois pour accéder à plusieurs applications sans ressaisir leurs identifiants."},"en":{"q":"A company\u0027s employees must sign in only once to access multiple cloud applications (Microsoft 365, third-party SaaS applications) without re-entering their credentials each time. Which Microsoft Entra ID feature meets this need?","o":["Multifactor authentication (MFA)","Single sign-on (SSO)","B2B external identities","Resource locks"],"e":"**Single sign-on (SSO)** lets users authenticate once to access multiple applications without re-entering their credentials."}},{"n":26,"a":["A","C"],"fr":{"q":"Parmi les méthodes suivantes, lesquelles DEUX sont des méthodes d\u0027authentification sans mot de passe prises en charge par Microsoft Entra ID ?","o":["Windows Hello Entreprise","Un mot de passe complexe renouvelé tous les 30 jours","Une clé de sécurité FIDO2","Un nom d\u0027utilisateur et mot de passe classique avec question secrète"],"e":"**Windows Hello Entreprise** et les **clés de sécurité FIDO2** permettent une authentification sans mot de passe, renforçant la sécurité et l\u0027expérience utilisateur."},"en":{"q":"Which TWO of the following are passwordless authentication methods supported by Microsoft Entra ID?","o":["Windows Hello for Business","A complex password renewed every 30 days","A FIDO2 security key","A traditional username and password with a security question"],"e":"**Windows Hello for Business** and **FIDO2 security keys** enable passwordless authentication, improving both security and user experience."}},{"n":27,"a":["B"],"fr":{"q":"Une entreprise veut autoriser un administrateur à gérer uniquement les machines virtuelles d\u0027un groupe de ressources précis, sans pouvoir modifier les paramètres de facturation ni les autres ressources. Quel mécanisme Azure permet cette granularité ?","o":["Microsoft Entra Domain Services","Le contrôle d\u0027accès en fonction du rôle (Azure RBAC)","Un verrou de ressource en lecture seule","Azure Policy uniquement"],"e":"**Azure RBAC** permet d\u0027attribuer des rôles avec des permissions précises à une étendue spécifique (ressource, groupe de ressources, souscription), appliquant le principe du moindre privilège."},"en":{"q":"A company wants to allow an administrator to manage only the virtual machines in a specific resource group, without being able to change billing settings or other resources. Which Azure mechanism provides this granularity?","o":["Microsoft Entra Domain Services","Azure role-based access control (Azure RBAC)","A read-only resource lock","Azure Policy only"],"e":"**Azure RBAC** lets you assign roles with specific permissions at a given scope (resource, resource group, subscription), enforcing the principle of least privilege."}},{"n":28,"a":["B"],"fr":{"q":"Une entreprise encore hébergée sur site veut comparer le coût total de son infrastructure actuelle (serveurs, électricité, personnel) avec le coût estimé d\u0027une migration vers Azure. Quel outil Microsoft doit-elle utiliser ?","o":["La calculatrice de prix Azure (Pricing Calculator)","La calculatrice de coût total de possession (TCO Calculator)","Azure Advisor","Azure Cost Management"],"e":"La **calculatrice TCO** compare le coût total de possession d\u0027une infrastructure sur site avec le coût estimé d\u0027une solution équivalente sur Azure."},"en":{"q":"A company still hosted on-premises wants to compare the total cost of its current infrastructure (servers, electricity, staff) with the estimated cost of migrating to Azure. Which Microsoft tool should it use?","o":["The Azure Pricing calculator","The Total Cost of Ownership (TCO) calculator","Azure Advisor","Azure Cost Management"],"e":"The **TCO calculator** compares the total cost of ownership of an on-premises infrastructure with the estimated cost of an equivalent solution on Azure."}},{"n":29,"a":["B"],"fr":{"q":"Une entreprise souhaite être automatiquement avertie par e-mail dès que ses dépenses Azure mensuelles dépassent 80% du montant prévu, sans bloquer les ressources existantes. Que doit-elle configurer dans Microsoft Cost Management ?","o":["Un verrou de ressource","Un budget avec une alerte de seuil","Une politique Azure Policy de refus","Un tag de criticité"],"e":"Dans **Microsoft Cost Management**, un **budget** associé à des seuils d\u0027alerte permet d\u0027être notifié automatiquement lorsque les dépenses approchent ou dépassent une limite définie."},"en":{"q":"A company wants to be automatically notified by email as soon as its monthly Azure spending exceeds 80% of the planned amount, without blocking existing resources. What should it configure in Microsoft Cost Management?","o":["A resource lock","A budget with a threshold alert","A deny Azure Policy","A criticality tag"],"e":"In **Microsoft Cost Management**, a **budget** with alert thresholds lets you be notified automatically when spending approaches or exceeds a defined limit."}},{"n":30,"a":["A"],"fr":{"q":"Une entreprise veut pouvoir ventiler précisément les coûts Azure par département et par projet dans ses rapports financiers, même si les ressources des différents projets partagent le même groupe de ressources. Quelle fonctionnalité utiliser ?","o":["Les tags (étiquettes) de ressources","Les zones de disponibilité","Les régions souveraines","Le peering de réseaux virtuels"],"e":"Les **tags** permettent d\u0027associer des métadonnées (département, projet, centre de coût) aux ressources afin de filtrer et ventiler précisément les rapports de coûts."},"en":{"q":"A company wants to break down Azure costs precisely by department and by project in its financial reports, even when resources from different projects share the same resource group. Which feature should it use?","o":["Resource tags","Availability zones","Sovereign regions","Virtual network peering"],"e":"**Tags** let you attach metadata (department, project, cost center) to resources in order to filter and precisely break down cost reports."}},{"n":31,"a":["A"],"fr":{"q":"Une entreprise possède déjà des licences Windows Server avec Software Assurance et souhaite réduire le coût de ses machines virtuelles Azure en réutilisant ces licences existantes plutôt que de payer une licence incluse dans le tarif de la VM. Quel avantage doit-elle utiliser ?","o":["Azure Hybrid Benefit","Les instances Spot","Le niveau de stockage Archive","Azure Reserved Capacity"],"e":"**Azure Hybrid Benefit** permet de réutiliser des licences Windows Server ou SQL Server existantes afin de réduire le coût des ressources Azure correspondantes."},"en":{"q":"A company already owns Windows Server licenses with Software Assurance and wants to reduce the cost of its Azure virtual machines by reusing these existing licenses rather than paying for a license included in the VM price. Which benefit should it use?","o":["Azure Hybrid Benefit","Spot instances","The Archive storage tier","Azure Reserved Capacity"],"e":"**Azure Hybrid Benefit** lets you reuse existing Windows Server or SQL Server licenses to reduce the cost of the corresponding Azure resources."}},{"n":32,"a":["B"],"fr":{"q":"Une entreprise doit exécuter un traitement par lots non critique, tolérant les interruptions, et souhaite profiter du tarif le plus bas possible pour la capacité de calcul inutilisée d\u0027Azure. Quel type de machine virtuelle est le plus adapté ?","o":["Une machine virtuelle réservée sur 3 ans","Une machine virtuelle Spot","Une machine virtuelle Isolée dédiée","Une machine virtuelle avec Azure Hybrid Benefit"],"e":"Les **machines virtuelles Spot** exploitent la capacité Azure inutilisée à prix fortement réduit, mais peuvent être réclamées à tout moment, ce qui convient aux charges tolérantes aux interruptions."},"en":{"q":"A company must run a non-critical, interruption-tolerant batch job and wants to take advantage of the lowest possible price for Azure\u0027s unused compute capacity. Which type of virtual machine is the most suitable?","o":["A virtual machine reserved for 3 years","A Spot virtual machine","A dedicated Isolated virtual machine","A virtual machine with Azure Hybrid Benefit"],"e":"**Spot virtual machines** use unused Azure capacity at a deeply discounted price but can be evicted at any time, which suits interruption-tolerant workloads."}},{"n":33,"a":["A"],"fr":{"q":"Une entreprise veut empêcher automatiquement la création de toute ressource qui ne respecterait pas la règle imposant une région autorisée, et refuser le déploiement en cas de non-conformité. Quel service Azure permet d\u0027appliquer cette règle ?","o":["Azure Policy","Azure Blueprints uniquement visuel","Microsoft Purview","Service Trust Portal"],"e":"**Azure Policy** permet de définir des règles de conformité et de refuser automatiquement la création de ressources qui ne les respectent pas."},"en":{"q":"A company wants to automatically prevent the creation of any resource that does not comply with a rule requiring an allowed region, and deny the deployment in case of non-compliance. Which Azure service can enforce this rule?","o":["Azure Policy","Azure Blueprints, visual only","Microsoft Purview","Service Trust Portal"],"e":"**Azure Policy** lets you define compliance rules and automatically deny the creation of resources that do not comply with them."}},{"n":34,"a":["A"],"fr":{"q":"Une entreprise veut empêcher qu\u0027un administrateur supprime accidentellement une base de données de production critique, tout en continuant à autoriser les modifications de configuration courantes. Quelle fonctionnalité Azure utiliser ?","o":["Un verrou de suppression (Delete lock)","Azure Policy en mode audit","Un tag portant la mention critique","Microsoft Defender for Cloud"],"e":"Un **verrou de suppression (Delete lock)** empêche la suppression accidentelle d\u0027une ressource critique tout en autorisant les autres modifications."},"en":{"q":"A company wants to prevent an administrator from accidentally deleting a critical production database, while still allowing routine configuration changes. Which Azure feature should it use?","o":["A delete lock (Delete lock)","Azure Policy in audit mode","A tag marked as critical","Microsoft Defender for Cloud"],"e":"A **delete lock (Delete lock)** prevents accidental deletion of a critical resource while still allowing other changes."}},{"n":35,"a":["B"],"fr":{"q":"Une entreprise soumise à des audits de conformité souhaite consulter les rapports d\u0027audit, certifications et informations de confidentialité fournis par Microsoft concernant ses services cloud. Où peut-elle trouver ces documents ?","o":["Azure Advisor","Le Service Trust Portal","Azure Monitor","Log Analytics"],"e":"Le **Service Trust Portal** met à disposition les rapports d\u0027audit, certifications de conformité et informations de confidentialité de Microsoft."},"en":{"q":"A company subject to compliance audits wants to view the audit reports, certifications, and privacy information provided by Microsoft about its cloud services. Where can it find these documents?","o":["Azure Advisor","The Service Trust Portal","Azure Monitor","Log Analytics"],"e":"The **Service Trust Portal** provides Microsoft\u0027s audit reports, compliance certifications, and privacy information."}},{"n":36,"a":["A"],"fr":{"q":"Un administrateur souhaite automatiser la création répétée de plusieurs ressources Azure identiques via des scripts, directement depuis un navigateur, sans installer d\u0027outils localement. Quel outil Azure est conçu pour cela ?","o":["Azure Cloud Shell","Azure Advisor","Microsoft Defender for Cloud","Azure Service Health"],"e":"**Azure Cloud Shell** offre un environnement de ligne de commande (Bash ou PowerShell) accessible depuis le navigateur, sans installation locale, pour automatiser des tâches."},"en":{"q":"An administrator wants to automate the repeated creation of several identical Azure resources using scripts, directly from a browser, without installing any tools locally. Which Azure tool is designed for this?","o":["Azure Cloud Shell","Azure Advisor","Microsoft Defender for Cloud","Azure Service Health"],"e":"**Azure Cloud Shell** provides a browser-accessible command-line environment (Bash or PowerShell), with no local installation, for automating tasks."}},{"n":37,"a":["A","C"],"fr":{"q":"Parmi les avantages suivants, lesquels DEUX sont apportés par l\u0027utilisation de modèles ARM ou Bicep (infrastructure as code) pour déployer des ressources Azure ?","o":["Des déploiements reproductibles et cohérents entre environnements","L\u0027élimination totale du besoin de facturation","Le versionnement de l\u0027infrastructure comme du code source","Une garantie automatique de disponibilité à 100%"],"e":"Les modèles **ARM/Bicep** permettent des déploiements **reproductibles** et le **versionnement** de l\u0027infrastructure, assurant cohérence et traçabilité entre environnements."},"en":{"q":"Which TWO of the following benefits come from using ARM or Bicep templates (infrastructure as code) to deploy Azure resources?","o":["Repeatable and consistent deployments across environments","Complete elimination of the need for billing","Versioning infrastructure just like source code","An automatic 100% availability guarantee"],"e":"**ARM/Bicep** templates enable **repeatable** deployments and **versioning** of infrastructure, ensuring consistency and traceability across environments."}},{"n":38,"a":["A"],"fr":{"q":"Une entreprise possède des serveurs sur site, des VM dans un autre cloud et des ressources Azure, et souhaite les gérer et appliquer des politiques de gouvernance depuis une seule console unifiée. Quel service Azure permet cela ?","o":["Azure Arc","Azure Migrate","Azure Site Recovery","Azure Data Box"],"e":"**Azure Arc** étend la gestion et la gouvernance Azure (y compris Azure Policy) aux ressources situées sur site ou dans d\u0027autres clouds."},"en":{"q":"A company has on-premises servers, VMs in another cloud, and Azure resources, and wants to manage them and apply governance policies from a single unified console. Which Azure service enables this?","o":["Azure Arc","Azure Migrate","Azure Site Recovery","Azure Data Box"],"e":"**Azure Arc** extends Azure management and governance (including Azure Policy) to resources located on-premises or in other clouds."}},{"n":39,"a":["B"],"fr":{"q":"Une entreprise veut recevoir des recommandations personnalisées pour réduire ses coûts, par exemple en identifiant des machines virtuelles sous-utilisées qu\u0027elle pourrait redimensionner ou arrêter. Quel service Azure fournit ce type de conseils ?","o":["Azure Service Health","Azure Advisor","Azure Monitor uniquement","Application Insights"],"e":"**Azure Advisor** analyse l\u0027utilisation des ressources et propose des recommandations personnalisées, notamment pour réduire les coûts (redimensionnement, arrêt de ressources inutilisées)."},"en":{"q":"A company wants to receive personalized recommendations to reduce its costs, for example by identifying underutilized virtual machines that it could resize or shut down. Which Azure service provides this type of guidance?","o":["Azure Service Health","Azure Advisor","Azure Monitor only","Application Insights"],"e":"**Azure Advisor** analyzes resource usage and provides personalized recommendations, notably to reduce costs (resizing, shutting down unused resources)."}},{"n":40,"a":["B"],"fr":{"q":"Une équipe souhaite collecter et analyser en continu les métriques de performance de son application web ainsi que les traces détaillées des requêtes pour diagnostiquer les ralentissements. Quels services Azure combinés répondent à ce besoin ?","o":["Azure Service Health et Service Trust Portal","Azure Monitor et Application Insights","Azure Policy et Resource Locks","Azure Migrate et Data Box"],"e":"**Azure Monitor** collecte métriques et journaux, tandis qu\u0027**Application Insights** fournit une surveillance applicative détaillée (APM) pour diagnostiquer les performances."},"en":{"q":"A team wants to continuously collect and analyze performance metrics for its web application, as well as detailed request traces, to diagnose slowdowns. Which combination of Azure services meets this need?","o":["Azure Service Health and Service Trust Portal","Azure Monitor and Application Insights","Azure Policy and Resource Locks","Azure Migrate and Data Box"],"e":"**Azure Monitor** collects metrics and logs, while **Application Insights** provides detailed application performance monitoring (APM) to diagnose performance issues."}}]},{"id":7,"title":{"fr":"Examen blanc 7 — Haute disponibilité et résilience","en":"Practice exam 7 — High availability and resiliency"},"questions":[{"n":1,"a":["A"],"fr":{"q":"Qu\u0027est-ce qui définit le mieux le cloud computing ?","o":["La fourniture à la demande de ressources informatiques (calcul, stockage, réseau) via internet, facturées à l\u0027usage","L\u0027achat de serveurs physiques installés dans son propre datacenter","Un réseau privé réservé exclusivement aux très grandes entreprises","Un service informatique utilisable uniquement sans connexion internet"],"e":"Le cloud computing consiste à consommer des ressources informatiques à la demande via internet, avec une facturation basée sur l\u0027usage réel."},"en":{"q":"What best defines cloud computing?","o":["The on-demand delivery of computing resources (compute, storage, networking) over the internet, billed based on usage","Purchasing physical servers installed in your own datacenter","A private network reserved exclusively for very large enterprises","An IT service that can only be used without an internet connection"],"e":"Cloud computing means consuming computing resources on demand over the internet, with billing based on actual usage."}},{"n":2,"a":["B"],"fr":{"q":"Une entreprise héberge des machines virtuelles IaaS dans Azure. Qui est responsable de l\u0027application des correctifs du système d\u0027exploitation sur ces VM ?","o":["Microsoft uniquement","Le client, c\u0027est-à-dire l\u0027entreprise","Un auditeur tiers indépendant","Aucune des deux parties, les correctifs sont désactivés en IaaS"],"e":"Dans le modèle de **responsabilité partagée**, Microsoft sécurise l\u0027infrastructure physique, mais en IaaS le client reste responsable du système d\u0027exploitation et de ses mises à jour."},"en":{"q":"A company hosts IaaS virtual machines in Azure. Who is responsible for applying operating system patches on these VMs?","o":["Microsoft only","The customer, that is, the company","An independent third-party auditor","Neither party, patching is disabled in IaaS"],"e":"In the **shared responsibility** model, Microsoft secures the physical infrastructure, but in IaaS the customer remains responsible for the operating system and its updates."}},{"n":3,"a":["C"],"fr":{"q":"Une société veut conserver ses données sensibles sur un serveur local pour des raisons réglementaires, tout en utilisant Azure pour absorber les pics de charge et améliorer la résilience de son application. Quel modèle de déploiement correspond à ce besoin ?","o":["Cloud public uniquement","Cloud privé uniquement","Cloud hybride","Multicloud"],"e":"Le **cloud hybride** combine ressources sur site et ressources cloud publiques, ce qui permet de garder des données localement tout en bénéficiant de la capacité élastique d\u0027Azure."},"en":{"q":"A company wants to keep its sensitive data on an on-premises server for regulatory reasons, while using Azure to absorb peak loads and improve the resilience of its application. Which deployment model meets this requirement?","o":["Public cloud only","Private cloud only","Hybrid cloud","Multicloud"],"e":"The **hybrid cloud** combines on-premises resources with public cloud resources, which makes it possible to keep data locally while benefiting from Azure\u0027s elastic capacity."}},{"n":4,"a":["B"],"fr":{"q":"Une entreprise renonce à construire un second centre de données pour la reprise d\u0027activité et préfère payer uniquement les ressources Azure consommées chaque mois. Quel type de dépense cela représente-t-il ?","o":["Une dépense d\u0027investissement (CapEx)","Une dépense opérationnelle (OpEx)","Un investissement en capital fixe","Une dette à long terme obligatoire"],"e":"Payer des ressources cloud au fur et à mesure de leur consommation, sans investissement matériel initial, correspond à une **dépense opérationnelle (OpEx)**."},"en":{"q":"A company decides not to build a second datacenter for disaster recovery and prefers to pay only for the Azure resources it consumes each month. What type of expenditure does this represent?","o":["A capital expenditure (CapEx)","An operational expenditure (OpEx)","A fixed capital investment","A mandatory long-term debt"],"e":"Paying for cloud resources as they are consumed, with no upfront hardware investment, corresponds to an **operational expenditure (OpEx)**."}},{"n":5,"a":["B"],"fr":{"q":"Une jeune entreprise connaît un trafic très variable et veut payer uniquement les ressources de calcul réellement consommées, sans engagement initial. Quel modèle de tarification correspond le mieux à ce besoin ?","o":["Une réservation d\u0027instance sur trois ans","Le paiement à l\u0027usage (pay-as-you-go)","Une licence perpétuelle","Une facturation forfaitaire annuelle fixe"],"e":"Le modèle **pay-as-you-go** permet de ne payer que la consommation réelle, sans engagement, ce qui convient à une charge imprévisible."},"en":{"q":"A startup experiences highly variable traffic and wants to pay only for the compute resources it actually consumes, with no upfront commitment. Which pricing model best meets this requirement?","o":["A three-year reserved instance","Pay-as-you-go","A perpetual license","A fixed annual flat-rate billing"],"e":"The **pay-as-you-go** model lets you pay only for actual consumption, with no commitment, which suits an unpredictable workload."}},{"n":6,"a":["C"],"fr":{"q":"Quel est le principal avantage architectural du calcul serverless pour une équipe développant une API soumise à un trafic imprévisible ?","o":["L\u0027équipe doit provisionner et dimensionner elle-même les serveurs virtuels","Le code s\u0027exécute en permanence sur une seule machine physique dédiée","La plateforme met automatiquement à l\u0027échelle les ressources et facture uniquement le temps d\u0027exécution du code","Le serverless oblige à gérer manuellement les correctifs du système d\u0027exploitation sous-jacent"],"e":"Le **serverless** délègue entièrement la gestion de l\u0027infrastructure au fournisseur cloud, qui adapte automatiquement la capacité et facture à l\u0027exécution."},"en":{"q":"What is the main architectural benefit of serverless computing for a team developing an API subject to unpredictable traffic?","o":["The team must provision and size the virtual servers itself","The code runs continuously on a single dedicated physical machine","The platform automatically scales resources and bills only for the code\u0027s execution time","Serverless requires manually managing patches for the underlying operating system"],"e":"**Serverless** fully delegates infrastructure management to the cloud provider, which automatically adjusts capacity and bills per execution."}},{"n":7,"a":["C"],"fr":{"q":"Une application est composée d\u0027un niveau web avec un SLA garanti de 99,95 % et d\u0027une base de données avec un SLA garanti de 99,99 %, les deux étant nécessaires au fonctionnement de l\u0027application. Quel est le SLA composé approximatif de l\u0027ensemble ?","o":["99,99 %, le plus élevé des deux","99,95 %, le plus bas des deux","Environ 99,94 %, résultat de la multiplication des deux SLA","100 %, car les deux niveaux se compensent mutuellement"],"e":"Pour des composants dépendants, le **SLA composé** s\u0027obtient en multipliant les disponibilités (0,9995 x 0,9999 ≈ 0,9994), donnant un résultat inférieur à chaque SLA pris isolément."},"en":{"q":"An application consists of a web tier with a guaranteed SLA of 99.95% and a database with a guaranteed SLA of 99.99%, both of which are required for the application to work. What is the approximate composite SLA of the whole solution?","o":["99.99%, the higher of the two","99.95%, the lower of the two","Approximately 99.94%, the result of multiplying the two SLAs","100%, because the two tiers compensate for each other"],"e":"For dependent components, the **composite SLA** is obtained by multiplying the availabilities (0.9995 x 0.9999 ≈ 0.9994), giving a result lower than each individual SLA."}},{"n":8,"a":["B"],"fr":{"q":"Pendant une vente flash, un site e-commerce ajoute automatiquement des instances supplémentaires puis les supprime dès que le pic de trafic retombe. Quel concept illustre le mieux ce comportement ?","o":["La scalabilité verticale","L\u0027élasticité","La haute disponibilité","La redondance géographique"],"e":"L\u0027**élasticité** désigne la capacité d\u0027un système cloud à ajouter et retirer automatiquement des ressources en fonction de la demande réelle."},"en":{"q":"During a flash sale, an e-commerce site automatically adds extra instances and then removes them as soon as the traffic peak subsides. Which concept best illustrates this behavior?","o":["Vertical scalability","Elasticity","High availability","Geographic redundancy"],"e":"**Elasticity** refers to the ability of a cloud system to automatically add and remove resources based on actual demand."}},{"n":9,"a":["A"],"fr":{"q":"Dans Azure, quel terme désigne la capacité d\u0027un système à se remettre des pannes et à continuer de fonctionner correctement pour les utilisateurs ?","o":["La fiabilité","La gouvernance","L\u0027agilité commerciale","La conformité réglementaire"],"e":"La **fiabilité** décrit la capacité d\u0027un système à résister aux défaillances et à rétablir rapidement son fonctionnement normal."},"en":{"q":"In Azure, which term refers to the ability of a system to recover from failures and continue to function correctly for users?","o":["Reliability","Governance","Business agility","Regulatory compliance"],"e":"**Reliability** describes the ability of a system to withstand failures and quickly restore normal operation."}},{"n":10,"a":["B"],"fr":{"q":"La gérabilité (manageability) du cloud Azure fait référence à la capacité de...","o":["Réduire uniquement les coûts de licence logicielle","Configurer, surveiller et automatiser la gestion des ressources déployées dans le cloud","Remplacer complètement le besoin de supervision humaine","Garantir juridiquement l\u0027absence totale de pannes"],"e":"La gérabilité regroupe les outils permettant de configurer, surveiller et automatiser la gestion des ressources cloud tout au long de leur cycle de vie."},"en":{"q":"Manageability in the Azure cloud refers to the ability to...","o":["Reduce software licensing costs only","Configure, monitor, and automate the management of resources deployed in the cloud","Completely replace the need for human oversight","Legally guarantee the total absence of outages"],"e":"Manageability encompasses the tools used to configure, monitor, and automate the management of cloud resources throughout their lifecycle."}},{"n":11,"a":["A","C"],"fr":{"q":"Quelles affirmations décrivent correctement le modèle IaaS (Infrastructure as a Service) ?","o":["Le client gère le système d\u0027exploitation, les correctifs et le runtime des applications","Le fournisseur cloud gère entièrement le code de l\u0027application et son exécution","Le client loue à la demande des machines virtuelles, du stockage et des réseaux virtuels","Ce modèle ne permet aucune personnalisation du système d\u0027exploitation"],"e":"En **IaaS**, le client loue l\u0027infrastructure (VM, stockage, réseau) mais reste responsable du système d\u0027exploitation et de ses mises à jour, contrairement au PaaS ou au SaaS."},"en":{"q":"Which statements correctly describe the IaaS (Infrastructure as a Service) model?","o":["The customer manages the operating system, patches, and the application runtime","The cloud provider fully manages the application code and its execution","The customer rents virtual machines, storage, and virtual networks on demand","This model does not allow any customization of the operating system"],"e":"In **IaaS**, the customer rents the infrastructure (VMs, storage, networking) but remains responsible for the operating system and its updates, unlike PaaS or SaaS."}},{"n":12,"a":["B"],"fr":{"q":"Pour sa stratégie de reprise après sinistre, une entreprise veut répliquer son application vers une seconde région Azure située dans la même géographie, associée automatiquement par Microsoft pour limiter les interruptions simultanées. De quel concept s\u0027agit-il ?","o":["Une zone de disponibilité","Une paire de régions","Une région souveraine","Un groupe à haute disponibilité"],"e":"Chaque région Azure est associée à une autre région de la même géographie pour former une **paire de régions**, utilisée pour la reprise d\u0027activité et le déploiement séquentiel des mises à jour."},"en":{"q":"For its disaster recovery strategy, a company wants to replicate its application to a second Azure region located in the same geography, automatically paired by Microsoft to limit simultaneous outages. Which concept is this?","o":["An availability zone","A region pair","A sovereign region","An availability set"],"e":"Each Azure region is paired with another region in the same geography to form a **region pair**, which is used for disaster recovery and the sequential rollout of updates."}},{"n":13,"a":["B"],"fr":{"q":"Comment une entreprise peut-elle protéger son application contre la panne complète d\u0027un seul centre de données au sein d\u0027une même région Azure ?","o":["En utilisant une seule zone de disponibilité","En déployant ses ressources sur plusieurs zones de disponibilité de la région","En choisissant uniquement le stockage LRS","En utilisant un seul groupe à haute disponibilité dans un même datacenter"],"e":"Les **zones de disponibilité** sont des emplacements physiquement séparés au sein d\u0027une région ; répartir les ressources sur plusieurs zones protège contre la panne d\u0027un datacenter entier."},"en":{"q":"How can a company protect its application against the complete failure of a single datacenter within the same Azure region?","o":["By using a single availability zone","By deploying its resources across multiple availability zones in the region","By choosing LRS storage only","By using a single availability set in one datacenter"],"e":"**Availability zones** are physically separate locations within a region; spreading resources across multiple zones protects against the failure of an entire datacenter."}},{"n":14,"a":["B"],"fr":{"q":"Quelle est la différence principale entre un groupe à haute disponibilité (availability set) et une zone de disponibilité ?","o":["Le groupe à haute disponibilité répartit les VM sur plusieurs régions distinctes","Le groupe à haute disponibilité répartit les VM sur des domaines de mise à jour et de panne au sein d\u0027un même centre de données, tandis que la zone de disponibilité répartit les ressources sur plusieurs centres de données distincts","Les deux concepts sont strictement identiques","La zone de disponibilité ne concerne que le stockage, jamais les machines virtuelles"],"e":"Le **groupe à haute disponibilité** protège contre les pannes matérielles et la maintenance planifiée dans un même datacenter, alors que les **zones de disponibilité** protègent contre la perte d\u0027un datacenter entier."},"en":{"q":"What is the main difference between an availability set and an availability zone?","o":["An availability set distributes VMs across several distinct regions","An availability set distributes VMs across update domains and fault domains within a single datacenter, whereas an availability zone distributes resources across several distinct datacenters","The two concepts are strictly identical","An availability zone applies only to storage, never to virtual machines"],"e":"An **availability set** protects against hardware failures and planned maintenance within a single datacenter, whereas **availability zones** protect against the loss of an entire datacenter."}},{"n":15,"a":["B"],"fr":{"q":"Quel niveau de la hiérarchie de gestion Azure permet d\u0027appliquer une même politique de gouvernance à plusieurs abonnements (subscriptions) simultanément ?","o":["Le groupe de ressources (resource group)","Le groupe d\u0027administration (management group)","La ressource individuelle","La zone de disponibilité"],"e":"Les **groupes d\u0027administration** se situent au-dessus des abonnements dans la hiérarchie et permettent d\u0027appliquer des politiques et des rôles à plusieurs abonnements à la fois."},"en":{"q":"Which level of the Azure management hierarchy lets you apply the same governance policy to multiple subscriptions at once?","o":["The resource group","The management group","The individual resource","The availability zone"],"e":"**Management groups** sit above subscriptions in the hierarchy and let you apply policies and roles to multiple subscriptions at once."}},{"n":16,"a":["C"],"fr":{"q":"Quel service Azure permet de créer et de gérer automatiquement un ensemble de machines virtuelles identiques, équilibrées en charge, dont le nombre d\u0027instances augmente ou diminue selon la demande ?","o":["Azure Virtual Desktop","Les groupes à haute disponibilité","Les groupes identiques de machines virtuelles (VM Scale Sets)","Azure Container Instances"],"e":"Les **VM Scale Sets** permettent de gérer un groupe de VM identiques avec mise à l\u0027échelle automatique horizontale en fonction de la demande."},"en":{"q":"Which Azure service lets you automatically create and manage a set of identical, load-balanced virtual machines whose number of instances increases or decreases based on demand?","o":["Azure Virtual Desktop","Availability sets","Virtual machine scale sets (VM Scale Sets)","Azure Container Instances"],"e":"**VM Scale Sets** let you manage a group of identical VMs with automatic horizontal scaling based on demand."}},{"n":17,"a":["A"],"fr":{"q":"Quel service Azure permet de fournir des postes de travail et des applications Windows virtualisés, accessibles à distance par les utilisateurs depuis n\u0027importe quel appareil ?","o":["Azure Virtual Desktop","Azure Functions","Azure Bastion","Azure Container Apps"],"e":"**Azure Virtual Desktop** est le service de virtualisation de postes de travail et d\u0027applications Windows hébergé dans Azure."},"en":{"q":"Which Azure service lets you deliver virtualized Windows desktops and applications that users can access remotely from any device?","o":["Azure Virtual Desktop","Azure Functions","Azure Bastion","Azure Container Apps"],"e":"**Azure Virtual Desktop** is the Windows desktop and application virtualization service hosted in Azure."}},{"n":18,"a":["B"],"fr":{"q":"Une équipe souhaite déployer plusieurs microservices conteneurisés avec mise à l\u0027échelle automatique basée sur les événements, sans gérer elle-même un cluster Kubernetes. Quel service Azure répond le mieux à ce besoin ?","o":["Azure Kubernetes Service (AKS)","Azure Container Apps","Azure Container Instances uniquement","Des machines virtuelles classiques avec Docker installé manuellement"],"e":"**Azure Container Apps** exécute des microservices conteneurisés avec mise à l\u0027échelle automatique sans exposer ni gérer directement le cluster Kubernetes sous-jacent, contrairement à AKS."},"en":{"q":"A team wants to deploy several containerized microservices with event-driven autoscaling, without managing a Kubernetes cluster itself. Which Azure service best meets this requirement?","o":["Azure Kubernetes Service (AKS)","Azure Container Apps","Azure Container Instances only","Traditional virtual machines with Docker installed manually"],"e":"**Azure Container Apps** runs containerized microservices with autoscaling without exposing or requiring direct management of the underlying Kubernetes cluster, unlike AKS."}},{"n":19,"a":["A"],"fr":{"q":"Quelle caractéristique distingue Azure Functions des machines virtuelles traditionnelles ?","o":["Le code s\u0027exécute en réponse à des événements déclencheurs et la facturation est basée sur le temps d\u0027exécution réel","Il faut provisionner manuellement le nombre de serveurs à l\u0027avance","Le système d\u0027exploitation doit être entièrement géré par le client","Azure Functions ne peut jamais être déclenché par une requête HTTP"],"e":"**Azure Functions** est un service serverless event-driven qui ne facture que le temps d\u0027exécution réel, sans gestion de serveurs."},"en":{"q":"Which characteristic distinguishes Azure Functions from traditional virtual machines?","o":["The code runs in response to triggering events, and billing is based on actual execution time","You must manually provision the number of servers in advance","The operating system must be fully managed by the customer","Azure Functions can never be triggered by an HTTP request"],"e":"**Azure Functions** is an event-driven serverless service that bills only for actual execution time, with no server management."}},{"n":20,"a":["B"],"fr":{"q":"Pour améliorer la disponibilité d\u0027une application web hébergée sur Azure App Service lors du déploiement de nouvelles versions, quelle fonctionnalité permet de basculer le trafic vers une nouvelle version sans interruption de service ?","o":["Les niveaux d\u0027accès au stockage","Les emplacements de déploiement (deployment slots)","Les paires de régions","Les verrous de ressources"],"e":"Les **emplacements de déploiement** d\u0027App Service permettent de préparer et tester une nouvelle version avant de l\u0027échanger avec la production sans interruption."},"en":{"q":"To improve the availability of a web application hosted on Azure App Service when deploying new versions, which feature lets you switch traffic to a new version without service interruption?","o":["Storage access tiers","Deployment slots","Region pairs","Resource locks"],"e":"App Service **deployment slots** let you prepare and test a new version before swapping it with production without interruption."}},{"n":21,"a":["B"],"fr":{"q":"Quelle fonctionnalité réseau Azure permet de connecter directement deux réseaux virtuels afin que leurs ressources communiquent via le réseau principal Microsoft, sans transiter par l\u0027internet public ?","o":["Azure DNS","Le peering de réseaux virtuels","Un point de terminaison public","Azure Bastion"],"e":"Le **peering de réseaux virtuels** relie deux VNets pour permettre une communication privée et à faible latence sans passer par l\u0027internet public."},"en":{"q":"Which Azure networking feature lets you directly connect two virtual networks so that their resources communicate over the Microsoft backbone network, without traversing the public internet?","o":["Azure DNS","Virtual network peering","A public endpoint","Azure Bastion"],"e":"**Virtual network peering** links two VNets to enable private, low-latency communication without going over the public internet."}},{"n":22,"a":["B"],"fr":{"q":"Une entreprise a besoin d\u0027une connexion privée, dédiée et à faible latence entre son datacenter local et Azure, sans transiter par l\u0027internet public, pour un trafic critique et volumineux. Quelle solution choisir ?","o":["Azure VPN Gateway via internet","Azure ExpressRoute","Un point de terminaison privé uniquement","Le peering de réseaux virtuels"],"e":"**ExpressRoute** fournit une connexion privée dédiée entre un site local et Azure, sans passer par l\u0027internet public, contrairement au VPN Gateway."},"en":{"q":"A company needs a private, dedicated, low-latency connection between its on-premises datacenter and Azure, without traversing the public internet, for critical high-volume traffic. Which solution should it choose?","o":["Azure VPN Gateway over the internet","Azure ExpressRoute","A private endpoint only","Virtual network peering"],"e":"**ExpressRoute** provides a dedicated private connection between an on-premises site and Azure, without going over the public internet, unlike VPN Gateway."}},{"n":23,"a":["B"],"fr":{"q":"Comment sécuriser l\u0027accès à un compte de stockage Azure afin qu\u0027il soit uniquement joignable via une adresse IP privée à l\u0027intérieur d\u0027un réseau virtuel, sans jamais transiter par l\u0027internet public ?","o":["En configurant un point de terminaison public","En configurant un point de terminaison privé (private endpoint)","En activant uniquement le stockage GRS","En créant un groupe à haute disponibilité"],"e":"Un **point de terminaison privé** attribue une adresse IP privée du réseau virtuel à un service PaaS, supprimant l\u0027exposition publique de l\u0027endpoint."},"en":{"q":"How can you secure access to an Azure storage account so that it is reachable only through a private IP address inside a virtual network, without ever traversing the public internet?","o":["By configuring a public endpoint","By configuring a private endpoint","By enabling GRS storage only","By creating an availability set"],"e":"A **private endpoint** assigns a private IP address from the virtual network to a PaaS service, eliminating public exposure of the endpoint."}},{"n":24,"a":["D"],"fr":{"q":"Une entreprise veut que ses données soient répliquées de manière asynchrone vers une région secondaire distante ET veut pouvoir les lire depuis cette région secondaire même quand la région primaire fonctionne normalement. Quelle option de redondance de stockage faut-il choisir ?","o":["LRS","ZRS","GRS","RA-GRS, stockage géoredondant avec accès en lecture"],"e":"**RA-GRS** ajoute à la redondance géographique de GRS la possibilité de lire les données depuis la région secondaire même lorsque la région primaire est disponible."},"en":{"q":"A company wants its data to be replicated asynchronously to a distant secondary region AND wants to be able to read it from that secondary region even when the primary region is operating normally. Which storage redundancy option should it choose?","o":["LRS","ZRS","GRS","RA-GRS, read-access geo-redundant storage"],"e":"**RA-GRS** adds to GRS geo-redundancy the ability to read data from the secondary region even when the primary region is available."}},{"n":25,"a":["A","C"],"fr":{"q":"Quelles affirmations sur la redondance du stockage Azure sont correctes ?","o":["Le stockage ZRS réplique les données de manière synchrone sur plusieurs zones de disponibilité de la même région","Le stockage LRS protège automatiquement les données contre la perte totale d\u0027une région entière","Le stockage GZRS combine la réplication entre zones de disponibilité et la réplication asynchrone vers une région secondaire","Le stockage RA-GRS ne permet jamais la lecture des données depuis la région secondaire"],"e":"**ZRS** réplique de façon synchrone entre zones d\u0027une même région, et **GZRS** ajoute une réplication asynchrone vers une région secondaire ; LRS ne protège pas contre la perte d\u0027une région et RA-GRS autorise justement la lecture depuis la région secondaire."},"en":{"q":"Which statements about Azure Storage redundancy are correct?","o":["ZRS storage synchronously replicates data across multiple availability zones in the same region","LRS storage automatically protects data against the total loss of an entire region","GZRS storage combines replication across availability zones with asynchronous replication to a secondary region","RA-GRS storage never allows reading data from the secondary region"],"e":"**ZRS** replicates synchronously across zones within a single region, and **GZRS** adds asynchronous replication to a secondary region; LRS does not protect against the loss of a region, and RA-GRS specifically allows reading from the secondary region."}},{"n":26,"a":["C"],"fr":{"q":"Quel outil Azure est conçu pour transférer physiquement de très grands volumes de données vers Azure lorsque la bande passante réseau disponible est insuffisante ?","o":["AzCopy","Azure Storage Explorer","Azure Data Box","Azure File Sync"],"e":"**Azure Data Box** est un boîtier physique permettant de transférer hors ligne de très grands volumes de données vers Azure quand le réseau est limitant."},"en":{"q":"Which Azure tool is designed to physically transfer very large volumes of data to Azure when the available network bandwidth is insufficient?","o":["AzCopy","Azure Storage Explorer","Azure Data Box","Azure File Sync"],"e":"**Azure Data Box** is a physical device that lets you transfer very large volumes of data offline to Azure when the network is a limiting factor."}},{"n":27,"a":["B"],"fr":{"q":"Quelle fonctionnalité de Microsoft Entra ID permet d\u0027exiger automatiquement une authentification multifacteur uniquement lorsque la connexion provient d\u0027un emplacement ou d\u0027un appareil considéré comme inhabituel ?","o":["Le contrôle d\u0027accès en fonction du rôle (RBAC)","L\u0027accès conditionnel (Conditional Access)","Microsoft Entra Domain Services","Microsoft Defender for Cloud"],"e":"L\u0027**accès conditionnel** permet de définir des règles déclenchant des exigences supplémentaires, comme la MFA, selon le contexte du signe-in (lieu, appareil, risque)."},"en":{"q":"Which Microsoft Entra ID feature lets you automatically require multifactor authentication only when the sign-in comes from a location or device considered unusual?","o":["Role-based access control (RBAC)","Conditional Access","Microsoft Entra Domain Services","Microsoft Defender for Cloud"],"e":"**Conditional Access** lets you define rules that trigger additional requirements, such as MFA, based on the sign-in context (location, device, risk)."}},{"n":28,"a":["A"],"fr":{"q":"Avant de déployer une nouvelle architecture Azure, quel outil permet d\u0027estimer le coût mensuel prévisionnel des ressources prévues (VM, stockage, réseau) ?","o":["La calculatrice de prix Azure (Pricing Calculator)","Azure Advisor","Microsoft Cost Management","Azure Policy"],"e":"La **calculatrice de prix Azure** permet de simuler et d\u0027estimer le coût d\u0027une architecture avant son déploiement."},"en":{"q":"Before deploying a new Azure architecture, which tool lets you estimate the projected monthly cost of the planned resources (VMs, storage, networking)?","o":["The Azure Pricing calculator","Azure Advisor","Microsoft Cost Management","Azure Policy"],"e":"The **Azure Pricing calculator** lets you simulate and estimate the cost of an architecture before it is deployed."}},{"n":29,"a":["B"],"fr":{"q":"Quel outil permet de comparer le coût total de possession d\u0027une infrastructure sur site avec le coût équivalent d\u0027une solution hébergée sur Azure ?","o":["La calculatrice de prix Azure","La calculatrice TCO (Total Cost of Ownership)","Azure Monitor","Le Service Trust Portal"],"e":"La **calculatrice TCO** compare les coûts d\u0027une infrastructure locale existante avec le coût équivalent sur Azure."},"en":{"q":"Which tool lets you compare the total cost of ownership of an on-premises infrastructure with the equivalent cost of a solution hosted on Azure?","o":["The Azure Pricing calculator","The Total Cost of Ownership (TCO) calculator","Azure Monitor","The Service Trust Portal"],"e":"The **TCO calculator** compares the costs of an existing on-premises infrastructure with the equivalent cost on Azure."}},{"n":30,"a":["B"],"fr":{"q":"Comment une entreprise peut-elle répartir précisément ses coûts Azure par département ou par projet dans les rapports de Microsoft Cost Management ?","o":["En activant Azure Policy","En appliquant des balises (tags) aux ressources, puis en filtrant les coûts par balise","En créant un verrou de ressource","En configurant Azure Site Recovery"],"e":"Les **balises (tags)** appliquées aux ressources permettent ensuite de filtrer et de ventiler les coûts par département, projet ou centre de coût dans Cost Management."},"en":{"q":"How can a company accurately allocate its Azure costs by department or by project in Microsoft Cost Management reports?","o":["By enabling Azure Policy","By applying tags to resources, then filtering costs by tag","By creating a resource lock","By configuring Azure Site Recovery"],"e":"**Tags** applied to resources then let you filter and break down costs by department, project, or cost center in Cost Management."}},{"n":31,"a":["A"],"fr":{"q":"Quel service Azure aide une organisation à cataloguer, classifier et gouverner ses données sensibles réparties entre environnements locaux, multicloud et SaaS ?","o":["Microsoft Purview","Azure Monitor","Azure Advisor","Azure Arc"],"e":"**Microsoft Purview** fournit un catalogue de données unifié et des outils de gouvernance pour classifier et protéger les données sensibles à travers l\u0027entreprise."},"en":{"q":"Which Azure service helps an organization catalog, classify, and govern its sensitive data spread across on-premises, multicloud, and SaaS environments?","o":["Microsoft Purview","Azure Monitor","Azure Advisor","Azure Arc"],"e":"**Microsoft Purview** provides a unified data catalog and governance tools to classify and protect sensitive data across the enterprise."}},{"n":32,"a":["A"],"fr":{"q":"Une entreprise veut empêcher la création de ressources en dehors d\u0027une liste de régions autorisées, afin de respecter ses exigences de résidence des données. Quel service Azure permet d\u0027appliquer et de vérifier automatiquement cette règle sur l\u0027ensemble des abonnements ?","o":["Azure Policy","Azure RBAC","Microsoft Cost Management","Azure Advisor"],"e":"**Azure Policy** permet de définir des règles de conformité et de les appliquer ou de les auditer automatiquement sur les ressources d\u0027un ou plusieurs abonnements."},"en":{"q":"A company wants to prevent the creation of resources outside a list of allowed regions in order to meet its data residency requirements. Which Azure service lets you automatically enforce and verify this rule across all subscriptions?","o":["Azure Policy","Azure RBAC","Microsoft Cost Management","Azure Advisor"],"e":"**Azure Policy** lets you define compliance rules and automatically enforce or audit them on the resources of one or more subscriptions."}},{"n":33,"a":["B"],"fr":{"q":"Quelle ressource permet de consulter les rapports d\u0027audit et les certifications de conformité de Microsoft Azure (ISO, SOC, etc.) ?","o":["Azure Service Health","Le Service Trust Portal","Azure Monitor","Azure Advisor"],"e":"Le **Service Trust Portal** donne accès aux rapports d\u0027audit, certifications et documents de conformité de Microsoft."},"en":{"q":"Which resource lets you view Microsoft Azure audit reports and compliance certifications (ISO, SOC, etc.)?","o":["Azure Service Health","The Service Trust Portal","Azure Monitor","Azure Advisor"],"e":"The **Service Trust Portal** provides access to Microsoft\u0027s audit reports, certifications, and compliance documents."}},{"n":34,"a":["B"],"fr":{"q":"Quel outil offre un environnement de ligne de commande prêt à l\u0027emploi, accessible directement depuis un navigateur, avec Azure CLI et Azure PowerShell préinstallés, sans nécessiter d\u0027installation locale ?","o":["Azure Arc","Azure Cloud Shell","Visual Studio Code","Azure Data Box"],"e":"**Azure Cloud Shell** est un shell interactif accessible depuis le navigateur ou le portail, avec les outils en ligne de commande déjà installés."},"en":{"q":"Which tool provides a ready-to-use command-line environment, accessible directly from a browser, with Azure CLI and Azure PowerShell preinstalled, without requiring any local installation?","o":["Azure Arc","Azure Cloud Shell","Visual Studio Code","Azure Data Box"],"e":"**Azure Cloud Shell** is an interactive shell accessible from the browser or the portal, with command-line tools already installed."}},{"n":35,"a":["A"],"fr":{"q":"Quel service Azure permet d\u0027étendre la gestion et la gouvernance Azure (politiques, étiquetage, supervision) à des serveurs et des clusters Kubernetes situés en dehors d\u0027Azure, par exemple sur site ou chez un autre fournisseur cloud ?","o":["Azure Arc","Azure Site Recovery","Azure Bastion","Azure Migrate"],"e":"**Azure Arc** étend la gestion et la gouvernance Azure à des ressources hybrides et multicloud situées en dehors d\u0027Azure."},"en":{"q":"Which Azure service lets you extend Azure management and governance (policies, tagging, monitoring) to servers and Kubernetes clusters located outside Azure, for example on-premises or with another cloud provider?","o":["Azure Arc","Azure Site Recovery","Azure Bastion","Azure Migrate"],"e":"**Azure Arc** extends Azure management and governance to hybrid and multicloud resources located outside Azure."}},{"n":36,"a":["B"],"fr":{"q":"Pour garantir qu\u0027un environnement de reprise après sinistre soit déployé de manière identique et répétable dans une région secondaire, quelle approche est la plus adaptée ?","o":["Créer manuellement chaque ressource via le portail Azure à chaque fois","Utiliser des modèles d\u0027infrastructure as code comme ARM ou Bicep","Envoyer des instructions par courriel à l\u0027équipe opérationnelle","Dupliquer les ressources uniquement via des captures d\u0027écran de configuration"],"e":"Les modèles **ARM ou Bicep** permettent de décrire l\u0027infrastructure en code et de la redéployer de manière identique et répétable, ce qui est essentiel pour un site de reprise."},"en":{"q":"To ensure that a disaster recovery environment is deployed in an identical and repeatable way in a secondary region, which approach is the most appropriate?","o":["Manually create each resource through the Azure portal every time","Use infrastructure as code templates such as ARM or Bicep","Send instructions by email to the operations team","Duplicate resources using only screenshots of the configuration"],"e":"**ARM or Bicep** templates let you describe infrastructure as code and redeploy it in an identical and repeatable way, which is essential for a recovery site."}},{"n":37,"a":["B"],"fr":{"q":"Quelle catégorie de recommandations d\u0027Azure Advisor suggère, par exemple, de répartir des machines virtuelles sur plusieurs zones de disponibilité pour améliorer la résilience d\u0027une application ?","o":["Coût","Fiabilité","Excellence opérationnelle","Sécurité"],"e":"La catégorie **Fiabilité** d\u0027Azure Advisor propose des recommandations pour améliorer la continuité et la résilience des charges de travail."},"en":{"q":"Which Azure Advisor recommendation category suggests, for example, spreading virtual machines across multiple availability zones to improve an application\u0027s resilience?","o":["Cost","Reliability","Operational excellence","Security"],"e":"The Azure Advisor **Reliability** category provides recommendations to improve the continuity and resilience of workloads."}},{"n":38,"a":["A"],"fr":{"q":"Quelle est la différence entre Azure Status et Azure Service Health ?","o":["Azure Status affiche l\u0027état de santé global des services Azure pour tous les clients, tandis qu\u0027Azure Service Health fournit des informations personnalisées sur les incidents affectant les ressources et la région spécifiques d\u0027un abonnement","Les deux services sont strictement identiques et redondants","Azure Service Health ne concerne que la facturation","Azure Status nécessite une authentification avec un abonnement Azure actif, contrairement à Azure Service Health"],"e":"**Azure Status** donne une vue publique et globale de l\u0027état des services, alors qu\u0027**Azure Service Health** est personnalisé selon les ressources et régions utilisées par un abonnement."},"en":{"q":"What is the difference between Azure Status and Azure Service Health?","o":["Azure Status displays the global health of Azure services for all customers, whereas Azure Service Health provides personalized information about incidents affecting a subscription\u0027s specific resources and regions","The two services are strictly identical and redundant","Azure Service Health relates only to billing","Azure Status requires authentication with an active Azure subscription, unlike Azure Service Health"],"e":"**Azure Status** provides a public, global view of service health, whereas **Azure Service Health** is personalized based on the resources and regions used by a subscription."}},{"n":39,"a":["A","B"],"fr":{"q":"Quelles affirmations sur les outils de supervision Azure sont correctes ?","o":["Azure Monitor collecte et centralise les métriques et les journaux issus des ressources Azure","Application Insights est conçu pour surveiller les performances et détecter les anomalies au sein des applications","Log Analytics sert uniquement à afficher l\u0027état de santé mondial des services Azure","Azure Advisor stocke les journaux d\u0027activité interrogeables grâce au langage KQL"],"e":"**Azure Monitor** centralise métriques et journaux, et **Application Insights** surveille spécifiquement les performances applicatives ; c\u0027est **Log Analytics**, et non Azure Status ou Advisor, qui permet d\u0027interroger les journaux via KQL."},"en":{"q":"Which statements about Azure monitoring tools are correct?","o":["Azure Monitor collects and centralizes metrics and logs from Azure resources","Application Insights is designed to monitor performance and detect anomalies within applications","Log Analytics is used only to display the global health of Azure services","Azure Advisor stores activity logs that can be queried using the KQL language"],"e":"**Azure Monitor** centralizes metrics and logs, and **Application Insights** specifically monitors application performance; it is **Log Analytics**, not Azure Status or Advisor, that lets you query logs using KQL."}},{"n":40,"a":["A","B"],"fr":{"q":"Quelles affirmations décrivent correctement les outils de gouvernance Azure ?","o":["Azure Policy peut auditer ou empêcher la création de ressources non conformes aux règles définies par l\u0027organisation","Un verrou de ressource (resource lock) empêche la suppression ou la modification accidentelle d\u0027une ressource critique","Azure Policy attribue des rôles d\u0027accès aux utilisateurs sur les ressources","Un verrou en lecture seule autorise malgré tout la suppression de la ressource"],"e":"**Azure Policy** impose la conformité des ressources tandis que les **verrous de ressources** protègent contre la suppression ou la modification accidentelle ; l\u0027attribution de rôles relève du RBAC, et un verrou en lecture seule interdit justement la suppression."},"en":{"q":"Which statements correctly describe Azure governance tools?","o":["Azure Policy can audit or prevent the creation of resources that do not comply with the rules defined by the organization","A resource lock prevents the accidental deletion or modification of a critical resource","Azure Policy assigns access roles to users on resources","A read-only lock still allows the resource to be deleted"],"e":"**Azure Policy** enforces resource compliance, while **resource locks** protect against accidental deletion or modification; role assignment is handled by RBAC, and a read-only lock specifically prevents deletion."}}]},{"id":8,"title":{"fr":"Examen blanc 8 — Outils de gestion et infrastructure as code","en":"Practice exam 8 — Management tools and infrastructure as code"},"questions":[{"n":1,"a":["A"],"fr":{"q":"Une entreprise décide de louer de la puissance de calcul à la demande via Internet, payée uniquement selon sa consommation réelle, plutôt que d\u0027acheter et d\u0027entretenir ses propres serveurs. Quel concept décrit cette approche ?","o":["Le cloud computing","Le edge computing","La virtualisation sur site","L\u0027informatique quantique"],"e":"Le **cloud computing** consiste à fournir des ressources informatiques à la demande via Internet, facturées selon l\u0027usage réel."},"en":{"q":"A company decides to rent on-demand computing power over the internet, paying only for what it actually consumes, rather than buying and maintaining its own servers. Which concept describes this approach?","o":["Cloud computing","Edge computing","On-premises virtualization","Quantum computing"],"e":"**Cloud computing** is the delivery of computing resources on demand over the internet, billed based on actual usage."}},{"n":2,"a":["B"],"fr":{"q":"Dans le cadre du modèle de responsabilité partagée, pour une machine virtuelle Azure (IaaS), qui doit appliquer les correctifs de sécurité au système d\u0027exploitation invité ?","o":["Microsoft, car il gère l\u0027intégralité de l\u0027infrastructure","Le client, car il reste responsable de l\u0027OS et des applications","Un partenaire certifié Azure obligatoirement","Personne, les correctifs sont inutiles en IaaS"],"e":"En **IaaS**, le client conserve la responsabilité du système d\u0027exploitation, des correctifs et des applications, tandis que Microsoft sécurise l\u0027infrastructure physique."},"en":{"q":"Under the shared responsibility model, for an Azure virtual machine (IaaS), who must apply security patches to the guest operating system?","o":["Microsoft, because it manages the entire infrastructure","The customer, because they remain responsible for the OS and applications","A certified Azure partner, mandatorily","No one, patches are unnecessary in IaaS"],"e":"In **IaaS**, the customer retains responsibility for the operating system, patches, and applications, while Microsoft secures the physical infrastructure."}},{"n":3,"a":["C"],"fr":{"q":"Une banque souhaite conserver ses données clients les plus sensibles dans son propre datacenter pour des raisons réglementaires, tout en exploitant Azure pour absorber les pics de charge de ses applications publiques. Quel modèle de déploiement cloud illustre cette stratégie ?","o":["Le cloud public pur","Le cloud communautaire","Le cloud hybride","Le cloud privé isolé"],"e":"Le **cloud hybride** combine une infrastructure privée sur site et des services de cloud public, reliés entre eux."},"en":{"q":"A bank wants to keep its most sensitive customer data in its own datacenter for regulatory reasons, while using Azure to absorb load peaks for its public-facing applications. Which cloud deployment model illustrates this strategy?","o":["Pure public cloud","Community cloud","Hybrid cloud","Isolated private cloud"],"e":"The **hybrid cloud** combines private on-premises infrastructure and public cloud services, connected to each other."}},{"n":4,"a":["D"],"fr":{"q":"Une startup choisit de payer ses ressources informatiques mensuellement en fonction de l\u0027usage, au lieu d\u0027investir dans du matériel qu\u0027elle devrait amortir sur plusieurs années. Quel type de dépense réduit-elle ainsi ?","o":["Les dépenses opérationnelles (OpEx)","Les charges sociales","Les dépenses de recherche et développement","Les dépenses d\u0027investissement (CapEx)"],"e":"En évitant l\u0027achat de matériel, l\u0027entreprise réduit ses **dépenses d\u0027investissement (CapEx)** au profit de dépenses opérationnelles flexibles."},"en":{"q":"A startup chooses to pay for its IT resources monthly based on usage, instead of investing in hardware that it would have to depreciate over several years. Which type of expenditure does it reduce this way?","o":["Operational expenditure (OpEx)","Payroll costs","Research and development expenditure","Capital expenditure (CapEx)"],"e":"By avoiding hardware purchases, the company reduces its **capital expenditure (CapEx)** in favor of flexible operational expenditure."}},{"n":5,"a":["A"],"fr":{"q":"Une entreprise accepte de s\u0027engager sur une utilisation continue d\u0027un type de machine virtuelle pendant trois ans en échange d\u0027une réduction tarifaire importante par rapport au tarif standard. Quel mécanisme de tarification Azure utilise-t-elle ?","o":["Les instances réservées","Le niveau gratuit Azure","Le paiement à l\u0027usage classique","Le crédit de support Premier"],"e":"Les **instances réservées** permettent d\u0027obtenir une remise importante en échange d\u0027un engagement d\u0027utilisation sur une durée définie (1 ou 3 ans)."},"en":{"q":"A company agrees to commit to continuous use of a virtual machine type for three years in exchange for a significant discount compared to the standard rate. Which Azure pricing mechanism is it using?","o":["Reserved instances","The Azure free tier","Standard pay-as-you-go","Premier support credit"],"e":"**Reserved instances** provide a significant discount in exchange for a usage commitment over a defined term (1 or 3 years)."}},{"n":6,"a":["B"],"fr":{"q":"Une équipe souhaite exécuter une fonction de traitement d\u0027image uniquement lorsqu\u0027un fichier est déposé dans un stockage, sans provisionner le moindre serveur et en ne payant que le temps de calcul réellement consommé. Quel modèle correspond à ce besoin ?","o":["L\u0027infrastructure as a service classique","L\u0027informatique serverless (sans serveur)","Un cloud privé dédié","Un cluster de machines virtuelles toujours actif"],"e":"Le modèle **serverless** exécute du code déclenché par des événements sans gestion de serveurs, avec une facturation à l\u0027exécution."},"en":{"q":"A team wants to run an image processing function only when a file is dropped into storage, without provisioning any server and paying only for the compute time actually consumed. Which model fits this need?","o":["Traditional infrastructure as a service","Serverless computing","A dedicated private cloud","An always-on cluster of virtual machines"],"e":"The **serverless** model runs event-triggered code without server management, with per-execution billing."}},{"n":7,"a":["C"],"fr":{"q":"Un éditeur de logiciels promet à ses clients que son application restera accessible 99,95 % du temps chaque mois, avec des pénalités financières en cas de non-respect. Quel document formalise cet engagement ?","o":["Le plan de reprise d\u0027activité","Le registre de conformité","Le contrat de niveau de service (SLA)","Le rapport d\u0027audit interne"],"e":"Le **SLA (Service Level Agreement)** définit un engagement mesurable de disponibilité ou de performance, assorti de compensations en cas de non-respect."},"en":{"q":"A software vendor promises its customers that its application will be available 99.95% of the time each month, with financial penalties if this commitment is not met. Which document formalizes this commitment?","o":["The disaster recovery plan","The compliance register","The service-level agreement (SLA)","The internal audit report"],"e":"The **SLA (Service Level Agreement)** defines a measurable availability or performance commitment, with compensation if it is not met."}},{"n":8,"a":["D"],"fr":{"q":"Un site marchand ajoute automatiquement des instances supplémentaires pendant une vente flash, puis les supprime dès que le trafic retombe, afin de ne payer que les ressources réellement nécessaires à chaque instant. Quelle cara
