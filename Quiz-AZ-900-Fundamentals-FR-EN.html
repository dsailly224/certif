ctéristique du cloud illustre ce comportement ?","o":["La scalabilité verticale manuelle","La redondance géographique","La virtualisation des postes de travail","L\u0027élasticité"],"e":"L\u0027**élasticité** désigne la capacité d\u0027un système cloud à ajouter ou retirer automatiquement des ressources en fonction de la demande réelle."},"en":{"q":"An e-commerce site automatically adds extra instances during a flash sale, then removes them as soon as traffic drops, so that it only pays for the resources actually needed at any given time. Which cloud characteristic does this behavior illustrate?","o":["Manual vertical scalability","Geographic redundancy","Desktop virtualization","Elasticity"],"e":"**Elasticity** refers to the ability of a cloud system to automatically add or remove resources based on actual demand."}},{"n":9,"a":["A"],"fr":{"q":"Après une panne d\u0027un de ses composants, un service cloud se rétablit automatiquement et continue de fonctionner conformément à ce qui était prévu. Quelle propriété du cloud est ici mise en avant ?","o":["La fiabilité (résilience)","La gouvernance","L\u0027élasticité tarifaire","La portabilité des données"],"e":"La **fiabilité** (ou résilience) correspond à la capacité d\u0027un système à se rétablir après une défaillance et à continuer de fonctionner comme attendu."},"en":{"q":"After one of its components fails, a cloud service automatically recovers and continues to function as intended. Which cloud property is highlighted here?","o":["Reliability (resiliency)","Governance","Pricing elasticity","Data portability"],"e":"**Reliability** (or resiliency) is the ability of a system to recover from a failure and continue to function as expected."}},{"n":10,"a":["B","D"],"fr":{"q":"Une organisation met en place des règles internes afin que l\u0027utilisation du cloud respecte ses budgets, ses obligations légales et ses standards de sécurité. Parmi les actions suivantes, lesquelles relèvent de cette gouvernance du cloud ?","o":["Choisir la couleur du thème du tableau de bord personnel","Définir des budgets et limites de dépenses par équipe","Configurer le fond d\u0027écran d\u0027un poste de travail utilisateur","Imposer des standards de conformité réglementaire sur les déploiements"],"e":"La **gouvernance cloud** englobe la définition de budgets, de limites et de standards de conformité, à l\u0027inverse de préférences purement esthétiques sans impact organisationnel."},"en":{"q":"An organization puts internal rules in place so that its use of the cloud complies with its budgets, legal obligations, and security standards. Which of the following actions are part of this cloud governance?","o":["Choosing the theme color of the personal dashboard","Defining budgets and spending limits per team","Configuring the wallpaper of a user\u0027s workstation","Enforcing regulatory compliance standards on deployments"],"e":"**Cloud governance** encompasses defining budgets, limits, and compliance standards, as opposed to purely cosmetic preferences with no organizational impact."}},{"n":11,"a":["B"],"fr":{"q":"Une équipe de développement veut déployer son application web sans jamais avoir à configurer ni mettre à jour le système d\u0027exploitation ou le runtime sous-jacent, la plateforme s\u0027en chargeant automatiquement. Quel modèle de service cloud utilise-t-elle ?","o":["IaaS (infrastructure as a service)","PaaS (plateforme as a service)","SaaS (logiciel as a service)","Une infrastructure on-premises classique"],"e":"Le **PaaS** fournit une plateforme managée (OS, runtime, middleware) permettant aux développeurs de se concentrer uniquement sur leur code."},"en":{"q":"A development team wants to deploy its web application without ever having to configure or update the underlying operating system or runtime, as the platform handles this automatically. Which cloud service model is it using?","o":["IaaS (infrastructure as a service)","PaaS (platform as a service)","SaaS (software as a service)","A traditional on-premises infrastructure"],"e":"**PaaS** provides a managed platform (OS, runtime, middleware) that lets developers focus solely on their code."}},{"n":12,"a":["C"],"fr":{"q":"Pour répondre à des exigences légales imposant que certaines données ne quittent jamais le territoire national et soient gérées par une entité spécifique, Azure propose des déploiements particuliers isolés du reste du cloud public. Comment appelle-t-on ces déploiements ?","o":["Des paires de régions","Des zones de disponibilité","Des régions souveraines","Des datacenters périphériques"],"e":"Les **régions souveraines** (par ex. Azure Government, Azure China) sont des instances isolées répondant à des exigences légales ou gouvernementales spécifiques."},"en":{"q":"To meet legal requirements that certain data must never leave national territory and must be managed by a specific entity, Azure offers special deployments isolated from the rest of the public cloud. What are these deployments called?","o":["Region pairs","Availability zones","Sovereign regions","Edge datacenters"],"e":"**Sovereign regions** (e.g. Azure Government, Azure China) are isolated instances that meet specific legal or government requirements."}},{"n":13,"a":["A","D"],"fr":{"q":"Une application critique doit continuer à fonctionner même si un datacenter entier d\u0027une région Azure subit une panne d\u0027alimentation. Parmi les affirmations suivantes sur les zones de disponibilité, lesquelles sont exactes ?","o":["Chaque zone de disponibilité correspond à un ou plusieurs datacenters physiquement séparés au sein d\u0027une même région","Une zone de disponibilité correspond toujours à un pays différent","Les zones de disponibilité remplacent entièrement le besoin de régions Azure","Les zones de disponibilité ne sont disponibles que dans certaines régions Azure"],"e":"Les **zones de disponibilité** regroupent des datacenters séparés physiquement au sein d\u0027une même région, mais toutes les régions Azure n\u0027en proposent pas."},"en":{"q":"A critical application must keep running even if an entire datacenter in an Azure region suffers a power outage. Which of the following statements about availability zones are correct?","o":["Each availability zone consists of one or more physically separate datacenters within the same region","An availability zone always corresponds to a different country","Availability zones completely replace the need for Azure regions","Availability zones are only available in certain Azure regions"],"e":"**Availability zones** group physically separate datacenters within the same region, but not all Azure regions offer them."}},{"n":14,"a":["D"],"fr":{"q":"Un administrateur souhaite appliquer une politique de conformité unique à l\u0027ensemble des abonnements Azure de plusieurs filiales d\u0027un grand groupe. Quel niveau de la hiérarchie Azure doit-il utiliser pour regrouper ces abonnements ?","o":["Le groupe de ressources","La zone de disponibilité","Le locataire (tenant) Microsoft Entra ID uniquement","Le groupe d\u0027administration (management group)"],"e":"Les **groupes d\u0027administration (management groups)** permettent d\u0027organiser plusieurs abonnements et d\u0027appliquer des politiques et des rôles de manière centralisée."},"en":{"q":"An administrator wants to apply a single compliance policy to all the Azure subscriptions of several subsidiaries of a large group. Which level of the Azure hierarchy should be used to group these subscriptions?","o":["The resource group","The availability zone","The Microsoft Entra ID tenant only","The management group"],"e":"**Management groups** make it possible to organize multiple subscriptions and apply policies and roles centrally."}},{"n":15,"a":["A"],"fr":{"q":"Une entreprise veut garantir qu\u0027un groupe de machines virtuelles identiques reste disponible même en cas de maintenance planifiée ou de panne matérielle imprévue au sein du même datacenter, sans faire évoluer automatiquement leur nombre. Quelle ressource Azure répond précisément à ce besoin ?","o":["Un groupe à haute disponibilité (availability set)","Un groupe identique de machines virtuelles (VM Scale Set)","Une zone de disponibilité unique","Azure Virtual Desktop"],"e":"Un **availability set** répartit des VM identiques sur des domaines de panne et de mise à jour distincts pour limiter l\u0027impact des pannes matérielles et des maintenances."},"en":{"q":"A company wants to ensure that a group of identical virtual machines remains available even during planned maintenance or an unexpected hardware failure within the same datacenter, without automatically changing their number. Which Azure resource precisely meets this need?","o":["An availability set","A virtual machine scale set (VM Scale Set)","A single availability zone","Azure Virtual Desktop"],"e":"An **availability set** distributes identical VMs across separate fault domains and update domains to limit the impact of hardware failures and maintenance."}},{"n":16,"a":["B"],"fr":{"q":"Une entreprise veut fournir à ses employés un environnement de bureau Windows complet, accessible depuis n\u0027importe quel appareil, et entièrement hébergé et géré dans Azure. Quel service Azure répond à ce besoin ?","o":["Azure Container Apps","Azure Virtual Desktop","Azure Functions","Azure Bastion"],"e":"**Azure Virtual Desktop** fournit des postes de travail et applications Windows virtualisés, accessibles à distance depuis le cloud."},"en":{"q":"A company wants to provide its employees with a full Windows desktop environment, accessible from any device, and fully hosted and managed in Azure. Which Azure service meets this need?","o":["Azure Container Apps","Azure Virtual Desktop","Azure Functions","Azure Bastion"],"e":"**Azure Virtual Desktop** provides virtualized Windows desktops and applications, accessible remotely from the cloud."}},{"n":17,"a":["A","C"],"fr":{"q":"Une équipe veut exécuter des conteneurs applicatifs dans Azure sans avoir à provisionner ni gérer elle-même les machines virtuelles ou les nœuds sous-jacents. Parmi les services suivants, lesquels répondent à ce besoin ?","o":["Azure Container Instances","Azure Kubernetes Service avec nœuds gérés par le client","Azure Container Apps","Azure Virtual Machine Scale Sets"],"e":"**Azure Container Instances** et **Azure Container Apps** exécutent des conteneurs sans que le client ait à gérer de machines virtuelles, contrairement à AKS classique ou aux VM Scale Sets."},"en":{"q":"A team wants to run application containers in Azure without having to provision or manage the underlying virtual machines or nodes itself. Which of the following services meet this need?","o":["Azure Container Instances","Azure Kubernetes Service with customer-managed nodes","Azure Container Apps","Azure Virtual Machine Scale Sets"],"e":"**Azure Container Instances** and **Azure Container Apps** run containers without the customer having to manage virtual machines, unlike traditional AKS or VM Scale Sets."}},{"n":18,"a":["C"],"fr":{"q":"Un développeur veut exécuter un petit bloc de code déclenché automatiquement chaque fois qu\u0027un message arrive dans une file d\u0027attente, en payant uniquement le temps d\u0027exécution réel. Quel service Azure est le plus adapté ?","o":["Azure App Service","Azure Kubernetes Service","Azure Functions","Azure Virtual Machines"],"e":"**Azure Functions** est le service serverless d\u0027Azure dédié à l\u0027exécution de code déclenché par des événements, facturé à l\u0027exécution."},"en":{"q":"A developer wants to run a small block of code that is automatically triggered each time a message arrives in a queue, paying only for the actual execution time. Which Azure service is the most suitable?","o":["Azure App Service","Azure Kubernetes Service","Azure Functions","Azure Virtual Machines"],"e":"**Azure Functions** is Azure\u0027s serverless service dedicated to running event-triggered code, billed per execution."}},{"n":19,"a":["D"],"fr":{"q":"Une équipe souhaite héberger un site web ASP.NET en production, avec mise à l\u0027échelle automatique, certificats SSL gérés et déploiements continus, sans gérer elle-même le système d\u0027exploitation du serveur. Quel service Azure correspond le mieux à ce besoin ?","o":["Azure Container Instances uniquement","Azure Data Box","Azure ExpressRoute","Azure App Service"],"e":"**Azure App Service** est une plateforme PaaS managée pour héberger des applications web avec mise à l\u0027échelle, SSL et intégration continue."},"en":{"q":"A team wants to host a production ASP.NET website with autoscaling, managed SSL certificates, and continuous deployment, without managing the server operating system itself. Which Azure service best fits this need?","o":["Azure Container Instances only","Azure Data Box","Azure ExpressRoute","Azure App Service"],"e":"**Azure App Service** is a managed PaaS platform for hosting web applications with scaling, SSL, and continuous integration."}},{"n":20,"a":["A"],"fr":{"q":"Une entreprise veut isoler logiquement ses ressources Azure dans un réseau privé, tout en autorisant une communication directe et sécurisée entre deux réseaux virtuels situés dans des régions différentes. Quelle fonctionnalité doit-elle configurer ?","o":["Un peering de réseaux virtuels (VNet peering)","Une zone de disponibilité partagée","Un groupe de ressources commun","Azure Data Box"],"e":"Le **peering de réseaux virtuels** permet de connecter directement deux VNets, y compris entre régions, via le réseau principal de Microsoft."},"en":{"q":"A company wants to logically isolate its Azure resources in a private network, while allowing direct and secure communication between two virtual networks located in different regions. Which feature should it configure?","o":["Virtual network peering (VNet peering)","A shared availability zone","A common resource group","Azure Data Box"],"e":"**Virtual network peering** directly connects two VNets, including across regions, over the Microsoft backbone network."}},{"n":21,"a":["B"],"fr":{"q":"Une organisation veut bloquer automatiquement les connexions à ses applications professionnelles lorsqu\u0027elles proviennent d\u0027un pays non autorisé, même si l\u0027utilisateur présente des identifiants valides. Quelle fonctionnalité Microsoft Entra ID permet d\u0027appliquer une telle règle contextuelle ?","o":["Azure RBAC","L\u0027accès conditionnel (Conditional Access)","Microsoft Entra Domain Services","Le niveau gratuit Microsoft Entra ID"],"e":"L\u0027**accès conditionnel** applique des règles basées sur le contexte (localisation, appareil, risque) pour autoriser, bloquer ou exiger une vérification supplémentaire."},"en":{"q":"An organization wants to automatically block sign-ins to its business applications when they come from an unauthorized country, even if the user presents valid credentials. Which Microsoft Entra ID feature makes it possible to enforce such a context-based rule?","o":["Azure RBAC","Conditional Access","Microsoft Entra Domain Services","The Microsoft Entra ID Free tier"],"e":"**Conditional Access** applies context-based rules (location, device, risk) to allow, block, or require additional verification."}},{"n":22,"a":["C"],"fr":{"q":"Une grande entreprise veut relier son datacenter sur site à Azure via une connexion privée dédiée, sans transiter par l\u0027Internet public, afin d\u0027obtenir une latence plus faible et plus prévisible qu\u0027un tunnel chiffré classique. Quelle solution doit-elle choisir ?","o":["Azure VPN Gateway en mode site à site","Un simple peering VNet","Azure ExpressRoute","Azure Private Link"],"e":"**ExpressRoute** établit une connexion privée dédiée entre un site client et Azure, en dehors d\u0027Internet, avec une latence plus stable qu\u0027un VPN classique."},"en":{"q":"A large company wants to connect its on-premises datacenter to Azure through a dedicated private connection, without going over the public internet, in order to get lower and more predictable latency than a traditional encrypted tunnel. Which solution should it choose?","o":["Azure VPN Gateway in site-to-site mode","A simple VNet peering","Azure ExpressRoute","Azure Private Link"],"e":"**ExpressRoute** establishes a dedicated private connection between a customer site and Azure, outside the internet, with more stable latency than a traditional VPN."}},{"n":23,"a":["D"],"fr":{"q":"Une entreprise veut qu\u0027une application cliente accède à un compte de stockage Azure uniquement via une adresse IP privée de son réseau virtuel, sans jamais exposer ce compte de stockage sur Internet. Quelle fonctionnalité doit-elle utiliser ?","o":["Un point de terminaison public","Un VPN point à site","Une zone de disponibilité","Un point de terminaison privé (Private Endpoint)"],"e":"Un **point de terminaison privé** attribue une adresse IP privée du VNet à un service Azure, évitant toute exposition publique du trafic."},"en":{"q":"A company wants a client application to access an Azure storage account only through a private IP address from its virtual network, without ever exposing that storage account to the internet. Which feature should it use?","o":["A public endpoint","A point-to-site VPN","An availability zone","A private endpoint"],"e":"A **private endpoint** assigns a private IP address from the VNet to an Azure service, avoiding any public exposure of the traffic."}},{"n":24,"a":["A"],"fr":{"q":"Une application doit stocker de grandes quantités de fichiers non structurés comme des images et des vidéos, accessibles via HTTP/HTTPS, avec différents niveaux de coût selon la fréquence d\u0027accès. Quel service de stockage Azure est le plus adapté, et quelle option permet de réduire les coûts pour des données rarement consultées ?","o":["Azure Blob Storage, avec le niveau d\u0027accès Archive ou Froid","Azure Table Storage, avec le niveau Premium","Azure Queue Storage, avec le niveau Chaud uniquement","Azure Files, avec la redondance LRS uniquement"],"e":"**Azure Blob Storage** est conçu pour les données non structurées, et les niveaux **Froid** ou **Archive** réduisent les coûts de stockage des données peu consultées."},"en":{"q":"An application must store large amounts of unstructured files such as images and videos, accessible over HTTP/HTTPS, with different cost levels depending on access frequency. Which Azure storage service is the most suitable, and which option reduces costs for rarely accessed data?","o":["Azure Blob Storage, with the Archive or Cool access tier","Azure Table Storage, with the Premium tier","Azure Queue Storage, with the Hot tier only","Azure Files, with LRS redundancy only"],"e":"**Azure Blob Storage** is designed for unstructured data, and the **Cool** or **Archive** tiers reduce storage costs for infrequently accessed data."}},{"n":25,"a":["B"],"fr":{"q":"Une entreprise veut que ses données de stockage restent disponibles même en cas de destruction complète de la région Azure principale, en les répliquant automatiquement vers une région secondaire éloignée. Quelle option de redondance doit-elle choisir au minimum ?","o":["LRS (stockage localement redondant)","GRS (stockage géo-redondant)","ZRS (stockage à redondance de zone)","Aucune redondance n\u0027est nécessaire, le stockage est toujours répliqué par défaut"],"e":"Le **GRS** réplique les données de manière asynchrone vers une région secondaire distante, contrairement à LRS et ZRS limités à une seule région."},"en":{"q":"A company wants its storage data to remain available even if the primary Azure region is completely destroyed, by automatically replicating it to a distant secondary region. Which redundancy option should it choose at a minimum?","o":["LRS (locally redundant storage)","GRS (geo-redundant storage)","ZRS (zone-redundant storage)","No redundancy is needed, storage is always replicated by default"],"e":"**GRS** replicates data asynchronously to a distant secondary region, unlike LRS and ZRS, which are limited to a single region."}},{"n":26,"a":["C"],"fr":{"q":"Une entreprise doit migrer plusieurs dizaines de téraoctets de données vers Azure, mais sa connexion Internet est trop lente pour un transfert en ligne dans un délai raisonnable. Quel service Azure est conçu pour ce type de transfert physique hors ligne ?","o":["AzCopy","Azure Storage Explorer","Azure Data Box","Azure File Sync"],"e":"**Azure Data Box** est un appareil physique sécurisé permettant de transférer de très grands volumes de données vers Azure sans dépendre du réseau."},"en":{"q":"A company must migrate several tens of terabytes of data to Azure, but its internet connection is too slow for an online transfer within a reasonable timeframe. Which Azure service is designed for this type of offline physical transfer?","o":["AzCopy","Azure Storage Explorer","Azure Data Box","Azure File Sync"],"e":"**Azure Data Box** is a secure physical device used to transfer very large volumes of data to Azure without relying on the network."}},{"n":27,"a":["D"],"fr":{"q":"Une entreprise veut autoriser automatiquement l\u0027accès à une application Azure à des utilisateurs invités travaillant chez un partenaire externe, sans créer de comptes internes distincts pour eux, tout en appliquant les mêmes politiques de sécurité. Quelle fonctionnalité Microsoft Entra ID permet cela ?","o":["Microsoft Entra Domain Services","Azure RBAC uniquement","Le niveau gratuit Microsoft Entra ID","La collaboration B2B (identités externes)"],"e":"La **collaboration B2B** (identités externes Microsoft Entra) permet d\u0027inviter des utilisateurs externes à accéder aux ressources avec leurs propres identifiants, sous le contrôle des politiques de l\u0027organisation."},"en":{"q":"A company wants to automatically grant access to an Azure application to guest users working for an external partner, without creating separate internal accounts for them, while applying the same security policies. Which Microsoft Entra ID feature enables this?","o":["Microsoft Entra Domain Services","Azure RBAC only","The Microsoft Entra ID Free tier","B2B collaboration (external identities)"],"e":"**B2B collaboration** (Microsoft Entra External ID) makes it possible to invite external users to access resources with their own credentials, under the control of the organization\u0027s policies."}},{"n":28,"a":["A"],"fr":{"q":"Avant de déployer une nouvelle solution dans Azure, une entreprise veut estimer le coût mensuel approximatif en fonction du type et du nombre de ressources prévues (VM, stockage, bande passante), sans encore rien déployer. Quel outil Azure est conçu pour cela ?","o":["La calculatrice de prix Azure (Pricing Calculator)","La calculatrice TCO","Azure Cost Management","Azure Advisor"],"e":"La **calculatrice de prix Azure** permet d\u0027estimer le coût mensuel d\u0027une architecture avant son déploiement, en fonction des ressources sélectionnées."},"en":{"q":"Before deploying a new solution in Azure, a company wants to estimate the approximate monthly cost based on the type and number of planned resources (VMs, storage, bandwidth), without deploying anything yet. Which Azure tool is designed for this?","o":["The Azure Pricing calculator","The TCO calculator","Azure Cost Management","Azure Advisor"],"e":"The **Azure Pricing calculator** makes it possible to estimate the monthly cost of an architecture before deploying it, based on the selected resources."}},{"n":29,"a":["B"],"fr":{"q":"Une entreprise encore hébergée entièrement sur site veut comparer le coût total de son infrastructure actuelle (matériel, électricité, personnel) avec le coût estimé d\u0027une migration vers Azure. Quel outil Microsoft est spécifiquement conçu pour cette comparaison ?","o":["La calculatrice de prix Azure","La calculatrice TCO (coût total de possession)","Azure Migrate","Azure Monitor"],"e":"La **calculatrice TCO** compare le coût total de possession d\u0027une infrastructure on-premises avec celui d\u0027une solution équivalente dans Azure."},"en":{"q":"A company that is still entirely hosted on-premises wants to compare the total cost of its current infrastructure (hardware, electricity, staff) with the estimated cost of migrating to Azure. Which Microsoft tool is specifically designed for this comparison?","o":["The Azure Pricing calculator","The Total Cost of Ownership (TCO) calculator","Azure Migrate","Azure Monitor"],"e":"The **TCO calculator** compares the total cost of ownership of an on-premises infrastructure with that of an equivalent solution in Azure."}},{"n":30,"a":["C"],"fr":{"q":"Une entreprise attribue à chaque ressource Azure une étiquette indiquant le service interne responsable (marketing, finance, IT), afin de pouvoir ensuite analyser précisément la répartition des dépenses par service dans ses rapports de facturation. Quelles fonctionnalités Azure combine-t-elle ici ?","o":["Azure Policy et Azure Blueprints","Les verrous de ressources et Azure Monitor","Les tags de ressources et Microsoft Cost Management","Microsoft Purview et Azure Advisor"],"e":"Les **tags** permettent de catégoriser les ressources, et **Microsoft Cost Management** exploite ensuite ces métadonnées pour analyser et répartir les coûts."},"en":{"q":"A company assigns each Azure resource a label indicating the responsible internal department (marketing, finance, IT), so that it can then precisely analyze the breakdown of spending by department in its billing reports. Which Azure features is it combining here?","o":["Azure Policy and Azure Blueprints","Resource locks and Azure Monitor","Resource tags and Microsoft Cost Management","Microsoft Purview and Azure Advisor"],"e":"**Tags** make it possible to categorize resources, and **Microsoft Cost Management** then uses this metadata to analyze and allocate costs."}},{"n":31,"a":["D"],"fr":{"q":"Une entreprise soumise à des obligations réglementaires veut cataloguer automatiquement ses données sensibles stockées dans Azure, les classifier et suivre leur cycle de vie à travers plusieurs sources. Quel service Microsoft répond à ce besoin de gouvernance des données ?","o":["Service Trust Portal","Azure Policy","Azure Resource Manager","Microsoft Purview"],"e":"**Microsoft Purview** permet de cataloguer, classifier et gouverner les données sensibles à travers différentes sources, y compris hybrides."},"en":{"q":"A company subject to regulatory obligations wants to automatically catalog its sensitive data stored in Azure, classify it, and track its lifecycle across multiple sources. Which Microsoft service meets this data governance need?","o":["Service Trust Portal","Azure Policy","Azure Resource Manager","Microsoft Purview"],"e":"**Microsoft Purview** makes it possible to catalog, classify, and govern sensitive data across different sources, including hybrid ones."}},{"n":32,"a":["A"],"fr":{"q":"Une entreprise veut empêcher que des machines virtuelles soient créées dans une région autre que celle approuvée par sa politique interne, et faire respecter automatiquement cette règle sur tous les nouveaux déploiements Azure. Quel service doit-elle utiliser ?","o":["Azure Policy","Azure Blueprints uniquement","Un verrou de ressource (resource lock)","Microsoft Defender for Cloud"],"e":"**Azure Policy** permet de définir des règles de conformité, comme restreindre les régions ou types de ressources autorisés, et de les appliquer automatiquement."},"en":{"q":"A company wants to prevent virtual machines from being created in any region other than the one approved by its internal policy, and to automatically enforce this rule on all new Azure deployments. Which service should it use?","o":["Azure Policy","Azure Blueprints only","A resource lock","Microsoft Defender for Cloud"],"e":"**Azure Policy** makes it possible to define compliance rules, such as restricting allowed regions or resource types, and enforce them automatically."}},{"n":33,"a":["B"],"fr":{"q":"Un administrateur veut empêcher que son équipe supprime accidentellement un groupe de ressources critique en production, tout en continuant à autoriser les modifications normales de configuration sur ces ressources. Quelle fonctionnalité doit-il appliquer ?","o":["Un verrou ReadOnly","Un verrou CanNotDelete (verrou de suppression)","Une politique Azure Policy de refus total","Un rôle Azure RBAC Lecteur"],"e":"Un **verrou CanNotDelete** empêche la suppression d\u0027une ressource tout en continuant d\u0027autoriser les modifications de configuration."},"en":{"q":"An administrator wants to prevent their team from accidentally deleting a critical production resource group, while still allowing normal configuration changes on those resources. Which feature should be applied?","o":["A ReadOnly lock","A CanNotDelete lock (delete lock)","An Azure Policy with a total deny","An Azure RBAC Reader role"],"e":"A **CanNotDelete lock** prevents a resource from being deleted while still allowing configuration changes."}},{"n":34,"a":["C"],"fr":{"q":"Un administrateur système doit exécuter rapidement une commande Azure CLI depuis n\u0027importe quel navigateur, sans installer d\u0027outil localement, directement depuis le portail Azure. Quel outil doit-il utiliser ?","o":["Azure Arc","L\u0027application mobile Azure","Azure Cloud Shell","Azure PowerShell installé localement"],"e":"**Azure Cloud Shell** est un terminal accessible depuis le navigateur, intégré au portail, qui ne nécessite aucune installation locale."},"en":{"q":"A system administrator needs to quickly run an Azure CLI command from any browser, without installing any tool locally, directly from the Azure portal. Which tool should be used?","o":["Azure Arc","The Azure mobile app","Azure Cloud Shell","Azure PowerShell installed locally"],"e":"**Azure Cloud Shell** is a browser-accessible terminal, integrated into the portal, that requires no local installation."}},{"n":35,"a":["D"],"fr":{"q":"Une équipe d\u0027infrastructure veut intégrer la création automatisée de ressources Azure dans un pipeline CI/CD externe, en appelant directement les fonctionnalités de gestion Azure de façon programmatique, sans interface graphique ni terminal interactif. Quelle approche est la plus adaptée ?","o":["Utiliser l\u0027application mobile Azure","Se connecter manuellement au portail Azure à chaque exécution","Utiliser uniquement Azure Advisor","Appeler l\u0027API REST Azure Resource Manager"],"e":"L\u0027**API REST Azure Resource Manager** permet d\u0027automatiser la gestion des ressources de façon programmatique, idéale pour une intégration dans un pipeline CI/CD."},"en":{"q":"An infrastructure team wants to integrate the automated creation of Azure resources into an external CI/CD pipeline, by calling Azure management capabilities directly and programmatically, without a graphical interface or interactive terminal. Which approach is the most suitable?","o":["Use the Azure mobile app","Sign in manually to the Azure portal on each run","Use Azure Advisor only","Call the Azure Resource Manager REST API"],"e":"The **Azure Resource Manager REST API** makes it possible to automate resource management programmatically, which is ideal for integration into a CI/CD pipeline."}},{"n":36,"a":["A"],"fr":{"q":"Une entreprise possède des serveurs Windows sur site, des machines virtuelles dans un autre fournisseur cloud, et des ressources Azure, et souhaite les gérer, les étiqueter et appliquer des politiques de conformité depuis une interface Azure unique. Quel service Azure permet d\u0027étendre cette gestion aux ressources hors Azure ?","o":["Azure Arc","Azure Bastion","Azure ExpressRoute","Azure Site Recovery"],"e":"**Azure Arc** étend la gestion et la gouvernance Azure (y compris Azure Policy et les tags) aux serveurs et clusters situés en dehors d\u0027Azure, sur site ou chez d\u0027autres fournisseurs cloud."},"en":{"q":"A company has on-premises Windows servers, virtual machines in another cloud provider, and Azure resources, and wants to manage them, tag them, and apply compliance policies from a single Azure interface. Which Azure service makes it possible to extend this management to non-Azure resources?","o":["Azure Arc","Azure Bastion","Azure ExpressRoute","Azure Site Recovery"],"e":"**Azure Arc** extends Azure management and governance (including Azure Policy and tags) to servers and clusters located outside Azure, on-premises or in other cloud providers."}},{"n":37,"a":["B","C"],"fr":{"q":"Une équipe souhaite définir l\u0027infrastructure Azure sous forme de fichiers texte versionnés, afin de pouvoir redéployer exactement le même environnement de façon fiable et répétée, sans configuration manuelle via le portail. Quels avantages offre l\u0027utilisation de modèles ARM ou Bicep dans ce contexte ?","o":["Ils imposent obligatoirement l\u0027utilisation exclusive du portail Azure","Les déploiements deviennent reproductibles et idempotents d\u0027un environnement à l\u0027autre","Le code d\u0027infrastructure peut être versionné et réutilisé comme n\u0027importe quel code applicatif","Ils ne peuvent être exécutés qu\u0027une seule fois, puis doivent être recréés entièrement"],"e":"Les modèles **ARM** et **Bicep** permettent de décrire l\u0027infrastructure sous forme de code, pour des déploiements reproductibles, idempotents et versionnables."},"en":{"q":"A team wants to define its Azure infrastructure as versioned text files, so that it can redeploy exactly the same environment reliably and repeatedly, without manual configuration through the portal. What benefits does using ARM templates or Bicep offer in this context?","o":["They mandatorily require exclusive use of the Azure portal","Deployments become repeatable and idempotent from one environment to another","Infrastructure code can be versioned and reused like any application code","They can only be run once, and then must be entirely recreated"],"e":"**ARM** templates and **Bicep** make it possible to describe infrastructure as code, for repeatable, idempotent, and versionable deployments."}},{"n":38,"a":["B"],"fr":{"q":"En consultant son abonnement, un administrateur découvre des recommandations personnalisées suggérant de redimensionner certaines machines virtuelles sous-utilisées et d\u0027activer le chiffrement sur certains disques. Quel service Azure génère ce type de recommandations ?","o":["Azure Service Health","Azure Advisor","Log Analytics","Application Insights"],"e":"**Azure Advisor** analyse la configuration et l\u0027utilisation des ressources pour fournir des recommandations en matière de coûts, de sécurité, de fiabilité et de performance."},"en":{"q":"While reviewing their subscription, an administrator finds personalized recommendations suggesting resizing some underutilized virtual machines and enabling encryption on certain disks. Which Azure service generates this type of recommendation?","o":["Azure Service Health","Azure Advisor","Log Analytics","Application Insights"],"e":"**Azure Advisor** analyzes resource configuration and usage to provide recommendations on cost, security, reliability, and performance."}},{"n":39,"a":["C"],"fr":{"q":"Une machine virtuelle précise devient soudainement inaccessible, alors qu\u0027aucune panne générale n\u0027est annoncée sur les autres services Azure. Quel outil l\u0027administrateur doit-il consulter pour obtenir l\u0027état de santé spécifique à cette ressource, plutôt qu\u0027une vue globale de la plateforme ?","o":["Azure Service Health","Azure Status (page publique)","Azure Resource Health","Microsoft Purview"],"e":"**Azure Resource Health** fournit l\u0027état de santé d\u0027une ressource spécifique, tandis qu\u0027**Azure Service Health** couvre les incidents affectant la plateforme Azure dans son ensemble."},"en":{"q":"A specific virtual machine suddenly becomes unreachable, even though no general outage has been announced for other Azure services. Which tool should the administrator check to get the health status specific to this resource, rather than a global view of the platform?","o":["Azure Service Health","Azure Status (public page)","Azure Resource Health","Microsoft Purview"],"e":"**Azure Resource Health** provides the health status of a specific resource, while **Azure Service Health** covers incidents affecting the Azure platform as a whole."}},{"n":40,"a":["D"],"fr":{"q":"Une équipe de développement veut suivre précisément les temps de réponse d\u0027une application web en production, détecter les exceptions et visualiser les transactions utilisateur de bout en bout. Quel composant d\u0027Azure Monitor est spécifiquement conçu pour la supervision applicative (APM) ?","o":["Log Analytics","Azure Advisor","Service Health","Application Insights"],"e":"**Application Insights** est le composant d\u0027Azure Monitor dédié à la supervision des performances applicatives (APM), incluant temps de réponse et suivi des exceptions."},"en":{"q":"A development team wants to precisely track the response times of a production web application, detect exceptions, and visualize end-to-end user transactions. Which Azure Monitor component is specifically designed for application performance monitoring (APM)?","o":["Log Analytics","Azure Advisor","Service Health","Application Insights"],"e":"**Application Insights** is the Azure Monitor component dedicated to application performance monitoring (APM), including response times and exception tracking."}}]},{"id":9,"title":{"fr":"Examen blanc 9 — Identité et conformité","en":"Practice exam 9 — Identity and compliance"},"questions":[{"n":1,"a":["A"],"fr":{"q":"Comment peut-on définir le mieux le **cloud computing** ?","o":["La fourniture à la demande de ressources informatiques (calcul, stockage, réseau) via Internet, facturées selon l\u0027usage","L\u0027achat unique de serveurs physiques installés dans les locaux de l\u0027entreprise","Un logiciel de sauvegarde installé localement sur chaque poste de travail","Un contrat de maintenance annuel pour du matériel réseau"],"e":"Le **cloud computing** fournit des ressources IT à la demande via Internet, avec une facturation basée sur la consommation réelle."},"en":{"q":"What is the best definition of **cloud computing**?","o":["The on-demand delivery of computing resources (compute, storage, networking) over the Internet, billed based on usage","A one-time purchase of physical servers installed on the company\u0027s premises","Backup software installed locally on each workstation","An annual maintenance contract for networking hardware"],"e":"**Cloud computing** delivers IT resources on demand over the Internet, with billing based on actual consumption."}},{"n":2,"a":["B"],"fr":{"q":"Dans le **modèle de responsabilité partagée**, qui reste toujours responsable de la sécurisation des données et des identités, quel que soit le modèle de service (IaaS, PaaS ou SaaS) utilisé ?","o":["Microsoft, en tant que fournisseur du cloud","Le client, quel que soit le service choisi","Un prestataire tiers indépendant","Aucune des deux parties, cette responsabilité n\u0027existe pas dans le cloud"],"e":"Le client conserve toujours la responsabilité de ses données, de ses identités et de la gestion des accès, même quand Microsoft gère l\u0027infrastructure sous-jacente."},"en":{"q":"In the **shared responsibility model**, who is always responsible for securing data and identities, regardless of the service model (IaaS, PaaS, or SaaS) used?","o":["Microsoft, as the cloud provider","The customer, regardless of the service chosen","An independent third-party provider","Neither party; this responsibility does not exist in the cloud"],"e":"The customer always retains responsibility for their data, identities, and access management, even when Microsoft manages the underlying infrastructure."}},{"n":3,"a":["C"],"fr":{"q":"Une entreprise héberge son application de paie sur ses propres serveurs internes pour des raisons réglementaires strictes, tout en utilisant Azure pour son site web public. Quel **modèle de déploiement** cloud décrit cette situation ?","o":["Cloud privé","Cloud public","Cloud hybride","Cloud communautaire"],"e":"L\u0027utilisation combinée d\u0027une infrastructure sur site et de services cloud publics correspond au modèle **hybride**."},"en":{"q":"A company hosts its payroll application on its own internal servers for strict regulatory reasons, while using Azure for its public website. Which cloud **deployment model** describes this situation?","o":["Private cloud","Public cloud","Hybrid cloud","Community cloud"],"e":"The combined use of on-premises infrastructure and public cloud services corresponds to the **hybrid** model."}},{"n":4,"a":["B"],"fr":{"q":"Une entreprise qui migre vers Azure paie désormais ses ressources informatiques mensuellement selon leur consommation, au lieu d\u0027acheter du matériel. Elle passe d\u0027un modèle de dépenses ______ à un modèle ______.","o":["OpEx ; CapEx","CapEx ; OpEx","CapEx ; CapEx","OpEx ; OpEx"],"e":"L\u0027achat de matériel est une dépense d\u0027investissement (**CapEx**), alors que le paiement à l\u0027usage dans le cloud est une dépense opérationnelle (**OpEx**)."},"en":{"q":"A company migrating to Azure now pays for its computing resources monthly based on consumption, instead of buying hardware. It is moving from a ______ expenditure model to a ______ expenditure model.","o":["OpEx ; CapEx","CapEx ; OpEx","CapEx ; CapEx","OpEx ; OpEx"],"e":"Buying hardware is a capital expenditure (**CapEx**), whereas pay-as-you-go in the cloud is an operational expenditure (**OpEx**)."}},{"n":5,"a":["A","B"],"fr":{"q":"Parmi les affirmations suivantes sur le modèle tarifaire **pay-as-you-go** d\u0027Azure, lesquelles sont correctes ?","o":["Vous payez uniquement pour les ressources réellement consommées, sans investissement initial","Vous pouvez arrêter d\u0027utiliser un service à tout moment sans pénalité contractuelle de longue durée","Il impose un engagement obligatoire minimum de 3 ans","Le tarif est strictement identique pour tous les clients, quelle que soit la région"],"e":"Le modèle pay-as-you-go élimine l\u0027investissement initial et n\u0027impose aucun engagement de durée, contrairement aux instances réservées."},"en":{"q":"Which of the following statements about the Azure **pay-as-you-go** pricing model are correct?","o":["You pay only for the resources you actually consume, with no upfront investment","You can stop using a service at any time without a long-term contractual penalty","It requires a mandatory minimum 3-year commitment","The price is strictly identical for all customers, regardless of the region"],"e":"The pay-as-you-go model eliminates upfront investment and imposes no term commitment, unlike reserved instances."}},{"n":6,"a":["B"],"fr":{"q":"Quelle caractéristique est propre à l\u0027informatique **serverless** (sans serveur) ?","o":["Le client doit provisionner et dimensionner manuellement les serveurs sous-jacents","Le fournisseur de cloud gère automatiquement l\u0027allocation des ressources et le client est facturé selon l\u0027exécution réelle du code","Les applications ne peuvent jamais être mises à l\u0027échelle automatiquement","Le code doit obligatoirement s\u0027exécuter en continu 24h/24"],"e":"Le modèle serverless (ex. **Azure Functions**) masque la gestion des serveurs et facture en fonction du temps d\u0027exécution réel."},"en":{"q":"Which characteristic is specific to **serverless** computing?","o":["The customer must manually provision and size the underlying servers","The cloud provider automatically manages resource allocation, and the customer is billed based on actual code execution","Applications can never scale automatically","The code must run continuously 24/7"],"e":"The serverless model (e.g., **Azure Functions**) abstracts server management and bills based on actual execution time."}},{"n":7,"a":["A"],"fr":{"q":"Que garantit un **SLA** (Service Level Agreement) Azure typique pour un service donné ?","o":["Un niveau contractuel de disponibilité, comme 99,9 %, avec des engagements de dédommagement en cas de non-respect","Que le service ne connaîtra jamais la moindre interruption","Un engagement de performance uniquement sur les coûts, pas sur la disponibilité","Une garantie de mise à jour gratuite de toutes les fonctionnalités"],"e":"Un SLA définit un engagement mesurable de disponibilité assorti de crédits de service en cas de non-respect, sans garantir une disponibilité absolue de 100 %."},"en":{"q":"What does a typical Azure **SLA** (Service Level Agreement) guarantee for a given service?","o":["A contractual level of availability, such as 99.9%, with compensation commitments if it is not met","That the service will never experience any interruption","A performance commitment on costs only, not on availability","A guarantee of free updates for all features"],"e":"An SLA defines a measurable availability commitment backed by service credits if it is not met, without guaranteeing absolute 100% availability."}},{"n":8,"a":["B"],"fr":{"q":"Un site e-commerce voit son trafic multiplié par 10 pendant les soldes, puis revenir à la normale ensuite, sans aucune intervention manuelle. Quelle propriété du cloud illustre le mieux ce comportement ?","o":["La scalabilité verticale uniquement","L\u0027élasticité","La redondance géographique","La virtualisation"],"e":"L\u0027**élasticité** désigne la capacité à augmenter ou réduire automatiquement les ressources selon la demande réelle."},"en":{"q":"An e-commerce website sees its traffic increase tenfold during sales, then return to normal afterward, without any manual intervention. Which cloud property best illustrates this behavior?","o":["Vertical scalability only","Elasticity","Geographic redundancy","Virtualization"],"e":"**Elasticity** refers to the ability to automatically increase or decrease resources based on actual demand."}},{"n":9,"a":["A"],"fr":{"q":"Dans le contexte Azure, que signifie la **prévisibilité** (predictability) d\u0027un service cloud ?","o":["La capacité à anticiper les performances et les coûts grâce à une mise à l\u0027échelle et une facturation cohérentes","La capacité à prédire les pannes matérielles avant qu\u0027elles ne surviennent","La garantie qu\u0027aucune mise à jour ne sera jamais appliquée","La capacité à deviner les besoins futurs des utilisateurs"],"e":"La prévisibilité recouvre à la fois la prévisibilité des performances (mise à l\u0027échelle) et celle des coûts (facturation cohérente)."},"en":{"q":"In the context of Azure, what does the **predictability** of a cloud service mean?","o":["The ability to anticipate performance and costs thanks to consistent scaling and billing","The ability to predict hardware failures before they occur","The guarantee that no update will ever be applied","The ability to guess users\u0027 future needs"],"e":"Predictability covers both performance predictability (scaling) and cost predictability (consistent billing)."}},{"n":10,"a":["A"],"fr":{"q":"Dans les concepts fondamentaux du cloud, à quoi sert la **gouvernance** ?","o":["À définir et faire respecter des règles, standards et contrôles sur l\u0027utilisation des ressources cloud au sein d\u0027une organisation","À augmenter uniquement la vitesse du réseau","À remplacer complètement le besoin d\u0027authentification","À garantir que tous les employés ont un accès administrateur global"],"e":"La gouvernance regroupe les règles et contrôles permettant d\u0027encadrer l\u0027usage des ressources cloud conformément aux politiques de l\u0027organisation."},"en":{"q":"In core cloud concepts, what is the purpose of **governance**?","o":["To define and enforce rules, standards, and controls on the use of cloud resources within an organization","To increase network speed only","To completely replace the need for authentication","To ensure that all employees have global administrator access"],"e":"Governance encompasses the rules and controls used to oversee the use of cloud resources in accordance with the organization\u0027s policies."}},{"n":11,"a":["B"],"fr":{"q":"Une équipe de développeurs veut déployer rapidement une application web sans avoir à gérer ni les serveurs, ni le système d\u0027exploitation, ni les correctifs, tout en gardant le contrôle du code applicatif. Quel modèle de service correspond à ce besoin ?","o":["IaaS","PaaS","SaaS","On-premises"],"e":"Le **PaaS** (ex. Azure App Service) fournit une plateforme managée où seule l\u0027application reste sous la responsabilité du client."},"en":{"q":"A team of developers wants to quickly deploy a web application without having to manage servers, the operating system, or patches, while keeping control of the application code. Which service model meets this need?","o":["IaaS","PaaS","SaaS","On-premises"],"e":"**PaaS** (e.g., Azure App Service) provides a managed platform where only the application remains the customer\u0027s responsibility."}},{"n":12,"a":["A"],"fr":{"q":"Une application critique doit rester disponible même en cas de panne totale d\u0027un datacenter, tout en conservant une latence réseau très faible entre ses composants, au sein d\u0027une même région Azure. Quelle fonctionnalité faut-il utiliser ?","o":["Les zones de disponibilité (Availability Zones)","Les paires de régions","Un seul datacenter avec redondance RAID","Un groupe de ressources supplémentaire"],"e":"Les **zones de disponibilité** sont des emplacements physiquement distincts au sein d\u0027une même région, offrant une tolérance aux pannes de datacenter avec une faible latence."},"en":{"q":"A critical application must remain available even if an entire datacenter fails, while maintaining very low network latency between its components, within a single Azure region. Which feature should be used?","o":["Availability zones","Region pairs","A single datacenter with RAID redundancy","An additional resource group"],"e":"**Availability zones** are physically separate locations within the same region, providing tolerance to datacenter failures with low latency."}},{"n":13,"a":["A"],"fr":{"q":"Quel est l\u0027ordre correct, du plus large au plus spécifique, de la hiérarchie d\u0027organisation des ressources Azure ?","o":["Groupes d\u0027administration \u003e Abonnements \u003e Groupes de ressources \u003e Ressources","Ressources \u003e Groupes de ressources \u003e Abonnements \u003e Groupes d\u0027administration","Abonnements \u003e Groupes d\u0027administration \u003e Ressources \u003e Groupes de ressources","Groupes de ressources \u003e Groupes d\u0027administration \u003e Abonnements \u003e Ressources"],"e":"La hiérarchie Azure va des **groupes d\u0027administration**, aux **abonnements**, puis aux **groupes de ressources**, et enfin aux ressources individuelles."},"en":{"q":"What is the correct order, from broadest to most specific, of the Azure resource organization hierarchy?","o":["Management groups \u003e Subscriptions \u003e Resource groups \u003e Resources","Resources \u003e Resource groups \u003e Subscriptions \u003e Management groups","Subscriptions \u003e Management groups \u003e Resources \u003e Resource groups","Resource groups \u003e Management groups \u003e Subscriptions \u003e Resources"],"e":"The Azure hierarchy goes from **management groups** to **subscriptions**, then to **resource groups**, and finally to individual resources."}},{"n":14,"a":["A"],"fr":{"q":"Une application web connaît des pics de trafic imprévisibles. Quel service Azure permet de créer et gérer automatiquement un nombre variable d\u0027instances de machines virtuelles identiques en fonction de la charge ?","o":["Azure Virtual Machine Scale Sets","Azure Container Instances","Azure Bastion","Azure Site Recovery"],"e":"Les **Virtual Machine Scale Sets** permettent de créer et d\u0027ajuster automatiquement un groupe de VM identiques selon la demande ou des règles définies."},"en":{"q":"A web application experiences unpredictable traffic spikes. Which Azure service lets you automatically create and manage a variable number of identical virtual machine instances based on load?","o":["Azure Virtual Machine Scale Sets","Azure Container Instances","Azure Bastion","Azure Site Recovery"],"e":"**Virtual Machine Scale Sets** let you create and automatically adjust a group of identical VMs based on demand or defined rules."}},{"n":15,"a":["B"],"fr":{"q":"Une entreprise doit exécuter un grand nombre de microservices conteneurisés avec une orchestration avancée (auto-réparation, mise à l\u0027échelle fine, gestion complète du cycle de vie). Quel service Azure est le plus adapté ?","o":["Azure Container Instances (ACI)","Azure Kubernetes Service (AKS)","Azure Functions","Azure Virtual Desktop"],"e":"**AKS** fournit une orchestration Kubernetes complète adaptée aux architectures de microservices complexes, contrairement à ACI qui vise des conteneurs isolés et simples."},"en":{"q":"A company needs to run a large number of containerized microservices with advanced orchestration (self-healing, fine-grained scaling, full lifecycle management). Which Azure service is the most suitable?","o":["Azure Container Instances (ACI)","Azure Kubernetes Service (AKS)","Azure Functions","Azure Virtual Desktop"],"e":"**AKS** provides full Kubernetes orchestration suited to complex microservice architectures, unlike ACI, which targets simple, isolated containers."}},{"n":16,"a":["A"],"fr":{"q":"Une équipe souhaite exécuter un court traitement déclenché uniquement lorsqu\u0027un fichier est déposé dans un conteneur de stockage, sans gérer d\u0027infrastructure, en ne payant que le temps d\u0027exécution réel. Quel service Azure correspond à ce besoin ?","o":["Azure Functions","Azure Virtual Machines","Azure Kubernetes Service","Azure ExpressRoute"],"e":"**Azure Functions** est un service serverless événementiel qui s\u0027exécute en réponse à un déclencheur et facture selon le temps d\u0027exécution réel."},"en":{"q":"A team wants to run a short process triggered only when a file is uploaded to a storage container, without managing infrastructure and paying only for actual execution time. Which Azure service meets this need?","o":["Azure Functions","Azure Virtual Machines","Azure Kubernetes Service","Azure ExpressRoute"],"e":"**Azure Functions** is an event-driven serverless service that runs in response to a trigger and bills based on actual execution time."}},{"n":17,"a":["C"],"fr":{"q":"Une entreprise veut protéger ses données contre la panne complète d\u0027une région Azure tout en bénéficiant d\u0027une réplication synchrone entre zones de disponibilité dans la région primaire. Quelle option de redondance de stockage choisir ?","o":["LRS (Locally Redundant Storage)","ZRS (Zone-Redundant Storage)","GZRS (Geo-Zone-Redundant Storage)","Stockage local sans réplication"],"e":"**GZRS** combine la réplication synchrone entre zones dans la région primaire et la réplication asynchrone vers une région secondaire, offrant résilience zonale et géographique."},"en":{"q":"A company wants to protect its data against the complete failure of an Azure region while benefiting from synchronous replication across availability zones in the primary region. Which storage redundancy option should it choose?","o":["LRS (Locally Redundant Storage)","ZRS (Zone-Redundant Storage)","GZRS (Geo-Zone-Redundant Storage)","Local storage without replication"],"e":"**GZRS** combines synchronous replication across zones in the primary region with asynchronous replication to a secondary region, providing both zonal and geographic resilience."}},{"n":18,"a":["A","B"],"fr":{"q":"Parmi les affirmations suivantes concernant **Azure ExpressRoute**, lesquelles sont exactes ?","o":["La connexion ne transite pas par l\u0027Internet public","Elle offre généralement une latence plus faible et plus prévisible qu\u0027une connexion VPN de site à site","Le trafic est automatiquement chiffré de bout en bout sans configuration supplémentaire","Elle ne peut relier qu\u0027un seul réseau virtuel Azure à la fois, sans possibilité d\u0027extension"],"e":"ExpressRoute fournit une connexion privée dédiée hors Internet public, avec une latence plus faible et prévisible ; elle ne chiffre pas nativement le trafic, contrairement à un VPN."},"en":{"q":"Which of the following statements about **Azure ExpressRoute** are true?","o":["The connection does not go over the public Internet","It generally offers lower and more predictable latency than a site-to-site VPN connection","Traffic is automatically encrypted end to end without any additional configuration","It can connect only one Azure virtual network at a time, with no possibility of extension"],"e":"ExpressRoute provides a dedicated private connection that bypasses the public Internet, with lower and more predictable latency; it does not natively encrypt traffic, unlike a VPN."}},{"n":19,"a":["B"],"fr":{"q":"Une entreprise doit migrer une application héritée nécessitant une authentification Kerberos et une jonction de domaine classique, sans vouloir gérer de contrôleurs de domaine Active Directory. Quel service Azure est le plus approprié ?","o":["Microsoft Entra ID","Microsoft Entra Domain Services","Azure Key Vault","Azure Bastion"],"e":"**Microsoft Entra Domain Services** fournit des services de domaine managés (Kerberos, NTLM, jonction de domaine) sans déployer de contrôleurs de domaine, contrairement à Entra ID basé sur des protocoles modernes comme OAuth/SAML."},"en":{"q":"A company needs to migrate a legacy application that requires Kerberos authentication and traditional domain join, without wanting to manage Active Directory domain controllers. Which Azure service is the most appropriate?","o":["Microsoft Entra ID","Microsoft Entra Domain Services","Azure Key Vault","Azure Bastion"],"e":"**Microsoft Entra Domain Services** provides managed domain services (Kerberos, NTLM, domain join) without deploying domain controllers, unlike Entra ID, which is based on modern protocols such as OAuth/SAML."}},{"n":20,"a":["B"],"fr":{"q":"Un employé se connecte une seule fois le matin et accède ensuite à Microsoft 365, à une application SaaS tierce et à une application interne sans ressaisir ses identifiants. Quelle fonctionnalité d\u0027identité illustre ce comportement ?","o":["L\u0027authentification multifacteur (MFA)","L\u0027authentification unique (SSO - Single Sign-On)","L\u0027accès conditionnel","Le verrouillage de compte"],"e":"Le **SSO** permet à un utilisateur de s\u0027authentifier une seule fois pour accéder à plusieurs applications sans ressaisir ses identifiants."},"en":{"q":"An employee signs in only once in the morning and then accesses Microsoft 365, a third-party SaaS application, and an internal application without re-entering their credentials. Which identity feature illustrates this behavior?","o":["Multifactor authentication (MFA)","Single sign-on (SSO)","Conditional Access","Account lockout"],"e":"**SSO** allows a user to authenticate once to access multiple applications without re-entering their credentials."}},{"n":21,"a":["A"],"fr":{"q":"Un utilisateur saisit correctement son mot de passe, puis doit confirmer sa connexion via une notification sur son application mobile authentificatrice avant d\u0027accéder à son compte. Quel mécanisme de sécurité est illustré ici ?","o":["L\u0027authentification multifacteur (MFA)","L\u0027authentification sans mot de passe","Le contrôle d\u0027accès basé sur les rôles (RBAC)","La fédération d\u0027identité B2B"],"e":"La **MFA** exige au moins deux facteurs de preuve d\u0027identité, ici un mot de passe (ce que l\u0027on sait) et une confirmation mobile (ce que l\u0027on possède)."},"en":{"q":"A user correctly enters their password, then must confirm the sign-in through a notification on their mobile authenticator app before accessing their account. Which security mechanism is illustrated here?","o":["Multifactor authentication (MFA)","Passwordless authentication","Role-based access control (RBAC)","B2B identity federation"],"e":"**MFA** requires at least two forms of identity proof, in this case a password (something you know) and a mobile confirmation (something you have)."}},{"n":22,"a":["A","B"],"fr":{"q":"Parmi les méthodes suivantes, lesquelles sont considérées comme de l\u0027**authentification sans mot de passe** par Microsoft Entra ID ?","o":["Windows Hello Entreprise","Une clé de sécurité FIDO2","Un mot de passe à usage unique envoyé par SMS","Une question de sécurité personnelle"],"e":"Windows Hello Entreprise et les clés de sécurité FIDO2 permettent de s\u0027authentifier sans jamais saisir de mot de passe, contrairement au code SMS ou aux questions de sécurité."},"en":{"q":"Which of the following methods are considered **passwordless authentication** by Microsoft Entra ID?","o":["Windows Hello for Business","A FIDO2 security key","A one-time password sent by SMS","A personal security question"],"e":"Windows Hello for Business and FIDO2 security keys allow users to authenticate without ever entering a password, unlike SMS codes or security questions."}},{"n":23,"a":["A"],"fr":{"q":"Une entreprise veut permettre à des employés d\u0027une organisation partenaire d\u0027accéder temporairement à certaines ressources internes avec leurs propres identifiants professionnels, sans créer de nouveaux comptes internes. Quelle fonctionnalité Microsoft Entra correspond à ce besoin ?","o":["Microsoft Entra B2B (collaboration externe)","Azure AD B2C","Microsoft Entra Domain Services","Azure Policy"],"e":"**Microsoft Entra B2B** permet d\u0027inviter des utilisateurs externes à accéder à des ressources avec leurs propres identifiants, alors qu\u0027Azure AD B2C cible les clients grand public pour des applications orientées consommateurs."},"en":{"q":"A company wants to allow employees of a partner organization to temporarily access certain internal resources using their own work credentials, without creating new internal accounts. Which Microsoft Entra feature meets this need?","o":["Microsoft Entra B2B (external collaboration)","Azure AD B2C","Microsoft Entra Domain Services","Azure Policy"],"e":"**Microsoft Entra B2B** lets you invite external users to access resources with their own credentials, whereas Azure AD B2C targets consumers for customer-facing applications."}},{"n":24,"a":["A"],"fr":{"q":"Une organisation souhaite bloquer automatiquement les connexions à ses applications professionnelles lorsqu\u0027elles proviennent d\u0027un pays inhabituel ou d\u0027un appareil non conforme, tout en autorisant les connexions normales sans friction supplémentaire. Quelle fonctionnalité permet cela ?","o":["L\u0027accès conditionnel (Conditional Access)","Le chiffrement au repos","Les groupes de ressources","Les verrous de ressources"],"e":"L\u0027**accès conditionnel** applique des règles automatisées (localisation, conformité de l\u0027appareil, risque de connexion) pour autoriser, bloquer ou exiger une vérification supplémentaire."},"en":{"q":"An organization wants to automatically block sign-ins to its business applications when they come from an unusual country or a non-compliant device, while allowing normal sign-ins without additional friction. Which feature enables this?","o":["Conditional Access","Encryption at rest","Resource groups","Resource locks"],"e":"**Conditional Access** applies automated rules (location, device compliance, sign-in risk) to allow, block, or require additional verification."}},{"n":25,"a":["A"],"fr":{"q":"Un administrateur veut autoriser un membre de l\u0027équipe réseau à gérer uniquement les ressources réseau d\u0027un groupe de ressources spécifique, sans pouvoir modifier les machines virtuelles ni les bases de données qui s\u0027y trouvent. Quel mécanisme Azure permet ce contrôle précis ?","o":["Azure RBAC (contrôle d\u0027accès basé sur les rôles)","Microsoft Defender for Cloud","Azure Policy uniquement","Les groupes d\u0027administration uniquement"],"e":"**Azure RBAC** permet d\u0027attribuer des rôles avec des permissions précises sur un périmètre donné, comme un rôle limité aux ressources réseau d\u0027un groupe de ressources."},"en":{"q":"An administrator wants to allow a member of the networking team to manage only the network resources of a specific resource group, without being able to modify the virtual machines or databases in it. Which Azure mechanism enables this fine-grained control?","o":["Azure RBAC (role-based access control)","Microsoft Defender for Cloud","Azure Policy only","Management groups only"],"e":"**Azure RBAC** lets you assign roles with precise permissions at a given scope, such as a role limited to the network resources of a resource group."}},{"n":26,"a":["B"],"fr":{"q":"Quel principe résume le mieux le modèle de sécurité **Confiance zéro** (Zero Trust) ?","o":["Faire confiance par défaut à tout appareil connecté au réseau interne de l\u0027entreprise","Vérifier explicitement chaque demande d\u0027accès, appliquer le moindre privilège et partir du principe qu\u0027une violation peut déjà avoir eu lieu","Supprimer toute authentification pour accélérer l\u0027accès aux ressources","N\u0027appliquer la sécurité qu\u0027au niveau du pare-feu périmétrique"],"e":"Le modèle Zero Trust repose sur la vérification explicite de chaque accès, le moindre privilège, et l\u0027hypothèse qu\u0027une brèche peut déjà exister, plutôt que de faire confiance au réseau interne."},"en":{"q":"Which principle best summarizes the **Zero Trust** security model?","o":["Trust by default any device connected to the company\u0027s internal network","Explicitly verify every access request, apply least privilege, and assume that a breach may have already occurred","Remove all authentication to speed up access to resources","Apply security only at the perimeter firewall"],"e":"The Zero Trust model relies on explicit verification of every access, least privilege, and the assumption that a breach may already exist, rather than trusting the internal network."}},{"n":27,"a":["A"],"fr":{"q":"Une entreprise souhaite obtenir un score de sécurité global de son environnement Azure, détecter les vulnérabilités de ses ressources et recevoir des recommandations priorisées pour les corriger. Quel service utiliser ?","o":["Microsoft Defender for Cloud","Azure Advisor uniquement pour les coûts","Service Trust Portal","Azure Monitor Workbooks"],"e":"**Microsoft Defender for Cloud** évalue la posture de sécurité (score de sécurité), détecte les vulnérabilités et propose des recommandations de durcissement."},"en":{"q":"A company wants to obtain an overall security score for its Azure environment, detect vulnerabilities in its resources, and receive prioritized recommendations to remediate them. Which service should it use?","o":["Microsoft Defender for Cloud","Azure Advisor for costs only","Service Trust Portal","Azure Monitor Workbooks"],"e":"**Microsoft Defender for Cloud** assesses security posture (secure score), detects vulnerabilities, and provides hardening recommendations."}},{"n":28,"a":["A"],"fr":{"q":"Parmi les éléments suivants, lequel influence directement le coût final des ressources Azure utilisées ?","o":["La région géographique de déploiement, le type de ressource et la quantité consommée","Uniquement la couleur du thème choisi dans le portail Azure","Le nombre de favoris ajoutés dans le portail","Le nom donné au groupe de ressources"],"e":"Le coût dépend principalement du type et de la quantité de ressources consommées, ainsi que de la région de déploiement, entre autres facteurs."},"en":{"q":"Which of the following directly affects the final cost of the Azure resources used?","o":["The geographic deployment region, the resource type, and the quantity consumed","Only the color of the theme chosen in the Azure portal","The number of favorites added in the portal","The name given to the resource group"],"e":"Cost depends mainly on the type and quantity of resources consumed, as well as the deployment region, among other factors."}},{"n":29,"a":["B"],"fr":{"q":"Une entreprise veut comparer le coût total de son infrastructure actuelle sur site (matériel, électricité, personnel inclus) avec le coût estimé d\u0027une migration complète vers Azure. Quel outil Microsoft est le plus adapté ?","o":["La calculatrice de prix Azure (Pricing Calculator)","La calculatrice TCO (Total Cost of Ownership)","Azure Advisor","Azure Monitor"],"e":"La **calculatrice TCO** compare les coûts globaux d\u0027une infrastructure on-premises à ceux d\u0027Azure, alors que la calculatrice de prix estime uniquement le coût des ressources Azure elles-mêmes."},"en":{"q":"A company wants to compare the total cost of its current on-premises infrastructure (including hardware, electricity, and staff) with the estimated cost of a full migration to Azure. Which Microsoft tool is the most suitable?","o":["The Azure Pricing calculator","The Total Cost of Ownership (TCO) calculator","Azure Advisor","Azure Monitor"],"e":"The **TCO calculator** compares the overall costs of an on-premises infrastructure with those of Azure, whereas the Pricing calculator only estimates the cost of the Azure resources themselves."}},{"n":30,"a":["A"],"fr":{"q":"Une équipe financière veut être alertée automatiquement par e-mail dès qu\u0027un abonnement Azure dépasse 80 % d\u0027un montant mensuel défini. Quel outil Azure permet de configurer ce type de seuil ?","o":["Microsoft Cost Management (budgets et alertes)","Azure Policy","Microsoft Purview","Service Trust Portal"],"e":"**Microsoft Cost Management** permet de définir des budgets et de configurer des alertes automatiques lorsque les dépenses atteignent un certain pourcentage du budget."},"en":{"q":"A finance team wants to be automatically alerted by email as soon as an Azure subscription exceeds 80% of a defined monthly amount. Which Azure tool lets you configure this type of threshold?","o":["Microsoft Cost Management (budgets and alerts)","Azure Policy","Microsoft Purview","Service Trust Portal"],"e":"**Microsoft Cost Management** lets you define budgets and configure automatic alerts when spending reaches a certain percentage of the budget."}},{"n":31,"a":["A"],"fr":{"q":"Une entreprise souhaite identifier précisément les coûts Azure générés par chaque département (marketing, R\u0026D, finance) dans ses rapports de facturation, sans créer d\u0027abonnements séparés. Quelle fonctionnalité Azure utiliser ?","o":["Les balises (tags)","Les zones de disponibilité","Les verrous de ressources","Le peering de réseaux virtuels"],"e":"Les **tags** (paires clé-valeur) permettent de catégoriser les ressources, par exemple par département, et de filtrer les rapports de coûts en conséquence."},"en":{"q":"A company wants to precisely identify the Azure costs generated by each department (marketing, R\u0026D, finance) in its billing reports, without creating separate subscriptions. Which Azure feature should it use?","o":["Tags","Availability zones","Resource locks","Virtual network peering"],"e":"**Tags** (key-value pairs) let you categorize resources, for example by department, and filter cost reports accordingly."}},{"n":32,"a":["A"],"fr":{"q":"Une organisation veut cartographier automatiquement l\u0027ensemble de ses données sensibles (numéros de carte bancaire, données personnelles) réparties entre Azure, d\u0027autres clouds et des sources on-premises, et appliquer une classification cohérente. Quel service Microsoft est conçu pour cela ?","o":["Microsoft Purview","Azure Bastion","Azure Site Recovery","Azure Load Balancer"],"e":"**Microsoft Purview** offre une gouvernance unifiée des données, incluant la découverte, la classification et le catalogage des données sensibles à travers des environnements hybrides et multicloud."},"en":{"q":"An organization wants to automatically map all of its sensitive data (credit card numbers, personal data) spread across Azure, other clouds, and on-premises sources, and apply consistent classification. Which Microsoft service is designed for this?","o":["Microsoft Purview","Azure Bastion","Azure Site Recovery","Azure Load Balancer"],"e":"**Microsoft Purview** provides unified data governance, including discovery, classification, and cataloging of sensitive data across hybrid and multicloud environments."}},{"n":33,"a":["A"],"fr":{"q":"Une entreprise veut empêcher automatiquement la création de toute nouvelle ressource en dehors de deux régions Azure autorisées, et signaler les ressources existantes non conformes. Quel service permet d\u0027appliquer cette règle ?","o":["Azure Policy","Azure RBAC","Microsoft Defender for Cloud","Azure Monitor"],"e":"**Azure Policy** permet de définir des règles, comme les régions autorisées, évaluées et appliquées sur les ressources, avec signalement ou blocage des ressources non conformes."},"en":{"q":"A company wants to automatically prevent the creation of any new resource outside two allowed Azure regions, and flag existing non-compliant resources. Which service lets you enforce this rule?","o":["Azure Policy","Azure RBAC","Microsoft Defender for Cloud","Azure Monitor"],"e":"**Azure Policy** lets you define rules, such as allowed regions, that are evaluated and enforced on resources, flagging or blocking non-compliant resources."}},{"n":34,"a":["A"],"fr":{"q":"Un administrateur veut empêcher toute suppression accidentelle d\u0027un groupe de ressources critique en production, tout en continuant à permettre sa modification normale. Quel paramètre doit-il appliquer ?","o":["Un verrou de type CanNotDelete (ne pas supprimer)","Un verrou de type ReadOnly (lecture seule)","Une politique Azure interdisant tout accès","Une suppression du rôle Propriétaire pour tous les utilisateurs"],"e":"Le verrou **CanNotDelete** empêche la suppression de la ressource tout en autorisant les autres opérations de gestion, contrairement au verrou ReadOnly qui bloque aussi les modifications."},"en":{"q":"An administrator wants to prevent any accidental deletion of a critical production resource group, while still allowing it to be modified normally. Which setting should they apply?","o":["A CanNotDelete lock (do not delete)","A ReadOnly lock (read-only)","An Azure policy denying all access","Removing the Owner role from all users"],"e":"The **CanNotDelete** lock prevents deletion of the resource while allowing other management operations, unlike the ReadOnly lock, which also blocks modifications."}},{"n":35,"a":["A"],"fr":{"q":"Une entreprise soumise à des audits de conformité souhaite consulter les rapports d\u0027audit tiers et la documentation sur la conformité réglementaire des services Microsoft (ex. ISO 27001, RGPD). Où peut-elle les trouver ?","o":["Le Service Trust Portal","Azure Monitor","Azure Cloud Shell","Le portail Azure Advisor"],"e":"Le **Service Trust Portal** centralise les rapports d\u0027audit, certifications et informations de conformité relatifs aux services Microsoft."},"en":{"q":"A company subject to compliance audits wants to review third-party audit reports and documentation on the regulatory compliance of Microsoft services (e.g., ISO 27001, GDPR). Where can it find them?","o":["The Service Trust Portal","Azure Monitor","Azure Cloud Shell","The Azure Advisor portal"],"e":"The **Service Trust Portal** centralizes audit reports, certifications, and compliance information related to Microsoft services."}},{"n":36,"a":["A"],"fr":{"q":"Un administrateur veut exécuter des commandes Azure CLI et PowerShell directement depuis son navigateur, sans rien installer localement, avec un stockage persistant pour ses scripts. Quel outil Azure utiliser ?","o":["Azure Cloud Shell","Azure Bastion","Azure Data Box","Azure Front Door"],"e":"**Azure Cloud Shell** est un environnement en ligne de commande accessible depuis le navigateur, prenant en charge Bash et PowerShell, avec un stockage persistant associé."},"en":{"q":"An administrator wants to run Azure CLI and PowerShell commands directly from their browser, without installing anything locally, with persistent storage for their scripts. Which Azure tool should they use?","o":["Azure Cloud Shell","Azure Bastion","Azure Data Box","Azure Front Door"],"e":"**Azure Cloud Shell** is a browser-accessible command-line environment that supports Bash and PowerShell, with associated persistent storage."}},{"n":37,"a":["A"],"fr":{"q":"Une entreprise possède des serveurs on-premises et des machines virtuelles dans un autre fournisseur cloud, et souhaite les gérer et leur appliquer des politiques de gouvernance depuis une interface Azure unique, comme s\u0027il s\u0027agissait de ressources Azure natives. Quel service permet cela ?","o":["Azure Arc","Azure ExpressRoute","Azure Front Door","Azure Data Factory"],"e":"**Azure Arc** étend la gestion Azure (gouvernance, politiques, surveillance) aux ressources situées en dehors d\u0027Azure, y compris on-premises et sur d\u0027autres clouds."},"en":{"q":"A company has on-premises servers and virtual machines in another cloud provider, and wants to manage them and apply governance policies to them from a single Azure interface, as if they were native Azure resources. Which service enables this?","o":["Azure Arc","Azure ExpressRoute","Azure Front Door","Azure Data Factory"],"e":"**Azure Arc** extends Azure management (governance, policies, monitoring) to resources located outside Azure, including on-premises and in other clouds."}},{"n":38,"a":["A"],"fr":{"q":"Une équipe veut déployer de façon reproductible une infrastructure identique dans plusieurs environnements (développement, test, production), en décrivant l\u0027état souhaité des ressources dans un fichier plutôt qu\u0027en les créant manuellement. Quelle approche Azure correspond à ce besoin ?","o":["Les modèles ARM ou Bicep (Infrastructure as Code)","La connexion via Azure Bastion","La configuration manuelle via le portail Azure uniquement","L\u0027utilisation exclusive d\u0027Azure Advisor"],"e":"Les modèles **ARM** et **Bicep** permettent de décrire l\u0027infrastructure de façon déclarative et de la déployer de manière cohérente et reproductible."},"en":{"q":"A team wants to repeatably deploy identical infrastructure across multiple environments (development, test, production) by describing the desired state of resources in a file rather than creating them manually. Which Azure approach meets this need?","o":["ARM or Bicep templates (Infrastructure as Code)","Connecting through Azure Bastion","Manual configuration through the Azure portal only","Exclusive use of Azure Advisor"],"e":"**ARM** and **Bicep** templates let you describe infrastructure declaratively and deploy it in a consistent, repeatable way."}},{"n":39,"a":["A"],"fr":{"q":"Après analyse de son environnement, un service Azure recommande de redimensionner une VM sous-utilisée, d\u0027activer la sauvegarde sur une ressource non protégée et d\u0027améliorer le score de sécurité global. Quel service fournit ces recommandations personnalisées ?","o":["Azure Advisor","Azure Status","Microsoft Purview","Azure DNS"],"e":"**Azure Advisor** analyse la configuration des ressources et propose des recommandations personnalisées sur les coûts, la sécurité, la fiabilité et les performances."},"en":{"q":"After analyzing its environment, an Azure service recommends resizing an underutilized VM, enabling backup on an unprotected resource, and improving the overall secure score. Which service provides these personalized recommendations?","o":["Azure Advisor","Azure Status","Microsoft Purview","Azure DNS"],"e":"**Azure Advisor** analyzes resource configuration and provides personalized recommendations on cost, security, reliability, and performance."}},{"n":40,"a":["A","B"],"fr":{"q":"Parmi les capacités suivantes, lesquelles sont fournies par la combinaison d\u0027**Azure Monitor** et d\u0027**Application Insights** pour une application web ?","o":["La collecte de métriques de performance et de journaux (logs) provenant des ressources Azure","Le suivi détaillé des requêtes, temps de réponse et
