ultifactor authentication** relies on verifiable factors such as an app notification or a one-time code; secret questions are not a valid MFA factor."}},{"n":26,"a":["B"],"fr":{"q":"Un administrateur veut accorder à un employé le droit de uniquement redémarrer et consulter les machines virtuelles d\u0027un groupe de ressources précis, sans pouvoir les supprimer ni modifier le réseau. Quel mécanisme Azure permet cela ?","o":["Azure Policy","Le contrôle d\u0027accès en fonction du rôle (Azure RBAC)","Un verrou de ressource","Microsoft Purview"],"e":"**Azure RBAC** permet d\u0027attribuer des rôles avec des permissions précises à un périmètre donné comme un groupe de ressources."},"en":{"q":"An administrator wants to grant an employee the right to only restart and view the virtual machines in a specific resource group, without being able to delete them or modify the network. Which Azure mechanism enables this?","o":["Azure Policy","Azure role-based access control (Azure RBAC)","A resource lock","Microsoft Purview"],"e":"**Azure RBAC** lets you assign roles with specific permissions at a given scope, such as a resource group."}},{"n":27,"a":["A"],"fr":{"q":"Une entreprise veut obtenir une évaluation continue de son niveau de sécurité sur l\u0027ensemble de ses ressources Azure, avec des recommandations concrètes pour corriger les vulnérabilités détectées. Quel service utiliser ?","o":["Microsoft Defender for Cloud","Azure Advisor uniquement","Azure Monitor","Service Trust Portal"],"e":"**Microsoft Defender for Cloud** évalue en continu la posture de sécurité des ressources et fournit des recommandations priorisées."},"en":{"q":"A company wants a continuous assessment of its security posture across all its Azure resources, with concrete recommendations to remediate the vulnerabilities detected. Which service should it use?","o":["Microsoft Defender for Cloud","Azure Advisor only","Azure Monitor","Service Trust Portal"],"e":"**Microsoft Defender for Cloud** continuously assesses the security posture of resources and provides prioritized recommendations."}},{"n":28,"a":["A"],"fr":{"q":"Avant de déployer une nouvelle solution sur Azure, une entreprise veut estimer précisément le coût mensuel prévisionnel selon les services choisis, la région et le volume prévu, sans encore rien déployer. Quel outil utiliser ?","o":["Le calculateur de prix Azure (Pricing Calculator)","Microsoft Cost Management","Azure Advisor","Le calculateur TCO"],"e":"Le **calculateur de prix Azure** permet d\u0027estimer le coût prévisionnel d\u0027une architecture avant son déploiement."},"en":{"q":"Before deploying a new solution on Azure, a company wants to accurately estimate the projected monthly cost based on the chosen services, region, and expected volume, without deploying anything yet. Which tool should it use?","o":["The Azure Pricing calculator","Microsoft Cost Management","Azure Advisor","The TCO calculator"],"e":"The **Azure Pricing calculator** lets you estimate the projected cost of an architecture before deploying it."}},{"n":29,"a":["B"],"fr":{"q":"Une entreprise qui possède son propre datacenter veut comparer le coût total de possession de son infrastructure actuelle avec celui d\u0027une migration vers Azure, en intégrant matériel, électricité et personnel. Quel outil est le plus adapté ?","o":["Le calculateur de prix Azure","Le calculateur TCO (Total Cost of Ownership)","Azure Monitor","Azure Policy"],"e":"Le **calculateur TCO** compare le coût total d\u0027une infrastructure on-premises existante avec le coût équivalent sur Azure."},"en":{"q":"A company that owns its own datacenter wants to compare the total cost of ownership of its current infrastructure with that of a migration to Azure, including hardware, electricity, and staff. Which tool is the most suitable?","o":["The Azure Pricing calculator","The Total Cost of Ownership (TCO) calculator","Azure Monitor","Azure Policy"],"e":"The **TCO calculator** compares the total cost of an existing on-premises infrastructure with the equivalent cost on Azure."}},{"n":30,"a":["A"],"fr":{"q":"Le responsable financier d\u0027une entreprise veut suivre en temps réel les dépenses Azure réelles de chaque département et recevoir une alerte automatique en cas de dépassement d\u0027un budget mensuel. Quel service utiliser ?","o":["Microsoft Cost Management","Azure Advisor","Azure Policy","Azure Service Health"],"e":"**Microsoft Cost Management** permet d\u0027analyser les dépenses réelles, de définir des budgets et de déclencher des alertes de dépassement."},"en":{"q":"A company\u0027s finance manager wants to track each department\u0027s actual Azure spending in real time and receive an automatic alert when a monthly budget is exceeded. Which service should be used?","o":["Microsoft Cost Management","Azure Advisor","Azure Policy","Azure Service Health"],"e":"**Microsoft Cost Management** lets you analyze actual spending, define budgets, and trigger alerts when budgets are exceeded."}},{"n":31,"a":["B"],"fr":{"q":"Une entreprise possède des centaines de ressources Azure partagées entre plusieurs projets et souhaite ensuite ventiler précisément les coûts par projet et par département dans ses rapports financiers. Que doit-elle mettre en place ?","o":["Des verrous de ressources","Des balises (tags) de métadonnées","Des zones de disponibilité","Des groupes d\u0027administration"],"e":"Les **tags** sont des paires nom/valeur attachées aux ressources qui permettent notamment de ventiler les coûts par projet ou département."},"en":{"q":"A company has hundreds of Azure resources shared across several projects and then wants to break down costs precisely by project and by department in its financial reports. What should it implement?","o":["Resource locks","Metadata tags","Availability zones","Management groups"],"e":"**Tags** are name/value pairs attached to resources that, among other things, allow costs to be broken down by project or department."}},{"n":32,"a":["A"],"fr":{"q":"Une organisation possède des données sensibles dispersées entre des bases de données on-premises, Azure et d\u0027autres clouds, et veut un inventaire centralisé classifiant automatiquement ces données selon leur sensibilité. Quel service répond à ce besoin ?","o":["Microsoft Purview","Azure Policy","Azure Advisor","Azure Monitor"],"e":"**Microsoft Purview** offre une gouvernance unifiée des données, avec découverte et classification à travers les environnements hybrides."},"en":{"q":"An organization has sensitive data scattered across on-premises databases, Azure, and other clouds, and wants a centralized inventory that automatically classifies this data by sensitivity. Which service meets this need?","o":["Microsoft Purview","Azure Policy","Azure Advisor","Azure Monitor"],"e":"**Microsoft Purview** provides unified data governance, with discovery and classification across hybrid environments."}},{"n":33,"a":["B"],"fr":{"q":"Une entreprise veut empêcher automatiquement la création de toute machine virtuelle en dehors de deux régions Azure autorisées, quelle que soit l\u0027équipe qui tente de la déployer. Quel service permet d\u0027imposer cette règle ?","o":["Azure RBAC","Azure Policy","Un verrou de ressource","Microsoft Cost Management"],"e":"**Azure Policy** permet de définir des règles évaluées automatiquement et d\u0027empêcher le déploiement de ressources non conformes."},"en":{"q":"A company wants to automatically prevent the creation of any virtual machine outside of two allowed Azure regions, regardless of which team attempts to deploy it. Which service enforces this rule?","o":["Azure RBAC","Azure Policy","A resource lock","Microsoft Cost Management"],"e":"**Azure Policy** lets you define rules that are evaluated automatically and prevent the deployment of non-compliant resources."}},{"n":34,"a":["A"],"fr":{"q":"Un administrateur veut empêcher que la base de données de production ne soit supprimée accidentellement par un collègue disposant pourtant des droits de contributeur sur la souscription. Quelle fonctionnalité Azure utiliser ?","o":["Un verrou de ressource (resource lock) en mode CanNotDelete","Azure Policy en mode audit","Un tag nomme production","Microsoft Purview"],"e":"Un **verrou de ressource** de type CanNotDelete empêche la suppression de la ressource, même par un utilisateur disposant des permissions de contributeur."},"en":{"q":"An administrator wants to prevent the production database from being accidentally deleted by a colleague who nevertheless has Contributor rights on the subscription. Which Azure feature should be used?","o":["A resource lock in CanNotDelete mode","Azure Policy in audit mode","A tag named production","Microsoft Purview"],"e":"A **resource lock** of type CanNotDelete prevents the resource from being deleted, even by a user with Contributor permissions."}},{"n":35,"a":["A"],"fr":{"q":"Une équipe de développement veut surveiller en continu les performances de son application web en production, détecter automatiquement les anomalies (temps de réponse, taux d\u0027erreur) et visualiser des journaux détaillés. Quel service est spécifiquement conçu pour cela ?","o":["Application Insights (fonctionnalité d\u0027Azure Monitor)","Azure Advisor","Microsoft Purview","Azure Policy"],"e":"**Application Insights**, composant d\u0027Azure Monitor, collecte la télémétrie des applications et permet de détecter automatiquement des anomalies de performance."},"en":{"q":"A development team wants to continuously monitor the performance of its production web application, automatically detect anomalies (response time, error rate), and view detailed logs. Which service is specifically designed for this?","o":["Application Insights (a feature of Azure Monitor)","Azure Advisor","Microsoft Purview","Azure Policy"],"e":"**Application Insights**, a component of Azure Monitor, collects application telemetry and can automatically detect performance anomalies."}},{"n":36,"a":["B"],"fr":{"q":"Une entreprise possède des serveurs physiques dans son propre datacenter ainsi que des machines virtuelles chez un autre fournisseur cloud, et souhaite les gérer et leur appliquer des politiques depuis Azure comme s\u0027il s\u0027agissait de ressources Azure natives. Quel service permet cela ?","o":["Azure Migrate","Azure Arc","Azure Site Recovery","Azure Bastion"],"e":"**Azure Arc** étend la gestion, la gouvernance et les outils Azure, dont Azure Policy, à des serveurs situés en dehors d\u0027Azure, y compris on-premises et sur d\u0027autres clouds."},"en":{"q":"A company has physical servers in its own datacenter as well as virtual machines with another cloud provider, and wants to manage them and apply policies to them from Azure as if they were native Azure resources. Which service enables this?","o":["Azure Migrate","Azure Arc","Azure Site Recovery","Azure Bastion"],"e":"**Azure Arc** extends Azure management, governance, and tools, including Azure Policy, to servers located outside Azure, including on-premises and in other clouds."}},{"n":37,"a":["A","C"],"fr":{"q":"Une équipe DevOps veut décrire son infrastructure Azure (réseaux, VM, stockage) sous forme de code afin de pouvoir redéployer un environnement identique de façon fiable et répétable. Parmi les éléments suivants, lesquels sont des formats de modèles déclaratifs d\u0027infrastructure as code pris en charge nativement par Azure Resource Manager ?","o":["Un modèle ARM au format JSON","Un script Azure CLI impératif","Un fichier Bicep","Une commande PowerShell exécutée manuellement"],"e":"Les **modèles ARM** (JSON) et les **fichiers Bicep** sont des langages déclaratifs d\u0027infrastructure as code, alors que les scripts CLI ou PowerShell sont des approches impératives."},"en":{"q":"A DevOps team wants to describe its Azure infrastructure (networks, VMs, storage) as code so it can reliably and repeatably redeploy an identical environment. Which of the following are declarative infrastructure as code template formats natively supported by Azure Resource Manager?","o":["An ARM template in JSON format","An imperative Azure CLI script","A Bicep file","A PowerShell command run manually"],"e":"**ARM templates** (JSON) and **Bicep files** are declarative infrastructure as code languages, whereas CLI or PowerShell scripts are imperative approaches."}},{"n":38,"a":["A"],"fr":{"q":"Un administrateur veut exécuter des commandes Azure CLI et PowerShell directement depuis son navigateur, sans rien installer sur son poste, en utilisant un stockage persistant pour ses scripts. Quel outil utiliser ?","o":["Azure Cloud Shell","Azure Resource Manager","Visual Studio Code en local","Azure Arc"],"e":"**Azure Cloud Shell** est un environnement shell interactif accessible depuis le navigateur, avec Bash ou PowerShell, sans installation locale."},"en":{"q":"An administrator wants to run Azure CLI and PowerShell commands directly from a web browser, without installing anything on their workstation, using persistent storage for their scripts. Which tool should they use?","o":["Azure Cloud Shell","Azure Resource Manager","Visual Studio Code locally","Azure Arc"],"e":"**Azure Cloud Shell** is an interactive, browser-accessible shell environment, with Bash or PowerShell, requiring no local installation."}},{"n":39,"a":["B"],"fr":{"q":"Une entreprise veut recevoir des recommandations personnalisées automatiques pour réduire ses coûts et améliorer la sécurité, la fiabilité et les performances de ses ressources Azure actuelles. Quel service consulter ?","o":["Azure Monitor","Azure Advisor","Azure Service Health","Application Insights"],"e":"**Azure Advisor** analyse la configuration des ressources pour proposer des recommandations personnalisées sur le coût, la sécurité, la fiabilité et les performances."},"en":{"q":"A company wants to receive automatic, personalized recommendations to reduce its costs and improve the security, reliability, and performance of its current Azure resources. Which service should it consult?","o":["Azure Monitor","Azure Advisor","Azure Service Health","Application Insights"],"e":"**Azure Advisor** analyzes resource configurations to provide personalized recommendations on cost, security, reliability, and performance."}},{"n":40,"a":["B"],"fr":{"q":"Une équipe veut être informée automatiquement lorsqu\u0027un incident Azure en cours affecte spécifiquement les ressources et la région utilisées par sa propre souscription, plutôt que de consulter un état général public de la plateforme. Quel service utiliser ?","o":["Azure Status (page publique)","Azure Service Health","Application Insights","Azure Policy"],"e":"**Azure Service Health** fournit un tableau de bord personnalisé des incidents impactant spécifiquement les ressources de l\u0027abonnement du client, contrairement à la page Azure Status qui est générale."},"en":{"q":"A team wants to be automatically notified when an ongoing Azure incident specifically affects the resources and region used by its own subscription, rather than checking a general public platform status. Which service should it use?","o":["Azure Status (public page)","Azure Service Health","Application Insights","Azure Policy"],"e":"**Azure Service Health** provides a personalized dashboard of incidents specifically affecting the resources in the customer\u0027s subscription, unlike the Azure Status page, which is general."}}]},{"id":3,"title":{"fr":"Examen blanc 3 — Comparaisons de services proches","en":"Practice exam 3 — Comparing similar services"},"questions":[{"n":1,"a":["A"],"fr":{"q":"Qu\u0027est-ce qui distingue fondamentalement le cloud computing d\u0027une infrastructure informatique traditionnelle hébergée sur site ?","o":["Le client paie à l\u0027usage les ressources consommées plutôt que d\u0027acheter du matériel à l\u0027avance","Le client doit obligatoirement installer ses serveurs dans son propre datacenter","Le client ne peut utiliser qu\u0027un seul type de service à la fois","Le client doit renouveler son matériel tous les trois ans"],"e":"Le cloud computing repose sur un modèle de consommation à la demande avec facturation à l\u0027usage, alors que l\u0027informatique traditionnelle nécessite un investissement matériel initial (**CapEx**)."},"en":{"q":"What fundamentally distinguishes cloud computing from a traditional on-premises IT infrastructure?","o":["The customer pays for the resources consumed on a pay-as-you-go basis instead of buying hardware up front","The customer must install its servers in its own datacenter","The customer can only use one type of service at a time","The customer must renew its hardware every three years"],"e":"Cloud computing is based on an on-demand consumption model with pay-as-you-go billing, whereas traditional IT requires an upfront hardware investment (**CapEx**)."}},{"n":2,"a":["A","C"],"fr":{"q":"Dans un modèle **IaaS**, lesquelles des tâches suivantes restent sous la responsabilité du client et non du fournisseur cloud ?","o":["L\u0027application des correctifs de sécurité sur le système d\u0027exploitation","La sécurité physique des datacenters","La classification et la protection des données stockées","La maintenance du câblage réseau physique"],"e":"En **IaaS**, le fournisseur gère l\u0027infrastructure physique (datacenters, réseau), tandis que le client reste responsable du système d\u0027exploitation, des applications et des données."},"en":{"q":"In an **IaaS** model, which of the following tasks remain the responsibility of the customer rather than the cloud provider?","o":["Applying security patches to the operating system","Physical security of the datacenters","Classifying and protecting the stored data","Maintaining the physical network cabling"],"e":"In **IaaS**, the provider manages the physical infrastructure (datacenters, network), while the customer remains responsible for the operating system, applications, and data."}},{"n":3,"a":["A"],"fr":{"q":"Quelle est la différence entre un modèle hybride et un modèle multicloud ?","o":["Le modèle hybride combine environnement sur site et cloud public, tandis que le modèle multicloud utilise plusieurs fournisseurs cloud publics","Le modèle hybride utilise uniquement des conteneurs, contrairement au multicloud","Le modèle multicloud n\u0027autorise qu\u0027un seul fournisseur mais plusieurs régions","Il n\u0027existe aucune différence, ce sont deux noms pour le même concept"],"e":"Le **cloud hybride** associe ressources locales et cloud public, alors que le **multicloud** consiste à utiliser les services de plusieurs fournisseurs cloud différents."},"en":{"q":"What is the difference between a hybrid model and a multi-cloud model?","o":["The hybrid model combines an on-premises environment with the public cloud, while the multi-cloud model uses multiple public cloud providers","The hybrid model uses only containers, unlike multi-cloud","The multi-cloud model allows only one provider but multiple regions","There is no difference; they are two names for the same concept"],"e":"**Hybrid cloud** combines on-premises resources with the public cloud, whereas **multi-cloud** means using services from several different cloud providers."}},{"n":4,"a":["A"],"fr":{"q":"Comment le passage au cloud transforme-t-il généralement les dépenses informatiques d\u0027une entreprise ?","o":["Il remplace les dépenses d\u0027investissement (CapEx) par des dépenses opérationnelles (OpEx)","Il transforme les dépenses opérationnelles en dépenses d\u0027investissement","Il supprime toute notion de coût pour l\u0027entreprise","Il oblige à payer la totalité des coûts sur plusieurs années à l\u0027avance"],"e":"Le cloud permet de payer les ressources au fur et à mesure de leur utilisation (**OpEx**), évitant l\u0027achat anticipé de matériel (**CapEx**)."},"en":{"q":"How does moving to the cloud typically change a company\u0027s IT spending?","o":["It replaces capital expenditure (CapEx) with operational expenditure (OpEx)","It turns operational expenditure into capital expenditure","It eliminates any notion of cost for the company","It requires paying all costs several years in advance"],"e":"The cloud lets you pay for resources as you use them (**OpEx**), avoiding the upfront purchase of hardware (**CapEx**)."}},{"n":5,"a":["A"],"fr":{"q":"Quelle est la différence entre la montée en puissance verticale (scale up) et la montée en puissance horizontale (scale out) ?","o":["La montée en puissance verticale augmente la capacité d\u0027une seule instance, tandis que l\u0027horizontale ajoute des instances supplémentaires","La montée en puissance horizontale consiste à remplacer un serveur par un serveur plus puissant","Les deux termes désignent exactement la même opération","La montée en puissance verticale ajoute toujours de nouvelles régions Azure"],"e":"Le **scale up** (vertical) augmente les ressources d\u0027une instance existante (CPU, RAM), alors que le **scale out** (horizontal) ajoute des instances identiques supplémentaires."},"en":{"q":"What is the difference between vertical scaling (scale up) and horizontal scaling (scale out)?","o":["Vertical scaling increases the capacity of a single instance, while horizontal scaling adds more instances","Horizontal scaling consists of replacing a server with a more powerful one","Both terms refer to exactly the same operation","Vertical scaling always adds new Azure regions"],"e":"**Scale up** (vertical) increases the resources of an existing instance (CPU, RAM), whereas **scale out** (horizontal) adds more identical instances."}},{"n":6,"a":["A"],"fr":{"q":"Quelle est la différence entre la scalabilité et l\u0027élasticité dans le cloud ?","o":["La scalabilité désigne la capacité à ajuster les ressources selon la demande, l\u0027élasticité ajoute l\u0027automatisation de cet ajustement en temps réel","La scalabilité ne concerne que la réduction des coûts, l\u0027élasticité que leur augmentation","L\u0027élasticité s\u0027applique uniquement aux bases de données relationnelles","Ce sont deux synonymes stricts sans aucune nuance"],"e":"La **scalabilité** est la capacité générale à augmenter ou réduire les ressources, tandis que l\u0027**élasticité** y ajoute un ajustement automatique et rapide en fonction de la charge réelle."},"en":{"q":"What is the difference between scalability and elasticity in the cloud?","o":["Scalability is the ability to adjust resources according to demand, while elasticity adds real-time automation of that adjustment","Scalability is only about reducing costs, and elasticity only about increasing them","Elasticity applies only to relational databases","They are strict synonyms with no nuance at all"],"e":"**Scalability** is the general ability to increase or decrease resources, while **elasticity** adds fast, automatic adjustment based on the actual load."}},{"n":7,"a":["A"],"fr":{"q":"Quelle est la différence principale entre la haute disponibilité et la reprise après sinistre (disaster recovery) ?","o":["La haute disponibilité vise à maintenir le service opérationnel en continu, la reprise après sinistre vise à restaurer le service après un incident majeur","La reprise après sinistre garantit qu\u0027aucune panne ne peut jamais survenir","La haute disponibilité ne s\u0027applique qu\u0027aux applications SaaS","Ce sont deux termes interchangeables qui désignent exactement la même chose"],"e":"La **haute disponibilité** minimise les interruptions de service, tandis que la **reprise après sinistre** définit le processus de restauration suite à un événement catastrophique."},"en":{"q":"What is the main difference between high availability and disaster recovery?","o":["High availability aims to keep the service running continuously, while disaster recovery aims to restore the service after a major incident","Disaster recovery guarantees that no outage can ever occur","High availability applies only to SaaS applications","They are interchangeable terms that mean exactly the same thing"],"e":"**High availability** minimizes service interruptions, while **disaster recovery** defines the process for restoring service after a catastrophic event."}},{"n":8,"a":["A"],"fr":{"q":"Une application dépend de deux services ayant chacun un SLA de 99,9 %. Quelle est la différence entre le SLA individuel de chaque service et le SLA composite de l\u0027application ?","o":["Le SLA composite est généralement inférieur, car la disponibilité globale résulte de la multiplication des probabilités de disponibilité de chaque service","Le SLA composite est toujours supérieur à chacun des SLA individuels","Le SLA composite est la moyenne arithmétique simple des deux SLA","Le SLA composite n\u0027existe pas dans le cloud, seul le SLA individuel compte"],"e":"Lorsque plusieurs services dépendants sont combinés, le **SLA composite** est obtenu en multipliant les disponibilités, ce qui donne généralement un résultat inférieur à chaque SLA pris isolément."},"en":{"q":"An application depends on two services, each with an SLA of 99.9%. What is the difference between the individual SLA of each service and the composite SLA of the application?","o":["The composite SLA is generally lower, because overall availability results from multiplying the availability probabilities of each service","The composite SLA is always higher than each of the individual SLAs","The composite SLA is the simple arithmetic mean of the two SLAs","Composite SLAs do not exist in the cloud; only the individual SLA matters"],"e":"When multiple dependent services are combined, the **composite SLA** is obtained by multiplying their availabilities, which generally gives a result lower than each SLA taken individually."}},{"n":9,"a":["A"],"fr":{"q":"Quelle est la différence entre une architecture serverless et une machine virtuelle classique en IaaS ?","o":["En serverless, le fournisseur gère automatiquement l\u0027allocation et la mise à l\u0027échelle de l\u0027infrastructure sous-jacente, contrairement à une VM que le client doit dimensionner lui-même","Le serverless nécessite que le client configure manuellement chaque serveur physique","Une VM s\u0027adapte automatiquement à la charge sans aucune intervention, contrairement au serverless","Le serverless ne peut exécuter aucun code applicatif"],"e":"Le **serverless** (par exemple Azure Functions) masque entièrement la gestion des serveurs et met à l\u0027échelle automatiquement, alors qu\u0027une VM doit être dimensionnée et administrée par le client."},"en":{"q":"What is the difference between a serverless architecture and a traditional virtual machine in IaaS?","o":["With serverless, the provider automatically handles the allocation and scaling of the underlying infrastructure, unlike a VM, which the customer must size themselves","Serverless requires the customer to manually configure each physical server","A VM automatically adapts to the load without any intervention, unlike serverless","Serverless cannot run any application code"],"e":"**Serverless** (for example, Azure Functions) completely hides server management and scales automatically, whereas a VM must be sized and administered by the customer."}},{"n":10,"a":["A"],"fr":{"q":"Quelle est la différence majeure entre IaaS et PaaS en matière de responsabilités ?","o":["En IaaS, le client gère le système d\u0027exploitation et les correctifs, en PaaS c\u0027est le fournisseur qui gère la plateforme sous-jacente","En PaaS, le client doit gérer physiquement les serveurs","En IaaS, le fournisseur gère entièrement le code applicatif du client","Il n\u0027y a aucune différence, les deux modèles sont identiques"],"e":"En **IaaS**, le client administre l\u0027OS et les mises à jour, alors qu\u0027en **PaaS**, le fournisseur gère la plateforme (OS, runtime), laissant le client se concentrer sur son code."},"en":{"q":"What is the major difference between IaaS and PaaS in terms of responsibilities?","o":["In IaaS, the customer manages the operating system and patches; in PaaS, the provider manages the underlying platform","In PaaS, the customer must physically manage the servers","In IaaS, the provider fully manages the customer\u0027s application code","There is no difference; the two models are identical"],"e":"In **IaaS**, the customer administers the OS and updates, whereas in **PaaS**, the provider manages the platform (OS, runtime), letting the customer focus on their code."}},{"n":11,"a":["A"],"fr":{"q":"Quelle est la différence entre PaaS et SaaS du point de vue du client ?","o":["En PaaS, le client développe et déploie ses propres applications sur une plateforme managée, en SaaS il utilise directement une application complète déjà prête à l\u0027emploi","En SaaS, le client doit gérer le middleware et le runtime applicatif","En PaaS, le client n\u0027a accès à aucun outil de développement","SaaS et PaaS désignent tous deux la gestion complète du matériel par le client"],"e":"Le **PaaS** fournit une plateforme pour développer et héberger des applications, tandis que le **SaaS** (comme Microsoft 365) livre une application entièrement finie, prête à l\u0027utilisation."},"en":{"q":"What is the difference between PaaS and SaaS from the customer\u0027s point of view?","o":["In PaaS, the customer develops and deploys their own applications on a managed platform; in SaaS, they directly use a complete, ready-to-use application","In SaaS, the customer must manage the middleware and the application runtime","In PaaS, the customer has no access to any development tools","SaaS and PaaS both mean the customer fully manages the hardware"],"e":"**PaaS** provides a platform for developing and hosting applications, while **SaaS** (such as Microsoft 365) delivers a fully finished application, ready to use."}},{"n":12,"a":["A"],"fr":{"q":"Quelle est la différence entre une région Azure et une paire de régions (region pair) ?","o":["Une paire de régions associe deux régions distinctes au sein d\u0027une même zone géographique pour la réplication et la reprise après sinistre","Une paire de régions désigne deux zones de disponibilité au sein d\u0027une même région","Une région est toujours composée d\u0027exactement deux datacenters","Une paire de régions correspond à deux abonnements liés entre eux"],"e":"Une **paire de régions** relie deux régions Azure généralement situées dans la même zone géographique, utilisées pour répliquer les données et assurer la continuité en cas de sinistre régional."},"en":{"q":"What is the difference between an Azure region and a region pair?","o":["A region pair links two distinct regions within the same geography for replication and disaster recovery","A region pair refers to two availability zones within the same region","A region is always made up of exactly two datacenters","A region pair corresponds to two subscriptions linked together"],"e":"A **region pair** links two Azure regions, generally located in the same geography, used to replicate data and ensure continuity in the event of a regional disaster."}},{"n":13,"a":["A"],"fr":{"q":"Quelle est la différence entre une zone de disponibilité et une région Azure ?","o":["Une zone de disponibilité est un ou plusieurs datacenters physiquement séparés au sein d\u0027une même région, offrant une protection contre les pannes locales","Une région est un sous-ensemble d\u0027une zone de disponibilité","Une zone de disponibilité regroupe plusieurs régions distinctes du monde entier","Les zones de disponibilité et les régions désignent exactement le même concept"],"e":"Une **région** est une zone géographique contenant un ou plusieurs datacenters, et les **zones de disponibilité** sont des emplacements physiquement distincts au sein de cette même région."},"en":{"q":"What is the difference between an availability zone and an Azure region?","o":["An availability zone is one or more physically separate datacenters within the same region, providing protection against local failures","A region is a subset of an availability zone","An availability zone groups several distinct regions around the world","Availability zones and regions refer to exactly the same concept"],"e":"A **region** is a geographical area containing one or more datacenters, and **availability zones** are physically separate locations within that same region."}},{"n":14,"a":["A"],"fr":{"q":"Quelle est la différence entre un groupe d\u0027administration (management group) et une souscription Azure ?","o":["Un groupe d\u0027administration permet d\u0027organiser plusieurs souscriptions pour appliquer des stratégies de gouvernance communes, la souscription regroupe des ressources facturées","Une souscription contient toujours plusieurs groupes d\u0027administration","Un groupe d\u0027administration est l\u0027unité de facturation de base dans Azure","Les groupes d\u0027administration remplacent entièrement les souscriptions depuis 2020"],"e":"Les **groupes d\u0027administration** se situent au-dessus des souscriptions dans la hiérarchie Azure et permettent de gérer l\u0027accès et les stratégies sur plusieurs souscriptions à la fois."},"en":{"q":"What is the difference between a management group and an Azure subscription?","o":["A management group lets you organize multiple subscriptions to apply common governance policies, while the subscription groups billed resources","A subscription always contains several management groups","A management group is the basic billing unit in Azure","Management groups have completely replaced subscriptions since 2020"],"e":"**Management groups** sit above subscriptions in the Azure hierarchy and let you manage access and policies across multiple subscriptions at once."}},{"n":15,"a":["A"],"fr":{"q":"Quelle est la différence entre une souscription Azure et un groupe de ressources ?","o":["La souscription définit les limites de facturation et d\u0027accès, tandis que le groupe de ressources est un conteneur logique regroupant des ressources liées au sein de cette souscription","Un groupe de ressources peut contenir plusieurs souscriptions","La souscription ne sert qu\u0027à nommer les ressources, sans impact sur la facturation","Les groupes de ressources et les souscriptions sont facturés indépendamment l\u0027un de l\u0027autre"],"e":"Une **souscription** définit la facturation et les quotas, alors qu\u0027un **groupe de ressources** organise logiquement un ensemble de ressources partageant le même cycle de vie."},"en":{"q":"What is the difference between an Azure subscription and a resource group?","o":["The subscription defines billing and access boundaries, while the resource group is a logical container that groups related resources within that subscription","A resource group can contain several subscriptions","The subscription is only used to name resources, with no impact on billing","Resource groups and subscriptions are billed independently of each other"],"e":"A **subscription** defines billing and quotas, whereas a **resource group** logically organizes a set of resources that share the same lifecycle."}},{"n":16,"a":["A"],"fr":{"q":"Quelle est la différence entre un groupe à haute disponibilité (availability set) et un Virtual Machine Scale Set ?","o":["Un availability set répartit des VM existantes sur plusieurs domaines de panne pour la résilience, alors qu\u0027un Scale Set ajoute et retire automatiquement des instances identiques selon la charge","Un Scale Set ne peut contenir qu\u0027une seule machine virtuelle à la fois","Un availability set met automatiquement à l\u0027échelle le nombre de VM selon le trafic","Les deux concepts sont strictement identiques et interchangeables"],"e":"L\u0027**availability set** protège contre les pannes matérielles en répartissant les VM, tandis qu\u0027un **VM Scale Set** gère dynamiquement le nombre d\u0027instances pour la mise à l\u0027échelle automatique."},"en":{"q":"What is the difference between an availability set and a Virtual Machine Scale Set?","o":["An availability set distributes existing VMs across multiple fault domains for resiliency, whereas a Scale Set automatically adds and removes identical instances based on load","A Scale Set can contain only one virtual machine at a time","An availability set automatically scales the number of VMs based on traffic","The two concepts are strictly identical and interchangeable"],"e":"An **availability set** protects against hardware failures by distributing VMs, while a **VM Scale Set** dynamically manages the number of instances for autoscaling."}},{"n":17,"a":["A","C"],"fr":{"q":"Lesquels de ces services Azure permettent d\u0027exécuter des conteneurs sans que le client ait à gérer directement les machines virtuelles sous-jacentes ?","o":["Azure Container Instances","Azure Virtual Machine Scale Sets","Azure Container Apps","Un cluster Azure Kubernetes Service en mode nœuds standards"],"e":"**Azure Container Instances** et **Azure Container Apps** sont des services serverless qui exécutent des conteneurs sans que le client gère de VM, contrairement à un cluster AKS classique ou à un Scale Set qui reposent sur des machines virtuelles gérées par le client."},"en":{"q":"Which of these Azure services let you run containers without the customer having to directly manage the underlying virtual machines?","o":["Azure Container Instances","Azure Virtual Machine Scale Sets","Azure Container Apps","An Azure Kubernetes Service cluster with standard nodes"],"e":"**Azure Container Instances** and **Azure Container Apps** are serverless services that run containers without the customer managing VMs, unlike a standard AKS cluster or a Scale Set, which rely on virtual machines managed by the customer."}},{"n":18,"a":["A"],"fr":{"q":"Quelle est la différence entre Azure Kubernetes Service (AKS) et Azure Container Apps ?","o":["AKS offre un contrôle complet sur l\u0027orchestration Kubernetes et l\u0027infrastructure des nœuds, tandis qu\u0027Azure Container Apps masque cette complexité pour exécuter des microservices sans gérer Kubernetes","Azure Container Apps nécessite de configurer manuellement le plan de contrôle Kubernetes","AKS ne peut exécuter qu\u0027un seul conteneur à la fois","Les deux services sont identiques et ciblent exactement le même usage"],"e":"**AKS** expose directement Kubernetes avec un contrôle fin sur les nœuds, alors qu\u0027**Azure Container Apps** est une solution managée simplifiée qui abstrait Kubernetes pour exécuter des applications conteneurisées."},"en":{"q":"What is the difference between Azure Kubernetes Service (AKS) and Azure Container Apps?","o":["AKS provides full control over Kubernetes orchestration and node infrastructure, while Azure Container Apps hides this complexity to run microservices without managing Kubernetes","Azure Container Apps requires you to manually configure the Kubernetes control plane","AKS can run only one container at a time","The two services are identical and target exactly the same use case"],"e":"**AKS** exposes Kubernetes directly with fine-grained control over nodes, whereas **Azure Container Apps** is a simplified managed solution that abstracts Kubernetes to run containerized applications."}},{"n":19,"a":["A"],"fr":{"q":"Quelle est la différence entre Azure Functions en plan Consommation et Azure App Service en plan dédié ?","o":["Azure Functions en Consommation facture uniquement le temps d\u0027exécution réel et met à l\u0027échelle automatiquement à zéro, tandis qu\u0027App Service en plan dédié réserve des ressources en continu même sans trafic","App Service en plan dédié ne peut héberger aucune application web","Azure Functions en Consommation nécessite de réserver des VM dédiées à l\u0027avance","Les deux modèles facturent exactement de la même façon, à l\u0027heure de serveur réservé"],"e":"Le plan **Consommation** d\u0027Azure Functions facture à l\u0027exécution et peut descendre à zéro instance, contrairement à un plan **App Service** dédié qui maintient des ressources allouées en permanence."},"en":{"q":"What is the difference between Azure Functions on a Consumption plan and Azure App Service on a dedicated plan?","o":["Azure Functions on the Consumption plan bills only for actual execution time and automatically scales down to zero, while App Service on a dedicated plan reserves resources continuously, even without traffic","App Service on a dedicated plan cannot host any web application","Azure Functions on the Consumption plan requires reserving dedicated VMs in advance","Both models are billed in exactly the same way, per reserved server hour"],"e":"The Azure Functions **Consumption** plan bills per execution and can scale down to zero instances, unlike a dedicated **App Service** plan, which keeps resources allocated at all times."}},{"n":20,"a":["A"],"fr":{"q":"Quelle est la différence entre Azure VPN Gateway et Azure ExpressRoute pour connecter un réseau local à Azure ?","o":["VPN Gateway établit une connexion chiffrée via Internet public, tandis qu\u0027ExpressRoute utilise une connexion privée dédiée ne transitant pas par Internet","ExpressRoute utilise exclusivement une connexion chiffrée via Internet public","VPN Gateway offre une bande passante garantie contractuellement plus élevée qu\u0027ExpressRoute","Les deux services désignent la même technologie sous un nom différent"],"e":"**VPN Gateway** chiffre le trafic transitant par Internet, alors qu\u0027**ExpressRoute** fournit une connexion privée dédiée, plus stable et prévisible, sans passer par le réseau Internet public."},"en":{"q":"What is the difference between Azure VPN Gateway and Azure ExpressRoute for connecting an on-premises network to Azure?","o":["VPN Gateway establishes an encrypted connection over the public internet, while ExpressRoute uses a dedicated private connection that does not go over the internet","ExpressRoute exclusively uses an encrypted connection over the public internet","VPN Gateway offers higher contractually guaranteed bandwidth than ExpressRoute","Both services refer to the same technology under a different name"],"e":"**VPN Gateway** encrypts traffic traveling over the internet, whereas **ExpressRoute** provides a dedicated private connection that is more stable and predictable, without going through the public internet."}},{"n":21,"a":["A"],"fr":{"q":"Quelle est la différence entre un point de terminaison public et un point de terminaison privé pour un service Azure ?","o":["Le point de terminaison public est accessible via une adresse IP exposée sur Internet, tandis que le point de terminaison privé n\u0027est accessible que depuis un réseau virtuel via une adresse IP privée","Le point de terminaison privé est toujours accessible depuis n\u0027importe quel réseau public sans restriction","Un point de terminaison public ne peut jamais être sécurisé par un pare-feu","Il n\u0027existe aucune différence entre ces deux types de points de terminaison"],"e":"Un **point de terminaison privé** attribue une adresse IP privée au sein d\u0027un réseau virtuel, réduisant l\u0027exposition du service, contrairement au **point de terminaison public** accessible depuis Internet."},"en":{"q":"What is the difference between a public endpoint and a private endpoint for an Azure service?","o":["The public endpoint is reachable through an IP address exposed on the internet, while the private endpoint is reachable only from a virtual network through a private IP address","The private endpoint is always reachable from any public network without restriction","A public endpoint can never be secured by a firewall","There is no difference between these two types of endpoints"],"e":"A **private endpoint** assigns a private IP address within a virtual network, reducing the service\u0027s exposure, unlike the **public endpoint**, which is reachable from the internet."}},{"n":22,"a":["A"],"fr":{"q":"Quelle est la différence entre la redondance LRS et la redondance ZRS pour le stockage Azure ?","o":["LRS réplique les données sur trois copies dans un seul datacenter, tandis que ZRS les réplique sur trois zones de disponibilité distinctes au sein de la même région","ZRS réplique systématiquement les données vers une région secondaire distante","LRS offre une meilleure résilience aux pannes de datacenter que ZRS","LRS et ZRS désignent la même stratégie de réplication avec un nom différent"],"e":"**LRS** conserve trois copies dans un seul datacenter, alors que **ZRS** répartit ces copies sur plusieurs zones de disponibilité de la même région, offrant une meilleure résilience."},"en":{"q":"What is the difference between LRS and ZRS redundancy for Azure Storage?","o":["LRS replicates data as three copies within a single datacenter, while ZRS replicates it across three separate availability zones within the same region","ZRS always replicates data to a remote secondary region","LRS offers better resilience to datacenter failures than ZRS","LRS and ZRS refer to the same replication strategy under a different name"],"e":"**LRS** keeps three copies in a single datacenter, whereas **ZRS** spreads these copies across multiple availability zones in the same region, providing better resilience."}},{"n":23,"a":["A","C"],"fr":{"q":"Parmi les options de redondance du stockage Azure suivantes, lesquelles répliquent les données vers une région secondaire géographiquement distante ?","o":["GRS (Geo-Redundant Storage)","LRS (Locally Redundant Storage)","GZRS (Geo-Zone-Redundant Storage)","ZRS (Zone-Redundant Storage)"],"e":"**GRS** et **GZRS** répliquent les données vers une région secondaire distante, tandis que **LRS** et **ZRS** restent limitées à la région primaire."},"en":{"q":"Which of the following Azure Storage redundancy options replicate data to a geographically distant secondary region?","o":["GRS (Geo-Redundant Storage)","LRS (Locally Redundant Storage)","GZRS (Geo-Zone-Redundant Storage)","ZRS (Zone-Redundant Storage)"],"e":"**GRS** and **GZRS** replicate data to a distant secondary region, while **LRS** and **ZRS** remain limited to the primary region."}},{"n":24,"a":["A"],"fr":{"q":"Quelle est la différence entre les niveaux d\u0027accès Chaud (Hot), Froid (Cool) et Archive pour le stockage Blob Azure ?","o":["Le niveau Chaud est optimisé pour un accès fréquent avec un coût de stockage plus élevé, le niveau Froid réduit le coût de stockage pour un accès moins fréquent, et le niveau Archive minimise le coût pour des données rarement consultées au prix d\u0027un délai de récupération","Le niveau Archive permet un accès instantané identique au niveau Chaud","Le niveau Froid est destiné aux données consultées plusieurs fois par jour","Les trois niveaux ont exactement le même coût de stockage et de récupération"],"e":"Ces trois niveaux d\u0027accès équilibrent coût de stockage et coût/délai d\u0027accès : **Chaud** pour un usage fréquent, **Froid** pour un usage occasionnel, et **Archive** pour des données rarement consultées nécessitant une réhydratation avant lecture."},"en":{"q":"What is the difference between the Hot, Cool, and Archive access tiers for Azure Blob Storage?","o":["The Hot tier is optimized for frequent access with a higher storage cost, the Cool tier lowers the storage cost for less frequent access, and the Archive tier minimizes the cost for rarely accessed data at the expense of a retrieval delay","The Archive tier provides instant access identical to the Hot tier","The Cool tier is intended for data accessed several times a day","All three tiers have exactly the same storage and retrieval costs"],"e":"These three access tiers balance storage cost against access cost/latency: **Hot** for frequent use, **Cool** for occasional use, and **Archive** for rarely accessed data that requires rehydration before it can be read."}},{"n":25,"a":["A"],"fr":{"q":"Un administrateur doit transférer plusieurs centaines de téraoctets de données vers Azure alors que la connexion Internet de l\u0027entreprise est limitée. Quel outil est le plus adapté plutôt qu\u0027AzCopy ?","o":["Azure Data Box","Azure Storage Explorer","Azure CLI","Azure Monitor"],"e":"**Azure Data Box** est un boîtier physique conçu pour transférer de très gros volumes de données sans dépendre de la bande passante réseau, contrairement à **AzCopy** qui transfère les données via le réseau."},"en":{"q":"An administrator needs to transfer several hundred terabytes of data to Azure, but the company\u0027s internet connection is limited. Which tool is the most suitable instead of AzCopy?","o":["Azure Data Box","Azure Storage Explorer","Azure CLI","Azure Monitor"],"e":"**Azure Data Box** is a physical device designed to transfer very large volumes of data without relying on network bandwidth, unlike **AzCopy**, which transfers data over the network."}},{"n":26,"a":["A"],"fr":{"q":"Quelle est la différence entre Microsoft Entra ID et Microsoft Entra Domain Services ?","o":["Microsoft Entra ID est un service d\u0027identité cloud moderne basé sur des protocoles comme OAuth, tandis que Microsoft Entra Domain Services fournit des fonctionnalités de domaine compatibles Active Directory traditionnel comme l\u0027adhésion au domaine et les stratégies de groupe","Microsoft Entra Domain Services ne prend en charge aucune authentification","Microsoft Entra ID nécessite obligatoirement un contrôleur de domaine Windows Server sur site","Les deux services sont strictement identiques et offrent les mêmes fonctionnalités"],"e":"**Microsoft Entra ID** gère les identités modernes basées sur le cloud, alors que **Microsoft Entra Domain Services** fournit des services de domaine managés compatibles avec les applications héritées nécessitant une jointure de domaine classique."},"en":{"q":"What is the difference between Microsoft Entra ID and Microsoft Entra Domain Services?","o":["Microsoft Entra ID is a modern cloud identity service based on protocols such as OAuth, while Microsoft Entra Domain Services provides traditional Active Directory-compatible domain features such as domain join and Group Policy","Microsoft Entra Domain Services does not support any authentication","Microsoft Entra ID requires an on-premises Windows Server domain controller","The two services are strictly identical and offer the same features"],"e":"**Microsoft Entra ID** manages modern cloud-based identities, whereas **Microsoft Entra Domain Services** provides managed domain services compatible with legacy applications that require a traditional domain join."}},{"n":27,"a":["A"],"fr":{"q":"Quelle est la différence entre l\u0027approche Confiance Zéro (Zero Trust) et le principe de défense en profondeur ?","o":["La Confiance Zéro part du principe qu\u0027aucune requête n\u0027est fiable par défaut et vérifie systématiquement chaque accès, tandis que la défense en profondeur superpose plusieurs couches de sécurité indépendantes pour ralentir un attaquant","La défense en profondeur consiste à faire confiance automatiquement à tout utilisateur situé à l\u0027intérieur du réseau de l\u0027entreprise","La Confiance Zéro supprime totalement la nécessité d\u0027authentifier les utilisateurs","Ces deux concepts sont rigoureusement identiques et interchangeables"],"e":"La **Confiance Zéro** impose une vérification explicite de chaque demande d\u0027accès, alors que la **défense en profondeur** consiste à empiler plusieurs mécanismes de sécurité complémentaires à différents niveaux."},"en":{"q":"What is the difference between the Zero Trust approach and the defense-in-depth principle?","o":["Zero Trust assumes that no request is trusted by default and systematically verifies every access, while defense in depth layers multiple independent security controls to slow down an attacker","Defense in depth means automatically trusting any user located inside the corporate network","Zero Trust completely removes the need to authenticate users","These two concepts are strictly identical and interchangeable"],"e":"**Zero Trust** requires explicit verification of every access request, whereas **defense in depth** consists of stacking several complementary security mechanisms at different levels."}},{"n":28,"a":["A"],"fr":{"q":"Quelle est la différence entre la calculatrice de prix Azure (Pricing Calculator) et la calculatrice TCO (Total Cost of Ownership) ?","o":["La calculatrice de prix estime le coût des services Azure sélectionnés, tandis que la calculatrice TCO compare le coût total d\u0027une infrastructure sur site avec son équivalent dans Azure","La calculatrice TCO ne sert qu\u0027à estimer le coût d\u0027une seule machine virtuelle","La calculatrice de prix compare systématiquement le cloud avec l\u0027infrastructure sur site","Les deux outils sont rigoureusement identiques et donnent toujours le même résultat"],"e":"La **calculatrice de prix** permet d\u0027estimer le coût prévisionnel des ressources Azure choisies, alors que la **calculatrice TCO** compare ce coût à celui d\u0027un environnement sur site équivalent."},"en":{"q":"What is the difference between the Azure Pricing calculator and the Total Cost of Ownership (TCO) calculator?","o":["The Pricing calculator estimates the cost of selected Azure services, while the TCO calculator compares the total cost of an on-premises infrastructure with its equivalent in Azure","The TCO calculator is used only to estimate the cost of a single virtual machine","The Pricing calculator always compares the cloud with on-premises infrastructure","The two tools are strictly identical and always give the same result"],"e":"The **Pricing calculator** lets you estimate the expected cost of the chosen Azure resources, whereas the **TCO calculator** compares that cost with the cost of an equivalent on-premises environment."}},{"n":29,"a":["A"],"fr":{"q":"Quelle est la différence entre Microsoft Cost Management et Azure Advisor concernant les coûts ?","o":["Cost Management analyse et suit les dépenses réelles déjà engagées, tandis qu\u0027Azure Advisor formule des recommandations proactives pour réduire les coûts futurs","Azure Advisor ne fournit que des recommandations de sécurité, jamais de recommandations de coûts","Cost Management recommande automatiquement de nouvelles architectures applicatives","Les deux services sont exactement identiques et redondants"],"e":"**Microsoft Cost Management** sert à visualiser et analyser les dépenses passées, tandis qu\u0027**Azure Advisor** propose des recommandations personnalisées, notamment pour optimiser les coûts, la sécurité et la fiabilité."},"en":{"q":"What is the difference between Microsoft Cost Management and Azure Advisor regarding costs?","o":["Cost Management analyzes and tracks actual spending already incurred, while Azure Advisor makes proactive recommendations to reduce future costs","Azure Advisor provides only security recommendations, never cost recommendations","Cost Management automatically recommends new application architectures","The two services are exactly identical and redundant"],"e":"**Microsoft Cost Management** is used to view and analyze past spending, while **Azure Advisor** offers personalized recommendations, notably to optimize cost, security, and reliability."}},{"n":30,"a":["A"],"fr":{"q":"Quelle est la différence entre l\u0027utilisation des tags et celle des groupes de ressources pour organiser les coûts Azure ?","o":["Les tags permettent de classer des ressources selon des métadonnées personnalisées transversales (comme un centre de coûts), tandis que les groupes de ressources structurent physiquement les ressources en un conteneur unique partageant le même cycle de vie","Un groupe de ressources ne peut jamais être utilisé pour le reporting de coûts","Les tags remplacent totalement la nécessité de créer des groupes de ressources","Les tags et les groupes de ressources désignent exactement le même mécanisme"],"e":"Les **tags** apportent une classification flexible et transversale des ressources, tandis que les **groupes de ressources** regroupent physiquement des ressources qui partagent un même cycle de vie et des permissions communes."},"en":{"q":"What is the difference between using tags and using resource groups to organize Azure costs?","o":["Tags let you classify resources using custom cross-cutting metadata (such as a cost center), while resource groups physically structure resources into a single container sharing the same lifecycle","A resource group can never be used for cost reporting","Tags completely eliminate the need to create resource groups","Tags and resource groups refer to exactly the same mechanism"],"e":"**Tags** provide flexible, cross-cutting classification of resources, while **resource groups** physically group resources that share the same lifecycle and common permissions."}},{"n":31,"a":["A","C"],"fr":{"q":"Quels types de verrous de ressources (resource locks) existent réellement dans Azure ?","o":["CanNotDelete","CanNotModify","ReadOnly","DenyWrite"],"e":"Azure propose exactement deux types de verrous : **CanNotDelete**, qui empêche la suppression, et **ReadOnly**, qui empêche toute modification ou suppression ; les options CanNotModify et DenyWrite n\u0027existent pas."},"en":{"q":"Which types of resource locks actually exist in Azure?","o":["CanNotDelete","CanNotModify","ReadOnly","DenyWrite"],"e":"Azure offers exactly two types of locks: **CanNotDelete**, which prevents deletion, and **ReadOnly**, which prevents any modification or deletion; the CanNotModify and DenyWrite options do not exist."}},{"n":32,"a":["A"],"fr":{"q":"Quelle est la différence entre un verrou de ressource (resource lock) et une stratégie Azure Policy ?","o":["Un verrou empêche directement la suppression ou la modification d\u0027une ressource existante, tandis qu\u0027une stratégie Azure Policy évalue et impose la conformité des ressources selon des règles définies, y compris lors de leur création","Azure Policy sert uniquement à empêcher la suppression accidentelle d\u0027une ressource déjà créée","Un verrou de ressource peut auditer automatiquement la conformité de centaines de ressources selon des règles métier","Les verrous et les stratégies Azure Policy sont deux noms désignant le même mécanisme"],"e":"Le **verrou** protège une ressource précise contre la suppression ou la modification, tandis qu\u0027**Azure Policy** applique des règles de gouvernance plus larges, y compris au moment de la création des ressources."},"en":{"q":"What is the difference between a resource lock and an Azure Policy?","o":["A lock directly prevents the deletion or modification of an existing resource, while an Azure Policy evaluates and enforces resource compliance according to defined rules, including when resources are created","Azure Policy is used only to prevent the accidental deletion of an already created resource","A resource lock can automatically audit the compliance of hundreds of resources against business rules","Locks and Azure Policy are two names for the same mechanism"],"e":"A **lock** protects a specific resource against deletion or modification, while **Azure Policy** applies broader governance rules, including at the time resources are created."}},{"n":33,"a":["A"],"fr":{"q":"Quelle est la différence entre Microsoft Purview et le Service Trust Portal ?","o":["Microsoft Purview aide à cataloguer, classifier et gouverner les données de l\u0027organisation, tandis que le Service Trust Portal met à disposition des rapports d\u0027audit et des documents de conformité publiés par Microsoft sur ses services","Le Service Trust Portal permet de classifier automatiquement les données sensibles d\u0027une entreprise","Microsoft Purview ne concerne que la facturation des services Azure","Ces deux outils remplissent exactement la même fonction"],"e":"**Microsoft Purview** est orienté gouvernance et catalogage des données du client, alors que le **Service Trust Portal** fournit des documents de conformité et d\u0027audit concernant les services cloud de Microsoft."},"en":{"q":"What is the difference between Microsoft Purview and the Service Trust Portal?","o":["Microsoft Purview helps catalog, classify, and govern the organization\u0027s data, while the Service Trust Portal provides audit reports and compliance documents published by Microsoft about its services","The Service Trust Portal automatically classifies a company\u0027s sensitive data","Microsoft Purview deals only with billing for Azure services","These two tools serve exactly the same purpose"],"e":"**Microsoft Purview** focuses on governing and cataloging the customer\u0027s data, whereas the **Service Trust Portal** provides compliance and audit documents about Microsoft\u0027s cloud services."}},{"n":34,"a":["A"],"fr":{"q":"Quelle est la différence entre le portail Azure et Azure Cloud Shell ?","o":["Le portail Azure propose une interface graphique web pour gérer les ressources, tandis qu\u0027Azure Cloud Shell fournit un environnement en ligne de commande accessible directement depuis le navigateur","Azure Cloud Shell ne permet d\u0027exécuter aucune commande CLI ou PowerShell","Le portail Azure ne permet pas de créer de nouvelles ressources","Les deux outils sont rigoureusement identiques dans leur mode d\u0027interaction"],"e":"Le **portail Azure** offre une expérience visuelle de gestion, alors qu\u0027**Azure Cloud Shell** met à disposition un terminal (Bash ou PowerShell) accessible sans installation locale."},"en":{"q":"What is the difference between the Azure portal and Azure Cloud Shell?","o":["The Azure portal offers a web-based graphical interface for managing resources, while Azure Cloud Shell provides a command-line environment accessible directly from the browser","Azure Cloud Shell cannot run any CLI or PowerShell commands","The Azure portal does not allow you to create new resources","The two tools are strictly identical in how you interact with them"],"e":"The **Azure portal** offers a visual management experience, whereas **Azure Cloud Shell** provides a terminal (Bash or PowerShell) accessible without any local installation."}},{"n":35,"a":["A"],"fr":{"q":"Quelle est la principale différence entre Azure CLI et Azure PowerShell ?","o":["Azure CLI utilise une syntaxe de commandes inspirée de Bash, tandis qu\u0027Azure PowerShell repose sur des cmdlets PowerShell, mais les deux permettent de gérer les mêmes ressources Azure","Azure PowerShell ne fonctionne que sur Linux, jamais sur Windows","Azure CLI ne peut être utilisé que depuis le portail Azure","Ces deux outils ne peuvent gérer aucune ressource en commun"],"e":"**Azure CLI** et **Azure PowerShell** sont deux outils en ligne de commande multiplateformes offrant des syntaxes différentes mais des capacités de gestion équivalentes des ressources Azure."},"en":{"q":"What is the main difference between Azure CLI and Azure PowerShell?","o":["Azure CLI uses a Bash-inspired command syntax, while Azure PowerShell relies on PowerShell cmdlets, but both can manage the same Azure resources","Azure PowerShell works only on Linux, never on Windows","Azure CLI can be used only from the Azure portal","These two tools cannot manage any resources in common"],"e":"**Azure CLI** and **Azure PowerShell** are two cross-platform command-line tools that offer different syntaxes but equivalent management capabilities for Azure resources."}},{"n":36,"a":["A"],"fr":{"q":"Quelle est la différence entre un modèle ARM (Azure Resource Manager) et un fichier Bicep ?","o":["Un modèle ARM est écrit en JSON et peut être verbeux, tandis que Bicep est un langage déclaratif plus simple qui se transpile automatiquement en modèle ARM","Bicep ne peut déployer que des machines virtuelles","Les modèles ARM sont écrits dans un langage impératif comme un script shell","Bicep et ARM désignent exactement le même format de fichier"],"e":"**Bicep** propose une syntaxe plus concise et lisible que le JSON des **modèles ARM**, tout en étant converti automatiquement en modèle ARM lors du déploiement."},"en":{"q":"What is the difference between an ARM (Azure Resource Manager) template and a Bicep file?","o":["An ARM template is written in JSON and can be verbose, while Bicep is a simpler declarative language that is automatically transpiled into an ARM template","Bicep can deploy only virtual machines","ARM templates are written in an imperative language, like a shell script","Bicep and ARM refer to exactly the same file format"],"e":"**Bicep** offers a more concise and readable syntax than the JSON of **ARM templates**, while being automatically converted into an ARM template at deployment time."}},{"n":37,"a":["A"],"fr":{"q":"Quelle est la différence entre Azure Arc et Azure Resource Manager ?","o":["Azure Arc étend la gestion Azure à des ressources situées en dehors d\u0027Azure, comme des serveurs sur site ou dans d\u0027autres clouds, tandis qu\u0027Azure Resource Manager est le plan de gestion natif des ressources déployées directement dans Azure","Azure Resource Manager ne peut gérer que des ressources situées hors d\u0027Azure","Azure Arc remplace entièrement Azure Resource Manager pour toutes les ressources Azure natives","Les deux services désignent exactement la même fonctionnalité"],"e":"**Azure Arc** permet d\u0027intégrer des ressources externes (serveurs, clusters Kubernetes, autres clouds) sous la gouvernance Azure, en s\u0027appuyant sur **Azure Resource Manager** qui reste le moteur de gestion natif d\u0027Azure."},"en":{"q":"What is the difference between Azure Arc and Azure Resource Manager?","o":["Azure Arc extends Azure management to resources located outside Azure, such as on-premises servers or servers in other clouds, while Azure Resource Manager is the native management layer for resources deployed directly in Azure","Azure Resource Manager can manage only resources located outside Azure","Azure Arc completely replaces Azure Resource Manager for all native Azure resources","The two services refer to exactly the same feature"],"e":"**Azure Arc** lets you bring external resources (servers, Kubernetes clusters, other clouds) under Azure governance, relying on **Azure Resource Manager**, which remains Azure\u0027s native management engine."}},{"n":38,"a":["A"],"fr":{"q":"Quelle est la différence entre Azure Advisor et Azure Service Health ?","o":["Azure Advisor fournit des recommandations personnalisées pour optimiser les ressources existantes, tandis qu\u0027Azure Service Health informe sur les incidents et pannes de service Azure affectant l\u0027abonnement du client","Azure Service Health propose des recommandations d\u0027optimisation des coûts pour chaque ressource","Azure Advisor affiche uniquement l\u0027état de santé global des datacenters Microsoft","Les deux services sont parfaitement identiques dans leur fonction"],"e":"**Azure Advisor** analyse la configuration des ressources du client pour proposer des améliorations, tandis qu\u0027**Azure Service Health** communique sur les incidents de service pouvant impacter l\u0027abonnement."},"en":{"q":"What is the difference between Azure Advisor and Azure Service Health?","o":["Azure Advisor provides personalized recommendations to optimize existing resources, while Azure Service Health reports on Azure service incidents and outages affecting the customer\u0027s subscription","Azure Service Health offers cost optimization recommendations for each resource","Azure Advisor displays only the overall health status of Microsoft datacenters","The two services are perfectly identical in their function"],"e":"**Azure Advisor** analyzes the configuration of the customer\u0027s resources to suggest improvements, while **Azure Service Health** communicates about service incidents that may impact the subscription."}},{"n":39,"a":["A"],"fr":{"q":"Quelle est la différence entre Azure Monitor et Application Insights ?","o":["Azure Monitor est la plateforme globale de collecte et d\u0027analyse de métriques et de journaux pour l\u0027ensemble des ressources, tandis qu\u0027Application Insights en est une fonctionnalité spécialisée dans la supervision des performances des applications","Application Insights supervise uniquement l\u0027état physique des datacenters Microsoft","Azure Monitor ne peut collecter aucune donnée relative aux applications","Les deux services désignent exactement le même périmètre de supervision"],"e":"**Application Insights** est un composant d\u0027**Azure Monitor** dédié à la surveillance applicative (APM), alors qu\u0027Azure Monitor couvre plus largement la supervision de l\u0027infrastructure et des services."},"en":{"q":"What is the difference between Azure Monitor and Application Insights?","o":["Azure Monitor is the overall platform for collecting and analyzing metrics and logs for all resources, while Application Insights is a feature of it specialized in application performance monitoring","Application Insights monitors only the physical state of Microsoft datacenters","Azure Monitor cannot collect any application-related data","The two services cover exactly the same monitoring scope"],"e":"**Application Insights** is a component of **Azure Monitor** dedicated to application monitoring (APM), whereas Azure Monitor more broadly covers infrastructure and service monitoring."}},{"n":40,"a":["A"],"fr":{"q":"Quelle est la différence entre la page Azure Status et Azure Service Health ?","o":["Azure Status affiche l\u0027état général et public de tous les services Azure dans le monde, tandis qu\u0027Azure Service Health propose une vue personnalisée des incidents impactant spécifiquement les ressources de l\u0027abonnement du client","Azure Service Health est une page publique accessible sans authentification à toute personne sur Internet","Azure Status permet de configurer des alertes personnalisées propres à un abonnement","Les deux ressources affichent exactement les mêmes informations personnalisées pour chaque client"],"e":"**Azure Status** est une page publique donnant une vue d\u0027ensemble globale, tandis qu\u0027**Azure Service Health**, accessible depuis le portail, personnalise les informations selon les ressources réellement utilisées par l\u0027abonnement."},"en":{"q":"What is the difference between the Azure Status page and Azure Service Health?","o":["Azure Status displays the general, public status of all Azure services worldwide, while Azure Service Health provides a personalized view of incidents specifically affecting the resources in the customer\u0027s subscription","Azure Service Health is a public page accessible to anyone on the internet without authentication","Azure Status lets you configure custom alerts specific to a subscription","Both resources display exactly the same personalized information for each customer"],"e":"**Azure Status** is a public page that gives a global overview, while **Azure Service Health**, accessible from the portal, tailors the information to the resources actually used by the subscription."}}]},{"id":4,"title":{"fr":"Examen blanc 4 — Chiffres et limites","en":"Practice exam 4 — Figures and limits"},"questions":[{"n":1,"a":["C"],"fr":{"q":"Pour un service Azure garantissant un SLA de 99,9 %, quelle est environ la durée d\u0027indisponibilité tolérée par mois ?","o":["4,4 minutes","21,9 minutes","43,8 minutes","4 heures et 23 minutes"],"e":"Un **SLA de 99,9 %** autorise environ 0,1 % d\u0027indisponibilité par mois, soit approximativement 43,8 minutes sur un mois moyen de 30,44 jours."},"en":{"q":"For an Azure service with a 99.9% SLA, approximately how much downtime is allowed per month?","o":["4.4 minutes","21.9 minutes","43.8 minutes","4 hours and 23 minutes"],"e":"A **99.9% SLA** allows about 0.1% downtime per month, which is approximately 43.8 minutes over an average month of 30.44 days."}},{"n":2,"a":["B"],"fr":{"q":"Pour un service Azure garantissant un SLA de 99,95 %, quelle est environ la durée d\u0027indisponibilité tolérée par mois ?","o":["43,8 minutes","21,9 minutes","4,4 minutes","2,2 minutes"],"e":"Un **SLA de 99,95 %** correspond à environ 0,05 % d\u0027indisponibilité mensuelle, soit près de 21,9 minutes par mois."},"en":{"q":"For an Azure service with a 99.95% SLA, approximately how much downtime is allowed per month?","o":["43.8 minutes","21.9 minutes","4.4 minutes","2.2 minutes"],"e":"A **99.95% SLA** corresponds to about 0.05% monthly downtime, which is roughly 21.9 minutes per month."}},{"n":3,"a":["C"],"fr":{"q":"Pour un service Azure garantissant un SLA de 99,99 %, quelle est environ la durée d\u0027indisponibilité tolérée par mois ?","o":["43,8 minutes","21,9 minutes","4,4 minutes","26 secondes"],"e":"Un **SLA de 99,99 %** ne tolère qu\u0027environ 0,01 % d\u0027indisponibilité par mois, soit environ 4,4 minutes."},"en":{"q":"For an Azure service with a 99.99% SLA, approximately how much downtime is allowed per month?","o":["43.8 minutes","21.9 minutes","4.4 minutes","26 seconds"],"e":"A **99.99% SLA** allows only about 0.01% downtime per month, which is approximately 4.4 minutes."}},{"n":4,"a":["A"],"fr":{"q":"Deux services Azure dépendants l\u0027un de l\u0027autre (chaînés) affichent chacun un SLA individuel de 99,9 %. Quelle est approximativement la disponibilité composite de l\u0027ensemble ?","o":["99,8 %","99,9 %","99,95 %","100 %"],"e":"Pour des composants dépendants en série, les disponibilités se multiplient : 0,999 x 0,999 est environ égal à 0,998, soit une **disponibilité composite d\u0027environ 99,8 %**, inférieure à celle de chaque composant pris isolément."},"en":{"q":"Two interdependent (chained) Azure services each have an individual SLA of 99.9%. What is the approximate composite availability of the whole solution?","o":["99.8%","99.9%","99.95%","100%"],"e":"For dependent components in series, availabilities are multiplied: 0.999 x 0.999 is approximately 0.998, giving a **composite availability of about 99.8%**, which is lower than that of each individual component."}},{"n":5,"a":["B"],"fr":{"q":"Quel crédit financier est accordé lors de la création d\u0027un compte Azure gratuit, et pendant combien de temps peut-il être utilisé ?","o":["100 USD pendant 30 jours","200 USD pendant 30 jours","200 USD pendant 12 mois","300 USD pendant 90 jours"],"e":"Le compte Azure gratuit inclut un **crédit de 200 USD utilisable pendant les 30 premiers jours**, en plus de services gratuits pendant 12 mois et de services toujours gratuits."},"en":{"q":"What credit is granted when you create an Azure free account, and for how long can it be used?","o":["USD 100 for 30 days","USD 200 for 30 days","USD 200 for 12 months","USD 300 for 90 days"],"e":"The Azure free account includes a **USD 200 credit to use within the first 30 days**, in addition to 12 months of free services and always-free services."}},{"n":6,"a":["C"],"fr":{"q":"En plus des services toujours gratuits, pendant combien de mois un compte Azure gratuit donne-t-il accès sans frais à une sélection de services populaires ?","o":["3 mois","6 mois","12 mois","24 mois"],"e":"Le compte Azure gratuit offre un accès sans frais à certains services populaires pendant **12 mois**, en complément du crédit initial et des services toujours gratuits."},"en":{"q":"In addition to the always-free services, for how many months does an Azure free account provide free access to a selection of popular services?","o":["3 months","6 months","12 months","24 months"],"e":"The Azure free account provides free access to certain popular services for **12 months**, in addition to the initial credit and the always-free services."}},{"n":7,"a":["C"],"fr":{"q":"Quel pourcentage d\u0027économie maximal Microsoft annonce-t-il pour les instances réservées de machines virtuelles (Reserved VM Instances) sur un engagement de 3 ans, comparé au tarif de paiement à l\u0027usage ?","o":["20 %","40 %","72 %","90 %"],"e":"Microsoft annonce des économies pouvant atteindre **jusqu\u0027à 72 %** par rapport au tarif pay-as-you-go pour un engagement de 3 ans sur les instances réservées."},"en":{"q":"What maximum savings percentage does Microsoft advertise for Reserved VM Instances with a 3-year commitment, compared to pay-as-you-go pricing?","o":["20%","40%","72%","90%"],"e":"Microsoft advertises savings of **up to 72%** compared to pay-as-you-go pricing for a 3-year commitment on reserved instances."}},{"n":8,"a":["B"],"fr":{"q":"Quel terme désigne le modèle de dépense dans lequel une organisation paie les services cloud au fur et à mesure de leur consommation, sans investissement matériel initial ?","o":["CapEx (dépense d\u0027investissement)","OpEx (dépense opérationnelle)","Amortissement linéaire","Provisionnement anticipé"],"e":"Le cloud computing bascule les dépenses d\u0027investissement (**CapEx**) vers des dépenses opérationnelles (**OpEx**), payées selon la consommation réelle."},"en":{"q":"Which term describes the spending model in which an organization pays for cloud services as they are consumed, with no upfront hardware investment?","o":["CapEx (capital expenditure)","OpEx (operational expenditure)","Straight-line depreciation","Upfront provisioning"],"e":"Cloud computing shifts capital expenditure (**CapEx**) to operational expenditure (**OpEx**), paid based on actual consumption."}},{"n":9,"a":["B"],"fr":{"q":"Quel est le nombre minimal d\u0027instances identiques d\u0027une même charge de travail qu\u0027il faut déployer pour éliminer un point unique de défaillance (single point of failure) ?","o":["1","2","3","5"],"e":"Avec une seule instance, toute panne arrête le service. Déployer au moins **2 instances** redondantes permet d\u0027éliminer le point unique de défaillance."},"en":{"q":"What is the minimum number of identical instances of the same workload that must be deployed to eliminate a single point of failure?","o":["1","2","3","5"],"e":"With a single instance, any failure stops the service. Deploying at least **2 redundant instances** eliminates the single point of failure."}},{"n":10,"a":["B"],"fr":{"q":"Quelle caractéristique du cloud permet d\u0027ajouter ET de retirer automatiquement des ressources en fonction de la charge réelle, sans intervention manuelle ?","o":["La scalabilité verticale","L\u0027élasticité","La haute disponibilité","La tolérance de panne"],"e":"L\u0027**élasticité** désigne la capacité d\u0027un système à ajuster automatiquement ses ressources, à la hausse comme à la baisse, selon la demande réelle."},"en":{"q":"Which cloud characteristic makes it possible to automatically add AND remove resources based on actual load, without manual intervention?","o":["Vertical scalability","Elasticity","High availability","Fault tolerance"],"e":"**Elasticity** is the ability of a system to automatically adjust its resources, both up and down, based on actual demand."}},{"n":11,"a":["A","C"],"fr":{"q":"Microsoft présente six avantages fondamentaux du cloud computing. Parmi les propositions suivantes, lesquelles en font réellement partie ?","o":["La haute disponibilité","La confidentialité absolue garantie","L\u0027agilité","La gratuité totale des services"],"e":"Parmi les six avantages cités par Microsoft figurent la **haute disponibilité** et l\u0027**agilité**, aux côtés de la scalabilité, l\u0027élasticité, la tolérance de panne et la reprise après sinistre."},"en":{"q":"Microsoft describes six core benefits of cloud computing. Which of the following are actually among them?","o":["High availability","Guaranteed absolute confidentiality","Agility","Completely free services"],"e":"The six benefits cited by Microsoft include **high availability** and **agility**, alongside scalability, elasticity, fault tolerance, and disaster recovery."}},{"n":12,"a":["C"],"fr":{"q":"Dans une région Azure qui prend en charge les zones de disponibilité, quel est le nombre minimal de zones physiquement séparées garanti ?","o":["2","3","4","5"],"e":"Une région Azure compatible avec les zones de disponibilité comporte au minimum **3 zones** physiquement distinctes, chacune avec ses propres alimentation, refroidissement et réseau."},"en":{"q":"In an Azure region that supports availability zone
