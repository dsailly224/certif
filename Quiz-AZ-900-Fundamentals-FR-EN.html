 exceptions au sein du code applicatif","Le chiffrement automatique de toutes les bases de données SQL","La création automatique de groupes d\u0027administration"],"e":"Azure Monitor collecte métriques et journaux au niveau de l\u0027infrastructure, tandis qu\u0027Application Insights, son extension APM, suit en détail le comportement du code applicatif."},"en":{"q":"Which of the following capabilities are provided by the combination of **Azure Monitor** and **Application Insights** for a web application?","o":["Collection of performance metrics and logs from Azure resources","Detailed tracking of requests, response times, and exceptions within the application code","Automatic encryption of all SQL databases","Automatic creation of management groups"],"e":"Azure Monitor collects metrics and logs at the infrastructure level, while Application Insights, its APM extension, tracks the behavior of the application code in detail."}}]},{"id":10,"title":{"fr":"Examen blanc 10 — Synthèse mixte (niveau examen)","en":"Practice exam 10 — Mixed review (exam level)"},"questions":[{"n":1,"a":["A"],"fr":{"q":"Quelle affirmation décrit le mieux le cloud computing ?","o":["La livraison à la demande de ressources informatiques (calcul, stockage, réseau) via internet, facturée à l\u0027usage","Un réseau privé isolé réservé exclusivement aux grandes entreprises","Un service de sauvegarde physique de données dans un seul centre de données local","Un contrat obligeant à acheter du matériel serveur à l\u0027avance pour 5 ans"],"e":"Le **cloud computing** désigne la livraison à la demande de ressources informatiques via internet avec une facturation basée sur la consommation réelle."},"en":{"q":"Which statement best describes cloud computing?","o":["The on-demand delivery of computing resources (compute, storage, networking) over the internet, billed based on usage","An isolated private network reserved exclusively for large enterprises","A physical data backup service in a single on-premises datacenter","A contract requiring you to buy server hardware upfront for 5 years"],"e":"**Cloud computing** is the on-demand delivery of computing resources over the internet, with billing based on actual consumption."}},{"n":2,"a":["B"],"fr":{"q":"Dans le modèle de responsabilité partagée, pour une machine virtuelle (IaaS), qui est responsable de l\u0027application des correctifs de sécurité du système d\u0027exploitation invité ?","o":["Microsoft, car Azure gère entièrement le système d\u0027exploitation invité","Le client, qui reste propriétaire de la gestion de l\u0027OS et des applications","Un tiers certifié obligatoirement désigné par Microsoft","Personne, les correctifs sont automatiques et gratuits pour tous les services cloud"],"e":"En **IaaS**, le client gère l\u0027OS, les correctifs et les applications, tandis que Microsoft gère l\u0027infrastructure physique sous-jacente."},"en":{"q":"In the shared responsibility model, for a virtual machine (IaaS), who is responsible for applying security patches to the guest operating system?","o":["Microsoft, because Azure fully manages the guest operating system","The customer, who remains responsible for managing the OS and applications","A certified third party that must be designated by Microsoft","No one, patches are automatic and free for all cloud services"],"e":"In **IaaS**, the customer manages the OS, patches and applications, while Microsoft manages the underlying physical infrastructure."}},{"n":3,"a":["C"],"fr":{"q":"Une entreprise connecte son centre de données local à Azure pour garder certaines charges de travail sensibles sur site, tout en utilisant Azure pour d\u0027autres charges nécessitant de la scalabilité. Quel modèle de déploiement illustre ce scénario ?","o":["Cloud public","Cloud privé","Cloud hybride","Multicloud"],"e":"Le **cloud hybride** combine une infrastructure locale (privée) et le cloud public, reliés par une connectivité réseau."},"en":{"q":"A company connects its on-premises datacenter to Azure to keep some sensitive workloads on-premises, while using Azure for other workloads that require scalability. Which deployment model does this scenario illustrate?","o":["Public cloud","Private cloud","Hybrid cloud","Multicloud"],"e":"**Hybrid cloud** combines on-premises (private) infrastructure and the public cloud, linked by network connectivity."}},{"n":4,"a":["B"],"fr":{"q":"Qu\u0027est-ce qui caractérise une stratégie multicloud ?","o":["L\u0027utilisation exclusive d\u0027un seul fournisseur cloud pour simplifier la facturation","Le recours à plusieurs fournisseurs de cloud public, par exemple pour répartir les risques ou répondre à des exigences spécifiques","La fusion technique d\u0027Azure et d\u0027un centre de données local en une seule infrastructure","Un cloud accessible uniquement aux organismes gouvernementaux"],"e":"Le **multicloud** consiste à utiliser les services de plusieurs fournisseurs cloud publics différents au sein d\u0027une même organisation."},"en":{"q":"What characterizes a multicloud strategy?","o":["Exclusively using a single cloud provider to simplify billing","Using multiple public cloud providers, for example to spread risk or meet specific requirements","The technical merging of Azure and an on-premises datacenter into a single infrastructure","A cloud accessible only to government organizations"],"e":"**Multicloud** means using services from several different public cloud providers within the same organization."}},{"n":5,"a":["A"],"fr":{"q":"Une entreprise remplace l\u0027achat de serveurs physiques par un abonnement Azure facturé selon l\u0027usage réel. Quel changement financier cela illustre-t-il ?","o":["Le passage d\u0027un modèle CapEx à un modèle OpEx","Le passage d\u0027un modèle OpEx à un modèle CapEx","Une augmentation des dépenses d\u0027investissement en capital","Une suppression totale de tous les coûts informatiques"],"e":"Le cloud transforme les dépenses d\u0027investissement (**CapEx**) en dépenses opérationnelles (**OpEx**), payées au fil de l\u0027usage."},"en":{"q":"A company replaces the purchase of physical servers with an Azure subscription billed based on actual usage. Which financial shift does this illustrate?","o":["A shift from a CapEx model to an OpEx model","A shift from an OpEx model to a CapEx model","An increase in capital investment expenditure","A complete elimination of all IT costs"],"e":"The cloud turns capital expenditure (**CapEx**) into operational expenditure (**OpEx**), paid as you go."}},{"n":6,"a":["B"],"fr":{"q":"Quel est l\u0027un des principaux avantages économiques du modèle de tarification à la consommation d\u0027Azure ?","o":["Il impose un engagement minimal de dépense sur 3 ans","Il permet de payer uniquement les ressources réellement consommées, sans investissement initial important","Il facture un montant fixe identique chaque mois quel que soit l\u0027usage","Il nécessite l\u0027achat anticipé de licences matérielles"],"e":"Le modèle **à la consommation** permet de ne payer que ce qui est réellement utilisé, sans investissement initial lourd."},"en":{"q":"What is one of the main economic benefits of Azure\u0027s consumption-based pricing model?","o":["It requires a minimum spending commitment over 3 years","It lets you pay only for the resources you actually consume, without a large upfront investment","It charges the same fixed amount every month regardless of usage","It requires purchasing hardware licenses in advance"],"e":"The **consumption-based** model means you pay only for what you actually use, without a heavy upfront investment."}},{"n":7,"a":["A"],"fr":{"q":"Une entreprise a une charge de travail stable et prévisible, fonctionnant en continu toute l\u0027année. Quelle option tarifaire Azure lui permettrait généralement de réduire ses coûts par rapport au tarif standard à l\u0027usage ?","o":["Les instances réservées (Reservations)","Le tarif à la demande (pay-as-you-go) sans engagement","Le niveau de stockage Archive appliqué à des machines virtuelles","La facturation au prorata des licences Microsoft 365"],"e":"Les **instances réservées** offrent une remise importante en échange d\u0027un engagement de 1 ou 3 ans, adaptées aux charges prévisibles et continues."},"en":{"q":"A company has a stable, predictable workload that runs continuously all year round. Which Azure pricing option would generally allow it to reduce costs compared to the standard pay-as-you-go rate?","o":["Reserved instances (Reservations)","On-demand (pay-as-you-go) pricing with no commitment","The Archive storage tier applied to virtual machines","Prorated billing of Microsoft 365 licenses"],"e":"**Reserved instances** offer a significant discount in exchange for a 1- or 3-year commitment, suited to predictable, continuous workloads."}},{"n":8,"a":["B"],"fr":{"q":"Qu\u0027est-ce qui définit une architecture informatique serverless (sans serveur) ?","o":["L\u0027absence totale de serveurs physiques dans le monde","Le fournisseur de cloud gère l\u0027infrastructure sous-jacente, et le code s\u0027exécute à la demande sans que le client gère de serveur","L\u0027obligation pour le client de provisionner manuellement chaque serveur avant chaque exécution","Un modèle réservé exclusivement aux bases de données relationnelles"],"e":"Le **serverless** masque la gestion des serveurs : le fournisseur provisionne et met à l\u0027échelle automatiquement l\u0027infrastructure nécessaire à l\u0027exécution du code."},"en":{"q":"What defines a serverless computing architecture?","o":["The complete absence of physical servers anywhere in the world","The cloud provider manages the underlying infrastructure, and code runs on demand without the customer managing any server","The requirement for the customer to manually provision each server before every execution","A model reserved exclusively for relational databases"],"e":"**Serverless** abstracts server management: the provider automatically provisions and scales the infrastructure needed to run the code."}},{"n":9,"a":["A"],"fr":{"q":"Un service Azure garantit une disponibilité (SLA) de 99,9 % sur un mois. Quelle est approximativement la durée maximale d\u0027indisponibilité tolérable sur ce mois tout en respectant ce SLA ?","o":["Environ 43 minutes","Environ 4,3 heures","Environ 7 heures","Environ 3 jours"],"e":"Un **SLA** de 99,9 % autorise environ 43 minutes d\u0027indisponibilité sur un mois de 30 jours (0,1 % de 43 200 minutes)."},"en":{"q":"An Azure service guarantees 99.9% availability (SLA) over a month. Approximately what is the maximum downtime that can be tolerated over that month while still meeting this SLA?","o":["About 43 minutes","About 4.3 hours","About 7 hours","About 3 days"],"e":"A 99.9% **SLA** allows about 43 minutes of downtime over a 30-day month (0.1% of 43,200 minutes)."}},{"n":10,"a":["A","C"],"fr":{"q":"Parmi les affirmations suivantes concernant l\u0027élasticité dans Azure, lesquelles sont vraies ?","o":["Elle permet d\u0027ajouter automatiquement des ressources lors des pics de charge puis de les retirer ensuite","Elle est strictement identique à la scalabilité verticale, qui consiste à augmenter la taille d\u0027une seule machine","Elle vise à ajuster dynamiquement la capacité pour correspondre à la demande réelle, réduisant ainsi le gaspillage de ressources","Elle nécessite systématiquement une intervention manuelle d\u0027un administrateur pour chaque ajustement"],"e":"L\u0027**élasticité** ajoute ou retire automatiquement des ressources selon la demande réelle, contrairement à la scalabilité verticale qui est un concept distinct et souvent manuel."},"en":{"q":"Which of the following statements about elasticity in Azure are true?","o":["It allows resources to be added automatically during peak load and then removed afterward","It is strictly identical to vertical scalability, which consists of increasing the size of a single machine","It aims to dynamically adjust capacity to match actual demand, thereby reducing wasted resources","It always requires manual intervention by an administrator for each adjustment"],"e":"**Elasticity** automatically adds or removes resources based on actual demand, unlike vertical scalability, which is a distinct and often manual concept."}},{"n":11,"a":["B"],"fr":{"q":"Quel terme décrit la capacité d\u0027un système cloud à continuer de fonctionner correctement et à se rétablir rapidement en cas de défaillance matérielle ou logicielle ?","o":["La gérabilité (manageability)","La fiabilité (reliability) et la résilience","La gouvernance","La confidentialité"],"e":"La **fiabilité** (ou résilience) désigne la capacité d\u0027un système à continuer de fonctionner et à se rétablir rapidement après une défaillance."},"en":{"q":"Which term describes the ability of a cloud system to continue functioning correctly and to recover quickly in the event of a hardware or software failure?","o":["Manageability","Reliability and resiliency","Governance","Confidentiality"],"e":"**Reliability** (or resiliency) refers to a system\u0027s ability to keep functioning and recover quickly after a failure."}},{"n":12,"a":["A"],"fr":{"q":"Qu\u0027est-ce qu\u0027une paire de régions Azure (region pair) ?","o":["Deux régions Azure situées dans la même géographie et associées pour la réplication des données et la reprise après sinistre, avec des mises à jour planifiées de manière échelonnée","Deux data centers physiquement voisins dans le même bâtiment","Deux zones de disponibilité d\u0027une même région reliées par fibre optique","Un cloud souverain isolé, comme Azure opéré en Chine par 21Vianet, réservé à un seul pays"],"e":"Une **paire de régions** associe deux régions d\u0027une même géographie pour la réplication et la continuité d\u0027activité, avec des mises à jour Microsoft décalées entre elles."},"en":{"q":"What is an Azure region pair?","o":["Two Azure regions located in the same geography and paired for data replication and disaster recovery, with planned updates rolled out in a staggered manner","Two physically adjacent datacenters in the same building","Two availability zones in the same region connected by fiber optics","An isolated sovereign cloud, such as Azure operated in China by 21Vianet, reserved for a single country"],"e":"A **region pair** associates two regions within the same geography for replication and business continuity, with Microsoft updates staggered between them."}},{"n":13,"a":["A","B"],"fr":{"q":"Parmi les affirmations suivantes sur les zones de disponibilité Azure, lesquelles sont vraies ?","o":["Chaque zone de disponibilité dispose de sa propre alimentation électrique, de son propre refroidissement et de son propre réseau","Les zones de disponibilité d\u0027une même région sont interconnectées par un réseau à faible latence et haut débit","Toutes les régions Azure proposent obligatoirement des zones de disponibilité","Une seule zone de disponibilité suffit à elle seule pour obtenir le SLA le plus élevé proposé par Azure"],"e":"Les **zones de disponibilité** sont des groupes de data centers indépendants (alimentation, refroidissement, réseau) reliés par un réseau rapide ; toutes les régions n\u0027en disposent pas, et le SLA le plus élevé exige une répartition sur plusieurs zones."},"en":{"q":"Which of the following statements about Azure availability zones are true?","o":["Each availability zone has its own power, cooling and networking","Availability zones within the same region are interconnected by a high-speed, low-latency network","All Azure regions necessarily offer availability zones","A single availability zone on its own is enough to obtain the highest SLA offered by Azure"],"e":"**Availability zones** are groups of independent datacenters (power, cooling, networking) connected by a fast network; not all regions have them, and the highest SLA requires distribution across multiple zones."}},{"n":14,"a":["A"],"fr":{"q":"Une organisation veut accorder à un groupe d\u0027employés uniquement le droit de gérer les ressources d\u0027un groupe de ressources spécifique, sans impact sur le reste de l\u0027abonnement. Quelle est l\u0027approche appropriée avec Azure RBAC ?","o":["Attribuer un rôle Azure RBAC directement au niveau du groupe de ressources concerné","Attribuer le rôle au niveau du groupe d\u0027administration racine pour simplifier la gestion","Créer un nouvel abonnement distinct pour chaque employé","Modifier les verrous de ressources (resource locks) du groupe de ressources"],"e":"Les rôles **Azure RBAC** peuvent être attribués au niveau du groupe de ressources, limitant l\u0027accès à ce périmètre précis selon le principe du moindre privilège."},"en":{"q":"An organization wants to grant a group of employees only the right to manage the resources in a specific resource group, without affecting the rest of the subscription. What is the appropriate approach with Azure RBAC?","o":["Assign an Azure RBAC role directly at the scope of the relevant resource group","Assign the role at the root management group level to simplify management","Create a separate new subscription for each employee","Modify the resource locks of the resource group"],"e":"**Azure RBAC** roles can be assigned at the resource group level, limiting access to that specific scope according to the principle of least privilege."}},{"n":15,"a":["B"],"fr":{"q":"Une entreprise exploite une application web dont le trafic varie fortement et doit ajouter ou retirer automatiquement des instances de machines virtuelles identiques selon la charge. Quel service Azure est spécifiquement conçu pour cela ?","o":["Azure Virtual Desktop","Azure Virtual Machine Scale Sets","Azure Container Instances","Azure Bastion"],"e":"Les **Virtual Machine Scale Sets** permettent de créer et de mettre à l\u0027échelle automatiquement des groupes de machines virtuelles identiques et équilibrées en charge."},"en":{"q":"A company runs a web application whose traffic varies significantly and must automatically add or remove identical virtual machine instances based on load. Which Azure service is specifically designed for this?","o":["Azure Virtual Desktop","Azure Virtual Machine Scale Sets","Azure Container Instances","Azure Bastion"],"e":"**Virtual Machine Scale Sets** let you create and automatically scale groups of identical, load-balanced virtual machines."}},{"n":16,"a":["A"],"fr":{"q":"Quel service Azure permet à des employés distants d\u0027accéder à un environnement de bureau virtuel complet hébergé dans le cloud, avec leurs applications et données ?","o":["Azure Virtual Desktop","Azure App Service","Azure Functions","Azure Logic Apps"],"e":"**Azure Virtual Desktop** fournit des bureaux et applications virtuels accessibles à distance depuis le cloud."},"en":{"q":"Which Azure service allows remote employees to access a complete cloud-hosted virtual desktop environment, with their applications and data?","o":["Azure Virtual Desktop","Azure App Service","Azure Functions","Azure Logic Apps"],"e":"**Azure Virtual Desktop** provides virtual desktops and applications that can be accessed remotely from the cloud."}},{"n":17,"a":["B"],"fr":{"q":"Une entreprise veut exécuter rapidement un seul conteneur pour un traitement ponctuel de courte durée, sans gérer de cluster ni de machine virtuelle. Quel service Azure correspond le mieux à ce besoin ?","o":["Azure Kubernetes Service (AKS), pour un contrôle fin de l\u0027orchestration","Azure Container Instances (ACI), pour un déploiement rapide et isolé d\u0027un conteneur unique","Azure Container Apps, uniquement destiné aux applications nécessitant Dapr","Azure App Service avec un plan dédié Windows"],"e":"**Azure Container Instances** permet de lancer un conteneur isolé très rapidement, sans provisionner ni gérer de machines virtuelles ou de cluster."},"en":{"q":"A company wants to quickly run a single container for a short-lived, one-off processing task, without managing a cluster or a virtual machine. Which Azure service best meets this need?","o":["Azure Kubernetes Service (AKS), for fine-grained control over orchestration","Azure Container Instances (ACI), for fast, isolated deployment of a single container","Azure Container Apps, intended only for applications that require Dapr","Azure App Service with a dedicated Windows plan"],"e":"**Azure Container Instances** lets you start an isolated container very quickly, without provisioning or managing virtual machines or a cluster."}},{"n":18,"a":["A"],"fr":{"q":"Quelle est la principale différence entre Azure Kubernetes Service (AKS) et Azure Functions pour héberger des charges de travail conteneurisées complexes avec plusieurs microservices liés ?","o":["AKS offre un contrôle complet sur l\u0027orchestration de plusieurs conteneurs liés entre eux, tandis qu\u0027Azure Functions est conçu pour exécuter du code événementiel de courte durée","Azure Functions ne peut exécuter que des conteneurs Windows, contrairement à AKS","AKS ne prend en charge que les applications écrites en Python","Azure Functions gère nativement l\u0027orchestration Kubernetes en arrière-plan"],"e":"**AKS** orchestre des applications multi-conteneurs complexes, alors qu\u0027**Azure Functions** est un service serverless dédié à l\u0027exécution de code déclenché par des événements."},"en":{"q":"What is the main difference between Azure Kubernetes Service (AKS) and Azure Functions for hosting complex containerized workloads with multiple linked microservices?","o":["AKS provides full control over the orchestration of multiple interconnected containers, while Azure Functions is designed to run short-lived, event-driven code","Azure Functions can only run Windows containers, unlike AKS","AKS only supports applications written in Python","Azure Functions natively handles Kubernetes orchestration in the background"],"e":"**AKS** orchestrates complex multi-container applications, whereas **Azure Functions** is a serverless service dedicated to running event-triggered code."}},{"n":19,"a":["A"],"fr":{"q":"Quel service Azure permet d\u0027exécuter du code déclenché par un événement, par exemple l\u0027ajout d\u0027un fichier, en ne payant que pour le temps d\u0027exécution réel ?","o":["Azure Functions","Azure App Service","Azure Virtual Machines","Azure Kubernetes Service"],"e":"**Azure Functions** est un service de calcul serverless facturé selon le temps d\u0027exécution et déclenché par des événements."},"en":{"q":"Which Azure service lets you run code triggered by an event, such as a file being added, while paying only for the actual execution time?","o":["Azure Functions","Azure App Service","Azure Virtual Machines","Azure Kubernetes Service"],"e":"**Azure Functions** is a serverless compute service billed based on execution time and triggered by events."}},{"n":20,"a":["A"],"fr":{"q":"Quel service Azure est principalement conçu pour héberger facilement des applications web et des API, avec mise à l\u0027échelle intégrée, sans gérer l\u0027infrastructure sous-jacente ?","o":["Azure App Service","Azure Data Box","Azure Bastion","Azure ExpressRoute"],"e":"**Azure App Service** est une plateforme PaaS entièrement gérée pour héberger des applications web, des API et des applications mobiles."},"en":{"q":"Which Azure service is primarily designed to easily host web applications and APIs, with built-in scaling, without managing the underlying infrastructure?","o":["Azure App Service","Azure Data Box","Azure Bastion","Azure ExpressRoute"],"e":"**Azure App Service** is a fully managed PaaS platform for hosting web apps, APIs and mobile apps."}},{"n":21,"a":["A"],"fr":{"q":"Quel composant réseau Azure permet de connecter deux réseaux virtuels (VNets) afin qu\u0027ils communiquent comme s\u0027ils ne formaient qu\u0027un seul réseau, sans transiter par internet public ?","o":["Le peering de réseaux virtuels (VNet peering)","Azure DNS","Azure Load Balancer","Network Security Group"],"e":"Le **peering de VNets** relie deux réseaux virtuels via l\u0027infrastructure Microsoft, en privé, sans passer par internet."},"en":{"q":"Which Azure networking component lets you connect two virtual networks (VNets) so that they communicate as if they were a single network, without traversing the public internet?","o":["Virtual network peering (VNet peering)","Azure DNS","Azure Load Balancer","Network Security Group"],"e":"**VNet peering** connects two virtual networks privately through the Microsoft backbone infrastructure, without going over the internet."}},{"n":22,"a":["B"],"fr":{"q":"Quelle solution Azure permet d\u0027établir une connexion privée et dédiée, n\u0027empruntant pas le réseau internet public, entre un centre de données local et Azure, avec une bande passante élevée et une latence prévisible ?","o":["VPN Gateway de site à site","Azure ExpressRoute","Azure Peering Service public","Azure CDN"],"e":"**Azure ExpressRoute** fournit une connectivité privée dédiée hors internet public, contrairement à VPN Gateway qui chiffre le trafic via internet."},"en":{"q":"Which Azure solution lets you establish a private, dedicated connection that does not use the public internet between an on-premises datacenter and Azure, with high bandwidth and predictable latency?","o":["Site-to-site VPN Gateway","Azure ExpressRoute","Public Azure Peering Service","Azure CDN"],"e":"**Azure ExpressRoute** provides dedicated private connectivity outside the public internet, unlike VPN Gateway, which encrypts traffic over the internet."}},{"n":23,"a":["C"],"fr":{"q":"Une entreprise doit conserver pendant 7 ans des archives réglementaires rarement consultées, au coût de stockage le plus bas possible, en acceptant un délai de récupération pouvant aller jusqu\u0027à plusieurs heures. Quel niveau d\u0027accès Blob Storage est le plus adapté ?","o":["Niveau Chaud (Hot)","Niveau Froid (Cool)","Niveau Archive","Niveau Premium"],"e":"Le niveau **Archive** offre le coût de stockage le plus bas pour des données rarement consultées, avec un temps de récupération pouvant atteindre plusieurs heures."},"en":{"q":"A company must retain rarely accessed regulatory archives for 7 years at the lowest possible storage cost, accepting a retrieval time of up to several hours. Which Blob Storage access tier is most appropriate?","o":["Hot tier","Cool tier","Archive tier","Premium tier"],"e":"The **Archive** tier offers the lowest storage cost for rarely accessed data, with a retrieval time that can reach several hours."}},{"n":24,"a":["A","B"],"fr":{"q":"Parmi les affirmations suivantes sur la redondance du stockage Azure, lesquelles sont exactes ?","o":["Le stockage localement redondant (LRS) conserve trois copies synchrones des données au sein d\u0027un seul data center","Le stockage géo-redondant (GRS) réplique de façon asynchrone les données vers une région secondaire appairée, en plus des copies locales","Le stockage à zone redondante (ZRS) ne réplique les données que dans un seul data center, sans tolérance de panne de zone","Le stockage géo-zone-redondant (GZRS) ne peut jamais offrir d\u0027accès en lecture sur la région secondaire"],"e":"**LRS** conserve trois copies dans un seul data center et **GRS** ajoute une réplication asynchrone vers une région appairée ; ZRS réplique en réalité sur trois zones, et GZRS peut proposer un accès en lecture (RA-GZRS)."},"en":{"q":"Which of the following statements about Azure Storage redundancy are correct?","o":["Locally redundant storage (LRS) keeps three synchronous copies of the data within a single datacenter","Geo-redundant storage (GRS) asynchronously replicates data to a paired secondary region, in addition to the local copies","Zone-redundant storage (ZRS) replicates data only within a single datacenter, with no tolerance for zone failure","Geo-zone-redundant storage (GZRS) can never offer read access to the secondary region"],"e":"**LRS** keeps three copies in a single datacenter and **GRS** adds asynchronous replication to a paired region; ZRS actually replicates across three zones, and GZRS can offer read access (RA-GZRS)."}},{"n":25,"a":["A"],"fr":{"q":"Une entreprise doit synchroniser en continu de nouveaux fichiers entre un serveur de fichiers local et Azure Files, dans les deux sens. Quel outil Azure est spécifiquement conçu pour ce scénario de synchronisation continue ?","o":["Azure File Sync","Azure Data Box","AzCopy exécuté une seule fois","Azure Migrate"],"e":"**Azure File Sync** synchronise en continu des partages de fichiers locaux avec Azure Files, contrairement à Data Box qui est un transfert ponctuel hors ligne."},"en":{"q":"A company needs to continuously synchronize new files between an on-premises file server and Azure Files, in both directions. Which Azure tool is specifically designed for this continuous synchronization scenario?","o":["Azure File Sync","Azure Data Box","AzCopy run a single time","Azure Migrate"],"e":"**Azure File Sync** continuously synchronizes on-premises file shares with Azure Files, unlike Data Box, which is a one-time offline transfer."}},{"n":26,"a":["A"],"fr":{"q":"Pour renforcer la sécurité des connexions sans obliger les utilisateurs à saisir un mot de passe, par exemple via une clé de sécurité FIDO2 ou l\u0027application Microsoft Authenticator en mode téléphone, comment appelle-t-on cette catégorie de méthodes d\u0027authentification Microsoft Entra ID ?","o":["L\u0027authentification sans mot de passe (passwordless)","L\u0027authentification unique (SSO)","L\u0027accès conditionnel","Les identités managées"],"e":"L\u0027**authentification sans mot de passe** remplace la saisie d\u0027un mot de passe par des méthodes comme une clé FIDO2 ou une notification Authenticator."},"en":{"q":"To strengthen sign-in security without requiring users to enter a password, for example using a FIDO2 security key or the Microsoft Authenticator app in phone sign-in mode, what is this category of Microsoft Entra ID authentication methods called?","o":["Passwordless authentication","Single sign-on (SSO)","Conditional Access","Managed identities"],"e":"**Passwordless authentication** replaces entering a password with methods such as a FIDO2 key or an Authenticator notification."}},{"n":27,"a":["B"],"fr":{"q":"Quel principe de sécurité consiste à ne jamais faire confiance implicitement à un utilisateur ou un appareil, même à l\u0027intérieur du réseau de l\u0027entreprise, et à vérifier explicitement chaque demande d\u0027accès ?","o":["La défense en profondeur (defense in depth)","Le modèle de confiance zéro (Zero Trust)","Microsoft Defender for Cloud","La gouvernance des coûts"],"e":"Le modèle **Zero Trust** repose sur la vérification explicite systématique et l\u0027absence de confiance implicite, même au sein du réseau interne."},"en":{"q":"Which security principle consists of never implicitly trusting a user or device, even inside the corporate network, and explicitly verifying every access request?","o":["Defense in depth","The Zero Trust model","Microsoft Defender for Cloud","Cost governance"],"e":"The **Zero Trust** model relies on always verifying explicitly and on the absence of implicit trust, even within the internal network."}},{"n":28,"a":["B"],"fr":{"q":"Parmi les facteurs suivants, lequel influence directement le coût des ressources Azure ?","o":["La couleur de l\u0027interface du portail Azure choisie par l\u0027utilisateur","Le type et la taille des ressources provisionnées, ainsi que la région et la durée d\u0027utilisation","Le nombre de favoris épinglés dans le tableau de bord Azure","Le nom attribué au groupe de ressources"],"e":"Le coût dépend notamment du **type** et de la **taille** des ressources, de la **région** de déploiement et de la durée d\u0027utilisation."},"en":{"q":"Which of the following factors directly affects the cost of Azure resources?","o":["The Azure portal interface color chosen by the user","The type and size of the provisioned resources, as well as the region and duration of use","The number hey are exceeded, and analyze in detail the breakdown of past cloud spending?","o":["Microsoft Cost Management","Azure Policy","Azure Advisor","Azure Monitor"],"e":"**Microsoft Cost Management** lets you track, analyze and budget Azure spending, with alerts when budgets are exceeded."}},{"n":31,"a":["A"],"fr":{"q":"Une entreprise souhaite regrouper ses dépenses Azure par département (Marketing, Finance, IT) dans ses rapports de facturation, alors que les ressources de ces départements sont réparties dans plusieurs groupes de ressources. Quelle fonctionnalité Azure permet cela ?","o":["Les balises (tags) de métadonnées appliquées aux ressources","Les verrous de ressources","Les zones de disponibilité","Le modèle ARM"],"e":"Les **tags** permettent d\u0027ajouter des métadonnées (comme le département) aux ressources pour faciliter le filtrage et l\u0027analyse des coûts, indépendamment de leur groupe de ressources."},"en":{"q":"A company wants to group its Azure spending by department (Marketing, Finance, IT) in its billing reports, even though the resources of these departments are spread across several resource groups. Which Azure feature makes this possible?","o":["Metadata tags applied to resources","Resource locks","Availability zones","The ARM template"],"e":"**Tags** let you add metadata (such as the department) to resources to make cost filtering and analysis easier, regardless of their resource group."}},{"n":32,"a":["A"],"fr":{"q":"Une entreprise veut empêcher automatiquement la création de machines virtuelles en dehors d\u0027une liste de régions autorisées, et signaler ou bloquer les ressources non conformes. Quel service Azure permet d\u0027appliquer ce type de règles de gouvernance ?","o":["Azure Policy","Azure RBAC","Microsoft Purview","Les verrous de ressources"],"e":"**Azure Policy** permet de créer des règles qui auditent ou refusent la création de ressources non conformes, comme une région non autorisée."},"en":{"q":"A company wants to automatically function md(s){
  if(!s) return "";
  let out = "", inList = false;
  for(const raw of s.split("\n")){
    const l = raw.trim();
    const m = l.match(/^[-*]\s+(.*)/);
    if(m){ if(!inList){ out += "<ul>"; inList = true; } out += "<li>"+inline(m[1])+"</li>"; continue; }
    if(inList){ out += "</ul>"; inList = false; }
    if(l) out += "<p style='margin:.3rem 0'>"+inline(l)+"</p>";
  }
  return out + (inList ? "</ul>" : "");
}

    start({ key:String(e.id), ids:e.questions.map(q=>e.id+"-"+q.n), mode, shQ:store.shQ, shO:store.shO });
  });
  document.querySelectorAll("[data-special]").forEach(el => el.onclick = () => {
    if(el.dataset.special==="random"){
      const all = DATA.flatMap(e=>e.questions.map(q=>e.id+"-"+q.n));
      start({ key:"random", ids:shuffle(all).slice(0,60), mode, shQ:false, shO:store.shO });
    } else {
      start({ key:"wrong", ids:Object.keys(store.wrong), mode, shQ:true, shO:store.shO });
    }
  });
  if($("#resume")) $("#resume").onclick = () => { S = store.session; runQuiz(); };
  if($("#drop")) $("#drop").onclick = () => { store.session = null; save(); home(); };
  if($("#reset")) $("#reset").onclick = () => { if(confirm(t.resetQ)){ store.results={}; store.wrong={}; store.session=null; save(); home(); } };
}

/* ---------- Quiz ---------- */
function start(o){
  const ids = o.shQ ? shuffle(o.ids) : o.ids.slice();
  const order = {};
  ids.forEach(id => { const q = qById(id); const ks = q.fr.o.map((_,i)=>i); order[id] = o.shO ? shuffle(ks) : ks; });
  S = { v:META.version, key:o.key, from:o.from || null, mode:o.mode, ids, order, ans:{}, checked:{}, flags:{}, cur:0,
        limit: o.mode==="exam" ? Math.round(ids.length*85/60)*60 : 0, elapsed:0, finished:false };
  store.session = S; save();
  runQuiz();
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function runQuiz(){
  stopTimer();
  let last = Date.now();
  timerId = setInterval(() => {
    const now = Date.now(); S.elapsed += (now-last)/1000; last = now;
    const t = $("#timer"); if(t) updTimer(t);
    if(S.mode==="exam" && S.elapsed >= S.limit){ alert(T().timeUp); finish(); return; }
    if(Math.round(S.elapsed)%5===0){ store.session = S; save(); }
  }, 1000);
  renderQ();
}
function updTimer(t){
  if(S.mode==="exam"){ const r = S.limit - S.elapsed; t.textContent = "⏱️ " + fmtTime(r); t.classList.toggle("low", r < 300); }
  else t.textContent = "⏱️ " + fmtTime(S.elapsed);
}
function renderQ(){
  redraw = renderQ;
  const L10 = T();
  const id = S.ids[S.cur], q = qById(id), t = tx(q), ord = S.order[id], good = ansOf(id);
  const sel = S.ans[id] || [], multi = good.length > 1, checked = !!S.checked[id];
  const nAns = Object.keys(S.ans).filter(k=>S.ans[k].length).length;
  let h = `<div class="card"><div class="qhead"><div><b>${esc(sTitle(S))}</b> <span class="mut">· ${S.mode==="exam"?L10.modeExam:L10.modeTrain}</span></div>
  <div class="row"><span class="timer" id="timer"></span><button class="sm" id="quit">${L10.quit}</button></div></div>
  <div class="progress"><div style="width:${(S.cur+1)/S.ids.length*100}%"></div></div>
  <div class="row" style="justify-content:space-between"><span class="mut">${L10.qpos(S.cur+1, S.ids.length, nAns)}</span>
  <span class="mut">${S.key==="random"||S.key==="wrong"?L10.origin(id.split("-")[0], id.split("-")[1]):""}</span></div>
  <div class="qtext">${inline(t.q)}</div>
  <div class="hint">${multi ? L10.pickN(nWord(good.length)) : L10.pick1}</div><div id="choices">`;
  ord.forEach((oi, pos) => {
    const isSel = sel.includes(oi), isGood = good.includes(keyOf(oi));
    let cls = "choice";
    if(checked){ cls += " locked"; if(isGood) cls += " good"; else if(isSel) cls += " bad"; }
    else if(isSel) cls += " sel";
    h += `<label class="${cls}" data-oi="${oi}"><input type="${multi?"checkbox":"radio"}" name="c" ${isSel?"checked":""} ${checked?"disabled":""}>
      <span class="k">${keyOf(pos)}.</span><span>${inline(t.o[oi])}</span></label>`;
  });
  h += `</div>`;
  if(checked){
    const ok = isCorrect(id);
    const goodLetters = ord.map((oi,pos)=>good.includes(keyOf(oi))?keyOf(pos):null).filter(Boolean).join(", ");
    h += `<div class="fb ${ok?"ok":"ko"}"><b>${ok?L10.ok:L10.ko}</b> ${ok?"":L10.goodIs(goodLetters)}
      ${t.e ? `<div class="expl"><b>${L10.explC}</b>${md(t.e)}</div>` : ""}</div>`;
  }
  h += `<div class="nav"><button id="prev" ${S.cur===0?"disabled":""}>${L10.prev}</button>
    <div class="row">
      <button class="flagbtn ${S.flags[id]?"on":""}" id="flag" title="${L10.flagT}">🚩 ${S.flags[id]?L10.flagged:L10.flag}</button>
      ${S.mode==="train" && !checked ? `<button class="pri" id="check" ${sel.length?"":"disabled"}>${L10.check}</button>` : ""}
      ${S.cur < S.ids.length-1 ? `<button class="${S.mode==="exam"||checked?"pri":""}" id="next">${L10.next}</button>` : ""}
      <button id="end" class="${S.cur===S.ids.length-1?"pri":""}">${L10.end}</button>
    </div></div>
    <div class="kbd" style="margin-top:.6rem">${L10.keys}</div></div>
  <div class="card"><div class="mut" style="margin-bottom:.5rem">${L10.pal}${S.mode==="exam"?L10.palExam:""}</div><div class="pal">`;
  S.ids.forEach((qid,i) => {
    let c = "";
    if(S.checked[qid]) c = isCorrect(qid) ? "g" : "r";
    else if((S.ans[qid]||[]).length) c = "ans";
    if(i===S.cur) c += " cur";
    if(S.flags[qid]) c += " fl";
    h += `<button class="${c}" data-go="${i}">${i+1}</button>`;
  });
  h += `</div></div>`;
  app.innerHTML = h;
  updTimer($("#timer"));
  document.querySelectorAll(".choice").forEach(el => el.onclick = ev => { ev.preventDefault(); pick(+el.dataset.oi); });
  $("#prev").onclick = () => go(S.cur-1);
  if($("#next")) $("#next").onclick = () => go(S.cur+1);
  if($("#check")) $("#check").onclick = check;
  $("#flag").onclick = () => { S.flags[id] = !S.flags[id]; persist(); renderQ(); };
  $("#end").onclick = () => {
    const rest = S.ids.length - Object.keys(S.ans).filter(k=>S.ans[k].length).length;
    if(confirm(rest ? L10.endRest(rest) : L10.endQ)) finish();
  };
  $("#quit").onclick = () => { persist(); home(); };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
}
function persist(){ store.session = S; save(); }
function pick(oi){
  const id = S.ids[S.cur], need = ansOf(id).length;
  if(S.checked[id]) return;
  let sel = (S.ans[id] || []).slice();
  if(need > 1){
    if(sel.includes(oi)) sel = sel.filter(x=>x!==oi);
    else { sel.push(oi); if(sel.length > need) sel.shift(); }
  } else sel = [oi];
  S.ans[id] = sel; persist(); renderQ();
}
function check(){
  const id = S.ids[S.cur];
  if(!(S.ans[id]||[]).length) return;
  S.checked[id] = true;
  trackWrong(id); persist(); renderQ();
}
function go(i){ if(i<0 || i>=S.ids.length) return; S.cur = i; persist(); renderQ(); window.scrollTo(0,0); }
function isCorrect(id){ return same((S.ans[id]||[]).map(keyOf), ansOf(id)); }
function trackWrong(id){ if(isCorrect(id)) delete store.wrong[id]; else store.wrong[id] = 1; }

/* ---------- Résultats ---------- */
function finish(){
  stopTimer();
  S.ids.forEach(id => { if(S.mode==="exam" || S.checked[id] || (S.ans[id]||[]).length) trackWrong(id); });
  const good = S.ids.filter(isCorrect).length, pct = Math.round(good/S.ids.length*100);
  if(/^\d+$/.test(S.key)){
    const r = store.results[S.key] || {best:0,count:0};
    store.results[S.key] = { best:Math.max(r.best,pct), last:pct, count:r.count+1, date:new Date().toISOString() };
  }
  S.finished = true; store.session = null; save();
  results("all");
}
function results(filter){
  redraw = () => results(filter);
  const L10 = T();
  const good = S.ids.filter(isCorrect).length, n = S.ids.length, pct = Math.round(good/n*100), pass = pct >= 70;
  const scaled = Math.round(100 + good/n*900);
  let h = `<div class="card" style="text-align:center"><h2 style="margin:0">${esc(sTitle(S))} — ${L10.result}</h2>
    <div class="score ${pass?"ok":"ko"}">${L10.pct(pct)}</div>
    <div>${L10.score(good, n, scaled, fmtTime(S.elapsed))}</div>
    <p style="font-size:1.2rem">${pass?L10.pass:L10.fail}</p>
    <div class="row" style="justify-content:center"><button class="pri" id="again">${L10.again}</button>
    ${S.ids.some(id=>!isCorrect(id))?`<button id="retryWrong">${L10.retryWrong}</button>`:""}<button id="back">${L10.back}</button></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${L10.review}</h3>
  <div class="seg" id="flt"><button data-f="all">${L10.fAll(n)}</button><button data-f="ko">${L10.fKo(n-good)}</button><button data-f="flag">${L10.fFlag(S.ids.filter(id=>S.flags[id]).length)}</button></div></div>`;
  S.ids.forEach((id,i) => {
    const ok = isCorrect(id);
    if(filter==="ko" && ok) return;
    if(filter==="flag" && !S.flags[id]) return;
    const q = qById(id), t = tx(q), ord = S.order[id], sel = S.ans[id] || [];
    const fmt = arr => arr.length ? arr.map(oi=>`<b>${keyOf(ord.indexOf(oi))}.</b> ${inline(t.o[oi])}`).join("<br>") : `<i>${L10.none}</i>`;
    const goodOi = ansOf(id).map(idxOf).sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));
    h += `<div class="rv"><div><span class="${ok?"tag-ok":"tag-ko"}">${ok?"✔":"✘"} Q${i+1}</span> ${S.flags[id]?"🚩":""} ${inline(t.q)}</div>
      ${ok?"":`<div class="ans">${L10.yours} <span style="color:var(--ko)">${fmt(sel.slice().sort((a,b)=>ord.indexOf(a)-ord.indexOf(b)))}</span></div>`}
      <div class="ans">${L10.goodA} <span style="color:var(--ok)">${fmt(goodOi)}</span></div>
      ${t.e?`<details class="expl"><summary>${L10.expl}</summary>${md(t.e)}</details>`:""}</div>`;
  });
  h += `</div>`;
  app.innerHTML = h; window.scrollTo(0,0);
  document.querySelectorAll("#flt button").forEach(b => { b.classList.toggle("on", b.dataset.f===filter); b.onclick = () => results(b.dataset.f); });
  $("#back").onclick = home;
  $("#again").onclick = () => start({ key:S.key, from:S.from, ids:S.ids, mode:S.mode, shQ:store.shQ, shO:store.shO });
  if($("#retryWrong")) $("#retryWrong").onclick = () => start({ key:"wrong", from:S.from || S.key, ids:S.ids.filter(id=>!isCorrect(id)), mode:S.mode, shQ:false, shO:store.shO });
}

/* ---------- Global ---------- */
document.addEventListener("keydown", e => {
  if(!S || S.finished || e.ctrlKey || e.metaKey || e.altKey || !$("#choices")) return;
  const k = e.key.toUpperCase(), id = S.ids[S.cur], q = qById(id);
  let pos = -1;
  if(/^[A-F]$/.test(k)) pos = k.charCodeAt(0)-65; else if(/^[1-6]$/.test(k)) pos = +k-1;
  if(pos >= 0 && pos < S.order[id].length){ pick(S.order[id][pos]); return; }
  if(k==="M"){ $("#flag").click(); return; }
  if(e.key==="ArrowLeft") go(S.cur-1);
  else if(e.key==="ArrowRight") go(S.cur+1);
  else if(e.key==="Enter"){
    e.preventDefault();
    if(S.mode==="train" && !S.checked[id] && (S.ans[id]||[]).length) check();
    else if(S.cur < S.ids.length-1) go(S.cur+1);
  }
});
function applyTheme(){ const t = store.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); document.documentElement.dataset.theme = t; }
function applyLang(){
  const t = T();
  document.documentElement.lang = L();
  document.title = t.docTitle;
  $("#hdr").textContent = t.hdr; $("#home").title = t.home; $("#theme").title = t.theme; $("#lang").title = t.lang;
  $("#foot").textContent = t.footer;
  document.querySelectorAll("#lang button").forEach(b => b.classList.toggle("on", b.dataset.l===L()));
}
document.querySelectorAll("#lang button").forEach(b => b.onclick = () => { store.lang = b.dataset.l; save(); applyLang(); redraw(); });
$("#theme").onclick = () => { store.theme = document.documentElement.dataset.theme==="dark" ? "light" : "dark"; save(); applyTheme(); };
$("#home").onclick = () => { if(S && !S.finished) persist(); home(); };
// Après une recompilation (nouveau contenu), toute session en cours est invalidée.
if(store.session && store.session.v!==META.version) store.session = null;
for(const id of Object.keys(store.wrong)) if(!qById(id)) delete store.wrong[id];
save();
applyTheme(); applyLang(); home();
</script>
</body>
