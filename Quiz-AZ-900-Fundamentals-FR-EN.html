s, what is the guaranteed minimum number of physically separate zones?","o":["2","3","4","5"],"e":"An Azure region that supports availability zones has a minimum of **3 zones** that are physically separate, each with its own power, cooling, and networking."}},{"n":13,"a":["B"],"fr":{"q":"Lorsque la géographie le permet, quelle distance minimale Microsoft vise-t-il à respecter entre les deux régions formant une paire régionale Azure ?","o":["100 miles (environ 160 km)","300 miles (environ 480 km)","500 miles (environ 800 km)","1 000 miles (environ 1 600 km)"],"e":"Microsoft cherche à séparer les régions d\u0027une paire d\u0027au moins **300 miles (environ 480 km)** lorsque c\u0027est géographiquement possible, afin de limiter le risque qu\u0027un même sinistre affecte les deux régions."},"en":{"q":"Where geography allows, what minimum distance does Microsoft aim to maintain between the two regions that make up an Azure region pair?","o":["100 miles (about 160 km)","300 miles (about 480 km)","500 miles (about 800 km)","1,000 miles (about 1,600 km)"],"e":"Microsoft aims to separate the regions in a pair by at least **300 miles (about 480 km)** where geographically possible, to reduce the risk of a single disaster affecting both regions."}},{"n":14,"a":["B"],"fr":{"q":"En excluant le niveau racine et le niveau des abonnements, quelle est la profondeur maximale (en nombre de niveaux) d\u0027une hiérarchie de groupes d\u0027administration (management groups) Azure ?","o":["4 niveaux","6 niveaux","8 niveaux","10 niveaux"],"e":"Une hiérarchie de groupes d\u0027administration peut compter jusqu\u0027à **6 niveaux de profondeur**, sans compter le niveau racine ni le niveau des abonnements."},"en":{"q":"Excluding the root level and the subscription level, what is the maximum depth (in number of levels) of an Azure management group hierarchy?","o":["4 levels","6 levels","8 levels","10 levels"],"e":"A management group hierarchy can support up to **6 levels of depth**, not including the root level or the subscription level."}},{"n":15,"a":["C"],"fr":{"q":"Quel est le nombre maximal de groupes d\u0027administration (management groups) pouvant exister dans un même annuaire (tenant) Microsoft Entra ID ?","o":["1 000","5 000","10 000","100 000"],"e":"Un même annuaire Microsoft Entra ID peut contenir jusqu\u0027à **10 000 groupes d\u0027administration**."},"en":{"q":"What is the maximum number of management groups that can exist in a single Microsoft Entra ID directory (tenant)?","o":["1,000","5,000","10,000","100,000"],"e":"A single Microsoft Entra ID directory can contain up to **10,000 management groups**."}},{"n":16,"a":["C"],"fr":{"q":"En utilisant une image issue de la Place de marché Azure, combien d\u0027instances de machines virtuelles un même groupe identique de machines virtuelles (VM Scale Set) peut-il contenir au maximum ?","o":["100 instances","600 instances","1 000 instances","Un nombre illimité"],"e":"Un VM Scale Set basé sur une image de plateforme (Marketplace) peut contenir jusqu\u0027à **1 000 instances** de VM, contre 600 avec une image personnalisée."},"en":{"q":"When using an image from Azure Marketplace, what is the maximum number of virtual machine instances that a single virtual machine scale set (VM Scale Set) can contain?","o":["100 instances","600 instances","1,000 instances","An unlimited number"],"e":"A VM Scale Set based on a platform (Marketplace) image can contain up to **1,000 VM instances**, compared to 600 with a custom image."}},{"n":17,"a":["B"],"fr":{"q":"Combien de domaines de panne (fault domains) au maximum un groupe à disponibilité (availability set) Azure peut-il utiliser ?","o":["2","3","5","20"],"e":"Un groupe à disponibilité Azure peut être configuré avec jusqu\u0027à **3 domaines de panne**, correspondant à des racks physiques distincts."},"en":{"q":"What is the maximum number of fault domains that an Azure availability set can use?","o":["2","3","5","20"],"e":"An Azure availability set can be configured with up to **3 fault domains**, corresponding to separate physical racks."}},{"n":18,"a":["C"],"fr":{"q":"Combien de domaines de mise à jour (update domains) au maximum un groupe à disponibilité Azure peut-il comporter ?","o":["3","5","20","50"],"e":"Un groupe à disponibilité Azure peut comporter jusqu\u0027à **20 domaines de mise à jour**, afin de limiter l\u0027impact des maintenances planifiées."},"en":{"q":"What is the maximum number of update domains that an Azure availability set can have?","o":["3","5","20","50"],"e":"An Azure availability set can have up to **20 update domains**, to limit the impact of planned maintenance."}},{"n":19,"a":["B"],"fr":{"q":"Avec l\u0027option de redondance LRS (stockage localement redondant) d\u0027Azure Storage, combien de copies synchrones des données sont conservées, et où ?","o":["2 copies, réparties sur 2 datacenters","3 copies, au sein d\u0027un seul datacenter","3 copies, réparties sur 2 régions","6 copies, réparties sur 2 régions"],"e":"La redondance **LRS** conserve 3 copies synchrones des données, mais toutes au sein d\u0027un seul datacenter d\u0027une même région."},"en":{"q":"With the LRS (locally redundant storage) redundancy option in Azure Storage, how many synchronous copies of the data are kept, and where?","o":["2 copies, spread across 2 datacenters","3 copies, within a single datacenter","3 copies, spread across 2 regions","6 copies, spread across 2 regions"],"e":"**LRS** redundancy keeps 3 synchronous copies of the data, all within a single datacenter in one region."}},{"n":20,"a":["C"],"fr":{"q":"Avec l\u0027option de redondance GRS (stockage géo-redondant) d\u0027Azure Storage, combien de copies totales des données sont conservées entre la région principale et la région secondaire ?","o":["3 copies","4 copies","6 copies","9 copies"],"e":"La redondance **GRS** combine 3 copies locales dans la région principale et 3 copies dans la région secondaire, soit **6 copies** au total."},"en":{"q":"With the GRS (geo-redundant storage) redundancy option in Azure Storage, how many total copies of the data are kept across the primary and secondary regions?","o":["3 copies","4 copies","6 copies","9 copies"],"e":"**GRS** redundancy combines 3 local copies in the primary region and 3 copies in the secondary region, for a total of **6 copies**."}},{"n":21,"a":["C","D"],"fr":{"q":"Parmi les options de redondance suivantes d\u0027Azure Storage, lesquelles offrent une durabilité annuelle d\u0027au moins 16 neuf (99,99999999999999 %) pour les objets stockés ?","o":["LRS","ZRS","GRS","RA-GRS"],"e":"**GRS** et **RA-GRS**, qui répliquent les données dans une région secondaire distante, offrent une durabilité d\u0027au moins 16 neuf, contre 11 neuf pour LRS et ZRS qui ne protègent que contre une perte locale."},"en":{"q":"Which of the following Azure Storage redundancy options provide at least 16 nines (99.99999999999999%) of annual durability for stored objects?","o":["LRS","ZRS","GRS","RA-GRS"],"e":"**GRS** and **RA-GRS**, which replicate data to a distant secondary region, provide at least 16 nines of durability, compared to 11 nines for LRS and ZRS, which only protect against local loss."}},{"n":22,"a":["B"],"fr":{"q":"Quelle est la durée minimale de stockage recommandée pour le niveau d\u0027accès Cool (froid) d\u0027Azure Blob Storage avant qu\u0027une suppression ou un changement de niveau n\u0027entraîne des frais de suppression anticipée ?","o":["7 jours","30 jours","90 jours","180 jours"],"e":"Le niveau **Cool** impose une durée minimale de conservation de **30 jours** ; toute suppression avant ce délai entraîne des frais proportionnels aux jours restants."},"en":{"q":"What is the recommended minimum storage duration for the Cool access tier of Azure Blob Storage before a deletion or tier change incurs an early deletion fee?","o":["7 days","30 days","90 days","180 days"],"e":"The **Cool** tier has a minimum retention period of **30 days**; any deletion before that period incurs a fee prorated for the remaining days."}},{"n":23,"a":["C"],"fr":{"q":"Quelle est la durée minimale de conservation pour le niveau Archive d\u0027Azure Blob Storage avant qu\u0027une suppression anticipée n\u0027entraîne des frais ?","o":["30 jours","90 jours","180 jours","365 jours"],"e":"Le niveau **Archive** impose une durée minimale de conservation de **180 jours** avant toute suppression sans pénalité."},"en":{"q":"What is the minimum retention period for the Archive tier of Azure Blob Storage before an early deletion incurs a fee?","o":["30 days","90 days","180 days","365 days"],"e":"The **Archive** tier has a minimum retention period of **180 days** before data can be deleted without a penalty."}},{"n":24,"a":["B"],"fr":{"q":"Lors de la réhydratation d\u0027un blob archivé avec la priorité Standard, combien de temps cette opération peut-elle prendre au maximum ?","o":["Moins d\u00271 heure","Jusqu\u0027à 15 heures","Jusqu\u0027à 48 heures","Jusqu\u0027à 7 jours"],"e":"Une réhydratation en priorité **Standard** peut prendre jusqu\u0027à **15 heures**, alors que la priorité High peut aboutir en moins d\u0027une heure pour de petits objets."},"en":{"q":"When rehydrating an archived blob with Standard priority, what is the maximum time this operation can take?","o":["Less than 1 hour","Up to 15 hours","Up to 48 hours","Up to 7 days"],"e":"A **Standard** priority rehydration can take up to **15 hours**, whereas High priority can complete in under an hour for small objects."}},{"n":25,"a":["C"],"fr":{"q":"Quelle est la bande passante maximale disponible pour un circuit Azure ExpressRoute (via ExpressRoute Direct) ?","o":["10 Gbps","40 Gbps","100 Gbps","400 Gbps"],"e":"Un circuit **ExpressRoute** peut atteindre jusqu\u0027à **100 Gbps** de bande passante via ExpressRoute Direct."},"en":{"q":"What is the maximum bandwidth available for an Azure ExpressRoute circuit (via ExpressRoute Direct)?","o":["10 Gbps","40 Gbps","100 Gbps","400 Gbps"],"e":"An **ExpressRoute** circuit can reach up to **100 Gbps** of bandwidth through ExpressRoute Direct."}},{"n":26,"a":["A","B"],"fr":{"q":"Parmi les affirmations suivantes concernant les sous-réseaux (subnets) d\u0027un réseau virtuel Azure, lesquelles sont correctes ?","o":["Azure réserve 5 adresses IP dans chaque sous-réseau","Le plus petit sous-réseau pris en charge est un /29","Un même sous-réseau peut appartenir simultanément à plusieurs réseaux virtuels","Azure ne réserve aucune adresse IP dans les sous-réseaux"],"e":"Azure réserve systématiquement **5 adresses IP** par sous-réseau (adresse réseau, passerelle, deux adresses DNS et broadcast), et le plus petit sous-réseau pris en charge est un **/29**."},"en":{"q":"Which of the following statements about subnets in an Azure virtual network are correct?","o":["Azure reserves 5 IP addresses in each subnet","The smallest supported subnet is a /29","The same subnet can belong to multiple virtual networks at the same time","Azure does not reserve any IP addresses in subnets"],"e":"Azure always reserves **5 IP addresses** per subnet (network address, gateway, two DNS addresses, and broadcast), and the smallest supported subnet is a **/29**."}},{"n":27,"a":["C"],"fr":{"q":"Combien de rôles Azure RBAC dits « fondamentaux » (Owner, Contributor, Reader, User Access Administrator) sont intégrés nativement dans Azure ?","o":["2","3","4","5"],"e":"Azure propose **4 rôles RBAC fondamentaux** intégrés : Propriétaire, Contributeur, Lecteur et Administrateur des accès utilisateurs."},"en":{"q":"How many so-called \"fundamental\" Azure RBAC roles (Owner, Contributor, Reader, User Access Administrator) are built into Azure?","o":["2","3","4","5"],"e":"Azure provides **4 fundamental built-in RBAC roles**: Owner, Contributor, Reader, and User Access Administrator."}},{"n":28,"a":["C"],"fr":{"q":"Quel est le nombre maximal de balises (tags) pouvant être appliquées à une même ressource, un même groupe de ressources ou un même abonnement Azure ?","o":["15","32","50","100"],"e":"Azure limite à **50** le nombre de balises applicables à une ressource, un groupe de ressources ou un abonnement."},"en":{"q":"What is the maximum number of tags that can be applied to a single Azure resource, resource group, or subscription?","o":["15","32","50","100"],"e":"Azure limits the number of tags that can be applied to a resource, resource group, or subscription to **50**."}},{"n":29,"a":["B"],"fr":{"q":"Combien de types de verrous de ressources (resource locks) Azure propose-t-il ?","o":["1","2","3","4"],"e":"Azure propose exactement **2 types de verrous** : CanNotDelete (empêche la suppression) et ReadOnly (empêche toute modification)."},"en":{"q":"How many types of resource locks does Azure offer?","o":["1","2","3","4"],"e":"Azure offers exactly **2 types of locks**: CanNotDelete (prevents deletion) and ReadOnly (prevents any modification)."}},{"n":30,"a":["C"],"fr":{"q":"Combien de catégories de recommandations Azure Advisor évalue-t-il actuellement ?","o":["3","4","5","6"],"e":"Azure Advisor évalue aujourd\u0027hui **5 catégories** : coût, sécurité, fiabilité, excellence opérationnelle et performance."},"en":{"q":"How many recommendation categories does Azure Advisor currently evaluate?","o":["3","4","5","6"],"e":"Azure Advisor currently evaluates **5 categories**: cost, security, reliability, operational excellence, and performance."}},{"n":31,"a":["C"],"fr":{"q":"Au-delà de la durée de conservation par défaut de 30 jours, jusqu\u0027à combien de jours peut-on étendre la rétention des données d\u0027un espace de travail Log Analytics ?","o":["90 jours","365 jours","730 jours","1 095 jours"],"e":"La rétention des données d\u0027un espace de travail **Log Analytics** peut être configurée jusqu\u0027à **730 jours** (soit 2 ans), au-delà des 30 jours appliqués par défaut."},"en":{"q":"Beyond the default retention period of 30 days, up to how many days can data retention in a Log Analytics workspace be extended?","o":["90 days","365 days","730 days","1,095 days"],"e":"Data retention in a **Log Analytics** workspace can be configured up to **730 days** (2 years), beyond the default 30 days."}},{"n":32,"a":["B"],"fr":{"q":"Combien de modes de déploiement un modèle ARM (Azure Resource Manager) propose-t-il pour traiter les ressources déjà présentes dans un groupe de ressources mais absentes du modèle ?","o":["1 mode","2 modes","3 modes","4 modes"],"e":"Un déploiement ARM propose **2 modes** : Incrémentiel (par défaut, conserve les ressources non listées) et Complet (supprime les ressources absentes du modèle)."},"en":{"q":"How many deployment modes does an ARM (Azure Resource Manager) template offer for handling resources that already exist in a resource group but are not in the template?","o":["1 mode","2 modes","3 modes","4 modes"],"e":"An ARM deployment offers **2 modes**: Incremental (the default, which keeps resources not listed) and Complete (which deletes resources not in the template)."}},{"n":33,"a":["B"],"fr":{"q":"Combien d\u0027options de périodicité (« time grain ») propose-t-on lors de la création d\u0027un budget dans Microsoft Cost Management ?","o":["2 (mensuel, annuel)","3 (mensuel, trimestriel, annuel)","4 (quotidien, mensuel, trimestriel, annuel)","5"],"e":"Microsoft Cost Management propose **3 granularités** pour un budget : mensuelle, trimestrielle et annuelle ; aucune option quotidienne n\u0027est disponible."},"en":{"q":"How many reset period (\"time grain\") options are available when creating a budget in Microsoft Cost Management?","o":["2 (monthly, annually)","3 (monthly, quarterly, annually)","4 (daily, monthly, quarterly, annually)","5"],"e":"Microsoft Cost Management offers **3 time grains** for a budget: monthly, quarterly, and annually; no daily option is available."}},{"n":34,"a":["B"],"fr":{"q":"À combien de groupes de ressources (resource groups) une même ressource Azure peut-elle appartenir simultanément ?","o":["0, elle reste isolée","1 seul","2 maximum","Autant que nécessaire"],"e":"Une ressource Azure ne peut appartenir qu\u0027à **un seul groupe de ressources** à la fois, même si elle peut être déplacée vers un autre groupe."},"en":{"q":"How many resource groups can a single Azure resource belong to at the same time?","o":["0, it remains isolated","Only 1","2 at most","As many as needed"],"e":"An Azure resource can belong to **only one resource group** at a time, although it can be moved to another group."}},{"n":35,"a":["B"],"fr":{"q":"Par défaut, sous quel niveau de la hiérarchie de gouvernance un nouvel abonnement Azure est-il automatiquement placé si aucun groupe d\u0027administration spécifique n\u0027est désigné ?","o":["Il reste isolé, hors de toute hiérarchie","Le groupe d\u0027administration racine (Tenant Root Group)","Un groupe nommé « Production » créé automatiquement","Le niveau d\u0027un groupe de ressources par défaut"],"e":"Tout nouvel abonnement est automatiquement rattaché au **groupe d\u0027administration racine** (Tenant Root Group) tant qu\u0027il n\u0027est pas déplacé ailleurs."},"en":{"q":"By default, under which level of the governance hierarchy is a new Azure subscription automatically placed if no specific management group is designated?","o":["It remains isolated, outside of any hierarchy","The root management group (Tenant Root Group)","A group named \"Production\" that is created automatically","The level of a default resource group"],"e":"Every new subscription is automatically placed under the **root management group** (Tenant Root Group) until it is moved elsewhere."}},{"n":36,"a":["B"],"fr":{"q":"Quelle est la principale différence entre Azure RBAC et Azure Policy ?","o":["Azure Policy détermine qui peut effectuer une action, Azure RBAC vérifie la conformité des ressources","Azure RBAC détermine qui peut effectuer une action sur une ressource, Azure Policy évalue et impose la conformité des propriétés des ressources","Les deux services remplissent exactement la même fonction","Azure Policy remplace entièrement Azure RBAC depuis 2023"],"e":"**Azure RBAC** gère les autorisations d\u0027accès (qui peut faire quoi), tandis qu\u0027**Azure Policy** contrôle et impose des règles sur les propriétés et la conformité des ressources, indépendamment des permissions d\u0027accès."},"en":{"q":"What is the main difference between Azure RBAC and Azure Policy?","o":["Azure Policy determines who can perform an action, while Azure RBAC checks resource compliance","Azure RBAC determines who can perform an action on a resource, while Azure Policy evaluates and enforces compliance of resource properties","Both services perform exactly the same function","Azure Policy has completely replaced Azure RBAC since 2023"],"e":"**Azure RBAC** manages access permissions (who can do what), whereas **Azure Policy** controls and enforces rules on resource properties and compliance, independently of access permissions."}},{"n":37,"a":["B"],"fr":{"q":"À quoi sert principalement le Service Trust Portal de Microsoft ?","o":["Gérer les abonnements et la facturation Azure","Fournir des rapports d\u0027audit, de conformité et de certification sur les services Microsoft","Surveiller les performances des machines virtuelles en temps réel","Configurer les règles de pare-feu d\u0027un réseau virtuel"],"e":"Le **Service Trust Portal** met à disposition des rapports d\u0027audit, des certifications de conformité et des informations sur la sécurité et la confidentialité des services Microsoft."},"en":{"q":"What is the main purpose of the Microsoft Service Trust Portal?","o":["Managing Azure subscriptions and billing","Providing audit, compliance, and certification reports about Microsoft services","Monitoring virtual machine performance in real time","Configuring firewall rules for a virtual network"],"e":"The **Service Trust Portal** provides audit reports, compliance certifications, and information about the security and privacy of Microsoft services."}},{"n":38,"a":["B"],"fr":{"q":"Que permet principalement de faire la calculatrice TCO (Total Cost of Ownership) d\u0027Azure ?","o":["Estimer le coût mensuel futur d\u0027une nouvelle charge de travail conçue nativement pour Azure","Comparer le coût estimé d\u0027une infrastructure on-premises existante avec son équivalent hébergé dans Azure","Calculer automatiquement l\u0027empreinte carbone d\u0027un datacenter Azure","Définir les quotas de rôles RBAC pour un abonnement"],"e":"La **calculatrice TCO** compare le coût total d\u0027une infrastructure sur site existante à celui d\u0027une solution équivalente migrée vers Azure, contrairement à la calculatrice de prix qui estime le coût de nouveaux services Azure."},"en":{"q":"What is the Azure TCO (Total Cost of Ownership) calculator mainly used for?","o":["Estimating the future monthly cost of a new workload designed natively for Azure","Comparing the estimated cost of an existing on-premises infrastructure with its equivalent hosted in Azure","Automatically calculating the carbon footprint of an Azure datacenter","Defining RBAC role quotas for a subscription"],"e":"The **TCO calculator** compares the total cost of an existing on-premises infrastructure with that of an equivalent solution migrated to Azure, unlike the Pricing calculator, which estimates the cost of new Azure services."}},{"n":39,"a":["B"],"fr":{"q":"Quel est le rôle principal d\u0027Azure Arc ?","o":["Fournir un tunnel VPN chiffré entre deux réseaux virtuels Azure","Étendre la gestion et la gouvernance Azure (Policy, RBAC, surveillance) à des ressources hébergées hors d\u0027Azure, sur site ou dans d\u0027autres clouds","Remplacer complètement Azure Resource Manager","Héberger nativement des clusters Kubernetes managés"],"e":"**Azure Arc** étend les outils de gestion et de gouvernance Azure (comme Azure Policy et le RBAC) à des serveurs, clusters Kubernetes et services situés en dehors d\u0027Azure, y compris sur site ou dans d\u0027autres clouds."},"en":{"q":"What is the main role of Azure Arc?","o":["Providing an encrypted VPN tunnel between two Azure virtual networks","Extending Azure management and governance (Policy, RBAC, monitoring) to resources hosted outside Azure, on-premises or in other clouds","Completely replacing Azure Resource Manager","Natively hosting managed Kubernetes clusters"],"e":"**Azure Arc** extends Azure management and governance tools (such as Azure Policy and RBAC) to servers, Kubernetes clusters, and services located outside Azure, including on-premises or in other clouds."}},{"n":40,"a":["A","C"],"fr":{"q":"Azure Advisor répartit ses recommandations en cinq catégories. Parmi les propositions suivantes, lesquelles correspondent réellement à une catégorie d\u0027Azure Advisor ?","o":["Sécurité","Conformité RGPD","Excellence opérationnelle","Support client 24/7"],"e":"Les cinq catégories réelles d\u0027Azure Advisor sont coût, **sécurité**, fiabilité, **excellence opérationnelle** et performance ; la conformité RGPD et le support client n\u0027en font pas partie."},"en":{"q":"Azure Advisor organizes its recommendations into five categories. Which of the following actually correspond to an Azure Advisor category?","o":["Security","GDPR compliance","Operational excellence","24/7 customer support"],"e":"The five actual Azure Advisor categories are cost, **security**, reliability, **operational excellence**, and performance; GDPR compliance and customer support are not among them."}}]},{"id":5,"title":{"fr":"Examen blanc 5 — Gouvernance et sécurité appliquées","en":"Practice exam 5 — Applied governance and security"},"questions":[{"n":1,"a":["A"],"fr":{"q":"Une startup souhaite pouvoir provisionner elle-même de nouvelles machines virtuelles via un portail web, sans contacter un technicien ni signer un nouveau contrat. Quelle caractéristique fondamentale du cloud computing correspond le mieux à ce besoin ?","o":["Le libre-service à la demande","La tarification à l\u0027usage","La redondance géographique","La virtualisation imbriquée"],"e":"Le **libre-service à la demande** permet aux utilisateurs de provisionner eux-mêmes des ressources informatiques, sans intervention humaine du fournisseur."},"en":{"q":"A startup wants to be able to provision new virtual machines itself through a web portal, without contacting a technician or signing a new contract. Which fundamental characteristic of cloud computing best matches this need?","o":["On-demand self-service","Pay-per-use pricing","Geo-redundancy","Nested virtualization"],"e":"**On-demand self-service** allows users to provision computing resources themselves, without human interaction with the provider."}},{"n":2,"a":["A"],"fr":{"q":"Une entreprise héberge ses applications métier sur Azure tout en utilisant un service d\u0027intelligence artificielle spécifique proposé par un autre fournisseur cloud. Comment qualifie-t-on cette stratégie ?","o":["Une approche multicloud","Une approche hybride","Une stratégie de reprise après sinistre","Une stratégie de colocation"],"e":"Utiliser simultanément des services de plusieurs fournisseurs cloud différents est appelé **approche multicloud**."},"en":{"q":"A company hosts its business applications on Azure while using a specific artificial intelligence service offered by another cloud provider. What is this strategy called?","o":["A multicloud approach","A hybrid approach","A disaster recovery strategy","A colocation strategy"],"e":"Using services from several different cloud providers at the same time is called a **multicloud approach**."}},{"n":3,"a":["A"],"fr":{"q":"Pour des raisons réglementaires, une banque doit conserver certaines données sensibles sur ses propres serveurs tout en modernisant ses applications non critiques dans Azure. Quel modèle de déploiement répond à cette contrainte de gouvernance ?","o":["Le cloud hybride","Le cloud public pur","Le cloud privé pur","Le cloud communautaire"],"e":"Le **cloud hybride** combine des ressources on-premises et des ressources cloud public, permettant de respecter des contraintes de résidence des données."},"en":{"q":"For regulatory reasons, a bank must keep certain sensitive data on its own servers while modernizing its non-critical applications in Azure. Which deployment model meets this governance constraint?","o":["Hybrid cloud","Pure public cloud","Pure private cloud","Community cloud"],"e":"**Hybrid cloud** combines on-premises resources and public cloud resources, making it possible to meet data residency constraints."}},{"n":4,"a":["A"],"fr":{"q":"Une PME ne souhaite plus acheter de serveurs physiques et préfère payer un abonnement mensuel en fonction de son utilisation réelle des ressources. Quel changement de modèle financier cela représente-t-il ?","o":["Un passage du CapEx vers l\u0027OpEx","Un passage de l\u0027OpEx vers le CapEx","Une augmentation des dépenses d\u0027investissement","Une suppression totale des coûts informatiques"],"e":"Payer pour la consommation réelle sans acheter de matériel correspond à des dépenses opérationnelles (**OpEx**) plutôt qu\u0027à des dépenses d\u0027investissement (CapEx)."},"en":{"q":"A small business no longer wants to buy physical servers and prefers to pay a monthly subscription based on its actual resource usage. What financial model change does this represent?","o":["A shift from CapEx to OpEx","A shift from OpEx to CapEx","An increase in capital expenditure","A complete elimination of IT costs"],"e":"Paying for actual consumption without buying hardware corresponds to operational expenditure (**OpEx**) rather than capital expenditure (CapEx)."}},{"n":5,"a":["A"],"fr":{"q":"Une entreprise constate que sa facture Azure varie chaque mois selon le nombre d\u0027heures de calcul réellement consommées par ses machines virtuelles. Quel modèle de tarification illustre cette situation ?","o":["La tarification à la consommation (pay-as-you-go)","Les instances réservées sur trois ans","La licence perpétuelle","Le forfait fixe annuel non révisable"],"e":"Le modèle **pay-as-you-go** facture les ressources selon leur utilisation réelle, ce qui fait varier la facture mensuelle."},"en":{"q":"A company notices that its Azure bill varies each month depending on the number of compute hours actually consumed by its virtual machines. Which pricing model does this situation illustrate?","o":["Consumption-based pricing (pay-as-you-go)","Three-year reserved instances","Perpetual licensing","A fixed, non-revisable annual flat rate"],"e":"The **pay-as-you-go** model bills resources based on their actual usage, which causes the monthly bill to vary."}},{"n":6,"a":["A"],"fr":{"q":"Une équipe veut exécuter un petit traitement déclenché par l\u0027arrivée d\u0027un fichier, sans gérer ni dimensionner le moindre serveur, en ne payant que pendant les quelques secondes d\u0027exécution. Quel concept du cloud correspond à ce besoin ?","o":["L\u0027informatique sans serveur (serverless)","L\u0027hébergement sur machine virtuelle dédiée","La haute disponibilité","Le groupe à haute disponibilité"],"e":"Le modèle **serverless** exécute du code à la demande sans gestion d\u0027infrastructure, avec une facturation basée sur le temps d\u0027exécution réel."},"en":{"q":"A team wants to run a small process triggered by the arrival of a file, without managing or sizing any server, and paying only for the few seconds of execution. Which cloud concept matches this need?","o":["Serverless computing","Hosting on a dedicated virtual machine","High availability","Availability set"],"e":"The **serverless** model runs code on demand without infrastructure management, with billing based on actual execution time."}},{"n":7,"a":["A"],"fr":{"q":"Une application critique dépend de deux services Azure distincts, chacun garanti à 99,9 % de disponibilité selon son contrat SLA. En combinant ces deux services dans un même flux, quelle est la disponibilité composite approximative de la solution globale ?","o":["Environ 99,8 %","Exactement 99,9 %","Environ 99,99 %","100 %"],"e":"Lorsque deux services dépendants sont combinés, leurs SLA se multiplient (0,999 x 0,999 ≈ 0,998), ce qui abaisse légèrement la disponibilité composite."},"en":{"q":"A critical application depends on two separate Azure services, each guaranteed at 99.9% availability under its SLA. When these two services are combined in the same workflow, what is the approximate composite availability of the overall solution?","o":["Approximately 99.8%","Exactly 99.9%","Approximately 99.99%","100%"],"e":"When two dependent services are combined, their SLAs are multiplied (0.999 x 0.999 ≈ 0.998), which slightly lowers the composite availability."}},{"n":8,"a":["A"],"fr":{"q":"Un site d\u0027e-commerce voit son trafic multiplié par dix pendant les soldes puis revenir à la normale quelques jours plus tard, avec un ajustement automatique des ressources à chaque étape. Quelle propriété du cloud est principalement illustrée ici ?","o":["L\u0027élasticité","La scalabilité verticale uniquement","La redondance géographique","La tolérance de panne"],"e":"L\u0027**élasticité** désigne la capacité à augmenter puis réduire automatiquement les ressources selon la demande réelle, contrairement à la scalabilité qui se limite à ajouter des ressources."},"en":{"q":"An e-commerce website sees its traffic increase tenfold during sales and then return to normal a few days later, with resources adjusted automatically at each stage. Which cloud property is primarily illustrated here?","o":["Elasticity","Vertical scalability only","Geo-redundancy","Fault tolerance"],"e":"**Elasticity** refers to the ability to automatically increase and then reduce resources according to actual demand, unlike scalability, which is limited to adding resources."}},{"n":9,"a":["A"],"fr":{"q":"Une entreprise choisit Azure notamment parce qu\u0027elle peut estimer à l\u0027avance le temps de reprise après un incident et compter sur des performances constantes dans la durée. Quels concepts du cloud décrit-elle ?","o":["La fiabilité et la prévisibilité","La scalabilité et l\u0027élasticité","Le CapEx et l\u0027OpEx","Le IaaS et le PaaS"],"e":"La **fiabilité** concerne la capacité à se rétablir après une panne, tandis que la **prévisibilité** concerne la cohérence des performances et des coûts dans le temps."},"en":{"q":"A company chooses Azure partly because it can estimate in advance the recovery time after an incident and count on consistent performance over time. Which cloud concepts is it describing?","o":["Reliability and predictability","Scalability and elasticity","CapEx and OpEx","IaaS and PaaS"],"e":"**Reliability** concerns the ability to recover from a failure, while **predictability** concerns the consistency of performance and costs over time."}},{"n":10,"a":["A"],"fr":{"q":"Dans un contrat SaaS comme Microsoft 365, qui demeure toujours responsable de la sécurité physique des datacenters et de l\u0027infrastructure réseau sous-jacente ?","o":["Le fournisseur cloud (Microsoft)","Le client final uniquement","Un prestataire tiers indépendant","Personne, cette responsabilité disparaît en SaaS"],"e":"Dans le **modèle de responsabilité partagée**, le fournisseur cloud conserve toujours la responsabilité de l\u0027infrastructure physique, quel que soit le modèle de service."},"en":{"q":"In a SaaS agreement such as Microsoft 365, who always remains responsible for the physical security of the datacenters and the underlying network infrastructure?","o":["The cloud provider (Microsoft)","The end customer only","An independent third-party provider","No one, this responsibility disappears with SaaS"],"e":"In the **shared responsibility model**, the cloud provider always retains responsibility for the physical infrastructure, regardless of the service model."}},{"n":11,"a":["A","C"],"fr":{"q":"Quels sont deux avantages typiques du passage à un modèle de dépenses opérationnelles (OpEx) basé sur la consommation cloud ?","o":["La possibilité d\u0027ajuster les coûts à la hausse ou à la baisse selon les besoins réels","La suppression totale de toute facturation future","L\u0027absence d\u0027investissement initial important en matériel","La garantie que les coûts resteront identiques chaque mois"],"e":"Le modèle **OpEx** permet de payer uniquement ce qui est consommé, en ajustant les coûts selon l\u0027usage et en évitant un investissement initial lourd."},"en":{"q":"What are two typical benefits of moving to an operational expenditure (OpEx) model based on cloud consumption?","o":["The ability to adjust costs up or down according to actual needs","The complete elimination of any future billing","No large upfront investment in hardware","A guarantee that costs will remain identical every month"],"e":"The **OpEx** model lets you pay only for what you consume, adjusting costs based on usage and avoiding a heavy upfront investment."}},{"n":12,"a":["A"],"fr":{"q":"Pour garantir la reprise après sinistre de son application, une entreprise réplique ses données vers une seconde région Azure associée à sa région principale par Microsoft. Comment appelle-t-on ce mécanisme de jumelage entre deux régions ?","o":["Les paires de régions (region pairs)","Les zones de disponibilité","Les groupes à haute disponibilité","Le peering de réseaux virtuels"],"e":"Chaque région Azure est associée à une région jumelle au sein de la même géographie, formant une **paire de régions** utilisée notamment pour la reprise après sinistre."},"en":{"q":"To ensure disaster recovery for its application, a company replicates its data to a second Azure region that Microsoft pairs with its primary region. What is this pairing mechanism between two regions called?","o":["Region pairs","Availability zones","Availability sets","Virtual network peering"],"e":"Each Azure region is paired with another region within the same geography, forming a **region pair** used in particular for disaster recovery."}},{"n":13,"a":["A"],"fr":{"q":"Une entreprise veut protéger son application contre la panne d\u0027un seul datacenter, tout en restant dans la même région Azure pour conserver une faible latence. Quelle fonctionnalité doit-elle utiliser ?","o":["Les zones de disponibilité","Les paires de régions","Le Traffic Manager mondial","Un groupe de ressources unique"],"e":"Les **zones de disponibilité** regroupent des datacenters physiquement séparés au sein d\u0027une même région, protégeant contre les pannes locales d\u0027infrastructure."},"en":{"q":"A company wants to protect its application against the failure of a single datacenter, while staying within the same Azure region to keep latency low. Which feature should it use?","o":["Availability zones","Region pairs","Global Traffic Manager","A single resource group"],"e":"**Availability zones** group physically separate datacenters within the same region, protecting against local infrastructure failures."}},{"n":14,"a":["A"],"fr":{"q":"Un groupe possède douze souscriptions Azure réparties entre plusieurs filiales et souhaite appliquer la même politique de sécurité et le même contrôle d\u0027accès à l\u0027ensemble d\u0027entre elles en une seule opération. Quel niveau de la hiérarchie Azure doit-il utiliser ?","o":["Un groupe d\u0027administration (management group)","Un groupe de ressources (resource group)","Un tag de souscription","Une zone de disponibilité"],"e":"Les **groupes d\u0027administration** regroupent plusieurs souscriptions afin d\u0027appliquer de manière cohérente des stratégies, du RBAC ou des Azure Policy."},"en":{"q":"A group has twelve Azure subscriptions spread across several subsidiaries and wants to apply the same security policy and access control to all of them in a single operation. Which level of the Azure hierarchy should it use?","o":["A management group","A resource group","A subscription tag","An availability zone"],"e":"**Management groups** group multiple subscriptions together in order to consistently apply policies, RBAC, or Azure Policy."}},{"n":15,"a":["A"],"fr":{"q":"Un site web doit automatiquement augmenter le nombre de machines virtuelles identiques lors des pics de trafic, puis les réduire ensuite, sans intervention manuelle. Quel service Azure est conçu pour cela ?","o":["Azure Virtual Machine Scale Sets","Azure Container Instances","Azure Resource Manager","Azure Bastion"],"e":"Les **Virtual Machine Scale Sets** créent et gèrent un groupe de machines virtuelles identiques dont le nombre s\u0027ajuste automatiquement selon la charge."},"en":{"q":"A website must automatically increase the number of identical virtual machines during traffic peaks and then reduce them afterward, without manual intervention. Which Azure service is designed for this?","o":["Azure Virtual Machine Scale Sets","Azure Container Instances","Azure Resource Manager","Azure Bastion"],"e":"**Virtual Machine Scale Sets** create and manage a group of identical virtual machines whose number adjusts automatically based on load."}},{"n":16,"a":["A"],"fr":{"q":"Une équipe de développement veut héberger une application web sans avoir à gérer elle-même le système d\u0027exploitation, les correctifs ou le serveur web sous-jacent. Quel service Azure correspond le mieux à ce besoin ?","o":["Azure App Service","Azure Virtual Machines","Azure Virtual Desktop","Azure ExpressRoute"],"e":"**Azure App Service** est un service PaaS entièrement managé pour héberger des applications web, l\u0027infrastructure étant gérée par Microsoft."},"en":{"q":"A development team wants to host a web application without having to manage the operating system, patches, or underlying web server itself. Which Azure service best matches this need?","o":["Azure App Service","Azure Virtual Machines","Azure Virtual Desktop","Azure ExpressRoute"],"e":"**Azure App Service** is a fully managed PaaS service for hosting web applications, with the infrastructure managed by Microsoft."}},{"n":17,"a":["A"],"fr":{"q":"Une entreprise exploite plusieurs dizaines de microservices conteneurisés et a besoin d\u0027un orchestrateur complet pour gérer leur déploiement, leur montée en charge et leur disponibilité. Quel service Azure est le plus adapté ?","o":["Azure Kubernetes Service (AKS)","Azure Container Instances","Azure Functions","Azure Virtual Desktop"],"e":"**AKS** fournit un service Kubernetes managé pour orchestrer un grand nombre de conteneurs à l\u0027échelle, contrairement à Azure Container Instances conçu pour des scénarios plus simples."},"en":{"q":"A company runs several dozen containerized microservices and needs a full orchestrator to manage their deployment, scaling, and availability. Which Azure service is the most suitable?","o":["Azure Kubernetes Service (AKS)","Azure Container Instances","Azure Functions","Azure Virtual Desktop"],"e":"**AKS** provides a managed Kubernetes service to orchestrate a large number of containers at scale, unlike Azure Container Instances, which is designed for simpler scenarios."}},{"n":18,"a":["A"],"fr":{"q":"Une entreprise veut exécuter un petit script déclenché uniquement par un événement précis, par exemple l\u0027ajout d\u0027un fichier, et ne payer que pour les quelques millisecondes d\u0027exécution effective. Quel service Azure correspond à ce besoin ?","o":["Azure Functions","Azure Virtual Machines","Azure Kubernetes Service","Azure ExpressRoute"],"e":"**Azure Functions** est un service de calcul serverless événementiel facturé à l\u0027exécution, sans infrastructure à gérer."},"en":{"q":"A company wants to run a small script triggered only by a specific event, such as a file being added, and pay only for the few milliseconds of actual execution. Which Azure service matches this need?","o":["Azure Functions","Azure Virtual Machines","Azure Kubernetes Service","Azure ExpressRoute"],"e":"**Azure Functions** is an event-driven serverless compute service billed per execution, with no infrastructure to manage."}},{"n":19,"a":["A"],"fr":{"q":"Une entreprise financière souhaite relier son datacenter local à Azure via une connexion privée dédiée, sans transiter par l\u0027internet public, afin de garantir une latence stable et une meilleure confidentialité. Quel service doit-elle choisir ?","o":["Azure ExpressRoute","Un VPN Gateway classique sur internet","Le peering de réseaux virtuels","Azure Front Door"],"e":"**ExpressRoute** établit une connexion privée dédiée entre un réseau on-premises et Azure, en dehors de l\u0027internet public."},"en":{"q":"A financial company wants to connect its on-premises datacenter to Azure through a dedicated private connection, without going over the public internet, in order to ensure stable latency and better privacy. Which service should it choose?","o":["Azure ExpressRoute","A standard VPN Gateway over the internet","Virtual network peering","Azure Front Door"],"e":"**ExpressRoute** establishes a dedicated private connection between an on-premises network and Azure, outside the public internet."}},{"n":20,"a":["A"],"fr":{"q":"Une entreprise veut qu\u0027un compte de stockage Azure ne soit accessible que depuis son réseau virtuel privé, et jamais directement depuis l\u0027internet public, même si un attaquant connaît la clé d\u0027accès. Quelle fonctionnalité réseau permet d\u0027atteindre cet objectif ?","o":["Un point de terminaison privé (private endpoint)","Un point de terminaison public avec pare-feu désactivé","Un peering de réseaux virtuels","Une zone de disponibilité"],"e":"Un **private endpoint** attribue une adresse IP privée du réseau virtuel au service PaaS, supprimant son exposition sur l\u0027internet public."},"en":{"q":"A company wants an Azure storage account to be accessible only from its private virtual network, and never directly from the public internet, even if an attacker knows the access key. Which networking feature achieves this goal?","o":["A private endpoint","A public endpoint with the firewall disabled","Virtual network peering","An availability zone"],"e":"A **private endpoint** assigns a private IP address from the virtual network to the PaaS service, removing its exposure to the public internet."}},{"n":21,"a":["A"],"fr":{"q":"Une entreprise veut que ses données de stockage Azure restent disponibles même en cas de panne totale de la région principale, en les répliquant automatiquement vers une région secondaire distante. Quelle option de redondance doit-elle choisir ?","o":["Le stockage géo-redondant (GRS)","Le stockage localement redondant (LRS)","Le stockage à zone unique","Le niveau d\u0027accès archive"],"e":"Le **GRS** réplique les données vers une région secondaire éloignée, protégeant contre une panne régionale complète, contrairement au LRS."},"en":{"q":"A company wants its Azure Storage data to remain available even if the primary region fails completely, by automatically replicating it to a distant secondary region. Which redundancy option should it choose?","o":["Geo-redundant storage (GRS)","Locally redundant storage (LRS)","Single-zone storage","The archive access tier"],"e":"**GRS** replicates data to a distant secondary region, protecting against a complete regional outage, unlike LRS."}},{"n":22,"a":["A"],"fr":{"q":"Une entreprise veut centraliser la gestion des identités de ses employés afin qu\u0027ils utilisent un compte unique pour se connecter à Microsoft 365, à des applications SaaS tierces et à ses applications internes. Quel service Azure répond à ce besoin ?","o":["Microsoft Entra ID","Azure Key Vault","Azure Policy","Azure Resource Manager"],"e":"**Microsoft Entra ID** est le service de gestion des identités et des accès permettant une authentification unique sur de multiples applications."},"en":{"q":"A company wants to centralize the identity management of its employees so that they use a single account to sign in to Microsoft 365, third-party SaaS applications, and its internal applications. Which Azure service meets this need?","o":["Microsoft Entra ID","Azure Key Vault","Azure Policy","Azure Resource Manager"],"e":"**Microsoft Entra ID** is the identity and access management service that enables single sign-on across multiple applications."}},{"n":23,"a":["A"],"fr":{"q":"Un consultant externe doit uniquement pouvoir consulter les ressources d\u0027un seul groupe de ressources, sans pouvoir les modifier ni accéder aux autres groupes de ressources de la souscription. Quelle solution permet d\u0027appliquer précisément cette restriction ?","o":["Attribuer le rôle intégré Lecteur via Azure RBAC, limité à ce groupe de ressources","Donner le rôle Propriétaire sur toute la souscription","Créer une Azure Policy interdisant toute modification","Appliquer un verrou ReadOnly sur la souscription entière"],"e":"**Azure RBAC** permet d\u0027attribuer un rôle précis, comme Lecteur, à une portée précise telle qu\u0027un groupe de ressources, respectant le principe du moindre privilège."},"en":{"q":"An external consultant must only be able to view the resources in a single resource group, without being able to modify them or access the other resource groups in the subscription. Which solution enforces exactly this restriction?","o":["Assign the built-in Reader role through Azure RBAC, scoped to that resource group","Grant the Owner role on the entire subscription","Create an Azure Policy that denies all changes","Apply a ReadOnly lock on the entire subscription"],"e":"**Azure RBAC** allows you to assign a specific role, such as Reader, at a specific scope such as a resource group, following the principle of least privilege."}},{"n":24,"a":["A"],"fr":{"q":"Une entreprise veut exiger une authentification multifacteur uniquement lorsqu\u0027un employé se connecte depuis un pays inhabituel ou un appareil non reconnu, tout en laissant une connexion simple depuis le réseau du bureau. Quelle fonctionnalité Microsoft Entra permet ce contrôle contextuel ?","o":["L\u0027accès conditionnel (Conditional Access)","Le verrouillage de compte automatique","Azure Policy","Le chiffrement au repos"],"e":"L\u0027**accès conditionnel** applique des règles basées sur le contexte (localisation, appareil, risque) pour déclencher des contrôles supplémentaires comme le MFA."},"en":{"q":"A company wants to require multifactor authentication only when an employee signs in from an unusual country or an unrecognized device, while allowing a simple sign-in from the office network. Which Microsoft Entra feature provides this context-based control?","o":["Conditional Access","Automatic account lockout","Azure Policy","Encryption at rest"],"e":"**Conditional Access** applies rules based on context (location, device, risk) to trigger additional controls such as MFA."}},{"n":25,"a":["A","C"],"fr":{"q":"Quelles sont deux méthodes d\u0027authentification sans mot de passe prises en charge par Microsoft Entra ID ?","o":["Windows Hello Entreprise","Un mot de passe renouvelé automatiquement chaque mois","Une clé de sécurité FIDO2","Une question secrète personnelle"],"e":"**Windows Hello Entreprise** et les **clés de sécurité FIDO2** permettent de s\u0027authentifier sans saisir de mot de passe, réduisant les risques liés au vol d\u0027identifiants."},"en":{"q":"Which two passwordless authentication methods are supported by Microsoft Entra ID?","o":["Windows Hello for Business","A password that is automatically renewed every month","A FIDO2 security key","A personal security question"],"e":"**Windows Hello for Business** and **FIDO2 security keys** allow users to authenticate without entering a password, reducing the risks associated with credential theft."}},{"n":26,"a":["A","C"],"fr":{"q":"Quels sont deux principes fondamentaux du modèle de sécurité Confiance Zéro (Zero Trust) ?","o":["Vérifier explicitement chaque demande d\u0027accès, quelle que soit son origine","Faire confiance par défaut à tout appareil connecté au réseau interne de l\u0027entreprise","Partir du principe qu\u0027une violation a pu déjà se produire (assume breach)","Accorder un accès permanent après une première authentification réussie"],"e":"Le modèle **Confiance Zéro** repose notamment sur la vérification explicite de chaque requête et sur l\u0027hypothèse qu\u0027une compromission a pu déjà avoir lieu."},"en":{"q":"What are two fundamental principles of the Zero Trust security model?","o":["Verify every access request explicitly, regardless of its origin","Trust by default any device connected to the company\u0027s internal network","Assume that a breach may have already occurred (assume breach)","Grant permanent access after a first successful authentication"],"e":"The **Zero Trust** model relies in particular on explicitly verifying every request and on assuming that a compromise may have already occurred."}},{"n":27,"a":["A"],"fr":{"q":"Une entreprise veut obtenir un score de sécurité global ainsi que des recommandations priorisées pour corriger les mauvaises configurations de ses ressources Azure et de ses serveurs hybrides. Quel service doit-elle utiliser ?","o":["Microsoft Defender for Cloud","Azure Advisor pour les coûts uniquement","Azure Monitor","Microsoft Purview"],"e":"**Microsoft Defender for Cloud** évalue la posture de sécurité des ressources cloud et hybrides et fournit un score de sécurité avec des recommandations concrètes."},"en":{"q":"A company wants to obtain an overall security score as well as prioritized recommendations to fix misconfigurations in its Azure resources and hybrid servers. Which service should it use?","o":["Microsoft Defender for Cloud","Azure Advisor for costs only","Azure Monitor","Microsoft Purview"],"e":"**Microsoft Defender for Cloud** assesses the security posture of cloud and hybrid resources and provides a secure score with concrete recommendations."}},{"n":28,"a":["A"],"fr":{"q":"Une entreprise veut s\u0027assurer qu\u0027aucune ressource ne puisse être créée dans une région autre que l\u0027Europe, sur l\u0027ensemble de ses souscriptions, et que toute tentative non conforme soit automatiquement bloquée ou signalée. Quel outil Azure doit-elle mettre en place ?","o":["Azure Policy","Azure RBAC","Un verrou de ressource","Azure Advisor"],"e":"**Azure Policy** définit des règles de conformité appliquées automatiquement à l\u0027ensemble des ressources et souscriptions, par exemple restreindre les régions autorisées."},"en":{"q":"A company wants to ensure that no resource can be created in any region outside Europe, across all of its subscriptions, and that any non-compliant attempt is automatically blocked or flagged. Which Azure tool should it implement?","o":["Azure Policy","Azure RBAC","A resource lock","Azure Advisor"],"e":"**Azure Policy** defines compliance rules that are automatically applied to all resources and subscriptions, for example restricting the allowed regions."}},{"n":29,"a":["A"],"fr":{"q":"Une entreprise veut empêcher que son groupe de ressources de production ne soit supprimé accidentellement par un administrateur, même si celui-ci dispose des droits suffisants pour le faire. Quelle fonctionnalité doit-elle appliquer ?","o":["Un verrou de suppression (CanNotDelete)","Une Azure Policy de type Audit","Un tag de criticité","Un rôle RBAC Lecteur"],"e":"Un **verrou CanNotDelete** empêche la suppression d\u0027une ressource ou d\u0027un groupe de ressources, indépendamment des autorisations RBAC accordées à l\u0027utilisateur."},"en":{"q":"A company wants to prevent its production resource group from being accidentally deleted by an administrator, even if that administrator has sufficient permissions to do so. Which feature should it apply?","o":["A delete lock (CanNotDelete)","An Audit-type Azure Policy","A criticality tag","An RBAC Reader role"],"e":"A **CanNotDelete lock** prevents the deletion of a resource or resource group, regardless of the RBAC permissions granted to the user."}},{"n":30,"a":["A"],"fr":{"q":"Deux équipes marketing et finance partagent la même souscription Azure, et la direction souhaite pouvoir répartir précisément les coûts entre ces deux équipes dans les rapports de Cost Management. Quelle pratique de gouvernance permet cette répartition ?","o":["L\u0027application de tags (par exemple departement:marketing ou departement:finance) sur les ressources","La création de deux groupes d\u0027administration distincts uniquement","L\u0027activation d\u0027un verrou ReadOnly sur chaque ressource","La désactivation du Pricing Calculator"],"e":"Les **tags** ajoutent des métadonnées aux ressources, comme le nom d\u0027un département, afin de filtrer et répartir les coûts dans Microsoft Cost Management."},"en":{"q":"The marketing and finance teams share the same Azure subscription, and management wants to be able to allocate costs precisely between these two teams in Cost Management reports. Which governance practice enables this allocation?","o":["Applying tags (for example department:marketing or department:finance) to resources","Creating two separate management groups only","Enabling a ReadOnly lock on each resource","Disabling the Pricing Calculator"],"e":"**Tags** add metadata to resources, such as a department name, in order to filter and allocate costs in Microsoft Cost Management."}},{"n":31,"a":["A"],"fr":{"q":"Une entreprise veut être automatiquement alertée dès que ses dépenses Azure mensuelles approchent un seuil défini à l\u0027avance, avant même de recevoir la facture finale. Quel outil doit-elle configurer ?","o":["Un budget dans Microsoft Cost Management","Le calculateur TCO","Azure Policy","Un tag de budget"],"e":"**Microsoft Cost Management** permet de définir des budgets avec des alertes déclenchées lorsque les dépenses réelles ou prévues dépassent un seuil choisi."},"en":{"q":"A company wants to be automatically alerted as soon as its monthly Azure spending approaches a predefined threshold, even before receiving the final bill. Which tool should it configure?","o":["A budget in Microsoft Cost Management","The TCO calculator","Azure Policy","A budget tag"],"e":"**Microsoft Cost Management** allows you to define budgets with alerts triggered when actual or forecasted spending exceeds a chosen threshold."}},{"n":32,"a":["A"],"fr":{"q":"Une entreprise encore hébergée entièrement sur ses propres serveurs veut estimer les économies potentielles qu\u0027elle réaliserait en migrant vers Azure, en comparant ses coûts actuels d\u0027infrastructure à ceux du cloud. Quel outil Microsoft est conçu pour cette estimation ?","o":["Le calculateur de coût total de possession (TCO Calculator)","Le calculateur de prix Azure (Pricing Calculator)","Microsoft Cost Management","Azure Advisor"],"e":"Le **TCO Calculator** compare les coûts actuels d\u0027une infrastructure on-premises avec ceux d\u0027une solution équivalente dans Azure, contrairement au Pricing Calculator qui estime le coût d\u0027une architecture déjà définie."},"en":{"q":"A company still hosted entirely on its own servers wants to estimate the potential savings it would achieve by migrating to Azure, by comparing its current infrastructure costs with those of the cloud. Which Microsoft tool is designed for this estimate?","o":["The Total Cost of Ownership (TCO) Calculator","The Azure Pricing Calculator","Microsoft Cost Management","Azure Advisor"],"e":"The **TCO Calculator** compares the current costs of an on-premises infrastructure with those of an equivalent solution in Azure, unlike the Pricing Calculator, which estimates the cost of an already defined architecture."}},{"n":33,"a":["A"],"fr":{"q":"Une entreprise souhaite cartographier automatiquement l\u0027ensemble de ses données sensibles réparties entre Azure, d\u0027autres clouds et ses systèmes on-premises, et appliquer une classification cohérente. Quel service est conçu pour cette gouvernance des données ?","o":["Microsoft Purview","Azure Monitor","Azure Policy","Azure Service Health"],"e":"**Microsoft Purview** fournit un catalogue unifié permettant de découvrir, classifier et gouverner les données sensibles à travers des environnements hybrides et multicloud."},"en":{"q":"A company wants to automatically map all of its sensitive data spread across Azure, other clouds, and its on-premises systems, and apply consistent classification. Which service is designed for this data governance?","o":["Microsoft Purview","Azure Monitor","Azure Policy","Azure Service Health"],"e":"**Microsoft Purview** provides a unified catalog for discovering, classifying, and governing sensitive data across hybrid and multicloud environments."}},{"n":34,"a":["A"],"fr":{"q":"Un responsable conformité a besoin d\u0027accéder aux rapports d\u0027audit, certifications et détails sur les pratiques de sécurité de Microsoft afin de justifier la conformité réglementaire de l\u0027entreprise auprès d\u0027un régulateur. Où peut-il trouver ces documents officiels ?","o":["Le Service Trust Portal","Azure Advisor","Le portail Azure, section Resource Groups","Microsoft Purview"],"e":"Le **Service Trust Portal** centralise les rapports d\u0027audit, certifications de conformité et informations de sécurité fournis par Microsoft pour ses services cloud."},"en":{"q":"A compliance officer needs to access audit reports, certifications, and details about Microsoft\u0027s security practices in order to demonstrate the company\u0027s regulatory compliance to a regulator. Where can they find these official documents?","o":["The Service Trust Portal","Azure Advisor","The Azure portal, Resource Groups section","Microsoft Purview"],"e":"The **Service Trust Portal** centralizes the audit reports, compliance certifications, and security information provided by Microsoft for its cloud services."}},{"n":35,"a":["A"],"fr":{"q":"Une entreprise veut à la fois empêcher la création de machines virtuelles sans tag obligatoire, et limiter les personnes autorisées à créer des machines virtuelles. Quels outils doit-elle combiner respectivement pour ces deux objectifs ?","o":["Azure Policy pour imposer les tags, et Azure RBAC pour restreindre qui peut créer des ressources","Azure RBAC pour imposer les tags, et Azure Policy pour restreindre qui peut créer des ressources","Un verrou de ressource pour les deux objectifs","Microsoft Purview pour les deux objectifs"],"e":"**Azure Policy** contrôle la conformité des propriétés des ressources, tandis qu\u0027**Azure RBAC** contrôle les actions que les utilisateurs sont autorisés à effectuer."},"en":{"q":"A company wants both to prevent the creation of virtual machines without a mandatory tag and to limit who is allowed to create virtual machines. Which tools should it combine, respectively, for these two goals?","o":["Azure Policy to enforce tags, and Azure RBAC to restrict who can create resources","Azure RBAC to enforce tags, and Azure Policy to restrict who can create resources","A resource lock for both goals","Microsoft Purview for both goals"],"e":"**Azure Policy** controls the compliance of resource properties, while **Azure RBAC** controls the actions that users are allowed to perform."}},{"n":36,"a":["A","C"],"fr":{"q":"Quels sont deux avantages de déployer son infrastructure Azure à l\u0027aide de modèles ARM ou Bicep plutôt que manuellement via le portail ?","o":["Des déploiements reproductibles et cohérents entre les environnements","La disparition totale du besoin de définir des autorisations RBAC","La possibilité de versionner l\u0027infrastructure dans un système de contrôle de version comme Git","Une réduction garantie et automatique du prix des ressources déployées"],"e":"L\u0027**infrastructure as code** via ARM ou Bicep garantit des déploiements reproductibles et permet de versionner les définitions d\u0027infrastructure, sans effet direct sur les prix ni sur le RBAC."},"en":{"q":"What are two benefits of deploying Azure infrastructure using ARM templates or Bicep rather than manually through the portal?","o":["Repeatable and consistent deployments across environments","Completely eliminating the need to define RBAC permissions","The ability to version the infrastructure in a version control system such as Git","A guaranteed, automatic reduction in the price of deployed resources"],"e":"**Infrastructure as code** with ARM or Bicep ensures repeatable deployments and allows infrastructure definitions to be versioned, with no direct effect on pricing or RBAC."}},{"n":37,"a":["A"],"fr":{"q":"Une entreprise possède des serveurs on-premises et des machines virtuelles chez un autre fournisseur cloud, et souhaite les gérer, leur appliquer des Azure Policy et superviser leur sécurité depuis le portail Azure comme des ressources Azure natives. Quel service permet cette extension de la gouvernance Azure ?","o":["Azure Arc","Azure Resource Manager","Azure Bastion","Azure Front Door"],"e":"**Azure Arc** étend la gestion, les Azure Policy et la supervision Azure à des ressources situées en dehors d\u0027Azure, notamment on-premises ou sur d\u0027autres clouds."},"en":{"q":"A company has on-premises servers and virtual machines hosted with another cloud provider, and wants to manage them, apply Azure Policy to them, and monitor their security from the Azure portal as if they were native Azure resources. Which service enables this extension of Azure governance?","o":["Azure Arc","Azure Resource Manager","Azure Bastion","Azure Front Door"],"e":"**Azure Arc** extends Azure management, Azure Policy, and monitoring to resources located outside Azure, such as on-premises or in other clouds."}},{"n":38,"a":["A"],"fr":{"q":"Une entreprise veut recevoir des recommandations personnalisées pour réduire ses coûts et améliorer la sécurité, la fiabilité et les performances de ses ressources Azure actuelles. Quel service lui fournit ces conseils automatisés ?","o":["Azure Advisor","Azure Service Health","Azure Monitor","Le Service Trust Portal"],"e":"**Azure Advisor** analyse la configuration des ressources déployées et propose des recommandations personnalisées sur le coût, la sécurité, la fiabilité et les performances."},"en":{"q":"A company wants to receive personalized recommendations to reduce its costs and improve the security, reliability, and performance of its current Azure resources. Which service provides this automated guidance?","o":["Azure Advisor","Azure Service Health","Azure Monitor","The Service Trust Portal"],"e":"**Azure Advisor** analyzes the configuration of deployed resources and provides personalized recommendations on cost, security, reliability, and performance."}},{"n":39,"a":["A"],"fr":{"q":"Un administrateur veut savoir si une panne en cours sur un service Azure affecte spécifiquement les ressources de sa propre souscription, et pas seulement l\u0027état général de la plateforme. Quel outil doit-il consulter ?","o":["Azure Service Health","Azure Status (status.azure.com)","Azure Advisor","Le Pricing Calculator"],"e":"**Azure Service Health** fournit un tableau de bord personnalisé des incidents affectant précisément les ressources de l\u0027abonnement, contrairement à Azure Status qui donne un état global public."},"en":{"q":"An administrator wants to know whether an ongoing outage of an Azure service specifically affects the resources in their own subscription, and not just the overall status of the platform. Which tool should they check?","o":["Azure Service Health","Azure Status (status.azure.com)","Azure Advisor","The Pricing Calculator"],"e":"**Azure Service Health** provides a personalized dashboard of incidents that specifically affect the resources in the subscription, unlike Azure Status, which provides a global public status."}},{"n":40,"a":["A"],"fr":{"q":"Une équipe de développement veut collecter en continu les journaux, métriques de performance et traces de requêtes d\u0027une application web afin de diagnostiquer rapidement les ralentissements observés par les utilisateurs. Quelle combinaison de services Azure répond le mieux à ce besoin ?","o":["Azure Monitor avec Application Insights","Azure Policy avec Azure Blueprints","Microsoft Purview avec Azure Arc","Le Service Trust Portal avec Azure Advisor"],"e":"**Azure Monitor**, associé à **Application Insights**, collecte et analyse les journaux, métriques et traces applicatives afin de diagnostiquer les problèmes de performance."},"en":{"q":"A development team wants to continuously collect logs, performance metrics, and request traces from a web application in order to quickly diagnose slowdowns experienced by users. Which combination of Azure services best meets this need?","o":["Azure Monitor with Application Insights","Azure Policy with Azure Blueprints","Microsoft Purview with Azure Arc","The Service Trust Portal with Azure Advisor"],"e":"**Azure Monitor**, combined with **Application Insights**, collects and analyzes logs, metrics, and application traces in order to diagnose performance issues."}}]},{"id":6,"title":{"fr":"Examen blanc 6 — Coûts et tarification","en":"Practice exam 6 — Costs and pricing"},"questions":[{"n":1,"a":["B"],"fr":{"q":"Une PME souhaite arrêter d\u0027acheter des serveurs physiques et payer uniquement l\u0027usage mensuel réel de ses machines virtuelles dans le cloud. Quel modèle économique adopte-t-elle ainsi ?","o":["Le modèle CapEx (dépenses d\u0027investissement)","Le modèle OpEx (dépenses opérationnelles)","Un modèle de licence perpétuelle","Un modèle de dépréciation d\u0027actifs"],"e":"Le cloud permet de remplacer les **dépenses d\u0027investissement (CapEx)** par des **dépenses opérationnelles (OpEx)**, payées selon l\u0027usage réel, sans achat de matériel."},"en":{"q":"A small business wants to stop buying physical servers and pay only for the actual monthly usage of its virtual machines in the cloud. Which financial model is it adopting?","o":["The CapEx (capital expenditure) model","The OpEx (operational expenditure) model","A perpetual licensing model","An asset depreciation model"],"e":"The cloud lets you replace **capital expenditure (CapEx)** with **operational expenditure (OpEx)**, paid based on actual usage, with no hardware purchase."}},{"n":2,"a":["B"],"fr":{"q":"Dans un modèle IaaS, une entreprise héberge des machines virtuelles sur Azure. Qui est responsable de l\u0027application des correctifs du système d\u0027exploitation invité ?","o":["Microsoft, car Azure gère entièrement l\u0027infrastructure","Le client, car il reste propriétaire du système d\u0027exploitation en IaaS","Un partenaire tiers obligatoire","Personne, les correctifs sont automatiques dans tous les cas"],"e":"En **IaaS**, le client conserve la responsabilité du système d\u0027exploitation, dont l\u0027application des correctifs ; Microsoft gère l\u0027infrastructure physique sous-jacente."},"en":{"q":"In an IaaS model, a company hosts virtual machines on Azure. Who is responsible for applying patches to the guest operating system?","o":["Microsoft, because Azure fully manages the infrastructure","The customer, because the customer still owns the operating system in IaaS","A mandatory third-party partner","No one, patches are always applied automatically"],"e":"In **IaaS**, the customer retains responsibility for the operating system, including patching; Microsoft manages the underlying physical infrastructure."}},{"n":3,"a":["C"],"fr":{"q":"Une banque doit conserver les données clients sensibles sur ses propres serveurs pour des raisons réglementaires, tout en utilisant Azure pour absorber les pics de charge de son application web. Quel modèle de déploiement correspond à ce besoin ?","o":["Cloud public","Cloud privé","Cloud hybride","Cloud communautaire"],"e":"Le **cloud hybride** combine une infrastructure sur site pour les données sensibles et le cloud public pour la flexibilité et l\u0027absorption des pics de charge."},"en":{"q":"A bank must keep sensitive customer data on its own servers for regulatory reasons, while using Azure to absorb peak loads on its web application. Which deployment model meets this need?","o":["Public cloud","Private cloud","Hybrid cloud","Community cloud"],"e":"The **hybrid cloud** combines on-premises infrastructure for sensitive data with the public cloud for flexibility and absorbing peak loads."}},{"n":4,"a":["B"],"fr":{"q":"Une entreprise utilise à la fois Azure et un autre fournisseur cloud afin d\u0027éviter de dépendre d\u0027un seul prestataire. Comment appelle-t-on cette stratégie ?","o":["Edge computing","Multicloud","Cloud privé virtuel","Colocation"],"e":"Une stratégie **multicloud** consiste à utiliser plusieurs fournisseurs cloud, notamment pour réduire la dépendance à un seul prestataire."},"en":{"q":"A company uses both Azure and another cloud provider to avoid depending on a single vendor. What is this strategy called?","o":["Edge computing","Multicloud","Virtual private cloud","Colocation"],"e":"A **multicloud** strategy consists of using multiple cloud providers, notably to reduce dependency on a single vendor."}},{"n":5,"a":["B"],"fr":{"q":"Une start-up développe une API qui n\u0027est appelée que quelques minutes par jour. Elle souhaite ne payer que pour le temps d\u0027exécution réel du code, sans gérer ni payer de serveur inactif. Quelle solution correspond le mieux ?","o":["Une machine virtuelle réservée pour un an","Azure Functions en plan de consommation (serverless)","Un cluster AKS dimensionné en permanence","Une instance réservée App Service Premium"],"e":"Le **plan de consommation serverless** d\u0027Azure Functions facture uniquement le temps d\u0027exécution réel, ce qui minimise les coûts pour un usage intermittent."},"en":{"q":"A startup is developing an API that is called only a few minutes per day. It wants to pay only for the actual code execution time, without managing or paying for idle servers. Which solution is the best fit?","o":["A virtual machine reserved for one year","Azure Functions on the Consumption plan (serverless)","A permanently sized AKS cluster","An App Service Premium reserved instance"],"e":"The **serverless Consumption plan** for Azure Functions bills only for actual execution time, which minimizes costs for intermittent usage."}},{"n":6,"a":["C"],"fr":{"q":"Une application repose sur deux services Azure indépendants, chacun garanti à 99,9% de disponibilité par son SLA. Quelle est la disponibilité combinée approximative de l\u0027application si les deux services doivent fonctionner simultanément ?","o":["99,9%","99,99%","Environ 99,8%","100%"],"e":"Lorsque deux services indépendants doivent fonctionner ensemble, leurs SLA se multiplient (0,999 x 0,999 environ 0,998), soit environ **99,8%** de disponibilité combinée."},"en":{"q":"An application relies on two independent Azure services, each guaranteed 99.9% availability by its SLA. What is the approximate composite availability of the application if both services must be running at the same time?","o":["99.9%","99.99%","About 99.8%","100%"],"e":"When two independent services must work together, their SLAs are multiplied (0.999 x 0.999 is about 0.998), giving approximately **99.8%** composite availability."}},{"n":7,"a":["B"],"fr":{"q":"Le trafic du site e-commerce d\u0027une entreprise est très faible la nuit et explose lors des soldes. Elle veut payer moins quand le trafic est faible et ajouter automatiquement des instances pendant les pics. Quelle capacité du cloud utilise-t-elle ?","o":["La redondance géographique","L\u0027élasticité","La tolérance de panne","La virtualisation imbriquée"],"e":"L\u0027**élasticité** permet d\u0027ajouter ou retirer automatiquement des ressources selon la demande, optimisant les coûts en fonction du trafic réel."},"en":{"q":"Traffic to a company\u0027s e-commerce site is very low at night and spikes during sales. The company wants to pay less when traffic is low and automatically add instances during peaks. Which cloud capability is it using?","o":["Geo-redundancy","Elasticity","Fault tolerance","Nested virtualization"],"e":"**Elasticity** lets you automatically add or remove resources based on demand, optimizing costs according to actual traffic."}},{"n":8,"a":["B"],"fr":{"q":"Après analyse, une entreprise constate que ses machines virtuelles sont utilisées à seulement 15% de leur capacité CPU en moyenne. Quelle action réduit directement les coûts sans compromettre la fiabilité du service ?","o":["Ajouter davantage de machines virtuelles identiques","Redimensionner (right-sizing) les machines virtuelles vers une taille inférieure adaptée","Passer toutes les VM en redondance GZRS","Supprimer les sauvegardes"],"e":"Le **redimensionnement (right-sizing)** consiste à adapter la taille des ressources à l\u0027usage réel, réduisant les coûts inutiles liés à la surcapacité."},"en":{"q":"After analysis, a company finds that its virtual machines use only 15% of their CPU capacity on average. Which action directly reduces costs without compromising service reliability?","o":["Add more identical virtual machines","Right-size the virtual machines to an appropriate smaller size","Switch all VMs to GZRS redundancy","Delete the backups"],"e":"**Right-sizing** consists of matching resource size to actual usage, reducing unnecessary costs caused by overprovisioning."}},{"n":9,"a":["B"],"fr":{"q":"Une équipe de développement veut déployer rapidement une application web sans gérer de système d\u0027exploitation, de correctifs ni de serveur sous-jacent, afin de réduire les coûts d\u0027exploitation. Quel modèle de service choisir ?","o":["IaaS","PaaS","SaaS","On-premises"],"e":"Le **PaaS** (Platform as a Service), comme Azure App Service, prend en charge l\u0027infrastructure et le système d\u0027exploitation, réduisant la charge et les coûts de gestion pour les développeurs."},"en":{"q":"A development team wants to quickly deploy a web application without managing an operating system, patches, or underlying servers, in order to reduce operating costs. Which service model should it choose?","o":["IaaS","PaaS","SaaS","On-premises"],"e":"**PaaS** (Platform as a Service), such as Azure App Service, handles the infrastructure and operating system, reducing management overhead and costs for developers."}},{"n":10,"a":["C"],"fr":{"q":"Une entreprise sait qu\u0027elle utilisera un ensemble de machines virtuelles en continu pendant au moins les trois prochaines années. Quelle option tarifaire lui permettrait de réduire le plus ses coûts par rapport au paiement à l\u0027utilisation ?","o":["Les instances Spot","Le paiement à l\u0027utilisation (pay-as-you-go)","Les instances réservées (Reserved Instances)","Le niveau gratuit (Free Tier)"],"e":"Les **instances réservées** offrent une réduction significative du prix en échange d\u0027un engagement d\u0027utilisation sur 1 ou 3 ans, idéal pour des charges prévisibles et continues."},"en":{"q":"A company knows it will run a set of virtual machines continuously for at least the next three years. Which pricing option would reduce its costs the most compared to pay-as-you-go?","o":["Spot instances","Pay-as-you-go","Reserved Instances","The Free Tier"],"e":"**Reserved Instances** offer a significant price discount in exchange for a 1-year or 3-year usage commitment, ideal for predictable, continuous workloads."}},{"n":11,"a":["B","C"],"fr":{"q":"Parmi les principes suivants, lesquels DEUX font partie du modèle de sécurité Confiance Zéro (Zero Trust) ?","o":["Toujours faire confiance par défaut aux utilisateurs internes au réseau de l\u0027entreprise","Vérifier explicitement chaque demande d\u0027accès, quelle que soit son origine","Appliquer le principe du moindre privilège","Désactiver toute authentification multifacteur pour simplifier l\u0027accès"],"e":"Le modèle **Confiance Zéro** repose sur la vérification explicite de chaque accès et l\u0027application du **principe du moindre privilège**, sans jamais faire confiance par défaut."},"en":{"q":"Which TWO of the following principles are part of the Zero Trust security model?","o":["Always trust users inside the corporate network by default","Verify every access request explicitly, regardless of its origin","Apply the principle of least privilege","Disable all multifactor authentication to simplify access"],"e":"The **Zero Trust** model is based on explicitly verifying every access and applying the **principle of least privilege**, never trusting by default."}},{"n":12,"a":["B"],"fr":{"q":"Une entreprise veut déployer une solution de reprise après sinistre avec réplication des données entre deux régions Azure situées dans la même géographie, bénéficiant d\u0027une coordination des mises à jour planifiées par Microsoft. Quel concept Azure utilise-t-elle ?","o":["Une zone de disponibilité unique","Une paire de régions (region pair)","Un groupe de ressources","Un point de terminaison privé"],"e":"Une **paire de régions** associe deux régions Azure d\u0027une même géographie, avec réplication possible et mises à jour planifiées de manière séquentielle pour limiter les risques."},"en":{"q":"A company wants to deploy a disaster recovery solution with data replication between two Azure regions in the same geography, benefiting from planned updates coordinated by Microsoft. Which Azure concept is it using?","o":["A single availability zone","A region pair","A resource group","A private endpoint"],"e":"A **region pair** links two Azure regions within the same geography, with possible replication and planned updates rolled out sequentially to limit risk."}},{"n":13,"a":["A"],"fr":{"q":"Pour protéger son application contre la panne d\u0027un seul datacenter au sein d\u0027une région, tout en gardant une latence très faible, une entreprise répartit ses VM sur plusieurs emplacements physiquement séparés mais proches, au sein de la même région. Que configure-t-elle ?","o":["Des zones de disponibilité","Des régions souveraines","Un réseau virtuel peering","Une passerelle VPN"],"e":"Les **zones de disponibilité** sont des emplacements physiquement distincts au sein d\u0027une même région, protégeant contre les pannes de datacenter avec une faible latence entre elles."},"en":{"q":"To protect its application against the failure of a single datacenter within a region
