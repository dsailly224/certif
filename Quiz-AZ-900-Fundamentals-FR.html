  });
  if($("#resume")) $("#resume").onclick = () => { S = store.session; runQuiz(); };
  if($("#drop")) $("#drop").onclick = () => { store.session = null; save(); home(); };
  if($("#reset")) $("#reset").onclick = () => { if(confirm("Effacer tous les scores et la liste des erreurs ?")){ store.results={}; store.wrong={}; store.session=null; save(); home(); } };
}

/* ---------- Quiz ---------- */
function start(o){
  const ids = o.shQ ? shuffle(o.ids) : o.ids.slice();
  const order = {};
  ids.forEach(id => { const q = qById(id); const ks = q.o.map((_,i)=>i); order[id] = o.shO ? shuffle(ks) : ks; });
  S = { v:META.version, key:o.key, title:o.title, mode:o.mode, ids, order, ans:{}, checked:{}, flags:{}, cur:0,
        limit: o.mode==="exam" ? Math.round(ids.length*85/60)*60 : 0, elapsed:0, finished:false };
  store.session = S; save();
  runQuiz();
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function runQuiz(){
  stopTimer();
  let last = Date.now();
  timerId = setInterval(() => {
    const now = Date.now(); S.elapsed += (now-last)/1000; last = now;
    const t = $("#timer"); if(t) updTimer(t);
    if(S.mode==="exam" && S.elapsed >= S.limit){ alert("⏰ Temps écoulé ! L'examen va être corrigé."); finish(); return; }
    if(Math.round(S.elapsed)%5===0){ store.session = S; save(); }
  }, 1000);
  renderQ();
}
function updTimer(t){
  if(S.mode==="exam"){ const r = S.limit - S.elapsed; t.textContent = "⏱️ " + fmtTime(r); t.classList.toggle("low", r < 300); }
  else t.textContent = "⏱️ " + fmtTime(S.elapsed);
}
function renderQ(){
  const id = S.ids[S.cur], q = qById(id), t = tx(q), ord = S.order[id], good = ansOf(id);
  const sel = S.ans[id] || [], multi = good.length > 1, checked = !!S.checked[id];
  const nAns = Object.keys(S.ans).filter(k=>S.ans[k].length).length;
  let h = `<div class="card"><div class="qhead"><div><b>${esc(S.title)}</b> <span class="mut">· ${S.mode==="exam"?"Mode examen":"Mode entraînement"}</span></div>
  <div class="row"><span class="timer" id="timer"></span><button class="sm" id="quit">✖ Quitter</button></div></div>
  <div class="progress"><div style="width:${(S.cur+1)/S.ids.length*100}%"></div></div>
  <div class="row" style="justify-content:space-between"><span class="mut">Question ${S.cur+1} / ${S.ids.length} · ${nAns} répondue(s)</span>
  <span class="mut">${S.key==="random"||S.key==="wrong"?"Examen "+id.split("-")[0]+", Q"+id.split("-")[1]:""}</span></div>
  <div class="qtext">${inline(t.q)}</div>
  <div class="hint">${multi ? `☑️ Choisissez ${nWord(good.length)} réponses.` : "🔘 Choisissez une seule réponse."}</div><div id="choices">`;
  ord.forEach((oi, pos) => {
    const isSel = sel.includes(oi), isGood = good.includes(keyOf(oi));
    let cls = "choice";
    if(checked){ cls += " locked"; if(isGood) cls += " good"; else if(isSel) cls += " bad"; }
    else if(isSel) cls += " sel";
    h += `<label class="${cls}" data-oi="${oi}"><input type="${multi?"checkbox":"radio"}" name="c" ${isSel?"checked":""} ${checked?"disabled":""}>
      <span class="k">${keyOf(pos)}.</span><span>${inline(t.o[oi])}</span></label>`;
  });
  h += `</div>`;
  if(checked){
    const ok = isCorrect(id);
    const goodLetters = ord.map((oi,pos)=>good.includes(keyOf(oi))?keyOf(pos):null).filter(Boolean).join(", ");
    h += `<div class="fb ${ok?"ok":"ko"}"><b>${ok?"✅ Bonne réponse !":"❌ Mauvaise réponse."}</b> ${ok?"":"Réponse(s) correcte(s) : <b>"+goodLetters+"</b>"}
      ${t.e ? `<div class="expl"><b>Explication :</b>${md(t.e)}</div>` : ""}</div>`;
  }
  h += `<div class="nav"><button id="prev" ${S.cur===0?"disabled":""}>← Précédente</button>
    <div class="row">
      <button class="flagbtn ${S.flags[id]?"on":""}" id="flag" title="Marquer pour revoir (M)">🚩 ${S.flags[id]?"Marquée":"Marquer"}</button>
      ${S.mode==="train" && !checked ? `<button class="pri" id="check" ${sel.length?"":"disabled"}>Valider</button>` : ""}
      ${S.cur < S.ids.length-1 ? `<button class="${S.mode==="exam"||checked?"pri":""}" id="next">Suivante →</button>` : ""}
      <button id="end" class="${S.cur===S.ids.length-1?"pri":""}">🏁 Terminer</button>
    </div></div>
    <div class="kbd" style="margin-top:.6rem">Raccourcis : A–F ou 1–6 pour choisir · Entrée pour valider/suivante · ← → pour naviguer · M pour marquer</div></div>
  <div class="card"><div class="mut" style="margin-bottom:.5rem">Navigation rapide${S.mode==="exam"?" (orange = répondue, point violet = marquée)":""}</div><div class="pal">`;
  S.ids.forEach((qid,i) => {
    let c = "";
    if(S.checked[qid]) c = isCorrect(qid) ? "g" : "r";
    else if((S.ans[qid]||[]).length) c = "ans";
    if(i===S.cur) c += " cur";
    if(S.flags[qid]) c += " fl";
    h += `<button class="${c}" data-go="${i}">${i+1}</button>`;
  });
  h += `</div></div>`;
  app.innerHTML = h;
  updTimer($("#timer"));
  document.querySelectorAll(".choice").forEach(el => el.onclick = ev => { ev.preventDefault(); pick(+el.dataset.oi); });
  $("#prev").onclick = () => go(S.cur-1);
  if($("#next")) $("#next").onclick = () => go(S.cur+1);
  if($("#check")) $("#check").onclick = check;
  $("#flag").onclick = () => { S.flags[id] = !S.flags[id]; persist(); renderQ(); };
  $("#end").onclick = () => {
    const rest = S.ids.length - Object.keys(S.ans).filter(k=>S.ans[k].length).length;
    if(confirm(rest ? `Il reste ${rest} question(s) sans réponse. Terminer et corriger quand même ?` : "Terminer et afficher la correction ?")) finish();
  };
  $("#quit").onclick = () => { persist(); home(); };
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(+b.dataset.go));
}
function persist(){ store.session = S; save(); }
function pick(oi){
  const id = S.ids[S.cur], need = ansOf(id).length;
  if(S.checked[id]) return;
  let sel = (S.ans[id] || []).slice();
  if(need > 1){
    if(sel.includes(oi)) sel = sel.filter(x=>x!==oi);
    else { sel.push(oi); if(sel.length > need) sel.shift(); }
  } else sel = [oi];
  S.ans[id] = sel; persist(); renderQ();
}
function check(){
  const id = S.ids[S.cur];
  if(!(S.ans[id]||[]).length) return;
  S.checked[id] = true;
  trackWrong(id); persist(); renderQ();
}
function go(i){ if(i<0 || i>=S.ids.length) return; S.cur = i; persist(); renderQ(); window.scrollTo(0,0); }
function isCorrect(id){ return same((S.ans[id]||[]).map(keyOf), ansOf(id)); }
function trackWrong(id){ if(isCorrect(id)) delete store.wrong[id]; else store.wrong[id] = 1; }

/* ---------- Résultats ---------- */
function finish(){
  stopTimer();
  S.ids.forEach(id => { if(S.mode==="exam" || S.checked[id] || (S.ans[id]||[]).length) trackWrong(id); });
  const good = S.ids.filter(isCorrect).length, pct = Math.round(good/S.ids.length*100);
  if(/^\d+$/.test(S.key)){
    const r = store.results[S.key] || {best:0,count:0};
    store.results[S.key] = { best:Math.max(r.best,pct), last:pct, count:r.count+1, date:new Date().toISOString() };
  }
  S.finished = true; store.session = null; save();
  results("all");
}
function results(filter){
  const good = S.ids.filter(isCorrect).length, n = S.ids.length, pct = Math.round(good/n*100), pass = pct >= 70;
  const scaled = Math.round(100 + good/n*900);
  let h = `<div class="card" style="text-align:center"><h2 style="margin:0">${esc(S.title)} — Résultat</h2>
    <div class="score ${pass?"ok":"ko"}">${pct} %</div>
    <div><b>${good}</b> / ${n} bonnes réponses · score estimé <b>${scaled}</b>/1000 · durée ${fmtTime(S.elapsed)}</div>
    <p style="font-size:1.2rem">${pass?"🎉 <b>Réussi</b> (seuil : 70 %)":"📚 <b>Non réussi</b> (seuil : 70 %) — continuez à vous entraîner !"}</p>
    <div class="row" style="justify-content:center"><button class="pri" id="again">↻ Recommencer</button>
    ${S.ids.some(id=>!isCorrect(id))?'<button id="retryWrong">🔁 Refaire les questions ratées</button>':""}<button id="back">🏠 Accueil</button></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Correction détaillée</h3>
  <div class="seg" id="flt"><button data-f="all">Toutes (${n})</button><button data-f="ko">Erreurs (${n-good})</button><button data-f="flag">Marquées (${S.ids.filter(id=>S.flags[id]).length})</button></div></div>`;
  S.ids.forEach((id,i) => {
    const ok = isCorrect(id);
    if(filter==="ko" && ok) return;
    if(filter==="flag" && !S.flags[id]) return;
    const q = qById(id), t = tx(q), ord = S.order[id], sel = S.ans[id] || [];
    const fmt = arr => arr.length ? arr.map(oi=>`<b>${keyOf(ord.indexOf(oi))}.</b> ${inline(t.o[oi])}`).join("<br>") : "<i>Aucune réponse</i>";
    const goodOi = ansOf(id).map(idxOf).sort((a,b)=>ord.indexOf(a)-ord.indexOf(b));
    h += `<div class="rv"><div><span class="${ok?"tag-ok":"tag-ko"}">${ok?"✔":"✘"} Q${i+1}</span> ${S.flags[id]?"🚩":""} ${inline(t.q)}</div>
      ${ok?"":`<div class="ans">Votre réponse : <span style="color:var(--ko)">${fmt(sel.slice().sort((a,b)=>ord.indexOf(a)-ord.indexOf(b)))}</span></div>`}
      <div class="ans">Bonne réponse : <span style="color:var(--ok)">${fmt(goodOi)}</span></div>
      ${t.e?`<details class="expl"><summary>Explication</summary>${md(t.e)}</details>`:""}</div>`;
  });
  h += `</div>`;
  app.innerHTML = h; window.scrollTo(0,0);
  document.querySelectorAll("#flt button").forEach(b => { b.classList.toggle("on", b.dataset.f===filter); b.onclick = () => results(b.dataset.f); });
  $("#back").onclick = home;
  $("#again").onclick = () => start({ key:S.key, title:S.title, ids:S.ids, mode:S.mode, shQ:store.shQ, shO:store.shO });
  if($("#retryWrong")) $("#retryWrong").onclick = () => start({ key:"wrong", title:"Questions ratées — "+S.title, ids:S.ids.filter(id=>!isCorrect(id)), mode:S.mode, shQ:false, shO:store.shO });
}

/* ---------- Global ---------- */
document.addEventListener("keydown", e => {
  if(!S || S.finished || e.ctrlKey || e.metaKey || e.altKey || !$("#choices")) return;
  const k = e.key.toUpperCase(), id = S.ids[S.cur], q = qById(id);
  let pos = -1;
  if(/^[A-F]$/.test(k)) pos = k.charCodeAt(0)-65; else if(/^[1-6]$/.test(k)) pos = +k-1;
  if(pos >= 0 && pos < S.order[id].length){ pick(S.order[id][pos]); return; }
  if(k==="M"){ $("#flag").click(); return; }
  if(e.key==="ArrowLeft") go(S.cur-1);
  else if(e.key==="ArrowRight") go(S.cur+1);
  else if(e.key==="Enter"){
    e.preventDefault();
    if(S.mode==="train" && !S.checked[id] && (S.ans[id]||[]).length) check();
    else if(S.cur < S.ids.length-1) go(S.cur+1);
  }
});
function applyTheme(){ const t = store.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); document.documentElement.dataset.theme = t; }
$("#theme").onclick = () => { store.theme = document.documentElement.dataset.theme==="dark" ? "light" : "dark"; save(); applyTheme(); };
$("#home").onclick = () => { if(S && !S.finished) persist(); home(); };
// Après une recompilation (nouveau contenu), toute session en cours est invalidée.
if(store.session && store.session.v!==META.version) store.session = null;
for(const id of Object.keys(store.wrong)) if(!qById(id)) delete store.wrong[id];
save();
applyTheme(); home();
</script>
</body>
</html>
