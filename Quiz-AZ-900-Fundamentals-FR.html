ile automatiquement en modèle ARM","Bicep ne peut déployer que des machines virtuelles","Les modèles ARM sont écrits dans un langage impératif comme un script shell","Bicep et ARM désignent exactement le même format de fichier"],"e":"**Bicep** propose une syntaxe plus concise et lisible que le JSON des **modèles ARM**, tout en étant converti automatiquement en modèle ARM lors du déploiement."},{"n":37,"a":["A"],"q":"Quelle est la différence entre Azure Arc et Azure Resource Manager ?","o":["Azure Arc étend la gestion Azure à des ressources situées en dehors d\u0027Azure, comme des serveurs sur site ou dans d\u0027autres clouds, tandis qu\u0027Azure Resource Manager est le plan de gestion natif des ressources déployées directement dans Azure","Azure Resource Manager ne peut gérer que des ressources situées hors d\u0027Azure","Azure Arc remplace entièrement Azure Resource Manager pour toutes les ressources Azure natives","Les deux services désignent exactement la même fonctionnalité"],"e":"**Azure Arc** permet d\u0027intégrer des ressources externes (serveurs, clusters Kubernetes, autres clouds) sous la gouvernance Azure, en s\u0027appuyant sur **Azure Resource Manager** qui reste le moteur de gestion natif d\u0027Azure."},{"n":38,"a":["A"],"q":"Quelle est la différence entre Azure Advisor et Azure Service Health ?","o":["Azure Advisor fournit des recommandations personnalisées pour optimiser les ressources existantes, tandis qu\u0027Azure Service Health informe sur les incidents et pannes de service Azure affectant l\u0027abonnement du client","Azure Service Health propose des recommandations d\u0027optimisation des coûts pour chaque ressource","Azure Advisor affiche uniquement l\u0027état de santé global des datacenters Microsoft","Les deux services sont parfaitement identiques dans leur fonction"],"e":"**Azure Advisor** analyse la configuration des ressources du client pour proposer des améliorations, tandis qu\u0027**Azure Service Health** communique sur les incidents de service pouvant impacter l\u0027abonnement."},{"n":39,"a":["A"],"q":"Quelle est la différence entre Azure Monitor et Application Insights ?","o":["Azure Monitor est la plateforme globale de collecte et d\u0027analyse de métriques et de journaux pour l\u0027ensemble des ressources, tandis qu\u0027Application Insights en est une fonctionnalité spécialisée dans la supervision des performances des applications","Application Insights supervise uniquement l\u0027état physique des datacenters Microsoft","Azure Monitor ne peut collecter aucune donnée relative aux applications","Les deux services désignent exactement le même périmètre de supervision"],"e":"**Application Insights** est un composant d\u0027**Azure Monitor** dédié à la surveillance applicative (APM), alors qu\u0027Azure Monitor couvre plus largement la supervision de l\u0027infrastructure et des services."},{"n":40,"a":["A"],"q":"Quelle est la différence entre la page Azure Status et Azure Service Health ?","o":["Azure Status affiche l\u0027état général et public de tous les services Azure dans le monde, tandis qu\u0027Azure Service Health propose une vue personnalisée des incidents impactant spécifiquement les ressources de l\u0027abonnement du client","Azure Service Health est une page publique accessible sans authentification à toute personne sur Internet","Azure Status permet de configurer des alertes personnalisées propres à un abonnement","Les deux ressources affichent exactement les mêmes informations personnalisées pour chaque client"],"e":"**Azure Status** est une page publique donnant une vue d\u0027ensemble globale, tandis qu\u0027**Azure Service Health**, accessible depuis le portail, personnalise les informations selon les ressources réellement utilisées par l\u0027abonnement."}]},{"id":4,"title":"Examen blanc 4 — Chiffres et limites","questions":[{"n":1,"a":["C"],"q":"Pour un service Azure garantissant un SLA de 99,9 %, quelle est environ la durée d\u0027indisponibilité tolérée par mois ?","o":["4,4 minutes","21,9 minutes","43,8 minutes","4 heures et 23 minutes"],"e":"Un **SLA de 99,9 %** autorise environ 0,1 % d\u0027indisponibilité par mois, soit approximativement 43,8 minutes sur un mois moyen de 30,44 jours."},{"n":2,"a":["B"],"q":"Pour un service Azure garantissant un SLA de 99,95 %, quelle est environ la durée d\u0027indisponibilité tolérée par mois ?","o":["43,8 minutes","21,9 minutes","4,4 minutes","2,2 minutes"],"e":"Un **SLA de 99,95 %** correspond à environ 0,05 % d\u0027indisponibilité mensuelle, soit près de 21,9 minutes par mois."},{"n":3,"a":["C"],"q":"Pour un service Azure garantissant un SLA de 99,99 %, quelle est environ la durée d\u0027indisponibilité tolérée par mois ?","o":["43,8 minutes","21,9 minutes","4,4 minutes","26 secondes"],"e":"Un **SLA de 99,99 %** ne tolère qu\u0027environ 0,01 % d\u0027indisponibilité par mois, soit environ 4,4 minutes."},{"n":4,"a":["A"],"q":"Deux services Azure dépendants l\u0027un de l\u0027autre (chaînés) affichent chacun un SLA individuel de 99,9 %. Quelle est approximativement la disponibilité composite de l\u0027ensemble ?","o":["99,8 %","99,9 %","99,95 %","100 %"],"e":"Pour des composants dépendants en série, les disponibilités se multiplient : 0,999 x 0,999 est environ égal à 0,998, soit une **disponibilité composite d\u0027environ 99,8 %**, inférieure à celle de chaque composant pris isolément."},{"n":5,"a":["B"],"q":"Quel crédit financier est accordé lors de la création d\u0027un compte Azure gratuit, et pendant combien de temps peut-il être utilisé ?","o":["100 USD pendant 30 jours","200 USD pendant 30 jours","200 USD pendant 12 mois","300 USD pendant 90 jours"],"e":"Le compte Azure gratuit inclut un **crédit de 200 USD utilisable pendant les 30 premiers jours**, en plus de services gratuits pendant 12 mois et de services toujours gratuits."},{"n":6,"a":["C"],"q":"En plus des services toujours gratuits, pendant combien de mois un compte Azure gratuit donne-t-il accès sans frais à une sélection de services populaires ?","o":["3 mois","6 mois","12 mois","24 mois"],"e":"Le compte Azure gratuit offre un accès sans frais à certains services populaires pendant **12 mois**, en complément du crédit initial et des services toujours gratuits."},{"n":7,"a":["C"],"q":"Quel pourcentage d\u0027économie maximal Microsoft annonce-t-il pour les instances réservées de machines virtuelles (Reserved VM Instances) sur un engagement de 3 ans, comparé au tarif de paiement à l\u0027usage ?","o":["20 %","40 %","72 %","90 %"],"e":"Microsoft annonce des économies pouvant atteindre **jusqu\u0027à 72 %** par rapport au tarif pay-as-you-go pour un engagement de 3 ans sur les instances réservées."},{"n":8,"a":["B"],"q":"Quel terme désigne le modèle de dépense dans lequel une organisation paie les services cloud au fur et à mesure de leur consommation, sans investissement matériel initial ?","o":["CapEx (dépense d\u0027investissement)","OpEx (dépense opérationnelle)","Amortissement linéaire","Provisionnement anticipé"],"e":"Le cloud computing bascule les dépenses d\u0027investissement (**CapEx**) vers des dépenses opérationnelles (**OpEx**), payées selon la consommation réelle."},{"n":9,"a":["B"],"q":"Quel est le nombre minimal d\u0027instances identiques d\u0027une même charge de travail qu\u0027il faut déployer pour éliminer un point unique de défaillance (single point of failure) ?","o":["1","2","3","5"],"e":"Avec une seule instance, toute panne arrête le service. Déployer au moins **2 instances** redondantes permet d\u0027éliminer le point unique de défaillance."},{"n":10,"a":["B"],"q":"Quelle caractéristique du cloud permet d\u0027ajouter ET de retirer automatiquement des ressources en fonction de la charge réelle, sans intervention manuelle ?","o":["La scalabilité verticale","L\u0027élasticité","La haute disponibilité","La tolérance de panne"],"e":"L\u0027**élasticité** désigne la capacité d\u0027un système à ajuster automatiquement ses ressources, à la hausse comme à la baisse, selon la demande réelle."},{"n":11,"a":["A","C"],"q":"Microsoft présente six avantages fondamentaux du cloud computing. Parmi les propositions suivantes, lesquelles en font réellement partie ?","o":["La haute disponibilité","La confidentialité absolue garantie","L\u0027agilité","La gratuité totale des services"],"e":"Parmi les six avantages cités par Microsoft figurent la **haute disponibilité** et l\u0027**agilité**, aux côtés de la scalabilité, l\u0027élasticité, la tolérance de panne et la reprise après sinistre."},{"n":12,"a":["C"],"q":"Dans une région Azure qui prend en charge les zones de disponibilité, quel est le nombre minimal de zones physiquement séparées garanti ?","o":["2","3","4","5"],"e":"Une région Azure compatible avec les zones de disponibilité comporte au minimum **3 zones** physiquement distinctes, chacune avec ses propres alimentation, refroidissement et réseau."},{"n":13,"a":["B"],"q":"Lorsque la géographie le permet, quelle distance minimale Microsoft vise-t-il à respecter entre les deux régions formant une paire régionale Azure ?","o":["100 miles (environ 160 km)","300 miles (environ 480 km)","500 miles (environ 800 km)","1 000 miles (environ 1 600 km)"],"e":"Microsoft cherche à séparer les régions d\u0027une paire d\u0027au moins **300 miles (environ 480 km)** lorsque c\u0027est géographiquement possible, afin de limiter le risque qu\u0027un même sinistre affecte les deux régions."},{"n":14,"a":["B"],"q":"En excluant le niveau racine et le niveau des abonnements, quelle est la profondeur maximale (en nombre de niveaux) d\u0027une hiérarchie de groupes d\u0027administration (management groups) Azure ?","o":["4 niveaux","6 niveaux","8 niveaux","10 niveaux"],"e":"Une hiérarchie de groupes d\u0027administration peut compter jusqu\u0027à **6 niveaux de profondeur**, sans compter le niveau racine ni le niveau des abonnements."},{"n":15,"a":["C"],"q":"Quel est le nombre maximal de groupes d\u0027administration (management groups) pouvant exister dans un même annuaire (tenant) Microsoft Entra ID ?","o":["1 000","5 000","10 000","100 000"],"e":"Un même annuaire Microsoft Entra ID peut contenir jusqu\u0027à **10 000 groupes d\u0027administration**."},{"n":16,"a":["C"],"q":"En utilisant une image issue de la Place de marché Azure, combien d\u0027instances de machines virtuelles un même groupe identique de machines virtuelles (VM Scale Set) peut-il contenir au maximum ?","o":["100 instances","600 instances","1 000 instances","Un nombre illimité"],"e":"Un VM Scale Set basé sur une image de plateforme (Marketplace) peut contenir jusqu\u0027à **1 000 instances** de VM, contre 600 avec une image personnalisée."},{"n":17,"a":["B"],"q":"Combien de domaines de panne (fault domains) au maximum un groupe à disponibilité (availability set) Azure peut-il utiliser ?","o":["2","3","5","20"],"e":"Un groupe à disponibilité Azure peut être configuré avec jusqu\u0027à **3 domaines de panne**, correspondant à des racks physiques distincts."},{"n":18,"a":["C"],"q":"Combien de domaines de mise à jour (update domains) au maximum un groupe à disponibilité Azure peut-il comporter ?","o":["3","5","20","50"],"e":"Un groupe à disponibilité Azure peut comporter jusqu\u0027à **20 domaines de mise à jour**, afin de limiter l\u0027impact des maintenances planifiées."},{"n":19,"a":["B"],"q":"Avec l\u0027option de redondance LRS (stockage localement redondant) d\u0027Azure Storage, combien de copies synchrones des données sont conservées, et où ?","o":["2 copies, réparties sur 2 datacenters","3 copies, au sein d\u0027un seul datacenter","3 copies, réparties sur 2 régions","6 copies, réparties sur 2 régions"],"e":"La redondance **LRS** conserve 3 copies synchrones des données, mais toutes au sein d\u0027un seul datacenter d\u0027une même région."},{"n":20,"a":["C"],"q":"Avec l\u0027option de redondance GRS (stockage géo-redondant) d\u0027Azure Storage, combien de copies totales des données sont conservées entre la région principale et la région secondaire ?","o":["3 copies","4 copies","6 copies","9 copies"],"e":"La redondance **GRS** combine 3 copies locales dans la région principale et 3 copies dans la région secondaire, soit **6 copies** au total."},{"n":21,"a":["C","D"],"q":"Parmi les options de redondance suivantes d\u0027Azure Storage, lesquelles offrent une durabilité annuelle d\u0027au moins 16 neuf (99,99999999999999 %) pour les objets stockés ?","o":["LRS","ZRS","GRS","RA-GRS"],"e":"**GRS** et **RA-GRS**, qui répliquent les données dans une région secondaire distante, offrent une durabilité d\u0027au moins 16 neuf, contre 11 neuf pour LRS et ZRS qui ne protègent que contre une perte locale."},{"n":22,"a":["B"],"q":"Quelle est la durée minimale de stockage recommandée pour le niveau d\u0027accès Cool (froid) d\u0027Azure Blob Storage avant qu\u0027une suppression ou un changement de niveau n\u0027entraîne des frais de suppression anticipée ?","o":["7 jours","30 jours","90 jours","180 jours"],"e":"Le niveau **Cool** impose une durée minimale de conservation de **30 jours** ; toute suppression avant ce délai entraîne des frais proportionnels aux jours restants."},{"n":23,"a":["C"],"q":"Quelle est la durée minimale de conservation pour le niveau Archive d\u0027Azure Blob Storage avant qu\u0027une suppression anticipée n\u0027entraîne des frais ?","o":["30 jours","90 jours","180 jours","365 jours"],"e":"Le niveau **Archive** impose une durée minimale de conservation de **180 jours** avant toute suppression sans pénalité."},{"n":24,"a":["B"],"q":"Lors de la réhydratation d\u0027un blob archivé avec la priorité Standard, combien de temps cette opération peut-elle prendre au maximum ?","o":["Moins d\u00271 heure","Jusqu\u0027à 15 heures","Jusqu\u0027à 48 heures","Jusqu\u0027à 7 jours"],"e":"Une réhydratation en priorité **Standard** peut prendre jusqu\u0027à **15 heures**, alors que la priorité High peut aboutir en moins d\u0027une heure pour de petits objets."},{"n":25,"a":["C"],"q":"Quelle est la bande passante maximale disponible pour un circuit Azure ExpressRoute (via ExpressRoute Direct) ?","o":["10 Gbps","40 Gbps","100 Gbps","400 Gbps"],"e":"Un circuit **ExpressRoute** peut atteindre jusqu\u0027à **100 Gbps** de bande passante via ExpressRoute Direct."},{"n":26,"a":["A","B"],"q":"Parmi les affirmations suivantes concernant les sous-réseaux (subnets) d\u0027un réseau virtuel Azure, lesquelles sont correctes ?","o":["Azure réserve 5 adresses IP dans chaque sous-réseau","Le plus petit sous-réseau pris en charge est un /29","Un même sous-réseau peut appartenir simultanément à plusieurs réseaux virtuels","Azure ne réserve aucune adresse IP dans les sous-réseaux"],"e":"Azure réserve systématiquement **5 adresses IP** par sous-réseau (adresse réseau, passerelle, deux adresses DNS et broadcast), et le plus petit sous-réseau pris en charge est un **/29**."},{"n":27,"a":["C"],"q":"Combien de rôles Azure RBAC dits « fondamentaux » (Owner, Contributor, Reader, User Access Administrator) sont intégrés nativement dans Azure ?","o":["2","3","4","5"],"e":"Azure propose **4 rôles RBAC fondamentaux** intégrés : Propriétaire, Contributeur, Lecteur et Administrateur des accès utilisateurs."},{"n":28,"a":["C"],"q":"Quel est le nombre maximal de balises (tags) pouvant être appliquées à une même ressource, un même groupe de ressources ou un même abonnement Azure ?","o":["15","32","50","100"],"e":"Azure limite à **50** le nombre de balises applicables à une ressource, un groupe de ressources ou un abonnement."},{"n":29,"a":["B"],"q":"Combien de types de verrous de ressources (resource locks) Azure propose-t-il ?","o":["1","2","3","4"],"e":"Azure propose exactement **2 types de verrous** : CanNotDelete (empêche la suppression) et ReadOnly (empêche toute modification)."},{"n":30,"a":["C"],"q":"Combien de catégories de recommandations Azure Advisor évalue-t-il actuellement ?","o":["3","4","5","6"],"e":"Azure Advisor évalue aujourd\u0027hui **5 catégories** : coût, sécurité, fiabilité, excellence opérationnelle et performance."},{"n":31,"a":["C"],"q":"Au-delà de la durée de conservation par défaut de 30 jours, jusqu\u0027à combien de jours peut-on étendre la rétention des données d\u0027un espace de travail Log Analytics ?","o":["90 jours","365 jours","730 jours","1 095 jours"],"e":"La rétention des données d\u0027un espace de travail **Log Analytics** peut être configurée jusqu\u0027à **730 jours** (soit 2 ans), au-delà des 30 jours appliqués par défaut."},{"n":32,"a":["B"],"q":"Combien de modes de déploiement un modèle ARM (Azure Resource Manager) propose-t-il pour traiter les ressources déjà présentes dans un groupe de ressources mais absentes du modèle ?","o":["1 mode","2 modes","3 modes","4 modes"],"e":"Un déploiement ARM propose **2 modes** : Incrémentiel (par défaut, conserve les ressources non listées) et Complet (supprime les ressources absentes du modèle)."},{"n":33,"a":["B"],"q":"Combien d\u0027options de périodicité (« time grain ») propose-t-on lors de la création d\u0027un budget dans Microsoft Cost Management ?","o":["2 (mensuel, annuel)","3 (mensuel, trimestriel, annuel)","4 (quotidien, mensuel, trimestriel, annuel)","5"],"e":"Microsoft Cost Management propose **3 granularités** pour un budget : mensuelle, trimestrielle et annuelle ; aucune option quotidienne n\u0027est disponible."},{"n":34,"a":["B"],"q":"À combien de groupes de ressources (resource groups) une même ressource Azure peut-elle appartenir simultanément ?","o":["0, elle reste isolée","1 seul","2 maximum","Autant que nécessaire"],"e":"Une ressource Azure ne peut appartenir qu\u0027à **un seul groupe de ressources** à la fois, même si elle peut être déplacée vers un autre groupe."},{"n":35,"a":["B"],"q":"Par défaut, sous quel niveau de la hiérarchie de gouvernance un nouvel abonnement Azure est-il automatiquement placé si aucun groupe d\u0027administration spécifique n\u0027est désigné ?","o":["Il reste isolé, hors de toute hiérarchie","Le groupe d\u0027administration racine (Tenant Root Group)","Un groupe nommé « Production » créé automatiquement","Le niveau d\u0027un groupe de ressources par défaut"],"e":"Tout nouvel abonnement est automatiquement rattaché au **groupe d\u0027administration racine** (Tenant Root Group) tant qu\u0027il n\u0027est pas déplacé ailleurs."},{"n":36,"a":["B"],"q":"Quelle est la principale différence entre Azure RBAC et Azure Policy ?","o":["Azure Policy détermine qui peut effectuer une action, Azure RBAC vérifie la conformité des ressources","Azure RBAC détermine qui peut effectuer une action sur une ressource, Azure Policy évalue et impose la conformité des propriétés des ressources","Les deux services remplissent exactement la même fonction","Azure Policy remplace entièrement Azure RBAC depuis 2023"],"e":"**Azure RBAC** gère les autorisations d\u0027accès (qui peut faire quoi), tandis qu\u0027**Azure Policy** contrôle et impose des règles sur les propriétés et la conformité des ressources, indépendamment des permissions d\u0027accès."},{"n":37,"a":["B"],"q":"À quoi sert principalement le Service Trust Portal de Microsoft ?","o":["Gérer les abonnements et la facturation Azure","Fournir des rapports d\u0027audit, de conformité et de certification sur les services Microsoft","Surveiller les performances des machines virtuelles en temps réel","Configurer les règles de pare-feu d\u0027un réseau virtuel"],"e":"Le **Service Trust Portal** met à disposition des rapports d\u0027audit, des certifications de conformité et des informations sur la sécurité et la confidentialité des services Microsoft."},{"n":38,"a":["B"],"q":"Que permet principalement de faire la calculatrice TCO (Total Cost of Ownership) d\u0027Azure ?","o":["Estimer le coût mensuel futur d\u0027une nouvelle charge de travail conçue nativement pour Azure","Comparer le coût estimé d\u0027une infrastructure on-premises existante avec son équivalent hébergé dans Azure","Calculer automatiquement l\u0027empreinte carbone d\u0027un datacenter Azure","Définir les quotas de rôles RBAC pour un abonnement"],"e":"La **calculatrice TCO** compare le coût total d\u0027une infrastructure sur site existante à celui d\u0027une solution équivalente migrée vers Azure, contrairement à la calculatrice de prix qui estime le coût de nouveaux services Azure."},{"n":39,"a":["B"],"q":"Quel est le rôle principal d\u0027Azure Arc ?","o":["Fournir un tunnel VPN chiffré entre deux réseaux virtuels Azure","Étendre la gestion et la gouvernance Azure (Policy, RBAC, surveillance) à des ressources hébergées hors d\u0027Azure, sur site ou dans d\u0027autres clouds","Remplacer complètement Azure Resource Manager","Héberger nativement des clusters Kubernetes managés"],"e":"**Azure Arc** étend les outils de gestion et de gouvernance Azure (comme Azure Policy et le RBAC) à des serveurs, clusters Kubernetes et services situés en dehors d\u0027Azure, y compris sur site ou dans d\u0027autres clouds."},{"n":40,"a":["A","C"],"q":"Azure Advisor répartit ses recommandations en cinq catégories. Parmi les propositions suivantes, lesquelles correspondent réellement à une catégorie d\u0027Azure Advisor ?","o":["Sécurité","Conformité RGPD","Excellence opérationnelle","Support client 24/7"],"e":"Les cinq catégories réelles d\u0027Azure Advisor sont coût, **sécurité**, fiabilité, **excellence opérationnelle** et performance ; la conformité RGPD et le support client n\u0027en font pas partie."}]},{"id":5,"title":"Examen blanc 5 — Gouvernance et sécurité appliquées","questions":[{"n":1,"a":["A"],"q":"Une startup souhaite pouvoir provisionner elle-même de nouvelles machines virtuelles via un portail web, sans contacter un technicien ni signer un nouveau contrat. Quelle caractéristique fondamentale du cloud computing correspond le mieux à ce besoin ?","o":["Le libre-service à la demande","La tarification à l\u0027usage","La redondance géographique","La virtualisation imbriquée"],"e":"Le **libre-service à la demande** permet aux utilisateurs de provisionner eux-mêmes des ressources informatiques, sans intervention humaine du fournisseur."},{"n":2,"a":["A"],"q":"Une entreprise héberge ses applications métier sur Azure tout en utilisant un service d\u0027intelligence artificielle spécifique proposé par un autre fournisseur cloud. Comment qualifie-t-on cette stratégie ?","o":["Une approche multicloud","Une approche hybride","Une stratégie de reprise après sinistre","Une stratégie de colocation"],"e":"Utiliser simultanément des services de plusieurs fournisseurs cloud différents est appelé **approche multicloud**."},{"n":3,"a":["A"],"q":"Pour des raisons réglementaires, une banque doit conserver certaines données sensibles sur ses propres serveurs tout en modernisant ses applications non critiques dans Azure. Quel modèle de déploiement répond à cette contrainte de gouvernance ?","o":["Le cloud hybride","Le cloud public pur","Le cloud privé pur","Le cloud communautaire"],"e":"Le **cloud hybride** combine des ressources on-premises et des ressources cloud public, permettant de respecter des contraintes de résidence des données."},{"n":4,"a":["A"],"q":"Une PME ne souhaite plus acheter de serveurs physiques et préfère payer un abonnement mensuel en fonction de son utilisation réelle des ressources. Quel changement de modèle financier cela représente-t-il ?","o":["Un passage du CapEx vers l\u0027OpEx","Un passage de l\u0027OpEx vers le CapEx","Une augmentation des dépenses d\u0027investissement","Une suppression totale des coûts informatiques"],"e":"Payer pour la consommation réelle sans acheter de matériel correspond à des dépenses opérationnelles (**OpEx**) plutôt qu\u0027à des dépenses d\u0027investissement (CapEx)."},{"n":5,"a":["A"],"q":"Une entreprise constate que sa facture Azure varie chaque mois selon le nombre d\u0027heures de calcul réellement consommées par ses machines virtuelles. Quel modèle de tarification illustre cette situation ?","o":["La tarification à la consommation (pay-as-you-go)","Les instances réservées sur trois ans","La licence perpétuelle","Le forfait fixe annuel non révisable"],"e":"Le modèle **pay-as-you-go** facture les ressources selon leur utilisation réelle, ce qui fait varier la facture mensuelle."},{"n":6,"a":["A"],"q":"Une équipe veut exécuter un petit traitement déclenché par l\u0027arrivée d\u0027un fichier, sans gérer ni dimensionner le moindre serveur, en ne payant que pendant les quelques secondes d\u0027exécution. Quel concept du cloud correspond à ce besoin ?","o":["L\u0027informatique sans serveur (serverless)","L\u0027hébergement sur machine virtuelle dédiée","La haute disponibilité","Le groupe à haute disponibilité"],"e":"Le modèle **serverless** exécute du code à la demande sans gestion d\u0027infrastructure, avec une facturation basée sur le temps d\u0027exécution réel."},{"n":7,"a":["A"],"q":"Une application critique dépend de deux services Azure distincts, chacun garanti à 99,9 % de disponibilité selon son contrat SLA. En combinant ces deux services dans un même flux, quelle est la disponibilité composite approximative de la solution globale ?","o":["Environ 99,8 %","Exactement 99,9 %","Environ 99,99 %","100 %"],"e":"Lorsque deux services dépendants sont combinés, leurs SLA se multiplient (0,999 x 0,999 ≈ 0,998), ce qui abaisse légèrement la disponibilité composite."},{"n":8,"a":["A"],"q":"Un site d\u0027e-commerce voit son trafic multiplié par dix pendant les soldes puis revenir à la normale quelques jours plus tard, avec un ajustement automatique des ressources à chaque étape. Quelle propriété du cloud est principalement illustrée ici ?","o":["L\u0027élasticité","La scalabilité verticale uniquement","La redondance géographique","La tolérance de panne"],"e":"L\u0027**élasticité** désigne la capacité à augmenter puis réduire automatiquement les ressources selon la demande réelle, contrairement à la scalabilité qui se limite à ajouter des ressources."},{"n":9,"a":["A"],"q":"Une entreprise choisit Azure notamment parce qu\u0027elle peut estimer à l\u0027avance le temps de reprise après un incident et compter sur des performances constantes dans la durée. Quels concepts du cloud décrit-elle ?","o":["La fiabilité et la prévisibilité","La scalabilité et l\u0027élasticité","Le CapEx et l\u0027OpEx","Le IaaS et le PaaS"],"e":"La **fiabilité** concerne la capacité à se rétablir après une panne, tandis que la **prévisibilité** concerne la cohérence des performances et des coûts dans le temps."},{"n":10,"a":["A"],"q":"Dans un contrat SaaS comme Microsoft 365, qui demeure toujours responsable de la sécurité physique des datacenters et de l\u0027infrastructure réseau sous-jacente ?","o":["Le fournisseur cloud (Microsoft)","Le client final uniquement","Un prestataire tiers indépendant","Personne, cette responsabilité disparaît en SaaS"],"e":"Dans le **modèle de responsabilité partagée**, le fournisseur cloud conserve toujours la responsabilité de l\u0027infrastructure physique, quel que soit le modèle de service."},{"n":11,"a":["A","C"],"q":"Quels sont deux avantages typiques du passage à un modèle de dépenses opérationnelles (OpEx) basé sur la consommation cloud ?","o":["La possibilité d\u0027ajuster les coûts à la hausse ou à la baisse selon les besoins réels","La suppression totale de toute facturation future","L\u0027absence d\u0027investissement initial important en matériel","La garantie que les coûts resteront identiques chaque mois"],"e":"Le modèle **OpEx** permet de payer uniquement ce qui est consommé, en ajustant les coûts selon l\u0027usage et en évitant un investissement initial lourd."},{"n":12,"a":["A"],"q":"Pour garantir la reprise après sinistre de son application, une entreprise réplique ses données vers une seconde région Azure associée à sa région principale par Microsoft. Comment appelle-t-on ce mécanisme de jumelage entre deux régions ?","o":["Les paires de régions (region pairs)","Les zones de disponibilité","Les groupes à haute disponibilité","Le peering de réseaux virtuels"],"e":"Chaque région Azure est associée à une région jumelle au sein de la même géographie, formant une **paire de régions** utilisée notamment pour la reprise après sinistre."},{"n":13,"a":["A"],"q":"Une entreprise veut protéger son application contre la panne d\u0027un seul datacenter, tout en restant dans la même région Azure pour conserver une faible latence. Quelle fonctionnalité doit-elle utiliser ?","o":["Les zones de disponibilité","Les paires de régions","Le Traffic Manager mondial","Un groupe de ressources unique"],"e":"Les **zones de disponibilité** regroupent des datacenters physiquement séparés au sein d\u0027une même région, protégeant contre les pannes locales d\u0027infrastructure."},{"n":14,"a":["A"],"q":"Un groupe possède douze souscriptions Azure réparties entre plusieurs filiales et souhaite appliquer la même politique de sécurité et le même contrôle d\u0027accès à l\u0027ensemble d\u0027entre elles en une seule opération. Quel niveau de la hiérarchie Azure doit-il utiliser ?","o":["Un groupe d\u0027administration (management group)","Un groupe de ressources (resource group)","Un tag de souscription","Une zone de disponibilité"],"e":"Les **groupes d\u0027administration** regroupent plusieurs souscriptions afin d\u0027appliquer de manière cohérente des stratégies, du RBAC ou des Azure Policy."},{"n":15,"a":["A"],"q":"Un site web doit automatiquement augmenter le nombre de machines virtuelles identiques lors des pics de trafic, puis les réduire ensuite, sans intervention manuelle. Quel service Azure est conçu pour cela ?","o":["Azure Virtual Machine Scale Sets","Azure Container Instances","Azure Resource Manager","Azure Bastion"],"e":"Les **Virtual Machine Scale Sets** créent et gèrent un groupe de machines virtuelles identiques dont le nombre s\u0027ajuste automatiquement selon la charge."},{"n":16,"a":["A"],"q":"Une équipe de développement veut héberger une application web sans avoir à gérer elle-même le système d\u0027exploitation, les correctifs ou le serveur web sous-jacent. Quel service Azure correspond le mieux à ce besoin ?","o":["Azure App Service","Azure Virtual Machines","Azure Virtual Desktop","Azure ExpressRoute"],"e":"**Azure App Service** est un service PaaS entièrement managé pour héberger des applications web, l\u0027infrastructure étant gérée par Microsoft."},{"n":17,"a":["A"],"q":"Une entreprise exploite plusieurs dizaines de microservices conteneurisés et a besoin d\u0027un orchestrateur complet pour gérer leur déploiement, leur montée en charge et leur disponibilité. Quel service Azure est le plus adapté ?","o":["Azure Kubernetes Service (AKS)","Azure Container Instances","Azure Functions","Azure Virtual Desktop"],"e":"**AKS** fournit un service Kubernetes managé pour orchestrer un grand nombre de conteneurs à l\u0027échelle, contrairement à Azure Container Instances conçu pour des scénarios plus simples."},{"n":18,"a":["A"],"q":"Une entreprise veut exécuter un petit script déclenché uniquement par un événement précis, par exemple l\u0027ajout d\u0027un fichier, et ne payer que pour les quelques millisecondes d\u0027exécution effective. Quel service Azure correspond à ce besoin ?","o":["Azure Functions","Azure Virtual Machines","Azure Kubernetes Service","Azure ExpressRoute"],"e":"**Azure Functions** est un service de calcul serverless événementiel facturé à l\u0027exécution, sans infrastructure à gérer."},{"n":19,"a":["A"],"q":"Une entreprise financière souhaite relier son datacenter local à Azure via une connexion privée dédiée, sans transiter par l\u0027internet public, afin de garantir une latence stable et une meilleure confidentialité. Quel service doit-elle choisir ?","o":["Azure ExpressRoute","Un VPN Gateway classique sur internet","Le peering de réseaux virtuels","Azure Front Door"],"e":"**ExpressRoute** établit une connexion privée dédiée entre un réseau on-premises et Azure, en dehors de l\u0027internet public."},{"n":20,"a":["A"],"q":"Une entreprise veut qu\u0027un compte de stockage Azure ne soit accessible que depuis son réseau virtuel privé, et jamais directement depuis l\u0027internet public, même si un attaquant connaît la clé d\u0027accès. Quelle fonctionnalité réseau permet d\u0027atteindre cet objectif ?","o":["Un point de terminaison privé (private endpoint)","Un point de terminaison public avec pare-feu désactivé","Un peering de réseaux virtuels","Une zone de disponibilité"],"e":"Un **private endpoint** attribue une adresse IP privée du réseau virtuel au service PaaS, supprimant son exposition sur l\u0027internet public."},{"n":21,"a":["A"],"q":"Une entreprise veut que ses données de stockage Azure restent disponibles même en cas de panne totale de la région principale, en les répliquant automatiquement vers une région secondaire distante. Quelle option de redondance doit-elle choisir ?","o":["Le stockage géo-redondant (GRS)","Le stockage localement redondant (LRS)","Le stockage à zone unique","Le niveau d\u0027accès archive"],"e":"Le **GRS** réplique les données vers une région secondaire éloignée, protégeant contre une panne régionale complète, contrairement au LRS."},{"n":22,"a":["A"],"q":"Une entreprise veut centraliser la gestion des identités de ses employés afin qu\u0027ils utilisent un compte unique pour se connecter à Microsoft 365, à des applications SaaS tierces et à ses applications internes. Quel service Azure répond à ce besoin ?","o":["Microsoft Entra ID","Azure Key Vault","Azure Policy","Azure Resource Manager"],"e":"**Microsoft Entra ID** est le service de gestion des identités et des accès permettant une authentification unique sur de multiples applications."},{"n":23,"a":["A"],"q":"Un consultant externe doit uniquement pouvoir consulter les ressources d\u0027un seul groupe de ressources, sans pouvoir les modifier ni accéder aux autres groupes de ressources de la souscription. Quelle solution permet d\u0027appliquer précisément cette restriction ?","o":["Attribuer le rôle intégré Lecteur via Azure RBAC, limité à ce groupe de ressources","Donner le rôle Propriétaire sur toute la souscription","Créer une Azure Policy interdisant toute modification","Appliquer un verrou ReadOnly sur la souscription entière"],"e":"**Azure RBAC** permet d\u0027attribuer un rôle précis, comme Lecteur, à une portée précise telle qu\u0027un groupe de ressources, respectant le principe du moindre privilège."},{"n":24,"a":["A"],"q":"Une entreprise veut exiger une authentification multifacteur uniquement lorsqu\u0027un employé se connecte depuis un pays inhabituel ou un appareil non reconnu, tout en laissant une connexion simple depuis le réseau du bureau. Quelle fonctionnalité Microsoft Entra permet ce contrôle contextuel ?","o":["L\u0027accès conditionnel (Conditional Access)","Le verrouillage de compte automatique","Azure Policy","Le chiffrement au repos"],"e":"L\u0027**accès conditionnel** applique des règles basées sur le contexte (localisation, appareil, risque) pour déclencher des contrôles supplémentaires comme le MFA."},{"n":25,"a":["A","C"],"q":"Quelles sont deux méthodes d\u0027authentification sans mot de passe prises en charge par Microsoft Entra ID ?","o":["Windows Hello Entreprise","Un mot de passe renouvelé automatiquement chaque mois","Une clé de sécurité FIDO2","Une question secrète personnelle"],"e":"**Windows Hello Entreprise** et les **clés de sécurité FIDO2** permettent de s\u0027authentifier sans saisir de mot de passe, réduisant les risques liés au vol d\u0027identifiants."},{"n":26,"a":["A","C"],"q":"Quels sont deux principes fondamentaux du modèle de sécurité Confiance Zéro (Zero Trust) ?","o":["Vérifier explicitement chaque demande d\u0027accès, quelle que soit son origine","Faire confiance par défaut à tout appareil connecté au réseau interne de l\u0027entreprise","Partir du principe qu\u0027une violation a pu déjà se produire (assume breach)","Accorder un accès permanent après une première authentification réussie"],"e":"Le modèle **Confiance Zéro** repose notamment sur la vérification explicite de chaque requête et sur l\u0027hypothèse qu\u0027une compromission a pu déjà avoir lieu."},{"n":27,"a":["A"],"q":"Une entreprise veut obtenir un score de sécurité global ainsi que des recommandations priorisées pour corriger les mauvaises configurations de ses ressources Azure et de ses serveurs hybrides. Quel service doit-elle utiliser ?","o":["Microsoft Defender for Cloud","Azure Advisor pour les coûts uniquement","Azure Monitor","Microsoft Purview"],"e":"**Microsoft Defender for Cloud** évalue la posture de sécurité des ressources cloud et hybrides et fournit un score de sécurité avec des recommandations concrètes."},{"n":28,"a":["A"],"q":"Une entreprise veut s\u0027assurer qu\u0027aucune ressource ne puisse être créée dans une région autre que l\u0027Europe, sur l\u0027ensemble de ses souscriptions, et que toute tentative non conforme soit automatiquement bloquée ou signalée. Quel outil Azure doit-elle mettre en place ?","o":["Azure Policy","Azure RBAC","Un verrou de ressource","Azure Advisor"],"e":"**Azure Policy** définit des règles de conformité appliquées automatiquement à l\u0027ensemble des ressources et souscriptions, par exemple restreindre les régions autorisées."},{"n":29,"a":["A"],"q":"Une entreprise veut empêcher que son groupe de ressources de production ne soit supprimé accidentellement par un administrateur, même si celui-ci dispose des droits suffisants pour le faire. Quelle fonctionnalité doit-elle appliquer ?","o":["Un verrou de suppression (CanNotDelete)","Une Azure Policy de type Audit","Un tag de criticité","Un rôle RBAC Lecteur"],"e":"Un **verrou CanNotDelete** empêche la suppression d\u0027une ressource ou d\u0027un groupe de ressources, indépendamment des autorisations RBAC accordées à l\u0027utilisateur."},{"n":30,"a":["A"],"q":"Deux équipes marketing et finance partagent la même souscription Azure, et la direction souhaite pouvoir répartir précisément les coûts entre ces deux équipes dans les rapports de Cost Management. Quelle pratique de gouvernance permet cette répartition ?","o":["L\u0027application de tags (par exemple departement:marketing ou departement:finance) sur les ressources","La création de deux groupes d\u0027administration distincts uniquement","L\u0027activation d\u0027un verrou ReadOnly sur chaque ressource","La désactivation du Pricing Calculator"],"e":"Les **tags** ajoutent des métadonnées aux ressources, comme le nom d\u0027un département, afin de filtrer et répartir les coûts dans Microsoft Cost Management."},{"n":31,"a":["A"],"q":"Une entreprise veut être automatiquement alertée dès que ses dépenses Azure mensuelles approchent un seuil défini à l\u0027avance, avant même de recevoir la facture finale. Quel outil doit-elle configurer ?","o":["Un budget dans Microsoft Cost Management","Le calculateur TCO","Azure Policy","Un tag de budget"],"e":"**Microsoft Cost Management** permet de définir des budgets avec des alertes déclenchées lorsque les dépenses réelles ou prévues dépassent un seuil choisi."},{"n":32,"a":["A"],"q":"Une entreprise encore hébergée entièrement sur ses propres serveurs veut estimer les économies potentielles qu\u0027elle réaliserait en migrant vers Azure, en comparant ses coûts actuels d\u0027infrastructure à ceux du cloud. Quel outil Microsoft est conçu pour cette estimation ?","o":["Le calculateur de coût total de possession (TCO Calculator)","Le calculateur de prix Azure (Pricing Calculator)","Microsoft Cost Management","Azure Advisor"],"e":"Le **TCO Calculator** compare les coûts actuels d\u0027une infrastructure on-premises avec ceux d\u0027une solution équivalente dans Azure, contrairement au Pricing Calculator qui estime le coût d\u0027une architecture déjà définie."},{"n":33,"a":["A"],"q":"Une entreprise souhaite cartographier automatiquement l\u0027ensemble de ses données sensibles réparties entre Azure, d\u0027autres clouds et ses systèmes on-premises, et appliquer une classification cohérente. Quel service est conçu pour cette gouvernance des données ?","o":["Microsoft Purview","Azure Monitor","Azure Policy","Azure Service Health"],"e":"**Microsoft Purview** fournit un catalogue unifié permettant de découvrir, classifier et gouverner les données sensibles à travers des environnements hybrides et multicloud."},{"n":34,"a":["A"],"q":"Un responsable conformité a besoin d\u0027accéder aux rapports d\u0027audit, certifications et détails sur les pratiques de sécurité de Microsoft afin de justifier la conformité réglementaire de l\u0027entreprise auprès d\u0027un régulateur. Où peut-il trouver ces documents officiels ?","o":["Le Service Trust Portal","Azure Advisor","Le portail Azure, section Resource Groups","Microsoft Purview"],"e":"Le **Service Trust Portal** centralise les rapports d\u0027audit, certifications de conformité et informations de sécurité fournis par Microsoft pour ses services cloud."},{"n":35,"a":["A"],"q":"Une entreprise veut à la fois empêcher la création de machines virtuelles sans tag obligatoire, et limiter les personnes autorisées à créer des machines virtuelles. Quels outils doit-elle combiner respectivement pour ces deux objectifs ?","o":["Azure Policy pour imposer les tags, et Azure RBAC pour restreindre qui peut créer des ressources","Azure RBAC pour imposer les tags, et Azure Policy pour restreindre qui peut créer des ressources","Un verrou de ressource pour les deux objectifs","Microsoft Purview pour les deux objectifs"],"e":"**Azure Policy** contrôle la conformité des propriétés des ressources, tandis qu\u0027**Azure RBAC** contrôle les actions que les utilisateurs sont autorisés à effectuer."},{"n":36,"a":["A","C"],"q":"Quels sont deux avantages de déployer son infrastructure Azure à l\u0027aide de modèles ARM ou Bicep plutôt que manuellement via le portail ?","o":["Des déploiements reproductibles et cohérents entre les environnements","La disparition totale du besoin de définir des autorisations RBAC","La possibilité de versionner l\u0027infrastructure dans un système de contrôle de version comme Git","Une réduction garantie et automatique du prix des ressources déployées"],"e":"L\u0027**infrastructure as code** via ARM ou Bicep garantit des déploiements reproductibles et permet de versionner les définitions d\u0027infrastructure, sans effet direct sur les prix ni sur le RBAC."},{"n":37,"a":["A"],"q":"Une entreprise possède des serveurs on-premises et des machines virtuelles chez un autre fournisseur cloud, et souhaite les gérer, leur appliquer des Azure Policy et superviser leur sécurité depuis le portail Azure comme des ressources Azure natives. Quel service permet cette extension de la gouvernance Azure ?","o":["Azure Arc","Azure Resource Manager","Azure Bastion","Azure Front Door"],"e":"**Azure Arc** étend la gestion, les Azure Policy et la supervision Azure à des ressources situées en dehors d\u0027Azure, notamment on-premises ou sur d\u0027autres clouds."},{"n":38,"a":["A"],"q":"Une entreprise veut recevoir des recommandations personnalisées pour réduire ses coûts et améliorer la sécurité, la fiabilité et les performances de ses ressources Azure actuelles. Quel service lui fournit ces conseils automatisés ?","o":["Azure Advisor","Azure Service Health","Azure Monitor","Le Service Trust Portal"],"e":"**Azure Advisor** analyse la configuration des ressources déployées et propose des recommandations personnalisées sur le coût, la sécurité, la fiabilité et les performances."},{"n":39,"a":["A"],"q":"Un administrateur veut savoir si une panne en cours sur un service Azure affecte spécifiquement les ressources de sa propre souscription, et pas seulement l\u0027état général de la plateforme. Quel outil doit-il consulter ?","o":["Azure Service Health","Azure Status (status.azure.com)","Azure Advisor","Le Pricing Calculator"],"e":"**Azure Service Health** fournit un tableau de bord personnalisé des incidents affectant précisément les ressources de l\u0027abonnement, contrairement à Azure Status qui donne un état global public."},{"n":40,"a":["A"],"q":"Une équipe de développement veut collecter en continu les journaux, métriques de performance et traces de requêtes d\u0027une application web afin de diagnostiquer rapidement les ralentissements observés par les utilisateurs. Quelle combinaison de services Azure répond le mieux à ce besoin ?","o":["Azure Monitor avec Application Insights","Azure Policy avec Azure Blueprints","Microsoft Purview avec Azure Arc","Le Service Trust Portal avec Azure Advisor"],"e":"**Azure Monitor**, associé à **Application Insights**, collecte et analyse les journaux, métriques et traces applicatives afin de diagnostiquer les problèmes de performance."}]},{"id":6,"title":"Examen blanc 6 — Coûts et tarification","questions":[{"n":1,"a":["B"],"q":"Une PME souhaite arrêter d\u0027acheter des serveurs physiques et payer uniquement l\u0027usage mensuel réel de ses machines virtuelles dans le cloud. Quel modèle économique adopte-t-elle ainsi ?","o":["Le modèle CapEx (dépenses d\u0027investissement)","Le modèle OpEx (dépenses opérationnelles)","Un modèle de licence perpétuelle","Un modèle de dépréciation d\u0027actifs"],"e":"Le cloud permet de remplacer les **dépenses d\u0027investissement (CapEx)** par des **dépenses opérationnelles (OpEx)**, payées selon l\u0027usage réel, sans achat de matériel."},{"n":2,"a":["B"],"q":"Dans un modèle IaaS, une entreprise héberge des machines virtuelles sur Azure. Qui est responsable de l\u0027application des correctifs du système d\u0027exploitation invité ?","o":["Microsoft, car Azure gère entièrement l\u0027infrastructure","Le client, car il reste propriétaire du système d\u0027exploitation en IaaS","Un partenaire tiers obligatoire","Personne, les correctifs sont automatiques dans tous les cas"],"e":"En **IaaS**, le client conserve la responsabilité du système d\u0027exploitation, dont l\u0027application des correctifs ; Microsoft gère l\u0027infrastructure physique sous-jacente."},{"n":3,"a":["C"],"q":"Une banque doit conserver les données clients sensibles sur ses propres serveurs pour des raisons réglementaires, tout en utilisant Azure pour absorber les pics de charge de son application web. Quel modèle de déploiement correspond à ce besoin ?","o":["Cloud public","Cloud privé","Cloud hybride","Cloud communautaire"],"e":"Le **cloud hybride** combine une infrastructure sur site pour les données sensibles et le cloud public pour la flexibilité et l\u0027absorption des pics de charge."},{"n":4,"a":["B"],"q":"Une entreprise utilise à la fois Azure et un autre fournisseur cloud afin d\u0027éviter de dépendre d\u0027un seul prestataire. Comment appelle-t-on cette stratégie ?","o":["Edge computing","Multicloud","Cloud privé virtuel","Colocation"],"e":"Une stratégie **multicloud** consiste à utiliser plusieurs fournisseurs cloud, notamment pour réduire la dépendance à un seul prestataire."},{"n":5,"a":["B"],"q":"Une start-up développe une API qui n\u0027est appelée que quelques minutes par jour. Elle souhaite ne payer que pour le temps d\u0027exécution réel du code, sans gérer ni payer de serveur inactif. Quelle solution correspond le mieux ?","o":["Une machine virtuelle réservée pour un an","Azure Functions en plan de consommation (serverless)","Un cluster AKS dimensionné en permanence","Une instance réservée App Service Premium"],"e":"Le **plan de consommation serverless** d\u0027Azure Functions facture uniquement le temps d\u0027exécution réel, ce qui minimise les coûts pour un usage intermittent."},{"n":6,"a":["C"],"q":"Une application repose sur deux services Azure indépendants, chacun garanti à 99,9% de disponibilité par son SLA. Quelle est la disponibilité combinée approximative de l\u0027application si les deux services doivent fonctionner simultanément ?","o":["99,9%","99,99%","Environ 99,8%","100%"],"e":"Lorsque deux services indépendants doivent fonctionner ensemble, leurs SLA se multiplient (0,999 x 0,999 environ 0,998), soit environ **99,8%** de disponibilité combinée."},{"n":7,"a":["B"],"q":"Le trafic du site e-commerce d\u0027une entreprise est très faible la nuit et explose lors des soldes. Elle veut payer moins quand le trafic est faible et ajouter automatiquement des instances pendant les pics. Quelle capacité du cloud utilise-t-elle ?","o":["La redondance géographique","L\u0027élasticité","La tolérance de panne","La virtualisation imbriquée"],"e":"L\u0027**élasticité** permet d\u0027ajouter ou retirer automatiquement des ressources selon la demande, optimisant les coûts en fonction du trafic réel."},{"n":8,"a":["B"],"q":"Après analyse, une entreprise constate que ses machines virtuelles sont utilisées à seulement 15% de leur capacité CPU en moyenne. Quelle action réduit directement les coûts sans compromettre la fiabilité du service ?","o":["Ajouter davantage de machines virtuelles identiques","Redimensionner (right-sizing) les machines virtuelles vers une taille inférieure adaptée","Passer toutes les VM en redondance GZRS","Supprimer les sauvegardes"],"e":"Le **redimensionnement (right-sizing)** consiste à adapter la taille des ressources à l\u0027usage réel, réduisant les coûts inutiles liés à la surcapacité."},{"n":9,"a":["B"],"q":"Une équipe de développement veut déployer rapidement une application web sans gérer de système d\u0027exploitation, de correctifs ni de serveur sous-jacent, afin de réduire les coûts d\u0027exploitation. Quel modèle de service choisir ?","o":["IaaS","PaaS","SaaS","On-premises"],"e":"Le **PaaS** (Platform as a Service), comme Azure App Service, prend en charge l\u0027infrastructure et le système d\u0027exploitation, réduisant la charge et les coûts de gestion pour les développeurs."},{"n":10,"a":["C"],"q":"Une entreprise sait qu\u0027elle utilisera un ensemble de machines virtuelles en continu pendant au moins les trois prochaines années. Quelle option tarifaire lui permettrait de réduire le plus ses coûts par rapport au paiement à l\u0027utilisation ?","o":["Les instances Spot","Le paiement à l\u0027utilisation (pay-as-you-go)","Les instances réservées (Reserved Instances)","Le niveau gratuit (Free Tier)"],"e":"Les **instances réservées** offrent une réduction significative du prix en échange d\u0027un engagement d\u0027utilisation sur 1 ou 3 ans, idéal pour des charges prévisibles et continues."},{"n":11,"a":["B","C"],"q":"Parmi les principes suivants, lesquels DEUX font partie du modèle de sécurité Confiance Zéro (Zero Trust) ?","o":["Toujours faire confiance par défaut aux utilisateurs internes au réseau de l\u0027entreprise","Vérifier explicitement chaque demande d\u0027accès, quelle que soit son origine","Appliquer le principe du moindre privilège","Désactiver toute authentification multifacteur pour simplifier l\u0027accès"],"e":"Le modèle **Confiance Zéro** repose sur la vérification explicite de chaque accès et l\u0027application du **principe du moindre privilège**, sans jamais faire confiance par défaut."},{"n":12,"a":["B"],"q":"Une entreprise veut déployer une solution de reprise après sinistre avec réplication des données entre deux régions Azure situées dans la même géographie, bénéficiant d\u0027une coordination des mises à jour planifiées par Microsoft. Quel concept Azure utilise-t-elle ?","o":["Une zone de disponibilité unique","Une paire de régions (region pair)","Un groupe de ressources","Un point de terminaison privé"],"e":"Une **paire de régions** associe deux régions Azure d\u0027une même géographie, avec réplication possible et mises à jour planifiées de manière séquentielle pour limiter les risques."},{"n":13,"a":["A"],"q":"Pour protéger son application contre la panne d\u0027un seul datacenter au sein d\u0027une région, tout en gardant une latence très faible, une entreprise répartit ses VM sur plusieurs emplacements physiquement séparés mais proches, au sein de la même région. Que configure-t-elle ?","o":["Des zones de disponibilité","Des régions souveraines","Un réseau virtuel peering","Une passerelle VPN"],"e":"Les **zones de disponibilité** sont des emplacements physiquement distincts au sein d\u0027une même région, protégeant contre les pannes de datacenter avec une faible latence entre elles."},{"n":14,"a":["A"],"q":"Une entreprise veut appliquer un budget distinct par équipe (marketing, finance, IT) et regrouper les ressources correspondantes séparément pour analyser leurs coûts respectifs. À quel niveau de la hiérarchie Azure doit-elle organiser ces ressources ?","o":["En créant un groupe de ressources par équipe à l\u0027intérieur de la souscription","En créant un seul groupe de ressources commun pour toute l\u0027entreprise","En modifiant uniquement les tags au niveau de l\u0027abonnement racine","En créant un seul locataire (tenant) Microsoft Entra par ressource"],"e":"Organiser les ressources en **groupes de ressources** distincts par équipe facilite le suivi des coûts, l\u0027application de budgets et la gestion des accès propres à chaque groupe."},{"n":15,"a":["B"],"q":"Une agence gouvernementale américaine doit héberger ses données dans un environnement cloud physiquement et logiquement isolé des autres clients Azure, pour répondre à des exigences de conformité strictes. Quel type de région utilise-t-elle ?","o":["Une région périphérique (Edge)","Une région souveraine (sovereign region)","Une zone de disponibilité partagée","Une région bêta"],"e":"Les **régions souveraines** comme Azure Government sont des instances physiquement isolées répondant à des exigences réglementaires ou de conformité spécifiques."},{"n":16,"a":["B"],"q":"Une entreprise souhaite exécuter un conteneur ponctuel pour un traitement de courte durée, sans provisionner ni gérer de machines virtuelles ni de cluster, en payant uniquement le temps d\u0027exécution. Quel service Azure est le plus adapté ?","o":["Azure Kubernetes Service (AKS)","Azure Container Instances (ACI)","Virtual Machine Scale Sets","Azure Virtual Desktop"],"e":"**Azure Container Instances** permet d\u0027exécuter des conteneurs isolés rapidement, sans gérer de serveurs ni de cluster, en payant à la seconde d\u0027utilisation."},{"n":17,"a":["B"],"q":"Une entreprise a une fonction serverless qui doit répondre instantanément sans délai de démarrage à froid, tout en gardant une certaine élasticité des coûts. Quel plan Azure Functions doit-elle choisir plutôt que le plan de consommation standard ?","o":["Le plan de consommation (Consumption)","Le plan Premium","Un plan App Service Free","Le niveau de stockage Blob Archive"],"e":"Le **plan Premium** d\u0027Azure Functions maintient des instances préchauffées pour éviter les démarrages à froid, tout en conservant une facturation liée à l\u0027usage."},{"n":18,"a":["A"],"q":"Une petite application de démonstration interne, sans trafic de production, doit être hébergée au moindre coût possible sur Azure App Service. Quel niveau tarifaire choisir ?","o":["Le niveau Gratuit (F1) ou Partagé","Le niveau Premium v3","Le niveau Isolé","Le niveau dédié aux environnements de haute disponibilité multi-régions"],"e":"Le niveau **Gratuit/Partagé** d\u0027App Service convient aux applications de test ou de démonstration à très faible trafic, sans frais ni garanties de performance élevées."},{"n":19,"a":["A"],"q":"Deux réseaux virtuels Azure situés dans des régions différentes doivent communiquer directement entre eux via le réseau principal de Microsoft, sans passer par Internet public. Quelle fonctionnalité permet cela ?","o":["Le peering de réseaux virtuels (VNet peering)","Un sous-réseau partagé","Azure DNS public","Un point de terminaison public"],"e":"Le **peering de réseaux virtuels** connecte deux VNet via le réseau principal de Microsoft, même entre régions différentes, sans transiter par Internet."},{"n":20,"a":["A"],"q":"Une entreprise a besoin d\u0027une connexion privée et dédiée entre son datacenter et Azure, avec une bande passante garantie et sans transiter par Internet public, pour des transferts de données volumineux et critiques. Quelle solution choisir plutôt qu\u0027un VPN classique ?","o":["Azure ExpressRoute","Azure VPN Gateway de site à site","Un point de terminaison privé uniquement","Le peering de réseaux virtuels"],"e":"**Azure ExpressRoute** fournit une connexion privée dédiée avec une bande passante garantie, contrairement au VPN de site à site qui transite via Internet."},{"n":21,"a":["C"],"q":"Une entreprise conserve des journaux d\u0027audit qu\u0027elle doit garder sept ans mais qu\u0027elle consultera très rarement, en acceptant un délai de récupération de plusieurs heures en échange du coût de stockage le plus bas. Quel niveau d\u0027accès Blob Storage est le plus économique ?","o":["Le niveau Chaud (Hot)","Le niveau Froid (Cool)","Le niveau Archive","Le niveau Premium SSD"],"e":"Le niveau **Archive** offre le coût de stockage le plus bas, adapté aux données rarement consultées, au prix d\u0027un délai de réhydratation avant accès."},{"n":22,"a":["B","D"],"q":"Parmi les options de redondance de stockage Azure suivantes, lesquelles DEUX répliquent automatiquement les données vers une région secondaire géographiquement distante ?","o":["LRS (Locally Redundant Storage)","GRS (Geo-Redundant Storage)","ZRS (Zone-Redundant Storage)","GZRS (Geo-Zone-Redundant Storage)"],"e":"**GRS** et **GZRS** répliquent les données vers une région secondaire distante, contrairement à LRS et ZRS qui restent dans la région principale."},{"n":23,"a":["B"],"q":"Une entreprise remarque que sa facture Azure augmente fortement à cause du volume de données que ses applications renvoient vers Internet chaque mois. Quel type de trafic est principalement facturé dans ce cas ?","o":["Le trafic entrant (ingress) vers Azure","Le trafic sortant (egress/outbound) depuis Azure","Le trafic interne entre deux VM du même sous-réseau","Le trafic de réplication entre zones de disponibilité d\u0027une même région"],"e":"Chez Azure, le **trafic sortant (egress)** vers Internet est généralement facturé, tandis que le trafic entrant est le plus souvent gratuit."},{"n":24,"a":["B"],"q":"Une entreprise doit transférer plusieurs centaines de téraoctets de données vers Azure, mais sa connexion Internet est trop lente et coûteuse pour un transfert en ligne dans un délai raisonnable. Quelle solution Azure est conçue pour ce besoin ?","o":["AzCopy en ligne de commande","Azure Data Box (transfert physique hors ligne)","Azure Storage Explorer","Azure File Sync"],"e":"**Azure Data Box** permet de transférer de très gros volumes de données hors ligne via un boîtier physique expédié, évitant les coûts et délais d\u0027un transfert réseau massif."},{"n":25,"a":["B"],"q":"Les employés d\u0027une entreprise doivent se connecter une seule fois pour accéder à plusieurs applications cloud (Microsoft 365, applications SaaS tierces) sans ressaisir leurs identifiants à chaque fois. Quelle fonctionnalité Microsoft Entra ID répond à ce besoin ?","o":["L\u0027authentification multifacteur (MFA)","L\u0027authentification unique (Single Sign-On)","Les identités externes B2B","Les verrous de ressources"],"e":"L\u0027**authentification unique (SSO)** permet aux utilisateurs de s\u0027authentifier une seule fois pour accéder à plusieurs applications sans ressaisir leurs identifiants."},{"n":26,"a":["A","C"],"q":"Parmi les méthodes suivantes, lesquelles DEUX sont des méthodes d\u0027authentification sans mot de passe prises en charge par Microsoft Entra ID ?","o":["Windows Hello Entreprise","Un mot de passe complexe renouvelé tous les 30 jours","Une clé de sécurité FIDO2","Un nom d\u0027utilisateur et mot de passe classique avec question secrète"],"e":"**Windows Hello Entreprise** et les **clés de sécurité FIDO2** permettent une authentification sans mot de passe, renforçant la sécurité et l\u0027expérience utilisateur."},{"n":27,"a":["B"],"q":"Une entreprise veut autoriser un administrateur à gérer uniquement les machines virtuelles d\u0027un groupe de ressources précis, sans pouvoir modifier les paramètres de facturation ni les autres ressources. Quel mécanisme Azure permet cette granularité ?","o":["Microsoft Entra Domain Services","Le contrôle d\u0027accès en fonction du rôle (Azure RBAC)","Un verrou de ressource en lecture seule","Azure Policy uniquement"],"e":"**Azure RBAC** permet d\u0027attribuer des rôles avec des permissions précises à une étendue spécifique (ressource, groupe de ressources, souscription), appliquant le principe du moindre privilège."},{"n":28,"a":["B"],"q":"Une entreprise encore hébergée sur site veut comparer le coût total de son infrastructure actuelle (serveurs, électricité, personnel) avec le coût estimé d\u0027une migration vers Azure. Quel outil Microsoft doit-elle utiliser ?","o":["La calculatrice de prix Azure (Pricing Calculator)","La calculatrice de coût total de possession (TCO Calculator)","Azure Advisor","Azure Cost Management"],"e":"La **calculatrice TCO** compare le coût total de possession d\u0027une infrastructure sur site avec le coût estimé d\u0027une solution équivalente sur Azure."},{"n":29,"a":["B"],"q":"Une entreprise souhaite être automatiquement avertie par e-mail dès que ses dépenses Azure mensuelles dépassent 80% du montant prévu, sans bloquer les ressources existantes. Que doit-elle configurer dans Microsoft Cost Management ?","o":["Un verrou de ressource","Un budget avec une alerte de seuil","Une politique Azure Policy de refus","Un tag de criticité"],"e":"Dans **Microsoft Cost Management**, un **budget** associé à des seuils d\u0027alerte permet d\u0027être notifié automatiquement lorsque les dépenses approchent ou dépassent une limite définie."},{"n":30,"a":["A"],"q":"Une entreprise veut pouvoir ventiler précisément les coûts Azure par département et par projet dans ses rapports financiers, même si les ressources des différents projets partagent le même groupe de ressources. Quelle fonctionnalité utiliser ?","o":["Les tags (étiquettes) de ressources","Les zones de disponibilité","Les régions souveraines","Le peering de réseaux virtuels"],"e":"Les **tags** permettent d\u0027associer des métadonnées (département, projet, centre de coût) aux ressources afin de filtrer et ventiler précisément les rapports de coûts."},{"n":31,"a":["A"],"q":"Une entreprise possède déjà des licences Windows Server avec Software Assurance et souhaite réduire le coût de ses machines virtuelles Azure en réutilisant ces licences existantes plutôt que de payer une licence incluse dans le tarif de la VM. Quel avantage doit-elle utiliser ?","o":["Azure Hybrid Benefit","Les instances Spot","Le niveau de stockage Archive","Azure Reserved Capacity"],"e":"**Azure Hybrid Benefit** permet de réutiliser des licences Windows Server ou SQL Server existantes afin de réduire le coût des ressources Azure correspondantes."},{"n":32,"a":["B"],"q":"Une entreprise doit exécuter un traitement par lots non critique, tolérant les interruptions, et souhaite profiter du tarif le plus bas possible pour la capacité de calcul inutilisée d\u0027Azure. Quel type de machine virtuelle est le plus adapté ?","o":["Une machine virtuelle réservée sur 3 ans","Une machine virtuelle Spot","Une machine virtuelle Isolée dédiée","Une machine virtuelle avec Azure Hybrid Benefit"],"e":"Les **machines virtuelles Spot** exploitent la capacité Azure inutilisée à prix fortement réduit, mais peuvent être réclamées à tout moment, ce qui convient aux charges tolérantes aux interruptions."},{"n":33,"a":["A"],"q":"Une entreprise veut empêcher automatiquement la création de toute ressource qui ne respecterait pas la règle imposant une région autorisée, et refuser le déploiement en cas de non-conformité. Quel service Azure permet d\u0027appliquer cette règle ?","o":["Azure Policy","Azure Blueprints uniquement visuel","Microsoft Purview","Service Trust Portal"],"e":"**Azure Policy** permet de définir des règles de conformité et de refuser automatiquement la création de ressources qui ne les respectent pas."},{"n":34,"a":["A"],"q":"Une entreprise veut empêcher qu\u0027un administrateur supprime accidentellement une base de données de production critique, tout en continuant à autoriser les modifications de configuration courantes. Quelle fonctionnalité Azure utiliser ?","o":["Un verrou de suppression (Delete lock)","Azure Policy en mode audit","Un tag portant la mention critique","Microsoft Defender for Cloud"],"e":"Un **verrou de suppression (Delete lock)** empêche la suppression accidentelle d\u0027une ressource critique tout en autorisant les autres modifications."},{"n":35,"a":["B"],"q":"Une entreprise soumise à des audits de conformité souhaite consulter les rapports d\u0027audit, certifications et informations de confidentialité fournis par Microsoft concernant ses services cloud. Où peut-elle trouver ces documents ?","o":["Azure Advisor","Le Service Trust Portal","Azure Monitor","Log Analytics"],"e":"Le **Service Trust Portal** met à disposition les rapports d\u0027audit, certifications de conformité et informations de confidentialité de Microsoft."},{"n":36,"a":["A"],"q":"Un administrateur souhaite automatiser la création répétée de plusieurs ressources Azure identiques via des scripts, directement depuis un navigateur, sans installer d\u0027outils localement. Quel outil Azure est conçu pour cela ?","o":["Azure Cloud Shell","Azure Advisor","Microsoft Defender for Cloud","Azure Service Health"],"e":"**Azure Cloud Shell** offre un environnement de ligne de commande (Bash ou PowerShell) accessible depuis le navigateur, sans installation locale, pour automatiser des tâches."},{"n":37,"a":["A","C"],"q":"Parmi les avantages suivants, lesquels DEUX sont apportés par l\u0027utilisation de modèles ARM ou Bicep (infrastructure as code) pour déployer des ressources Azure ?","o":["Des déploiements reproductibles et cohérents entre environnements","L\u0027élimination totale du besoin de facturation","Le versionnement de l\u0027infrastructure comme du code source","Une garantie automatique de disponibilité à 100%"],"e":"Les modèles **ARM/Bicep** permettent des déploiements **reproductibles** et le **versionnement** de l\u0027infrastructure, assurant cohérence et traçabilité entre environnements."},{"n":38,"a":["A"],"q":"Une entreprise possède des serveurs sur site, des VM dans un autre cloud et des ressources Azure, et souhaite les gérer et appliquer des politiques de gouvernance depuis une seule console unifiée. Quel service Azure permet cela ?","o":["Azure Arc","Azure Migrate","Azure Site Recovery","Azure Data Box"],"e":"**Azure Arc** étend la gestion et la gouvernance Azure (y compris Azure Policy) aux ressources situées sur site ou dans d\u0027autres clouds."},{"n":39,"a":["B"],"q":"Une entreprise veut recevoir des recommandations personnalisées pour réduire ses coûts, par exemple en identifiant des machines virtuelles sous-utilisées qu\u0027elle pourrait redimensionner ou arrêter. Quel service Azure fournit ce type de conseils ?","o":["Azure Service Health","Azure Advisor","Azure Monitor uniquement","Application Insights"],"e":"**Azure Advisor** analyse l\u0027utilisation des ressources et propose des recommandations personnalisées, notamment pour réduire les coûts (redimensionnement, arrêt de ressources inutilisées)."},{"n":40,"a":["B"],"q":"Une équipe souhaite collecter et analyser en continu les métriques de performance de son application web ainsi que les traces détaillées des requêtes pour diagnostiquer les ralentissements. Quels services Azure combinés répondent à ce besoin ?","o":["Azure Service Health et Service Trust Portal","Azure Monitor et Application Insights","Azure Policy et Resource Locks","Azure Migrate et Data Box"],"e":"**Azure Monitor** collecte métriques et journaux, tandis qu\u0027**Application Insights** fournit une surveillance applicative détaillée (APM) pour diagnostiquer les performances."}]},{"id":7,"title":"Examen blanc 7 — Haute disponibilité et résilience","questions":[{"n":1,"a":["A"],"q":"Qu\u0027est-ce qui définit le mieux le cloud computing ?","o":["La fourniture à la demande de ressources informatiques (calcul, stockage, réseau) via internet, facturées à l\u0027usage","L\u0027achat de serveurs physiques installés dans son propre datacenter","Un réseau privé réservé exclusivement aux très grandes entreprises","Un service informatique utilisable uniquement sans connexion internet"],"e":"Le cloud computing consiste à consommer des ressources informatiques à la demande via internet, avec une facturation basée sur l\u0027usage réel."},{"n":2,"a":["B"],"q":"Une entreprise héberge des machines virtuelles IaaS dans Azure. Qui est responsable de l\u0027application des correctifs du système d\u0027exploitation sur ces VM ?","o":["Microsoft uniquement","Le client, c\u0027est-à-dire l\u0027entreprise","Un auditeur tiers indépendant","Aucune des deux parties, les correctifs sont désactivés en IaaS"],"e":"Dans le modèle de **responsabilité partagée**, Microsoft sécurise l\u0027infrastructure physique, mais en IaaS le client reste responsable du système d\u0027exploitation et de ses mises à jour."},{"n":3,"a":["C"],"q":"Une société veut conserver ses données sensibles sur un serveur local pour des raisons réglementaires, tout en utilisant Azure pour absorber les pics de charge et améliorer la résilience de son application. Quel modèle de déploiement correspond à ce besoin ?","o":["Cloud public uniquement","Cloud privé uniquement","Cloud hybride","Multicloud"],"e":"Le **cloud hybride** combine ressources sur site et ressources cloud publiques, ce qui permet de garder des données localement tout en bénéficiant de la capacité élastique d\u0027Azure."},{"n":4,"a":["B"],"q":"Une entreprise renonce à construire un second centre de données pour la reprise d\u0027activité et préfère payer uniquement les ressources Azure consommées chaque mois. Quel type de dépense cela représente-t-il ?","o":["Une dépense d\u0027investissement (CapEx)","Une dépense opérationnelle (OpEx)","Un investissement en capital fixe","Une dette à long terme obligatoire"],"e":"Payer des ressources cloud au fur et à mesure de leur consommation, sans investissement matériel initial, correspond à une **dépense opérationnelle (OpEx)**."},{"n":5,"a":["B"],"q":"Une jeune entreprise connaît un trafic très variable et veut payer uniquement les ressources de calcul réellement consommées, sans engagement initial. Quel modèle de tarification correspond le mieux à ce besoin ?","o":["Une réservation d\u0027instance sur trois ans","Le paiement à l\u0027usage (pay-as-you-go)","Une licence perpétuelle","Une facturation forfaitaire annuelle fixe"],"e":"Le modèle **pay-as-you-go** permet de ne payer que la consommation réelle, sans engagement, ce qui convient à une charge imprévisible."},{"n":6,"a":["C"],"q":"Quel est le principal avantage architectural du calcul serverless pour une équipe développant une API soumise à un trafic imprévisible ?","o":["L\u0027équipe doit provisionner et dimensionner elle-même les serveurs virtuels","Le code s\u0027exécute en permanence sur une seule machine physique dédiée","La plateforme met automatiquement à l\u0027échelle les ressources et facture uniquement le temps d\u0027exécution du code","Le serverless oblige à gérer manuellement les correctifs du système d\u0027exploitation sous-jacent"],"e":"Le **serverless** délègue entièrement la gestion de l\u0027infrastructure au fournisseur cloud, qui adapte automatiquement la capacité et facture à l\u0027exécution."},{"n":7,"a":["C"],"q":"Une application est composée d\u0027un niveau web avec un SLA garanti de 99,95 % et d\u0027une base de données avec un SLA garanti de 99,99 %, les deux étant nécessaires au fonctionnement de l\u0027application. Quel est le SLA composé approximatif de l\u0027ensemble ?","o":["99,99 %, le plus élevé des deux","99,95 %, le plus bas des deux","Environ 99,94 %, résultat de la multiplication des deux SLA","100 %, car les deux niveaux se compensent mutuellement"],"e":"Pour des composants dépendants, le **SLA composé** s\u0027obtient en multipliant les disponibilités (0,9995 x 0,9999 ≈ 0,9994), donnant un résultat inférieur à chaque SLA pris isolément."},{"n":8,"a":["B"],"q":"Pendant une vente flash, un site e-commerce ajoute automatiquement des instances supplémentaires puis les supprime dès que le pic de trafic retombe. Quel concept illustre le mieux ce comportement ?","o":["La scalabilité verticale","L\u0027élasticité","La haute disponibilité","La redondance géographique"],"e":"L\u0027**élasticité** désigne la capacité d\u0027un système cloud à ajouter et retirer automatiquement des ressources en fonction de la demande réelle."},{"n":9,"a":["A"],"q":"Dans Azure, quel terme désigne la capacité d\u0027un système à se remettre des pannes et à continuer de fonctionner correctement pour les utilisateurs ?","o":["La fiabilité","La gouvernance","L\u0027agilité commerciale","La conformité réglementaire"],"e":"La **fiabilité** décrit la capacité d\u0027un système à résister aux défaillances et à rétablir rapidement son fonctionnement normal."},{"n":10,"a":["B"],"q":"La gérabilité (manageability) du cloud Azure fait référence à la capacité de...","o":["Réduire uniquement les coûts de licence logicielle","Configurer, surveiller et automatiser la gestion des ressources déployées dans le cloud","Remplacer complètement le besoin de supervision humaine","Garantir juridiquement l\u0027absence totale de pannes"],"e":"La gérabilité regroupe les outils permettant de configurer, surveiller et automatiser la gestion des ressources cloud tout au long de leur cycle de vie."},{"n":11,"a":["A","C"],"q":"Quelles affirmations décrivent correctement le modèle IaaS (Infrastructure as a Service) ?","o":["Le client gère le système d\u0027exploitation, les correctifs et le runtime des applications","Le fournisseur cloud gère entièrement le code de l\u0027application et son exécution","Le client loue à la demande des machines virtuelles, du stockage et des réseaux virtuels","Ce modèle ne permet aucune personnalisation du système d\u0027exploitation"],"e":"En **IaaS**, le client loue l\u0027infrastructure (VM, stockage, réseau) mais reste responsable du système d\u0027exploitation et de ses mises à jour, contrairement au PaaS ou au SaaS."},{"n":12,"a":["B"],"q":"Pour sa stratégie de reprise après sinistre, une entreprise veut répliquer son application vers une seconde région Azure située dans la même géographie, associée automatiquement par Microsoft pour limiter les interruptions simultanées. De quel concept s\u0027agit-il ?","o":["Une zone de disponibilité","Une paire de régions","Une région souveraine","Un groupe à haute disponibilité"],"e":"Chaque région Azure est associée à une autre région de la même géographie pour former une **paire de régions**, utilisée pour la reprise d\u0027activité et le déploiement séquentiel des mises à jour."},{"n":13,"a":["B"],"q":"Comment une entreprise peut-elle protéger son application contre la panne complète d\u0027un seul centre de données au sein d\u0027une même région Azure ?","o":["En utilisant une seule zone de disponibilité","En déployant ses ressources sur plusieurs zones de disponibilité de la région","En choisissant uniquement le stockage LRS","En utilisant un seul groupe à haute disponibilité dans un même datacenter"],"e":"Les **zones de disponibilité** sont des emplacements physiquement séparés au sein d\u0027une région ; répartir les ressources sur plusieurs zones protège contre la panne d\u0027un datacenter entier."},{"n":14,"a":["B"],"q":"Quelle est la différence principale entre un groupe à haute disponibilité (availability set) et une zone de disponibilité ?","o":["Le groupe à haute disponibilité répartit les VM sur plusieurs régions distinctes","Le groupe à haute disponibilité répartit les VM sur des domaines de mise à jour et de panne au sein d\u0027un même centre de données, tandis que la zone de disponibilité répartit les ressources sur plusieurs centres de données distincts","Les deux concepts sont strictement identiques","La zone de disponibilité ne concerne que le stockage, jamais les machines virtuelles"],"e":"Le **groupe à haute disponibilité** protège contre les pannes matérielles et la maintenance planifiée dans un même datacenter, alors que les **zones de disponibilité** protègent contre la perte d\u0027un datacenter entier."},{"n":15,"a":["B"],"q":"Quel niveau de la hiérarchie de gestion Azure permet d\u0027appliquer une même politique de gouvernance à plusieurs abonnements (subscriptions) simultanément ?","o":["Le groupe de ressources (resource group)","Le groupe d\u0027administration (management group)","La ressource individuelle","La zone de disponibilité"],"e":"Les **groupes d\u0027administration** se situent au-dessus des abonnements dans la hiérarchie et permettent d\u0027appliquer des politiques et des rôles à plusieurs abonnements à la fois."},{"n":16,"a":["C"],"q":"Quel service Azure permet de créer et de gérer automatiquement un ensemble de machines virtuelles identiques, équilibrées en charge, dont le nombre d\u0027instances augmente ou diminue selon la demande ?","o":["Azure Virtual Desktop","Les groupes à haute disponibilité","Les groupes identiques de machines virtuelles (VM Scale Sets)","Azure Container Instances"],"e":"Les **VM Scale Sets** permettent de gérer un groupe de VM identiques avec mise à l\u0027échelle automatique horizontale en fonction de la demande."},{"n":17,"a":["A"],"q":"Quel service Azure permet de fournir des postes de travail et des applications Windows virtualisés, accessibles à distance par les utilisateurs depuis n\u0027importe quel appareil ?","o":["Azure Virtual Desktop","Azure Functions","Azure Bastion","Azure Container Apps"],"e":"**Azure Virtual Desktop** est le service de virtualisation de postes de travail et d\u0027applications Windows hébergé dans Azure."},{"n":18,"a":["B"],"q":"Une équipe souhaite déployer plusieurs microservices conteneurisés avec mise à l\u0027échelle automatique basée sur les événements, sans gérer elle-même un cluster Kubernetes. Quel service Azure répond le mieux à ce besoin ?","o":["Azure Kubernetes Service (AKS)","Azure Container Apps","Azure Container Instances uniquement","Des machines virtuelles classiques avec Docker installé manuellement"],"e":"**Azure Container Apps** exécute des microservices conteneurisés avec mise à l\u0027échelle automatique sans exposer ni gérer directement le cluster Kubernetes sous-jacent, contrairement à AKS."},{"n":19,"a":["A"],"q":"Quelle caractéristique distingue Azure Functions des machines virtuelles traditionnelles ?","o":["Le code s\u0027exécute en réponse à des événements déclencheurs et la facturation est basée sur le temps d\u0027exécution réel","Il faut provisionner manuellement le nombre de serveurs à l\u0027avance","Le système d\u0027exploitation doit être entièrement géré par le client","Azure Functions ne peut jamais être déclenché par une requête HTTP"],"e":"**Azure Functions** est un service serverless event-driven qui ne facture que le temps d\u0027exécution réel, sans gestion de serveurs."},{"n":20,"a":["B"],"q":"Pour améliorer la disponibilité d\u0027une application web hébergée sur Azure App Service lors du déploiement de nouvelles versions, quelle fonctionnalité permet de basculer le trafic vers une nouvelle version sans interruption de service ?","o":["Les niveaux d\u0027accès au stockage","Les emplacements de déploiement (deployment slots)","Les paires de régions","Les verrous de ressources"],"e":"Les **emplacements de déploiement** d\u0027App Service permettent de préparer et tester une nouvelle version avant de l\u0027échanger avec la production sans interruption."},{"n":21,"a":["B"],"q":"Quelle fonctionnalité réseau Azure permet de connecter directement deux réseaux virtuels afin que leurs ressources communiquent via le réseau principal Microsoft, sans transiter par l\u0027internet public ?","o":["Azure DNS","Le peering de réseaux virtuels","Un point de terminaison public","Azure Bastion"],"e":"Le **peering de réseaux virtuels** relie deux VNets pour per
