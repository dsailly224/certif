<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Microsoft Azure Fundamentals (AZ-900) – Examens blancs (FR)</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--txt:#1d2433;--mut:#6b7385;--bd:#dde2ea;--pri:#0078d4;--pri2:#0b1f33;--ok:#1e9e5a;--ko:#d6383a;--okbg:#e6f6ed;--kobg:#fdeaea;--sel:#e8f3fc;--flag:#7b5cff}
[data-theme=dark]{--bg:#12161d;--card:#1c222c;--txt:#e6e9ef;--mut:#98a1b3;--bd:#2e3644;--pri2:#081422;--okbg:#173527;--kobg:#3d1d1e;--sel:#102a40}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--pri2);color:#fff;padding:.7rem 1.2rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:1.1rem;margin:0;flex:1;cursor:pointer}
header h1 b{color:var(--pri)}
header .tools{display:flex;gap:.5rem;align-items:center}
main{max-width:1000px;margin:0 auto;padding:1.2rem}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--txt);padding:.5rem 1rem;border-radius:8px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--pri)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--pri);border-color:var(--pri);color:#111;font-weight:600}
button.sm{padding:.25rem .6rem;font-size:.85rem}
header button{background:transparent;color:#fff;border-color:#4a5568}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:1.2rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.exam{cursor:pointer;transition:transform .1s}
.exam:hover{transform:translateY(-2px);border-color:var(--pri)}
.exam h3{margin:0 0 .3rem;font-size:1rem}
.mut{color:var(--mut);font-size:.88rem}
.badge{display:inline-block;padding:.1rem .5rem;border-radius:99px;font-size:.78rem;font-weight:600}
.b-ok{background:var(--okbg);color:var(--ok)}.b-ko{background:var(--kobg);color:var(--ko)}.b-n{background:var(--bg);color:var(--mut)}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.opts label{display:flex;gap:.5rem;align-items:center;margin:.3rem 0;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button.on{background:var(--pri);color:#111;font-weight:600}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.6rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.timer.low{color:var(--ko)}
.progress{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:1rem}
.progress div{height:100%;background:var(--pri);transition:width .2s}
.qtext{font-size:1.08rem;font-weight:500;margin:.2rem 0 1rem}
.hint{font-size:.85rem;color:var(--mut);margin-bottom:.6rem}
.choice{display:flex;gap:.7rem;align-items:flex-start;border:1px solid var(--bd);border-radius:10px;padding:.7rem .9rem;margin:.5rem 0;cursor:pointer;background:var(--card)}
.choice:hover{border-color:var(--pri)}
.choice input{margin-top:.3rem;accent-color:var(--pri)}
.choice .k{font-weight:700;min-width:1.2rem}
.choice.sel{background:var(--sel);border-color:var(--pri)}
.choice.good{background:var(--okbg);border-color:var(--ok)}
.choice.bad{background:var(--kobg);border-color:var(--ko)}
.choice.locked{cursor:default}
.fb{border-radius:10px;padding:.8rem 1rem;margin-top:1rem}
.fb.ok{background:var(--okbg);border-left:4px solid var(--ok)}
.fb.ko{background:var(--kobg);border-left:4px solid var(--ko)}
.expl{margin-top:.5rem;font-size:.95rem}
.expl ul{margin:.3rem 0;padding-left:1.3rem}
.nav{display:flex;justify-content:space-between;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.pal{display:flex;flex-wrap:wrap;gap:.35rem}
.pal button{width:2.4rem;padding:.3rem 0;font-size:.85rem;position:relative}
.pal .ans{background:var(--sel);border-color:var(--pri)}
.pal .g{background:var(--okbg);border-color:var(--ok)}
.pal .r{background:var(--kobg);border-color:var(--ko)}
.pal .cur{outline:2px solid var(--pri2);outline-offset:1px}
[data-theme=dark] .pal .cur{outline-color:#fff}
.pal .fl::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.score{font-size:3rem;font-weight:800;margin:.2rem 0}
.score.ok{color:var(--ok)}.score.ko{color:var(--ko)}
.rv{border-top:1px solid var(--bd);padding:.9rem 0}
.rv:first-child{border-top:0}
.rv .ans{font-size:.92rem;margin:.15rem 0}
.tag-ok{color:var(--ok);font-weight:700}.tag-ko{color:var(--ko);font-weight:700}
a{color:#0a73d9}
[data-theme=dark] a{color:#6cb4ff}
.flagbtn.on{background:var(--flag);color:#fff;border-color:var(--flag)}
select,input[type=number]{font:inherit;padding:.35rem;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--txt)}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:1.5rem}
.kbd{font-size:.78rem;color:var(--mut)}
@media(max-width:600px){main{padding:.6rem}.card{padding:.9rem}.score{font-size:2.3rem}}
</style>
</head>

<header>
  <h1 id="home" title="Accueil">☁️ <b>Azure</b> Fundamentals (AZ-900) — Examens blancs</h1>

<main id="app"></main>
<footer>Questions originales rédigées pour ce quiz, à partir du programme officiel Microsoft AZ-900. Non affilié à Microsoft. Progression enregistrée localement dans ce navigateur.</footer>
<script>
const DATA = [{"id":1,"title":"Examen blanc 1 — Définitions et fondamentaux","questions":[{"n":1,"a":["A"],"q":"Comment définit-on le mieux le **cloud computing** ?","o":["La mise à disposition à la demande de ressources informatiques via Internet, facturées selon l\u0027usage","Un logiciel installé uniquement sur un serveur local de l\u0027entreprise","Un réseau privé reliant exclusivement les datacenters Microsoft entre eux","Une méthode de sauvegarde de données sur un disque dur externe"],"e":"Le **cloud computing** consiste à fournir à la demande des ressources comme des serveurs, du stockage ou des réseaux via Internet, avec une facturation basée sur la consommation."},{"n":2,"a":["C"],"q":"Que décrit le **modèle de responsabilité partagée** dans Azure ?","o":["La répartition égale des coûts entre tous les clients d\u0027une même région","Le partage des données clients entre plusieurs organisations utilisant Azure","La répartition des tâches de sécurité entre Microsoft et le client, variable selon le type de service (IaaS, PaaS, SaaS)","L\u0027obligation pour chaque client de gérer physiquement un serveur dans un datacenter Microsoft"],"e":"Le **modèle de responsabilité partagée** définit qui, de Microsoft ou du client, est responsable de chaque couche de sécurité et de gestion, cette répartition évoluant selon qu\u0027il s\u0027agit d\u0027IaaS, de PaaS ou de SaaS."},{"n":3,"a":["B"],"q":"Quelle proposition correspond à la définition du modèle **IaaS** (Infrastructure as a Service) ?","o":["Le fournisseur héberge et gère entièrement l\u0027application, le client y accède via un navigateur","Le fournisseur gère l\u0027infrastructure physique tandis que le client gère les systèmes d\u0027exploitation, le middleware et les applications","Le client gère uniquement le code applicatif, sans jamais toucher aux serveurs ni au réseau","Le fournisseur impose un système d\u0027exploitation et des logiciels figés, non modifiables par le client"],"e":"En **IaaS**, le fournisseur cloud prend en charge serveurs, stockage et réseau, laissant au client la gestion des systèmes d\u0027exploitation et des applications."},{"n":4,"a":["D"],"q":"Quelle proposition correspond à la définition du modèle **PaaS** (Platform as a Service) ?","o":["Le client doit installer et administrer lui-même le système d\u0027exploitation des serveurs","Le fournisseur ne propose aucun outil de développement, uniquement du stockage brut","Le client loue uniquement de l\u0027espace disque sans aucune capacité de calcul","Le fournisseur gère l\u0027infrastructure et le système d\u0027exploitation, permettant au client de se concentrer sur le développement et le déploiement de ses applications"],"e":"Le **PaaS** fournit une plateforme prête à l\u0027emploi (exécution, mise à l\u0027échelle, systèmes gérés) pour que le client se concentre sur le code et les applications."},{"n":5,"a":["A"],"q":"Quelle proposition correspond à la définition du modèle **SaaS** (Software as a Service) ?","o":["Le fournisseur héberge et gère entièrement l\u0027application, le client y accédant simplement via un navigateur ou un client léger","Le client doit configurer lui-même les serveurs virtuels hébergeant l\u0027application","Le fournisseur ne fournit que l\u0027infrastructure réseau, sans aucune application","Le client est responsable de l\u0027installation des mises à jour de sécurité du système d\u0027exploitation"],"e":"En **SaaS**, l\u0027application complète est fournie et maintenue par l\u0027éditeur ; l\u0027utilisateur se contente de s\u0027y connecter, sans gérer l\u0027infrastructure sous-jacente."},{"n":6,"a":["B"],"q":"Quelle affirmation définit le mieux le modèle de déploiement **cloud public** ?","o":["Les ressources sont hébergées exclusivement dans le datacenter de l\u0027entreprise cliente","Les ressources sont hébergées et partagées entre plusieurs clients au sein de l\u0027infrastructure du fournisseur, accessibles via Internet","Les ressources ne sont jamais accessibles depuis l\u0027extérieur du réseau de l\u0027entreprise","Les ressources sont réparties à parts égales entre deux fournisseurs cloud concurrents"],"e":"Un **cloud public** est exploité par un fournisseur tiers qui met son infrastructure mutualisée à disposition de plusieurs clients via Internet."},{"n":7,"a":["C"],"q":"Quelle affirmation définit le mieux un modèle de déploiement **hybride** ?","o":["Une infrastructure reposant uniquement sur du matériel appartenant à l\u0027entreprise","Un environnement utilisant exclusivement des services de plusieurs fournisseurs cloud publics différents","Une combinaison d\u0027une infrastructure sur site (ou privée) et de services cloud public, orchestrés ensemble","Un abonnement cloud réservé aux organisations gouvernementales uniquement"],"e":"Le modèle **hybride** relie une infrastructure sur site ou privée à des services cloud public, permettant de faire transiter des charges de travail entre les deux."},{"n":8,"a":["A"],"q":"Quelle affirmation décrit le mieux l\u0027**élasticité** dans le cloud ?","o":["La capacité à ajuster automatiquement et rapidement les ressources allouées à la hausse ou à la baisse selon la demande réelle","La capacité à ajouter manuellement des serveurs physiques supplémentaires dans un datacenter","La garantie contractuelle qu\u0027un service ne subira jamais de panne","Le fait de dupliquer systématiquement les données dans toutes les régions du monde"],"e":"L\u0027**élasticité** désigne l\u0027ajustement automatique et dynamique des ressources en fonction de la charge réelle, à la différence de la scalabilité manuelle."},{"n":9,"a":["A","C"],"q":"Lesquelles de ces caractéristiques correspondent au modèle de dépenses **OpEx** (dépenses opérationnelles) associé au cloud ?","o":["Paiement à l\u0027usage, sans investissement initial important","Nécessite l\u0027achat de matériel physique amorti sur plusieurs années","Permet d\u0027ajuster les coûts en fonction de la consommation réelle des services","Implique un engagement contractuel fixe et irrévocable de cinq ans"],"e":"Le modèle **OpEx** repose sur un paiement à l\u0027usage flexible, sans achat de matériel ni engagement long terme, contrairement au **CapEx** qui implique un investissement initial amorti."},{"n":10,"a":["B"],"q":"Comment définit-on le **serverless computing** ?","o":["Un modèle où le client doit provisionner manuellement chaque serveur avant chaque exécution","Un modèle d\u0027exécution où le fournisseur gère automatiquement l\u0027allocation et la mise à l\u0027échelle des ressources, le client ne payant que le temps d\u0027exécution du code","Un modèle où aucune facturation n\u0027est appliquée, quel que soit l\u0027usage","Un modèle réservé uniquement à l\u0027hébergement de sites web statiques"],"e":"Le **serverless** masque entièrement la gestion des serveurs : le fournisseur alloue et met à l\u0027échelle automatiquement les ressources, et la facturation suit le temps d\u0027exécution réel."},{"n":11,"a":["D"],"q":"Qu\u0027est-ce qu\u0027un **SLA** (Service Level Agreement) chez Microsoft Azure ?","o":["Un outil de calcul du coût total de possession d\u0027une infrastructure","Un document décrivant uniquement les fonctionnalités techniques d\u0027un service","Une certification de sécurité délivrée par un organisme tiers indépendant","Un engagement contractuel de Microsoft définissant les niveaux de disponibilité et de performance garantis pour un service"],"e":"Le **SLA** est un engagement contractuel précisant, par exemple, le pourcentage de disponibilité garanti d\u0027un service et les compensations prévues en cas de non-respect."},{"n":12,"a":["A"],"q":"Comment définit-on une **région Azure** ?","o":["Un ensemble d\u0027un ou plusieurs datacenters situés dans une zone géographique définie, reliés par un réseau à faible latence","Un unique bâtiment regroupant tous les serveurs Microsoft dans le monde","Un groupe logique de ressources créé librement par un administrateur","Un abonnement Azure réservé exclusivement aux organisations gouvernementales"],"e":"Une **région** Azure regroupe un ou plusieurs datacenters proches géographiquement et interconnectés par un réseau dédié à faible latence."},{"n":13,"a":["C"],"q":"À quoi servent les **paires de régions** (region pairs) dans Azure ?","o":["À réduire artificiellement le prix des services dans deux régions associées","À fusionner deux abonnements Azure distincts en un seul","À associer deux régions d\u0027une même zone géographique pour assurer la reprise d\u0027activité en cas de sinistre majeur","À imposer l\u0027utilisation simultanée de deux comptes de stockage identiques"],"e":"Les **paires de régions** associent deux régions d\u0027une même géographie afin de garantir la continuité de service et la reprise après sinistre, avec des mises à jour de plateforme décalées entre elles."},{"n":14,"a":["B"],"q":"Comment définit-on une **zone de disponibilité** (availability zone) ?","o":["Un datacenter unique partagé par toutes les régions du monde","Un emplacement physiquement distinct au sein d\u0027une région Azure, disposant de son alimentation, refroidissement et réseau propres","Une zone géographique couvrant plusieurs continents simultanément","Un espace de stockage virtuel sans existence physique réelle"],"e":"Les **zones de disponibilité** sont des emplacements physiquement séparés au sein d\u0027une même région, chacun étant indépendant en matière d\u0027alimentation, de refroidissement et de réseau, afin de limiter l\u0027impact d\u0027une panne locale."},{"n":15,"a":["A"],"q":"Quel est l\u0027ordre correct de la hiérarchie d\u0027organisation des ressources Azure, du niveau le plus large au plus précis ?","o":["Groupes d\u0027administration, abonnements, groupes de ressources, ressources","Ressources, groupes de ressources, abonnements, groupes d\u0027administration","Abonnements, groupes d\u0027administration, ressources, groupes de ressources","Groupes de ressources, groupes d\u0027administration, abonnements, ressources"],"e":"La hiérarchie Azure va du plus large au plus précis : **groupes d\u0027administration** \u003e **abonnements** \u003e **groupes de ressources** \u003e **ressources**, chaque niveau héritant des stratégies du niveau supérieur."},{"n":16,"a":["C"],"q":"Comment définit-on les **groupes identiques de machines virtuelles** (VM Scale Sets) ?","o":["Un service de stockage permettant d\u0027archiver des sauvegardes de machines virtuelles","Un outil de migration qui transfère des serveurs physiques vers Azure","Un service permettant de créer et gérer automatiquement un groupe de machines virtuelles identiques dont le nombre s\u0027ajuste selon la charge ou une planification","Un service de surveillance des performances réseau des machines virtuelles"],"e":"Les **VM Scale Sets** permettent de déployer et de gérer un ensemble de VM identiques avec une mise à l\u0027échelle automatique, horizontale, selon la demande."},{"n":17,"a":["A"],"q":"Quel service Azure permet d\u0027exécuter des conteneurs isolés rapidement, sans avoir à gérer de machines virtuelles ni de cluster d\u0027orchestration ?","o":["Azure Container Instances","Azure Kubernetes Service","Azure Virtual Machines","Azure Virtual Desktop"],"e":"**Azure Container Instances (ACI)** permet d\u0027exécuter des conteneurs isolés rapidement sans provisionner de VM ni gérer de cluster, contrairement à AKS qui orchestre des clusters complets de conteneurs."},{"n":18,"a":["D"],"q":"Comment définit-on **Azure Functions** ?","o":["Un service de stockage de fichiers volumineux accessible via un protocole FTP","Un service permettant uniquement d\u0027héberger des sites web statiques","Un outil de gestion des identités des utilisateurs externes","Un service de calcul serverless exécutant du code déclenché par un événement, sans gestion de serveur ni de scalabilité manuelle"],"e":"**Azure Functions** est un service de calcul **serverless** événementiel : le code s\u0027exécute en réponse à un déclencheur, et la plateforme gère automatiquement l\u0027infrastructure et la mise à l\u0027échelle."},{"n":19,"a":["A","C"],"q":"Lesquelles de ces affirmations décrivent correctement **Azure App Service** ?","o":["C\u0027est un service PaaS entièrement managé pour héberger des applications web, des API et des applications mobiles backend","Il nécessite que le client installe et administre lui-même le système d\u0027exploitation sous-jacent","Il prend en charge la mise à l\u0027échelle automatique et le déploiement continu depuis un dépôt de code source","Il ne fonctionne qu\u0027avec des applications développées en .NET"],"e":"**App Service** est une plateforme **PaaS** managée qui héberge des applications web ou API dans plusieurs langages, avec mise à l\u0027échelle automatique et intégration au déploiement continu, sans que le client gère l\u0027OS."},{"n":20,"a":["B"],"q":"Comment définit-on le **peering de réseaux virtuels** (VNet peering) dans Azure ?","o":["Le transfert de données chiffrées via une liaison Internet publique entre deux organisations","La mise en relation de deux réseaux virtuels Azure afin que leurs ressources communiquent via le réseau privé Microsoft, comme si elles appartenaient au même réseau","La fusion de deux abonnements Azure en un seul groupe de gestion","La duplication automatique d\u0027un réseau virtuel dans une autre région du monde"],"e":"Le **peering de VNet** relie deux réseaux virtuels via l\u0027infrastructure privée de Microsoft, offrant une communication à faible latence sans transiter par Internet public."},{"n":21,"a":["C"],"q":"Quelle est la principale différence entre **Azure VPN Gateway** et **Azure ExpressRoute** ?","o":["VPN Gateway est gratuit alors qu\u0027ExpressRoute est toujours payant","Les deux services sont strictement identiques et interchangeables","VPN Gateway établit une connexion chiffrée via Internet public, tandis qu\u0027ExpressRoute utilise une connexion privée dédiée ne transitant pas par Internet","ExpressRoute ne peut connecter que des machines virtuelles, jamais des réseaux locaux"],"e":"**VPN Gateway** chiffre le trafic transitant par Internet public, alors qu\u0027**ExpressRoute** fournit une connexion privée dédiée entre le site du client et Azure, sans passer par Internet."},{"n":22,"a":["B","D"],"q":"Parmi les options de redondance de stockage Azure suivantes, lesquelles répliquent les données sur plusieurs **zones de disponibilité** au sein d\u0027une région ?","o":["Stockage localement redondant (LRS)","Stockage à redondance de zone (ZRS)","Stockage géo-redondant (GRS)","Stockage géo-zone-redondant (GZRS)"],"e":"**ZRS** réplique les données sur plusieurs zones de disponibilité d\u0027une même région, et **GZRS** combine cette redondance de zone avec une réplication vers une région secondaire ; LRS et GRS ne répliquent pas entre zones."},{"n":23,"a":["D"],"q":"Quel niveau d\u0027accès **Blob Storage** est destiné aux données rarement consultées, acceptant un délai de récupération de plusieurs heures, pour le coût de stockage le plus bas ?","o":["Niveau Hot (fréquent)","Niveau Cool (occasionnel)","Niveau Premium","Niveau Archive"],"e":"Le niveau **Archive** offre le coût de stockage le plus bas mais nécessite une réhydratation pouvant prendre plusieurs heures avant de pouvoir accéder aux données."},{"n":24,"a":["A"],"q":"Comment définit-on **Microsoft Entra ID** ?","o":["Un service cloud de gestion des identités et des accès permettant l\u0027authentification des utilisateurs et la gestion des applications","Un service de stockage de fichiers destiné aux grandes entreprises","Un outil de surveillance des performances réseau des machines virtuelles","Un service de sauvegarde automatique des bases de données SQL"],"e":"**Microsoft Entra ID** (anciennement Azure AD) est le service cloud de gestion des identités et des accès d\u0027Azure, utilisé pour authentifier utilisateurs et applications."},{"n":25,"a":["C"],"q":"Comment définit-on l\u0027**authentification multifacteur** (MFA) ?","o":["L\u0027utilisation d\u0027un seul mot de passe complexe pour sécuriser un compte","La connexion automatique sans aucune vérification d\u0027identité","L\u0027exigence d\u0027au moins deux preuves d\u0027identité distinctes, par exemple un mot de passe et un code envoyé sur un appareil mobile, pour accéder à une ressource","Le partage d\u0027un même mot de passe entre plusieurs utilisateurs d\u0027une équipe"],"e":"La **MFA** renforce la sécurité en exigeant au moins deux facteurs de vérification distincts avant d\u0027accorder l\u0027accès, réduisant le risque lié au seul vol d\u0027un mot de passe."},{"n":26,"a":["B"],"q":"Comment définit-on le **contrôle d\u0027accès en fonction du rôle** (Azure RBAC) ?","o":["Un mécanisme qui chiffre automatiquement toutes les données stockées dans un compte de stockage","Un système permettant d\u0027attribuer des autorisations précises aux utilisateurs selon leur rôle, sur un périmètre défini comme un abonnement ou un groupe de ressources","Un outil qui supprime automatiquement les ressources inactives depuis plus de 30 jours","Un service de sauvegarde incrémentielle des machines virtuelles"],"e":"Le **RBAC** permet d\u0027attribuer des rôles (lecteur, contributeur, propriétaire, etc.) à des utilisateurs ou groupes, avec un périmètre défini au niveau du groupe d\u0027administration, de l\u0027abonnement, du groupe de ressources ou de la ressource."},{"n":27,"a":["A"],"q":"Comment définit-on le modèle de sécurité **Confiance zéro** (Zero Trust) ?","o":["Un modèle qui vérifie explicitement chaque demande d\u0027accès, sans faire confiance par défaut à un utilisateur ou un appareil, même à l\u0027intérieur du réseau de l\u0027entreprise","Un modèle qui accorde une confiance totale à tout utilisateur situé à l\u0027intérieur du réseau d\u0027entreprise","Un modèle qui supprime toute authentification pour simplifier l\u0027accès aux ressources","Un modèle réservé uniquement aux environnements sur site, non applicable au cloud"],"e":"Le principe de la **Confiance zéro** est de ne jamais faire confiance implicitement et de toujours vérifier explicitement chaque demande d\u0027accès, quel que soit son origine réseau."},{"n":28,"a":["C"],"q":"Quels éléments influencent principalement le coût des services Azure consommés ?","o":["Uniquement la taille de l\u0027équipe informatique de l\u0027entreprise cliente","Le nombre d\u0027employés de Microsoft affectés au support technique","Le type et la quantité de ressources utilisées, la région de déploiement et la durée d\u0027utilisation des services","La couleur du thème choisi dans le portail Azure"],"e":"Le coût d\u0027un service Azure dépend notamment du type et du volume de ressources consommées, de la région choisie et de la durée pendant laquelle les ressources sont utilisées."},{"n":29,"a":["B"],"q":"À quoi sert la **calculatrice de prix Azure** (Pricing Calculator) ?","o":["À comparer le coût total d\u0027une infrastructure sur site avec celui d\u0027Azure sur plusieurs années","À estimer le coût mensuel des services Azure avant leur déploiement, selon la configuration choisie","À appliquer automatiquement des remises sur les abonnements existants","À générer des factures détaillées pour les abonnements déjà actifs"],"e":"La **calculatrice de prix** permet d\u0027estimer à l\u0027avance le coût mensuel d\u0027une configuration de services Azure, avant même de les déployer."},{"n":30,"a":["A"],"q":"À quoi sert la **calculatrice TCO** (coût total de possession) ?","o":["À comparer le coût total d\u0027une infrastructure sur site existante avec le coût équivalent d\u0027une migration vers Azure","À estimer uniquement le prix d\u0027une seule machine virtuelle","À définir des budgets mensuels et des alertes de dépenses","À auditer la conformité des ressources Azure aux stratégies internes"],"e":"La **calculatrice TCO** compare les coûts actuels d\u0027une infrastructure sur site (matériel, électricité, personnel, etc.) au coût projeté d\u0027une migration vers Azure."},{"n":31,"a":["D"],"q":"Que permet de faire **Microsoft Cost Management** ?","o":["Attribuer des rôles de sécurité aux utilisateurs d\u0027un abonnement","Déployer automatiquement des ressources via des modèles ARM","Classifier les données sensibles selon leur niveau de confidentialité","Surveiller, analyser les dépenses et définir des budgets avec des alertes pour les ressources Azure"],"e":"**Microsoft Cost Management** permet de suivre les dépenses en temps réel, d\u0027analyser les tendances de coûts et de configurer des budgets avec des alertes."},{"n":32,"a":["A"],"q":"Comment définit-on les **balises** (tags) appliquées aux ressources Azure ?","o":["Des paires nom/valeur associées aux ressources, utilisées notamment pour organiser les coûts par département, projet ou environnement","Des certificats numériques garantissant l\u0027authenticité d\u0027une ressource","Des règles empêchant la suppression accidentelle d\u0027une ressource critique","Des scripts automatisant le déploiement d\u0027une infrastructure complète"],"e":"Les **balises** sont des métadonnées sous forme de paires nom/valeur permettant de classer et de regrouper les ressources, notamment pour le suivi des coûts par projet ou service."},{"n":33,"a":["C"],"q":"Que permet de faire **Azure Policy** ?","o":["Chiffrer automatiquement toutes les communications réseau entre les régions","Fusionner plusieurs abonnements Azure en un seul groupe d\u0027administration","Appliquer et auditer des règles de conformité sur les ressources, par exemple interdire leur création dans certaines régions","Calculer le coût total de possession d\u0027une infrastructure sur site"],"e":"**Azure Policy** évalue et applique des règles de conformité organisationnelles, pouvant par exemple refuser ou signaler la création de ressources non conformes, comme celles situées dans une région interdite."},{"n":34,"a":["B"],"q":"À quoi servent les **verrous de ressources** (resource locks) dans Azure ?","o":["À chiffrer le contenu d\u0027une ressource de stockage","À empêcher la suppression ou la modification accidentelle d\u0027une ressource critique, indépendamment des autorisations RBAC accordées","À limiter la bande passante réseau disponible pour une ressource","À définir automatiquement un budget maximal pour un abonnement"],"e":"Un **verrou de ressource** (type CanNotDelete ou ReadOnly) protège une ressource contre une suppression ou modification accidentelle, même si l\u0027utilisateur dispose des permissions RBAC nécessaires."},{"n":35,"a":["D"],"q":"Que permet de faire **Microsoft Purview** ?","o":["Déployer automatiquement des machines virtuelles identiques à grande échelle","Gérer les connexions VPN entre un site local et Azure","Surveiller les performances applicatives en temps réel","Découvrir, cataloguer et classifier les données de l\u0027organisation, y compris le suivi de leur conformité réglementaire"],"e":"**Microsoft Purview** est une solution de gouvernance des données permettant de les découvrir, les cataloguer, les classifier et de suivre leur conformité à travers l\u0027organisation."},{"n":36,"a":["A","C"],"q":"Lesquelles de ces affirmations décrivent correctement l\u0027**infrastructure en tant que code** (IaC) via les modèles ARM ou Bicep dans Azure ?","o":["Elle permet de déployer des ressources de façon déclarative et reproductible","Elle nécessite de recréer manuellement chaque ressource via le portail à chaque déploiement","Elle facilite le versionnement de l\u0027infrastructure dans un système de contrôle de code source","Elle fonctionne uniquement avec des machines virtuelles sous Windows"],"e":"Les modèles **ARM** et **Bicep** décrivent l\u0027infrastructure de façon déclarative, permettant des déploiements reproductibles et un suivi des versions via un dépôt de code source."},{"n":37,"a":["B"],"q":"Comment définit-on **Azure Cloud Shell** ?","o":["Un service de stockage de scripts partagé entre plusieurs abonnements","Un environnement de ligne de commande accessible depuis un navigateur, préconfiguré avec Azure CLI et Azure PowerShell","Un outil graphique exclusivement destiné à la création de machines virtuelles","Un service permettant de migrer des bases de données SQL vers Azure"],"e":"**Azure Cloud Shell** est un shell interactif accessible directement depuis le navigateur ou le portail Azure, avec Azure CLI et Azure PowerShell déjà installés."},{"n":38,"a":["C"],"q":"À quoi sert **Azure Arc** ?","o":["À créer des réseaux virtuels isolés entre plusieurs abonnements Azure","À remplacer entièrement les machines virtuelles par des conteneurs","À étendre la gestion et la gouvernance Azure à des ressources situées en dehors d\u0027Azure, comme des serveurs sur site ou dans d\u0027autres clouds","À calculer automatiquement le coût total de possession d\u0027une infrastructure"],"e":"**Azure Arc** permet de gérer de façon unifiée, depuis Azure, des ressources hébergées en dehors d\u0027Azure : serveurs sur site, autres clouds ou environnements en périphérie."},{"n":39,"a":["A"],"q":"Que fournit **Azure Advisor** ?","o":["Des recommandations personnalisées pour optimiser les coûts, la sécurité, la fiabilité et les performances des ressources","Un rapport sur la disponibilité globale de la plateforme Azure dans le monde","Un catalogue des données sensibles de l\u0027organisation","Un outil de migration automatique des serveurs physiques vers des machines virtuelles"],"e":"**Azure Advisor** analyse la configuration des ressources déployées et propose des recommandations personnalisées pour en améliorer les coûts, la sécurité, la fiabilité et les performances."},{"n":40,"a":["B"],"q":"Quelle est la différence principale entre **Azure Service Health** et **Azure Monitor** ?","o":["Azure Service Health analyse les journaux applicatifs du client tandis qu\u0027Azure Monitor gère les incidents de la plateforme Azure","Azure Service Health informe sur l\u0027état de la plateforme Azure et les incidents affectant les services du client, tandis qu\u0027Azure Monitor collecte et analyse les données de performance et les journaux des ressources du client","Les deux services sont identiques et interchangeables","Azure Service Health gère uniquement la facturation, tandis qu\u0027Azure Monitor gère uniquement la sécurité"],"e":"**Azure Service Health** signale les incidents et la santé de la plateforme Azure elle-même, alors qu\u0027**Azure Monitor** collecte des métriques et journaux propres aux ressources déployées par le client."}]},{"id":2,"title":"Examen blanc 2 — Mises en situation","questions":[{"n":1,"a":["A"],"q":"Une jeune startup veut lancer son service web sans acheter aucun serveur physique et ne payer que selon son usage réel. Quel concept du cloud computing correspond le mieux à cette approche ?","o":["Le modèle de consommation à la demande (pay-as-you-go)","L\u0027achat de licences logicielles perpétuelles","L\u0027investissement en capital (CapEx) dans un datacenter privé","La signature d\u0027un bail immobilier longue durée"],"e":"Le **cloud computing** permet de consommer des ressources à la demande et de payer uniquement ce qui est utilisé, sans investissement initial."},{"n":2,"a":["B"],"q":"Une entreprise migre ses serveurs applicatifs vers des machines virtuelles Azure et souhaite garder un contrôle total sur le système d\u0027exploitation, les correctifs et les logiciels installés. Quel modèle de service cloud correspond à ce besoin ?","o":["SaaS","IaaS","PaaS","Hébergement on-premises classique"],"e":"**IaaS** fournit l\u0027infrastructure virtualisée (VM, réseau, stockage) tout en laissant le client gérer l\u0027OS et les applications."},{"n":3,"a":["C"],"q":"Une équipe de développement veut déployer rapidement une application web sans gérer ni serveurs, ni système d\u0027exploitation, ni environnement d\u0027exécution, tout en gardant la main sur le code. Quel modèle de service convient ?","o":["IaaS","SaaS","PaaS","On-premises"],"e":"**PaaS** fournit une plateforme managée sur laquelle le client déploie uniquement son code applicatif."},{"n":4,"a":["B"],"q":"Les employés d\u0027une PME utilisent une messagerie et une suite bureautique accessibles via un navigateur, sans aucune installation ni maintenance de serveur de leur côté. De quel modèle s\u0027agit-il ?","o":["PaaS","SaaS","IaaS","Cloud privé"],"e":"**SaaS** délivre une application complète prête à l\u0027emploi, l\u0027éditeur gérant entièrement l\u0027infrastructure."},{"n":5,"a":["B"],"q":"Dans un scénario IaaS sur Azure, qui est responsable de l\u0027application des correctifs de sécurité du système d\u0027exploitation de la machine virtuelle ?","o":["Microsoft, car Azure gère toute l\u0027infrastructure","Le client, car il contrôle l\u0027OS invité dans ce modèle","Un tiers désigné obligatoirement par Microsoft","Personne, les correctifs sont automatiques dans tous les modèles"],"e":"Dans le **modèle de responsabilité partagée**, le client reste responsable de l\u0027OS invité en IaaS, Microsoft gérant l\u0027infrastructure physique."},{"n":6,"a":["C"],"q":"Une banque doit conserver ses données clients les plus sensibles dans son propre datacenter pour des raisons réglementaires, tout en hébergeant son site public dans le cloud pour profiter de son élasticité. Quel modèle de déploiement correspond ?","o":["Cloud public uniquement","Cloud privé uniquement","Cloud hybride","Edge computing"],"e":"Le **cloud hybride** combine ressources on-premises et cloud public, permettant de garder les données sensibles en interne."},{"n":7,"a":["A"],"q":"Un groupe industriel utilise à la fois Azure et un autre fournisseur cloud concurrent afin de ne pas dépendre d\u0027un seul éditeur. Comment appelle-t-on cette stratégie ?","o":["Une approche multicloud","Une approche hybride","Une architecture serverless","Une approche on-premises"],"e":"Le **multicloud** consiste à utiliser plusieurs fournisseurs cloud différents, notamment pour éviter la dépendance à un seul prestataire."},{"n":8,"a":["B"],"q":"Une entreprise qui louait auparavant des serveurs physiques (dépense amortie sur plusieurs années) bascule vers Azure et paie désormais mensuellement selon sa consommation réelle. Comment qualifie-t-on ce changement financier ?","o":["Passage d\u0027une dépense opérationnelle à une dépense d\u0027investissement","Passage d\u0027une dépense d\u0027investissement (CapEx) à une dépense opérationnelle (OpEx)","La suppression totale des coûts informatiques","Le passage à une licence perpétuelle"],"e":"Le cloud transforme les dépenses d\u0027investissement (**CapEx**) en dépenses opérationnelles (**OpEx**), payées au fil de l\u0027utilisation."},{"n":9,"a":["A","B"],"q":"Un site e-commerce connaît un pic de trafic important chaque année lors d\u0027une opération commerciale. Quelles sont deux approches possibles pour adapter la capacité sur Azure ?","o":["Augmenter la taille (vCPU/RAM) des VM existantes","Ajouter automatiquement des instances supplémentaires identiques","Réduire le nombre de zones de disponibilité utilisées","Désactiver la redondance du stockage pendant le pic"],"e":"On peut adapter la capacité verticalement (plus grosse VM) ou horizontalement (plus d\u0027instances) : ces deux approches constituent la **mise à l\u0027échelle**."},{"n":10,"a":["A"],"q":"Un éditeur de logiciels promet contractuellement à ses clients que son service Azure sera disponible au moins 99,9 % du temps chaque mois, sous peine de compensation. Comment appelle-t-on cet engagement ?","o":["Un contrat de niveau de service (SLA)","Une politique Azure Policy","Un verrou de ressource","Une zone de disponibilité"],"e":"Le **SLA** (Service Level Agreement) définit formellement l\u0027engagement de disponibilité garanti par le fournisseur."},{"n":11,"a":["A"],"q":"Une petite entreprise veut exécuter un bout de code déclenché uniquement lors de la réception d\u0027un fichier, sans jamais provisionner de serveur, et ne payer que le temps d\u0027exécution réel. Quel concept décrit le mieux ce besoin ?","o":["L\u0027informatique serverless (sans serveur)","Le cloud privé","L\u0027investissement CapEx","La haute disponibilité"],"e":"Le modèle **serverless** exécute du code à la demande et ne facture que le temps d\u0027exécution réel, sans gestion d\u0027infrastructure."},{"n":12,"a":["B"],"q":"Une entreprise veut que ses données soient automatiquement répliquées vers une seconde région Azure suffisamment distante, afin de pouvoir reprendre son activité en cas de sinistre régional majeur. Quel concept Azure répond à ce besoin ?","o":["Les zones de disponibilité","Les régions jumelées (paired regions)","Les groupes à haute disponibilité","Un groupe d\u0027administration (management group)"],"e":"Les **régions jumelées** associent deux régions Azure distantes conçues pour la reprise après sinistre, avec réplication et priorité de restauration."},{"n":13,"a":["A"],"q":"Une application critique doit rester disponible même si un datacenter entier d\u0027une région Azure subit une panne. Quelle fonctionnalité permet de répartir les ressources sur des emplacements physiquement distincts au sein d\u0027une même région ?","o":["Les zones de disponibilité","Les régions souveraines","Le peering de réseaux virtuels","Azure Front Door uniquement"],"e":"Les **zones de disponibilité** sont des emplacements physiquement séparés, avec alimentation et réseau indépendants, au sein d\u0027une même région."},{"n":14,"a":["B"],"q":"Le service IT d\u0027un grand groupe veut appliquer une même politique de conformité à plusieurs souscriptions Azure de différentes filiales, en une seule opération. Quel niveau de la hiérarchie Azure doit-il utiliser ?","o":["Un groupe de ressources","Un groupe d\u0027administration (management group)","Une zone de disponibilité","Un tag de ressource"],"e":"Les **management groups** se situent au-dessus des souscriptions et permettent d\u0027appliquer des stratégies communes à plusieurs souscriptions."},{"n":15,"a":["C"],"q":"Un site web connaît des variations de trafic imprévisibles et l\u0027équipe veut qu\u0027Azure ajoute ou retire automatiquement des machines virtuelles identiques selon la charge. Quel service est conçu pour cela ?","o":["Azure Virtual Desktop","Les groupes à haute disponibilité (availability sets)","Les groupes identiques de machines virtuelles (VM Scale Sets)","Azure Container Instances"],"e":"Les **VM Scale Sets** permettent de créer et gérer un groupe de VM identiques qui s\u0027adaptent automatiquement à la demande."},{"n":16,"a":["A"],"q":"Une entreprise veut permettre à ses employés en télétravail d\u0027accéder, depuis n\u0027importe quel appareil, à un bureau Windows complet hébergé de façon centralisée dans Azure. Quel service répond à ce besoin ?","o":["Azure Virtual Desktop","Azure App Service","Azure Container Apps","Azure Bastion"],"e":"**Azure Virtual Desktop** permet d\u0027accéder à distance à un environnement de bureau et d\u0027applications Windows centralisé et managé."},{"n":17,"a":["B"],"q":"Un développeur veut exécuter rapidement un seul conteneur isolé pour une tâche ponctuelle, sans provisionner de cluster ni gérer d\u0027orchestrateur. Quel service Azure est le plus adapté ?","o":["Azure Kubernetes Service (AKS)","Azure Container Instances (ACI)","Azure Virtual Desktop","Azure Functions Premium uniquement"],"e":"**Azure Container Instances** permet d\u0027exécuter des conteneurs isolés rapidement, sans machines virtuelles ni orchestrateur à gérer."},{"n":18,"a":["B"],"q":"Une entreprise exploite des dizaines de microservices conteneurisés et a besoin d\u0027un orchestrateur complet pour gérer leur déploiement et leur résilience à grande échelle. Quel service Azure correspond ?","o":["Azure Container Instances","Azure Kubernetes Service (AKS)","Azure Files","Azure Logic Apps"],"e":"**AKS** est un service managé de Kubernetes qui orchestre le déploiement et la mise à l\u0027échelle de nombreux conteneurs."},{"n":19,"a":["A"],"q":"Une entreprise veut exécuter un petit bout de code uniquement lorsqu\u0027un fichier est déposé dans un espace de stockage, et ne payer que les quelques secondes d\u0027exécution réelle, sans gérer de serveur. Quel service Azure correspond le mieux ?","o":["Azure Functions","Azure Virtual Machines","Azure Kubernetes Service","Azure App Service en plan dédié"],"e":"**Azure Functions** est une solution serverless événementielle qui exécute du code à la demande et facture uniquement l\u0027exécution réelle."},{"n":20,"a":["A"],"q":"Une équipe veut héberger une application web ASP.NET sans gérer de machine virtuelle ni de système d\u0027exploitation, tout en bénéficiant de la mise à l\u0027échelle automatique. Quel service choisir ?","o":["Azure App Service","Azure Container Instances","Azure Bastion","Azure ExpressRoute"],"e":"**Azure App Service** est une plateforme PaaS entièrement managée dédiée à l\u0027hébergement d\u0027applications web et d\u0027API."},{"n":21,"a":["B"],"q":"Deux réseaux virtuels Azure situés dans des régions différentes doivent communiquer entre eux via le réseau principal de Microsoft, sans transiter par Internet public. Quelle fonctionnalité permet cela ?","o":["Azure VPN Gateway","Le peering de réseaux virtuels (VNet peering)","Azure DNS","Un point de terminaison public"],"e":"Le **peering de VNet** connecte deux réseaux virtuels via le réseau principal Microsoft, offrant une communication privée à faible latence."},{"n":22,"a":["B"],"q":"Une entreprise financière veut établir une connexion privée et dédiée entre son datacenter et Azure, avec une latence prévisible, sans transiter par Internet public. Quel service Azure recommander ?","o":["Azure VPN Gateway standard","Azure ExpressRoute","Azure Front Door","Azure DNS"],"e":"**ExpressRoute** établit une connexion privée dédiée vers Azure en contournant Internet public, contrairement au VPN Gateway qui utilise un tunnel chiffré sur Internet."},{"n":23,"a":["B","D"],"q":"Une entreprise veut que ses données de stockage Azure restent accessibles même en cas de panne complète de la région principale. Parmi les options de redondance suivantes, lesquelles répliquent les données vers une région secondaire distante ?","o":["Stockage localement redondant (LRS)","Stockage géo-redondant (GRS)","Stockage à zone redondante (ZRS)","Stockage géo-zone-redondant (GZRS)"],"e":"**GRS** et **GZRS** répliquent les données vers une région secondaire distante, alors que LRS et ZRS ne protègent qu\u0027au sein de la région principale."},{"n":24,"a":["C"],"q":"Une société d\u0027archivage légal doit conserver des documents qu\u0027elle ne consultera presque jamais pendant plusieurs années et veut minimiser le coût de stockage, en acceptant un délai de récupération plus long. Quel niveau d\u0027accès Blob Storage choisir ?","o":["Niveau Chaud (Hot)","Niveau Froid (Cool)","Niveau Archive","Niveau Premium"],"e":"Le niveau **Archive** offre le coût de stockage le plus bas, adapté aux données rarement consultées, au prix d\u0027un temps de récupération plus long."},{"n":25,"a":["A","C"],"q":"Une entreprise veut renforcer la sécurité des connexions à Microsoft Entra ID en exigeant une vérification supplémentaire en plus du mot de passe. Parmi les éléments suivants, lesquels sont des facteurs d\u0027authentification multifacteur valides ?","o":["Une notification approuvée depuis Microsoft Authenticator","Une question secrète définie par l\u0027utilisateur","Un code à usage unique envoyé par SMS ou généré par une application","Le simple fait de ressaisir le même mot de passe"],"e":"L\u0027**authentification multifacteur** s\u0027appuie sur des facteurs vérifiables comme une notification d\u0027application ou un code à usage unique ; les questions secrètes ne sont pas un facteur MFA valide."},{"n":26,"a":["B"],"q":"Un administrateur veut accorder à un employé le droit de uniquement redémarrer et consulter les machines virtuelles d\u0027un groupe de ressources précis, sans pouvoir les supprimer ni modifier le réseau. Quel mécanisme Azure permet cela ?","o":["Azure Policy","Le contrôle d\u0027accès en fonction du rôle (Azure RBAC)","Un verrou de ressource","Microsoft Purview"],"e":"**Azure RBAC** permet d\u0027attribuer des rôles avec des permissions précises à un périmètre donné comme un groupe de ressources."},{"n":27,"a":["A"],"q":"Une entreprise veut obtenir une évaluation continue de son niveau de sécurité sur l\u0027ensemble de ses ressources Azure, avec des recommandations concrètes pour corriger les vulnérabilités détectées. Quel service utiliser ?","o":["Microsoft Defender for Cloud","Azure Advisor uniquement","Azure Monitor","Service Trust Portal"],"e":"**Microsoft Defender for Cloud** évalue en continu la posture de sécurité des ressources et fournit des recommandations priorisées."},{"n":28,"a":["A"],"q":"Avant de déployer une nouvelle solution sur Azure, une entreprise veut estimer précisément le coût mensuel prévisionnel selon les services choisis, la région et le volume prévu, sans encore rien déployer. Quel outil utiliser ?","o":["Le calculateur de prix Azure (Pricing Calculator)","Microsoft Cost Management","Azure Advisor","Le calculateur TCO"],"e":"Le **calculateur de prix Azure** permet d\u0027estimer le coût prévisionnel d\u0027une architecture avant son déploiement."},{"n":29,"a":["B"],"q":"Une entreprise qui possède son propre datacenter veut comparer le coût total de possession de son infrastructure actuelle avec celui d\u0027une migration vers Azure, en intégrant matériel, électricité et personnel. Quel outil est le plus adapté ?","o":["Le calculateur de prix Azure","Le calculateur TCO (Total Cost of Ownership)","Azure Monitor","Azure Policy"],"e":"Le **calculateur TCO** compare le coût total d\u0027une infrastructure on-premises existante avec le coût équivalent sur Azure."},{"n":30,"a":["A"],"q":"Le responsable financier d\u0027une entreprise veut suivre en temps réel les dépenses Azure réelles de chaque département et recevoir une alerte automatique en cas de dépassement d\u0027un budget mensuel. Quel service utiliser ?","o":["Microsoft Cost Management","Azure Advisor","Azure Policy","Azure Service Health"],"e":"**Microsoft Cost Management** permet d\u0027analyser les dépenses réelles, de définir des budgets et de déclencher des alertes de dépassement."},{"n":31,"a":["B"],"q":"Une entreprise possède des centaines de ressources Azure partagées entre plusieurs projets et souhaite ensuite ventiler précisément les coûts par projet et par département dans ses rapports financiers. Que doit-elle mettre en place ?","o":["Des verrous de ressources","Des balises (tags) de métadonnées","Des zones de disponibilité","Des groupes d\u0027administration"],"e":"Les **tags** sont des paires nom/valeur attachées aux ressources qui permettent notamment de ventiler les coûts par projet ou département."},{"n":32,"a":["A"],"q":"Une organisation possède des données sensibles dispersées entre des bases de données on-premises, Azure et d\u0027autres clouds, et veut un inventaire centralisé classifiant automatiquement ces données selon leur sensibilité. Quel service répond à ce besoin ?","o":["Microsoft Purview","Azure Policy","Azure Advisor","Azure Monitor"],"e":"**Microsoft Purview** offre une gouvernance unifiée des données, avec découverte et classification à travers les environnements hybrides."},{"n":33,"a":["B"],"q":"Une entreprise veut empêcher automatiquement la création de toute machine virtuelle en dehors de deux régions Azure autorisées, quelle que soit l\u0027équipe qui tente de la déployer. Quel service permet d\u0027imposer cette règle ?","o":["Azure RBAC","Azure Policy","Un verrou de ressource","Microsoft Cost Management"],"e":"**Azure Policy** permet de définir des règles évaluées automatiquement et d\u0027empêcher le déploiement de ressources non conformes."},{"n":34,"a":["A"],"q":"Un administrateur veut empêcher que la base de données de production ne soit supprimée accidentellement par un collègue disposant pourtant des droits de contributeur sur la souscription. Quelle fonctionnalité Azure utiliser ?","o":["Un verrou de ressource (resource lock) en mode CanNotDelete","Azure Policy en mode audit","Un tag nomme production","Microsoft Purview"],"e":"Un **verrou de ressource** de type CanNotDelete empêche la suppression de la ressource, même par un utilisateur disposant des permissions de contributeur."},{"n":35,"a":["A"],"q":"Une équipe de développement veut surveiller en continu les performances de son application web en production, détecter automatiquement les anomalies (temps de réponse, taux d\u0027erreur) et visualiser des journaux détaillés. Quel service est spécifiquement conçu pour cela ?","o":["Application Insights (fonctionnalité d\u0027Azure Monitor)","Azure Advisor","Microsoft Purview","Azure Policy"],"e":"**Application Insights**, composant d\u0027Azure Monitor, collecte la télémétrie des applications et permet de détecter automatiquement des anomalies de performance."},{"n":36,"a":["B"],"q":"Une entreprise possède des serveurs physiques dans son propre datacenter ainsi que des machines virtuelles chez un autre fournisseur cloud, et souhaite les gérer et leur appliquer des politiques depuis Azure comme s\u0027il s\u0027agissait de ressources Azure natives. Quel service permet cela ?","o":["Azure Migrate","Azure Arc","Azure Site Recovery","Azure Bastion"],"e":"**Azure Arc** étend la gestion, la gouvernance et les outils Azure, dont Azure Policy, à des serveurs situés en dehors d\u0027Azure, y compris on-premises et sur d\u0027autres clouds."},{"n":37,"a":["A","C"],"q":"Une équipe DevOps veut décrire son infrastructure Azure (réseaux, VM, stockage) sous forme de code afin de pouvoir redéployer un environnement identique de façon fiable et répétable. Parmi les éléments suivants, lesquels sont des formats de modèles déclaratifs d\u0027infrastructure as code pris en charge nativement par Azure Resource Manager ?","o":["Un modèle ARM au format JSON","Un script Azure CLI impératif","Un fichier Bicep","Une commande PowerShell exécutée manuellement"],"e":"Les **modèles ARM** (JSON) et les **fichiers Bicep** sont des langages déclaratifs d\u0027infrastructure as code, alors que les scripts CLI ou PowerShell sont des approches impératives."},{"n":38,"a":["A"],"q":"Un administrateur veut exécuter des commandes Azure CLI et PowerShell directement depuis son navigateur, sans rien installer sur son poste, en utilisant un stockage persistant pour ses scripts. Quel outil utiliser ?","o":["Azure Cloud Shell","Azure Resource Manager","Visual Studio Code en local","Azure Arc"],"e":"**Azure Cloud Shell** est un environnement shell interactif accessible depuis le navigateur, avec Bash ou PowerShell, sans installation locale."},{"n":39,"a":["B"],"q":"Une entreprise veut recevoir des recommandations personnalisées automatiques pour réduire ses coûts et améliorer la sécurité, la fiabilité et les performances de ses ressources Azure actuelles. Quel service consulter ?","o":["Azure Monitor","Azure Advisor","Azure Service Health","Application Insights"],"e":"**Azure Advisor** analyse la configuration des ressources pour proposer des recommandations personnalisées sur le coût, la sécurité, la fiabilité et les performances."},{"n":40,"a":["B"],"q":"Une équipe veut être informée automatiquement lorsqu\u0027un incident Azure en cours affecte spécifiquement les ressources et la région utilisées par sa propre souscription, plutôt que de consulter un état général public de la plateforme. Quel service utiliser ?","o":["Azure Status (page publique)","Azure Service Health","Application Insights","Azure Policy"],"e":"**Azure Service Health** fournit un tableau de bord personnalisé des incidents impactant spécifiquement les ressources de l\u0027abonnement du client, contrairement à la page Azure Status qui est générale."}]},{"id":3,"title":"Examen blanc 3 — Comparaisons de services proches","questions":[{"n":1,"a":["A"],"q":"Qu\u0027est-ce qui distingue fondamentalement le cloud computing d\u0027une infrastructure informatique traditionnelle hébergée sur site ?","o":["Le client paie à l\u0027usage les ressources consommées plutôt que d\u0027acheter du matériel à l\u0027avance","Le client doit obligatoirement installer ses serveurs dans son propre datacenter","Le client ne peut utiliser qu\u0027un seul type de service à la fois","Le client doit renouveler son matériel tous les trois ans"],"e":"Le cloud computing repose sur un modèle de consommation à la demande avec facturation à l\u0027usage, alors que l\u0027informatique traditionnelle nécessite un investissement matériel initial (**CapEx**)."},{"n":2,"a":["A","C"],"q":"Dans un modèle **IaaS**, lesquelles des tâches suivantes restent sous la responsabilité du client et non du fournisseur cloud ?","o":["L\u0027application des correctifs de sécurité sur le système d\u0027exploitation","La sécurité physique des datacenters","La classification et la protection des données stockées","La maintenance du câblage réseau physique"],"e":"En **IaaS**, le fournisseur gère l\u0027infrastructure physique (datacenters, réseau), tandis que le client reste responsable du système d\u0027exploitation, des applications et des données."},{"n":3,"a":["A"],"q":"Quelle est la différence entre un modèle hybride et un modèle multicloud ?","o":["Le modèle hybride combine environnement sur site et cloud public, tandis que le modèle multicloud utilise plusieurs fournisseurs cloud publics","Le modèle hybride utilise uniquement des conteneurs, contrairement au multicloud","Le modèle multicloud n\u0027autorise qu\u0027un seul fournisseur mais plusieurs régions","Il n\u0027existe aucune différence, ce sont deux noms pour le même concept"],"e":"Le **cloud hybride** associe ressources locales et cloud public, alors que le **multicloud** consiste à utiliser les services de plusieurs fournisseurs cloud différents."},{"n":4,"a":["A"],"q":"Comment le passage au cloud transforme-t-il généralement les dépenses informatiques d\u0027une entreprise ?","o":["Il remplace les dépenses d\u0027investissement (CapEx) par des dépenses opérationnelles (OpEx)","Il transforme les dépenses opérationnelles en dépenses d\u0027investissement","Il supprime toute notion de coût pour l\u0027entreprise","Il oblige à payer la totalité des coûts sur plusieurs années à l\u0027avance"],"e":"Le cloud permet de payer les ressources au fur et à mesure de leur utilisation (**OpEx**), évitant l\u0027achat anticipé de matériel (**CapEx**)."},{"n":5,"a":["A"],"q":"Quelle est la différence entre la montée en puissance verticale (scale up) et la montée en puissance horizontale (scale out) ?","o":["La montée en puissance verticale augmente la capacité d\u0027une seule instance, tandis que l\u0027horizontale ajoute des instances supplémentaires","La montée en puissance horizontale consiste à remplacer un serveur par un serveur plus puissant","Les deux termes désignent exactement la même opération","La montée en puissance verticale ajoute toujours de nouvelles régions Azure"],"e":"Le **scale up** (vertical) augmente les ressources d\u0027une instance existante (CPU, RAM), alors que le **scale out** (horizontal) ajoute des instances identiques supplémentaires."},{"n":6,"a":["A"],"q":"Quelle est la différence entre la scalabilité et l\u0027élasticité dans le cloud ?","o":["La scalabilité désigne la capacité à ajuster les ressources selon la demande, l\u0027élasticité ajoute l\u0027automatisation de cet ajustement en temps réel","La scalabilité ne concerne que la réduction des coûts, l\u0027élasticité que leur augmentation","L\u0027élasticité s\u0027applique uniquement aux bases de données relationnelles","Ce sont deux synonymes stricts sans aucune nuance"],"e":"La **scalabilité** est la capacité générale à augmenter ou réduire les ressources, tandis que l\u0027**élasticité** y ajoute un ajustement automatique et rapide en fonction de la charge réelle."},{"n":7,"a":["A"],"q":"Quelle est la différence principale entre la haute disponibilité et la reprise après sinistre (disaster recovery) ?","o":["La haute disponibilité vise à maintenir le service opérationnel en continu, la reprise après sinistre vise à restaurer le service après un incident majeur","La reprise après sinistre garantit qu\u0027aucune panne ne peut jamais survenir","La haute disponibilité ne s\u0027applique qu\u0027aux applications SaaS","Ce sont deux termes interchangeables qui désignent exactement la même chose"],"e":"La **haute disponibilité** minimise les interruptions de service, tandis que la **reprise après sinistre** définit le processus de restauration suite à un événement catastrophique."},{"n":8,"a":["A"],"q":"Une application dépend de deux services ayant chacun un SLA de 99,9 %. Quelle est la différence entre le SLA individuel de chaque service et le SLA composite de l\u0027application ?","o":["Le SLA composite est généralement inférieur, car la disponibilité globale résulte de la multiplication des probabilités de disponibilité de chaque service","Le SLA composite est toujours supérieur à chacun des SLA individuels","Le SLA composite est la moyenne arithmétique simple des deux SLA","Le SLA composite n\u0027existe pas dans le cloud, seul le SLA individuel compte"],"e":"Lorsque plusieurs services dépendants sont combinés, le **SLA composite** est obtenu en multipliant les disponibilités, ce qui donne généralement un résultat inférieur à chaque SLA pris isolément."},{"n":9,"a":["A"],"q":"Quelle est la différence entre une architecture serverless et une machine virtuelle classique en IaaS ?","o":["En serverless, le fournisseur gère automatiquement l\u0027allocation et la mise à l\u0027échelle de l\u0027infrastructure sous-jacente, contrairement à une VM que le client doit dimensionner lui-même","Le serverless nécessite que le client configure manuellement chaque serveur physique","Une VM s\u0027adapte automatiquement à la charge sans aucune intervention, contrairement au serverless","Le serverless ne peut exécuter aucun code applicatif"],"e":"Le **serverless** (par exemple Azure Functions) masque entièrement la gestion des serveurs et met à l\u0027échelle automatiquement, alors qu\u0027une VM doit être dimensionnée et administrée par le client."},{"n":10,"a":["A"],"q":"Quelle est la différence majeure entre IaaS et PaaS en matière de responsabilités ?","o":["En IaaS, le client gère le système d\u0027exploitation et les correctifs, en PaaS c\u0027est le fournisseur qui gère la plateforme sous-jacente","En PaaS, le client doit gérer physiquement les serveurs","En IaaS, le fournisseur gère entièrement le code applicatif du client","Il n\u0027y a aucune différence, les deux modèles sont identiques"],"e":"En **IaaS**, le client administre l\u0027OS et les mises à jour, alors qu\u0027en **PaaS**, le fournisseur gère la plateforme (OS, runtime), laissant le client se concentrer sur son code."},{"n":11,"a":["A"],"q":"Quelle est la différence entre PaaS et SaaS du point de vue du client ?","o":["En PaaS, le client développe et déploie ses propres applications sur une plateforme managée, en SaaS il utilise directement une application complète déjà prête à l\u0027emploi","En SaaS, le client doit gérer le middleware et le runtime applicatif","En PaaS, le client n\u0027a accès à aucun outil de développement","SaaS et PaaS désignent tous deux la gestion complète du matériel par le client"],"e":"Le **PaaS** fournit une plateforme pour développer et héberger des applications, tandis que le **SaaS** (comme Microsoft 365) livre une application entièrement finie, prête à l\u0027utilisation."},{"n":12,"a":["A"],"q":"Quelle est la différence entre une région Azure et une paire de régions (region pair) ?","o":["Une paire de régions associe deux régions distinctes au sein d\u0027une même zone géographique pour la réplication et la reprise après sinistre","Une paire de régions désigne deux zones de disponibilité au sein d\u0027une même région","Une région est toujours composée d\u0027exactement deux datacenters","Une paire de régions correspond à deux abonnements liés entre eux"],"e":"Une **paire de régions** relie deux régions Azure généralement situées dans la même zone géographique, utilisées pour répliquer les données et assurer la continuité en cas de sinistre régional."},{"n":13,"a":["A"],"q":"Quelle est la différence entre une zone de disponibilité et une région Azure ?","o":["Une zone de disponibilité est un ou plusieurs datacenters physiquement séparés au sein d\u0027une même région, offrant une protection contre les pannes locales","Une région est un sous-ensemble d\u0027une zone de disponibilité","Une zone de disponibilité regroupe plusieurs régions distinctes du monde entier","Les zones de disponibilité et les régions désignent exactement le même concept"],"e":"Une **région** est une zone géographique contenant un ou plusieurs datacenters, et les **zones de disponibilité** sont des emplacements physiquement distincts au sein de cette même région."},{"n":14,"a":["A"],"q":"Quelle est la différence entre un groupe d\u0027administration (management group) et une souscription Azure ?","o":["Un groupe d\u0027administration permet d\u0027organiser plusieurs souscriptions pour appliquer des stratégies de gouvernance communes, la souscription regroupe des ressources facturées","Une souscription contient toujours plusieurs groupes d\u0027administration","Un groupe d\u0027administration est l\u0027unité de facturation de base dans Azure","Les groupes d\u0027administration remplacent entièrement les souscriptions depuis 2020"],"e":"Les **groupes d\u0027administration** se situent au-dessus des souscriptions dans la hiérarchie Azure et permettent de gérer l\u0027accès et les stratégies sur plusieurs souscriptions à la fois."},{"n":15,"a":["A"],"q":"Quelle est la différence entre une souscription Azure et un groupe de ressources ?","o":["La souscription définit les limites de facturation et d\u0027accès, tandis que le groupe de ressources est un conteneur logique regroupant des ressources liées au sein de cette souscription","Un groupe de ressources peut contenir plusieurs souscriptions","La souscription ne sert qu\u0027à nommer les ressources, sans impact sur la facturation","Les groupes de ressources et les souscriptions sont facturés indépendamment l\u0027un de l\u0027autre"],"e":"Une **souscription** définit la facturation et les quotas, alors qu\u0027un **groupe de ressources** organise logiquement un ensemble de ressources partageant le même cycle de vie."},{"n":16,"a":["A"],"q":"Quelle est la différence entre un groupe à haute disponibilité (availability set) et un Virtual Machine Scale Set ?","o":["Un availability set répartit des VM existantes sur plusieurs domaines de panne pour la résilience, alors qu\u0027un Scale Set ajoute et retire automatiquement des instances identiques selon la charge","Un Scale Set ne peut contenir qu\u0027une seule machine virtuelle à la fois","Un availability set met automatiquement à l\u0027échelle le nombre de VM selon le trafic","Les deux concepts sont strictement identiques et interchangeables"],"e":"L\u0027**availability set** protège contre les pannes matérielles en répartissant les VM, tandis qu\u0027un **VM Scale Set** gère dynamiquement le nombre d\u0027instances pour la mise à l\u0027échelle automatique."},{"n":17,"a":["A","C"],"q":"Lesquels de ces services Azure permettent d\u0027exécuter des conteneurs sans que le client ait à gérer directement les machines virtuelles sous-jacentes ?","o":["Azure Container Instances","Azure Virtual Machine Scale Sets","Azure Container Apps","Un cluster Azure Kubernetes Service en mode nœuds standards"],"e":"**Azure Container Instances** et **Azure Container Apps** sont des services serverless qui exécutent des conteneurs sans que le client gère de VM, contrairement à un cluster AKS classique ou à un Scale Set qui reposent sur des machines virtuelles gérées par le client."},{"n":18,"a":["A"],"q":"Quelle est la différence entre Azure Kubernetes Service (AKS) et Azure Container Apps ?","o":["AKS offre un contrôle complet sur l\u0027orchestration Kubernetes et l\u0027infrastructure des nœuds, tandis qu\u0027Azure Container Apps masque cette complexité pour exécuter des microservices sans gérer Kubernetes","Azure Container Apps nécessite de configurer manuellement le plan de contrôle Kubernetes","AKS ne peut exécuter qu\u0027un seul conteneur à la fois","Les deux services sont identiques et ciblent exactement le même usage"],"e":"**AKS** expose directement Kubernetes avec un contrôle fin sur les nœuds, alors qu\u0027**Azure Container Apps** est une solution managée simplifiée qui abstrait Kubernetes pour exécuter des applications conteneurisées."},{"n":19,"a":["A"],"q":"Quelle est la différence entre Azure Functions en plan Consommation et Azure App Service en plan dédié ?","o":["Azure Functions en Consommation facture uniquement le temps d\u0027exécution réel et met à l\u0027échelle automatiquement à zéro, tandis qu\u0027App Service en plan dédié réserve des ressources en continu même sans trafic","App Service en plan dédié ne peut héberger aucune application web","Azure Functions en Consommation nécessite de réserver des VM dédiées à l\u0027avance","Les deux modèles facturent exactement de la même façon, à l\u0027heure de serveur réservé"],"e":"Le plan **Consommation** d\u0027Azure Functions facture à l\u0027exécution et peut descendre à zéro instance, contrairement à un plan **App Service** dédié qui maintient des ressources allouées en permanence."},{"n":20,"a":["A"],"q":"Quelle est la différence entre Azure VPN Gateway et Azure ExpressRoute pour connecter un réseau local à Azure ?","o":["VPN Gateway établit une connexion chiffrée via Internet public, tandis qu\u0027ExpressRoute utilise une connexion privée dédiée ne transitant pas par Internet","ExpressRoute utilise exclusivement une connexion chiffrée via Internet public","VPN Gateway offre une bande passante garantie contractuellement plus élevée qu\u0027ExpressRoute","Les deux services désignent la même technologie sous un nom différent"],"e":"**VPN Gateway** chiffre le trafic transitant par Internet, alors qu\u0027**ExpressRoute** fournit une connexion privée dédiée, plus stable et prévisible, sans passer par le réseau Internet public."},{"n":21,"a":["A"],"q":"Quelle est la différence entre un point de terminaison public et un point de terminaison privé pour un service Azure ?","o":["Le point de terminaison public est accessible via une adresse IP exposée sur Internet, tandis que le point de terminaison privé n\u0027est accessible que depuis un réseau virtuel via une adresse IP privée","Le point de terminaison privé est toujours accessible depuis n\u0027importe quel réseau public sans restriction","Un point de terminaison public ne peut jamais être sécurisé par un pare-feu","Il n\u0027existe aucune différence entre ces deux types de points de terminaison"],"e":"Un **point de terminaison privé** attribue une adresse IP privée au sein d\u0027un réseau virtuel, réduisant l\u0027exposition du service, contrairement au **point de terminaison public** accessible depuis Internet."},{"n":22,"a":["A"],"q":"Quelle est la différence entre la redondance LRS et la redondance ZRS pour le stockage Azure ?","o":["LRS réplique les données sur trois copies dans un seul datacenter, tandis que ZRS les réplique sur trois zones de disponibilité distinctes au sein de la même région","ZRS réplique systématiquement les données vers une région secondaire distante","LRS offre une meilleure résilience aux pannes de datacenter que ZRS","LRS et ZRS désignent la même stratégie de réplication avec un nom différent"],"e":"**LRS** conserve trois copies dans un seul datacenter, alors que **ZRS** répartit ces copies sur plusieurs zones de disponibilité de la même région, offrant une meilleure résilience."},{"n":23,"a":["A","C"],"q":"Parmi les options de redondance du stockage Azure suivantes, lesquelles répliquent les données vers une région secondaire géographiquement distante ?","o":["GRS (Geo-Redundant Storage)","LRS (Locally Redundant Storage)","GZRS (Geo-Zone-Redundant Storage)","ZRS (Zone-Redundant Storage)"],"e":"**GRS** et **GZRS** répliquent les données vers une région secondaire distante, tandis que **LRS** et **ZRS** restent limitées à la région primaire."},{"n":24,"a":["A"],"q":"Quelle est la différence entre les niveaux d\u0027accès Chaud (Hot), Froid (Cool) et Archive pour le stockage Blob Azure ?","o":["Le niveau Chaud est optimisé pour un accès fréquent avec un coût de stockage plus élevé, le niveau Froid réduit le coût de stockage pour un accès moins fréquent, et le niveau Archive minimise le coût pour des données rarement consultées au prix d\u0027un délai de récupération","Le niveau Archive permet un accès instantané identique au niveau Chaud","Le niveau Froid est destiné aux données consultées plusieurs fois par jour","Les trois niveaux ont exactement le même coût de stockage et de récupération"],"e":"Ces trois niveaux d\u0027accès équilibrent coût de stockage et coût/délai d\u0027accès : **Chaud** pour un usage fréquent, **Froid** pour un usage occasionnel, et **Archive** pour des données rarement consultées nécessitant une réhydratation avant lecture."},{"n":25,"a":["A"],"q":"Un administrateur doit transférer plusieurs centaines de téraoctets de données vers Azure alors que la connexion Internet de l\u0027entreprise est limitée. Quel outil est le plus adapté plutôt qu\u0027AzCopy ?","o":["Azure Data Box","Azure Storage Explorer","Azure CLI","Azure Monitor"],"e":"**Azure Data Box** est un boîtier physique conçu pour transférer de très gros volumes de données sans dépendre de la bande passante réseau, contrairement à **AzCopy** qui transfère les données via le réseau."},{"n":26,"a":["A"],"q":"Quelle est la différence entre Microsoft Entra ID et Microsoft Entra Domain Services ?","o":["Microsoft Entra ID est un service d\u0027identité cloud moderne basé sur des protocoles comme OAuth, tandis que Microsoft Entra Domain Services fournit des fonctionnalités de domaine compatibles Active Directory traditionnel comme l\u0027adhésion au domaine et les stratégies de groupe","Microsoft Entra Domain Services ne prend en charge aucune authentification","Microsoft Entra ID nécessite obligatoirement un contrôleur de domaine Windows Server sur site","Les deux services sont strictement identiques et offrent les mêmes fonctionnalités"],"e":"**Microsoft Entra ID** gère les identités modernes basées sur le cloud, alors que **Microsoft Entra Domain Services** fournit des services de domaine managés compatibles avec les applications héritées nécessitant une jointure de domaine classique."},{"n":27,"a":["A"],"q":"Quelle est la différence entre l\u0027approche Confiance Zéro (Zero Trust) et le principe de défense en profondeur ?","o":["La Confiance Zéro part du principe qu\u0027aucune requête n\u0027est fiable par défaut et vérifie systématiquement chaque accès, tandis que la défense en profondeur superpose plusieurs couches de sécurité indépendantes pour ralentir un attaquant","La défense en profondeur consiste à faire confiance automatiquement à tout utilisateur situé à l\u0027intérieur du réseau de l\u0027entreprise","La Confiance Zéro supprime totalement la nécessité d\u0027authentifier les utilisateurs","Ces deux concepts sont rigoureusement identiques et interchangeables"],"e":"La **Confiance Zéro** impose une vérification explicite de chaque demande d\u0027accès, alors que la **défense en profondeur** consiste à empiler plusieurs mécanismes de sécurité complémentaires à différents niveaux."},{"n":28,"a":["A"],"q":"Quelle est la différence entre la calculatrice de prix Azure (Pricing Calculator) et la calculatrice TCO (Total Cost of Ownership) ?","o":["La calculatrice de prix estime le coût des services Azure sélectionnés, tandis que la calculatrice TCO compare le coût total d\u0027une infrastructure sur site avec son équivalent dans Azure","La calculatrice TCO ne sert qu\u0027à estimer le coût d\u0027une seule machine virtuelle","La calculatrice de prix compare systématiquement le cloud avec l\u0027infrastructure sur site","Les deux outils sont rigoureusement identiques et donnent toujours le même résultat"],"e":"La **calculatrice de prix** permet d\u0027estimer le coût prévisionnel des ressources Azure choisies, alors que la **calculatrice TCO** compare ce coût à celui d\u0027un environnement sur site équivalent."},{"n":29,"a":["A"],"q":"Quelle est la différence entre Microsoft Cost Management et Azure Advisor concernant les coûts ?","o":["Cost Management analyse et suit les dépenses réelles déjà engagées, tandis qu\u0027Azure Advisor formule des recommandations proactives pour réduire les coûts futurs","Azure Advisor ne fournit que des recommandations de sécurité, jamais de recommandations de coûts","Cost Management recommande automatiquement de nouvelles architectures applicatives","Les deux services sont exactement identiques et redondants"],"e":"**Microsoft Cost Management** sert à visualiser et analyser les dépenses passées, tandis qu\u0027**Azure Advisor** propose des recommandations personnalisées, notamment pour optimiser les coûts, la sécurité et la fiabilité."},{"n":30,"a":["A"],"q":"Quelle est la différence entre l\u0027utilisation des tags et celle des groupes de ressources pour organiser les coûts Azure ?","o":["Les tags permettent de classer des ressources selon des métadonnées personnalisées transversales (comme un centre de coûts), tandis que les groupes de ressources structurent physiquement les ressources en un conteneur unique partageant le même cycle de vie","Un groupe de ressources ne peut jamais être utilisé pour le reporting de coûts","Les tags remplacent totalement la nécessité de créer des groupes de ressources","Les tags et les groupes de ressources désignent exactement le même mécanisme"],"e":"Les **tags** apportent une classification flexible et transversale des ressources, tandis que les **groupes de ressources** regroupent physiquement des ressources qui partagent un même cycle de vie et des permissions communes."},{"n":31,"a":["A","C"],"q":"Quels types de verrous de ressources (resource locks) existent réellement dans Azure ?","o":["CanNotDelete","CanNotModify","ReadOnly","DenyWrite"],"e":"Azure propose exactement deux types de verrous : **CanNotDelete**, qui empêche la suppression, et **ReadOnly**, qui empêche toute modification ou suppression ; les options CanNotModify et DenyWrite n\u0027existent pas."},{"n":32,"a":["A"],"q":"Quelle est la différence entre un verrou de ressource (resource lock) et une stratégie Azure Policy ?","o":["Un verrou empêche directement la suppression ou la modification d\u0027une ressource existante, tandis qu\u0027une stratégie Azure Policy évalue et impose la conformité des ressources selon des règles définies, y compris lors de leur création","Azure Policy sert uniquement à empêcher la suppression accidentelle d\u0027une ressource déjà créée","Un verrou de ressource peut auditer automatiquement la conformité de centaines de ressources selon des règles métier","Les verrous et les stratégies Azure Policy sont deux noms désignant le même mécanisme"],"e":"Le **verrou** protège une ressource précise contre la suppression ou la modification, tandis qu\u0027**Azure Policy** applique des règles de gouvernance plus larges, y compris au moment de la création des ressources."},{"n":33,"a":["A"],"q":"Quelle est la différence entre Microsoft Purview et le Service Trust Portal ?","o":["Microsoft Purview aide à cataloguer, classifier et gouverner les données de l\u0027organisation, tandis que le Service Trust Portal met à disposition des rapports d\u0027audit et des documents de conformité publiés par Microsoft sur ses services","Le Service Trust Portal permet de classifier automatiquement les données sensibles d\u0027une entreprise","Microsoft Purview ne concerne que la facturation des services Azure","Ces deux outils remplissent exactement la même fonction"],"e":"**Microsoft Purview** est orienté gouvernance et catalogage des données du client, alors que le **Service Trust Portal** fournit des documents de conformité et d\u0027audit concernant les services cloud de Microsoft."},{"n":34,"a":["A"],"q":"Quelle est la différence entre le portail Azure et Azure Cloud Shell ?","o":["Le portail Azure propose une interface graphique web pour gérer les ressources, tandis qu\u0027Azure Cloud Shell fournit un environnement en ligne de commande accessible directement depuis le navigateur","Azure Cloud Shell ne permet d\u0027exécuter aucune commande CLI ou PowerShell","Le portail Azure ne permet pas de créer de nouvelles ressources","Les deux outils sont rigoureusement identiques dans leur mode d\u0027interaction"],"e":"Le **portail Azure** offre une expérience visuelle de gestion, alors qu\u0027**Azure Cloud Shell** met à disposition un terminal (Bash ou PowerShell) accessible sans installation locale."},{"n":35,"a":["A"],"q":"Quelle est la principale différence entre Azure CLI et Azure PowerShell ?","o":["Azure CLI utilise une syntaxe de commandes inspirée de Bash, tandis qu\u0027Azure PowerShell repose sur des cmdlets PowerShell, mais les deux permettent de gérer les mêmes ressources Azure","Azure PowerShell ne fonctionne que sur Linux, jamais sur Windows","Azure CLI ne peut être utilisé que depuis le portail Azure","Ces deux outils ne peuvent gérer aucune ressource en commun"],"e":"**Azure CLI** et **Azure PowerShell** sont deux outils en ligne de commande multiplateformes offrant des syntaxes différentes mais des capacités de gestion équivalentes des ressources Azure."},{"n":36,"a":["A"],"q":"Quelle est la différence entre un modèle ARM (Azure Resource Manager) et un fichier Bicep ?","o":["Un modèle ARM est écrit en JSON et peut être verbeux, tandis que Bicep est un langage déclaratif plus simple qui se transp
