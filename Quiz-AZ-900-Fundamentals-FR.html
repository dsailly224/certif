mettre une communication privée et à faible latence sans passer par l\u0027internet public."},{"n":22,"a":["B"],"q":"Une entreprise a besoin d\u0027une connexion privée, dédiée et à faible latence entre son datacenter local et Azure, sans transiter par l\u0027internet public, pour un trafic critique et volumineux. Quelle solution choisir ?","o":["Azure VPN Gateway via internet","Azure ExpressRoute","Un point de terminaison privé uniquement","Le peering de réseaux virtuels"],"e":"**ExpressRoute** fournit une connexion privée dédiée entre un site local et Azure, sans passer par l\u0027internet public, contrairement au VPN Gateway."},{"n":23,"a":["B"],"q":"Comment sécuriser l\u0027accès à un compte de stockage Azure afin qu\u0027il soit uniquement joignable via une adresse IP privée à l\u0027intérieur d\u0027un réseau virtuel, sans jamais transiter par l\u0027internet public ?","o":["En configurant un point de terminaison public","En configurant un point de terminaison privé (private endpoint)","En activant uniquement le stockage GRS","En créant un groupe à haute disponibilité"],"e":"Un **point de terminaison privé** attribue une adresse IP privée du réseau virtuel à un service PaaS, supprimant l\u0027exposition publique de l\u0027endpoint."},{"n":24,"a":["D"],"q":"Une entreprise veut que ses données soient répliquées de manière asynchrone vers une région secondaire distante ET veut pouvoir les lire depuis cette région secondaire même quand la région primaire fonctionne normalement. Quelle option de redondance de stockage faut-il choisir ?","o":["LRS","ZRS","GRS","RA-GRS, stockage géoredondant avec accès en lecture"],"e":"**RA-GRS** ajoute à la redondance géographique de GRS la possibilité de lire les données depuis la région secondaire même lorsque la région primaire est disponible."},{"n":25,"a":["A","C"],"q":"Quelles affirmations sur la redondance du stockage Azure sont correctes ?","o":["Le stockage ZRS réplique les données de manière synchrone sur plusieurs zones de disponibilité de la même région","Le stockage LRS protège automatiquement les données contre la perte totale d\u0027une région entière","Le stockage GZRS combine la réplication entre zones de disponibilité et la réplication asynchrone vers une région secondaire","Le stockage RA-GRS ne permet jamais la lecture des données depuis la région secondaire"],"e":"**ZRS** réplique de façon synchrone entre zones d\u0027une même région, et **GZRS** ajoute une réplication asynchrone vers une région secondaire ; LRS ne protège pas contre la perte d\u0027une région et RA-GRS autorise justement la lecture depuis la région secondaire."},{"n":26,"a":["C"],"q":"Quel outil Azure est conçu pour transférer physiquement de très grands volumes de données vers Azure lorsque la bande passante réseau disponible est insuffisante ?","o":["AzCopy","Azure Storage Explorer","Azure Data Box","Azure File Sync"],"e":"**Azure Data Box** est un boîtier physique permettant de transférer hors ligne de très grands volumes de données vers Azure quand le réseau est limitant."},{"n":27,"a":["B"],"q":"Quelle fonctionnalité de Microsoft Entra ID permet d\u0027exiger automatiquement une authentification multifacteur uniquement lorsque la connexion provient d\u0027un emplacement ou d\u0027un appareil considéré comme inhabituel ?","o":["Le contrôle d\u0027accès en fonction du rôle (RBAC)","L\u0027accès conditionnel (Conditional Access)","Microsoft Entra Domain Services","Microsoft Defender for Cloud"],"e":"L\u0027**accès conditionnel** permet de définir des règles déclenchant des exigences supplémentaires, comme la MFA, selon le contexte du signe-in (lieu, appareil, risque)."},{"n":28,"a":["A"],"q":"Avant de déployer une nouvelle architecture Azure, quel outil permet d\u0027estimer le coût mensuel prévisionnel des ressources prévues (VM, stockage, réseau) ?","o":["La calculatrice de prix Azure (Pricing Calculator)","Azure Advisor","Microsoft Cost Management","Azure Policy"],"e":"La **calculatrice de prix Azure** permet de simuler et d\u0027estimer le coût d\u0027une architecture avant son déploiement."},{"n":29,"a":["B"],"q":"Quel outil permet de comparer le coût total de possession d\u0027une infrastructure sur site avec le coût équivalent d\u0027une solution hébergée sur Azure ?","o":["La calculatrice de prix Azure","La calculatrice TCO (Total Cost of Ownership)","Azure Monitor","Le Service Trust Portal"],"e":"La **calculatrice TCO** compare les coûts d\u0027une infrastructure locale existante avec le coût équivalent sur Azure."},{"n":30,"a":["B"],"q":"Comment une entreprise peut-elle répartir précisément ses coûts Azure par département ou par projet dans les rapports de Microsoft Cost Management ?","o":["En activant Azure Policy","En appliquant des balises (tags) aux ressources, puis en filtrant les coûts par balise","En créant un verrou de ressource","En configurant Azure Site Recovery"],"e":"Les **balises (tags)** appliquées aux ressources permettent ensuite de filtrer et de ventiler les coûts par département, projet ou centre de coût dans Cost Management."},{"n":31,"a":["A"],"q":"Quel service Azure aide une organisation à cataloguer, classifier et gouverner ses données sensibles réparties entre environnements locaux, multicloud et SaaS ?","o":["Microsoft Purview","Azure Monitor","Azure Advisor","Azure Arc"],"e":"**Microsoft Purview** fournit un catalogue de données unifié et des outils de gouvernance pour classifier et protéger les données sensibles à travers l\u0027entreprise."},{"n":32,"a":["A"],"q":"Une entreprise veut empêcher la création de ressources en dehors d\u0027une liste de régions autorisées, afin de respecter ses exigences de résidence des données. Quel service Azure permet d\u0027appliquer et de vérifier automatiquement cette règle sur l\u0027ensemble des abonnements ?","o":["Azure Policy","Azure RBAC","Microsoft Cost Management","Azure Advisor"],"e":"**Azure Policy** permet de définir des règles de conformité et de les appliquer ou de les auditer automatiquement sur les ressources d\u0027un ou plusieurs abonnements."},{"n":33,"a":["B"],"q":"Quelle ressource permet de consulter les rapports d\u0027audit et les certifications de conformité de Microsoft Azure (ISO, SOC, etc.) ?","o":["Azure Service Health","Le Service Trust Portal","Azure Monitor","Azure Advisor"],"e":"Le **Service Trust Portal** donne accès aux rapports d\u0027audit, certifications et documents de conformité de Microsoft."},{"n":34,"a":["B"],"q":"Quel outil offre un environnement de ligne de commande prêt à l\u0027emploi, accessible directement depuis un navigateur, avec Azure CLI et Azure PowerShell préinstallés, sans nécessiter d\u0027installation locale ?","o":["Azure Arc","Azure Cloud Shell","Visual Studio Code","Azure Data Box"],"e":"**Azure Cloud Shell** est un shell interactif accessible depuis le navigateur ou le portail, avec les outils en ligne de commande déjà installés."},{"n":35,"a":["A"],"q":"Quel service Azure permet d\u0027étendre la gestion et la gouvernance Azure (politiques, étiquetage, supervision) à des serveurs et des clusters Kubernetes situés en dehors d\u0027Azure, par exemple sur site ou chez un autre fournisseur cloud ?","o":["Azure Arc","Azure Site Recovery","Azure Bastion","Azure Migrate"],"e":"**Azure Arc** étend la gestion et la gouvernance Azure à des ressources hybrides et multicloud situées en dehors d\u0027Azure."},{"n":36,"a":["B"],"q":"Pour garantir qu\u0027un environnement de reprise après sinistre soit déployé de manière identique et répétable dans une région secondaire, quelle approche est la plus adaptée ?","o":["Créer manuellement chaque ressource via le portail Azure à chaque fois","Utiliser des modèles d\u0027infrastructure as code comme ARM ou Bicep","Envoyer des instructions par courriel à l\u0027équipe opérationnelle","Dupliquer les ressources uniquement via des captures d\u0027écran de configuration"],"e":"Les modèles **ARM ou Bicep** permettent de décrire l\u0027infrastructure en code et de la redéployer de manière identique et répétable, ce qui est essentiel pour un site de reprise."},{"n":37,"a":["B"],"q":"Quelle catégorie de recommandations d\u0027Azure Advisor suggère, par exemple, de répartir des machines virtuelles sur plusieurs zones de disponibilité pour améliorer la résilience d\u0027une application ?","o":["Coût","Fiabilité","Excellence opérationnelle","Sécurité"],"e":"La catégorie **Fiabilité** d\u0027Azure Advisor propose des recommandations pour améliorer la continuité et la résilience des charges de travail."},{"n":38,"a":["A"],"q":"Quelle est la différence entre Azure Status et Azure Service Health ?","o":["Azure Status affiche l\u0027état de santé global des services Azure pour tous les clients, tandis qu\u0027Azure Service Health fournit des informations personnalisées sur les incidents affectant les ressources et la région spécifiques d\u0027un abonnement","Les deux services sont strictement identiques et redondants","Azure Service Health ne concerne que la facturation","Azure Status nécessite une authentification avec un abonnement Azure actif, contrairement à Azure Service Health"],"e":"**Azure Status** donne une vue publique et globale de l\u0027état des services, alors qu\u0027**Azure Service Health** est personnalisé selon les ressources et régions utilisées par un abonnement."},{"n":39,"a":["A","B"],"q":"Quelles affirmations sur les outils de supervision Azure sont correctes ?","o":["Azure Monitor collecte et centralise les métriques et les journaux issus des ressources Azure","Application Insights est conçu pour surveiller les performances et détecter les anomalies au sein des applications","Log Analytics sert uniquement à afficher l\u0027état de santé mondial des services Azure","Azure Advisor stocke les journaux d\u0027activité interrogeables grâce au langage KQL"],"e":"**Azure Monitor** centralise métriques et journaux, et **Application Insights** surveille spécifiquement les performances applicatives ; c\u0027est **Log Analytics**, et non Azure Status ou Advisor, qui permet d\u0027interroger les journaux via KQL."},{"n":40,"a":["A","B"],"q":"Quelles affirmations décrivent correctement les outils de gouvernance Azure ?","o":["Azure Policy peut auditer ou empêcher la création de ressources non conformes aux règles définies par l\u0027organisation","Un verrou de ressource (resource lock) empêche la suppression ou la modification accidentelle d\u0027une ressource critique","Azure Policy attribue des rôles d\u0027accès aux utilisateurs sur les ressources","Un verrou en lecture seule autorise malgré tout la suppression de la ressource"],"e":"**Azure Policy** impose la conformité des ressources tandis que les **verrous de ressources** protègent contre la suppression ou la modification accidentelle ; l\u0027attribution de rôles relève du RBAC, et un verrou en lecture seule interdit justement la suppression."}]},{"id":8,"title":"Examen blanc 8 — Outils de gestion et infrastructure as code","questions":[{"n":1,"a":["A"],"q":"Une entreprise décide de louer de la puissance de calcul à la demande via Internet, payée uniquement selon sa consommation réelle, plutôt que d\u0027acheter et d\u0027entretenir ses propres serveurs. Quel concept décrit cette approche ?","o":["Le cloud computing","Le edge computing","La virtualisation sur site","L\u0027informatique quantique"],"e":"Le **cloud computing** consiste à fournir des ressources informatiques à la demande via Internet, facturées selon l\u0027usage réel."},{"n":2,"a":["B"],"q":"Dans le cadre du modèle de responsabilité partagée, pour une machine virtuelle Azure (IaaS), qui doit appliquer les correctifs de sécurité au système d\u0027exploitation invité ?","o":["Microsoft, car il gère l\u0027intégralité de l\u0027infrastructure","Le client, car il reste responsable de l\u0027OS et des applications","Un partenaire certifié Azure obligatoirement","Personne, les correctifs sont inutiles en IaaS"],"e":"En **IaaS**, le client conserve la responsabilité du système d\u0027exploitation, des correctifs et des applications, tandis que Microsoft sécurise l\u0027infrastructure physique."},{"n":3,"a":["C"],"q":"Une banque souhaite conserver ses données clients les plus sensibles dans son propre datacenter pour des raisons réglementaires, tout en exploitant Azure pour absorber les pics de charge de ses applications publiques. Quel modèle de déploiement cloud illustre cette stratégie ?","o":["Le cloud public pur","Le cloud communautaire","Le cloud hybride","Le cloud privé isolé"],"e":"Le **cloud hybride** combine une infrastructure privée sur site et des services de cloud public, reliés entre eux."},{"n":4,"a":["D"],"q":"Une startup choisit de payer ses ressources informatiques mensuellement en fonction de l\u0027usage, au lieu d\u0027investir dans du matériel qu\u0027elle devrait amortir sur plusieurs années. Quel type de dépense réduit-elle ainsi ?","o":["Les dépenses opérationnelles (OpEx)","Les charges sociales","Les dépenses de recherche et développement","Les dépenses d\u0027investissement (CapEx)"],"e":"En évitant l\u0027achat de matériel, l\u0027entreprise réduit ses **dépenses d\u0027investissement (CapEx)** au profit de dépenses opérationnelles flexibles."},{"n":5,"a":["A"],"q":"Une entreprise accepte de s\u0027engager sur une utilisation continue d\u0027un type de machine virtuelle pendant trois ans en échange d\u0027une réduction tarifaire importante par rapport au tarif standard. Quel mécanisme de tarification Azure utilise-t-elle ?","o":["Les instances réservées","Le niveau gratuit Azure","Le paiement à l\u0027usage classique","Le crédit de support Premier"],"e":"Les **instances réservées** permettent d\u0027obtenir une remise importante en échange d\u0027un engagement d\u0027utilisation sur une durée définie (1 ou 3 ans)."},{"n":6,"a":["B"],"q":"Une équipe souhaite exécuter une fonction de traitement d\u0027image uniquement lorsqu\u0027un fichier est déposé dans un stockage, sans provisionner le moindre serveur et en ne payant que le temps de calcul réellement consommé. Quel modèle correspond à ce besoin ?","o":["L\u0027infrastructure as a service classique","L\u0027informatique serverless (sans serveur)","Un cloud privé dédié","Un cluster de machines virtuelles toujours actif"],"e":"Le modèle **serverless** exécute du code déclenché par des événements sans gestion de serveurs, avec une facturation à l\u0027exécution."},{"n":7,"a":["C"],"q":"Un éditeur de logiciels promet à ses clients que son application restera accessible 99,95 % du temps chaque mois, avec des pénalités financières en cas de non-respect. Quel document formalise cet engagement ?","o":["Le plan de reprise d\u0027activité","Le registre de conformité","Le contrat de niveau de service (SLA)","Le rapport d\u0027audit interne"],"e":"Le **SLA (Service Level Agreement)** définit un engagement mesurable de disponibilité ou de performance, assorti de compensations en cas de non-respect."},{"n":8,"a":["D"],"q":"Un site marchand ajoute automatiquement des instances supplémentaires pendant une vente flash, puis les supprime dès que le trafic retombe, afin de ne payer que les ressources réellement nécessaires à chaque instant. Quelle caractéristique du cloud illustre ce comportement ?","o":["La scalabilité verticale manuelle","La redondance géographique","La virtualisation des postes de travail","L\u0027élasticité"],"e":"L\u0027**élasticité** désigne la capacité d\u0027un système cloud à ajouter ou retirer automatiquement des ressources en fonction de la demande réelle."},{"n":9,"a":["A"],"q":"Après une panne d\u0027un de ses composants, un service cloud se rétablit automatiquement et continue de fonctionner conformément à ce qui était prévu. Quelle propriété du cloud est ici mise en avant ?","o":["La fiabilité (résilience)","La gouvernance","L\u0027élasticité tarifaire","La portabilité des données"],"e":"La **fiabilité** (ou résilience) correspond à la capacité d\u0027un système à se rétablir après une défaillance et à continuer de fonctionner comme attendu."},{"n":10,"a":["B","D"],"q":"Une organisation met en place des règles internes afin que l\u0027utilisation du cloud respecte ses budgets, ses obligations légales et ses standards de sécurité. Parmi les actions suivantes, lesquelles relèvent de cette gouvernance du cloud ?","o":["Choisir la couleur du thème du tableau de bord personnel","Définir des budgets et limites de dépenses par équipe","Configurer le fond d\u0027écran d\u0027un poste de travail utilisateur","Imposer des standards de conformité réglementaire sur les déploiements"],"e":"La **gouvernance cloud** englobe la définition de budgets, de limites et de standards de conformité, à l\u0027inverse de préférences purement esthétiques sans impact organisationnel."},{"n":11,"a":["B"],"q":"Une équipe de développement veut déployer son application web sans jamais avoir à configurer ni mettre à jour le système d\u0027exploitation ou le runtime sous-jacent, la plateforme s\u0027en chargeant automatiquement. Quel modèle de service cloud utilise-t-elle ?","o":["IaaS (infrastructure as a service)","PaaS (plateforme as a service)","SaaS (logiciel as a service)","Une infrastructure on-premises classique"],"e":"Le **PaaS** fournit une plateforme managée (OS, runtime, middleware) permettant aux développeurs de se concentrer uniquement sur leur code."},{"n":12,"a":["C"],"q":"Pour répondre à des exigences légales imposant que certaines données ne quittent jamais le territoire national et soient gérées par une entité spécifique, Azure propose des déploiements particuliers isolés du reste du cloud public. Comment appelle-t-on ces déploiements ?","o":["Des paires de régions","Des zones de disponibilité","Des régions souveraines","Des datacenters périphériques"],"e":"Les **régions souveraines** (par ex. Azure Government, Azure China) sont des instances isolées répondant à des exigences légales ou gouvernementales spécifiques."},{"n":13,"a":["A","D"],"q":"Une application critique doit continuer à fonctionner même si un datacenter entier d\u0027une région Azure subit une panne d\u0027alimentation. Parmi les affirmations suivantes sur les zones de disponibilité, lesquelles sont exactes ?","o":["Chaque zone de disponibilité correspond à un ou plusieurs datacenters physiquement séparés au sein d\u0027une même région","Une zone de disponibilité correspond toujours à un pays différent","Les zones de disponibilité remplacent entièrement le besoin de régions Azure","Les zones de disponibilité ne sont disponibles que dans certaines régions Azure"],"e":"Les **zones de disponibilité** regroupent des datacenters séparés physiquement au sein d\u0027une même région, mais toutes les régions Azure n\u0027en proposent pas."},{"n":14,"a":["D"],"q":"Un administrateur souhaite appliquer une politique de conformité unique à l\u0027ensemble des abonnements Azure de plusieurs filiales d\u0027un grand groupe. Quel niveau de la hiérarchie Azure doit-il utiliser pour regrouper ces abonnements ?","o":["Le groupe de ressources","La zone de disponibilité","Le locataire (tenant) Microsoft Entra ID uniquement","Le groupe d\u0027administration (management group)"],"e":"Les **groupes d\u0027administration (management groups)** permettent d\u0027organiser plusieurs abonnements et d\u0027appliquer des politiques et des rôles de manière centralisée."},{"n":15,"a":["A"],"q":"Une entreprise veut garantir qu\u0027un groupe de machines virtuelles identiques reste disponible même en cas de maintenance planifiée ou de panne matérielle imprévue au sein du même datacenter, sans faire évoluer automatiquement leur nombre. Quelle ressource Azure répond précisément à ce besoin ?","o":["Un groupe à haute disponibilité (availability set)","Un groupe identique de machines virtuelles (VM Scale Set)","Une zone de disponibilité unique","Azure Virtual Desktop"],"e":"Un **availability set** répartit des VM identiques sur des domaines de panne et de mise à jour distincts pour limiter l\u0027impact des pannes matérielles et des maintenances."},{"n":16,"a":["B"],"q":"Une entreprise veut fournir à ses employés un environnement de bureau Windows complet, accessible depuis n\u0027importe quel appareil, et entièrement hébergé et géré dans Azure. Quel service Azure répond à ce besoin ?","o":["Azure Container Apps","Azure Virtual Desktop","Azure Functions","Azure Bastion"],"e":"**Azure Virtual Desktop** fournit des postes de travail et applications Windows virtualisés, accessibles à distance depuis le cloud."},{"n":17,"a":["A","C"],"q":"Une équipe veut exécuter des conteneurs applicatifs dans Azure sans avoir à provisionner ni gérer elle-même les machines virtuelles ou les nœuds sous-jacents. Parmi les services suivants, lesquels répondent à ce besoin ?","o":["Azure Container Instances","Azure Kubernetes Service avec nœuds gérés par le client","Azure Container Apps","Azure Virtual Machine Scale Sets"],"e":"**Azure Container Instances** et **Azure Container Apps** exécutent des conteneurs sans que le client ait à gérer de machines virtuelles, contrairement à AKS classique ou aux VM Scale Sets."},{"n":18,"a":["C"],"q":"Un développeur veut exécuter un petit bloc de code déclenché automatiquement chaque fois qu\u0027un message arrive dans une file d\u0027attente, en payant uniquement le temps d\u0027exécution réel. Quel service Azure est le plus adapté ?","o":["Azure App Service","Azure Kubernetes Service","Azure Functions","Azure Virtual Machines"],"e":"**Azure Functions** est le service serverless d\u0027Azure dédié à l\u0027exécution de code déclenché par des événements, facturé à l\u0027exécution."},{"n":19,"a":["D"],"q":"Une équipe souhaite héberger un site web ASP.NET en production, avec mise à l\u0027échelle automatique, certificats SSL gérés et déploiements continus, sans gérer elle-même le système d\u0027exploitation du serveur. Quel service Azure correspond le mieux à ce besoin ?","o":["Azure Container Instances uniquement","Azure Data Box","Azure ExpressRoute","Azure App Service"],"e":"**Azure App Service** est une plateforme PaaS managée pour héberger des applications web avec mise à l\u0027échelle, SSL et intégration continue."},{"n":20,"a":["A"],"q":"Une entreprise veut isoler logiquement ses ressources Azure dans un réseau privé, tout en autorisant une communication directe et sécurisée entre deux réseaux virtuels situés dans des régions différentes. Quelle fonctionnalité doit-elle configurer ?","o":["Un peering de réseaux virtuels (VNet peering)","Une zone de disponibilité partagée","Un groupe de ressources commun","Azure Data Box"],"e":"Le **peering de réseaux virtuels** permet de connecter directement deux VNets, y compris entre régions, via le réseau principal de Microsoft."},{"n":21,"a":["B"],"q":"Une organisation veut bloquer automatiquement les connexions à ses applications professionnelles lorsqu\u0027elles proviennent d\u0027un pays non autorisé, même si l\u0027utilisateur présente des identifiants valides. Quelle fonctionnalité Microsoft Entra ID permet d\u0027appliquer une telle règle contextuelle ?","o":["Azure RBAC","L\u0027accès conditionnel (Conditional Access)","Microsoft Entra Domain Services","Le niveau gratuit Microsoft Entra ID"],"e":"L\u0027**accès conditionnel** applique des règles basées sur le contexte (localisation, appareil, risque) pour autoriser, bloquer ou exiger une vérification supplémentaire."},{"n":22,"a":["C"],"q":"Une grande entreprise veut relier son datacenter sur site à Azure via une connexion privée dédiée, sans transiter par l\u0027Internet public, afin d\u0027obtenir une latence plus faible et plus prévisible qu\u0027un tunnel chiffré classique. Quelle solution doit-elle choisir ?","o":["Azure VPN Gateway en mode site à site","Un simple peering VNet","Azure ExpressRoute","Azure Private Link"],"e":"**ExpressRoute** établit une connexion privée dédiée entre un site client et Azure, en dehors d\u0027Internet, avec une latence plus stable qu\u0027un VPN classique."},{"n":23,"a":["D"],"q":"Une entreprise veut qu\u0027une application cliente accède à un compte de stockage Azure uniquement via une adresse IP privée de son réseau virtuel, sans jamais exposer ce compte de stockage sur Internet. Quelle fonctionnalité doit-elle utiliser ?","o":["Un point de terminaison public","Un VPN point à site","Une zone de disponibilité","Un point de terminaison privé (Private Endpoint)"],"e":"Un **point de terminaison privé** attribue une adresse IP privée du VNet à un service Azure, évitant toute exposition publique du trafic."},{"n":24,"a":["A"],"q":"Une application doit stocker de grandes quantités de fichiers non structurés comme des images et des vidéos, accessibles via HTTP/HTTPS, avec différents niveaux de coût selon la fréquence d\u0027accès. Quel service de stockage Azure est le plus adapté, et quelle option permet de réduire les coûts pour des données rarement consultées ?","o":["Azure Blob Storage, avec le niveau d\u0027accès Archive ou Froid","Azure Table Storage, avec le niveau Premium","Azure Queue Storage, avec le niveau Chaud uniquement","Azure Files, avec la redondance LRS uniquement"],"e":"**Azure Blob Storage** est conçu pour les données non structurées, et les niveaux **Froid** ou **Archive** réduisent les coûts de stockage des données peu consultées."},{"n":25,"a":["B"],"q":"Une entreprise veut que ses données de stockage restent disponibles même en cas de destruction complète de la région Azure principale, en les répliquant automatiquement vers une région secondaire éloignée. Quelle option de redondance doit-elle choisir au minimum ?","o":["LRS (stockage localement redondant)","GRS (stockage géo-redondant)","ZRS (stockage à redondance de zone)","Aucune redondance n\u0027est nécessaire, le stockage est toujours répliqué par défaut"],"e":"Le **GRS** réplique les données de manière asynchrone vers une région secondaire distante, contrairement à LRS et ZRS limités à une seule région."},{"n":26,"a":["C"],"q":"Une entreprise doit migrer plusieurs dizaines de téraoctets de données vers Azure, mais sa connexion Internet est trop lente pour un transfert en ligne dans un délai raisonnable. Quel service Azure est conçu pour ce type de transfert physique hors ligne ?","o":["AzCopy","Azure Storage Explorer","Azure Data Box","Azure File Sync"],"e":"**Azure Data Box** est un appareil physique sécurisé permettant de transférer de très grands volumes de données vers Azure sans dépendre du réseau."},{"n":27,"a":["D"],"q":"Une entreprise veut autoriser automatiquement l\u0027accès à une application Azure à des utilisateurs invités travaillant chez un partenaire externe, sans créer de comptes internes distincts pour eux, tout en appliquant les mêmes politiques de sécurité. Quelle fonctionnalité Microsoft Entra ID permet cela ?","o":["Microsoft Entra Domain Services","Azure RBAC uniquement","Le niveau gratuit Microsoft Entra ID","La collaboration B2B (identités externes)"],"e":"La **collaboration B2B** (identités externes Microsoft Entra) permet d\u0027inviter des utilisateurs externes à accéder aux ressources avec leurs propres identifiants, sous le contrôle des politiques de l\u0027organisation."},{"n":28,"a":["A"],"q":"Avant de déployer une nouvelle solution dans Azure, une entreprise veut estimer le coût mensuel approximatif en fonction du type et du nombre de ressources prévues (VM, stockage, bande passante), sans encore rien déployer. Quel outil Azure est conçu pour cela ?","o":["La calculatrice de prix Azure (Pricing Calculator)","La calculatrice TCO","Azure Cost Management","Azure Advisor"],"e":"La **calculatrice de prix Azure** permet d\u0027estimer le coût mensuel d\u0027une architecture avant son déploiement, en fonction des ressources sélectionnées."},{"n":29,"a":["B"],"q":"Une entreprise encore hébergée entièrement sur site veut comparer le coût total de son infrastructure actuelle (matériel, électricité, personnel) avec le coût estimé d\u0027une migration vers Azure. Quel outil Microsoft est spécifiquement conçu pour cette comparaison ?","o":["La calculatrice de prix Azure","La calculatrice TCO (coût total de possession)","Azure Migrate","Azure Monitor"],"e":"La **calculatrice TCO** compare le coût total de possession d\u0027une infrastructure on-premises avec celui d\u0027une solution équivalente dans Azure."},{"n":30,"a":["C"],"q":"Une entreprise attribue à chaque ressource Azure une étiquette indiquant le service interne responsable (marketing, finance, IT), afin de pouvoir ensuite analyser précisément la répartition des dépenses par service dans ses rapports de facturation. Quelles fonctionnalités Azure combine-t-elle ici ?","o":["Azure Policy et Azure Blueprints","Les verrous de ressources et Azure Monitor","Les tags de ressources et Microsoft Cost Management","Microsoft Purview et Azure Advisor"],"e":"Les **tags** permettent de catégoriser les ressources, et **Microsoft Cost Management** exploite ensuite ces métadonnées pour analyser et répartir les coûts."},{"n":31,"a":["D"],"q":"Une entreprise soumise à des obligations réglementaires veut cataloguer automatiquement ses données sensibles stockées dans Azure, les classifier et suivre leur cycle de vie à travers plusieurs sources. Quel service Microsoft répond à ce besoin de gouvernance des données ?","o":["Service Trust Portal","Azure Policy","Azure Resource Manager","Microsoft Purview"],"e":"**Microsoft Purview** permet de cataloguer, classifier et gouverner les données sensibles à travers différentes sources, y compris hybrides."},{"n":32,"a":["A"],"q":"Une entreprise veut empêcher que des machines virtuelles soient créées dans une région autre que celle approuvée par sa politique interne, et faire respecter automatiquement cette règle sur tous les nouveaux déploiements Azure. Quel service doit-elle utiliser ?","o":["Azure Policy","Azure Blueprints uniquement","Un verrou de ressource (resource lock)","Microsoft Defender for Cloud"],"e":"**Azure Policy** permet de définir des règles de conformité, comme restreindre les régions ou types de ressources autorisés, et de les appliquer automatiquement."},{"n":33,"a":["B"],"q":"Un administrateur veut empêcher que son équipe supprime accidentellement un groupe de ressources critique en production, tout en continuant à autoriser les modifications normales de configuration sur ces ressources. Quelle fonctionnalité doit-il appliquer ?","o":["Un verrou ReadOnly","Un verrou CanNotDelete (verrou de suppression)","Une politique Azure Policy de refus total","Un rôle Azure RBAC Lecteur"],"e":"Un **verrou CanNotDelete** empêche la suppression d\u0027une ressource tout en continuant d\u0027autoriser les modifications de configuration."},{"n":34,"a":["C"],"q":"Un administrateur système doit exécuter rapidement une commande Azure CLI depuis n\u0027importe quel navigateur, sans installer d\u0027outil localement, directement depuis le portail Azure. Quel outil doit-il utiliser ?","o":["Azure Arc","L\u0027application mobile Azure","Azure Cloud Shell","Azure PowerShell installé localement"],"e":"**Azure Cloud Shell** est un terminal accessible depuis le navigateur, intégré au portail, qui ne nécessite aucune installation locale."},{"n":35,"a":["D"],"q":"Une équipe d\u0027infrastructure veut intégrer la création automatisée de ressources Azure dans un pipeline CI/CD externe, en appelant directement les fonctionnalités de gestion Azure de façon programmatique, sans interface graphique ni terminal interactif. Quelle approche est la plus adaptée ?","o":["Utiliser l\u0027application mobile Azure","Se connecter manuellement au portail Azure à chaque exécution","Utiliser uniquement Azure Advisor","Appeler l\u0027API REST Azure Resource Manager"],"e":"L\u0027**API REST Azure Resource Manager** permet d\u0027automatiser la gestion des ressources de façon programmatique, idéale pour une intégration dans un pipeline CI/CD."},{"n":36,"a":["A"],"q":"Une entreprise possède des serveurs Windows sur site, des machines virtuelles dans un autre fournisseur cloud, et des ressources Azure, et souhaite les gérer, les étiqueter et appliquer des politiques de conformité depuis une interface Azure unique. Quel service Azure permet d\u0027étendre cette gestion aux ressources hors Azure ?","o":["Azure Arc","Azure Bastion","Azure ExpressRoute","Azure Site Recovery"],"e":"**Azure Arc** étend la gestion et la gouvernance Azure (y compris Azure Policy et les tags) aux serveurs et clusters situés en dehors d\u0027Azure, sur site ou chez d\u0027autres fournisseurs cloud."},{"n":37,"a":["B","C"],"q":"Une équipe souhaite définir l\u0027infrastructure Azure sous forme de fichiers texte versionnés, afin de pouvoir redéployer exactement le même environnement de façon fiable et répétée, sans configuration manuelle via le portail. Quels avantages offre l\u0027utilisation de modèles ARM ou Bicep dans ce contexte ?","o":["Ils imposent obligatoirement l\u0027utilisation exclusive du portail Azure","Les déploiements deviennent reproductibles et idempotents d\u0027un environnement à l\u0027autre","Le code d\u0027infrastructure peut être versionné et réutilisé comme n\u0027importe quel code applicatif","Ils ne peuvent être exécutés qu\u0027une seule fois, puis doivent être recréés entièrement"],"e":"Les modèles **ARM** et **Bicep** permettent de décrire l\u0027infrastructure sous forme de code, pour des déploiements reproductibles, idempotents et versionnables."},{"n":38,"a":["B"],"q":"En consultant son abonnement, un administrateur découvre des recommandations personnalisées suggérant de redimensionner certaines machines virtuelles sous-utilisées et d\u0027activer le chiffrement sur certains disques. Quel service Azure génère ce type de recommandations ?","o":["Azure Service Health","Azure Advisor","Log Analytics","Application Insights"],"e":"**Azure Advisor** analyse la configuration et l\u0027utilisation des ressources pour fournir des recommandations en matière de coûts, de sécurité, de fiabilité et de performance."},{"n":39,"a":["C"],"q":"Une machine virtuelle précise devient soudainement inaccessible, alors qu\u0027aucune panne générale n\u0027est annoncée sur les autres services Azure. Quel outil l\u0027administrateur doit-il consulter pour obtenir l\u0027état de santé spécifique à cette ressource, plutôt qu\u0027une vue globale de la plateforme ?","o":["Azure Service Health","Azure Status (page publique)","Azure Resource Health","Microsoft Purview"],"e":"**Azure Resource Health** fournit l\u0027état de santé d\u0027une ressource spécifique, tandis qu\u0027**Azure Service Health** couvre les incidents affectant la plateforme Azure dans son ensemble."},{"n":40,"a":["D"],"q":"Une équipe de développement veut suivre précisément les temps de réponse d\u0027une application web en production, détecter les exceptions et visualiser les transactions utilisateur de bout en bout. Quel composant d\u0027Azure Monitor est spécifiquement conçu pour la supervision applicative (APM) ?","o":["Log Analytics","Azure Advisor","Service Health","Application Insights"],"e":"**Application Insights** est le composant d\u0027Azure Monitor dédié à la supervision des performances applicatives (APM), incluant temps de réponse et suivi des exceptions."}]},{"id":9,"title":"Examen blanc 9 — Identité et conformité","questions":[{"n":1,"a":["A"],"q":"Comment peut-on définir le mieux le **cloud computing** ?","o":["La fourniture à la demande de ressources informatiques (calcul, stockage, réseau) via Internet, facturées selon l\u0027usage","L\u0027achat unique de serveurs physiques installés dans les locaux de l\u0027entreprise","Un logiciel de sauvegarde installé localement sur chaque poste de travail","Un contrat de maintenance annuel pour du matériel réseau"],"e":"Le **cloud computing** fournit des ressources IT à la demande via Internet, avec une facturation basée sur la consommation réelle."},{"n":2,"a":["B"],"q":"Dans le **modèle de responsabilité partagée**, qui reste toujours responsable de la sécurisation des données et des identités, quel que soit le modèle de service (IaaS, PaaS ou SaaS) utilisé ?","o":["Microsoft, en tant que fournisseur du cloud","Le client, quel que soit le service choisi","Un prestataire tiers indépendant","Aucune des deux parties, cette responsabilité n\u0027existe pas dans le cloud"],"e":"Le client conserve toujours la responsabilité de ses données, de ses identités et de la gestion des accès, même quand Microsoft gère l\u0027infrastructure sous-jacente."},{"n":3,"a":["C"],"q":"Une entreprise héberge son application de paie sur ses propres serveurs internes pour des raisons réglementaires strictes, tout en utilisant Azure pour son site web public. Quel **modèle de déploiement** cloud décrit cette situation ?","o":["Cloud privé","Cloud public","Cloud hybride","Cloud communautaire"],"e":"L\u0027utilisation combinée d\u0027une infrastructure sur site et de services cloud publics correspond au modèle **hybride**."},{"n":4,"a":["B"],"q":"Une entreprise qui migre vers Azure paie désormais ses ressources informatiques mensuellement selon leur consommation, au lieu d\u0027acheter du matériel. Elle passe d\u0027un modèle de dépenses ______ à un modèle ______.","o":["OpEx ; CapEx","CapEx ; OpEx","CapEx ; CapEx","OpEx ; OpEx"],"e":"L\u0027achat de matériel est une dépense d\u0027investissement (**CapEx**), alors que le paiement à l\u0027usage dans le cloud est une dépense opérationnelle (**OpEx**)."},{"n":5,"a":["A","B"],"q":"Parmi les affirmations suivantes sur le modèle tarifaire **pay-as-you-go** d\u0027Azure, lesquelles sont correctes ?","o":["Vous payez uniquement pour les ressources réellement consommées, sans investissement initial","Vous pouvez arrêter d\u0027utiliser un service à tout moment sans pénalité contractuelle de longue durée","Il impose un engagement obligatoire minimum de 3 ans","Le tarif est strictement identique pour tous les clients, quelle que soit la région"],"e":"Le modèle pay-as-you-go élimine l\u0027investissement initial et n\u0027impose aucun engagement de durée, contrairement aux instances réservées."},{"n":6,"a":["B"],"q":"Quelle caractéristique est propre à l\u0027informatique **serverless** (sans serveur) ?","o":["Le client doit provisionner et dimensionner manuellement les serveurs sous-jacents","Le fournisseur de cloud gère automatiquement l\u0027allocation des ressources et le client est facturé selon l\u0027exécution réelle du code","Les applications ne peuvent jamais être mises à l\u0027échelle automatiquement","Le code doit obligatoirement s\u0027exécuter en continu 24h/24"],"e":"Le modèle serverless (ex. **Azure Functions**) masque la gestion des serveurs et facture en fonction du temps d\u0027exécution réel."},{"n":7,"a":["A"],"q":"Que garantit un **SLA** (Service Level Agreement) Azure typique pour un service donné ?","o":["Un niveau contractuel de disponibilité, comme 99,9 %, avec des engagements de dédommagement en cas de non-respect","Que le service ne connaîtra jamais la moindre interruption","Un engagement de performance uniquement sur les coûts, pas sur la disponibilité","Une garantie de mise à jour gratuite de toutes les fonctionnalités"],"e":"Un SLA définit un engagement mesurable de disponibilité assorti de crédits de service en cas de non-respect, sans garantir une disponibilité absolue de 100 %."},{"n":8,"a":["B"],"q":"Un site e-commerce voit son trafic multiplié par 10 pendant les soldes, puis revenir à la normale ensuite, sans aucune intervention manuelle. Quelle propriété du cloud illustre le mieux ce comportement ?","o":["La scalabilité verticale uniquement","L\u0027élasticité","La redondance géographique","La virtualisation"],"e":"L\u0027**élasticité** désigne la capacité à augmenter ou réduire automatiquement les ressources selon la demande réelle."},{"n":9,"a":["A"],"q":"Dans le contexte Azure, que signifie la **prévisibilité** (predictability) d\u0027un service cloud ?","o":["La capacité à anticiper les performances et les coûts grâce à une mise à l\u0027échelle et une facturation cohérentes","La capacité à prédire les pannes matérielles avant qu\u0027elles ne surviennent","La garantie qu\u0027aucune mise à jour ne sera jamais appliquée","La capacité à deviner les besoins futurs des utilisateurs"],"e":"La prévisibilité recouvre à la fois la prévisibilité des performances (mise à l\u0027échelle) et celle des coûts (facturation cohérente)."},{"n":10,"a":["A"],"q":"Dans les concepts fondamentaux du cloud, à quoi sert la **gouvernance** ?","o":["À définir et faire respecter des règles, standards et contrôles sur l\u0027utilisation des ressources cloud au sein d\u0027une organisation","À augmenter uniquement la vitesse du réseau","À remplacer complètement le besoin d\u0027authentification","À garantir que tous les employés ont un accès administrateur global"],"e":"La gouvernance regroupe les règles et contrôles permettant d\u0027encadrer l\u0027usage des ressources cloud conformément aux politiques de l\u0027organisation."},{"n":11,"a":["B"],"q":"Une équipe de développeurs veut déployer rapidement une application web sans avoir à gérer ni les serveurs, ni le système d\u0027exploitation, ni les correctifs, tout en gardant le contrôle du code applicatif. Quel modèle de service correspond à ce besoin ?","o":["IaaS","PaaS","SaaS","On-premises"],"e":"Le **PaaS** (ex. Azure App Service) fournit une plateforme managée où seule l\u0027application reste sous la responsabilité du client."},{"n":12,"a":["A"],"q":"Une application critique doit rester disponible même en cas de panne totale d\u0027un datacenter, tout en conservant une latence réseau très faible entre ses composants, au sein d\u0027une même région Azure. Quelle fonctionnalité faut-il utiliser ?","o":["Les zones de disponibilité (Availability Zones)","Les paires de régions","Un seul datacenter avec redondance RAID","Un groupe de ressources supplémentaire"],"e":"Les **zones de disponibilité** sont des emplacements physiquement distincts au sein d\u0027une même région, offrant une tolérance aux pannes de datacenter avec une faible latence."},{"n":13,"a":["A"],"q":"Quel est l\u0027ordre correct, du plus large au plus spécifique, de la hiérarchie d\u0027organisation des ressources Azure ?","o":["Groupes d\u0027administration \u003e Abonnements \u003e Groupes de ressources \u003e Ressources","Ressources \u003e Groupes de ressources \u003e Abonnements \u003e Groupes d\u0027administration","Abonnements \u003e Groupes d\u0027administration \u003e Ressources \u003e Groupes de ressources","Groupes de ressources \u003e Groupes d\u0027administration \u003e Abonnements \u003e Ressources"],"e":"La hiérarchie Azure va des **groupes d\u0027administration**, aux **abonnements**, puis aux **groupes de ressources**, et enfin aux ressources individuelles."},{"n":14,"a":["A"],"q":"Une application web connaît des pics de trafic imprévisibles. Quel service Azure permet de créer et gérer automatiquement un nombre variable d\u0027instances de machines virtuelles identiques en fonction de la charge ?","o":["Azure Virtual Machine Scale Sets","Azure Container Instances","Azure Bastion","Azure Site Recovery"],"e":"Les **Virtual Machine Scale Sets** permettent de créer et d\u0027ajuster automatiquement un groupe de VM identiques selon la demande ou des règles définies."},{"n":15,"a":["B"],"q":"Une entreprise doit exécuter un grand nombre de microservices conteneurisés avec une orchestration avancée (auto-réparation, mise à l\u0027échelle fine, gestion complète du cycle de vie). Quel service Azure est le plus adapté ?","o":["Azure Container Instances (ACI)","Azure Kubernetes Service (AKS)","Azure Functions","Azure Virtual Desktop"],"e":"**AKS** fournit une orchestration Kubernetes complète adaptée aux architectures de microservices complexes, contrairement à ACI qui vise des conteneurs isolés et simples."},{"n":16,"a":["A"],"q":"Une équipe souhaite exécuter un court traitement déclenché uniquement lorsqu\u0027un fichier est déposé dans un conteneur de stockage, sans gérer d\u0027infrastructure, en ne payant que le temps d\u0027exécution réel. Quel service Azure correspond à ce besoin ?","o":["Azure Functions","Azure Virtual Machines","Azure Kubernetes Service","Azure ExpressRoute"],"e":"**Azure Functions** est un service serverless événementiel qui s\u0027exécute en réponse à un déclencheur et facture selon le temps d\u0027exécution réel."},{"n":17,"a":["C"],"q":"Une entreprise veut protéger ses données contre la panne complète d\u0027une région Azure tout en bénéficiant d\u0027une réplication synchrone entre zones de disponibilité dans la région primaire. Quelle option de redondance de stockage choisir ?","o":["LRS (Locally Redundant Storage)","ZRS (Zone-Redundant Storage)","GZRS (Geo-Zone-Redundant Storage)","Stockage local sans réplication"],"e":"**GZRS** combine la réplication synchrone entre zones dans la région primaire et la réplication asynchrone vers une région secondaire, offrant résilience zonale et géographique."},{"n":18,"a":["A","B"],"q":"Parmi les affirmations suivantes concernant **Azure ExpressRoute**, lesquelles sont exactes ?","o":["La connexion ne transite pas par l\u0027Internet public","Elle offre généralement une latence plus faible et plus prévisible qu\u0027une connexion VPN de site à site","Le trafic est automatiquement chiffré de bout en bout sans configuration supplémentaire","Elle ne peut relier qu\u0027un seul réseau virtuel Azure à la fois, sans possibilité d\u0027extension"],"e":"ExpressRoute fournit une connexion privée dédiée hors Internet public, avec une latence plus faible et prévisible ; elle ne chiffre pas nativement le trafic, contrairement à un VPN."},{"n":19,"a":["B"],"q":"Une entreprise doit migrer une application héritée nécessitant une authentification Kerberos et une jonction de domaine classique, sans vouloir gérer de contrôleurs de domaine Active Directory. Quel service Azure est le plus approprié ?","o":["Microsoft Entra ID","Microsoft Entra Domain Services","Azure Key Vault","Azure Bastion"],"e":"**Microsoft Entra Domain Services** fournit des services de domaine managés (Kerberos, NTLM, jonction de domaine) sans déployer de contrôleurs de domaine, contrairement à Entra ID basé sur des protocoles modernes comme OAuth/SAML."},{"n":20,"a":["B"],"q":"Un employé se connecte une seule fois le matin et accède ensuite à Microsoft 365, à une application SaaS tierce et à une application interne sans ressaisir ses identifiants. Quelle fonctionnalité d\u0027identité illustre ce comportement ?","o":["L\u0027authentification multifacteur (MFA)","L\u0027authentification unique (SSO - Single Sign-On)","L\u0027accès conditionnel","Le verrouillage de compte"],"e":"Le **SSO** permet à un utilisateur de s\u0027authentifier une seule fois pour accéder à plusieurs applications sans ressaisir ses identifiants."},{"n":21,"a":["A"],"q":"Un utilisateur saisit correctement son mot de passe, puis doit confirmer sa connexion via une notification sur son application mobile authentificatrice avant d\u0027accéder à son compte. Quel mécanisme de sécurité est illustré ici ?","o":["L\u0027authentification multifacteur (MFA)","L\u0027authentification sans mot de passe","Le contrôle d\u0027accès basé sur les rôles (RBAC)","La fédération d\u0027identité B2B"],"e":"La **MFA** exige au moins deux facteurs de preuve d\u0027identité, ici un mot de passe (ce que l\u0027on sait) et une confirmation mobile (ce que l\u0027on possède)."},{"n":22,"a":["A","B"],"q":"Parmi les méthodes suivantes, lesquelles sont considérées comme de l\u0027**authentification sans mot de passe** par Microsoft Entra ID ?","o":["Windows Hello Entreprise","Une clé de sécurité FIDO2","Un mot de passe à usage unique envoyé par SMS","Une question de sécurité personnelle"],"e":"Windows Hello Entreprise et les clés de sécurité FIDO2 permettent de s\u0027authentifier sans jamais saisir de mot de passe, contrairement au code SMS ou aux questions de sécurité."},{"n":23,"a":["A"],"q":"Une entreprise veut permettre à des employés d\u0027une organisation partenaire d\u0027accéder temporairement à certaines ressources internes avec leurs propres identifiants professionnels, sans créer de nouveaux comptes internes. Quelle fonctionnalité Microsoft Entra correspond à ce besoin ?","o":["Microsoft Entra B2B (collaboration externe)","Azure AD B2C","Microsoft Entra Domain Services","Azure Policy"],"e":"**Microsoft Entra B2B** permet d\u0027inviter des utilisateurs externes à accéder à des ressources avec leurs propres identifiants, alors qu\u0027Azure AD B2C cible les clients grand public pour des applications orientées consommateurs."},{"n":24,"a":["A"],"q":"Une organisation souhaite bloquer automatiquement les connexions à ses applications professionnelles lorsqu\u0027elles proviennent d\u0027un pays inhabituel ou d\u0027un appareil non conforme, tout en autorisant les connexions normales sans friction supplémentaire. Quelle fonctionnalité permet cela ?","o":["L\u0027accès conditionnel (Conditional Access)","Le chiffrement au repos","Les groupes de ressources","Les verrous de ressources"],"e":"L\u0027**accès conditionnel** applique des règles automatisées (localisation, conformité de l\u0027appareil, risque de connexion) pour autoriser, bloquer ou exiger une vérification supplémentaire."},{"n":25,"a":["A"],"q":"Un administrateur veut autoriser un membre de l\u0027équipe réseau à gérer uniquement les ressources réseau d\u0027un groupe de ressources spécifique, sans pouvoir modifier les machines virtuelles ni les bases de données qui s\u0027y trouvent. Quel mécanisme Azure permet ce contrôle précis ?","o":["Azure RBAC (contrôle d\u0027accès basé sur les rôles)","Microsoft Defender for Cloud","Azure Policy uniquement","Les groupes d\u0027administration uniquement"],"e":"**Azure RBAC** permet d\u0027attribuer des rôles avec des permissions précises sur un périmètre donné, comme un rôle limité aux ressources réseau d\u0027un groupe de ressources."},{"n":26,"a":["B"],"q":"Quel principe résume le mieux le modèle de sécurité **Confiance zéro** (Zero Trust) ?","o":["Faire confiance par défaut à tout appareil connecté au réseau interne de l\u0027entreprise","Vérifier explicitement chaque demande d\u0027accès, appliquer le moindre privilège et partir du principe qu\u0027une violation peut déjà avoir eu lieu","Supprimer toute authentification pour accélérer l\u0027accès aux ressources","N\u0027appliquer la sécurité qu\u0027au niveau du pare-feu périmétrique"],"e":"Le modèle Zero Trust repose sur la vérification explicite de chaque accès, le moindre privilège, et l\u0027hypothèse qu\u0027une brèche peut déjà exister, plutôt que de faire confiance au réseau interne."},{"n":27,"a":["A"],"q":"Une entreprise souhaite obtenir un score de sécurité global de son environnement Azure, détecter les vulnérabilités de ses ressources et recevoir des recommandations priorisées pour les corriger. Quel service utiliser ?","o":["Microsoft Defender for Cloud","Azure Advisor uniquement pour les coûts","Service Trust Portal","Azure Monitor Workbooks"],"e":"**Microsoft Defender for Cloud** évalue la posture de sécurité (score de sécurité), détecte les vulnérabilités et propose des recommandations de durcissement."},{"n":28,"a":["A"],"q":"Parmi les éléments suivants, lequel influence directement le coût final des ressources Azure utilisées ?","o":["La région géographique de déploiement, le type de ressource et la quantité consommée","Uniquement la couleur du thème choisi dans le portail Azure","Le nombre de favoris ajoutés dans le portail","Le nom donné au groupe de ressources"],"e":"Le coût dépend principalement du type et de la quantité de ressources consommées, ainsi que de la région de déploiement, entre autres facteurs."},{"n":29,"a":["B"],"q":"Une entreprise veut comparer le coût total de son infrastructure actuelle sur site (matériel, électricité, personnel inclus) avec le coût estimé d\u0027une migration complète vers Azure. Quel outil Microsoft est le plus adapté ?","o":["La calculatrice de prix Azure (Pricing Calculator)","La calculatrice TCO (Total Cost of Ownership)","Azure Advisor","Azure Monitor"],"e":"La **calculatrice TCO** compare les coûts globaux d\u0027une infrastructure on-premises à ceux d\u0027Azure, alors que la calculatrice de prix estime uniquement le coût des ressources Azure elles-mêmes."},{"n":30,"a":["A"],"q":"Une équipe financière veut être alertée automatiquement par e-mail dès qu\u0027un abonnement Azure dépasse 80 % d\u0027un montant mensuel défini. Quel outil Azure permet de configurer ce type de seuil ?","o":["Microsoft Cost Management (budgets et alertes)","Azure Policy","Microsoft Purview","Service Trust Portal"],"e":"**Microsoft Cost Management** permet de définir des budgets et de configurer des alertes automatiques lorsque les dépenses atteignent un certain pourcentage du budget."},{"n":31,"a":["A"],"q":"Une entreprise souhaite identifier précisément les coûts Azure générés par chaque département (marketing, R\u0026D, finance) dans ses rapports de facturation, sans créer d\u0027abonnements séparés. Quelle fonctionnalité Azure utiliser ?","o":["Les balises (tags)","Les zones de disponibilité","Les verrous de ressources","Le peering de réseaux virtuels"],"e":"Les **tags** (paires clé-valeur) permettent de catégoriser les ressources, par exemple par département, et de filtrer les rapports de coûts en conséquence."},{"n":32,"a":["A"],"q":"Une organisation veut cartographier automatiquement l\u0027ensemble de ses données sensibles (numéros de carte bancaire, données personnelles) réparties entre Azure, d\u0027autres clouds et des sources on-premises, et appliquer une classification cohérente. Quel service Microsoft est conçu pour cela ?","o":["Microsoft Purview","Azure Bastion","Azure Site Recovery","Azure Load Balancer"],"e":"**Microsoft Purview** offre une gouvernance unifiée des données, incluant la découverte, la classification et le catalogage des données sensibles à travers des environnements hybrides et multicloud."},{"n":33,"a":["A"],"q":"Une entreprise veut empêcher automatiquement la création de toute nouvelle ressource en dehors de deux régions Azure autorisées, et signaler les ressources existantes non conformes. Quel service permet d\u0027appliquer cette règle ?","o":["Azure Policy","Azure RBAC","Microsoft Defender for Cloud","Azure Monitor"],"e":"**Azure Policy** permet de définir des règles, comme les régions autorisées, évaluées et appliquées sur les ressources, avec signalement ou blocage des ressources non conformes."},{"n":34,"a":["A"],"q":"Un administrateur veut empêcher toute suppression accidentelle d\u0027un groupe de ressources critique en production, tout en continuant à permettre sa modification normale. Quel paramètre doit-il appliquer ?","o":["Un verrou de type CanNotDelete (ne pas supprimer)","Un verrou de type ReadOnly (lecture seule)","Une politique Azure interdisant tout accès","Une suppression du rôle Propriétaire pour tous les utilisateurs"],"e":"Le verrou **CanNotDelete** empêche la suppression de la ressource tout en autorisant les autres opérations de gestion, contrairement au verrou ReadOnly qui bloque aussi les modifications."},{"n":35,"a":["A"],"q":"Une entreprise soumise à des audits de conformité souhaite consulter les rapports d\u0027audit tiers et la documentation sur la conformité réglementaire des services Microsoft (ex. ISO 27001, RGPD). Où peut-elle les trouver ?","o":["Le Service Trust Portal","Azure Monitor","Azure Cloud Shell","Le portail Azure Advisor"],"e":"Le **Service Trust Portal** centralise les rapports d\u0027audit, certifications et informations de conformité relatifs aux services Microsoft."},{"n":36,"a":["A"],"q":"Un administrateur veut exécuter des commandes Azure CLI et PowerShell directement depuis son navigateur, sans rien installer localement, avec un stockage persistant pour ses scripts. Quel outil Azure utiliser ?","o":["Azure Cloud Shell","Azure Bastion","Azure Data Box","Azure Front Door"],"e":"**Azure Cloud Shell** est un environnement en ligne de commande accessible depuis le navigateur, prenant en charge Bash et PowerShell, avec un stockage persistant associé."},{"n":37,"a":["A"],"q":"Une entreprise possède des serveurs on-premises et des machines virtuelles dans un autre fournisseur cloud, et souhaite les gérer et leur appliquer des politiques de gouvernance depuis une interface Azure unique, comme s\u0027il s\u0027agissait de ressources Azure natives. Quel service permet cela ?","o":["Azure Arc","Azure ExpressRoute","Azure Front Door","Azure Data Factory"],"e":"**Azure Arc** étend la gestion Azure (gouvernance, politiques, surveillance) aux ressources situées en dehors d\u0027Azure, y compris on-premises et sur d\u0027autres clouds."},{"n":38,"a":["A"],"q":"Une équipe veut déployer de façon reproductible une infrastructure identique dans plusieurs environnements (développement, test, production), en décrivant l\u0027état souhaité des ressources dans un fichier plutôt qu\u0027en les créant manuellement. Quelle approche Azure correspond à ce besoin ?","o":["Les modèles ARM ou Bicep (Infrastructure as Code)","La connexion via Azure Bastion","La configuration manuelle via le portail Azure uniquement","L\u0027utilisation exclusive d\u0027Azure Advisor"],"e":"Les modèles **ARM** et **Bicep** permettent de décrire l\u0027infrastructure de façon déclarative et de la déployer de manière cohérente et reproductible."},{"n":39,"a":["A"],"q":"Après analyse de son environnement, un service Azure recommande de redimensionner une VM sous-utilisée, d\u0027activer la sauvegarde sur une ressource non protégée et d\u0027améliorer le score de sécurité global. Quel service fournit ces recommandations personnalisées ?","o":["Azure Advisor","Azure Status","Microsoft Purview","Azure DNS"],"e":"**Azure Advisor** analyse la configuration des ressources et propose des recommandations personnalisées sur les coûts, la sécurité, la fiabilité et les performances."},{"n":40,"a":["A","B"],"q":"Parmi les capacités suivantes, lesquelles sont fournies par la combinaison d\u0027**Azure Monitor** et d\u0027**Application Insights** pour une application web ?","o":["La collecte de métriques de performance et de journaux (logs) provenant des ressources Azure","Le suivi détaillé des requêtes, temps de réponse et exceptions au sein du code applicatif","Le chiffrement automatique de toutes les bases de données SQL","La création automatique de groupes d\u0027administration"],"e":"Azure Monitor collecte métriques et journaux au niveau de l\u0027infrastructure, tandis qu\u0027Application Insights, son extension APM, suit en détail le comportement du code applicatif."}]},{"id":10,"title":"Examen blanc 10 — Synthèse mixte (niveau examen)","questions":[{"n":1,"a":["A"],"q":"Quelle affirmation décrit le mieux le cloud computing ?","o":["La livraison à la demande de ressources informatiques (calcul, stockage, réseau) via internet, facturée à l\u0027usage","Un réseau privé isolé réservé exclusivement aux grandes entreprises","Un service de sauvegarde physique de données dans un seul centre de données local","Un contrat obligeant à acheter du matériel serveur à l\u0027avance pour 5 ans"],"e":"Le **cloud computing** désigne la livraison à la demande de ressources informatiques via internet avec une facturation basée sur la consommation réelle."},{"n":2,"a":["B"],"q":"Dans le modèle de responsabilité partagée, pour une machine virtuelle (IaaS), qui est responsable de l\u0027application des correctifs de sécurité du système d\u0027exploitation invité ?","o":["Microsoft, car Azure gère entièrement le système d\u0027exploitation invité","Le client, qui reste propriétaire de la gestion de l\u0027OS et des applications","Un tiers certifié obligatoirement désigné par Microsoft","Personne, les correctifs sont automatiques et gratuits pour tous les services cloud"],"e":"En **IaaS**, le client gère l\u0027OS, les correctifs et les applications, tandis que Microsoft gère l\u0027infrastructure physique sous-jacente."},{"n":3,"a":["C"],"q":"Une entreprise connecte son centre de données local à Azure pour garder certaines charges de travail sensibles sur site, tout en utilisant Azure pour d\u0027autres charges nécessitant de la scalabilité. Quel modèle de déploiement illustre ce scénario ?","o":["Cloud public","Cloud privé","Cloud hybride","Multicloud"],"e":"Le **cloud hybride** combine une infrastructure locale (privée) et le cloud public, reliés par une connectivité réseau."},{"n":4,"a":["B"],"q":"Qu\u0027est-ce qui caractérise une stratégie multicloud ?","o":["L\u0027utilisation exclusive d\u0027un seul fournisseur cloud pour simplifier la facturation","Le recours à plusieurs fournisseurs de cloud public, par exemple pour répartir les risques ou répondre à des exigences spécifiques","La fusion technique d\u0027Azure et d\u0027un centre de données local en une seule infrastructure","Un cloud accessible uniquement aux organismes gouvernementaux"],"e":"Le **multicloud** consiste à utiliser les services de plusieurs fournisseurs cloud publics différents au sein d\u0027une même organisation."},{"n":5,"a":["A"],"q":"Une entreprise remplace l\u0027achat de serveurs physiques par un abonnement Azure facturé selon l\u0027usage réel. Quel changement financier cela illustre-t-il ?","o":["Le passage d\u0027un modèle CapEx à un modèle OpEx","Le passage d\u0027un modèle OpEx à un modèle CapEx","Une augmentation des dépenses d\u0027investissement en capital","Une suppression totale de tous les coûts informatiques"],"e":"Le cloud transforme les dépenses d\u0027investissement (**CapEx**) en dépenses opérationnelles (**OpEx**), payées au fil de l\u0027usage."},{"n":6,"a":["B"],"q":"Quel est l\u0027un des principaux avantages économiques du modèle de tarification à la consommation d\u0027Azure ?","o":["Il impose un engagement minimal de dépense sur 3 ans","Il permet de payer uniquement les ressources réellement consommées, sans investissement initial important","Il facture un montant fixe identique chaque mois quel que soit l\u0027usage","Il nécessite l\u0027achat anticipé de licences matérielles"],"e":"Le modèle **à la consommation** permet de ne payer que ce qui est réellement utilisé, sans investissement initial lourd."},{"n":7,"a":["A"],"q":"Une entreprise a une charge de travail stable et prévisible, fonctionnant en continu toute l\u0027année. Quelle option tarifaire Azure lui permettrait généralement de réduire ses coûts par rapport au tarif standard à l\u0027usage ?","o":["Les instances réservées (Reservations)","Le tarif à la demande (pay-as-you-go) sans engagement","Le niveau de stockage Archive appliqué à des machines virtuelles","La facturation au prorata des licences Microsoft 365"],"e":"Les **instances réservées** offrent une remise importante en échange d\u0027un engagement de 1 ou 3 ans, adaptées aux charges prévisibles et continues."},{"n":8,"a":["B"],"q":"Qu\u0027est-ce qui définit une architecture informatique serverless (sans serveur) ?","o":["L\u0027absence totale de serveurs physiques dans le monde","Le fournisseur de cloud gère l\u0027infrastructure sous-jacente, et le code s\u0027exécute à la demande sans que le client gère de serveur","L\u0027obligation pour le client de provisionner manuellement chaque serveur avant chaque exécution","Un modèle réservé exclusivement aux bases de données relationnelles"],"e":"Le **serverless** masque la gestion des serveurs : le fournisseur provisionne et met à l\u0027échelle automatiquement l\u0027infrastructure nécessaire à l\u0027exécution du code."},{"n":9,"a":["A"],"q":"Un service Azure garantit une disponibilité (SLA) de 99,9 % sur un mois. Quelle est approximativement la durée maximale d\u0027indisponibilité tolérable sur ce mois tout en respectant ce SLA ?","o":["Environ 43 minutes","Environ 4,3 heures","Environ 7 heures","Environ 3 jours"],"e":"Un **SLA** de 99,9 % autorise environ 43 minutes d\u0027indisponibilité sur un mois de 30 jours (0,1 % de 43 200 minutes)."},{"n":10,"a":["A","C"],"q":"Parmi les affirmations suivantes concernant l\u0027élasticité dans Azure, lesquelles sont vraies ?","o":["Elle permet d\u0027ajouter automatiquement des ressources lors des pics de charge puis de les retirer ensuite","Elle est strictement identique à la scalabilité verticale, qui consiste à augmenter la taille d\u0027une seule machine","Elle vise à ajuster dynamiquement la capacité pour correspondre à la demande réelle, réduisant ainsi le gaspillage de ressources","Elle nécessite systématiquement une intervention manuelle d\u0027un administrateur pour chaque ajustement"],"e":"L\u0027**élasticité** ajoute ou retire automatiquement des ressources selon la demande réelle, contrairement à la scalabilité verticale qui est un concept distinct et souvent manuel."},{"n":11,"a":["B"],"q":"Quel terme décrit la capacité d\u0027un système cloud à continuer de fonctionner correctement et à se rétablir rapidement en cas de défaillance matérielle ou logicielle ?","o":["La gérabilité (manageability)","La fiabilité (reliability) et la résilience","La gouvernance","La confidentialité"],"e":"La **fiabilité** (ou résilience) désigne la capacité d\u0027un système à continuer de fonctionner et à se rétablir rapidement après une défaillance."},{"n":12,"a":["A"],"q":"Qu\u0027est-ce qu\u0027une paire de régions Azure (region pair) ?","o":["Deux régions Azure situées dans la même géographie et associées pour la réplication des données et la reprise après sinistre, avec des mises à jour planifiées de manière échelonnée","Deux data centers physiquement voisins dans le même bâtiment","Deux zones de disponibilité d\u0027une même région reliées par fibre optique","Un cloud souverain isolé, comme Azure opéré en Chine par 21Vianet, réservé à un seul pays"],"e":"Une **paire de régions** associe deux régions d\u0027une même géographie pour la réplication et la continuité d\u0027activité, avec des mises à jour Microsoft décalées entre elles."},{"n":13,"a":["A","B"],"q":"Parmi les affirmations suivantes sur les zones de disponibilité Azure, lesquelles sont vraies ?","o":["Chaque zone de disponibilité dispose de sa propre alimentation électrique, de son propre refroidissement et de son propre réseau","Les zones de disponibilité d\u0027une même région sont interconnectées par un réseau à faible latence et haut débit","Toutes les régions Azure proposent obligatoirement des zones de disponibilité","Une seule zone de disponibilité suffit à elle seule pour obtenir le SLA le plus élevé proposé par Azure"],"e":"Les **zones de disponibilité** sont des groupes de data centers indépendants (alimentation, refroidissement, réseau) reliés par un réseau rapide ; toutes les régions n\u0027en disposent pas, et le SLA le plus élevé exige une répartition sur plusieurs zones."},{"n":14,"a":["A"],"q":"Une organisation veut accorder à un groupe d\u0027employés uniquement le droit de gérer les ressources d\u0027un groupe de ressources spécifique, sans impact sur le reste de l\u0027abonnement. Quelle est l\u0027approche appropriée avec Azure RBAC ?","o":["Attribuer un rôle Azure RBAC directement au niveau du groupe de ressources concerné","Attribuer le rôle au niveau du groupe d\u0027administration racine pour simplifier la gestion","Créer un nouvel abonnement distinct pour chaque employé","Modifier les verrous de ressources (resource locks) du groupe de ressources"],"e":"Les rôles **Azure RBAC** peuvent être attribués au niveau du groupe de ressources, limitant l\u0027accès à ce périmètre précis selon le principe du moindre privilège."},{"n":15,"a":["B"],"q":"Une entreprise exploite une application web dont le trafic varie fortement et doit ajouter ou retirer automatiquement des instances de machines virtuelles identiques selon la charge. Quel service Azure est spécifiquement conçu pour cela ?","o":["Azure Virtual Desktop","Azure Virtual Machine Scale Sets","Azure Container Instances","Azure Bastion"],"e":"Les **Virtual Machine Scale Sets** permettent de créer et de mettre nché par des événements."},{"n":19,"a":["A"],"q":"Quel service Azure permet d\u0027exécuter du code déclenché par un événement, par exemple l\u0027ajout d\u0027un fichier, en ne payant que pour le temps d\u0027exécution réel ?","o":["Azure Functions","Azure App Service","Azure Virtual Machines","Azure Kubernetes Service"],"e":"**Azure Functions** est un service de calcul serverless facturé selon le temps d\u0027exécution et déclenché par des événements."},{"n":20,"a":["A"],"q":"Quel service Azure est principalement conçu pour héberger facilement des applications web et des API, avec mise à l\u0027échelle intégrée, sans gérer l\u0027infrastructure sous-jacente ?","o":["Azure App Service","Azure Data Box","Azure Bastion","Azure ExpressRoute"],"e":"**Azure App Service** est une plateforme PaaS entièrement gérée pour héberger des applications web, des API et des applications mobiles."},{"n":21,"a":["A"],"q":"Quel composant réseau Azure permet de connecter deux réseaux virtuels (VNets) afin qu\u0027ils communiquent comme s\u0027ils ne formaient qu\u0027un seul réseau, sans transiter par internet public ?","o":["Le peering de réseaux virtuels (VNet peering)","Azure DNS","Azure Load Balancer","Network Security Group"],"e":"Le **peering de VNets** relie deux réseaux virtuels via l\u0027infrastructure Microsoft, en privé, sans passer par internet."},{"n":22,"a":["B"],"q":"Quelle solution Azure permet d\u0027établir une connexion privée et dédiée, n\u0027empruntant pas le réseau internet public, entre un centre de données local et Azure, avec une bande passante élevée et une latence prévisible ?","o":["VPN Gateway de site à site","Azure ExpressRoute","Azure Peering Service public","Azure CDN"],"e":"**Azure ExpressRoute** fournit une connectivité privée dédiée hors internet public, contrairement à VPN Gateway qui chiffre le trafic via internet."},{"n":23,"a":["C"],"q":"Une entreprise doit conserver pendant 7 ans des archives réglementaires rarement consultées, au coût de stockage le plus bas possible, en acceptant un délai de récupération pouvant aller jusqu\u0027à plusieurs heures. Quel niveau d\u0027accès Blob Storage est le plus adapté ?","o":["Niveau Chaud (Hot)","Niveau Froid (Cool)","Niveau Archive","Niveau Premium"],"e":"Le niveau **Archive** offre le coût de stockage le plus bas pour des données rarement consultées, avec un temps de récupération pouvant atteindre plusieurs heures."},{"n":24,"a":["A","B"],"q":"Parmi les affirmations suivantes sur la redondance du stockage Azure, lesquelles sont exactes ?","o":["Le stockage localement redondant (LRS) conserve trois copies synchrones des données au sein d\u0027un seul data center","Le stockage géo-redondant (GRS) réplique de façon asynchrone les données vers une région secondaire appairée, en plus des copies locales","Le stockage à zone redondante (ZRS) ne réplique les données que dans un seul data center, sans tolérance de panne de zone","Le stockage géo-zone-redondant (GZRS) ne peut jamais offrir d\u0027accès en lecture sur la région secondaire"],"e":"**LRS** conserve trois copies dans un seul data center et **GRS** ajoute une réplication asynchrone vers une région appairée ; ZRS réplique en réalité sur trois zones, et GZRS peut proposer un accès en lecture (RA-GZRS)."},{"n":25,"a":["A"],"q":"Une entreprise doit synchroniser en continu de nouveaux fichiers entre un serveur de fichiers local et Azure Files, dans les deux sens. Quel outil Azure est spécifiquement conçu pour ce scénario de synchronisation continue ?","o":["Azure File Sync","Azure Data Box","AzCopy exécuté une seule fois","Azure Migrate"],"e":"**Azure File Sync** synchronise en continu des partages de fichiers locaux avec Azure Files, contrairement à Data Box qui est un transfert ponctuel hors ligne."},{"n":26,"a":["A"],"q":"Pour renforcer la sécurité des connexions sans obliger les utilisateurs à saisir un mot de passe, par exemple via une clé de sécurité FIDO2 ou l\u0027application Microsoft Authenticator en mode téléphone, comment appelle-t-on cette catégorie de méthodes d\u0027authentification Microsoft Entra ID ?","o":["L\u0027authentification sans mot de passe (passwordless)","L\u0027authentification unique (SSO)","L\u0027accès conditionnel","Les identités managées"],"e":"L\u0027**authentification sans mot de passe** remplace la saisie d\u0027un mot de passe par des méthodes comme une clé FIDO2 ou une notification Authenticator."},{"n":27,"a":["B"],"q":"Quel principe de sécurité consiste à ne jamais faire confiance implicitement à un utilisateur ou un appareil, même à l\u0027intérieur du réseau de l\u0027entreprise, et à vérifier explicitement chaque demande d\u0027accès ?","o":["La défense en profondeur (defense in depth)","Le modèle de confiance zéro (Zero Trust)","Microsoft Defender for Cloud","La gouvernance des coûts"],"e":"Le modèle **Zero Trust** repose sur la vérification explicite systématique et l\u0027absence de confiance implicite, même au sein du réseau interne."},{"n":28,"a":["B"],"q":"Parmi les facteurs suivants, lequel influence directement le coût des ressources Azure ?","o":["La couleur de l\u0027interface du portail Azure choisie par l\u0027utilisateur","Le type et la taille des ressources provisionnées, ainsi que la région et la durée d\u0027utilisation","Le nombre de favoris épinglés dans le tableau de bord Azure","Le nom attribué au groupe de ressources"],"e":"Le coût dépend notamment du **type** et de la **taille** des ressources, de la **région** de déploiement et de la durée d\u0027utilisation."},{"n":29,"a":["B"],"q":"Une entreprise veut comparer le coût total de son infrastructure locale actuelle (matériel, électricité, maintenance) avec le coût estimé d\u0027une migration vers Azure. Quel outil Microsoft est spécifiquement conçu pour cette comparaison ?","o":["La calculatrice de prix Azure (Pricing Calculator)","La calculatrice du coût total de possession (TCO Calculator)","Microsoft Cost Management","Azure Advisor"],"e":"La **calculatrice TCO** uelle fonctionnalité Azure répond précisément à ce besoin ?","o":["Un verrou de ressource de type CanNotDelete","Un verrou de ressource de type ReadOnly","Une stratégie Azure Policy en mode Audit uniquement","Un tag production appliqué à la ressource"],"e":"Le verrou **CanNotDelete** empêche la suppression tout en autorisant les modifications, contrairement au verrou ReadOnly qui bloquerait aussi les modifications."},{"n":34,"a":["A"],"q":"Quel service Microsoft aide une organisation à cartographier, cataloguer et classifier ses données réparties entre environnements locaux, multiclouds et SaaS, afin d\u0027améliorer leur gouvernance ?","o":["Microsoft Purview","Azure Monitor","Azure Service Health","Azure Bastion"],"e":"**Microsoft Purview** fournit un catalogue de données unifié pour découvrir, classifier et gouverner les données de l\u0027organisation."},{"n":35,"a":["A"],"q":"Une entreprise soumise à des exigences réglementaires strictes souhaite consulter les rapports d\u0027audit, certifications de conformité et documents relatifs à la confidentialité des données publiés par Microsoft pour Azure. Où peut-elle les trouver ?","o":["Le Service Trust Portal","Azure Advisor","Azure Monitor","Microsoft Cost Management"],"e":"Le **Service Trust Portal** centralise les rapports d\u0027audit, certifications et documents de conformité publiés par Microsoft."},{"n":36,"a":["A"],"q":"Une entreprise possède des serveurs VMware sur site et des machines virtuelles chez un autre fournisseur cloud. Elle souhaite les gérer avec les mêmes outils de gouvernance (Azure Policy, tags, surveillance) que ses ressources Azure natives. Quel service permet d\u0027étendre la gestion Azure à ces ressources externes ?","o":["Azure Arc","Azure Migrate","Azure Site Recovery","Azure ExpressRoute"],"e":"**Azure Arc** étend la gestion et la gouvernance Azure (policies, tags, surveillance) à des ressources situées hors Azure, y compris sur site ou chez d\u0027autres fournisseurs cloud."},{"n":37, const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function inline(s){
  return esc(s)
    .replace(/&lt;br\s*\/?&gt;/gi, "<br>")
    .replace(/&lt;(https?:\/\/[^\s&]+(?:&amp;[^\s&]+)*)&gt;/g, (m,u)=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(s){
  if(!s) return "";
  let out = "", inList = false;
  for(const raw of s.split("\n")){
    const l = raw.trim();
    const m = l.match(/^[-*]\s+(.*)/);
    if(m){ if(!inList){ out += "<ul>"; inList = true; } out += "<li>"+inline(m[1])+"</li>"; continue; }
    if(inList){ out += "</ul>"; inList = false; }
    if(l) out += "<p style='margin:.3rem 0'>"+inline(l)+"</p>";
  }
  return out + (inList ? "</ul>" : "");
}
